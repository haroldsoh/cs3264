   ran 95, so every figure here is an earlier estimate scaled by 0.62. If you add a
   slide, write what you actually expect to spend -- these numbers are now real
   minutes, not the optimistic ones. */
const EST=[0.6, 1.1, 0.2, 1.2, 1.6, 1.5, 1.4, 1.9, 0.2, 1.7, 0.9, 0.7, 0.9, 0.2, 1.4, 1.9, 1.6, 1.1, 1.0, 1.6, 1.4, 1.2, 1.6, 2.1, 0.9, 1.2, 0.2, 1.4, 1.6, 2.1, 2.5, 1.9, 1.5, 1.9, 0.7, 1.2, 0.2, 1.9, 1.0, 1.2, 2.1, 2.6, 2.1, 1.4, 1.5, 0.9, 1.2, 0.2, 1.5, 2.2, 1.9, 1.6, 2.6, 1.9, 1.7, 0.9, 1.2, 0.2, 2.0, 1.9, 1.9, 1.5, 2.2, 1.5, 1.6, 1.5, 1.0, 1.0, 0.6, 0.3];
const EST_TOTAL=EST.reduce((a,b)=>a+b,0);
const cumMin=i=>EST.slice(0,i+1).reduce((a,b)=>a+(b||0),0);

const canvas=document.getElementById('canvas');
let idx=0,fragStep=0;
canvas.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}</section>`).join('');
const slides=[...canvas.querySelectorAll('.slide')];

function fragsOf(i){
  const f=[...slides[i].querySelectorAll('.frag')];
  return {list:f,max:f.length?Math.max(...f.map(e=>+(e.dataset.f||0))):-1};
}
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  fragsOf(idx).list.forEach(e=>e.classList.toggle('on',(+(e.dataset.f||0))<fragStep));
  document.getElementById('progress').style.width=((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('pagenum').textContent=`${idx+1} / ${SLIDES.length}`;
  if(t0!==null) updClock();
  const d=SLIDES[idx].draw; if(d&&DRAW[d]) requestAnimationFrame(DRAW[d]);
  /* play video on the slide we just entered, pause and rewind everywhere else */
  slides.forEach((s,i)=>s.querySelectorAll('video').forEach(v=>{
    if(i===idx){ v.playbackRate=+(v.dataset.rate||1); v.play().catch(()=>{}); }
    else if(!v.paused||v.currentTime){ v.pause(); v.currentTime=0; }
  }));
  /* Leaving the slide has to REMOVE the iframe, not pause it: playback cannot be controlled
     across origins without pulling in the YouTube JS API, and an iframe left behind on a
     hidden slide keeps playing audio. */
  document.querySelectorAll('.ytwrap.live').forEach(w=>{
    if(+w.closest('.slide').dataset.i !== idx) closeYT(w);
  });
}
function leave(){ const s=slides[idx]; s.classList.add('leaving');
  setTimeout(()=>s.classList.remove('leaving'),160);
  /* Demos with a default choice reset on slide change, so a slide always opens on that
     choice rather than on whatever was clicked the last time through. Not on paint() --
     that also runs on every fragment step, which would undo a click mid-slide. */
  if(typeof resetDemos==='function') resetDemos(); }
function go(n){ if(n<0||n>=SLIDES.length)return; saveInk(); leave(); idx=n; fragStep=fragsOf(idx).max+1; paint(); loadInk(idx); }
function next(){ const {max}=fragsOf(idx);
  if(fragStep<=max){fragStep++;paint();}
  else if(idx<SLIDES.length-1){saveInk();leave();idx++;fragStep=0;paint();loadInk(idx);} }
function prev(){ if(fragStep>0){fragStep--;paint();}
  else if(idx>0){saveInk();leave();idx--;fragStep=fragsOf(idx).max+1;paint();loadInk(idx);} }

function fit(){ canvas.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)*.955})`; }
addEventListener('resize',fit); fit();

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  /* arrows belong to a focused slider, not to navigation */
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown') return;
    if(k==='d'||k==='t'||k==='o'||k==='b') return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  else if(k==='o')toggleOv(); else if(k==='t')cycleTheme();
  else if(k==='b')document.body.classList.toggle('blank');
  else if(k==='d'){e.preventDefault();toggleInk();}
  else if(k==='p'){e.preventDefault();toggleClock();}
  else if(k==='c'&&document.body.classList.contains('inking'))clearInk();
  else if(k==='e'&&document.body.classList.contains('inking'))setEraser(!erasing);
  else if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(e.key==='Escape')ov.classList.remove('on');
});

const ov=document.getElementById('overview');
ov.innerHTML=SLIDES.map((s,i)=>
  `<div class="thumb ${s.div?'divider-t':''}" data-i="${i}">
     ${s.s?`<div class="ts">${s.s}</div>`:''}<div class="tt">${s.t}</div><div class="tn">${i+1}</div></div>`).join('');
ov.addEventListener('click',e=>{const t=e.target.closest('.thumb');if(!t)return;go(+t.dataset.i);ov.classList.remove('on');});
function toggleOv(){ ov.classList.toggle('on');
  [...ov.children].forEach((c,i)=>c.classList.toggle('cur',i===idx));
  if(ov.classList.contains('on')) ov.children[idx]?.scrollIntoView({block:'center'}); }

const THEMES=['paper','academic','swiss','nocturne'];
function setTheme(t){ document.body.dataset.theme=t;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel',s.dataset.t===t));
  const d=SLIDES[idx].draw; if(d&&DRAW[d]) setTimeout(DRAW[d],520); }
function cycleTheme(){ setTheme(THEMES[(THEMES.indexOf(document.body.dataset.theme)+1)%THEMES.length]); }
document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>setTheme(s.dataset.t));

/* ---------- minimal Python syntax highlighting ---------- */
const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;
function highlight(){
  /* Placeholders are delimited by private-use code points and indexed with a
     LETTER, not a digit: a digit index would be re-matched by the number rule. */
  const OPEN='', CLOSE='';
  document.querySelectorAll('pre.code').forEach(function(pre){
    if(pre.dataset.hl) return; pre.dataset.hl='1';
    let h=pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const stash=[];
    const keep=function(html){ stash.push(html); return OPEN+String.fromCharCode(65+stash.length-1)+CLOSE; };
    h=h.replace(/#[^\n]*/g, function(m){ return keep('<span class="tok-com">'+m+'</span>'); });
    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    h=h.replace(/\b([A-Za-z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
    h=h.replace(new RegExp(OPEN+'([A-Z])'+CLOSE,'g'), function(_,c){ return stash[c.charCodeAt(0)-65]; });
    pre.innerHTML=h;
  });
}

/* ---------- upright delimiters in maths ----------
   Only letters are variables. Brackets, digits, operators and punctuation are
   set upright. Runs once over every .m span at load. */
/* Render every data-tex node. Re-runnable: demos that rewrite innerHTML call it again.
   Falls back to the raw LaTeX so a bad macro can never blank a slide. */
function renderTeX(){
  if(typeof katex==='undefined'){ setTimeout(renderTeX,40); return; }
  document.querySelectorAll('[data-tex]').forEach(function(el){
    if(el.dataset.done) return;
    try{ katex.render(el.dataset.tex, el,
      {displayMode: el.classList.contains('texd'), throwOnError:false, output:'html',
       /* \htmlClass lets an equation colour its own parts through CSS variables, so
          colour coding follows the theme instead of freezing to the paper palette. */
       trust: c => c.command === '\\htmlClass', strict: false}); }
    catch(e){ el.textContent=el.dataset.tex; }
    el.dataset.done='1';
  });
}
addEventListener('load', renderTeX);

/* ============================================================
   LECTURE 2 DEMOS
   Same conventions as Lecture 1: each draw function rebuilds the innerHTML of one
   SVG, and paint() calls it through the DRAW registry when its slide is entered.
   ============================================================ */
const NPDF=(x,m,s2)=>Math.exp(-(x-m)*(x-m)/(2*s2))/Math.sqrt(2*Math.PI*s2);
const LPDF=(x,m,b)=>Math.exp(-Math.abs(x-m)/b)/(2*b);
function lin(a,b,n){const o=[];for(let i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o;}
function pathOf(pts){return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');}
/* Gauss-Jordan inverse — small matrices only, which is all we need here. */
function inv(A){
  const n=A.length, M=A.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    const t=M[c];M[c]=M[p];M[p]=t;
    const d=M[c][c]||1e-12;
    for(let j=0;j<2*n;j++) M[c][j]/=d;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c];
      if(!f) continue; for(let j=0;j<2*n;j++) M[r][j]-=f*M[c][j]; }
  }
  return M.map(r=>r.slice(n));
}
const matvec=(A,v)=>A.map(r=>r.reduce((s,a,i)=>s+a*v[i],0));
/* Deterministic pseudo-randomness: a demo that rerolls on every repaint is unusable in
   front of a room, so every draw is seeded. */
function lcg(seed){ let x=seed>>>0; return function(){ x=(x*1664525+1013904223)>>>0; return (x>>>8)/16777216; }; }
function gauss(r){ let u=0,v=0; while(u===0)u=r(); while(v===0)v=r();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
/* Cholesky: lower-triangular L with L L^T = A, for sampling a multivariate Gaussian. */
function chol(A){
  const n=A.length, L=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<=i;j++){
    let sum=A[i][j];
    for(let k=0;k<j;k++) sum-=L[i][k]*L[j][k];
    if(i===j) L[i][j]=Math.sqrt(Math.max(sum,1e-12));
    else      L[i][j]=sum/(L[j][j]||1e-12);
  }
  return L;
}

/* ---------------------------------------------------------------- the used car */
function drawCar(){
  const g=document.getElementById('carfig'); if(!g) return;
  const W=460,H=320,ML=34,MR=14,MT=14,MB=44;
  const X=v=>ML+(W-ML-MR)*(v-6)/(24-6);          /* $k */
  const top=H-MB;
  let s='';
  s+='<line x1="'+ML+'" y1="'+top+'" x2="'+(W-MR)+'" y2="'+top+'" class="axis"/>';
  [8,12,16,20,24].forEach(v=>{ s+='<text class="tick" x="'+X(v)+'" y="'+(top+18)+'" text-anchor="middle">$'+v+'k</text>'; });
  const draw=(sd,col,y0,hgt,lab)=>{
    const pts=lin(6,24,140).map(v=>[X(v), y0+hgt-hgt*NPDF(v,14.2,sd*sd)/NPDF(14.2,14.2,sd*sd)]);
    let p='<path d="'+pathOf(pts)+' L'+X(24)+' '+(y0+hgt)+' L'+X(6)+' '+(y0+hgt)+' Z" fill="'+col+'" opacity=".16"/>';
    p+='<path d="'+pathOf(pts)+'" fill="none" stroke="'+col+'" stroke-width="2.2"/>';
    p+='<line x1="'+X(14.2)+'" y1="'+y0+'" x2="'+X(14.2)+'" y2="'+(y0+hgt)+'" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="3 3"/>';
    p+='<line x1="'+X(15)+'" y1="'+(y0-4)+'" x2="'+X(15)+'" y2="'+(y0+hgt)+'" stroke="var(--ink)" stroke-width="1.6"/>';
    p+='<text class="legend" x="'+ML+'" y="'+(y0+11)+'">'+lab+'</text>';
    return p; };
  s+=draw(0.3,'var(--accent2)',30,92,'narrow spread — $15k is unusual');
  s+=draw(4.0,'var(--accent)',158,92,'wide spread — $15k is ordinary');
  s+='<text class="legend" x="'+(X(15)+6)+'" y="24">seller asks $15k</text>';
  g.innerHTML=s;
}

/* ---------------------------------------------------------------- the Gaussian */
let G_MU=0, G_S2=1;
function drawGauss(){
  const svg=document.getElementById('gsvg'); if(!svg) return;
  const W=560,H=300,ML=44,MR=16,MT=16,MB=40;
  const X=v=>ML+(W-ML-MR)*(v+6)/12, Y=p=>H-MB-(H-MT-MB)*p/0.62;
  let s='';
  for(let p=0;p<=0.6;p+=0.2){ s+='<line class="gridline" x1="'+ML+'" y1="'+Y(p)+'" x2="'+(W-MR)+'" y2="'+Y(p)+'"/>'
    + '<text class="tick" x="'+(ML-8)+'" y="'+(Y(p)+4)+'" text-anchor="end">'+p.toFixed(1)+'</text>'; }
  for(let v=-6;v<=6;v+=2){ s+='<text class="tick" x="'+X(v)+'" y="'+(H-MB+18)+'" text-anchor="middle">'+v+'</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  const pts=lin(-6,6,240).map(v=>[X(v),Y(NPDF(v,G_MU,G_S2))]);
  s+='<path d="'+pathOf(pts)+' L'+X(6)+' '+Y(0)+' L'+X(-6)+' '+Y(0)+' Z" fill="var(--accent)" opacity=".13"/>';
  s+='<path d="'+pathOf(pts)+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  /* mean and one standard deviation */
  const sd=Math.sqrt(G_S2);
  s+='<line x1="'+X(G_MU)+'" y1="'+Y(0)+'" x2="'+X(G_MU)+'" y2="'+Y(NPDF(G_MU,G_MU,G_S2))+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3"/>';
  s+='<text class="legend" x="'+(X(G_MU)+6)+'" y="'+(Y(NPDF(G_MU,G_MU,G_S2))+14)+'">&#956;</text>';
  const yh=Y(NPDF(G_MU+sd,G_MU,G_S2));
  s+='<line x1="'+X(G_MU-sd)+'" y1="'+yh+'" x2="'+X(G_MU+sd)+'" y2="'+yh+'" stroke="var(--accent2)" stroke-width="2"/>';
  s+='<text class="legend" x="'+X(G_MU+sd)+'" y="'+(yh-7)+'" text-anchor="middle" fill="var(--accent2)">&#177;&#963;</text>';
  svg.innerHTML=s;
}

/* ---------------------------------------------------------------- densities as likelihoods
   Interactive rather than three fixed panels: slide mu and watch the likelihood rise and
   fall. The peak is the MLE, found by eye before it is found by calculus. */
const LIK_T=[-1.1,-0.4,0.2,0.6,1.4];
let LIK_MU=-1.6;
const likL=m=>LIK_T.reduce((p,t)=>p*NPDF(t,m,1),1);
function drawLik(){
  const g=document.getElementById('likfig'); if(!g) return;
  const W=470,H=300,ML=44,MR=16;
  const X=v=>ML+(W-ML-MR)*(v+4)/8;
  let s='';
  /* upper panel: the density sitting over the data */
  const y0=22,hgt=100;
  const pts=lin(-4,4,220).map(v=>[X(v), y0+hgt-hgt*NPDF(v,LIK_MU,1)/NPDF(0,0,1)]);
  s+='<path d="'+pathOf(pts)+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  LIK_T.forEach(t=>{ const p=NPDF(t,LIK_MU,1), py=y0+hgt-hgt*p/NPDF(0,0,1);
    s+='<line x1="'+X(t)+'" y1="'+(y0+hgt)+'" x2="'+X(t)+'" y2="'+py+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="2 3" opacity=".75"/>';
    s+='<circle cx="'+X(t)+'" cy="'+py+'" r="4" fill="var(--accent)"/>';
    s+='<circle cx="'+X(t)+'" cy="'+(y0+hgt)+'" r="3.4" fill="var(--ink)"/>'; });
  s+='<line x1="'+ML+'" y1="'+(y0+hgt)+'" x2="'+(W-MR)+'" y2="'+(y0+hgt)+'" class="axis"/>';
  s+='<line x1="'+X(LIK_MU)+'" y1="'+y0+'" x2="'+X(LIK_MU)+'" y2="'+(y0+hgt)+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4" opacity=".8"/>';
  s+='<text class="legend" x="'+ML+'" y="'+(y0-8)+'">the five observations, and a Gaussian centred at &#956;</text>';
  /* lower panel: likelihood as mu moves */
  const ly=178, lh=88, MUS=lin(-4,4,200);
  const peak=Math.max.apply(null,MUS.map(likL));
  const lp=MUS.map(m=>[X(m), ly+lh-lh*likL(m)/peak]);
  s+='<path d="'+pathOf(lp)+'" fill="none" stroke="var(--accent2)" stroke-width="2.6"/>';
  s+='<line x1="'+ML+'" y1="'+(ly+lh)+'" x2="'+(W-MR)+'" y2="'+(ly+lh)+'" class="axis"/>';
  const cy=ly+lh-lh*likL(LIK_MU)/peak;
  s+='<line x1="'+X(LIK_MU)+'" y1="'+cy+'" x2="'+X(LIK_MU)+'" y2="'+(ly+lh)+'" stroke="var(--accent2)" stroke-width="1.4" stroke-dasharray="5 4"/>';
  s+='<circle cx="'+X(LIK_MU)+'" cy="'+cy+'" r="5.5" fill="var(--accent2)"/>';
  s+='<text class="legend" x="'+ML+'" y="'+(ly-8)+'">likelihood, as a function of &#956;</text>';
  [-4,-2,0,2,4].forEach(v=>s+='<text class="tick" x="'+X(v)+'" y="'+(ly+lh+18)+'" text-anchor="middle">'+v+'</text>');
  g.innerHTML=s;
  const L=likL(LIK_MU);
  const mant=L.toExponential(1).split('e')[0], ex=L.toExponential(1).split('e')[1];
  const el=document.getElementById('likval');
  if(el) el.innerHTML=mant+'&#215;10<sup>'+ex+'</sup>';
  const lg=document.getElementById('liklog'); if(lg) lg.textContent=Math.log(L).toFixed(1);
  const mu=document.getElementById('likmuv'); if(mu) mu.textContent=LIK_MU.toFixed(2);
  const best=LIK_T.reduce((a,b)=>a+b,0)/LIK_T.length;
  const wn=document.getElementById('likwarn');
  if(wn) wn.innerHTML = Math.abs(LIK_MU-best)<0.06
    ? 'That is the peak &#8212; and it sits exactly at the <strong>sample mean</strong>, '+best.toFixed(2)+'. Maximum likelihood will land here by calculus in a moment.'
    : 'Move &#956; until the lower curve peaks. Every observation contributes a factor, so points far from &#956; drag the product down fast.';
}

/* ---------------------------------------------------------------- noise choice -> loss */
let NOISE='gauss';
function drawNoise(){
  const svg=document.getElementById('nsvg'); if(!svg) return;
  const W=560,H=236,ML=44,MR=14,MT=18,MB=32, half=(W-ML-MR-52)/2;
  /* Matched variance, so the comparison is fair: Laplace with b = 1/sqrt(2) also has
     variance 1. They cross at |x| = 0.49 and again at |x| = 2.34; past the second
     crossing the Laplace tail is the heavier one, which is the whole point and is
     invisible on a linear axis. */
  const b=1/Math.SQRT2, R=6;
  const lgG=v=>-v*v/2 - 0.5*Math.log(2*Math.PI);
  const lgL=v=>-Math.abs(v)/b - Math.log(2*b);
  const sel=NOISE;
  let g='';
  /* ---- left: the densities, linear ---- */
  (function(){
    const x0=ML, X=v=>x0+half*(v+R)/(2*R), Y=p=>H-MB-(H-MT-MB)*p/0.75;
    g+='<text class="legend" x="'+(x0+half/2)+'" y="'+(MT+2)+'" text-anchor="middle">density  p(&#949;)</text>';
    g+='<line class="axis" x1="'+x0+'" y1="'+(H-MB)+'" x2="'+(x0+half)+'" y2="'+(H-MB)+'"/>';
    [[lgG,'var(--accent2)',sel==='gauss',false],[lgL,'var(--accent)',sel==='laplace',true]].forEach(([f,c,on,dash])=>{
      const pts=lin(-R,R,300).map(v=>[X(v),Y(Math.exp(f(v)))]);
      g+='<path d="'+pathOf(pts)+'" fill="none" stroke="'+c+'" stroke-width="'+(on?2.8:1.5)+'"'
       + ' opacity="'+(on?1:.42)+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; });
    [-5,0,5].forEach(v=>g+='<text class="tick" x="'+X(v)+'" y="'+(H-MB+16)+'" text-anchor="middle">'+v+'</text>');
  })();
  /* ---- right: log density, where the tails separate ---- */
  (function(){
    const x0=ML+half+52, X=v=>x0+half*(v+R)/(2*R);
    const LO=-20, HI=0, Y=l=>MT+14+(H-MT-MB-14)*(HI-l)/(HI-LO);
    g+='<text class="legend" x="'+(x0+half/2)+'" y="'+(MT+2)+'" text-anchor="middle">log p(&#949;)   &#8212;   the loss, negated</text>';
    for(let l=0;l>=-20;l-=5){
      g+='<line class="gridline" x1="'+x0+'" y1="'+Y(l)+'" x2="'+(x0+half)+'" y2="'+Y(l)+'"/>'
       + '<text class="tick" x="'+(x0-6)+'" y="'+(Y(l)+4)+'" text-anchor="end">'+l+'</text>'; }
    [[lgG,'var(--accent2)',sel==='gauss',false],[lgL,'var(--accent)',sel==='laplace',true]].forEach(([f,c,on,dash])=>{
      const pts=lin(-R,R,300).map(v=>[X(v),Y(Math.max(f(v),LO))]);
      g+='<path d="'+pathOf(pts)+'" fill="none" stroke="'+c+'" stroke-width="'+(on?2.8:1.7)+'"'
       + ' opacity="'+(on?1:.5)+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; });
    /* Mark the outer crossing and the gap past it. The label goes in the empty wedge
       under the peak — anywhere near the crossing itself lands on top of a curve. */
    [-2.34,2.34].forEach(c=>{
      g+='<line x1="'+X(c)+'" y1="'+Y(lgG(c))+'" x2="'+X(c)+'" y2="'+Y(LO)+'" stroke="var(--ink-soft)"'
       + ' stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>'
       + '<circle cx="'+X(c)+'" cy="'+Y(lgG(c))+'" r="3.6" fill="var(--ink)"/>'; });
    g+='<text class="legend" x="'+X(0)+'" y="'+Y(-15.2)+'" text-anchor="middle">they cross at &#177;2.34</text>';
    const xg=5.2, yG=Y(lgG(xg)), yL=Y(lgL(xg));
    g+='<line x1="'+X(xg)+'" y1="'+yL+'" x2="'+X(xg)+'" y2="'+yG+'" stroke="var(--accent)" stroke-width="1.4"/>'
     + '<text class="legend" x="'+(X(xg)-10)+'" y="'+((yL+yG)/2)+'" text-anchor="end" fill="var(--accent)">&#8776;400&#215; more likely</text>';
    [-5,0,5].forEach(v=>g+='<text class="tick" x="'+X(v)+'" y="'+(H-MB+16)+'" text-anchor="middle">'+v+'</text>');
  })();
  g+='<g transform="translate('+(ML+4)+','+(H-4)+')">'
   + '<line x1="0" y1="-4" x2="20" y2="-4" stroke="var(--accent2)" stroke-width="2.6"/>'
   + '<text class="legend" x="27" y="0">Gaussian</text>'
   + '<line x1="104" y1="-4" x2="124" y2="-4" stroke="var(--accent)" stroke-width="2.6" stroke-dasharray="5 4"/>'
   + '<text class="legend" x="131" y="0">Laplace &#8212; same variance</text></g>';
  svg.innerHTML=g;
  const L=document.getElementById('nloss'), wn=document.getElementById('nwarn');
  if(sel==='gauss'){
    L.innerHTML='&#189;&#8721;(t&#8722;y)&#178;';
    wn.innerHTML='On the log axis the Gaussian is a <strong>parabola</strong> &#8212; so the loss grows quadratically, and beyond &#177;2.34 it falls below the Laplace. A far-out residual is very surprising, and one outlier can dominate the fit.';
  }else{
    L.innerHTML='&#8721;|t&#8722;y|';
    wn.innerHTML='The Laplace is a <strong>straight V</strong> on the log axis &#8212; the loss grows only linearly. Past &#177;2.34 it sits above the Gaussian: the same large residual is far less surprising, so the fit is robust to outliers.';
  }
  document.querySelectorAll('[data-noise]').forEach(x=>x.classList.toggle('sel',x.dataset.noise===sel));
}

/* ---------------------------------------------------------------- Bayesian coin flip */
const COIN=[0,0.2,0.8,1.0];
let CPOST=[0.25,0.25,0.25,0.25], CH=0, CT=0;
function drawCoin(){
  const svg=document.getElementById('csvg'); if(!svg) return;
  const W=560,H=300,ML=52,MR=16,MT=26,MB=46;
  const bw=(W-ML-MR)/COIN.length;
  let s='<text class="legend" x="'+ML+'" y="'+(MT-8)+'">posterior belief over &#952;</text>';
  for(let p=0;p<=1.001;p+=0.25){ const y=H-MB-(H-MT-MB)*p;
    s+='<line class="gridline" x1="'+ML+'" y1="'+y+'" x2="'+(W-MR)+'" y2="'+y+'"/>'
     + '<text class="tick" x="'+(ML-8)+'" y="'+(y+4)+'" text-anchor="end">'+(p*100).toFixed(0)+'%</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  const top=Math.max.apply(null,CPOST);
  COIN.forEach((th,i)=>{
    const h=(H-MT-MB)*CPOST[i], x=ML+i*bw+bw*0.22, w=bw*0.56;
    const hot=CPOST[i]>=top-1e-9;
    s+='<rect x="'+x+'" y="'+(H-MB-h)+'" width="'+w+'" height="'+h+'" rx="4" fill="'+(hot?'var(--accent)':'var(--ink-soft)')+'" opacity="'+(hot?1:.55)+'"/>';
    s+='<text class="tick" x="'+(x+w/2)+'" y="'+(H-MB+18)+'" text-anchor="middle">&#952; = '+th+'</text>';
    s+='<text class="legend" x="'+(x+w/2)+'" y="'+(H-MB-h-7)+'" text-anchor="middle">'+(CPOST[i]*100).toFixed(1)+'%</text>';
  });
  svg.innerHTML=s;
  const n=CH+CT;
  document.getElementById('cobs').textContent = n? (CH+'H '+CT+'T') : '—';
  const mle = n? (CH/n).toFixed(2) : '—';
  document.getElementById('cmle').textContent = mle;
  const wn=document.getElementById('cwarn');
  if(n===0) wn.innerHTML='Flip a few times. Watch what maximum likelihood says after the very first flip.';
  else if(n===1) wn.innerHTML='MLE already commits to <strong>'+mle+'</strong> on one observation. The posterior still keeps every possibility open &#8212; that is the prior doing its job.';
  else if(CH===n) wn.innerHTML='All heads so far. MLE says &#952; = 1.00; the posterior still gives &#952; = 0.8 real weight, because it has only seen '+n+' flips.';
  else if(CT===n) wn.innerHTML='All tails. Same story in reverse.';
  else wn.innerHTML='With both outcomes seen, &#952; = 0 and &#952; = 1 are ruled out entirely &#8212; their likelihood is exactly zero, so no amount of prior can revive them.';
}
function coinFlip(head){
  CPOST=CPOST.map((p,i)=>p*(head?COIN[i]:1-COIN[i]));
  const z=CPOST.reduce((a,b)=>a+b,0);
  CPOST = z>0 ? CPOST.map(p=>p/z) : [0.25,0.25,0.25,0.25];
  if(head) CH++; else CT++;
  drawCoin();
}

/* ---------------------------------------------------------------- MLE / MAP / posterior */
let BMODE='mle', BN=6;
const B_ALL_X=[0.04,0.13,0.21,0.30,0.38,0.47,0.55,0.63,0.72,0.80,0.88,0.94,0.09,0.17,0.26,0.34,0.43,0.51,0.60,0.68,0.76,0.85,0.92,0.98,0.11];
const B_TRUE=x=>Math.sin(2*Math.PI*x);
const B_NOISE=[0.19,-0.21,0.08,-0.14,0.24,-0.09,0.17,-0.26,0.05,0.21,-0.18,0.10,-0.23,0.13,0.06,-0.11,0.20,-0.07,0.15,-0.19,0.09,0.23,-0.12,0.04,-0.16];
const B_M=8, B_ALPHA=2.0, B_BETA=25.0;
const bPhi=x=>{const o=[1];for(let j=1;j<B_M;j++){const mu=(j-1)/(B_M-2);o.push(Math.exp(-Math.pow(x-mu,2)/(2*0.09)));}return o;};
function drawBayes(){
  const svg=document.getElementById('bsvg'); if(!svg) return;
  const W=560,H=300,ML=42,MR=16,MT=16,MB=38;
  const X=x=>ML+(W-ML-MR)*x, Y=t=>MT+(H-MT-MB)*(1.9-t)/3.8;
  const xs=B_ALL_X.slice(0,BN), ts=xs.map((x,i)=>B_TRUE(x)+B_NOISE[i]);
  const PH=xs.map(bPhi);
  let A=Array.from({length:B_M},(_,i)=>Array.from({length:B_M},(_,j)=>
      (BMODE==='mle'?0:B_ALPHA)*(i===j?1:0) + B_BETA*PH.reduce((s,p)=>s+p[i]*p[j],0)));
  if(BMODE==='mle') for(let i=0;i<B_M;i++) A[i][i]+=1e-6;      /* keep it invertible */
  const SN=inv(A);
  const rhs=Array.from({length:B_M},(_,i)=>B_BETA*PH.reduce((s,p,n)=>s+p[i]*ts[n],0));
  const mN=matvec(SN,rhs);
  let s='';
  for(let t=-1.5;t<=1.51;t+=0.75){ s+='<line class="gridline" x1="'+ML+'" y1="'+Y(t)+'" x2="'+(W-MR)+'" y2="'+Y(t)+'"/>'
    + '<text class="tick" x="'+(ML-8)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t.toFixed(1)+'</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  const grid=lin(0,1,120);
  /* the truth, for reference */
  s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(B_TRUE(x))]))+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="5 4" opacity=".75"/>';
  if(BMODE==='post'){
    const up=[],dn=[];
    grid.forEach(x=>{ const p=bPhi(x), m=dot(mN,p);
      const v=1/B_BETA + dot(p,matvec(SN,p)), sd=Math.sqrt(v);
      up.push([X(x),Y(m+2*sd)]); dn.push([X(x),Y(m-2*sd)]); });
    s+='<path d="'+pathOf(up)+' L'+dn.slice().reverse().map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z" fill="var(--accent)" opacity=".15"/>';
  }
  s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(dot(mN,bPhi(x)))]))+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  xs.forEach((x,i)=>{ s+='<circle class="datapt" cx="'+X(x)+'" cy="'+Y(ts[i])+'" r="4.6"/>'; });
  s+='<g transform="translate('+(W-172)+','+(MT+4)+')">'
   + '<line x1="0" y1="0" x2="22" y2="0" stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="5 4"/>'
   + '<text class="legend" x="29" y="4">truth</text></g>';
  svg.innerHTML=s;
  document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('sel',b.dataset.b===BMODE));
  const wn=document.getElementById('bwarn');
  if(BMODE==='mle') wn.innerHTML='No prior. With few points the curve does whatever it likes between them &#8212; and says nothing about how sure it is.';
  else if(BMODE==='map') wn.innerHTML='The prior pulls the weights toward zero, so the curve is calmer. Still a single line: <strong>no error bars</strong>.';
  else wn.innerHTML='The full posterior. The band is &#177;2 standard deviations &#8212; note it <strong>widens where there is no data</strong>, which is what MAP threw away.';
}

/* ---------------------------------------------------------------- base rates */
function drawMed(){
  const g=document.getElementById('medfig'); if(!g) return;
  /* 10,000 people at 100 per dot: 100 dots. 1 ill in 100 -> 1 dot ill. Too coarse.
     Use 1 dot = 50 people: 200 dots, 2 ill. Still coarse. So: one dot = 25 people,
     400 dots, 4 ill — enough to see the two positive groups are the same size. */
  const COLS=25, ROWS=16, N=COLS*ROWS, PER=10000/N;
  const nIll=Math.round(100/PER);                  /* 1% are ill */
  const cell=17.5, x0=14, y0=16;
  let s='';
  for(let i=0;i<N;i++){
    const cx=x0+(i%COLS)*cell+cell/2, cy=y0+Math.floor(i/COLS)*cell+cell/2;
    const ill = i<nIll;
    /* positives: 99% of the ill, and 1% of the well */
    const posIll  = ill && i<Math.round(nIll*0.99);
    const posWell = !ill && (i-nIll) < Math.round((N-nIll)*0.01);
    const pos = posIll||posWell;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(pos?5.4:4)+'"'
     + ' fill="'+(ill?'var(--accent2)':'var(--rule)')+'"'
     + (pos?' stroke="var(--accent)" stroke-width="2"':'')+'/>';
  }
  const yl=y0+ROWS*cell+22;
  s+='<circle cx="22" cy="'+(yl-4)+'" r="5" fill="var(--accent2)"/>'
   + '<text class="legend" x="33" y="'+yl+'">ill (1%)</text>'
   + '<circle cx="120" cy="'+(yl-4)+'" r="5.4" fill="var(--rule)" stroke="var(--accent)" stroke-width="2"/>'
   + '<text class="legend" x="132" y="'+yl+'">well, but tested positive</text>'
   + '<circle cx="330" cy="'+(yl-4)+'" r="5.4" fill="var(--accent2)" stroke="var(--accent)" stroke-width="2"/>'
   + '<text class="legend" x="342" y="'+yl+'">ill and positive</text>';
  g.innerHTML=s;
}

/* ---------------------------------------------------------------- averaging over weights
   The integral in the posterior predictive is hard to picture, so make it finite: draw K
   weight vectors from the posterior, plot each one's line, then average. K=1 is a point
   estimate; K large approaches the integral. This is also, literally, an ensemble. */
let ENS_K=1, ENS_SHOW=false;
function ensSamples(K){
  /* fixed seed: the same K lines every time, so the slider reads as "add more members"
     rather than "reroll everything" */
  const r=lcg(31337);
  const xs=B_ALL_X.slice(0,9), ts=xs.map((x,i)=>B_TRUE(x)+B_NOISE[i]);
  const PH=xs.map(bPhi);
  const A=Array.from({length:B_M},(_,i)=>Array.from({length:B_M},(_,j)=>
      B_ALPHA*(i===j?1:0) + B_BETA*PH.reduce((s,p)=>s+p[i]*p[j],0)));
  const SN=inv(A);
  const rhs=Array.from({length:B_M},(_,i)=>B_BETA*PH.reduce((s,p,n)=>s+p[i]*ts[n],0));
  const mN=matvec(SN,rhs);
  /* Draw properly: w = m + L z with L L^T = S_N. Perturbing each weight independently
     by its own standard deviation ignores the correlations between weights — and those
     correlations are exactly what keeps the sampled curves tight where the data is. Done
     the naive way the fan is the same width everywhere, which is the opposite of the
     point of this slide. */
  const L=chol(SN);
  const out=[];
  for(let k=0;k<K;k++){
    const z=Array.from({length:B_M},()=>gauss(r));
    out.push(mN.map((m,i)=>m+L[i].reduce((a,l,j)=>a+l*z[j],0)));
  }
  return {xs,ts,mN,SN,ws:out};
}
function drawEns(){
  const svg=document.getElementById('esvg'); if(!svg) return;
  const W=560,H=300,ML=42,MR=16,MT=16,MB=38;
  const X=x=>ML+(W-ML-MR)*x, Y=t=>MT+(H-MT-MB)*(1.9-t)/3.8;
  const {xs,ts,mN,SN,ws}=ensSamples(ENS_K);
  const grid=lin(0,1,110);
  let s='';
  for(let t=-1.5;t<=1.51;t+=0.75){ s+='<line class="gridline" x1="'+ML+'" y1="'+Y(t)+'" x2="'+(W-MR)+'" y2="'+Y(t)+'"/>'
    + '<text class="tick" x="'+(ML-8)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t.toFixed(1)+'</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  /* each sampled weight vector is one line: one "ensemble member" */
  ws.forEach(w=>{ s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(dot(w,bPhi(x)))]))+'"'
    + ' fill="none" stroke="var(--accent2)" stroke-width="1.4" opacity="'+(0.15+0.5/Math.sqrt(ENS_K))+'"/>'; });
  if(ENS_SHOW){
    const up=[],dn=[];
    grid.forEach(x=>{ const p=bPhi(x);
      const vals=ws.map(w=>dot(w,p));
      const m=vals.reduce((a,b)=>a+b,0)/vals.length;
      const sd=Math.sqrt(vals.reduce((a,v)=>a+(v-m)*(v-m),0)/Math.max(1,vals.length-1) + 1/B_BETA);
      up.push([X(x),Y(m+2*sd)]); dn.push([X(x),Y(m-2*sd)]); });
    s+='<path d="'+pathOf(up)+' L'+dn.slice().reverse().map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z"'
     + ' fill="var(--accent)" opacity=".14"/>';
    s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(dot(mN,bPhi(x)))]))+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  }
  xs.forEach((x,i)=>{ s+='<circle class="datapt" cx="'+X(x)+'" cy="'+Y(ts[i])+'" r="4.6"/>'; });
  svg.innerHTML=s;
  const wn=document.getElementById('ewarn');
  if(ENS_K===1) wn.innerHTML='One weight vector, one line &#8212; this is a point estimate. It commits everywhere, including where there is no data.';
  else if(ENS_K<=6) wn.innerHTML='<strong>'+ENS_K+'</strong> weight vectors. Near the data they agree; away from it they fan out. The disagreement <em>is</em> the epistemic uncertainty.';
  else wn.innerHTML='<strong>'+ENS_K+'</strong> of them. The integral is this, taken to the limit &#8212; and a finite set of models voting is exactly what an <strong>ensemble</strong> does.';
  const b=document.getElementById('eband'); if(b) b.classList.toggle('sel',ENS_SHOW);
}

/* ---------------------------------------------------------------- axes helper (L2)

function ax2(W,H,xlo,xhi,ylo,yhi,xstep,ystep,ml){
  ml=ml||46; const mr=14,mt=14,mb=34;

    s+='<line class="gridline" x1="'+ml+'" y1="'+py+'" x2="'+(W-mr)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(py+4)+'" text-anchor="end">'+(+g.toFixed(2))+'</text>'; }
  for(let g=xlo;g<=xhi+1e-9;g+=xstep){ const px=X(g);
    s+='<line class="gridline" x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(H-mb)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(H-mb+17)+'" text-anchor="middle">'+(+g.toFixed(2))+'</text>'; }
  s+='<line class="axis" x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'"/>';
  return {s:s,X:X,Y:Y,ml:ml,mr:mr,mt:mt,mb:mb};
}
const pOf=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');

/* ---------------------------------------------------------------- DEMO B — the generative picture
   Harold's sketch: the line y(x), a conditional Gaussian standing on its side at the
   chosen x, and targets drawn from it -- including two draws at the SAME x, which is
   the point that makes the noise model concrete. */
let LG_X=0.55, LG_S=0.28, LG_PTS=[], LG_SEED=99, LG_SHOWBAND=false;
const LG_W=[0.35,2.1];                       /* y(x) = w0 + w1 x, a straight line */
const lgY=x=>LG_W[0]+LG_W[1]*x;
function lgDraw(n){
  const r=lcg(LG_SEED); LG_SEED=(LG_SEED*1103515245+12345)>>>0;
  for(let i=0;i<n;i++) LG_PTS.push([LG_X, lgY(LG_X)+LG_S*gauss(r)]);
  drawLgen();
}
function lgSpread(){
  /* one draw at each of a spread of inputs: this is how a whole dataset appears */
  const r=lcg(LG_SEED); LG_SEED=(LG_SEED*1103515245+12345)>>>0;
  [0.08,0.2,0.32,0.44,0.56,0.68,0.8,0.92].forEach(x=>LG_PTS.push([x, lgY(x)+LG_S*gauss(r)]));
  drawLgen();
}

   + '<text class="matn" x="'+(A.X(0.93))+'" y="'+(A.Y(lgY(0.93))-10)+'" fill="var(--accent2)">y(x) = w&#7488;&#966;(x)</text>';
  /* the conditional density at LG_X, drawn on its side */
  const mu=lgY(LG_X), amp=0.17;
  const dens=lin(mu-4*LG_S,mu+4*LG_S,90).map(t=>[A.X(LG_X+amp*NPDF(t,mu,LG_S*LG_S)*LG_S*Math.sqrt(2*Math.PI)), A.Y(t)]);
  g+='<line x1="'+A.X(LG_X)+'" y1="'+A.Y(mu-4*LG_S)+'" x2="'+A.X(LG_X)+'" y2="'+A.Y(mu+4*LG_S)

  g+='<circle cx="'+A.X(LG_X)+'" cy="'+A.Y(mu)+'" r="4" fill="var(--accent2)"/>';
  g+='<text class="matn" x="'+(A.X(LG_X)+amp*140)+'" y="'+(A.Y(mu)-6)+'">p(t | x, w)</text>';

  LG_PTS.forEach(([x,t],i)=>{
    const atX=Math.abs(x-LG_X)<1e-9;
    g+='<circle cx="'+A.X(x)+'" cy="'+A.Y(t)+'" r="4.3" fill="var(--s2)" opacity="'+(atX?0.95:0.7)+'"/>';
    if(atX) g+='<line x1="'+A.X(x)+'" y1="'+A.Y(lgY(x))+'" x2="'+A.X(x)+'" y2="'+A.Y(t)

    ? '<strong>' + same + ' targets at the same x</strong>, and they differ. Same input, same '
      + 'y(x) &#8212; different draw of &#949;. That is what <em>t = y(x) + &#949;</em> asserts.'
    : (LG_PTS.length ? 'Each dot is y(x) plus one draw of &#949;. Draw again at this same x.'

/* ---------------------------------------------------------------- DEMO C — what lambda is a ratio of
   Two densities side by side -- the noise on the targets, the prior on the weights --
   and the lambda they imply, with the fit that results. */
let LV_SE=0.30, LV_SW=1.20;
function drawLamviz(){
  const svg=document.getElementById('lvsvg'); if(!svg) return;
  const W=560,H=250, half=(W-60)/2;
  let g='';
  const panel=(x0,sd,col,lab,sub)=>{
    const A={ml:x0,mt:16,mb:40};
    const R=2.6, X=v=>x0+half*(v+R)/(2*R), Y=p=>H-40-(H-56)*p/1.45;
    let s='<line class="axis" x1="'+x0+'" y1="'+(H-40)+'" x2="'+(x0+half)+'" y2="'+(H-40)+'"/>';
    s+='<path d="'+pOf(lin(-R,R,160).map(v=>[X(v),Y(NPDF(v,0,sd*sd))]))+'" fill="none" stroke="'+col+'" stroke-width="2.8"/>';
    s+='<line x1="'+X(-sd)+'" y1="'+(H-40)+'" x2="'+X(-sd)+'" y2="'+Y(NPDF(-sd,0,sd*sd))+'" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="3 3"/>'
     + '<line x1="'+X(sd)+'" y1="'+(H-40)+'" x2="'+X(sd)+'" y2="'+Y(NPDF(sd,0,sd*sd))+'" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="3 3"/>';
    s+='<text class="legend" x="'+(x0+half/2)+'" y="14" text-anchor="middle">'+lab+'</text>';
    s+='<text class="tick" x="'+(x0+half/2)+'" y="'+(H-22)+'" text-anchor="middle">'+sub+'</text>';
    return s;
  };
  g+=panel(46,LV_SE,'var(--s2)','noise on the targets &#8212; how far t sits from y(x)','&#963;&#949; = '+LV_SE.toFixed(2));
  g+=panel(46+half+28,LV_SW,'var(--s1)','prior on each weight &#8212; how large w may be','&#963;w = '+LV_SW.toFixed(2));
  svg.innerHTML=g;
  const lam=(LV_SE*LV_SE)/(LV_SW*LV_SW);
  const a=document.getElementById('lvse'), b=document.getElementById('lvsw'), c=document.getElementById('lvlam');
  if(a) a.textContent=LV_SE.toFixed(2);
  if(b) b.textContent=LV_SW.toFixed(2);
  if(c) c.textContent=lam<0.01?lam.toExponential(1):lam.toFixed(3);
  const wn=document.getElementById('lvwarn');
  if(wn){
    /* bands chosen so each sentence is true across its whole range: lambda near 1
       means the two terms are comparable, which 0.063 is not. */
    if(lam>=2) wn.innerHTML='<strong>Wide noise, narrow prior.</strong> Residuals of this size are '
      + 'unsurprising, weights of this size are not &#8212; the penalty outweighs the error term and '
      + 'the fitted weights shrink.';
    else if(lam>=0.5) wn.innerHTML='&#963;&#949; and &#963;w are comparable, so &#955; is near 1: '
      + 'the penalty and the error term carry similar weight in the objective.';
    else wn.innerHTML='The prior is loose relative to the noise, so &#955; is small and the objective '
      + 'is close to plain least squares.';
  }
}

/* Click-to-advance, but never from a control. We remember where the pointer went DOWN:
   dragging a slider and releasing over the slide would otherwise fire a click on the
   slide and skip a page. */
const CONTROLS='input,button,a,select,textarea,label,.demo,.demo-ctrl,.bbtn,.basisbtns,video,iframe,svg';
let downInControl=false;
canvas.addEventListener('pointerdown',e=>{ downInControl=!!(e.target.closest&&e.target.closest(CONTROLS)); });
canvas.addEventListener('click',e=>{
  if(document.body.classList.contains('inking')) return;
  if(downInControl){ downInControl=false; return; }
  if(e.target.closest&&e.target.closest(CONTROLS)) return;
  next(); });

/* ============================================================
   ANNOTATION LAYER
   Draw over the slide with a mouse, trackpad or pen tablet. Pen pressure is
   used for stroke width when the device reports it. Ink is kept per slide.
   D toggles · E eraser · C clears the current slide · strokes survive navigation.
   ============================================================ */
const ink=document.getElementById('ink'), ictx=ink.getContext('2d');
let inkColor='#9B2C2C', inkWidth=2.2, drawing=false, erasing=false, inkStore={};
function sizeInk(){
  const r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  const keep=ink.width?ictx.getImageData(0,0,ink.width,ink.height):null;
  ink.width=w*r; ink.height=h*r; ink.style.width=w+'px'; ink.style.height=h+'px';
  ictx.setTransform(r,0,0,r,0,0); ictx.lineCap='round'; ictx.lineJoin='round';
  if(keep) try{ictx.putImageData(keep,0,0);}catch(_){}
}
addEventListener('resize',sizeInk); sizeInk();
function toggleInk(){
  document.body.classList.toggle('inking');
  document.querySelectorAll('.ib-sw').forEach(sw=>sw.classList.toggle('sel',sw.dataset.c===inkColor));
}
function clearInk(){ ictx.clearRect(0,0,ink.width,ink.height); delete inkStore[idx]; }
function saveInk(){ try{ inkStore[idx]=ink.toDataURL(); }catch(_){} }
function loadInk(i){
  ictx.clearRect(0,0,ink.width,ink.height);
  const d=inkStore[i]; if(!d) return;
  const im=new Image(); im.onload=()=>{ ictx.globalCompositeOperation='source-over'; ictx.drawImage(im,0,0,ink.width/(devicePixelRatio||1),ink.height/(devicePixelRatio||1)); }; im.src=d;
}
ink.addEventListener('pointerdown',e=>{ drawing=true; ink.setPointerCapture(e.pointerId);
  ictx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ictx.strokeStyle=inkColor; ictx.beginPath(); ictx.moveTo(e.clientX,e.clientY); });
ink.addEventListener('pointermove',e=>{ if(!drawing) return;
  /* pen pressure scales the chosen nib; a mouse just uses the nib width */
  const nib = erasing ? inkWidth*8 : inkWidth;
  ictx.lineWidth = (e.pressure>0 && e.pressure<1) ? nib*(0.45+1.3*e.pressure) : nib;
  ictx.lineTo(e.clientX,e.clientY); ictx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>ink.addEventListener(t,()=>{ if(drawing){drawing=false; saveInk();} }));
document.querySelectorAll('.ib-sw').forEach(sw=>sw.onclick=()=>{ inkColor=sw.dataset.c; setEraser(false);
  document.querySelectorAll('.ib-sw').forEach(o=>o.classList.toggle('sel',o===sw)); });
function setEraser(on){ erasing=on;
  document.getElementById('ib-eraser').classList.toggle('sel',on); }
document.getElementById('ib-eraser').onclick=()=>setEraser(!erasing);
document.querySelectorAll('.ib-sz').forEach(b=>b.onclick=()=>{ inkWidth=+b.dataset.w;
  document.querySelectorAll('.ib-sz').forEach(o=>o.classList.toggle('sel',o===b)); });
document.getElementById('ib-clear').onclick=clearInk;
document.getElementById('ib-off').onclick=toggleInk;

/* A centred paragraph should span its container. The global p{max-width:62ch} keeps
   body copy readable, but on a centred line it leaves the text in a narrow box pinned
   to the left, which reads as mis-centred. Runs once over every slide paragraph. */
/* Scale each site preview so a 1440px-wide render fits the box exactly. */
function fitSiteFrames(){
  document.querySelectorAll('.siteframe').forEach(function(f){
    const ifr=f.querySelector('iframe'); if(!ifr) return;
    const w=f.clientWidth; if(!w) return;
    ifr.style.transform='scale('+(w/1440)+')';
  });
}
addEventListener('resize',fitSiteFrames);

function spreadCentredText(){
  document.querySelectorAll('.slide p, .slide .figcap, .slide .lede').forEach(function(p){
    /* max-width only: an auto inline margin would make a flex item shrink-wrap
       instead of stretching, which is the very problem we are fixing. */
    if(getComputedStyle(p).textAlign === 'center') p.style.maxWidth='none';
  });
}

/* ---- presenter clock ---- P starts/stops. Shows elapsed time and how far
   ahead or behind the planned cumulative time you are at this slide. ---- */
let t0=null, tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updClock(){
  if(t0===null) return;
  const el=(performance.now()-t0)/60000;               // minutes elapsed
  document.getElementById('cl-el').textContent=fmt(performance.now()-t0);
  const plan=cumMin(idx), d=el-plan;
  const dl=document.getElementById('cl-dl');
  dl.textContent=(d>=0?'+':'&#8722;').replace('&#8722;','-')+Math.abs(d).toFixed(1)+'m vs plan ('+plan.toFixed(0)+'m / '+EST_TOTAL.toFixed(0)+'m)';
  dl.className='dl '+(d>0.5?'behind':(d<-0.5?'ahead':''));
}
function toggleClock(){
  document.body.classList.toggle('timing');
  if(document.body.classList.contains('timing')){ t0=performance.now(); tick=setInterval(updClock,1000); updClock(); }
  else { clearInterval(tick); t0=null; }
}

/* ---- YouTube facade -------------------------------------------------------------
   `button` and `iframe` are already in CONTROLS, so neither the play button nor the player
   advances the slide on click.

   YouTube's player refuses an opaque origin: opened straight from Finder this page is
   file://, and the embed dies with "Error 153 - video player configuration error". There is
   no embed parameter that fixes it. So served over http(s) we play inline, and off the disk
   we hand off to youtube.com in a new tab. */
const CAN_EMBED = location.protocol === 'http:' || location.protocol === 'https:';
function closeYT(w){
  const f=w.querySelector('iframe'); if(f) f.remove();
  const b=w.querySelector('.ytfacade'); if(b) b.style.display='';
  w.classList.remove('live');
}
document.querySelectorAll('.ytwrap').forEach(w=>{
  const btn=w.querySelector('.ytfacade');
  if(!CAN_EMBED){
    const b=w.querySelector('.vidbadge'); if(b) b.textContent='Video \u2192 YouTube';
    btn.title='Opens on YouTube \u2014 inline playback needs the deck served over http, not opened from disk';
  }
  btn.addEventListener('click',()=>{
    if(!CAN_EMBED){ window.open('https://www.youtube.com/watch?v='+w.dataset.yt,'_blank','noopener'); return; }
    if(w.classList.contains('live')) return;
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+w.dataset.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title=w.dataset.title||'Video';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    btn.style.display='none';
    w.appendChild(f);
    w.classList.add('live');
  });
});
