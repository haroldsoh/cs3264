  </div>`},

{s:"Part II", t:"Part II", div:true, html:`
  <div class="divider">
    <div class="part">Part II</div>
    <h1>Preliminaries</h1>
    <div class="bar"></div>
    <div class="sub">The sum and product rules, Bayes rule, and the Gaussian.</div>
  </div>`},

{s:"Part II", t:"Two rules", html:`
  <div class="eyebrow">We will use these constantly today</div>
  <h2 style="margin-bottom:18px">Two useful rules in probability</h2>
  <div class="row top" style="gap:34px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:12px">Product (chain) rule</div>
      <div class="eq" style="margin:0;font-size:28.5px"><span class="texd" data-tex="p(x,y) = p(x \\mid y)\\,p(y) = p(y \\mid x)\\,p(x)"></span></div>
      <hr class="rule">
      <p style="font-size:19.5px;max-width:none">A joint distribution can always be built one
      variable at a time.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:12px">Sum rule (marginalisation)</div>
      <div class="eq" style="margin:0;font-size:28.5px"><span class="texd" data-tex="p(x) = \\sum_y p(x,y) \\quad\\text{or}\\quad \\int p(x,y)\\,dy"></span></div>
      <hr class="rule">
      <p style="font-size:19.5px;max-width:none">A variable you do not care about is removed by
      summing &#8212; or integrating &#8212; it away.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="1" style="margin-top:20px;text-align:center">
    <p style="font-size:22px;max-width:none">Applied together, these two give <strong>Bayes&#8217;
    rule</strong>, which we use in the second half of the lecture.</p>
  </div>`},

{s:"Part II", t:"Deriving Bayes rule", html:`
  <div class="eyebrow">Built from the two rules above</div>
  <h2 style="margin-bottom:10px">Bayes&#8217; rule is three lines of algebra</h2>
  <p style="font-size:20.5px;margin-bottom:8px">Start from the definition of conditional
  probability &#8212; the product rule, written two ways for the same joint:</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:22px">
    <div><span class="tex" data-tex="p(A, B)"></span></div><div><span class="tex" data-tex="= p(A \\mid B)\\,p(B) = p(B \\mid A)\\,p(A)"></span></div>
      <div class="dnote">the product rule, both orderings</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="p(A \\mid B)"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\dfrac{p(B \\mid A)\\,p(A)}{p(B)}"></span></div>
      <div class="dnote frag" data-f="0">divide through by <span class="tex" data-tex="p(B)"></span></div>
    <div class="frag" data-f="1"><span class="tex" data-tex="p(B)"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\textstyle\\sum_{A'} p(B \\mid A')\\,p(A')"></span></div>
      <div class="dnote frag" data-f="1">and the <strong>sum rule</strong> supplies the denominator</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;text-align:center;padding:14px 20px">
    <p style="font-size:20.5px;max-width:none">Nothing has been assumed. It follows from the two
    rules we just wrote down.</p>
  </div>`},

{s:"Part II", t:"Bayes rule", html:`
  <div class="eyebrow">What each piece is called</div>
  <h2 style="margin-bottom:14px">Prior, likelihood, posterior</h2>
  <p style="font-size:20.5px;margin-bottom:6px">Put a concrete pair of events in it. Let
  <span class="tex" data-tex="D"></span> be having a disease and <span class="tex" data-tex="{+}"></span> be testing positive:</p>
  <div class="eq" style="margin:8px 0 18px;font-size:30px"><span class="texd" data-tex="\\underbrace{\\htmlClass{c-post}{p(D \\mid {+})}}_{\\htmlClass{c-post}{\\text{posterior}}} = \\frac{\\overbrace{\\htmlClass{c-lik}{p({+} \\mid D)}}^{\\htmlClass{c-lik}{\\text{likelihood}}}\\ \\overbrace{\\htmlClass{c-prior}{p(D)}}^{\\htmlClass{c-prior}{\\text{prior}}}}{\\underbrace{p({+})}_{\\text{evidence}}}"></span></div>
  <div class="grid3">
    <div class="appcard frag" data-f="0" style="padding:19px;border-color:var(--accent2)">
      <div class="t" style="font-size:22px;color:var(--accent2)">Prior</div>
      <div class="d" style="font-size:18.5px;margin-top:6px"><span class="tex" data-tex="p(D)"></span> &#8212; how common the disease is,
      before any test.</div></div>
    <div class="appcard frag" data-f="1" style="padding:19px;border-color:var(--accent-soft)">
      <div class="t" style="font-size:22px;color:var(--accent-soft)">Likelihood</div>
      <div class="d" style="font-size:18.5px;margin-top:6px"><span class="tex" data-tex="p({+} \\mid D)"></span> &#8212; how the test behaves on
      someone who is ill.</div></div>
    <div class="appcard frag" data-f="2" style="padding:19px;border-color:var(--accent)">
      <div class="t" style="font-size:22px;color:var(--accent)">Posterior</div>
      <div class="d" style="font-size:18.5px;margin-top:6px"><span class="tex" data-tex="p(D \\mid {+})"></span> &#8212; what you actually want to
      know, given your result.</div></div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:16px;text-align:center">
    Later we put <span class="tex" data-tex="\\boldsymbol{\\theta}"></span> and <span class="tex" data-tex="\\mathcal{D}"></span> in the same slots, and the same rule learns parameters from data.</p>`},

{s:"Part II", t:"Who was Bayes", html:`
  <div class="eyebrow">Notion before notation</div>
  <h2 style="margin-bottom:12px">What Bayes&#8217; rule is for</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:.5">
      <div class="fig h-250"><img src="media/bayes.jpg" alt="Portrait said to be of Thomas Bayes"></div>
      <p class="cred">Thomas Bayes, c.1701&#8211;1761. The only portrait said to be of him, and even
        that is disputed.</p>
    </div>
    <div class="col" style="flex:1.5">
      <p style="font-size:21px">A Presbyterian minister and mathematician. The rule was published in
      1763, two years after he died, from a paper found among his notes.</p>
      <div class="frag" data-f="0" style="margin-top:13px">
        <hr class="rule">
        <p style="font-size:21px">It answers one question: <em class="hl">how do I turn what I can
        measure into what I want to know?</em></p>
      </div>
      <div class="row top frag" data-f="1" style="gap:22px;margin-top:13px">
        <div class="col card">
          <div class="eyebrow" style="margin-bottom:8px">What a lab can measure</div>
          <p style="font-size:20px;max-width:none"><span class="tex" data-tex="p({+} \\mid D)"></span><br>
          <span style="color:var(--ink-soft);font-size:18px">test 1,000 known cases and count</span></p>
        </div>
        <div class="col card accent">
          <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">What a patient asks</div>
          <p style="font-size:20px;max-width:none"><span class="tex" data-tex="p(D \\mid {+})"></span><br>
          <span style="color:var(--ink-soft);font-size:18px">my test is positive &#8212; am I ill?</span></p>
        </div>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Bayes example", html:`
  <span class="actbadge">Predict first</span>
  <div class="actq" style="font-size:27px;margin:10px 0 14px">A disease affects <strong>1 in 100</strong>
    people. A test is right <strong>99&#37;</strong> of the time, either way.<br>
    Your test comes back <span style="color:var(--accent)">positive</span>. What is the chance you
    have it?</div>
  <div class="predcards" style="margin-bottom:6px">
    <div class="predcard"><div class="pl">A</div><div class="pd" style="font-size:23px;padding:14px 0">about 99&#37;</div></div>
    <div class="predcard"><div class="pl">B</div><div class="pd" style="font-size:23px;padding:14px 0">about 90&#37;</div></div>
    <div class="predcard"><div class="pl">C</div><div class="pd" style="font-size:23px;padding:14px 0">about 50&#37;</div></div>
    <div class="predcard"><div class="pl">D</div><div class="pd" style="font-size:23px;padding:14px 0">about 1&#37;</div></div>
  </div>
  <p class="figcap" style="text-align:center">Commit to one before we work it out.</p>`},

{s:"Part II", t:"Bayes example — the computation", html:`
  <div class="eyebrow">Put the numbers in the rule</div>
  <h2 style="margin-bottom:10px">Turn the handle</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:20.5px;margin-bottom:6px">What we are given:</p>
      <div class="eq" style="margin:6px 0 12px;font-size:21px"><span class="texd" data-tex="p(D) = 0.01, \\qquad p({+} \\mid D) = 0.99, \\qquad p({+} \\mid \\lnot D) = 0.01"></span></div>
      <p style="font-size:20.5px;margin-bottom:6px" class="frag" data-f="0">The denominator comes
      from the sum rule &#8212; positives arrive from both groups:</p>
      <div class="eq frag" data-f="0" style="margin:6px 0 0;font-size:20px"><span class="texd" data-tex="p({+}) = \\underbrace{0.99 \\times 0.01}_{\\text{ill}} + \\underbrace{0.01 \\times 0.99}_{\\text{well}} = 0.0198"></span></div>
    </div>
    <div class="col frag" data-f="1">
      <p style="font-size:20.5px;margin-bottom:6px">So:</p>
      <div class="eq" style="margin:6px 0 12px;font-size:20px"><span class="texd" data-tex="p(D \\mid {+}) = \\frac{0.99 \\times 0.01}{0.0198} = \\frac{0.0099}{0.0198} = 0.5"></span></div>
      <div class="card accent frag" data-f="2">
        <p style="font-size:21px;max-width:none">The prior is doing the work. A disease this rare
        means the 99&#37; of well people who test correctly still leave <em class="hl">as many false
        positives as true ones</em>.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Bayes example — answer", draw:"med", html:`
  <div class="eyebrow">Why the answer surprises people</div>
  <h2 style="margin-bottom:12px">It is <strong>C</strong> &#8212; about 50&#37;</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="card accent">
        <p style="font-size:21px;max-width:none">The same thing as counts. Take
        <strong>10,000</strong> people.</p>
        <hr class="rule">
        <p style="font-size:20.5px;max-width:none"><strong>100</strong> are ill, and 99 of them test
        positive.</p>
        <p style="font-size:20.5px;max-width:none;margin-top:8px"><strong>9,900</strong> are well,
        and 1&#37; of them &#8212; another <strong>99</strong> &#8212; also test positive.</p>
        <hr class="rule">
        <p style="font-size:21px;max-width:none">Two groups of the same size, so a positive result
        is a coin flip.</p>
      </div>
    </div>
    <div class="col frag" data-f="0" style="flex:1.05">
      <div class="fig h-290"><svg viewBox="0 0 460 300"><g id="medfig"></g></svg></div>
      <p class="cred">10,000 people. Teal: ill. Red outline: tested positive.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:12px;text-align:center">
    When a condition is rare, most positives are false ones &#8212; and test accuracy alone can
    never tell you that.</p>`},

{s:"Part II", t:"Independence", html:`
  <div class="eyebrow">An assumption we make all lecture</div>
  <h2 style="margin-bottom:16px">Independence</h2>
  <p style="font-size:22px;margin-bottom:10px">Two random variables <span class="tex" data-tex="x"></span> and <span class="tex" data-tex="y"></span> are
  <strong>independent</strong> if and only if</p>
  <div class="eq" style="margin:10px 0 6px;font-size:33px"><span class="texd" data-tex="p(x,y) = p(x)\\,p(y)"></span></div>
  <div class="row top frag" data-f="0" style="gap:26px;margin-top:20px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Independent</div>
      <p style="font-size:20px;max-width:none">Two rolls of a die. Knowing the first came up 6 tells
      you nothing about the second.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Not independent</div>
      <p style="font-size:20px;max-width:none">Today&#8217;s temperature and tomorrow&#8217;s.
      Knowing one tells you a good deal about the other.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="1" style="margin-top:16px">
    <p style="font-size:20px;max-width:none">We assume the <em>noise</em> on each point is
    independent &#8212; which turns a joint distribution over all N points into a <strong>product of
    N one-dimensional terms</strong>. It is an assumption, and it can be wrong.</p>
  </div>`},

{s:"Part II", t:"The Gaussian", draw:"gauss", html:`
  <div class="eyebrow">Our model for continuous noise</div>
  <h2 style="margin-bottom:10px">The normal distribution</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="gsvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 16px;font-size:20px"><span class="texd" data-tex="\\mathcal{N}(x \\mid \\mu, \\sigma^2) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}}\\exp\\!\\left(-\\frac{(x-\\mu)^2}{2\\sigma^2}\\right)"></span></div>
      <div class="ctrl-row"><label>mean <span class="val" id="gmuv">0.0</span></label>
        <input type="range" id="gmu" min="-3" max="3" step="0.1" value="0"></div>
      <div class="ctrl-row"><label>variance <span class="val" id="gs2v">1.0</span></label>
        <input type="range" id="gs2" min="0.1" max="4" step="0.1" value="1"></div>
      <p class="caption" style="margin-top:6px">Two numbers fix the curve: where it sits and how
      wide it is. It is symmetric about the mean, and never exactly reaches zero &#8212; every value
      keeps some density, however far out.</p>
      <p class="caption" style="margin-top:8px">We use it for measurement noise because errors from
      many small independent causes tend towards this shape.</p>
    </div>
  </div>`},

{s:"Part II", t:"What a likelihood is", draw:"lik", html:`
  <div class="eyebrow">Notion before notation</div>
  <h2 style="margin-bottom:4px">What is a likelihood?</h2>
  <p style="font-size:20px;margin-bottom:2px">Same formula as the density, but the
  <strong>data is fixed</strong> and the <em class="hl">parameter varies</em>.</p>
  <div class="demo" style="margin-top:4px">
    <div class="demo-plot"><svg id="likfig-wrap" viewBox="0 0 470 300"><g id="likfig"></g></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 14px;font-size:21px"><span class="texd" data-tex="L(\\mu) = p(\\mathcal{D} \\mid \\mu)"></span></div>
      <div class="ctrl-row"><label>mean &#956; <span class="val" id="likmuv">-1.60</span></label>
        <input type="range" id="likmu" min="-3" max="3" step="0.02" value="-1.6"></div>
      <div class="readout">
        <div class="stat test"><div class="k">likelihood</div><div class="v" id="likval" style="font-size:20px">&#8212;</div></div>
        <div class="stat train"><div class="k">log-likelihood</div><div class="v" id="liklog" style="font-size:20px">&#8212;</div></div>
      </div>
      <div class="warn" id="likwarn"></div>
      <p class="caption" style="margin-top:2px">A score, not a distribution over <span class="tex" data-tex="\\mu"></span>.</p>
    </div>
  </div>`},

{s:"Part II", t:"Part II in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part II in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Two rules</div><p style="font-size:20px;max-width:none">The product rule factorises a joint; the sum rule integrates a variable away. Bayes rule follows from just these two.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Bayes&#8217; rule</div><p style="font-size:20px;max-width:none">Follows from them in three lines. Turns <span class="tex" data-tex="p(B \\mid A)"></span>, which you can measure, into <span class="tex" data-tex="p(A \\mid B)"></span>, which you want.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Likelihood</div><p style="font-size:20px;max-width:none">The same density read with the <em>data fixed</em> and the parameter varying. A score, not a distribution.</p></div>
  </div>
  <p class="figcap" style="margin-top:16px;text-align:center">And the Gaussian, which is the density we will use for noise from here on.</p>`},

{s:"Part II", t:"Questions (Part II)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About the sum and product rules, Bayes rule, or the Gaussian</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part III", t:"Part III", div:true, html:`
  <div class="divider">
    <div class="part">Part III</div>
    <h1>Fitting a Gaussian</h1>
    <div class="bar"></div>
    <div class="sub">A simple case &#8212; likelihood, log, derivative, solve.</div>
  </div>`},

{s:"Part III", t:"Gaussian MLE — setup", html:`
  <div class="eyebrow">Data, model, loss</div>
  <h2 style="margin-bottom:16px">Learning a Gaussian</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Data</div>
      <div class="eq" style="margin:6px 0 0;font-size:24px"><span class="texd" data-tex="\\mathcal{D} = \\{t_n\\}_{n=1}^{N}"></span></div>
      <p class="caption" style="margin-top:10px">N numbers. No inputs, no targets &#8212; just values.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Model</div>
      <div class="eq" style="margin:6px 0 0;font-size:24px"><span class="texd" data-tex="t_n \\sim \\mathcal{N}(\\mu, \\sigma^2)"></span></div>
      <p class="caption" style="margin-top:10px">They came from one Gaussian.
        Unknown: <span class="tex" data-tex="\\mu"></span>. Take <span class="tex" data-tex="\\sigma^2"></span> as known for now.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Loss</div>
      <p style="font-size:20px;max-width:none">Not written down by hand &#8212; obtained from
      <strong>maximum likelihood estimation</strong>.</p>
      <p class="caption" style="margin-top:10px">Which <span class="tex" data-tex="\\mu"></span> makes this data least surprising?</p>
    </div>
  </div>
  <div class="card frag" data-f="0" style="margin-top:20px;text-align:center">
    <p style="font-size:22.5px;max-width:none">Key assumption: the samples are
    <strong>independent and identically distributed</strong> &#8212; <em class="hl">i.i.d.</em></p>
  </div>`},

{s:"Part III", t:"Sampling a Gaussian", draw:"gsamp", html:`
  <div class="eyebrow">Live demo &#183; the generative direction</div>
  <h2 style="margin-bottom:10px">Where the numbers come from</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="gssvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:21px"><span class="texd" data-tex="t_n \\sim \\mathcal{N}(\\mu, \\sigma^2)"></span></div>
      <div class="ctrl-row"><label>&#956; <span class="val" id="gsmuv">2.0</span></label>
        <input type="range" id="gsmu" min="-1" max="5" step="0.1" value="2"></div>
      <div class="ctrl-row"><label>&#963; <span class="val" id="gssv">1.0</span></label>
        <input type="range" id="gss" min="0.3" max="2.2" step="0.1" value="1"></div>
      <div style="display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="gs1" type="button">draw 1</button>
        <button class="bbtn" id="gs10" type="button">draw 10</button>
        <button class="bbtn" id="gsr" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">drawn</span><span class="v" id="gsn">0</span></div>
      <div class="warn" id="gswarn"></div>
    </div>
  </div>`},

{s:"Part III", t:"Gaussian MLE — the likelihood", html:`
  <div class="eyebrow">Step 1 &#8212; write the probability of the data</div>
  <h2 style="margin-bottom:12px">The likelihood</h2>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:22.5px">
    <div><span class="tex" data-tex="p(\\mathcal{D} \\mid \\theta)"></span></div><div><span class="tex" data-tex="= p(t_1, t_2, \\ldots, t_N \\mid \\theta)"></span></div>
      <div class="dnote">the joint probability of all N values</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= p(t_1 \\mid \\theta)\\,p(t_2 \\mid \\theta)\\cdots p(t_N \\mid \\theta)"></span></div>
      <div class="dnote frag" data-f="0">independence &#8212; the joint factorises</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\prod_{n=1}^{N} p(t_n \\mid \\theta)"></span></div>
      <div class="dnote frag" data-f="1">and identically distributed</div>
    <div class="frag" data-f="2"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="2"><span class="tex" data-tex="= \\prod_{n=1}^{N} \\mathcal{N}(t_n \\mid \\mu, \\sigma^2)"></span></div>
      <div class="dnote frag" data-f="2">now put the Gaussian in</div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:22px;text-align:center;font-size:20.5px">
    A product of N terms, each typically small. Multiplied together they underflow a float within a
    few hundred points &#8212; a practical reason for the next step, quite apart from the algebra.</p>`},

{s:"Part III", t:"Gaussian MLE — the log", html:`
  <div class="eyebrow">Step 2 &#8212; take logs, then throw things away</div>
  <h2 style="margin-bottom:8px">Maximum likelihood</h2>
  <p style="font-size:20.5px;margin-bottom:10px"><span class="tex" data-tex="\\log"></span> is increasing, so maximising the log
  maximises the thing itself &#8212; and it turns the product into a sum:</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:21px">
    <div><span class="tex" data-tex="\\log p(\\mathcal{D} \\mid \\mu)"></span></div><div><span class="tex" data-tex="= \\log \\prod_n \\mathcal{N}(t_n \\mid \\mu,\\sigma^2)"></span></div><div class="dnote"></div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\sum_n \\log \\mathcal{N}(t_n \\mid \\mu, \\sigma^2)"></span></div>
      <div class="dnote frag" data-f="0">log of a product is a sum of logs</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\sum_n \\log\\!\\left[\\tfrac{1}{\\sqrt{2\\pi\\sigma^2}}\\exp\\!\\left(-\\tfrac{(t_n-\\mu)^2}{2\\sigma^2}\\right)\\right]"></span></div>
      <div class="dnote frag" data-f="1">write the density out</div>
    <div class="frag" data-f="2"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="2"><span class="tex" data-tex="= \\underbrace{\\sum_n \\log\\tfrac{1}{\\sqrt{2\\pi\\sigma^2}}}_{\\text{constant in } \\mu} - \\sum_n \\tfrac{(t_n-\\mu)^2}{2\\sigma^2}"></span></div>
      <div class="dnote frag" data-f="2">the first term has no <span class="tex" data-tex="\\mu"></span> in it &#8212; drop it</div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:18px;text-align:center">
    <p style="font-size:23.5px;max-width:none">Maximising that is the same as
    <strong>minimising</strong> <span class="tex" data-tex="\\tfrac12\\sum_n (t_n - \\mu)^2"></span></p>
    <p class="caption" style="margin-top:8px">Squared error, derived from the Gaussian noise
    assumption &#8212; not chosen.</p>
  </div>`},

{s:"Part III", t:"Gaussian MLE — solve", html:`
  <div class="eyebrow">Step 3 &#8212; set the derivative to zero</div>
  <h2 style="margin-bottom:14px">The answer is the one you would have guessed</h2>
  <div class="row top" style="gap:34px">
    <div class="col">
      <div class="eq" style="margin:4px 0 12px;font-size:26px"><span class="texd" data-tex="\\mathcal{L}(\\mu) = \\tfrac12\\sum_n (t_n-\\mu)^2"></span></div>
      <div class="frag" data-f="0">
        <div class="eq" style="margin:4px 0 12px;font-size:26px"><span class="texd" data-tex="\\frac{\\partial \\mathcal{L}}{\\partial \\mu} = -\\sum_n (t_n - \\mu) \\stackrel{!}{=} 0"></span></div>
      </div>
      <div class="card accent frag" data-f="1">
        <div class="eq" style="margin:0;font-size:31px"><span class="texd" data-tex="\\mu_{\\mathrm{ML}} = \\frac{1}{N}\\sum_{n=1}^{N} t_n"></span></div>
      </div>
    </div>
    <div class="col" style="flex:.95">
      <div class="card frag" data-f="2">
        <div class="eyebrow" style="margin-bottom:9px">And the variance</div>
        <p style="font-size:20px;max-width:none">The same argument applied to <span class="tex" data-tex="\\sigma^2"></span> gives</p>
        <div class="eq" style="margin:8px 0 0;font-size:21px"><span class="texd" data-tex="\\sigma^2_{\\mathrm{ML}} = \\frac{1}{N}\\sum_n (t_n - \\mu_{\\mathrm{ML}})^2"></span></div>
      </div>
      <div class="card accent frag" data-f="3" style="margin-top:14px">
        <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Worth noticing</div>
        <p style="font-size:20px;max-width:none">The sample mean was never assumed &#8212; it is what
        maximum likelihood <em class="hl">returns</em> under Gaussian noise. Assume Laplace noise
        instead and you get the <strong>median</strong>.</p>
      </div>
    </div>
  </div>`},

{s:"Part III", t:"Why MLE", html:`
  <div class="eyebrow">Is this a good idea in general?</div>
  <h2 style="margin-bottom:16px">Three properties that make MLE respectable</h2>
  <div class="grid3">
    <div class="appcard frag" data-f="0" style="padding:20px"><div class="t" style="font-size:23.5px">Consistency</div>
      <div class="d" style="font-size:18.5px;margin-top:8px">With enough data it converges to the
      true parameter &#8212; provided the model can express it.</div></div>
    <div class="appcard frag" data-f="1" style="padding:20px"><div class="t" style="font-size:23.5px">Asymptotic normality</div>
      <div class="d" style="font-size:18.5px;margin-top:8px">Its sampling distribution becomes
      Gaussian around the true value, so error bars are computable.</div></div>
    <div class="appcard frag" data-f="2" style="padding:20px"><div class="t" style="font-size:23.5px">Asymptotic efficiency</div>
      <div class="d" style="font-size:18.5px;margin-top:8px">No unbiased estimator does better in
      the limit. You are not leaving accuracy on the table.</div></div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:22px">
    <p style="font-size:20.5px;max-width:none">All three are <strong>asymptotic</strong> &#8212; they
    are promises about large N. With small N, maximum likelihood
    <em class="hl">overfits</em>, and <span class="tex" data-tex="\\sigma^2_{\\mathrm{ML}}"></span> is biased low: it divides by N when it should divide by
    <span class="tex" data-tex="N-1"></span>. Which is exactly the problem the second half of this lecture fixes.</p>
  </div>`},

{s:"Part III", t:"Multivariate Gaussian", draw:"cov", html:`
  <div class="eyebrow">Scaling up</div>
  <h2 style="margin-bottom:12px">The same thing in D dimensions</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="eq" style="margin:0 0 14px;font-size:23px"><span class="texd" data-tex="\\mathcal{N}(\\mathbf{x} \\mid \\boldsymbol{\\mu}, \\boldsymbol{\\Sigma}) = \\frac{1}{(2\\pi)^{D/2}\\lvert\\boldsymbol{\\Sigma}\\rvert^{1/2}}\\exp\\!\\left(-\\tfrac12(\\mathbf{x}-\\boldsymbol{\\mu})^\\top\\boldsymbol{\\Sigma}^{-1}(\\mathbf{x}-\\boldsymbol{\\mu})\\right)"></span></div>
      <p style="font-size:20.5px">A <span class="tex" data-tex="D"></span> mean vector, and a <span class="tex" data-tex="D\\times D"></span> covariance matrix that must be
      <strong>symmetric positive definite</strong>.</p>
      <p class="frag" data-f="0" style="font-size:20.5px;margin-top:12px">The quadratic form
      <span class="tex" data-tex="(\\mathbf{x}-\\boldsymbol{\\mu})^\\top\\boldsymbol{\\Sigma}^{-1}(\\mathbf{x}-\\boldsymbol{\\mu})"></span> replaces <span class="tex" data-tex="(x-\\mu)^2/\\sigma^2"></span>.</p>
    </div>
    <div class="col frag" data-f="1" style="flex:1.1">
      <div class="fig h-260"><svg viewBox="0 0 470 260"><g id="covfig"></g></svg></div>
      <p class="cred">Spherical, diagonal, full &#8212; increasing freedom in the covariance.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="2" style="margin-top:14px;text-align:center;font-size:20px">
    Independent univariate Gaussians are exactly the <strong>diagonal</strong> case:
    <span class="tex" data-tex="\\boldsymbol{\\Sigma} = \\mathrm{diag}(\\sigma_1^2,\\ldots,\\sigma_D^2)"></span>.</p>`},

{s:"Part III", t:"Part III in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part III in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The recipe</div><p style="font-size:20px;max-width:none">Write the likelihood, take logs, drop what does not depend on the parameter, set the derivative to zero.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">What came out</div><p style="font-size:20px;max-width:none"><span class="tex" data-tex="\\mu_{\\mathrm{ML}} = \\tfrac1N\\sum_n t_n"></span> &#8212; the sample mean, which nobody assumed. It is what maximum likelihood returns under Gaussian noise.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The catch</div><p style="font-size:20px;max-width:none">MLE&#8217;s guarantees are asymptotic. On small N it overfits, and its variance estimate is biased low.</p></div>
  </div>`},

{s:"Part III", t:"Questions (Part III)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About maximum likelihood, or fitting the Gaussian</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part IV", t:"Part IV", div:true, html:`
  <div class="divider">
    <div class="part">Part IV</div>
    <h1>Linear regression, again</h1>
    <div class="bar"></div>
    <div class="sub">Same model. This time we derive the loss instead of inventing it.</div>
  </div>`},

{s:"Part IV", t:"The generative picture", draw:"gen", html:`
  <div class="eyebrow">Notion before notation</div>
  <h2 style="margin-bottom:10px">Where does a target come from?</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:6px">
    <svg viewBox="0 0 900 170"><g id="genfig"></g></svg>
  </div>
  <div class="row top frag" data-f="0" style="gap:30px;margin-top:4px">
    <div class="col">
      <p style="font-size:20.5px">A <strong>deterministic</strong> part &#8212; the function we are
      trying to learn &#8212; plus a <strong>stochastic</strong> part we cannot predict.</p>
      <div class="eq" style="margin:10px 0 0;font-size:22px"><span class="texd" data-tex="t = y(x;\\mathbf{w}) + \\varepsilon, \\qquad y(x;\\mathbf{w}) = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x)"></span></div>
    </div>
    <div class="col frag" data-f="1">
      <p style="font-size:20.5px">Take the noise to be Gaussian with zero mean:</p>
      <div class="eq" style="margin:9px 0 0;font-size:22px"><span class="texd" data-tex="\\varepsilon \\sim \\mathcal{N}(0, \\sigma^2), \\qquad \\beta \\equiv \\sigma^{-2}"></span></div>
    </div>
  </div>`},

{s:"Part IV", t:"What distribution is the target?", html:`
  <span class="actbadge">Predict first</span>
  <div class="actq" style="font-size:28px;margin:12px 0 16px">If <span class="tex" data-tex="t = y(x;\\mathbf{w}) + \\varepsilon"></span> and
    <span class="tex" data-tex="\\varepsilon \\sim \\mathcal{N}(0,\\sigma^2)"></span>, what is the distribution of the target,
    <span class="tex" data-tex="p(t_n \\mid x_n, \\mathbf{w})"></span>?</div>
  <div class="predcards">
    <div class="predcard"><div class="pl">A</div><div class="pd" style="font-size:21px;padding:12px 4px"><span class="tex" data-tex="\\mathcal{N}(t_n \\mid 0,\\ \\sigma^2)"></span></div></div>
    <div class="predcard"><div class="pl">B</div><div class="pd" style="font-size:21px;padding:12px 4px"><span class="tex" data-tex="\\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n,\\ \\sigma^2\\bigr)"></span></div></div>
    <div class="predcard"><div class="pl">C</div><div class="pd" style="font-size:21px;padding:12px 4px"><span class="tex" data-tex="\\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n,\\ \\sigma^2 + \\lVert\\boldsymbol{\\phi}_n\\rVert^2\\bigr)"></span></div></div>
  </div>
  <p class="figcap" style="margin-top:14px;text-align:center">And <em class="hl">why?</em></p>`},

{s:"Part IV", t:"The target distribution", html:`
  <div class="eyebrow">The answer is B</div>
  <h2 style="margin-bottom:14px">Adding a constant shifts a Gaussian; it does not reshape it</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:20.5px">Given <span class="tex" data-tex="\\mathbf{w}"></span>, the prediction <span class="tex" data-tex="\\mathbf{w}^\\top\\boldsymbol{\\phi}_n"></span> is a fixed number. We are adding
      zero-mean Gaussian noise to that number.</p>
      <p style="font-size:20.5px;margin-top:12px">Shifting a Gaussian moves its mean and leaves its
      variance alone, so:</p>
      <div class="eq" style="margin:12px 0 0;font-size:23px"><span class="texd" data-tex="p(t_n \\mid x_n, \\mathbf{w}) = \\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n,\\ \\sigma^2\\bigr)"></span></div>
    </div>
    <div class="col card accent frag" data-f="0" style="flex:.9">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Read it out loud</div>
      <p style="font-size:20.5px;max-width:none">The model no longer predicts a number. It says: for
      this input, targets are <em class="hl">distributed around</em> <span class="tex" data-tex="\\mathbf{w}^\\top\\boldsymbol{\\phi}_n"></span> with spread <span class="tex" data-tex="\\sigma"></span>.</p>
      <hr class="rule">
      <p style="font-size:20.5px;max-width:none">Every point in the dataset now has a probability,
      and that is what we are about to maximise.</p>
    </div>
  </div>`},

{s:"Part IV", t:"How a dataset is generated", draw:"lgen", html:`
  <div class="eyebrow">Live demo &#183; draw targets yourself</div>
  <h2 style="margin-bottom:10px">The equation, as a picture</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lgsvg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="t_n = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x_n) + \\varepsilon_n, \\quad \\varepsilon_n \\sim \\mathcal{N}(0,\\sigma^2)"></span></div>
      <div class="ctrl-row"><label>input x <span class="val" id="lgxv">0.55</span></label>
        <input type="range" id="lgx" min="0.05" max="0.95" step="0.01" value="0.55"></div>
      <div class="ctrl-row"><label>noise &#963; <span class="val" id="lgsv">0.28</span></label>
        <input type="range" id="lgs" min="0.05" max="0.6" step="0.01" value="0.28"></div>
      <div style="display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="lg1" type="button">draw t at this x</button>
        <button class="bbtn" id="lgsp" type="button">a whole dataset</button>
        <button class="bbtn" id="lgb" type="button">&#177;2&#963; band</button>
        <button class="bbtn" id="lgr" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">targets drawn</span><span class="v" id="lgn">0</span></div>
      <div class="warn" id="lgwarn"></div>
      <p class="caption" style="margin-top:8px">Press <em>draw t at this x</em> twice without moving
      the slider &#8212; the sketch every textbook draws, and the reason <span class="tex" data-tex="\\varepsilon_n"></span> carries an index.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Linear regression MLE", html:`
  <div class="eyebrow">The derivation, and it is the one you just saw</div>
  <h2 style="margin-bottom:6px">Maximum likelihood for regression</h2>
  <p style="font-size:21px;margin-bottom:10px">We want the <span class="tex" data-tex="\\mathbf{w}"></span> that maximises the log-likelihood. So
  first, write that log-likelihood out:</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:21px">
    <div><span class="tex" data-tex="\\log p(\\mathcal{D} \\mid \\mathbf{w})"></span></div><div><span class="tex" data-tex="= \\log \\prod_n p(t_n \\mid x_n, \\mathbf{w})"></span></div>
      <div class="dnote">i.i.d. noise &#8212; the joint factorises</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\sum_n \\log \\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n, \\sigma^2\\bigr)"></span></div>
      <div class="dnote frag" data-f="0">put the Gaussian in</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="\\propto\\ -\\tfrac12\\sum_n \\bigl(t_n - \\mathbf{w}^\\top\\boldsymbol{\\phi}_n\\bigr)^2"></span></div>
      <div class="dnote frag" data-f="1">drop every term with no <span class="tex" data-tex="\\mathbf{w}"></span> in it</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:14px;padding:14px 20px;text-align:center">
    <p style="font-size:20px;max-width:none;margin-bottom:6px">Maximising that is the same as</p>
    <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\min_{\\mathbf{w}}\\ \\tfrac12 \\sum_n \\bigl(t_n - \\mathbf{w}^\\top\\boldsymbol{\\phi}_n\\bigr)^2"></span></div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:11px;text-align:center;font-size:20px">
    the sum of squared errors from last week &#8212; so <span class="tex" data-tex="\\mathbf{w}_{\\mathrm{ML}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span>, the same normal equations.</p>`},

{s:"Part IV", t:"The loss was never arbitrary", draw:"noise", html:`
  <div class="eyebrow">Where the squared loss came from</div>
  <h2 style="margin-bottom:16px">Squared error <em>follows from</em> the Gaussian assumption</h2>
  <div class="card accent" style="padding:15px 22px">
    <p style="font-size:21px;max-width:none">Minimising squared error is what you get when the noise
    is assumed <em class="hl">Gaussian, zero-mean and the same everywhere</em>. A different
    assumption gives a different loss.</p>
  </div>
  <div class="demo frag" data-f="1" style="margin-top:18px">
    <div class="demo-plot"><svg id="nsvg" viewBox="0 0 560 236"></svg></div>
    <div class="demo-ctrl">
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="bbtn sel" data-noise="gauss" type="button">Gaussian</button>
        <button class="bbtn" data-noise="laplace" type="button">Laplace</button>
      </div>
      <div class="readout"><div class="stat train" style="flex:1">
        <div class="k">negative log-likelihood</div>
        <div class="v" id="nloss" style="font-size:21px">&#8212;</div></div></div>
      <div class="warn" id="nwarn"></div>
    </div>
  </div>`},

{s:"Part IV", t:"Back to the car", html:`
  <div class="eyebrow">What we gained</div>
  <h2 style="margin-bottom:16px">The model can now answer the question</h2>
  <div class="row top" style="gap:32px">
    <div class="col">
      <p style="font-size:22px">Before, the model returned a number. Now it returns a
      <strong>distribution</strong>:</p>
      <div class="eq" style="margin:14px 0 0;font-size:26px"><span class="texd" data-tex="p(t \\mid x, \\mathbf{w}_{\\mathrm{ML}}) = \\mathcal{N}\\bigl(t \\mid \\mathbf{w}_{\\mathrm{ML}}^\\top\\boldsymbol{\\phi}(x),\\ \\sigma^2_{\\mathrm{ML}}\\bigr)"></span></div>
      <p class="frag" data-f="0" style="font-size:21px;margin-top:16px">Fit <span class="tex" data-tex="\\sigma^2"></span> the same way you fit
      <span class="tex" data-tex="\\mathbf{w}"></span>, and you have an error bar &#8212; so &#8220;is $15,000 reasonable?&#8221; becomes a
      question with an answer.</p>
    </div>
    <div class="col card frag" data-f="1" style="flex:.92">
      <div class="eyebrow" style="margin-bottom:10px">But be careful what it means</div>
      <p style="font-size:20px;max-width:none">This <span class="tex" data-tex="\\sigma^2"></span> is <strong>constant</strong> &#8212; the same
      width everywhere. The model is equally confident about a car it has seen a thousand of and one
      it has never seen.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none">Fixing <em>that</em> needs the full posterior, at the
      end of the lecture.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Two kinds of not knowing", html:`
  <div class="eyebrow">A distinction worth having early</div>
  <h2 style="margin-bottom:14px">Two reasons to be unsure</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Noise in the world</div>
      <p style="font-size:20.5px;max-width:none">Two identical cars sell for different prices. Even
      with perfect knowledge of the market you could not predict which.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none"><strong>More data does not help.</strong> This is
      called <em class="hl">aleatoric</em> uncertainty, from the Latin <em>alea</em>, a die.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Ignorance about the model</div>
      <p style="font-size:20.5px;max-width:none">We have seen forty cars, not forty thousand. We are
      not sure which weights are right &#8212; especially for a car unlike any we have seen.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none"><strong>More data does help.</strong> This is
      <em class="hl">epistemic</em> uncertainty, from <em>episteme</em>, knowledge.</p>
    </div>
  </div>
  <div class="card frag" data-f="0" style="margin-top:18px">
    <p style="font-size:20.5px;max-width:none">The <span class="tex" data-tex="\\sigma^2_{\\mathrm{ML}}"></span> we just fitted captures the
    <strong>first</strong> one only. It is a single number, the same for every car &#8212; so the
    model is equally confident about a common hatchback and one it has never seen.</p>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:12px;text-align:center">
    Getting the second one requires keeping a distribution over the weights. That is the rest of the
    lecture.</p>`},

{s:"Part IV", t:"Part IV in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part IV in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The move</div><p style="font-size:20px;max-width:none">Model the target as prediction plus noise, <span class="tex" data-tex="t = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x) + \\varepsilon"></span>. Then every data point has a probability.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The result</div><p style="font-size:20px;max-width:none">Maximising that likelihood <em>is</em> minimising squared error. The loss was a consequence of the noise assumption all along.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">What is still missing</div><p style="font-size:20px;max-width:none">One fixed spread for every input &#8212; aleatoric only. Nothing yet says &#8220;I have not seen a car like this&#8221;.</p></div>
  </div>`},

{s:"Part IV", t:"Questions (Part IV)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About where squared error came from</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part V", t:"Part V", div:true, html:`
  <div class="divider">
    <div class="part">Part V</div>
    <h1>But what about the regulariser?</h1>
    <div class="bar"></div>
    <div class="sub">Maximum likelihood gave us the first term. The second needs a new idea.</div>
  </div>`},

{s:"Part V", t:"Frequentist vs Bayesian", html:`
  <div class="eyebrow">Two readings of the word &#8220;probability&#8221;</div>
  <h2 style="margin-bottom:16px">Frequentist and Bayesian</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Frequentist</div>
      <p style="font-size:20.5px;max-width:none">A probability is a <strong>long-run frequency</strong>.
      Parameters are fixed but unknown; the <em>data</em> is random.</p>
      <hr class="rule">
      <p class="caption">The foundation of t-tests, p-values, confidence intervals &#8212; and of
      maximum likelihood.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:10px">Bayesian</div>
      <p style="font-size:20.5px;max-width:none">A probability is a <strong>degree of belief</strong>.
      The data is what it is; the <em>parameters</em> get a distribution.</p>
      <hr class="rule">
      <p class="caption">Lets you say &#8220;the weight is probably small&#8221; before seeing any
      data &#8212; which is exactly what a regulariser does.</p>
    </div>
  </div>
  <div class="card frag" data-f="1" style="margin-top:20px">
    <p style="font-size:19.5px;max-width:none">The two camps disagreed sharply for much of the
    twentieth century. In practice most people now use whichever is more convenient, and the two
    agree in the limit of plenty of data.</p>
  </div>`},

{s:"Part V", t:"Coin flip", draw:"coin", html:`
  <div class="eyebrow">The smallest possible example</div>
  <h2 style="margin-bottom:10px">Four coins, and a bet on heads</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="csvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;margin-bottom:12px">Only four kinds of coin exist, with
      <span class="tex" data-tex="\\theta \\in \\{0,\\ 0.2,\\ 0.8,\\ 1.0\\}"></span>. You start believing each is equally likely.</p>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="bbtn" id="cflipH" type="button">Flip: heads</button>
        <button class="bbtn" id="cflipT" type="button">Flip: tails</button>
        <button class="bbtn" id="creset" type="button">Reset</button>
      </div>
      <div class="readout">
        <div class="stat train"><div class="k">observed</div><div class="v" id="cobs" style="font-size:22.5px">&#8212;</div></div>
        <div class="stat test"><div class="k">MLE</div><div class="v" id="cmle" style="font-size:22.5px">&#8212;</div></div>
      </div>
      <div class="warn" id="cwarn">Flip a few times. Watch what maximum likelihood says after the
      very first flip.</div>
    </div>
  </div>`},

{s:"Part V", t:"MAP", html:`
  <div class="eyebrow">The cheap version</div>
  <h2 style="margin-bottom:12px">Maximum a posteriori</h2>
  <div class="row top" style="gap:32px">
    <div class="col">
      <p style="font-size:20.5px;margin-bottom:8px">A full posterior is a whole distribution and is
      often expensive. The cheap option: keep only its <strong>peak</strong>.</p>
      <div class="dgrid" style="grid-template-columns:auto auto;font-size:21px;margin-top:10px">
        <div><span class="tex" data-tex="{}"></span></div><div><span class="tex" data-tex="\\max_{\\theta}\\ \\log p(\\theta \\mid \\mathcal{D})"></span></div>
        <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\log \\frac{p(\\mathcal{D}\\mid\\theta)\\,p(\\theta)}{p(\\mathcal{D})}"></span></div>
        <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\log p(\\mathcal{D}\\mid\\theta) + \\log p(\\theta) - \\underbrace{\\log p(\\mathcal{D})}_{\\text{no }\\theta\\text{: drop it}}"></span></div>
      </div>
      <div class="card accent frag" data-f="2" style="margin-top:16px">
        <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\max_{\\theta}\\ \\log p(\\mathcal{D}\\mid\\theta) + \\log p(\\theta)"></span></div>
      </div>
    </div>
    <div class="col card frag" data-f="3" style="flex:.85">
      <div class="eyebrow" style="margin-bottom:10px">Poor man&#8217;s Bayes</div>
      <p style="font-size:20px;max-width:none">MAP keeps the mode and throws the width away. You get
      a point estimate that respects the prior, but <strong>no uncertainty</strong>.</p>
      <hr class="rule">
      <p class="caption">Compared with MLE it costs one extra term. Compared with the full posterior
      it answers with a point, not a distribution.</p>
    </div>
  </div>`},

{s:"Part V", t:"MAP for regression — setup", html:`
  <div class="eyebrow">Now put the regression model in</div>
  <h2 style="margin-bottom:14px">A prior over the weights</h2>
  <div class="row top stretch" style="gap:24px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Likelihood &#8212; unchanged</div>
      <div class="eq" style="margin:6px 0 0;font-size:23px"><span class="texd" data-tex="p(\\mathbf{t} \\mid \\mathbf{X}, \\mathbf{w}) = \\mathcal{N}\\bigl(\\mathbf{t} \\mid \\boldsymbol{\\Phi}\\mathbf{w},\\ \\beta^{-1}\\mathbf{I}\\bigr)"></span></div>
      <p class="caption" style="margin-top:10px"><span class="tex" data-tex="\\beta = 1/\\sigma_\\varepsilon^2"></span> is the <strong>precision</strong> of the noise
      &#8212; the inverse of its variance.</p>
    </div>
    <div class="col card accent frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Prior &#8212; new</div>
      <div class="eq" style="margin:6px 0 0;font-size:23px"><span class="texd" data-tex="p(\\mathbf{w}) = \\mathcal{N}\\bigl(\\mathbf{w} \\mid \\mathbf{0},\\ \\alpha^{-1}\\mathbf{I}\\bigr)"></span></div>
      <p class="caption" style="margin-top:10px">Zero-mean, and <span class="tex" data-tex="\\alpha = 1/\\sigma_w^2"></span> is the
      <strong>precision of the weights</strong>. Large <span class="tex" data-tex="\\alpha"></span> means &#8220;I expect small weights&#8221;.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:18px;text-align:center;font-size:20.5px">
    That is the modelling change: <em class="hl">a belief, stated before seeing data, that the
    weights are probably not large.</em></p>`},

{s:"Part V", t:"MAP for regression — derivation", html:`
  <div class="eyebrow">Two logs, and the ridge appears</div>
  <h2 style="margin-bottom:10px">The regulariser, derived</h2>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:20.5px">
    <div><span class="tex" data-tex="{}"></span></div><div><span class="tex" data-tex="\\max_{\\mathbf{w}}\\ \\log p(\\mathcal{D}\\mid\\mathbf{w}) + \\log p(\\mathbf{w})"></span></div><div class="dnote">from the previous slide</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\log\\mathcal{N}(\\mathbf{t}\\mid\\boldsymbol{\\Phi}\\mathbf{w}, \\beta^{-1}\\mathbf{I}) + \\log\\mathcal{N}(\\mathbf{w}\\mid\\mathbf{0},\\alpha^{-1}\\mathbf{I})"></span></div>
      <div class="dnote frag" data-f="0">write out both Gaussians</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= -\\tfrac{\\beta}{2}\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2 - \\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert_2^2 + \\text{const}"></span></div>
      <div class="dnote frag" data-f="1">keep only what depends on <span class="tex" data-tex="\\mathbf{w}"></span></div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px">
    <p style="font-size:20px;margin-bottom:8px;max-width:none">Flip the sign to get something to
    minimise, and divide through by <span class="tex" data-tex="\\beta"></span>:</p>
    <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = \\tfrac12\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2 + \\tfrac{\\lambda}{2}\\lVert\\mathbf{w}\\rVert_2^2, \\qquad \\lambda = \\frac{\\alpha}{\\beta}"></span></div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:14px;text-align:center;font-size:21px">
    Sum of squared errors, plus a penalty on <span class="tex" data-tex="\\lVert\\mathbf{w}\\rVert_2^2"></span>. <em class="hl">That is ridge regression.</em></p>`},

{s:"Part V", t:"What lambda means", html:`
  <div class="eyebrow">The knob you were turning last week</div>
  <h2 style="margin-bottom:16px"><span class="tex" data-tex="\\lambda"></span> now means something</h2>
  <div class="eq" style="margin:6px 0 20px;font-size:35px"><span class="texd" data-tex="\\lambda = \\frac{\\alpha}{\\beta} = \\frac{1/\\sigma_w^2}{1/\\sigma_\\varepsilon^2} = \\frac{\\sigma_\\varepsilon^2}{\\sigma_w^2} = \\frac{\\text{variance of the noise}}{\\text{variance of the weights}}"></span></div>
  <div class="row top" style="gap:30px">
    <div class="col card frag" data-f="0">
      <p style="font-size:20.5px;max-width:none"><strong>Noisy data, confident prior</strong><br>
      <span class="tex" data-tex="\\beta"></span> small, <span class="tex" data-tex="\\alpha"></span> large &#8594; <span class="tex" data-tex="\\lambda"></span> large: shrink the weights hard.</p>
    </div>
    <div class="col card frag" data-f="1">
      <p style="font-size:20.5px;max-width:none"><strong>Clean data, vague prior</strong><br>
      <span class="tex" data-tex="\\beta"></span> large, <span class="tex" data-tex="\\alpha"></span> small &#8594; <span class="tex" data-tex="\\lambda"></span> near zero: plain least squares.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px;text-align:center">
    <p style="font-size:22px;max-width:none">Last week <span class="tex" data-tex="\\lambda"></span> was a number we tuned by watching a
    validation curve. It is really a <em class="hl">ratio of two variances</em> &#8212; how noisy you
    think the data is, against how large you think the weights should be.</p>
  </div>
  <p class="caption frag" data-f="3" style="margin-top:9px;text-align:center">Solving as before:
    <span class="tex" data-tex="\\mathbf{w}_{\\mathrm{MAP}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\tfrac{\\alpha}{\\beta}\\mathbf{I})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></p>`},

{s:"Part V", t:"Seeing the ratio", draw:"lamviz", html:`
  <div class="eyebrow">Live demo &#183; two beliefs, one number</div>
  <h2 style="margin-bottom:10px"><span class="tex" data-tex="\\lambda"></span> is a ratio of two spreads</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lvsvg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <div class="ctrl-row"><label>noise &#963;&#949; <span class="val" id="lvse">0.30</span></label>
        <input type="range" id="lvsea" min="0.1" max="1.6" step="0.05" value="0.3"></div>
      <div class="ctrl-row"><label>prior &#963;w <span class="val" id="lvsw">1.20</span></label>
        <input type="range" id="lvswa" min="0.1" max="2.4" step="0.05" value="1.2"></div>
      <div class="card accent" style="margin:12px 0 10px;padding:12px 16px;text-align:center">
        <div class="eyebrow" style="margin-bottom:6px;color:var(--accent)">the &#955; they imply</div>
        <div class="v" id="lvlam" style="font-size:30px">0.063</div>
      </div>
      <div class="warn" id="lvwarn"></div>
    </div>
  </div>`},

{s:"Part V", t:"Part V in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part V in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The new ingredient</div><p style="font-size:20px;max-width:none">A <strong>prior</strong> over the weights, <span class="tex" data-tex="p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{0}, \\alpha^{-1}\\mathbf{I})"></span>: a belief, stated before seeing data, that they are probably not large.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The result</div><p style="font-size:20px;max-width:none">Maximising the posterior gives ridge regression. The regulariser is the negative log-prior.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">And <span class="tex" data-tex="\\lambda"></span></div><p style="font-size:20px;max-width:none">Is <span class="tex" data-tex="\\alpha/\\beta = \\sigma_\\varepsilon^2/\\sigma_w^2"></span> &#8212; how noisy you think the data is, against how large you think the weights should be.</p></div>
  </div>`},

{s:"Part V", t:"Questions (Part V)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About priors, MAP, or the regulariser</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part VI", t:"Part VI", div:true, html:`
  <div class="divider">
    <div class="part">Part VI</div>
    <h1>Keeping the whole distribution</h1>
    <div class="bar"></div>
    <div class="sub">MAP threw the width away. Here is what it cost.</div>
  </div>`},

{s:"Part VI", t:"The full posterior", html:`
  <div class="eyebrow">PRML &#167;3.3</div>
  <h2 style="margin-bottom:14px">Do not collapse to a point</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:21px;margin-bottom:10px">With a Gaussian likelihood and a Gaussian prior,
      the posterior can be written down exactly &#8212; and it is Gaussian too:</p>
      <div class="eq" style="margin:12px 0 14px;font-size:24px"><span class="texd" data-tex="p(\\mathbf{w}\\mid\\mathcal{D}) = \\mathcal{N}(\\mathbf{w}\\mid\\mathbf{m}_N, \\mathbf{S}_N)"></span></div>
      <div class="eq frag" data-f="0" style="margin:0 0 12px;font-size:21px"><span class="texd" data-tex="\\mathbf{S}_N^{-1} = \\alpha\\mathbf{I} + \\beta\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi}, \\qquad \\mathbf{m}_N = \\beta\\mathbf{S}_N\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
    </div>
    <div class="col card frag" data-f="1" style="flex:.85">
      <div class="eyebrow" style="margin-bottom:10px">What MAP was keeping</div>
      <p style="font-size:20px;max-width:none">The MAP estimate is exactly <span class="tex" data-tex="\\mathbf{m}_N"></span> &#8212; the mean of
      this distribution.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none">Everything in <span class="tex" data-tex="\\mathbf{S}_N"></span>, the whole notion of <em>how sure we
      are</em>, is what MAP discarded.</p>
    </div>
  </div>`},

{s:"Part VI", t:"Posterior predictive", html:`
  <div class="eyebrow">Built from the two rules we started with</div>
  <h2 style="margin-bottom:12px">Predicting without picking a single w</h2>
  <p style="font-size:21px;margin-bottom:8px">We want <span class="tex" data-tex="p(t \\mid x, \\mathcal{D})"></span> &#8212; a prediction at a new input, given
  the data. The weights are in the way, so introduce them and then remove them.</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:22px">
    <div><span class="tex" data-tex="p(t \\mid x, \\mathcal{D})"></span></div><div><span class="tex" data-tex="= \\displaystyle\\int p(t, \\mathbf{w} \\mid x, \\mathcal{D})\\,d\\mathbf{w}"></span></div>
      <div class="dnote">the <strong>sum rule</strong>: introduce <span class="tex" data-tex="\\mathbf{w}"></span>, then integrate it away</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\displaystyle\\int p(t \\mid x, \\mathbf{w}, \\mathcal{D})\\ p(\\mathbf{w} \\mid \\mathcal{D})\\,d\\mathbf{w}"></span></div>
      <div class="dnote frag" data-f="0">the <strong>product rule</strong> on the joint</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\displaystyle\\int \\underbrace{p(t \\mid x, \\mathbf{w})}_{\\text{model}}\\ \\underbrace{p(\\mathbf{w} \\mid \\mathcal{D})}_{\\text{posterior}}\\,d\\mathbf{w}"></span></div>
      <div class="dnote frag" data-f="1">given <span class="tex" data-tex="\\mathbf{w}"></span>, the new point does not depend on the old data</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px">
    <p style="font-size:21px;max-width:none">Every weight vector gets a vote, weighted by how
    plausible the data says it is. No single <span class="tex" data-tex="\\mathbf{w}"></span> is ever chosen.</p>
  </div>`},

{s:"Part VI", t:"Averaging over weights", draw:"ens", html:`
  <div class="eyebrow">The integral, made finite</div>
  <h2 style="margin-bottom:8px">What does &#8220;average over every w&#8221; look like?</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="esvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="ctrl-row"><label>weight vectors drawn <span class="val" id="ekv">1</span></label>

      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="bbtn" id="eband" type="button">Show mean &#177;2 s.d.</button>
      </div>
      <div class="warn" id="ewarn"></div>
      <p class="caption" style="margin-top:8px">Each line is one <span class="tex" data-tex="\\mathbf{w}"></span> drawn from
      <span class="tex" data-tex="p(\\mathbf{w}\\mid\\mathcal{D})"></span> &#8212; same 8 squared-exponential basis functions, 9 data points.
      The integral averages over all of them; a finite sample is an <strong>ensemble</strong>.</p>
    </div>
  </div>`},

{s:"Part VI", t:"Two kinds of uncertainty", html:`
  <div class="eyebrow">What the answer is made of</div>
  <h2 style="margin-bottom:14px">The variance splits into two parts</h2>
  <p style="font-size:21px;margin-bottom:10px">Doing that integral for our model gives a Gaussian
  whose variance has exactly two terms:</p>
  <div class="eq" style="margin:12px 0 20px;font-size:28px"><span class="texd" data-tex="\\sigma^2(x) = \\underbrace{\\beta^{-1}}_{\\text{aleatoric}} + \\underbrace{\\boldsymbol{\\phi}(x)^\\top\\mathbf{S}_N\\boldsymbol{\\phi}(x)}_{\\text{epistemic}}"></span></div>
  <div class="row top" style="gap:28px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:9px">Aleatoric &#8212; <span class="tex" data-tex="\\beta^{-1}"></span></div>
      <p style="font-size:20px;max-width:none">Noise in the world itself. Two identical cars sell for
      different prices. <strong>More data will not reduce it</strong>, because it is not ignorance.</p>
    </div>
    <div class="col card accent frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Epistemic &#8212; <span class="tex" data-tex="\\boldsymbol{\\phi}^\\top\\mathbf{S}_N\\boldsymbol{\\phi}"></span></div>
      <p style="font-size:20px;max-width:none">Uncertainty about <span class="tex" data-tex="\\mathbf{w}"></span>: we have not seen enough to pin
      the weights down. <strong>This one shrinks as data arrives</strong>, and it grows wherever the
      basis functions reach but the data does not.</p>
    </div>
  </div>`},

{s:"Part VI", t:"Three estimates, one picture", draw:"bayes", html:`

{s:"Part VI", t:"Back to the car, properly", html:`
  <div class="eyebrow">The question we opened with</div>
  <h2 style="margin-bottom:14px">Is $15,000 reasonable?</h2>
  <div class="row top" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">With maximum likelihood</div>
      <p style="font-size:20.5px;max-width:none">One price, one fixed spread <span class="tex" data-tex="\\sigma^2_{\\mathrm{ML}}"></span>, the same for every
      car on the lot.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none">Aleatoric only. A model that has seen a thousand of
      these and one that has seen none answer with equal confidence.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">With the posterior</div>
      <p style="font-size:20.5px;max-width:none">A distribution whose width depends on the car:</p>
      <div class="eq" style="margin:9px 0 0;font-size:20px"><span class="texd" data-tex="\\sigma^2(x) = \\beta^{-1} + \\boldsymbol{\\phi}(x)^\\top\\mathbf{S}_N\\boldsymbol{\\phi}(x)"></span></div>
      <hr class="rule">
      <p style="font-size:20px;max-width:none">Common hatchback, plenty of comparable sales &#8594;
      narrow, so $800 over is worth arguing about. Unusual car, few comparables &#8594; wide, and
      the honest answer is <em class="hl">we do not know enough to say</em>.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:16px;text-align:center">
    Both terms from the earlier slide, now doing the work: <span class="tex" data-tex="\\beta^{-1}"></span> is the noise, <span class="tex" data-tex="\\boldsymbol{\\phi}^\\top\\mathbf{S}_N\\boldsymbol{\\phi}"></span> is what we have not
    yet learned.</p>`},

{s:"Part VI", t:"Why this matters now", html:`
  <div class="eyebrow">The same distinction, somewhere you have met it</div>
  <h2 style="margin-bottom:12px">Language models and the two uncertainties</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:20.5px">Training a network gives you <em>one</em> setting of the weights
      &#8212; a point estimate, exactly like MAP:</p>
      <div class="eq" style="margin:10px 0 12px;font-size:22px"><span class="texd" data-tex="\\widehat{\\mathbf{w}} = \\arg\\max_{\\mathbf{w}}\\ \\log p(\\mathcal{D}\\mid\\mathbf{w}) + \\log p(\\mathbf{w})"></span></div>
      <p style="font-size:20.5px">Predictions then use that single <span class="tex" data-tex="\\widehat{\\mathbf{w}}"></span>, so the only spread they can
      report is the noise term:</p>
      <div class="eq" style="margin:10px 0 0;font-size:22px"><span class="texd" data-tex="p(t \\mid x, \\widehat{\\mathbf{w}}) \\quad\\Rightarrow\\quad \\sigma^2 = \\underbrace{\\beta^{-1}}_{\\text{aleatoric only}}"></span></div>
      <p class="caption" style="margin-top:9px">For a language model this is the next-token
      distribution: several words could reasonably come next.</p>
    </div>
    <div class="col">
      <div class="card accent">
        <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">What is missing</div>
        <p style="font-size:20.5px;max-width:none">The distribution over the parameters themselves:</p>
        <div class="eq" style="margin:10px 0 8px;font-size:22px"><span class="texd" data-tex="p(\\mathbf{w} \\mid \\mathcal{D})"></span></div>
        <p style="font-size:20.5px;max-width:none">Without it there is no term that grows when the
        question is unlike anything in the training data. Ask about something absent from it and the
        model answers <em class="hl">just as fluently</em> &#8212; with nothing to signal that it is
        guessing.</p>
      </div>
      <p class="caption frag" data-f="0" style="margin-top:12px">Ensembles, calibration, retrieval and
      teaching a model to say &#8220;I do not know&#8221; are all attempts to recover a term our
      posterior gave us for free on a linear model. It is an open problem at scale.</p>
    </div>
  </div>`},

{s:"Part VI", t:"Summary", html:`
  <div class="eyebrow">Today, in one slide</div>
  <h2 style="margin-bottom:12px">Both terms, accounted for</h2>
  <div class="eq" style="margin:4px 0 16px;font-size:31px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = \\underbrace{\\tfrac12\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2}_{\\text{likelihood}} + \\underbrace{\\tfrac{\\lambda}{2}\\lVert\\mathbf{w}\\rVert_2^2}_{\\text{prior}}"></span></div>
  <div class="row top" style="gap:26px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">The first term</div>
      <p style="font-size:20px;max-width:none">is the <strong>negative log-likelihood</strong> of
      Gaussian noise. Squared error was an assumption about noise all along.</p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px">The second term</div>
      <p style="font-size:20px;max-width:none">is the <strong>negative log-prior</strong> of a
      zero-mean Gaussian on the weights. Regularisation was a belief all along.</p>
    </div>
    <div class="col card accent frag" data-f="2">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">And the regularisation
        strength</div>
      <div class="eq" style="margin:2px 0 8px;font-size:21px"><span class="texd" data-tex="\\lambda = \\alpha/\\beta = \\sigma_\\varepsilon^2/\\sigma_w^2"></span></div>
      <p style="font-size:20px;max-width:none">is the ratio of the two variances &#8212; a statement
      about how much you trust the data relative to the prior.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:14px;text-align:center">
    Write down how the data was generated, and the loss function follows.</p>`},

{s:"Part VI", t:"Key ideas — the probability", html:`
  <div class="eyebrow">Recap &#183; 1 of 2</div>
  <h2 style="margin-bottom:16px">The probability we used</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Two rules</div>
      <p style="font-size:20px;max-width:none">The <strong>sum rule</strong> and the
      <strong>product rule</strong>. Bayes rule is not a third rule &#8212; we derived it
      from those two in three lines.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Likelihood</div>
      <p style="font-size:20px;max-width:none">The same expression <span class="tex" data-tex="p(\\mathcal{D} \\mid \\theta)"></span> read as a function of
      <span class="tex" data-tex="\\theta"></span> with the data held fixed. It is <strong>not</strong> a distribution over
      <span class="tex" data-tex="\\theta"></span> and does not integrate to 1.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Maximum likelihood</div>
      <p style="font-size:20px;max-width:none">Pick the parameters that make the data you saw
      most probable. For a Gaussian that is the sample mean and the average squared deviation &#8212;
      the answer you would have guessed.</p>
    </div>
  </div>`},

{s:"Part VI", t:"Key ideas — what it bought", html:`
  <div class="eyebrow">Recap &#183; 2 of 2</div>
  <h2 style="margin-bottom:16px">What it bought us</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">The loss</div>
      <p style="font-size:20px;max-width:none">Assume Gaussian noise and squared error
      <strong>follows</strong>. Assume Laplace noise and you get absolute error instead.
      The loss is a statement about noise.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">The regulariser</div>
      <p style="font-size:20px;max-width:none">A Gaussian prior on the weights gives ridge
      regression, with <span class="tex" data-tex="\\lambda = \\sigma_\\varepsilon^2/\\sigma_w^2"></span>. Regularisation strength is a ratio of variances, not an arbitrary knob.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">The distribution</div>
      <p style="font-size:20px;max-width:none">Keep the whole posterior and predictions come with
      a spread: <strong>aleatoric</strong> noise that data cannot reduce, plus
      <strong>epistemic</strong> uncertainty that it can.</p>
    </div>
  </div>`},

/* Per-slide delivery estimate in minutes. Used for the overview cumulative marks
   and the presenter clock's "vs plan" readout.
