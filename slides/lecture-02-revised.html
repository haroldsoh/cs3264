{s:"Part IV", t:"The generative picture", draw:"gen", html:`
  <div class="eyebrow">How the targets are generated</div>
  <h2 style="margin-bottom:10px">Prediction plus noise</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:6px">
    <svg viewBox="0 0 900 170"><g id="genfig"></g></svg>
  </div>
  <div class="row top frag" data-f="0" style="gap:30px;margin-top:4px">
    <div class="col">
      <p style="font-size:20.5px">Evaluate the function, then add a sample of noise.</p>
      <div class="eq" style="margin:10px 0 0;font-size:22px"><span class="texd" data-tex="t = y(x;\\mathbf{w}) + \\varepsilon, \\qquad y(x;\\mathbf{w}) = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x)"></span></div>
    </div>
    <div class="col frag" data-f="1">
      <p style="font-size:20.5px">Assume the noise is Gaussian with zero mean:</p>
      <div class="eq" style="margin:9px 0 0;font-size:22px"><span class="texd" data-tex="\\varepsilon \\sim \\mathcal{N}(0, \\sigma^2), \\qquad \\beta \\equiv \\sigma^{-2}"></span></div>
    </div>
  </div>`},

{s:"Part IV", t:"How a dataset is generated", draw:"lgen", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:10px">Generate target values</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lgsvg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:18px"><span class="texd" data-tex="t_n = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x_n) + \\varepsilon_n"></span></div>
      <div class="eq" style="margin:0 0 16px;font-size:18px"><span class="texd" data-tex="\\varepsilon_n \\sim \\mathcal{N}(0,\\sigma^2)"></span></div>
      <div class="ctrl-row"><label>input x <span class="val" id="lgxv">0.55</span></label>
        <input type="range" id="lgx" min="0.05" max="0.95" step="0.01" value="0.55"></div>
      <div class="ctrl-row"><label>noise <span style="text-transform:none">&#963;</span> <span class="val" id="lgsv">0.28</span></label>
        <input type="range" id="lgs" min="0.05" max="0.6" step="0.01" value="0.28"></div>
      <div style="display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="lg1" type="button">draw t at this x</button>
        <button class="bbtn" id="lgsp" type="button">draw a dataset</button>
        <button class="bbtn" id="lgb" type="button">&#177;2&#963; band</button>
        <button class="bbtn" id="lgr" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">targets drawn</span><span class="v" id="lgn">0</span></div>
      <div class="warn" id="lgwarn"></div>
      <p class="caption" style="margin-top:8px">Draw twice at the same <span class="tex" data-tex="x"></span>: the function value stays the same, but the noise changes.</p>
    </div>
  </div>`},

{s:"Part IV", t:"What distribution is the target?", html:`
  <span class="actbadge">Predict first</span>
  <div class="actq" style="font-size:28px;margin:12px 0 16px">If <span class="tex" data-tex="t = y(x;\\mathbf{w}) + \\varepsilon"></span> and
    <span class="tex" data-tex="\\varepsilon \\sim \\mathcal{N}(0,\\sigma^2)"></span>, what is the distribution of the target,
    <span class="tex" data-tex="p(t_n \\mid x_n, \\mathbf{w})"></span>?</div>
  <div class="predcards">
    <div class="predcard"><div class="pl">A</div><div class="pd" style="font-size:21px;padding:12px 4px"><span class="tex" data-tex="\\mathcal{N}(t_n \\mid 0,\\ \\sigma^2)"></span></div></div>
    <div class="predcard"><div class="pl">B</div><div class="pd" style="font-size:21px;padding:12px 4px"><span class="tex" data-tex="\\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n,\\ \\sigma^2\\bigr)"></span></div></div>
    <div class="predcard"><div class="pl">C</div><div class="pd" style="font-size:21px;padding:12px 4px"><span class="tex" data-tex="\\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n,\\ \\sigma^2 + \\lVert\\boldsymbol{\\phi}_n\\rVert^2\\bigr)"></span></div></div>
  </div>
  <p class="figcap" style="margin-top:14px;text-align:center">And why?</p>`},

{s:"Part IV", t:"The target distribution", html:`
  <div class="eyebrow">The answer is B</div>
  <h2 style="margin-bottom:14px">The distribution of the target</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:20.5px">Given <span class="tex" data-tex="x_n"></span> and <span class="tex" data-tex="\\mathbf{w}"></span>, the prediction <span class="tex" data-tex="\\mathbf{w}^\\top\\boldsymbol{\\phi}(x_n)"></span> is a fixed number.</p>
      <p style="font-size:20.5px;margin-top:12px">The target has mean equal to the prediction and variance equal to the noise variance:</p>
      <div class="eq" style="margin:12px 0 0;font-size:23px"><span class="texd" data-tex="p(t_n \\mid x_n, \\mathbf{w}) = \\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}(x_n),\\ \\sigma^2\\bigr)"></span></div>
    </div>
    <div class="col card accent frag" data-f="0" style="flex:.9">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">What this means</div>
      <p style="font-size:20.5px;max-width:none">Targets are <strong>distributed around the prediction</strong>
      <span class="tex" data-tex="\\mathbf{w}^\\top\\boldsymbol{\\phi}(x_n)"></span>.</p>
      <hr class="rule">
      <p style="font-size:20.5px;max-width:none">The prediction is the mean; <span class="tex" data-tex="\\sigma^2"></span> is the variance.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Linear regression MLE", html:`
  <div class="eyebrow">The derivation</div>
  <h2 style="margin-bottom:6px">Maximum likelihood for linear regression</h2>
  <p style="font-size:21px;margin-bottom:10px">We want the <span class="tex" data-tex="\\mathbf{w}"></span> that maximises the log-likelihood:</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:21px">
    <div><span class="tex" data-tex="\\log p(\\mathcal{D} \\mid \\mathbf{w})"></span></div><div><span class="tex" data-tex="= \\log \\prod_n p(t_n \\mid x_n, \\mathbf{w})"></span></div>
      <div class="dnote">independent noise, so the joint factorises</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\sum_n \\log \\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}_n, \\sigma^2\\bigr)"></span></div>
      <div class="dnote frag" data-f="0">substitute the Gaussian density</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="\\propto\\ -\\tfrac12\\sum_n \\bigl(t_n - \\mathbf{w}^\\top\\boldsymbol{\\phi}_n\\bigr)^2"></span></div>
      <div class="dnote frag" data-f="1">with <span class="tex" data-tex="\\sigma^2"></span> fixed, drop the terms without <span class="tex" data-tex="\\mathbf{w}"></span></div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:14px;padding:14px 20px;text-align:center">
    <p style="font-size:20px;max-width:none;margin-bottom:6px">Maximising the log-likelihood is equivalent to</p>
    <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\min_{\\mathbf{w}}\\ \\tfrac12 \\sum_n \\bigl(t_n - \\mathbf{w}^\\top\\boldsymbol{\\phi}_n\\bigr)^2"></span></div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:11px;text-align:center;font-size:20px">
    This is the least-squares problem from Lecture 1, so <span class="tex" data-tex="\\mathbf{w}_{\\mathrm{ML}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span>.</p>`},

{s:"Part IV", t:"The loss was never arbitrary", draw:"noise", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:16px">The noise model determines the loss</h2>
  <div class="card accent" style="padding:15px 22px">
    <p style="font-size:21px;max-width:none">Gaussian noise gives squared error. Laplace noise,
    <span class="tex" data-tex="p(\\varepsilon) \\propto \\exp(-\\lvert\\varepsilon\\rvert/b)"></span>, gives absolute error.</p>
  </div>
  <div class="demo frag" data-f="1" style="margin-top:18px">
    <div class="demo-plot"><svg id="nsvg" viewBox="0 0 560 236"></svg></div>
    <div class="demo-ctrl">
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="bbtn sel" data-noise="gauss" type="button">Gaussian</button>
        <button class="bbtn" data-noise="laplace" type="button">Laplace</button>
      </div>
      <div class="readout"><div class="stat train" style="flex:1">
        <div class="k">negative log-likelihood</div>
        <div class="v" id="nloss" style="font-size:21px">&#8212;</div></div></div>
      <div class="warn" id="nwarn"></div>
      <p class="caption" style="margin-top:8px">Squared error grows quadratically with the residual. Absolute error grows linearly and is less sensitive to outliers.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Back to the car", html:`
  <div class="eyebrow">What we have so far</div>
  <h2 style="margin-bottom:16px">The model returns a distribution</h2>
  <div class="row top" style="gap:32px">
    <div class="col">
      <p style="font-size:22px">Fit <span class="tex" data-tex="\\sigma^2"></span> as we fit <span class="tex" data-tex="\\mathbf{w}"></span>, to estimate the prediction variance:</p>
      <div class="eq" style="margin:14px 0 0;font-size:26px"><span class="texd" data-tex="p(t \\mid x, \\mathbf{w}_{\\mathrm{ML}}) = \\mathcal{N}\\bigl(t \\mid \\mathbf{w}_{\\mathrm{ML}}^\\top\\boldsymbol{\\phi}(x),\\ \\sigma^2_{\\mathrm{ML}}\\bigr)"></span></div>
    </div>
    <div class="col card frag" data-f="1" style="flex:.92">
      <div class="eyebrow" style="margin-bottom:10px">A limitation</div>
      <p style="font-size:20px;max-width:none">This <span class="tex" data-tex="\\sigma^2"></span> is <strong>constant</strong>: the variance is the same at every input.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none">This model reports the same uncertainty for familiar and unfamiliar inputs.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Two kinds of not knowing", html:`
  <div class="eyebrow">Two sources of uncertainty</div>
  <h2 style="margin-bottom:14px">Aleatoric and epistemic</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Aleatoric</div>
      <p style="font-size:20.5px;max-width:none">Noise in the observations. Cars with the same features can sell for different prices.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none"><strong>More data does not reduce it.</strong></p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Epistemic</div>
      <p style="font-size:20.5px;max-width:none">Uncertainty about the weights. Several weight values may fit the data.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none"><strong>More data can reduce it.</strong></p>
    </div>
  </div>
  <div class="card frag" data-f="0" style="margin-top:18px">
    <p style="font-size:20.5px;max-width:none">Our <span class="tex" data-tex="\\sigma^2_{\\mathrm{ML}}"></span> captures only observation noise.</p>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:12px;text-align:center">
    To represent uncertainty about the weights, we need a distribution over them.</p>`},

{s:"Part IV", t:"Part IV in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part IV summary</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The model</div><p style="font-size:20px;max-width:none">Prediction plus noise, <span class="tex" data-tex="t = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x) + \\varepsilon"></span>. Each target has a probability density.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The result</div><p style="font-size:20px;max-width:none">Maximising the likelihood gives the same solution as minimising squared error.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">What is missing</div><p style="font-size:20px;max-width:none">The variance is fixed across inputs and captures only aleatoric uncertainty.</p></div>
  </div>`},

{s:"Part IV", t:"Questions (Part IV)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About where squared error came from</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part V", t:"Part V", div:true, html:`
  <div class="divider">
    <div class="part">Part V</div>
    <h1>From maximum likelihood to a Bayesian model</h1>
    <div class="bar"></div>
    <div class="sub">The likelihood gives the loss. The prior gives the regulariser.</div>
  </div>`},

{s:"Part V", t:"Frequentist vs Bayesian", html:`
  <div class="eyebrow">Two interpretations of probability</div>
  <h2 style="margin-bottom:16px">Frequentist and Bayesian</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Frequentist</div>
      <p style="font-size:20.5px;max-width:none">A <strong>long-run frequency</strong>.
      Parameters are fixed; the data is random.</p>
      <hr class="rule">
      <p class="caption">t-tests, p-values, confidence intervals, maximum likelihood.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:10px">Bayesian</div>
      <p style="font-size:20.5px;max-width:none">A <strong>degree of belief</strong>. We use a distribution to describe uncertainty about the parameters.</p>
      <hr class="rule">
      <p class="caption">The prior states our beliefs before seeing the data.</p>
    </div>
  </div>
  <div class="card frag" data-f="1" style="margin-top:20px">
    <p style="font-size:19.5px;max-width:none">With enough data, their estimates often become similar.</p>
  </div>`},

{s:"Part V", t:"Coin flip", draw:"coin", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:10px">Four coins</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="csvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;margin-bottom:12px">Four kinds of coin, <span class="tex" data-tex="\\theta \\in \\{0,\\ 0.2,\\ 0.8,\\ 1.0\\}"></span>, with equal prior probabilities.</p>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="bbtn" id="cflipH" type="button">Flip: heads</button>
        <button class="bbtn" id="cflipT" type="button">Flip: tails</button>
        <button class="bbtn" id="creset" type="button">Reset</button>
      </div>
      <div class="readout">
        <div class="stat train"><div class="k">observed</div><div class="v" id="cobs" style="font-size:22.5px">&#8212;</div></div>
        <div class="stat test"><div class="k">MLE</div><div class="v" id="cmle" style="font-size:22.5px">&#8212;</div></div>
      </div>
      <div class="warn" id="cwarn">Compare MLE with the posterior after the first flip.</div>
    </div>
  </div>`},

{s:"Part V", t:"MAP", html:`
  <div class="eyebrow">One estimate from the posterior</div>
  <h2 style="margin-bottom:12px">Maximum a posteriori estimation</h2>
  <div class="row top" style="gap:32px">
    <div class="col">
      <p style="font-size:20.5px;margin-bottom:8px">Choose the parameter value with the highest posterior density.</p>
      <div class="dgrid" style="grid-template-columns:auto auto;font-size:21px;margin-top:10px">
        <div><span class="tex" data-tex="{}"></span></div><div><span class="tex" data-tex="\\max_{\\theta}\\ \\log p(\\theta \\mid \\mathcal{D})"></span></div>
        <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\log \\frac{p(\\mathcal{D}\\mid\\theta)\\,p(\\theta)}{p(\\mathcal{D})}"></span></div>
        <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\log p(\\mathcal{D}\\mid\\theta) + \\log p(\\theta) - \\underbrace{\\log p(\\mathcal{D})}_{\\text{no }\\theta\\text{: drop it}}"></span></div>
      </div>
      <div class="card accent frag" data-f="2" style="margin-top:16px">
        <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\max_{\\theta}\\ \\log p(\\mathcal{D}\\mid\\theta) + \\log p(\\theta)"></span></div>
      </div>
    </div>
    <div class="col card frag" data-f="3" style="flex:.85">
      <div class="eyebrow" style="margin-bottom:10px">What MAP keeps</div>
      <p style="font-size:20px;max-width:none">A point estimate that uses the prior. It can improve on MLE when data is limited.</p>
      <hr class="rule">
      <p class="caption">It still returns one set of weights, without describing uncertainty about them.</p>
    </div>
  </div>`},

{s:"Part V", t:"MAP for regression — setup", html:`
  <div class="eyebrow">A prior over the weights</div>
  <h2 style="margin-bottom:14px">Likelihood and prior</h2>
  <div class="row top stretch" style="gap:24px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Likelihood &#8212; unchanged</div>
      <div class="eq" style="margin:6px 0 0;font-size:23px"><span class="texd" data-tex="p(\\mathbf{t} \\mid \\mathbf{X}, \\mathbf{w}) = \\mathcal{N}\\bigl(\\mathbf{t} \\mid \\boldsymbol{\\Phi}\\mathbf{w},\\ \\beta^{-1}\\mathbf{I}\\bigr)"></span></div>
      <p class="caption" style="margin-top:10px"><span class="tex" data-tex="\\beta = 1/\\sigma_\\varepsilon^2"></span> is the noise <strong>precision</strong>,
      meaning inverse variance.</p>
    </div>
    <div class="col card accent frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Prior &#8212; new</div>
      <div class="eq" style="margin:6px 0 0;font-size:23px"><span class="texd" data-tex="p(\\mathbf{w}) = \\mathcal{N}\\bigl(\\mathbf{w} \\mid \\mathbf{0},\\ \\alpha^{-1}\\mathbf{I}\\bigr)"></span></div>
      <p class="caption" style="margin-top:10px">The prior has zero mean; <span class="tex" data-tex="\\alpha = 1/\\sigma_w^2"></span> is the weight precision. A small prior variance favours weights near zero.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:18px;text-align:center;font-size:20.5px">
    This expresses the same preference for small weights as ridge regression.</p>`},

{s:"Part V", t:"MAP for regression — derivation", html:`
  <div class="eyebrow">The derivation</div>
  <h2 style="margin-bottom:10px">Deriving the regulariser</h2>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:20.5px">
    <div><span class="tex" data-tex="{}"></span></div><div><span class="tex" data-tex="\\max_{\\mathbf{w}}\\ \\log p(\\mathcal{D}\\mid\\mathbf{w}) + \\log p(\\mathbf{w})"></span></div><div class="dnote">from the previous slide</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\log\\mathcal{N}(\\mathbf{t}\\mid\\boldsymbol{\\Phi}\\mathbf{w}, \\beta^{-1}\\mathbf{I}) + \\log\\mathcal{N}(\\mathbf{w}\\mid\\mathbf{0},\\alpha^{-1}\\mathbf{I})"></span></div>
      <div class="dnote frag" data-f="0">write out both Gaussians</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= -\\tfrac{\\beta}{2}\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2 - \\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert_2^2 + \\text{const}"></span></div>
      <div class="dnote frag" data-f="1">keep only what depends on <span class="tex" data-tex="\\mathbf{w}"></span></div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px">
    <p style="font-size:20px;margin-bottom:8px;max-width:none">Negate to turn maximisation into minimisation, then divide by <span class="tex" data-tex="\\beta"></span>:</p>
    <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = \\tfrac12\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2 + \\tfrac{\\lambda}{2}\\lVert\\mathbf{w}\\rVert_2^2, \\qquad \\lambda = \\frac{\\alpha}{\\beta}"></span></div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:14px;text-align:center;font-size:21px">
    This is exactly ridge regression.</p>`},

{s:"Part V", t:"What lambda means", html:`
  <div class="eyebrow">The regularisation hyperparameter</div>
  <h2 style="margin-bottom:16px">What <span class="tex" data-tex="\\lambda"></span> means</h2>
  <div class="eq" style="margin:6px 0 20px;font-size:35px"><span class="texd" data-tex="\\lambda = \\frac{\\alpha}{\\beta} = \\frac{1/\\sigma_w^2}{1/\\sigma_\\varepsilon^2} = \\frac{\\sigma_\\varepsilon^2}{\\sigma_w^2} = \\frac{\\text{noise variance}}{\\text{prior weight variance}}"></span></div>
  <div class="row top" style="gap:30px">
    <div class="col card frag" data-f="0">
      <p style="font-size:20.5px;max-width:none"><strong>Noisy observations</strong><br>
      <span class="tex" data-tex="\\sigma_\\varepsilon^2"></span> large, so <span class="tex" data-tex="\\lambda"></span> is large: penalise large weights more strongly.</p>
    </div>
    <div class="col card frag" data-f="1">
      <p style="font-size:20.5px;max-width:none"><strong>Low noise, wide prior</strong><br>
      <span class="tex" data-tex="\\lambda"></span> is small: MAP approaches least squares.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px;text-align:center">
    <p style="font-size:22px;max-width:none">In Lecture 1 <span class="tex" data-tex="\\lambda"></span> was a hyperparameter we tuned. Here it is the ratio of noise variance to prior variance.</p>
  </div>
  <p class="caption frag" data-f="3" style="margin-top:9px;text-align:center">The solution is:
    <span class="tex" data-tex="\\mathbf{w}_{\\mathrm{MAP}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\tfrac{\\alpha}{\\beta}\\mathbf{I})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></p>`},

{s:"Part V", t:"Seeing the ratio", draw:"lamviz", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:18px">The two variances behind <span class="tex" data-tex="\\lambda"></span></h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lvsvg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <p class="caption" style="margin:0 0 12px;max-width:none">Adjust the noise and prior spread. The card shows the resulting <span class="tex" data-tex="\\lambda"></span> .</p>
      <div class="ctrl-row"><label>noise <span style="text-transform:none">&#963;<sub>&#949;</sub></span> <span class="val" id="lvse">0.30</span></label>
        <input type="range" id="lvsea" min="0.1" max="2.4" step="0.05" value="0.3"></div>
      <div class="ctrl-row"><label>prior <span style="text-transform:none">&#963;<sub>w</sub></span> <span class="val" id="lvsw">1.20</span></label>
        <input type="range" id="lvswa" min="0.1" max="2.4" step="0.05" value="1.2"></div>
      <div class="card accent" style="margin:12px 0 10px;padding:12px 16px;text-align:center">
        <div class="eyebrow" style="margin-bottom:6px;color:var(--accent)">resulting <span style="text-transform:none">&#955;</span> value</div>
        <div class="eq" style="margin:0 0 4px;font-size:19px"><span class="texd" data-tex="\\lambda = \\sigma_\\varepsilon^2 / \\sigma_w^2"></span></div>
        <div class="v" id="lvlam" style="font-size:30px">0.063</div>
      </div>
      <div class="warn" id="lvwarn" style="min-height:66px"></div>
    </div>
  </div>`},

{s:"Part V", t:"Part V (so far) in one slide", html:`
  <div class="eyebrow">Before we keep going</div>
  <h2 style="margin-bottom:16px">Part V summary so far</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The new ingredient</div><p style="font-size:20px;max-width:none">A prior over the weights, <span class="tex" data-tex="p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{0}, \\alpha^{-1}\\mathbf{I})"></span>.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The result</div><p style="font-size:20px;max-width:none">With a Gaussian prior, MAP gives ridge regression. The penalty comes from the negative log-prior.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">And <span class="tex" data-tex="\\lambda"></span></div><p style="font-size:20px;max-width:none">Equals <span class="tex" data-tex="\\alpha/\\beta = \\sigma_\\varepsilon^2/\\sigma_w^2"></span>.</p></div>
  </div>`},

{s:"Part V", t:"Part V", div:true, html:`
  <div class="divider">
    <div class="part">Part V &#183; continued</div>
    <h1>Bayesian linear regression</h1>
    <div class="bar"></div>
    <div class="sub">Use the full distribution over weights to make predictions.</div>
  </div>`},

{s:"Part V", t:"The full posterior", html:`
  <div class="eyebrow">PRML &#167;3.3</div>
  <h2 style="margin-bottom:12px">The posterior over the weights</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:1.3">
      <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:10px 18px">
        <div style="font-size:19.5px">Likelihood<br><span class="dnote" style="padding-left:0;font-size:16.5px">from Part IV</span></div>
        <div class="eq" style="margin:0;font-size:19px;white-space:nowrap"><span class="tex" data-tex="p(\\mathbf{t}\\mid\\mathbf{X},\\mathbf{w}) = \\prod_{n=1}^{N}\\mathcal{N}\\bigl(t_n \\mid \\mathbf{w}^\\top\\boldsymbol{\\phi}(x_n),\\ \\beta^{-1}\\bigr)"></span></div>
        <div style="font-size:19.5px">Prior<br><span class="dnote" style="padding-left:0;font-size:16.5px">from Part V</span></div>
        <div class="eq" style="margin:0;font-size:19px;white-space:nowrap"><span class="tex" data-tex="p(\\mathbf{w}) = \\mathcal{N}\\bigl(\\mathbf{w} \\mid \\mathbf{0},\\ \\alpha^{-1}\\mathbf{I}\\bigr)"></span></div>
      </div>
      <p class="frag" data-f="0" style="font-size:20px;margin:12px 0 4px">A Gaussian likelihood and prior give a Gaussian posterior:</p>
      <div class="eq frag" data-f="0" style="margin:6px 0 8px;font-size:23px"><span class="texd" data-tex="p(\\mathbf{w}\\mid\\mathcal{D}) \\propto p(\\mathbf{t}\\mid\\mathbf{X},\\mathbf{w})\\,p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{w}\\mid\\mathbf{m}_N, \\mathbf{S}_N)"></span></div>
      <div class="eq frag" data-f="1" style="margin:0;font-size:20px"><span class="texd" data-tex="\\mathbf{S}_N^{-1} = \\alpha\\mathbf{I} + \\beta\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi}, \\qquad \\mathbf{m}_N = \\beta\\mathbf{S}_N\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
    </div>
    <div class="col card frag" data-f="2" style="flex:.72">
      <div class="eyebrow" style="margin-bottom:10px">What the two terms mean</div>
      <p style="font-size:20px;max-width:none"><span class="tex" data-tex="\\mathbf{m}_N"></span>: the posterior mean of the weights.
      <span class="tex" data-tex="\\mathbf{S}_N"></span>: the posterior covariance of the weights.</p>
      <hr class="rule">
      <p style="font-size:20px;max-width:none">MAP keeps <span class="tex" data-tex="\\mathbf{m}_N"></span> but does not retain <span class="tex" data-tex="\\mathbf{S}_N"></span>.</p>
    </div>
  </div>`},

{s:"Part V", t:"Posterior predictive", html:`
  <div class="eyebrow">Built from the sum and product rules</div>
  <h2 style="margin-bottom:12px">The posterior predictive distribution</h2>
  <p style="font-size:21px;margin-bottom:8px">We want <span class="tex" data-tex="p(t \\mid x, \\mathcal{D})"></span>. We do not know <span class="tex" data-tex="\\mathbf{w}"></span>, so average over its posterior distribution.</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:22px">
    <div><span class="tex" data-tex="p(t \\mid x, \\mathcal{D})"></span></div><div><span class="tex" data-tex="= \\displaystyle\\int p(t, \\mathbf{w} \\mid x, \\mathcal{D})\\,d\\mathbf{w}"></span></div>
      <div class="dnote">the <strong>sum rule</strong></div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\displaystyle\\int p(t \\mid x, \\mathbf{w}, \\mathcal{D})\\ p(\\mathbf{w} \\mid \\mathcal{D})\\,d\\mathbf{w}"></span></div>
      <div class="dnote frag" data-f="0">the <strong>product rule</strong></div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\displaystyle\\int \\underbrace{p(t \\mid x, \\mathbf{w})}_{\\text{model}}\\ \\underbrace{p(\\mathbf{w} \\mid \\mathcal{D})}_{\\text{posterior}}\\,d\\mathbf{w}"></span></div>
      <div class="dnote frag" data-f="1">given <span class="tex" data-tex="\\mathbf{w}"></span>, the new target is independent of the training targets</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px">
    <p style="font-size:21px;max-width:none">Each possible <span class="tex" data-tex="\\mathbf{w}"></span> gives a prediction. Average these using the posterior as weights.</p>
  </div>`},

{s:"Part V", t:"Averaging over weights", draw:"ens", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:8px">Sample functions from the posterior</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="esvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="ctrl-row"><label>sampled weight vectors <span class="val" id="ekv">1</span></label>
        <input type="range" id="ek" min="1" max="60" step="1" value="1"></div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="bbtn" id="eband" type="button">Show mean &#177;2 s.d.</button>
      </div>
      <div class="warn" id="ewarn"></div>
      <p class="caption" style="margin-top:8px">Each curve uses one <span class="tex" data-tex="\\mathbf{w}"></span> sampled from <span class="tex" data-tex="p(\\mathbf{w}\\mid\\mathcal{D})"></span>. Predictions agree more closely near the data than far away.</p>
    </div>
  </div>`},

{s:"Part V", t:"Two kinds of uncertainty", html:`
  <div class="eyebrow">Two sources of predictive uncertainty</div>
  <h2 style="margin-bottom:14px">The variance has two terms</h2>
  <p style="font-size:21px;margin-bottom:10px">The posterior predictive is Gaussian, with
  variance</p>
  <div class="eq" style="margin:12px 0 20px;font-size:28px"><span class="texd" data-tex="\\sigma^2(x) = \\underbrace{\\beta^{-1}}_{\\text{aleatoric}} + \\underbrace{\\boldsymbol{\\phi}(x)^\\top\\mathbf{S}_N\\boldsymbol{\\phi}(x)}_{\\text{epistemic}}"></span></div>
  <div class="row top" style="gap:28px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:9px">Aleatoric &#8212; <span class="tex" data-tex="\\beta^{-1}"></span></div>
      <p style="font-size:20px;max-width:none">Noise in the observations. Identical inputs can
      have different targets. <strong>More data does not remove it.</strong></p>
    </div>
    <div class="col card accent frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Epistemic &#8212; <span class="tex" data-tex="\\boldsymbol{\\phi}^\\top\\mathbf{S}_N\\boldsymbol{\\phi}"></span></div>
      <p style="font-size:20px;max-width:none">Uncertainty about the weights. Typically lower near observed inputs. <strong>More relevant data reduces it.</strong></p>
    </div>
  </div>`},

{s:"Part V", t:"Three estimates, one picture", draw:"bayes", html:`
  <div class="eyebrow">Live demo</div>

{s:"Part V", t:"Back to the car, properly", html:`
  <div class="eyebrow">The example we opened with</div>
  <h2 style="margin-bottom:14px">Is $15,000 reasonable?</h2>
  <div class="row top" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">With maximum likelihood</div>

      <div class="eq" style="margin:9px 0 0;font-size:20px"><span class="texd" data-tex="\\sigma^2(x) = \\beta^{-1} + \\boldsymbol{\\phi}(x)^\\top\\mathbf{S}_N\\boldsymbol{\\phi}(x)"></span></div>

{s:"Part V", t:"Why this matters now", html:`
  <div class="eyebrow">The same distinction elsewhere</div>
  <h2 style="margin-bottom:12px">A point estimate can miss model uncertainty</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:20.5px">Training gives one point estimate:</p>
      <div class="eq" style="margin:10px 0 12px;font-size:22px"><span class="texd" data-tex="\\widehat{\\mathbf{w}} = \\arg\\max_{\\mathbf{w}}\\ \\log p(\\mathcal{D}\\mid\\mathbf{w}) + \\log p(\\mathbf{w})"></span></div>
      <p style="font-size:20.5px">With one <span class="tex" data-tex="\\widehat{\\mathbf{w}}"></span>, we report one output distribution:</p>
      <div class="eq" style="margin:10px 0 0;font-size:22px"><span class="texd" data-tex="p(t \\mid x, \\widehat{\\mathbf{w}}) \\quad\\Rightarrow\\quad \\sigma^2 = \\underbrace{\\beta^{-1}}_{\\text{aleatoric only}}"></span></div>
      <p class="caption" style="margin-top:9px">For a language model, this is a distribution over the next token.</p>
    </div>
    <div class="col">
      <div class="card accent">
        <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">What is missing</div>
        <p style="font-size:20.5px;max-width:none">The distribution over the parameters:</p>
        <div class="eq" style="margin:10px 0 8px;font-size:22px"><span class="texd" data-tex="p(\\mathbf{w} \\mid \\mathcal{D})"></span></div>
        <p style="font-size:20.5px;max-width:none">One output distribution does not separately describe uncertainty about the parameters.</p>
      </div>
      <p class="caption frag" data-f="0" style="margin-top:12px">We can compute this exactly for Bayesian linear regression. For large models, it is harder.</p>
    </div>
  </div>`},

{s:"Part V", t:"Summary", html:`
  <div class="eyebrow">Today &#183; the loss</div>
  <h2 style="margin-bottom:12px">Deriving the loss and regulariser</h2>
  <div class="eq" style="margin:4px 0 16px;font-size:31px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = \\underbrace{\\tfrac12\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2}_{\\text{likelihood}} + \\underbrace{\\tfrac{\\lambda}{2}\\lVert\\mathbf{w}\\rVert_2^2}_{\\text{prior}}"></span></div>
  <div class="row top" style="gap:26px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">The first term</div>
      <p style="font-size:20px;max-width:none">The <strong>negative log-likelihood</strong> of
      Gaussian noise.</p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px">The second term</div>
      <p style="font-size:20px;max-width:none">The <strong>negative log-prior</strong> of a
      zero-mean Gaussian on the weights.</p>
    </div>
    <div class="col card accent frag" data-f="2">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">And <span class="tex" data-tex="\\lambda"></span></div>
      <div class="eq" style="margin:2px 0 8px;font-size:21px"><span class="texd" data-tex="\\lambda = \\alpha/\\beta = \\sigma_\\varepsilon^2/\\sigma_w^2"></span></div>
      <p style="font-size:20px;max-width:none">The ratio of the two variances.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:14px;text-align:center">
    The likelihood fits the observations. The prior regularises the parameters.</p>`},

{s:"Part V", t:"Predictions and uncertainty", html:`
  <div class="eyebrow">Today &#183; the predictions</div>

      <div class="eq" style="margin:2px 0 6px;font-size:23px"><span class="texd" data-tex="p(t \\mid x, \\mathcal{D}) = \\int \\underbrace{p(t \\mid x, \\mathbf{w})}_{\\text{model}}\\,\\underbrace{p(\\mathbf{w} \\mid \\mathcal{D})}_{\\text{posterior}}\\,d\\mathbf{w}"></span></div>
      <p class="caption" style="margin:0 0 14px">Average over weights using the sum and product rules.</p>
      <div class="eq frag" data-f="0" style="margin:0 0 6px;font-size:23px"><span class="texd" data-tex="\\sigma^2(x) = \\underbrace{\\beta^{-1}}_{\\text{aleatoric}} + \\underbrace{\\boldsymbol{\\phi}(x)^\\top\\mathbf{S}_N\\boldsymbol{\\phi}(x)}_{\\text{epistemic}}"></span></div>
      <p class="caption frag" data-f="0" style="margin:0">The predictive variance has two sources.</p>
    </div>
    <div class="col" style="flex:.95">
      <div class="card frag" data-f="1">
        <div class="eyebrow" style="margin-bottom:8px">Aleatoric &#8212; <span class="tex" data-tex="\\beta^{-1}"></span></div>
        <p style="font-size:19.5px;max-width:none">Noise in the observations. More data does not
        reduce it.</p>
      </div>
      <div class="card accent frag" data-f="1" style="margin-top:12px">
        <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Epistemic &#8212; <span class="tex" data-tex="\\boldsymbol{\\phi}^\\top\\mathbf{S}_N\\boldsymbol{\\phi}"></span></div>
        <p style="font-size:19.5px;max-width:none">Uncertainty about <span class="tex" data-tex="\\mathbf{w}"></span>. More relevant data reduces it.</p>

{s:"Part V", t:"Key ideas — the probability", html:`
  <div class="eyebrow">Recap &#183; 1 of 2</div>
  <h2 style="margin-bottom:16px">Key probability concepts</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Two rules</div>
      <p style="font-size:20px;max-width:none"><strong>Sum</strong> sums or integrates over a variable.
      <strong>Product</strong> relates joint and conditional distributions. Together they give Bayes&#8217; rule.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Likelihood</div>
      <p style="font-size:20px;max-width:none"><span class="tex" data-tex="p(\\mathcal{D} \\mid \\theta)"></span> as a function of <span class="tex" data-tex="\\theta"></span>, with the data fixed. It is not a distribution over <span class="tex" data-tex="\\theta"></span>.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Maximum likelihood</div>
      <p style="font-size:20px;max-width:none">Choose the parameter that maximises the likelihood of the observed data.</p>
    </div>
  </div>`},

{s:"Part V", t:"Key ideas — what it bought", html:`

/* Per-slide delivery estimate in minutes. Used for the overview cumulative marks
   and the presenter clock's "vs plan" readout.
   CALIBRATED 11 Aug 2026: the first delivery of this deck planned at 153 min and
   ran 95, so every figure here is an earlier estimate scaled by 0.62. If you add a
   slide, write what you actually expect to spend -- these numbers are now real
   minutes, not the optimistic ones. */
const EST=[0.6, 1.0, 0.2, 1.1, 1.4, 1.3, 1.2, 1.5, 1.7, 0.8, 0.8, 0.2, 1.7, 1.4, 1.3, 1.4, 1.9, 1.7, 1.4, 1.0, 0.9, 1.4, 1.2, 1.0, 1.5, 1.9, 0.8, 1.1, 0.2, 1.2, 1.4, 1.9, 2.2, 1.7, 1.3, 1.7, 0.7, 1.1, 0.2, 1.7, 1.9, 0.9, 1.1, 2.3, 1.9, 1.2, 1.3, 0.8, 1.1, 0.2, 1.3, 2.0, 1.7, 1.4, 2.3, 1.7, 1.5, 0.8, 0.2, 1.8, 1.7, 1.7, 1.3, 2.0, 1.3, 1.4, 0.2, 1.3, 1.1, 0.9, 0.9, 0.6, 0.3];
const EST_TOTAL=EST.reduce((a,b)=>a+b,0);
const cumMin=i=>EST.slice(0,i+1).reduce((a,b)=>a+(b||0),0);

const canvas=document.getElementById('canvas');
let idx=0,fragStep=0,drawnIdx=-1;
canvas.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}</section>`).join('');
const slides=[...canvas.querySelectorAll('.slide')];

function fragsOf(i){
  const f=[...slides[i].querySelectorAll('.frag')];
  return {list:f,max:f.length?Math.max(...f.map(e=>+(e.dataset.f||0))):-1};
}
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  fragsOf(idx).list.forEach(e=>e.classList.toggle('on',(+(e.dataset.f||0))<fragStep));
  document.getElementById('progress').style.width=((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('pagenum').textContent=`${idx+1} / ${SLIDES.length}`;
  if(t0!==null) updClock();
  /* Draw only on slide ENTRY. Redrawing on every fragment step replaces the whole
     svg, and the re-rasterised text visibly flickers ("the graph font changes when
     the box appears"). Demo listeners call their draw functions directly. */
  const d=SLIDES[idx].draw; if(d&&DRAW[d]&&drawnIdx!==idx) requestAnimationFrame(DRAW[d]);
  drawnIdx=idx;
  /* play video on the slide we just entered, pause and rewind everywhere else */
  slides.forEach((s,i)=>s.querySelectorAll('video').forEach(v=>{
    if(i===idx){ v.playbackRate=+(v.dataset.rate||1); v.play().catch(()=>{}); }
    else if(!v.paused||v.currentTime){ v.pause(); v.currentTime=0; }
  }));
  /* Leaving the slide has to REMOVE the iframe, not pause it: playback cannot be controlled
     across origins without pulling in the YouTube JS API, and an iframe left behind on a
     hidden slide keeps playing audio. */
  document.querySelectorAll('.ytwrap.live').forEach(w=>{
    if(+w.closest('.slide').dataset.i !== idx) closeYT(w);
  });
}
function leave(){ const s=slides[idx]; s.classList.add('leaving');
  setTimeout(()=>s.classList.remove('leaving'),160);
  /* Demos with a default choice reset on slide change, so a slide always opens on that
     choice rather than on whatever was clicked the last time through. Not on paint() --
     that also runs on every fragment step, which would undo a click mid-slide. */
  if(typeof resetDemos==='function') resetDemos(); }
function go(n){ if(n<0||n>=SLIDES.length)return; saveInk(); leave(); idx=n; fragStep=fragsOf(idx).max+1; paint(); loadInk(idx); }
function next(){ const {max}=fragsOf(idx);
  if(fragStep<=max){fragStep++;paint();}
  else if(idx<SLIDES.length-1){saveInk();leave();idx++;fragStep=0;paint();loadInk(idx);} }
function prev(){ if(fragStep>0){fragStep--;paint();}
  else if(idx>0){saveInk();leave();idx--;fragStep=fragsOf(idx).max+1;paint();loadInk(idx);} }

function fit(){ canvas.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)*.955})`; }
addEventListener('resize',fit); fit();

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  /* the browser's own shortcuts are the browser's: Cmd/Ctrl-P prints, Cmd-R reloads,
     Cmd-T opens a tab. Without this the deck swallowed all of them -- and calling
     preventDefault on Cmd-P is what stopped the print dialog from ever appearing. */
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  /* arrows belong to a focused slider, not to navigation */
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown') return;
    if(k==='d'||k==='t'||k==='o'||k==='b') return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  else if(k==='o')toggleOv(); else if(k==='t')cycleTheme();
  else if(k==='b')document.body.classList.toggle('blank');
  else if(k==='d'){e.preventDefault();toggleInk();}
  else if(k==='p'){e.preventDefault();window.print();}
  else if(k==='k'){e.preventDefault();toggleClock();}
  else if(k==='c'&&document.body.classList.contains('inking'))clearInk();
  else if(k==='e'&&document.body.classList.contains('inking'))setEraser(!erasing);
  else if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(e.key==='Escape')ov.classList.remove('on');
});

/* ---------- minimal Python syntax highlighting ---------- */
const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;
function highlight(){
  /* Placeholders are delimited by private-use code points and indexed with a
     LETTER, not a digit: a digit index would be re-matched by the number rule. */
  const OPEN='', CLOSE='';
  document.querySelectorAll('pre.code').forEach(function(pre){
    if(pre.dataset.hl) return; pre.dataset.hl='1';
    let h=pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const stash=[];
    const keep=function(html){ stash.push(html); return OPEN+String.fromCharCode(65+stash.length-1)+CLOSE; };
    h=h.replace(/#[^\n]*/g, function(m){ return keep('<span class="tok-com">'+m+'</span>'); });
    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    h=h.replace(/\b([A-Za-z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
    h=h.replace(new RegExp(OPEN+'([A-Z])'+CLOSE,'g'), function(_,c){ return stash[c.charCodeAt(0)-65]; });
    pre.innerHTML=h;
  });
}

/* Render every data-tex node. Re-runnable: demos that rewrite innerHTML call it again.
   Falls back to the raw LaTeX so a bad macro can never blank a slide. */
function renderTeX(){
  if(typeof katex==='undefined'){ setTimeout(renderTeX,40); return; }
  document.querySelectorAll('[data-tex]').forEach(function(el){

    try{ katex.render(el.dataset.tex, el,
      {displayMode: el.classList.contains('texd'), throwOnError:false, output:'html',
       /* \htmlClass lets an equation colour its own parts through CSS variables, so
          colour coding follows the theme instead of freezing to the paper palette. */
       trust: c => c.command === '\\htmlClass', strict: false}); }

/* ============================================================
   LECTURE 2 DEMOS
   Same conventions as Lecture 1: each draw function rebuilds the innerHTML of one
   SVG, and paint() calls it through the DRAW registry when its slide is entered.
   ============================================================ */
const NPDF=(x,m,s2)=>Math.exp(-(x-m)*(x-m)/(2*s2))/Math.sqrt(2*Math.PI*s2);
const LPDF=(x,m,b)=>Math.exp(-Math.abs(x-m)/b)/(2*b);
function lin(a,b,n){const o=[];for(let i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o;}
function pathOf(pts){return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');}
/* Gauss-Jordan inverse — small matrices only, which is all we need here. */
function inv(A){
  const n=A.length, M=A.map((r,i)=>r.concat(Array.from({length:n},(_,j)=>i===j?1:0)));
  for(let c=0;c<n;c++){
    let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    const t=M[c];M[c]=M[p];M[p]=t;
    const d=M[c][c]||1e-12;
    for(let j=0;j<2*n;j++) M[c][j]/=d;
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c];
      if(!f) continue; for(let j=0;j<2*n;j++) M[r][j]-=f*M[c][j]; }
  }
  return M.map(r=>r.slice(n));
}
const matvec=(A,v)=>A.map(r=>r.reduce((s,a,i)=>s+a*v[i],0));
/* Deterministic pseudo-randomness: a demo that rerolls on every repaint is unusable in
   front of a room, so every draw is seeded. */
function lcg(seed){ let x=seed>>>0; return function(){ x=(x*1664525+1013904223)>>>0; return (x>>>8)/16777216; }; }
function gauss(r){ let u=0,v=0; while(u===0)u=r(); while(v===0)v=r();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0);
/* Cholesky: lower-triangular L with L L^T = A, for sampling a multivariate Gaussian. */
function chol(A){
  const n=A.length, L=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<=i;j++){
    let sum=A[i][j];
    for(let k=0;k<j;k++) sum-=L[i][k]*L[j][k];
    if(i===j) L[i][j]=Math.sqrt(Math.max(sum,1e-12));
    else      L[i][j]=sum/(L[j][j]||1e-12);
  }
  return L;
}

const LIK_T=[-1.1,-0.4,0.2,0.6,1.4];
let LIK_MU=-1.6;
const likL=m=>LIK_T.reduce((p,t)=>p*NPDF(t,m,1),1);

  s+='<path d="'+pathOf(pts)+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  LIK_T.forEach(t=>{ const p=NPDF(t,LIK_MU,1), py=y0+hgt-hgt*p/NPDF(0,0,1);
    s+='<line x1="'+X(t)+'" y1="'+(y0+hgt)+'" x2="'+X(t)+'" y2="'+py+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="2 3" opacity=".75"/>';

  s+='<line x1="'+ML+'" y1="'+(y0+hgt)+'" x2="'+(W-MR)+'" y2="'+(y0+hgt)+'" class="axis"/>';
  s+='<line x1="'+X(LIK_MU)+'" y1="'+y0+'" x2="'+X(LIK_MU)+'" y2="'+(y0+hgt)+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4" opacity=".8"/>';
  s+='<text class="legend" x="'+ML+'" y="'+(y0-8)+'">the five observations, and a Gaussian centred at &#956;</text>';
  /* lower panel: likelihood as mu moves */
  const ly=178, lh=88, MUS=lin(-4,4,200);
  const peak=Math.max.apply(null,MUS.map(likL));
  const lp=MUS.map(m=>[X(m), ly+lh-lh*likL(m)/peak]);
  s+='<path d="'+pathOf(lp)+'" fill="none" stroke="var(--accent2)" stroke-width="2.6"/>';
  s+='<line x1="'+ML+'" y1="'+(ly+lh)+'" x2="'+(W-MR)+'" y2="'+(ly+lh)+'" class="axis"/>';
  const cy=ly+lh-lh*likL(LIK_MU)/peak;
  s+='<line x1="'+X(LIK_MU)+'" y1="'+cy+'" x2="'+X(LIK_MU)+'" y2="'+(ly+lh)+'" stroke="var(--accent2)" stroke-width="1.4" stroke-dasharray="5 4"/>';
  s+='<circle cx="'+X(LIK_MU)+'" cy="'+cy+'" r="5.5" fill="var(--accent2)"/>';
  s+='<text class="legend" x="'+ML+'" y="'+(ly-8)+'">likelihood, as a function of &#956;</text>';
  [-4,-2,0,2,4].forEach(v=>s+='<text class="tick" x="'+X(v)+'" y="'+(ly+lh+18)+'" text-anchor="middle">'+v+'</text>');
  g.innerHTML=s;
  const L=likL(LIK_MU);
  const mant=L.toExponential(1).split('e')[0], ex=L.toExponential(1).split('e')[1];
  const el=document.getElementById('likval');
  if(el) el.innerHTML=mant+'&#215;10<sup>'+ex+'</sup>';
  const lg=document.getElementById('liklog'); if(lg) lg.textContent=Math.log(L).toFixed(1);
  const mu=document.getElementById('likmuv'); if(mu) mu.textContent=LIK_MU.toFixed(2);
  const best=LIK_T.reduce((a,b)=>a+b,0)/LIK_T.length;
  const wn=document.getElementById('likwarn');
  if(wn) wn.innerHTML = Math.abs(LIK_MU-best)<0.06
    ? 'The peak sits at the <strong>sample mean</strong>, '+best.toFixed(2)+'. This is what maximum likelihood returns.'
    : 'Move &#956; to the peak of the likelihood curve. Each observation contributes a density value; multiplying these gives the likelihood.';
}

/* ---------------------------------------------------------------- noise choice -> loss */
let NOISE='gauss';
function drawNoise(){
  const svg=document.getElementById('nsvg'); if(!svg) return;
  const W=560,H=236,ML=44,MR=14,MT=18,MB=40, half=(W-ML-MR-52)/2;
  /* Matched variance, so the comparison is fair: Laplace with b = 1/sqrt(2) also has
     variance 1. They cross at |x| = 0.49 and again at |x| = 2.34; past the second
     crossing the Laplace tail is the heavier one, which is the whole point and is
     invisible on a linear axis. */
  const b=1/Math.SQRT2, R=6;
  const lgG=v=>-v*v/2 - 0.5*Math.log(2*Math.PI);
  const lgL=v=>-Math.abs(v)/b - Math.log(2*b);
  const sel=NOISE;
  let g='';
  /* ---- left: the densities, linear ---- */
  (function(){
    const x0=ML, X=v=>x0+half*(v+R)/(2*R), Y=p=>H-MB-(H-MT-MB)*p/0.75;
    g+='<text class="legend" x="'+(x0+half/2)+'" y="'+(MT+2)+'" text-anchor="middle">density  p(&#949;)</text>';
    g+='<line class="axis" x1="'+x0+'" y1="'+(H-MB)+'" x2="'+(x0+half)+'" y2="'+(H-MB)+'"/>';
    [[lgG,'var(--accent2)',sel==='gauss',false],[lgL,'var(--accent)',sel==='laplace',true]].forEach(([f,c,on,dash])=>{
      const pts=lin(-R,R,300).map(v=>[X(v),Y(Math.exp(f(v)))]);
      g+='<path d="'+pathOf(pts)+'" fill="none" stroke="'+c+'" stroke-width="'+(on?2.8:1.5)+'"'
       + ' opacity="'+(on?1:.42)+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; });
    [-5,0,5].forEach(v=>g+='<text class="tick" x="'+X(v)+'" y="'+(H-MB+16)+'" text-anchor="middle">'+v+'</text>');
  })();
  /* ---- right: log density, where the tails separate ---- */
  (function(){
    const x0=ML+half+52, X=v=>x0+half*(v+R)/(2*R);
    const LO=-20, HI=0, Y=l=>MT+14+(H-MT-MB-14)*(HI-l)/(HI-LO);
    g+='<text class="legend" x="'+(x0+half/2)+'" y="'+(MT+2)+'" text-anchor="middle">log p(&#949;)   &#8212;   the loss, negated</text>';
    for(let l=0;l>=-20;l-=5){
      g+='<line class="gridline" x1="'+x0+'" y1="'+Y(l)+'" x2="'+(x0+half)+'" y2="'+Y(l)+'"/>'
       + '<text class="tick" x="'+(x0-6)+'" y="'+(Y(l)+4)+'" text-anchor="end">'+l+'</text>'; }
    [[lgG,'var(--accent2)',sel==='gauss',false],[lgL,'var(--accent)',sel==='laplace',true]].forEach(([f,c,on,dash])=>{
      const pts=lin(-R,R,300).map(v=>[X(v),Y(Math.max(f(v),LO))]);
      g+='<path d="'+pathOf(pts)+'" fill="none" stroke="'+c+'" stroke-width="'+(on?2.8:1.7)+'"'
       + ' opacity="'+(on?1:.5)+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>'; });
    /* Mark the outer crossing and the gap past it. The label goes in the empty wedge
       under the peak — anywhere near the crossing itself lands on top of a curve. */

/* ---------------------------------------------------------------- Bayesian coin flip */
const COIN=[0,0.2,0.8,1.0];
let CPOST=[0.25,0.25,0.25,0.25], CH=0, CT=0;
function drawCoin(){
  const svg=document.getElementById('csvg'); if(!svg) return;
  const W=560,H=300,ML=52,MR=16,MT=26,MB=46;
  const bw=(W-ML-MR)/COIN.length;
  let s='<text class="legend" x="'+ML+'" y="'+(MT-8)+'">posterior belief over &#952;</text>';
  for(let p=0;p<=1.001;p+=0.25){ const y=H-MB-(H-MT-MB)*p;
    s+='<line class="gridline" x1="'+ML+'" y1="'+y+'" x2="'+(W-MR)+'" y2="'+y+'"/>'
     + '<text class="tick" x="'+(ML-8)+'" y="'+(y+4)+'" text-anchor="end">'+(p*100).toFixed(0)+'%</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  const top=Math.max.apply(null,CPOST);
  COIN.forEach((th,i)=>{
    const h=(H-MT-MB)*CPOST[i], x=ML+i*bw+bw*0.22, w=bw*0.56;
    const hot=CPOST[i]>=top-1e-9;
    s+='<rect x="'+x+'" y="'+(H-MB-h)+'" width="'+w+'" height="'+h+'" rx="4" fill="'+(hot?'var(--accent)':'var(--ink-soft)')+'" opacity="'+(hot?1:.55)+'"/>';
    s+='<text class="tick" x="'+(x+w/2)+'" y="'+(H-MB+18)+'" text-anchor="middle">&#952; = '+th+'</text>';
    s+='<text class="legend" x="'+(x+w/2)+'" y="'+(H-MB-h-7)+'" text-anchor="middle">'+(CPOST[i]*100).toFixed(1)+'%</text>';
  });
  svg.innerHTML=s;
  const n=CH+CT;
  document.getElementById('cobs').textContent = n? (CH+'H '+CT+'T') : '—';
  const mle = n? (CH/n).toFixed(2) : '—';
  document.getElementById('cmle').textContent = mle;
  const wn=document.getElementById('cwarn');
  if(n===0) wn.innerHTML='Flip a few times, and compare the MLE with the posterior after the first flip.';
  else if(n===1) wn.innerHTML='After one observation, MLE is <strong>'+mle+'</strong>. The posterior retains candidates with non-zero prior probability and likelihood.';
  else if(CH===n) wn.innerHTML='All flips are heads. MLE gives &#952; = 1.00, but the posterior still assigns probability to &#952; = 0.8 after just '+n+' flips.';
  else if(CT===n) wn.innerHTML='All flips are tails. The result mirrors the all-heads case.';
  else wn.innerHTML='Once we observe both heads and tails, &#952; = 0 and &#952; = 1 have zero likelihood and zero posterior probability.';
}
function coinFlip(head){
  CPOST=CPOST.map((p,i)=>p*(head?COIN[i]:1-COIN[i]));
  const z=CPOST.reduce((a,b)=>a+b,0);
  CPOST = z>0 ? CPOST.map(p=>p/z) : [0.25,0.25,0.25,0.25];
  if(head) CH++; else CT++;
  drawCoin();
}

/* ---------------------------------------------------------------- MLE / MAP / posterior */
let BMODE='mle', BN=6;
const B_ALL_X=[0.04,0.13,0.21,0.30,0.38,0.47,0.55,0.63,0.72,0.80,0.88,0.94,0.09,0.17,0.26,0.34,0.43,0.51,0.60,0.68,0.76,0.85,0.92,0.98,0.11];
const B_TRUE=x=>Math.sin(2*Math.PI*x);
const B_NOISE=[0.19,-0.21,0.08,-0.14,0.24,-0.09,0.17,-0.26,0.05,0.21,-0.18,0.10,-0.23,0.13,0.06,-0.11,0.20,-0.07,0.15,-0.19,0.09,0.23,-0.12,0.04,-0.16];
const B_M=8, B_ALPHA=2.0, B_BETA=25.0;
const bPhi=x=>{const o=[1];for(let j=1;j<B_M;j++){const mu=(j-1)/(B_M-2);o.push(Math.exp(-Math.pow(x-mu,2)/(2*0.09)));}return o;};
function drawBayes(){
  const svg=document.getElementById('bsvg'); if(!svg) return;
  const W=560,H=300,ML=42,MR=16,MT=16,MB=38;
  const X=x=>ML+(W-ML-MR)*x, Y=t=>MT+(H-MT-MB)*(1.9-t)/3.8;
  const xs=B_ALL_X.slice(0,BN), ts=xs.map((x,i)=>B_TRUE(x)+B_NOISE[i]);
  const PH=xs.map(bPhi);
  let A=Array.from({length:B_M},(_,i)=>Array.from({length:B_M},(_,j)=>
      (BMODE==='mle'?0:B_ALPHA)*(i===j?1:0) + B_BETA*PH.reduce((s,p)=>s+p[i]*p[j],0)));
  if(BMODE==='mle') for(let i=0;i<B_M;i++) A[i][i]+=1e-6;      /* keep it invertible */
  const SN=inv(A);
  const rhs=Array.from({length:B_M},(_,i)=>B_BETA*PH.reduce((s,p,n)=>s+p[i]*ts[n],0));
  const mN=matvec(SN,rhs);
  let s='';
  for(let t=-1.5;t<=1.51;t+=0.75){ s+='<line class="gridline" x1="'+ML+'" y1="'+Y(t)+'" x2="'+(W-MR)+'" y2="'+Y(t)+'"/>'
    + '<text class="tick" x="'+(ML-8)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t.toFixed(1)+'</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  const grid=lin(0,1,120);
  /* the truth, for reference */
  s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(B_TRUE(x))]))+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="5 4" opacity=".75"/>';
  if(BMODE==='post'){
    const up=[],dn=[];
    grid.forEach(x=>{ const p=bPhi(x), m=dot(mN,p);
      const v=1/B_BETA + dot(p,matvec(SN,p)), sd=Math.sqrt(v);
      up.push([X(x),Y(m+2*sd)]); dn.push([X(x),Y(m-2*sd)]); });
    s+='<path d="'+pathOf(up)+' L'+dn.slice().reverse().map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z" fill="var(--accent)" opacity=".15"/>';
  }
  s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(dot(mN,bPhi(x)))]))+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  xs.forEach((x,i)=>{ s+='<circle class="datapt" cx="'+X(x)+'" cy="'+Y(ts[i])+'" r="4.6"/>'; });
  s+='<g transform="translate('+(W-172)+','+(MT+4)+')">'
   + '<line x1="0" y1="0" x2="22" y2="0" stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="5 4"/>'
   + '<text class="legend" x="29" y="4">truth</text></g>';
  svg.innerHTML=s;
  document.querySelectorAll('[data-b]').forEach(b=>b.classList.toggle('sel',b.dataset.b===BMODE));
  const wn=document.getElementById('bwarn');
  if(BMODE==='mle') wn.innerHTML='MLE uses no prior. With few observations, the curve can vary sharply between them. The noise term &#946;&#8315;&#185; gives a prediction variance, but this point estimate <strong>does not represent uncertainty about the weights</strong>.';
  else if(BMODE==='map') wn.innerHTML='The prior favours weights near zero and reduces curvature between observations. MAP still returns one curve and <strong>does not represent uncertainty about the weights</strong>.';
  else wn.innerHTML='The full posterior describes uncertainty about the weights. The band shows &#177;2 standard deviations and <strong>widens away from the data</strong>. MAP does not retain this uncertainty.';
}

/* ---------------------------------------------------------------- base rates */
function drawMed(){
  const g=document.getElementById('medfig'); if(!g) return;
  /* 10,000 people at 100 per dot: 100 dots. 1 ill in 100 -> 1 dot ill. Too coarse.
     Use 1 dot = 50 people: 200 dots, 2 ill. Still coarse. So: one dot = 25 people,
     400 dots, 4 ill — enough to see the two positive groups are the same size. */
  const COLS=25, ROWS=16, N=COLS*ROWS, PER=10000/N;
  const nIll=Math.round(100/PER);                  /* 1% are ill */
  const cell=16.8, x0=14, y0=8;
  let s='';
  for(let i=0;i<N;i++){
    const cx=x0+(i%COLS)*cell+cell/2, cy=y0+Math.floor(i/COLS)*cell+cell/2;
    const ill = i<nIll;
    /* positives: 99% of the ill, and 1% of the well */
    const posIll  = ill && i<Math.round(nIll*0.99);
    const posWell = !ill && (i-nIll) < Math.round((N-nIll)*0.01);
    const pos = posIll||posWell;
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(pos?5.4:4)+'"'
     + ' fill="'+(ill?'var(--accent2)':'var(--rule)')+'"'
     + (pos?' stroke="var(--accent)" stroke-width="2"':'')+'/>';
  }
  const yl=y0+ROWS*cell+16;
  s+='<circle cx="22" cy="'+(yl-4)+'" r="5" fill="var(--accent2)"/>'
   + '<text class="legend" x="33" y="'+yl+'">ill (1%)</text>'
   + '<circle cx="120" cy="'+(yl-4)+'" r="5.4" fill="var(--rule)" stroke="var(--accent)" stroke-width="2"/>'
   + '<text class="legend" x="132" y="'+yl+'">well, but tested positive</text>'
   + '<circle cx="330" cy="'+(yl-4)+'" r="5.4" fill="var(--accent2)" stroke="var(--accent)" stroke-width="2"/>'
   + '<text class="legend" x="342" y="'+yl+'">ill and positive</text>';
  g.innerHTML=s;
}

/* ---------------------------------------------------------------- averaging over weights
   The integral in the posterior predictive is hard to picture, so make it finite: draw K
   weight vectors from the posterior, plot each one's line, then average. K=1 is a point
   estimate; K large approaches the integral. This is also, literally, an ensemble. */
let ENS_K=1, ENS_SHOW=false;
function ensSamples(K){
  /* fixed seed: the same K lines every time, so the slider reads as "add more members"
     rather than "reroll everything" */
  const r=lcg(31337);
  const xs=B_ALL_X.slice(0,9), ts=xs.map((x,i)=>B_TRUE(x)+B_NOISE[i]);
  const PH=xs.map(bPhi);
  const A=Array.from({length:B_M},(_,i)=>Array.from({length:B_M},(_,j)=>
      B_ALPHA*(i===j?1:0) + B_BETA*PH.reduce((s,p)=>s+p[i]*p[j],0)));
  const SN=inv(A);
  const rhs=Array.from({length:B_M},(_,i)=>B_BETA*PH.reduce((s,p,n)=>s+p[i]*ts[n],0));
  const mN=matvec(SN,rhs);
  /* Draw properly: w = m + L z with L L^T = S_N. Perturbing each weight independently
     by its own standard deviation ignores the correlations between weights — and those
     correlations are exactly what keeps the sampled curves tight where the data is. Done
     the naive way the fan is the same width everywhere, which is the opposite of the
     point of this slide. */
  const L=chol(SN);
  const out=[];
  for(let k=0;k<K;k++){
    const z=Array.from({length:B_M},()=>gauss(r));
    out.push(mN.map((m,i)=>m+L[i].reduce((a,l,j)=>a+l*z[j],0)));
  }
  return {xs,ts,mN,SN,ws:out};
}
function drawEns(){
  const svg=document.getElementById('esvg'); if(!svg) return;
  const W=560,H=300,ML=42,MR=16,MT=16,MB=38;
  const X=x=>ML+(W-ML-MR)*x, Y=t=>MT+(H-MT-MB)*(1.9-t)/3.8;
  const {xs,ts,mN,SN,ws}=ensSamples(ENS_K);
  const grid=lin(0,1,110);
  let s='';
  for(let t=-1.5;t<=1.51;t+=0.75){ s+='<line class="gridline" x1="'+ML+'" y1="'+Y(t)+'" x2="'+(W-MR)+'" y2="'+Y(t)+'"/>'
    + '<text class="tick" x="'+(ML-8)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+t.toFixed(1)+'</text>'; }
  s+='<line class="axis" x1="'+ML+'" y1="'+(H-MB)+'" x2="'+(W-MR)+'" y2="'+(H-MB)+'"/>';
  /* each sampled weight vector is one line: one "ensemble member" */
  ws.forEach(w=>{ s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(dot(w,bPhi(x)))]))+'"'
    + ' fill="none" stroke="var(--accent2)" stroke-width="1.4" opacity="'+(0.15+0.5/Math.sqrt(ENS_K))+'"/>'; });
  if(ENS_SHOW){
    const up=[],dn=[];
    grid.forEach(x=>{ const p=bPhi(x);
      const vals=ws.map(w=>dot(w,p));
      const m=vals.reduce((a,b)=>a+b,0)/vals.length;
      const sd=Math.sqrt(vals.reduce((a,v)=>a+(v-m)*(v-m),0)/Math.max(1,vals.length-1) + 1/B_BETA);
      up.push([X(x),Y(m+2*sd)]); dn.push([X(x),Y(m-2*sd)]); });
    s+='<path d="'+pathOf(up)+' L'+dn.slice().reverse().map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' Z"'
     + ' fill="var(--accent)" opacity=".14"/>';
    s+='<path d="'+pathOf(grid.map(x=>[X(x),Y(dot(mN,bPhi(x)))]))+'" fill="none" stroke="var(--accent)" stroke-width="2.6"/>';
  }
  xs.forEach((x,i)=>{ s+='<circle class="datapt" cx="'+X(x)+'" cy="'+Y(ts[i])+'" r="4.6"/>'; });
  svg.innerHTML=s;
  const wn=document.getElementById('ewarn');
  if(ENS_K===1) wn.innerHTML='One sampled weight vector gives one curve. A single curve does not show uncertainty, including far from the data.';
  else if(ENS_K<=6) wn.innerHTML='<strong>'+ENS_K+'</strong> sampled weight vectors. Their predictions agree more closely near the data. Variation across the curves shows uncertainty about the weights.';
  else wn.innerHTML='<strong>'+ENS_K+'</strong> sampled weight vectors. Averaging more samples approximates the posterior integral more closely. A collection of models is an <strong>ensemble</strong>.';
  const b=document.getElementById('eband'); if(b) b.classList.toggle('sel',ENS_SHOW);
}

/* ---------------------------------------------------------------- axes helper (L2)

function ax2(W,H,xlo,xhi,ylo,yhi,xstep,ystep,ml){
  ml=ml||46; const mr=14,mt=14,mb=40;

    s+='<line class="gridline" x1="'+ml+'" y1="'+py+'" x2="'+(W-mr)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(py+4)+'" text-anchor="end">'+(+g.toFixed(2))+'</text>'; }
  for(let g=xlo;g<=xhi+1e-9;g+=xstep){ const px=X(g);
    s+='<line class="gridline" x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(H-mb)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(H-mb+17)+'" text-anchor="middle">'+(+g.toFixed(2))+'</text>'; }
  s+='<line class="axis" x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'"/>';
  return {s:s,X:X,Y:Y,ml:ml,mr:mr,mt:mt,mb:mb};
}
const pOf=pts=>'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');
