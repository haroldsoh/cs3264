/* ---------------------------------------------------------------- DEMO B — the generative picture
   Harold's sketch: the line y(x), a conditional Gaussian standing on its side at the
   chosen x, and targets drawn from it -- including two draws at the SAME x, which is
   the point that makes the noise model concrete. */
let LG_X=0.55, LG_S=0.28, LG_PTS=[], LG_SEED=99, LG_SHOWBAND=false;
const LG_W=[0.35,2.1];                       /* y(x) = w0 + w1 x, a straight line */
const lgY=x=>LG_W[0]+LG_W[1]*x;
function lgDraw(n){
  const r=lcg(LG_SEED); LG_SEED=(LG_SEED*1103515245+12345)>>>0;
  for(let i=0;i<n;i++) LG_PTS.push([LG_X, lgY(LG_X)+LG_S*gauss(r)]);
  drawLgen();
}
function lgSpread(){
  /* one draw at each of a spread of inputs: this is how a whole dataset appears */
  const r=lcg(LG_SEED); LG_SEED=(LG_SEED*1103515245+12345)>>>0;
  [0.08,0.2,0.32,0.44,0.56,0.68,0.8,0.92].forEach(x=>LG_PTS.push([x, lgY(x)+LG_S*gauss(r)]));
  drawLgen();
}
function lgReset(){ LG_PTS=[]; drawLgen(); }
function drawLgen(){
  const svg=document.getElementById('lgsvg'); if(!svg) return;
  const W=560,H=330, A=ax2(W,H,0,1,0,3,0.25,1);
  let g=A.s;
  g+='<text class="legend" x="'+((A.ml+W-A.mr)/2)+'" y="'+(H-3)+'" text-anchor="middle">x</text>'
   + '<text class="legend" x="'+(-(A.mt+H-A.mb)/2)+'" y="12" text-anchor="middle" transform="rotate(-90)">t</text>';
  /* the +-2 sigma band: the region the model says targets live in */
  if(LG_SHOWBAND){
    const up=lin(0,1,60).map(x=>[A.X(x),A.Y(lgY(x)+2*LG_S)]);
    const dn=lin(0,1,60).map(x=>[A.X(x),A.Y(lgY(x)-2*LG_S)]).reverse();
    g+='<path d="'+pOf(up)+' L'+dn.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')
     + ' Z" fill="var(--accent2)" opacity=".10"/>';
  }
  /* the deterministic part */
  g+='<line x1="'+A.X(0)+'" y1="'+A.Y(lgY(0))+'" x2="'+A.X(1)+'" y2="'+A.Y(lgY(1))
   + '" stroke="var(--accent2)" stroke-width="2.6" stroke-dasharray="7 5"/>'
  /* legend in the top-left, which the rising line and the samples both leave empty */
  g+='<g transform="translate('+(A.ml+12)+','+(A.mt+18)+')">'
   + '<line x1="0" y1="-4" x2="22" y2="-4" stroke="var(--accent2)" stroke-width="2.6" stroke-dasharray="7 5"/>'
   + '<text class="legend" x="29" y="0">the line y(x)</text></g>';
  /* the conditional density at LG_X, drawn on its side */
  const mu=lgY(LG_X), amp=0.17;
  const dens=lin(mu-4*LG_S,mu+4*LG_S,90).map(t=>[A.X(LG_X+amp*NPDF(t,mu,LG_S*LG_S)*LG_S*Math.sqrt(2*Math.PI)), A.Y(t)]);
  g+='<line x1="'+A.X(LG_X)+'" y1="'+A.Y(mu-4*LG_S)+'" x2="'+A.X(LG_X)+'" y2="'+A.Y(mu+4*LG_S)
   + '" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>';
  g+='<path d="'+pOf(dens)+'" fill="none" stroke="var(--s1)" stroke-width="2.6"/>';
  g+='<circle cx="'+A.X(LG_X)+'" cy="'+A.Y(mu)+'" r="4" fill="var(--accent2)"/>';
  /* label the density above its own peak, clear of the curve and of any sample */
  g+='<text class="legend" x="'+(A.X(LG_X)+8)+'" y="'+(A.Y(mu+4*LG_S)-6)+'">noise around y(x)</text>';
  /* the samples */
  LG_PTS.forEach(([x,t],i)=>{
    const atX=Math.abs(x-LG_X)<1e-9;
    g+='<circle cx="'+A.X(x)+'" cy="'+A.Y(t)+'" r="4.3" fill="var(--s2)" opacity="'+(atX?0.95:0.7)+'"/>';
    if(atX) g+='<line x1="'+A.X(x)+'" y1="'+A.Y(lgY(x))+'" x2="'+A.X(x)+'" y2="'+A.Y(t)
      + '" stroke="var(--s2)" stroke-width="1.3" stroke-dasharray="2 3" opacity=".8"/>';
  });

  svg.innerHTML=g;
  const xs=document.getElementById('lgxv'), ss=document.getElementById('lgsv'), nn=document.getElementById('lgn');
  if(xs) xs.textContent=LG_X.toFixed(2);
  if(ss) ss.textContent=LG_S.toFixed(2);
  if(nn) nn.textContent=LG_PTS.length;
  const same=LG_PTS.filter(p=>Math.abs(p[0]-LG_X)<1e-9).length;
  const wn=document.getElementById('lgwarn');
  if(wn) wn.innerHTML = same>=2
    ? '<strong>' + same + ' targets at the same x</strong>. They have the same '
      + 'y(x), but different samples of &#949;, as described by <em>t = y(x) + &#949;</em>.'
    : (LG_PTS.length ? 'Each target is y(x) plus a sample of &#949;. Draw another target at the same x.'
                     : 'The dashed line is y(x). The sideways curve shows the target distribution at the selected x.');
}

/* ---------------------------------------------------------------- DEMO C — what lambda is a ratio of
   Two densities side by side -- the noise on the targets, the prior on the weights --
   and the lambda they imply, with the fit that results. */
let LV_SE=0.30, LV_SW=1.20;
function drawLamviz(){
  const svg=document.getElementById('lvsvg'); if(!svg) return;
  const W=560,H=250, half=(W-60)/2;
  let g='';
  const panel=(x0,sd,col,lab,sub)=>{
    const A={ml:x0,mt:16,mb:40};
    const R=2.6, X=v=>x0+half*(v+R)/(2*R), Y=p=>H-40-(H-56)*p/1.45;
    let s='<line class="axis" x1="'+x0+'" y1="'+(H-40)+'" x2="'+(x0+half)+'" y2="'+(H-40)+'"/>';
    s+='<path d="'+pOf(lin(-R,R,160).map(v=>[X(v),Y(NPDF(v,0,sd*sd))]))+'" fill="none" stroke="'+col+'" stroke-width="2.8"/>';
    s+='<line x1="'+X(-sd)+'" y1="'+(H-40)+'" x2="'+X(-sd)+'" y2="'+Y(NPDF(-sd,0,sd*sd))+'" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="3 3"/>'
     + '<line x1="'+X(sd)+'" y1="'+(H-40)+'" x2="'+X(sd)+'" y2="'+Y(NPDF(sd,0,sd*sd))+'" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="3 3"/>';
    s+='<text class="legend" x="'+(x0+half/2)+'" y="14" text-anchor="middle">'+lab+'</text>';
    s+='<text class="tick" x="'+(x0+half/2)+'" y="'+(H-22)+'" text-anchor="middle">'+sub+'</text>';
    return s;
  };
  const sub=t=>'&#963;<tspan dy="4" style="font-size:11px">'+t+'</tspan><tspan dy="-4"> = </tspan>';
  g+=panel(46,LV_SE,'var(--s2)','noise on the targets',sub('&#949;')+LV_SE.toFixed(2));
  g+=panel(46+half+28,LV_SW,'var(--s1)','prior on each weight',sub('w')+LV_SW.toFixed(2));
  svg.innerHTML=g;
  const lam=(LV_SE*LV_SE)/(LV_SW*LV_SW);
  const a=document.getElementById('lvse'), b=document.getElementById('lvsw'), c=document.getElementById('lvlam');
  if(a) a.textContent=LV_SE.toFixed(2);
  if(b) b.textContent=LV_SW.toFixed(2);
  if(c) c.textContent=lam<0.01?lam.toExponential(1):lam.toFixed(3);
  const wn=document.getElementById('lvwarn');
  if(wn){
    /* bands chosen so each sentence is true across its whole range: lambda near 1
       means the two terms are comparable, which 0.063 is not. */
    if(lam>=2) wn.innerHTML='<strong>More noise relative to the prior spread.</strong> The regularisation coefficient is large, '
      + 'so the fitted weights shrink.';
    else if(lam>=0.5) wn.innerHTML='&#963;&#949; and &#963;w are comparable, so &#955; is near 1: '
      + 'the penalty and the error term carry similar weight in the objective.';
    else wn.innerHTML='The prior is wide relative to the noise, so &#955; is small and the objective '
      + 'is close to the least-squares loss.';
  }
}

/* ---------------------------------------------------------------- pmf vs pdf
   The distinction the rest of the lecture leans on: a bar IS a probability, a
   curve's HEIGHT is not. The sigma slider drives the peak above 1 on purpose --
   that is the fact that makes "a likelihood is not a probability" land later. */
let DIST_MODE='pmf', DIST_S=1.0;
const PMF=[0.05,0.12,0.22,0.28,0.19,0.10,0.04];
function drawDist(){
  const svg=document.getElementById('dsvg'); if(!svg) return;
  const W=560,H=290, ml=52,mr=16,mt=22,mb=46;
  const plotW=W-ml-mr, plotH=H-mt-mb;
  let g='';
  const Y=p=>mt+plotH-(plotH*p/1.75);
  for(let p=0;p<=1.75;p+=0.25){
    g+='<line class="gridline" x1="'+ml+'" y1="'+Y(p)+'" x2="'+(W-mr)+'" y2="'+Y(p)+'"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(Y(p)+4)+'" text-anchor="end">'+p.toFixed(2)+'</text>'; }
  /* the p = 1 line matters in both modes, for opposite reasons */
  g+='<line x1="'+ml+'" y1="'+Y(1)+'" x2="'+(W-mr)+'" y2="'+Y(1)+'" stroke="var(--accent)" '
   + 'stroke-width="1.6" stroke-dasharray="6 4" opacity=".8"/>'
   + '<text class="legend" x="'+(W-mr-2)+'" y="'+(Y(1)-7)+'" text-anchor="end" fill="var(--accent)">1</text>';
  g+='<line class="axis" x1="'+ml+'" y1="'+(mt+plotH)+'" x2="'+(W-mr)+'" y2="'+(mt+plotH)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(mt+plotH)+'"/>';
  if(DIST_MODE==='pmf'){
    const n=PMF.length, bw=plotW/n;
    PMF.forEach((p,i)=>{
      const x=ml+i*bw+bw*0.16, w=bw*0.68;
      g+='<rect x="'+x+'" y="'+Y(p)+'" width="'+w+'" height="'+(mt+plotH-Y(p))+'" rx="3" fill="var(--s1)" opacity=".85"/>'
       + '<text class="matn" x="'+(x+w/2)+'" y="'+(Y(p)-7)+'" text-anchor="middle" style="font-size:14px">'+p.toFixed(2)+'</text>'
       + '<text class="tick" x="'+(x+w/2)+'" y="'+(mt+plotH+18)+'" text-anchor="middle">'+i+'</text>'; });
    g+='<text class="legend" x="'+(ml+plotW/2)+'" y="'+(H-8)+'" text-anchor="middle">number of heads in 6 tosses</text>';
  }else{
    const R=3.2, X=v=>ml+plotW*(v+R)/(2*R);
    const pdf=v=>Math.exp(-v*v/(2*DIST_S*DIST_S))/(DIST_S*Math.sqrt(2*Math.PI));
    /* shaded area = the thing that IS a probability */
    let area='M'+X(-1)+','+(mt+plotH);
    for(let v=-1;v<=1.0001;v+=0.02) area+=' L'+X(v)+','+Y(pdf(v));
    area+=' L'+X(1)+','+(mt+plotH)+' Z';
    g+='<path d="'+area+'" fill="var(--s1)" opacity=".22"/>';
    g+='<path d="'+pOf(lin(-R,R,220).map(v=>[X(v),Y(pdf(v))]))+'" fill="none" stroke="var(--s1)" stroke-width="2.8"/>';
    [-1,1].forEach(v=>g+='<line x1="'+X(v)+'" y1="'+(mt+plotH)+'" x2="'+X(v)+'" y2="'+Y(pdf(v))+'" stroke="var(--s1)" stroke-width="1.3" stroke-dasharray="3 3"/>');
    const pk=pdf(0);
    g+='<circle cx="'+X(0)+'" cy="'+Y(pk)+'" r="4" fill="var(--s1)"/>'
     + '<text class="legend" x="'+(X(0)+10)+'" y="'+(Y(pk)-8)+'">peak '+pk.toFixed(2)+'</text>';
    [-3,-2,-1,0,1,2,3].forEach(v=>g+='<text class="tick" x="'+X(v)+'" y="'+(mt+plotH+18)+'" text-anchor="middle">'+v+'</text>');
    g+='<text class="legend" x="'+(ml+plotW/2)+'" y="'+(H-8)+'" text-anchor="middle">a continuous measurement</text>';
  }
  svg.innerHTML=g;
  document.querySelectorAll('[data-dist]').forEach(b=>b.classList.toggle('sel',b.dataset.dist===DIST_MODE));
  const row=document.getElementById('distsrow'); if(row) row.style.visibility = DIST_MODE==='pdf' ? 'visible' : 'hidden';
  const sv=document.getElementById('distsv'); if(sv) sv.textContent=DIST_S.toFixed(2);
  const wn=document.getElementById('distwarn');
  if(!wn) return;
  if(DIST_MODE==='pmf'){
    const tot=PMF.reduce((a,b)=>a+b,0);
    wn.innerHTML='Each bar is a probability: P(X = 3) = '+PMF[3].toFixed(2)+'. All '+PMF.length
      + ' sum to '+tot.toFixed(2)+'. This is a <strong>probability mass function</strong>.';
  }else{
    const pk=1/(DIST_S*Math.sqrt(2*Math.PI));
    /* Abramowitz-Stegun 7.1.26 erf, good to ~1e-7 -- enough to quote three decimals */
    const erf=z=>{ const t=1/(1+0.3275911*Math.abs(z));
      const y=1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z);
      return z<0?-y:y; };
    const area=erf(1/(DIST_S*Math.SQRT2));
    wn.innerHTML='The curve is a <strong>density</strong> p(x). Its peak is '+pk.toFixed(2)
      + (pk>1 ? ' &#8212; above 1, which a probability cannot be. Only the total area is constrained: '
              : ' &#8212; below 1 here, but reduce &#963; and it exceeds 1. Only the total area is constrained: '
              )
      + '&#8747;p(x)dx = 1.<br>The shaded area is a probability: P(&#8722;1 &lt; X &lt; 1) = <strong>'
      + area.toFixed(3)+'</strong>.';
  }
}

/* ---------------------------------------------------------------- two rules, drawn
   One clean discrete grid. Outline a column and it collapses to a bar of p(x) --
   the sum rule. Read a single cell as the column total times the share within the
   column -- the chain rule. The continuous case is a sentence, not a second figure:
   the pmf/pdf slide has already done that work. */
function drawRules(){
  const g=document.getElementById('rulefig'); if(!g) return;
  const J=[[3,1,1],[4,3,1],[2,5,2],[1,3,4],[2,2,3]];
  const tot=J.flat().reduce((a,b)=>a+b,0), NC=J.length, NR=3;
  const x0=132,y0=14,cw=52,ch=34, HL=2;
  let s='';
  for(let c=0;c<NC;c++) for(let r=0;r<NR;r++){
    const v=J[c][r]/tot;
    s+='<rect x="'+(x0+c*cw)+'" y="'+(y0+r*ch)+'" width="'+(cw-5)+'" height="'+(ch-5)+'" rx="3"'
     + ' fill="var(--s1)" opacity="'+(0.12+v*3.6).toFixed(2)+'"/>';
  }
  s+='<rect x="'+(x0+HL*cw-4)+'" y="'+(y0-4)+'" width="'+(cw+3)+'" height="'+(NR*ch+3)+'" rx="4"'
   + ' fill="none" stroke="var(--accent)" stroke-width="2.2"/>';
  /* marginal bars below, aligned under their columns */
  const by=y0+NR*ch+20, bh=46;
  for(let c=0;c<NC;c++){
    const p=J[c].reduce((a,b)=>a+b,0)/tot, h=p*bh*3.0;
    s+='<rect x="'+(x0+c*cw)+'" y="'+(by+bh-h)+'" width="'+(cw-5)+'" height="'+h+'" rx="3"'
     + ' fill="var(--s3)" opacity="'+(c===HL?0.95:0.5)+'"/>';
    s+='<text class="tick" x="'+(x0+c*cw+(cw-5)/2)+'" y="'+(by+bh+16)+'" text-anchor="middle">'+c+'</text>';
  }
  s+='<text class="legend" x="'+(x0-14)+'" y="'+(y0+NR*ch/2)+'" text-anchor="end">y</text>'
   + '<text class="legend" x="'+(x0-14)+'" y="'+(by+bh-6)+'" text-anchor="end">p(x)</text>'
   + '<text class="legend" x="'+(x0+NC*cw/2-3)+'" y="'+(by+bh+34)+'" text-anchor="middle">x</text>';
  /* the two rules, one on each side, well clear of the grid */
  s+='<text class="legend" x="'+(x0-30)+'" y="'+(y0+12)+'" text-anchor="end" fill="var(--accent)">sum rule</text>'
   + '<text class="legend" x="'+(x0-30)+'" y="'+(y0+30)+'" text-anchor="end">add a column,</text>'
   + '<text class="legend" x="'+(x0-30)+'" y="'+(y0+46)+'" text-anchor="end">and y is gone</text>';
  const rx=x0+NC*cw+26;
  s+='<text class="legend" x="'+rx+'" y="'+(y0+12)+'" fill="var(--accent)">chain rule</text>'
   + '<text class="legend" x="'+rx+'" y="'+(y0+30)+'">one cell = the column total,</text>'
   + '<text class="legend" x="'+rx+'" y="'+(y0+46)+'">times its share of that column</text>'
   + '<text class="matn" x="'+rx+'" y="'+(y0+74)+'" style="font-size:17px">p(x,y) = p(x) &#183; p(y|x)</text>';
  g.innerHTML=s;
}

/* ---------------------------------------------------------------- independence, live
   The joint on the left with a movable slice; the conditional p(y|x) on the right,
   drawn against the marginal p(y) as a dashed reference. Independent: the two
   coincide at every x. Dependent: the conditional slides away from it. */
let IND_DEP=false, IND_X=0.0;
function drawIndep(){
  const svg=document.getElementById('indsvg'); if(!svg) return;
  const W=560,H=300, gap=44, half=(W-56-gap)/2, ml=44, mt=18, mb=42;
  const ph=H-mt-mb;
  const rho=IND_DEP?0.78:0.0, sy=1.0;
  const R=2.8;
  let g='';
  /* --- left: the joint --- */
  const X1=v=>ml+half*(v+R)/(2*R), Y1=v=>mt+ph*(R-v)/(2*R);
  g+='<line class="axis" x1="'+ml+'" y1="'+(mt+ph)+'" x2="'+(ml+half)+'" y2="'+(mt+ph)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(mt+ph)+'"/>';
  const cx=X1(0), cy=Y1(0);
  const ang=IND_DEP?-38:0;
  [[1,0.5],[0.68,0.36],[0.4,0.22]].forEach(([k,op])=>{
    const rxx=(IND_DEP?1.32:1.0)*k*half/(2*R)*2.0, ryy=(IND_DEP?0.62:1.0)*k*ph/(2*R)*2.0;
    g+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rxx+'" ry="'+ryy+'" fill="none" stroke="var(--s1)"'
     + ' stroke-width="2.2" opacity="'+op+'" transform="rotate('+ang+' '+cx+' '+cy+')"/>'; });
  g+='<line x1="'+X1(IND_X)+'" y1="'+mt+'" x2="'+X1(IND_X)+'" y2="'+(mt+ph)+'" stroke="var(--accent)" stroke-width="2.2"/>'
   + '<text class="legend" x="'+X1(IND_X)+'" y="'+(mt-5)+'" text-anchor="middle" fill="var(--accent)">x = '+IND_X.toFixed(1)+'</text>';
  /* the axis carries x; the joint names itself inside the plot, beside its contours */
  g+='<text class="legend" x="'+(ml+half/2)+'" y="'+(H-8)+'" text-anchor="middle">x</text>'
   + '<text class="legend" x="'+(ml-30)+'" y="'+(mt+ph/2)+'" text-anchor="middle">y</text>'
   + '<text class="matn" x="'+(ml+half-8)+'" y="'+(mt+ph-10)+'" text-anchor="end" style="font-size:18px">p(x, y)</text>';
  /* --- right: the conditional against the marginal --- */
  const x2=ml+half+gap+18, X2=p=>x2+half*p/0.62, Y2=v=>mt+ph*(R-v)/(2*R);
  g+='<line class="axis" x1="'+x2+'" y1="'+(mt+ph)+'" x2="'+x2+'" y2="'+mt+'"/>';
  const mu=rho*IND_X, sd=sy*Math.sqrt(1-rho*rho);
  const marg=lin(-R,R,140).map(v=>[X2(NPDF(v,0,1)),Y2(v)]);
  const cond=lin(-R,R,140).map(v=>[X2(NPDF(v,mu,sd*sd)),Y2(v)]);
  g+='<path d="'+pOf(marg)+'" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="6 4"/>';
  g+='<path d="'+pOf(cond)+'" fill="none" stroke="var(--accent)" stroke-width="2.8"/>';
  g+='<line x1="'+x2+'" y1="'+Y2(mu)+'" x2="'+X2(NPDF(mu,mu,sd*sd))+'" y2="'+Y2(mu)+'" stroke="var(--accent)" stroke-width="1.2" stroke-dasharray="3 3"/>';
  g+='<text class="legend" x="'+(x2+half/2)+'" y="'+(H-8)+'" text-anchor="middle">p(y | x) against p(y)</text>';
  g+='<g transform="translate('+x2+','+(mt+6)+')">'
   + '<line x1="0" y1="0" x2="18" y2="0" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="6 4"/>'
   + '<text class="legend" x="24" y="4">p(y)</text>'
   + '<line x1="72" y1="0" x2="90" y2="0" stroke="var(--accent)" stroke-width="2.6"/>'
   + '<text class="legend" x="96" y="4">p(y | x)</text></g>';
  svg.innerHTML=g;
  document.querySelectorAll('[data-ind]').forEach(b=>b.classList.toggle('sel', (b.dataset.ind==='dep')===IND_DEP));
  const xv=document.getElementById('indxv'); if(xv) xv.textContent=IND_X.toFixed(1);
  const wn=document.getElementById('indwarn');
  if(wn) wn.innerHTML = IND_DEP
    ? 'Changing x <strong>changes the conditional distribution</strong>: p(y | x) &#8800; p(y). '
      + 'Knowing x gives information about y. The joint is not the product of the marginals.'
    : 'Changing x <strong>does not change the conditional distribution</strong>: p(y | x) = p(y) at every x. '
      + 'Knowing x tells you nothing about y, and p(x, y) = p(x)&#8201;p(y).';
}

/* ---------------------------------------------------------------- the joint table
   One 5x3 table of counts, shared by the sum-rule and product-rule slides so the
   two rules are read off the SAME picture. Cell area and tint both carry the
   probability mass, and the margins are printed where they are formed. */
/* Total 50, every count even: each cell, p(x) and p(y) is then an exact whole
   percentage, so the printed margins sum to 100 instead of drifting under rounding. */
const JT=[[4,2,1],[6,4,1],[3,7,2],[1,4,6],[2,2,5]];      /* JT[x][y] */
const JT_TOT=JT.flat().reduce((a,b)=>a+b,0);
const jtPx=x=>JT[x].reduce((a,b)=>a+b,0)/JT_TOT;
const jtPy=y=>JT.reduce((a,col)=>a+col[y],0)/JT_TOT;
const jtP =(x,y)=>JT[x][y]/JT_TOT;
const pct=v=>(v*100).toFixed(0)+'%';

/* Draw the table. opts: hi = {x} column to highlight, mode = 'sum' | 'prod'. */
function jtGrid(id, mode, hiX){
  const g=document.getElementById(id); if(!g) return;
  const NC=JT.length, NR=3, cw=64, chh=44, x0=118, y0=30;
  const mx=Math.max.apply(null, JT.flat())/JT_TOT;
  let s='';
  for(let c=0;c<NC;c++) for(let r=0;r<NR;r++){
    const v=jtP(c,r), k=Math.sqrt(v/mx);           /* area ∝ mass, so side ∝ sqrt */
    const w=(cw-8)*k, h=(chh-8)*k;
    const cxx=x0+c*cw+(cw-8)/2, cyy=y0+r*chh+(chh-8)/2;
    const on=(hiX===undefined)||(c===hiX);
    s+='<rect x="'+(cxx-w/2)+'" y="'+(cyy-h/2)+'" width="'+w+'" height="'+h+'" rx="3" fill="var(--s1)"'
     + ' opacity="'+(on?(0.30+0.55*v/mx).toFixed(2):0.16)+'"/>'
     + '<text class="tick" x="'+cxx+'" y="'+(cyy+4)+'" text-anchor="middle" opacity="'+(on?1:.35)+'">'
     + pct(v)+'</text>';
  }
  /* row and column labels */
  for(let c=0;c<NC;c++)
    s+='<text class="tick" x="'+(x0+c*cw+(cw-8)/2)+'" y="'+(y0+NR*chh+16)+'" text-anchor="middle">'+c+'</text>';
  for(let r=0;r<NR;r++)
    s+='<text class="tick" x="'+(x0-12)+'" y="'+(y0+r*chh+(chh-8)/2+4)+'" text-anchor="end">'+r+'</text>';
  s+='<text class="legend" x="'+(x0+NC*cw/2-4)+'" y="'+(y0+NR*chh+36)+'" text-anchor="middle">x</text>'
   + '<text class="legend" x="'+(x0-40)+'" y="'+(y0+NR*chh/2)+'" text-anchor="middle">y</text>';
  /* margins, printed on the sides they are formed on */
  const bx=x0+NC*cw+16;
  for(let r=0;r<NR;r++){
    const v=jtPy(r);
    s+='<text class="matn" x="'+bx+'" y="'+(y0+r*chh+(chh-8)/2+5)+'" style="font-size:16px"'
     + ' fill="'+(mode==='sum'?'var(--accent)':'var(--ink-soft)')+'">'+pct(v)+'</text>';
  }
  s+='<text class="legend" x="'+(bx-4)+'" y="'+(y0-10)+'" fill="'+(mode==='sum'?'var(--accent)':'var(--ink-soft)')+'">p(y)</text>';
  const byy=y0+NR*chh+58;   /* clear of the x axis legend above it */
  for(let c=0;c<NC;c++){
    const v=jtPx(c), on=(hiX===undefined)||(c===hiX);
    s+='<text class="matn" x="'+(x0+c*cw+(cw-8)/2)+'" y="'+byy+'" text-anchor="middle" style="font-size:16px"'
     + ' fill="'+(mode==='prod'&&on?'var(--accent)':'var(--ink-soft)')+'" opacity="'+(on?1:.4)+'">'+pct(v)+'</text>';
  }
  s+='<text class="legend" x="'+(x0-12)+'" y="'+byy+'" text-anchor="end">p(x)</text>';
  /* the rule being illustrated, drawn on the picture */
  if(mode==='prod'&&hiX!==undefined){
    s+='<rect x="'+(x0+hiX*cw-5)+'" y="'+(y0-6)+'" width="'+(cw-8+10)+'" height="'+(NR*chh+2)+'" rx="4"'
     + ' fill="none" stroke="var(--accent)" stroke-width="2.4"/>';
  }
  g.innerHTML=s;
}

/* sum rule: every row is added across, and x is gone */
function drawSumRule(){ jtGrid('sumfig','sum'); }

/* product rule: take the column at x, then read its shares -- p(x,y) = p(x)p(y|x) */
let PR_X=2;
function drawProdRule(){
  jtGrid('prodfig','prod',PR_X);
  const bars=document.getElementById('prodbars');
  if(bars){
    const px=jtPx(PR_X);
    let s='', y0=16, bh=34, bw=210, x0=96;
    for(let r=0;r<3;r++){
      const cond=jtP(PR_X,r)/px;
      s+='<text class="tick" x="'+(x0-10)+'" y="'+(y0+r*bh+19)+'" text-anchor="end">y = '+r+'</text>'
       + '<rect x="'+x0+'" y="'+(y0+r*bh)+'" width="'+(bw*cond)+'" height="24" rx="3" fill="var(--accent)" opacity=".8"/>'
       + '<text class="matn" x="'+(x0+bw*cond+8)+'" y="'+(y0+r*bh+18)+'" style="font-size:15px">'+pct(cond)+'</text>';
    }
    s+='<text class="legend" x="'+x0+'" y="'+(y0+3*bh+16)+'">p(y | x = '+PR_X+') &#8212; the column, rescaled to sum to 100%</text>';
    bars.innerHTML=s;
  }
  const v=document.getElementById('prxv'); if(v) v.textContent=PR_X;
  const wn=document.getElementById('prodwarn');
  /* exact counts, so the arithmetic on screen is literally true — rounded
     percentages (5% / 24% = 22%) do not divide cleanly and sharp students notice */
  const cnt=JT[PR_X][0], col=JT[PR_X].reduce((x,y)=>x+y,0);
  const eqs=(cnt*100)%col===0?'=':'&#8776;';   /* honest sign when the % is rounded */
  if(wn) wn.innerHTML='The cell holds <strong>'+cnt+'</strong> of the '+JT_TOT+' counts; its column holds '
    + '<strong>'+col+'</strong>. So p(y = 0 | x = '+PR_X+') = '+cnt+'/'+col+' '+eqs+' '
    + '<strong>'+pct(cnt/col)+'</strong>. To condition, <strong>select the column and rescale its probabilities to sum to one</strong>.';
}

const DRAW={sumrule:drawSumRule,prodrule:drawProdRule,car:drawCar,gauss:drawGauss,lik:drawLik,cov:drawCov,gen:drawGen,noise:drawNoise,coin:drawCoin,bayes:drawBayes,med:drawMed,ens:drawEns,gsamp:drawGsamp,lgen:drawLgen,lamviz:drawLamviz,rules:drawRules,indep:drawIndep,dist:drawDist};

/* Click-to-advance, but never from a control. We remember where the pointer went DOWN:
   dragging a slider and releasing over the slide would otherwise fire a click on the
   slide and skip a page. */
const CONTROLS='input,button,a,select,textarea,label,.demo,.demo-ctrl,.bbtn,.basisbtns,video,iframe,svg';
let downInControl=false;
canvas.addEventListener('pointerdown',e=>{ downInControl=!!(e.target.closest&&e.target.closest(CONTROLS)); });

  if(document.body.classList.contains('inking')) return;
  if(downInControl){ downInControl=false; return; }
  if(e.target.closest&&e.target.closest(CONTROLS)) return;
  next(); });

/* ============================================================
   ANNOTATION LAYER
   Draw over the slide with a mouse, trackpad or pen tablet. Pen pressure is
   used for stroke width when the device reports it. Ink is kept per slide.
   D toggles · E eraser · C clears the current slide · strokes survive navigation.
   ============================================================ */
const ink=document.getElementById('ink'), ictx=ink.getContext('2d');
let inkColor='#9B2C2C', inkWidth=2.2, drawing=false, erasing=false, inkStore={};
function sizeInk(){
  const r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  const keep=ink.width?ictx.getImageData(0,0,ink.width,ink.height):null;
  ink.width=w*r; ink.height=h*r; ink.style.width=w+'px'; ink.style.height=h+'px';
  ictx.setTransform(r,0,0,r,0,0); ictx.lineCap='round'; ictx.lineJoin='round';
  if(keep) try{ictx.putImageData(keep,0,0);}catch(_){}
}
addEventListener('resize',sizeInk); sizeInk();
function toggleInk(){
  document.body.classList.toggle('inking');
  document.querySelectorAll('.ib-sw').forEach(sw=>sw.classList.toggle('sel',sw.dataset.c===inkColor));
}
function clearInk(){ ictx.clearRect(0,0,ink.width,ink.height); delete inkStore[idx]; }
function saveInk(){ try{ inkStore[idx]=ink.toDataURL(); }catch(_){} }
function loadInk(i){
  ictx.clearRect(0,0,ink.width,ink.height);
  const d=inkStore[i]; if(!d) return;
  const im=new Image(); im.onload=()=>{ ictx.globalCompositeOperation='source-over'; ictx.drawImage(im,0,0,ink.width/(devicePixelRatio||1),ink.height/(devicePixelRatio||1)); }; im.src=d;
}
ink.addEventListener('pointerdown',e=>{ drawing=true; ink.setPointerCapture(e.pointerId);
  ictx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ictx.strokeStyle=inkColor; ictx.beginPath(); ictx.moveTo(e.clientX,e.clientY); });
ink.addEventListener('pointermove',e=>{ if(!drawing) return;
  /* pen pressure scales the chosen nib; a mouse just uses the nib width */
  const nib = erasing ? inkWidth*8 : inkWidth;
  ictx.lineWidth = (e.pressure>0 && e.pressure<1) ? nib*(0.45+1.3*e.pressure) : nib;
  ictx.lineTo(e.clientX,e.clientY); ictx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>ink.addEventListener(t,()=>{ if(drawing){drawing=false; saveInk();} }));
document.querySelectorAll('.ib-sw').forEach(sw=>sw.onclick=()=>{ inkColor=sw.dataset.c; setEraser(false);
  document.querySelectorAll('.ib-sw').forEach(o=>o.classList.toggle('sel',o===sw)); });
function setEraser(on){ erasing=on;
  document.getElementById('ib-eraser').classList.toggle('sel',on); }
document.getElementById('ib-eraser').onclick=()=>setEraser(!erasing);
document.querySelectorAll('.ib-sz').forEach(b=>b.onclick=()=>{ inkWidth=+b.dataset.w;
  document.querySelectorAll('.ib-sz').forEach(o=>o.classList.toggle('sel',o===b)); });
document.getElementById('ib-clear').onclick=clearInk;
document.getElementById('ib-off').onclick=toggleInk;

/* A centred paragraph should span its container. The global p{max-width:62ch} keeps
   body copy readable, but on a centred line it leaves the text in a narrow box pinned
   to the left, which reads as mis-centred. Runs once over every slide paragraph. */
/* Scale each site preview so a 1440px-wide render fits the box exactly. */
function fitSiteFrames(){
  document.querySelectorAll('.siteframe').forEach(function(f){
    const ifr=f.querySelector('iframe'); if(!ifr) return;
    const w=f.clientWidth; if(!w) return;
    ifr.style.transform='scale('+(w/1440)+')';
  });
}
addEventListener('resize',fitSiteFrames);

function spreadCentredText(){
  document.querySelectorAll('.slide p, .slide .figcap, .slide .lede').forEach(function(p){
    /* max-width only: an auto inline margin would make a flex item shrink-wrap
       instead of stretching, which is the very problem we are fixing. */
    if(getComputedStyle(p).textAlign === 'center') p.style.maxWidth='none';
  });
}

/* ---- presenter clock ---- P starts/stops. Shows elapsed time and how far
   ahead or behind the planned cumulative time you are at this slide. ---- */
let t0=null, tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updClock(){
  if(t0===null) return;
  const el=(performance.now()-t0)/60000;               // minutes elapsed
  document.getElementById('cl-el').textContent=fmt(performance.now()-t0);
  const plan=cumMin(idx), d=el-plan;
  const dl=document.getElementById('cl-dl');
  dl.textContent=(d>=0?'+':'&#8722;').replace('&#8722;','-')+Math.abs(d).toFixed(1)+'m vs plan ('+plan.toFixed(0)+'m / '+EST_TOTAL.toFixed(0)+'m)';
  dl.className='dl '+(d>0.5?'behind':(d<-0.5?'ahead':''));
}
function toggleClock(){
  document.body.classList.toggle('timing');
  if(document.body.classList.contains('timing')){ t0=performance.now(); tick=setInterval(updClock,1000); updClock(); }
  else { clearInterval(tick); t0=null; }
}

/* ---- YouTube facade -------------------------------------------------------------
   `button` and `iframe` are already in CONTROLS, so neither the play button nor the player
   advances the slide on click.

   YouTube's player refuses an opaque origin: opened straight from Finder this page is
   file://, and the embed dies with "Error 153 - video player configuration error". There is
   no embed parameter that fixes it. So served over http(s) we play inline, and off the disk
   we hand off to youtube.com in a new tab. */
const CAN_EMBED = location.protocol === 'http:' || location.protocol === 'https:';
function closeYT(w){
  const f=w.querySelector('iframe'); if(f) f.remove();
  const b=w.querySelector('.ytfacade'); if(b) b.style.display='';
  w.classList.remove('live');
}
document.querySelectorAll('.ytwrap').forEach(w=>{
  const btn=w.querySelector('.ytfacade');
  if(!CAN_EMBED){
    const b=w.querySelector('.vidbadge'); if(b) b.textContent='Video \u2192 YouTube';
    btn.title='Opens on YouTube \u2014 inline playback needs the deck served over http, not opened from disk';
  }
  btn.addEventListener('click',()=>{
    if(!CAN_EMBED){ window.open('https://www.youtube.com/watch?v='+w.dataset.yt,'_blank','noopener'); return; }
    if(w.classList.contains('live')) return;
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+w.dataset.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title=w.dataset.title||'Video';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    btn.style.display='none';
    w.appendChild(f);
    w.classList.add('live');
  });
});

paint();

/* ---------- PRINT: every slide, every fragment, every figure ----------
   Every slide is in the DOM, but paint() draws only the current slide's figure and
   reveals only the fragments up to the current step -- so an unprepared print gives
   one slide and a lot of empty boxes. Before the browser lays out the pages, reveal
   every fragment and run every registered draw function once. A dark theme is swapped
   to paper for the duration: black pages are not a kindness to anyone's printer.
   ?print in the URL prepares the same way at load, which is how the PDFs are made. */
let PRINT_THEME=null;
function preparePrint(){
  PRINT_THEME=document.body.dataset.theme;
  if(PRINT_THEME==='nocturne') document.body.dataset.theme='paper';
  document.querySelectorAll('.frag').forEach(e=>e.classList.add('on'));
  Object.keys(DRAW).forEach(k=>{ try{ DRAW[k](); }catch(err){} });
}
function restorePrint(){
  if(PRINT_THEME) document.body.dataset.theme=PRINT_THEME;
  document.querySelectorAll('.frag').forEach(e=>e.classList.remove('on'));
  paint();
}
addEventListener('beforeprint',preparePrint);
addEventListener('afterprint',restorePrint);
if(/[?&]print/.test(location.search)) preparePrint();

/* Deep links: lecture-03.html#21 opens the deck on slide 21 with the whole slide revealed,
   and a link to another number while the deck is open goes there. The course notes link to
   slides this way. Anything that is not a slide number is ignored. */
function goToHash(){
  const m=/^#(\d+)$/.exec(location.hash);
  if(!m) return;
  const n=+m[1];
  if(n>=1 && n<=SLIDES.length && n-1!==idx) go(n-1);
}
addEventListener('hashchange',goToHash);
goToHash();

</script>
<script>
/* ── edit mode ────────────────────────────────────────────────────────────────
   X turns the current slide's prose into editable text; Cmd/Ctrl+S saves it back
   into the deck's source (build/<deck>_slides.py) and rebuilds, through the local
   edit server (build/editserver.py). Without that server the deck is untouched:
   the key still works, saving just reports that nothing is listening.

   Editable: plain text. Not editable: maths (KaTeX), figures (SVG), buttons and
   sliders, and the generated Questions slides — those stay with the source. */
(function(){
  const DECK = (document.querySelector('meta[name="deck-source"]')||{}).content || '';
  if(!DECK) return;
  const ED = { on:false, nodes:[], bar:null };

  const css = document.createElement('style');
  css.textContent = '.edit-on [data-ed]{outline:1px dashed var(--accent);outline-offset:3px;border-radius:3px}'
    + '.edit-on [data-ed]:focus{outline:2px solid var(--accent)}'
    + '#edbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;gap:10px;'
    + 'align-items:center;background:var(--bg-alt);border:1px solid var(--rule);border-radius:10px;'
    + 'padding:8px 14px;font-family:var(--font-sans);font-size:14px;box-shadow:var(--shadow)}'
    + '#edbar b{font-weight:700}#edbar .msg{color:var(--ink-soft)}';
  document.head.appendChild(css);

  const slideIdx = () => { const s=[...document.querySelectorAll('#canvas section')];
    return s.findIndex(x=>x.classList.contains('active')); };
  const current = () => document.querySelectorAll('#canvas section')[slideIdx()];

  function textNodes(root){
    const skip = n => n.closest('svg,script,style,button,input,label,.tex,.texd,#edbar');
    const out=[], w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.nodeValue.trim() && !skip(n.parentElement)) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT });
    let n; while((n=w.nextNode())) out.push(n);
    return out;
  }

  function enable(){
    const sec = current(); if(!sec) return;
    ED.nodes = []; const seen = {};
    textNodes(sec).forEach(n => {
      const t = n.nodeValue.trim(), occ = (seen[t] = (seen[t]||0)); seen[t]++;
      ED.nodes.push({ node:n, orig:n.nodeValue, occ:occ });
      if(n.parentElement) n.parentElement.setAttribute('data-ed','1');
    });
    sec.querySelectorAll('svg,.tex,.texd,button,input').forEach(e => e.contentEditable = 'false');
    sec.contentEditable = 'true';
    sec.style.caretColor = 'var(--accent)';
    document.body.classList.add('edit-on');
    ED.on = true;
    bar('editing slide ' + (slideIdx()+1) + ' · <b>&#8984;S</b> save · <b>Esc</b> leave');
  }

  function disable(msg){
    const sec = current();
    if(sec){ sec.contentEditable = 'false'; sec.querySelectorAll('[data-ed]').forEach(e=>e.removeAttribute('data-ed')); }
    document.body.classList.remove('edit-on');
    ED.on = false; ED.nodes = [];
    if(msg) bar(msg, 2600); else if(ED.bar){ ED.bar.remove(); ED.bar=null; }
  }

  function bar(html, hideAfter){
    if(!ED.bar){ ED.bar = document.createElement('div'); ED.bar.id='edbar'; document.body.appendChild(ED.bar); }
    ED.bar.innerHTML = '<span class="msg">'+html+'</span>';
    if(hideAfter) setTimeout(()=>{ if(ED.bar){ ED.bar.remove(); ED.bar=null; } }, hideAfter);
  }

  async function save(){
    if(!ED.on) return;
    const idx = slideIdx();
    const edits = ED.nodes.filter(e => e.node.nodeValue !== e.orig)
      .map(e => ({ slide: idx, occ: e.occ, old: e.orig.trim().replace(/\s+/g,' '), new: e.node.nodeValue.trim().replace(/\s+/g,' ') }))
      .filter(e => e.new.length);
    if(!edits.length){ disable('no changes'); return; }
    bar('saving ' + edits.length + ' edit' + (edits.length>1?'s':'') + '…');
    try{
      const r = await fetch('/save', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ deck: DECK, edits: edits }) });
      const j = await r.json();
      if(j.ok){ sessionStorage.setItem('edReturn', String(idx));
        bar('saved · rebuilding…');
        setTimeout(()=>location.reload(), 350);
      } else { disable('not saved: ' + (j.error || (j.failed||[]).join('; '))); }
    } catch(err){ disable('no edit server — run build/editserver.py'); }
  }

  document.addEventListener('keydown', e => {
    const k = (e.key||'').toLowerCase();
    if((e.metaKey||e.ctrlKey) && k==='s'){ e.preventDefault(); e.stopPropagation(); save(); return; }
    if(ED.on){
      if(k==='escape'){ e.preventDefault(); e.stopPropagation(); disable('left without saving'); return; }
      if(k==='x' && !e.target.isContentEditable){ e.stopPropagation(); disable(); return; }   /* X types when the caret is in text: Esc is the way out */
      e.stopPropagation();                       /* keep typing away from the deck's own shortcuts */
      return;
    }
    if(k==='x' && !e.metaKey && !e.ctrlKey && !e.altKey){ e.preventDefault(); e.stopPropagation(); enable(); }
  }, true);

  /* the deck advances on a click anywhere on the canvas, which would turn the page
     the moment you click to place the caret: swallow pointer events while editing.
     stopPropagation only — the click still places the caret and still selects text. */
  ['pointerdown', 'pointerup', 'click', 'dblclick'].forEach(type => {
    document.addEventListener(type, e => {
      if(!ED.on) return;
      if(e.target.closest && e.target.closest('#edbar')) return;
      e.stopPropagation();
    }, true);
  });

  window.addEventListener('DOMContentLoaded', () => {
    const back = sessionStorage.getItem('edReturn');
    if(back !== null){ sessionStorage.removeItem('edReturn');
      setTimeout(()=>{ if(typeof go==='function') go(+back); bar('saved and rebuilt', 2200); }, 60); }
  });
})();
</script>
<script>
/* v4 spacing: the body sits just under the title, with any leftover space falling to
   the foot of the slide. The gap is half the slack, capped, so a full slide keeps its
   tight spacing and never overflows. Formatting only — nothing here changes content. */
(function(){
  var CAP = 26;
  function fit(sec){
    if(!sec) return;
    if(sec.querySelector('.divider') || sec.querySelector('.title-rule')) return;
    var kids = [].slice.call(sec.children).filter(function(k){
      return k.getBoundingClientRect().height > 0; });
    if(kids.length < 2) return;
    var iBody = -1;
    kids.forEach(function(k, i){
      var c = (k.className || '') + '';
      if(c.indexOf('eyebrow') >= 0 || c.indexOf('actbadge') >= 0 || k.tagName === 'H2') iBody = i + 1;
    });
    if(iBody < 1 || iBody >= kids.length) return;
    sec.style.setProperty('--bodygap', '0px');
    var r = sec.getBoundingClientRect(), sc = r.height / sec.offsetHeight || 1;
    var pad = parseFloat(getComputedStyle(sec).paddingBottom) || 0;
    var slack = (r.bottom - kids[kids.length - 1].getBoundingClientRect().bottom) / sc - pad;
    sec.style.setProperty('--bodygap', (slack > 4 ? Math.min(slack / 2, CAP) : 0).toFixed(0) + 'px');
  }
  function run(){ fit(document.querySelector('#canvas section.active')); }
  addEventListener('resize', run);
  addEventListener('load', function(){ run(); setTimeout(run, 400); });
  var canvas = document.getElementById('canvas');
  if (canvas) new MutationObserver(run).observe(canvas, {subtree:true, attributes:true, attributeFilter:['class']});
  setTimeout(run, 300);
})();
</script>
