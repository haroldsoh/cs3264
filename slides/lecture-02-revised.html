/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank

:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide transition: opacity only, short, and NO transform.
   A transform (especially a scale) promotes the slide to a composited layer and
   re-rasterises the text, which makes heavy glyphs read as arriving before light
   ones. Nothing that carries text is allowed to animate transform or scale. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s linear,visibility .14s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.leaving{opacity:0}

/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
#canvas section{justify-content:flex-start;padding-top:58px;padding-bottom:52px}
#canvas section:has(.divider),#canvas section:has(.title-rule){justify-content:center}
#canvas section > .actbadge + h2{margin-top:10px}
#canvas section > h2:first-child{margin-top:34px}
.demo-ctrl{flex:.72}
.ctrl-row{margin-bottom:18px}

/* ---------- PRINT: one page per slide ----------
   The deck is a 1280x720 design canvas that fit() scales to the window. For print we
   drop that scale, let the slides flow one after another instead of stacking, and set
   the page to the same 1280x720 -- 13.333in x 7.5in at 96dpi, the standard widescreen
   slide size -- so a printed page is what the projector shows, at 1:1.
   Chrome's "Save as PDF" destination turns this into a deck PDF. */
@media print{
  @page{ size:13.333in 7.5in; margin:0 }
  html,body{height:auto;overflow:visible}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none}
  #stage{position:static;display:block;transition:none}
  #canvas{transform:none!important;width:1280px;height:auto;overflow:visible;
    background:transparent;transition:none}
  .slide{position:relative;inset:auto;width:1280px;height:720px;overflow:hidden;
    background:var(--bg);opacity:1!important;visibility:visible!important;
    transition:none!important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .frag{opacity:1!important}
  /* presenter chrome has no business on paper */
  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}
/* ── v4 spacing pass (formatting only) ─────────────────────────────────────
   The header stays pinned at the top of every content slide. The body block
   below it is centred in whatever space is left, so a sparse slide no longer
   hugs the title with a void underneath, and a dense slide (no slack) does
   not move at all. A little more of the bottom padding is given back to the
   content so the tightest slides stop grazing the edge. */
#canvas section{padding-bottom:36px}
#canvas section > h2 + *,
#canvas section > .actbadge + *:not(h2){margin-top:var(--bodygap,0px) !important}
/* dividers and the title slide keep their own centring */
#canvas section:has(.divider) > *,
#canvas section:has(.title-rule) > *{margin-top:revert;margin-bottom:revert}
</style>

      <p style="font-size:20px;max-width:none">The same input-target pairs <span class="tex" data-tex="\\{(\\mathbf{x}_n, t_n)\\}"></span>.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Model</div>
      <p style="font-size:20px;max-width:none">Describes a <strong>probability distribution</strong>
      over possible targets.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Loss</div>
      <p style="font-size:20px;max-width:none">Derived from the negative log-likelihood of the observed data.</p>
    </div>
  </div>`},

{s:"Part I", t:"What it buys and what it costs", html:`
  <div class="eyebrow">Before we start</div>
  <h2 style="margin-bottom:14px">What a probabilistic model gives us</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Benefits</div>
      <p class="frag" data-f="0" style="font-size:19.5px;max-width:none">The loss follows from the model assumptions.</p>
      <hr class="rule frag" data-f="1">
      <p class="frag" data-f="1" style="font-size:19.5px;max-width:none">Predictions include uncertainty.</p>
      <hr class="rule frag" data-f="2">
      <p class="frag" data-f="2" style="font-size:19.5px;max-width:none"><span class="tex" data-tex="\\lambda"></span> becomes a ratio of
      variances.</p>
      <hr class="rule frag" data-f="3">
      <p class="frag" data-f="3" style="font-size:19.5px;max-width:none">A different distribution
      gives a different loss.</p>

    <div class="col card accent">

      <p class="frag" data-f="4" style="font-size:19.5px;max-width:none">We must choose a probability distribution.</p>
      <hr class="rule frag" data-f="5">
      <p class="frag" data-f="5" style="font-size:19.5px;max-width:none">Some losses, such as hinge loss in Week 10, have other motivations.</p>
      <hr class="rule frag" data-f="6">
      <p class="frag" data-f="6" style="font-size:19.5px;max-width:none">Only some models have closed-form solutions.</p>
      <hr class="rule frag" data-f="7">
      <p class="frag" data-f="7" style="font-size:19.5px;max-width:none">Gaussian noise leads back to squared error.</p>
    </div>
  </div>`},

  <div class="divider">
    <div class="part">Part II</div>

{s:"Part II", t:"Discrete and continuous", draw:"dist", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:6px">Discrete probabilities, continuous densities</h2>
  <p style="font-size:20px;margin-bottom:10px">For a discrete variable, each height is a probability. For a continuous variable, the <strong>area</strong> under the curve gives a probability.</p>
  <div class="demo">
    <div class="demo-plot"><svg id="dsvg" viewBox="0 0 560 290"></svg></div>
    <div class="demo-ctrl">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="bbtn sel" data-dist="pmf" type="button">discrete &#183; pmf</button>
        <button class="bbtn" data-dist="pdf" type="button">continuous &#183; pdf</button>
      </div>
      <div class="ctrl-row" id="distsrow" style="visibility:hidden"><label>spread <span style="text-transform:none">&#963;</span> <span class="val" id="distsv">1.00</span></label>
        <input type="range" id="dists" min="0.25" max="1.6" step="0.05" value="1"></div>
      <div class="warn" id="distwarn" style="min-height:86px"></div>
      <hr class="rule">
      <div class="dgrid" style="grid-template-columns:auto auto;gap:8px 14px">
        <div style="font-size:19px">discrete</div><div class="eq" style="margin:0"><span class="texd" data-tex="\\textstyle\\sum_k P(X=k) = 1"></span></div>
        <div style="font-size:19px">continuous</div><div class="eq" style="margin:0"><span class="texd" data-tex="\\textstyle\\int p(x)\\,dx = 1"></span></div>
      </div>
      <p class="caption" style="margin-top:8px">Reduce <span class="tex" data-tex="\\sigma"></span>: the peak rises above 1, but the total area stays 1. Density and probability are different.</p>
    </div>
  </div>`},

{s:"Part II", t:"The Gaussian", draw:"gauss", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:10px">The Gaussian distribution</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="gsvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 16px;font-size:20px"><span class="texd" data-tex="\\mathcal{N}(x \\mid \\mu, \\sigma^2) = \\frac{1}{\\sqrt{2\\pi\\sigma^2}}\\exp\\!\\left(-\\frac{(x-\\mu)^2}{2\\sigma^2}\\right)"></span></div>
      <div class="ctrl-row"><label>mean <span class="val" id="gmuv">0.0</span></label>
        <input type="range" id="gmu" min="-3" max="3" step="0.1" value="0"></div>
      <div class="ctrl-row"><label>variance <span class="val" id="gs2v">1.0</span></label>
        <input type="range" id="gs2" min="0.1" max="4" step="0.1" value="1"></div>
      <p class="caption" style="margin-top:6px"><span class="tex" data-tex="\\mu"></span>, the <strong>mean</strong>, sets the centre. <span class="tex" data-tex="\\sigma^2"></span>, the <strong>variance</strong>, sets its spread.</p>
      <p class="caption" style="margin-top:8px">We will use it to describe noise in regression.</p>
    </div>
  </div>`},

{s:"Part II", t:"Three rules", html:`
  <div class="eyebrow">Part II</div>
  <h2 style="margin-bottom:16px">The sum rule, product rule, and Bayes&#8217; rule</h2>
  <div class="row top stretch" style="gap:20px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">1 &#183; Sum rule</div>
      <div class="eq" style="margin:0;font-size:23px"><span class="texd" data-tex="p(x) = \\sum_y p(x,y)"></span></div>
      <div class="eq" style="margin:6px 0 0;font-size:18.5px"><span class="texd" data-tex="p(x) = \\textstyle\\int p(x,y)\\,dy \\;\\;\\text{(continuous)}"></span></div>
      <hr class="rule">
      <p style="font-size:19px;max-width:none">Remove a variable by summing or integrating over it.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:10px">2 &#183; Product rule</div>
      <div class="eq" style="margin:0;font-size:23px"><span class="texd" data-tex="p(x,y) = p(y \\mid x)\\,p(x)"></span></div>
      <hr class="rule">
      <p style="font-size:19px;max-width:none">Express a joint distribution using a conditional distribution.</p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:10px">3 &#183; Bayes&#8217; rule</div>
      <div class="eq" style="margin:0;font-size:23px"><span class="texd" data-tex="p(y \\mid x) = \\frac{p(x \\mid y)\\,p(y)}{p(x)}"></span></div>
      <hr class="rule">
      <p style="font-size:19px;max-width:none">Use data to update beliefs. This follows from the sum and product rules.</p>
    </div>
  </div>`},

{s:"Part II", t:"Sum rule", draw:"sumrule", html:`
  <div class="eyebrow">Rule 1</div>
  <h2 style="margin-bottom:8px">Sum rule &#8212; add along a row</h2>
  <p style="font-size:20px;margin-bottom:6px">Two discrete variables, <span class="tex" data-tex="x"></span> and <span class="tex" data-tex="y"></span>. Each cell is a
  joint probability <span class="tex" data-tex="p(x,y)"></span>.</p>
  <div class="fig h-330" style="background:transparent;box-shadow:none;margin-top:2px">
    <svg viewBox="0 0 620 250"><g id="sumfig"></g></svg>
  </div>
  <div class="card accent frag" data-f="0" style="margin-top:6px;padding:12px 20px">
    <p style="font-size:20px;max-width:none">Summing over <span class="tex" data-tex="x"></span> leaves <span class="tex" data-tex="p(y)"></span>. The result is called a
    <strong>marginal distribution</strong>, and the process <strong>marginalisation</strong>.</p>
  </div>`},

{s:"Part II", t:"Product rule", draw:"prodrule", html:`
  <div class="eyebrow">Rule 2 &#183; live demo</div>
  <h2 style="margin-bottom:8px">Product rule &#8212; select a column and rescale</h2>
  <div class="demo">
    <div class="demo-plot">
      <svg viewBox="0 0 620 250"><g id="prodfig"></g></svg>
    </div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="\\underbrace{p(x,y)}_{\\text{one cell}} = \\underbrace{p(x)}_{\\text{the column}}\\;\\underbrace{p(y \\mid x)}_{\\text{its share}}"></span></div>
      <div class="ctrl-row"><label>slice at x = <span class="val" id="prxv">2</span></label>
        <input type="range" id="prx" min="0" max="4" step="1" value="2"></div>
      <svg viewBox="0 0 440 148" style="width:100%;display:block"><g id="prodbars"></g></svg>
      <div class="warn" id="prodwarn"></div>
      <p class="caption" style="margin-top:8px">Keep the cases where <span class="tex" data-tex="x"></span> has the chosen value, then rescale their probabilities to sum to one.</p>
    </div>
  </div>`},

{s:"Part II", t:"Deriving Bayes rule", html:`
  <div class="eyebrow">From the sum and product rules</div>
  <h2 style="margin-bottom:10px">Deriving Bayes&#8217; rule</h2>
  <p style="font-size:20.5px;margin-bottom:8px">Write the same joint probability in two ways:</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:22px">
    <div><span class="tex" data-tex="p(A, B)"></span></div><div><span class="tex" data-tex="= p(A \\mid B)\\,p(B) = p(B \\mid A)\\,p(A)"></span></div>
      <div class="dnote">apply the product rule in both orders</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="p(A \\mid B)"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\dfrac{p(B \\mid A)\\,p(A)}{p(B)}"></span></div>
      <div class="dnote frag" data-f="0">divide by <span class="tex" data-tex="p(B)"></span></div>
    <div class="frag" data-f="1"><span class="tex" data-tex="p(B)"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\textstyle\\sum_{A'} p(B \\mid A')\\,p(A')"></span></div>
      <div class="dnote frag" data-f="1">the sum rule gives the denominator</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;text-align:center;padding:14px 20px">
    <p style="font-size:20.5px;max-width:none">Bayes&#8217; rule follows from the product and sum rules.</p>
  </div>`},

{s:"Part II", t:"Bayes rule", html:`
  <div class="eyebrow">The names of the four terms</div>
  <h2 style="margin-bottom:14px">Prior, likelihood, posterior, evidence</h2>
  <p style="font-size:20.5px;margin-bottom:6px">Let <span class="tex" data-tex="D"></span> be having a disease and <span class="tex" data-tex="{+}"></span> be testing
  positive:</p>
  <div class="eq" style="margin:8px 0 18px;font-size:30px"><span class="texd" data-tex="\\underbrace{\\htmlClass{c-post}{p(D \\mid {+})}}_{\\htmlClass{c-post}{\\text{posterior}}} = \\frac{\\overbrace{\\htmlClass{c-lik}{p({+} \\mid D)}}^{\\htmlClass{c-lik}{\\text{likelihood}}}\\ \\overbrace{\\htmlClass{c-prior}{p(D)}}^{\\htmlClass{c-prior}{\\text{prior}}}}{\\underbrace{p({+})}_{\\text{evidence}}}"></span></div>
  <div class="grid3">
    <div class="appcard frag" data-f="0" style="padding:19px;border-color:var(--accent2)">
      <div class="t" style="font-size:22px;color:var(--accent2)">Prior</div>
      <div class="d" style="font-size:18.5px;margin-top:6px"><span class="tex" data-tex="p(D)"></span> &#8212; belief before the data.</div></div>
    <div class="appcard frag" data-f="1" style="padding:19px;border-color:var(--accent-soft)">
      <div class="t" style="font-size:22px;color:var(--accent-soft)">Likelihood</div>
      <div class="d" style="font-size:18.5px;margin-top:6px"><span class="tex" data-tex="p({+} \\mid D)"></span> &#8212; how probable the data is for a given hypothesis.</div></div>
    <div class="appcard frag" data-f="2" style="padding:19px;border-color:var(--accent)">
      <div class="t" style="font-size:22px;color:var(--accent)">Posterior</div>
      <div class="d" style="font-size:18.5px;margin-top:6px"><span class="tex" data-tex="p(D \\mid {+})"></span> &#8212; belief after the data.</div></div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:16px;text-align:center">
    Later <span class="tex" data-tex="\\boldsymbol{\\theta}"></span> and <span class="tex" data-tex="\\mathcal{D}"></span> will play these roles.</p>`},

{s:"Part II", t:"Who was Bayes", html:`
  <div class="eyebrow">Background</div>
  <h2 style="margin-bottom:12px">Why use Bayes&#8217; rule?</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:.5">
      <div class="fig h-250"><img src="media/bayes.jpg" alt="Portrait said to be of Thomas Bayes"></div>
      <p class="cred">Thomas Bayes, c.1701&#8211;1761. The only portrait said to be of him.</p>
    </div>
    <div class="col" style="flex:1.5">
      <p style="font-size:21px">A minister and mathematician. The rule was published in 1763,
      after he died.</p>
      <div class="frag" data-f="0" style="margin-top:13px">
        <hr class="rule">
        <p style="font-size:21px">It lets us infer an unknown condition from an observed result.</p>
      </div>
      <div class="row top frag" data-f="1" style="gap:22px;margin-top:13px">
        <div class="col card">
          <div class="eyebrow" style="margin-bottom:8px">What a lab measures</div>
          <p style="font-size:20px;max-width:none"><span class="tex" data-tex="p({+} \\mid D)"></span><br>
          <span style="color:var(--ink-soft);font-size:18px">test results for known cases</span></p>
        </div>
        <div class="col card accent">
          <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">What a patient asks</div>
          <p style="font-size:20px;max-width:none"><span class="tex" data-tex="p(D \\mid {+})"></span><br>
          <span style="color:var(--ink-soft);font-size:18px">do I have the disease?</span></p>
        </div>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Bayes example", html:`
  <span class="actbadge">Predict first</span>
  <div class="actq" style="font-size:27px;margin:10px 0 14px">A disease affects <strong>1 in 100</strong>
    people. A test is correct <strong>99&#37;</strong> of the time for both ill and healthy people.<br>
    Your test comes back <span style="color:var(--accent)">positive</span>. What is the chance you have the disease?</div>
  <div class="predcards" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:6px">
    <div class="predcard"><div class="pl">A</div><div class="pd" style="font-size:23px;padding:14px 0">about 99&#37;</div></div>
    <div class="predcard"><div class="pl">B</div><div class="pd" style="font-size:23px;padding:14px 0">about 90&#37;</div></div>
    <div class="predcard"><div class="pl">C</div><div class="pd" style="font-size:23px;padding:14px 0">about 50&#37;</div></div>
    <div class="predcard"><div class="pl">D</div><div class="pd" style="font-size:23px;padding:14px 0">about 1&#37;</div></div>
  </div>
  <p class="figcap" style="text-align:center">Pick one.</p>`},

{s:"Part II", t:"Bayes example — the computation", html:`
  <div class="eyebrow">Apply Bayes&#8217; rule</div>
  <h2 style="margin-bottom:10px">Calculate the probability</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <p style="font-size:20.5px;margin-bottom:6px">What we are given:</p>
      <div class="eq" style="margin:6px 0 12px;font-size:21px"><span class="texd" data-tex="p(D) = 0.01, \\qquad p({+} \\mid D) = 0.99, \\qquad p({+} \\mid \\lnot D) = 0.01"></span></div>
      <p style="font-size:20.5px;margin-bottom:6px" class="frag" data-f="0">The sum rule gives the
      denominator:</p>
      <div class="eq frag" data-f="0" style="margin:6px 0 0;font-size:20px"><span class="texd" data-tex="p({+}) = \\underbrace{0.99 \\times 0.01}_{\\text{ill}} + \\underbrace{0.01 \\times 0.99}_{\\text{well}} = 0.0198"></span></div>
    </div>
    <div class="col frag" data-f="1">
      <p style="font-size:20.5px;margin-bottom:6px">So:</p>
      <div class="eq" style="margin:6px 0 12px;font-size:20px"><span class="texd" data-tex="p(D \\mid {+}) = \\frac{0.99 \\times 0.01}{0.0198} = \\frac{0.0099}{0.0198} = 0.5"></span></div>
      <div class="card accent frag" data-f="2">
        <p style="font-size:21px;max-width:none">Here, the low disease rate makes false positives as common as true positives.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Bayes example — answer", draw:"med", html:`
  <div class="eyebrow">The answer</div>
  <h2 style="margin-bottom:12px">The answer is <strong>C</strong> &#8212; about 50&#37;</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="card accent">
        <p style="font-size:21px;max-width:none">Consider <strong>10,000</strong> people:</p>
        <hr class="rule">
        <p style="font-size:20.5px;max-width:none"><strong>100</strong> have the disease &#8594; 99 test positive.</p>
        <p style="font-size:20.5px;max-width:none;margin-top:8px"><strong>9,900</strong> are healthy &#8594; 99 test positive.</p>
        <hr class="rule">
        <p style="font-size:21px;max-width:none">Of 198 positive results, 99 are true positives: one half.</p>
      </div>
    </div>
    <div class="col frag" data-f="0" style="flex:1.05">
      <div class="fig h-290"><svg viewBox="0 0 460 300"><g id="medfig"></g></svg></div>
      <p class="cred">400 dots &#215; 25 people each = 10,000. Teal: ill. Red outline: tested positive.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:12px;text-align:center">
    A rare condition can give many false positives, even with an accurate test.</p>`},

{s:"Part II", t:"The three rules again", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">The three rules</h2>
  <div class="row top stretch" style="gap:20px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Sum</div>
      <div class="eq" style="margin:0;font-size:22px"><span class="texd" data-tex="p(x) = \\sum_y p(x,y)"></span></div>
      <div class="eq" style="margin:6px 0 0;font-size:18px"><span class="texd" data-tex="p(x) = \\textstyle\\int p(x,y)\\,dy \\;\\;\\text{(continuous)}"></span></div>
      <hr class="rule">
      <p style="font-size:19px;max-width:none">Sum or integrate over a variable. We will use this for prediction.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Product</div>
      <div class="eq" style="margin:0;font-size:22px"><span class="texd" data-tex="p(x,y) = p(y \\mid x)\\,p(x)"></span></div>
      <hr class="rule">
      <p style="font-size:19px;max-width:none">Write a joint distribution as a product of conditional probabilities.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Bayes</div>
      <div class="eq" style="margin:0;font-size:22px"><span class="texd" data-tex="p(y \\mid x) = \\frac{p(x \\mid y)\\,p(y)}{p(x)}"></span></div>
      <hr class="rule">
      <p style="font-size:19px;max-width:none">Update beliefs using observed data.</p>
    </div>
  </div>`},

{s:"Part II", t:"Independence", draw:"indep", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:10px">Independence</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="indsvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:20px"><span class="texd" data-tex="p(x,y) = p(x)\\,p(y) \\iff p(y \\mid x) = p(y)"></span></div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="bbtn sel" data-ind="ind" type="button">independent</button>
        <button class="bbtn" data-ind="dep" type="button">not independent</button>
      </div>
      <div class="ctrl-row"><label>slice at x <span class="val" id="indxv">0.0</span></label>
        <input type="range" id="indx" min="-2" max="2" step="0.1" value="0"></div>
      <div class="warn" id="indwarn"></div>
      <p class="caption" style="margin-top:8px">With independence, changing <span class="tex" data-tex="x"></span> does not change <span class="tex" data-tex="p(y \\mid x)"></span>.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:10px;text-align:center">We assume the noise
  on each point is independent, so <span class="tex" data-tex="p(t_1,\\ldots,t_N \\mid \\theta) = \\prod_n p(t_n \\mid \\theta)"></span>. This assumption may not hold for every dataset.</p>`},

{s:"Part II", t:"What a likelihood is", draw:"lik", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:4px">What a likelihood is</h2>
  <p style="font-size:20px;margin-bottom:2px">Distribution: fix the parameter and vary the data. Likelihood: <strong>fix the data and vary the parameter</strong>.</p>
  <div class="demo" style="margin-top:4px">
    <div class="demo-plot"><svg id="likfig-wrap" viewBox="0 0 470 300"><g id="likfig"></g></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 14px;font-size:21px"><span class="texd" data-tex="L(\\mu) = p(\\mathcal{D} \\mid \\mu)"></span></div>
      <div class="ctrl-row"><label>mean <span style="text-transform:none">&#956;</span> <span class="val" id="likmuv">-1.60</span></label>
        <input type="range" id="likmu" min="-3" max="3" step="0.02" value="-1.6"></div>
      <div class="readout">
        <div class="stat test"><div class="k">likelihood</div><div class="v" id="likval" style="font-size:20px">&#8212;</div></div>
        <div class="stat train"><div class="k">log-likelihood</div><div class="v" id="liklog" style="font-size:20px">&#8212;</div></div>
      </div>
      <div class="warn" id="likwarn"></div>
      <p class="caption" style="margin-top:2px">The likelihood is not a probability distribution over <span class="tex" data-tex="\\mu"></span>.</p>
    </div>
  </div>`},

{s:"Part II", t:"Part II in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part II summary</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Sum and product</div><p style="font-size:20px;max-width:none">Product: express a joint using conditionals. Sum: marginalise a variable.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Bayes&#8217; rule</div><p style="font-size:20px;max-width:none">Follows from the sum and product rules. Converts <span class="tex" data-tex="p(B \\mid A)"></span> into <span class="tex" data-tex="p(A \\mid B)"></span>.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Likelihood</div><p style="font-size:20px;max-width:none">A function of the parameter, with the data held fixed.</p></div>
  </div>
  <p class="figcap" style="margin-top:16px;text-align:center">Next, we use the Gaussian to model noise.</p>`},

{s:"Part II", t:"Questions (Part II)", div:true, html:`

    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part III", t:"Part III", div:true, html:`
  <div class="divider">
    <div class="part">Part III</div>
    <h1>Maximum likelihood estimation</h1>
    <div class="bar"></div>
    <div class="sub">Write the likelihood, take logs, then find the maximum.</div>
  </div>`},

{s:"Part III", t:"Gaussian MLE — setup", html:`
  <div class="eyebrow">Data, model, loss</div>
  <h2 style="margin-bottom:16px">Fitting a Gaussian</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Data</div>
      <div class="eq" style="margin:6px 0 0;font-size:24px"><span class="texd" data-tex="\\mathcal{D} = \\{t_n\\}_{n=1}^{N}"></span></div>
      <p class="caption" style="margin-top:10px">N observations.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:10px">Model</div>
      <div class="eq" style="margin:6px 0 0;font-size:24px"><span class="texd" data-tex="t_n \\sim \\mathcal{N}(\\mu, \\sigma^2)"></span></div>
      <p class="caption" style="margin-top:10px">Unknown: <span class="tex" data-tex="\\mu"></span>. Assume <span class="tex" data-tex="\\sigma^2"></span> is known for now.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Loss</div>
      <p style="font-size:20px;max-width:none">Derived using <strong>maximum likelihood</strong>.</p>
    </div>
  </div>
  <div class="card frag" data-f="0" style="margin-top:20px;text-align:center">
    <p style="font-size:22.5px;max-width:none"><strong>Independent</strong>: knowing one observation tells us nothing about another. <strong>Identically distributed</strong>: every observation comes from the same distribution.</p>
  </div>`},

{s:"Part III", t:"Sampling a Gaussian", draw:"gsamp", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:10px">Generate data from a model</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="gssvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:21px"><span class="texd" data-tex="t_n \\sim \\mathcal{N}(\\mu, \\sigma^2)"></span></div>
      <div class="ctrl-row"><label><span style="text-transform:none">&#956;</span> <span class="val" id="gsmuv">2.0</span></label>
        <input type="range" id="gsmu" min="-1" max="5" step="0.1" value="2"></div>
      <div class="ctrl-row"><label><span style="text-transform:none">&#963;</span> <span class="val" id="gssv">1.0</span></label>
        <input type="range" id="gss" min="0.3" max="2.2" step="0.1" value="1"></div>
      <div style="display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="gs1" type="button">draw 1</button>
        <button class="bbtn" id="gs10" type="button">draw 10</button>
        <button class="bbtn" id="gsr" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">drawn</span><span class="v" id="gsn">0</span></div>
      <div class="warn" id="gswarn"></div>
      <p class="caption" style="margin-top:8px">To generate data, choose the parameters first. To fit a model, estimate them from data.</p>
    </div>
  </div>`},

{s:"Part III", t:"Gaussian MLE — the likelihood", html:`
  <div class="eyebrow">Step 1</div>
  <h2 style="margin-bottom:12px">Writing the likelihood</h2>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:22.5px">
    <div><span class="tex" data-tex="p(\\mathcal{D} \\mid \\theta)"></span></div><div><span class="tex" data-tex="= p(t_1, t_2, \\ldots, t_N \\mid \\theta)"></span></div>
      <div class="dnote">the joint density of all N observations</div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= p(t_1 \\mid \\theta)\\,p(t_2 \\mid \\theta)\\cdots p(t_N \\mid \\theta)"></span></div>
      <div class="dnote frag" data-f="0">independence lets us multiply the densities</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\prod_{n=1}^{N} p(t_n \\mid \\theta)"></span></div>
      <div class="dnote frag" data-f="1">use the same distribution for each observation</div>
    <div class="frag" data-f="2"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="2"><span class="tex" data-tex="= \\prod_{n=1}^{N} \\mathcal{N}(t_n \\mid \\mu, \\sigma^2)"></span></div>
      <div class="dnote frag" data-f="2">substitute the Gaussian density</div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:22px;text-align:center;font-size:20.5px">
    Products of many small densities can be hard to compute. Logs also simplify differentiation.</p>`},

{s:"Part III", t:"Gaussian MLE — the log", html:`
  <div class="eyebrow">Step 2</div>
  <h2 style="margin-bottom:8px">Take logarithms</h2>
  <p style="font-size:20.5px;margin-bottom:10px"><span class="tex" data-tex="\\log"></span> is strictly increasing, so taking logs preserves the maximum and turns the product into a sum.</p>
  <div class="dgrid" style="grid-template-columns:max-content max-content minmax(0,1fr);justify-content:start;font-size:21px">
    <div><span class="tex" data-tex="\\log p(\\mathcal{D} \\mid \\mu)"></span></div><div><span class="tex" data-tex="= \\log \\prod_n \\mathcal{N}(t_n \\mid \\mu,\\sigma^2)"></span></div><div class="dnote"></div>
    <div class="frag" data-f="0"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="0"><span class="tex" data-tex="= \\sum_n \\log \\mathcal{N}(t_n \\mid \\mu, \\sigma^2)"></span></div>
      <div class="dnote frag" data-f="0">the log of a product is a sum of logs</div>
    <div class="frag" data-f="1"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="1"><span class="tex" data-tex="= \\sum_n \\log\\!\\left[\\tfrac{1}{\\sqrt{2\\pi\\sigma^2}}\\exp\\!\\left(-\\tfrac{(t_n-\\mu)^2}{2\\sigma^2}\\right)\\right]"></span></div>
      <div class="dnote frag" data-f="1">substitute the density</div>
    <div class="frag" data-f="2"><span class="tex" data-tex="{}"></span></div><div class="frag" data-f="2"><span class="tex" data-tex="\\propto\\ -\\tfrac{1}{2\\sigma^2}\\sum_n (t_n-\\mu)^2"></span></div>
      <div class="dnote frag" data-f="2">terms without <span class="tex" data-tex="\\mu"></span> do not change where the maximum occurs</div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:18px;text-align:center">
    <p style="font-size:23.5px;max-width:none">Maximising this is equivalent to minimising <span class="tex" data-tex="\\tfrac12\\sum_n (t_n - \\mu)^2"></span></p>
    <p class="caption" style="margin-top:8px">Gaussian noise gives us squared-error loss.</p>
  </div>`},

{s:"Part III", t:"Gaussian MLE — solve", html:`
  <div class="eyebrow">Step 3</div>
  <h2 style="margin-bottom:14px">Set the derivative to zero</h2>
  <div class="row top" style="gap:34px">
    <div class="col">
      <div class="eq" style="margin:4px 0 12px;font-size:26px"><span class="texd" data-tex="\\mathcal{L}(\\mu) = \\tfrac12\\sum_n (t_n-\\mu)^2"></span></div>
      <div class="frag" data-f="0">
        <div class="eq" style="margin:4px 0 12px;font-size:26px"><span class="texd" data-tex="\\frac{\\partial \\mathcal{L}}{\\partial \\mu} = -\\sum_n (t_n - \\mu) \\stackrel{!}{=} 0"></span></div>
      </div>
      <div class="card accent frag" data-f="1">
        <div class="eq" style="margin:0;font-size:31px"><span class="texd" data-tex="\\mu_{\\mathrm{ML}} = \\frac{1}{N}\\sum_{n=1}^{N} t_n"></span></div>
      </div>
    </div>
    <div class="col" style="flex:.95">
      <div class="card frag" data-f="2">
        <div class="eyebrow" style="margin-bottom:9px">And the variance</div>
        <p style="font-size:20px;max-width:none">The same argument applied to <span class="tex" data-tex="\\sigma^2"></span> gives</p>
        <div class="eq" style="margin:8px 0 0;font-size:21px"><span class="texd" data-tex="\\sigma^2_{\\mathrm{ML}} = \\frac{1}{N}\\sum_n (t_n - \\mu_{\\mathrm{ML}})^2"></span></div>
      </div>
      <div class="card accent frag" data-f="3" style="margin-top:14px">
        <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Note</div>
        <p style="font-size:20px;max-width:none">Under a Gaussian model, maximum likelihood gives the sample mean.</p>
      </div>
    </div>
  </div>`},

{s:"Part III", t:"Why MLE", html:`
  <div class="eyebrow">Large-sample properties</div>
  <h2 style="margin-bottom:16px">Properties of maximum likelihood</h2>
  <div class="grid3">
    <div class="appcard frag" data-f="0" style="padding:20px"><div class="t" style="font-size:23.5px">Consistency</div>
      <div class="d" style="font-size:18.5px;margin-top:8px">The estimate approaches the true
      parameter.</div></div>
    <div class="appcard frag" data-f="1" style="padding:20px"><div class="t" style="font-size:23.5px">Asymptotic normality</div>
      <div class="d" style="font-size:18.5px;margin-top:8px">Across datasets, estimates are approximately Gaussian around the true value.</div></div>
    <div class="appcard frag" data-f="2" style="padding:20px"><div class="t" style="font-size:23.5px">Asymptotic efficiency</div>
      <div class="d" style="font-size:18.5px;margin-top:8px">Every unbiased estimator obeys<span class="texd" data-tex="\\operatorname{Var}(\\hat{\\theta}) \\ge \\frac{1}{N\\,I(\\theta)}"></span>
      where <span class="tex" data-tex="I(\\theta)"></span> is the Fisher information. MLE reaches this bound asymptotically.</div></div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:22px">
    <p style="font-size:20.5px;max-width:none">Under suitable conditions, these are <strong>asymptotic</strong> results. With limited data, MLE can be inaccurate: <span class="tex" data-tex="\\sigma^2_{\\mathrm{ML}}"></span> underestimates the variance, and the unbiased estimate
    divides by <span class="tex" data-tex="N-1"></span>.</p>
  </div>`},

{s:"Part III", t:"Multivariate Gaussian", draw:"cov", html:`
  <div class="eyebrow">One more distribution</div>
  <h2 style="margin-bottom:12px">The multivariate Gaussian</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="eq" style="margin:0 0 14px;font-size:23px"><span class="texd" data-tex="\\mathcal{N}(\\mathbf{x} \\mid \\boldsymbol{\\mu}, \\boldsymbol{\\Sigma}) = \\frac{1}{(2\\pi)^{D/2}\\lvert\\boldsymbol{\\Sigma}\\rvert^{1/2}}\\exp\\!\\left(-\\tfrac12(\\mathbf{x}-\\boldsymbol{\\mu})^\\top\\boldsymbol{\\Sigma}^{-1}(\\mathbf{x}-\\boldsymbol{\\mu})\\right)"></span></div>
      <p style="font-size:20.5px"><span class="tex" data-tex="\\boldsymbol{\\mu}"></span> is a mean vector with <span class="tex" data-tex="D"></span> entries. <span class="tex" data-tex="\\boldsymbol{\\Sigma}"></span> is a <span class="tex" data-tex="D\\times D"></span> <strong>covariance
      matrix</strong>.</p>
      <p class="frag" data-f="0" style="font-size:20.5px;margin-top:12px">You do not need to memorise this formula. It is provided in exams.</p>
    </div>
    <div class="col frag" data-f="1" style="flex:1.1">
      <div class="fig h-260"><svg viewBox="0 0 470 260"><g id="covfig"></g></svg></div>
      <p class="cred">Spherical: equal spread in every direction. Diagonal: spread along each axis. Full: allows correlations.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="2" style="margin-top:14px;text-align:center;font-size:20px">
    Independent univariate Gaussians are the diagonal case, <span class="tex" data-tex="\\boldsymbol{\\Sigma} = \\mathrm{diag}(\\sigma_1^2,\\ldots,\\sigma_D^2)"></span>.</p>`},

{s:"Part III", t:"Part III in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part III summary</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The steps</div><p style="font-size:20px;max-width:none">Take logs of the likelihood, drop constants, and set the derivative to zero.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The result</div><p style="font-size:20px;max-width:none"><span class="tex" data-tex="\\mu_{\\mathrm{ML}} = \\tfrac1N\\sum_n t_n"></span> &#8212; the sample mean.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The limitation</div><p style="font-size:20px;max-width:none">These guarantees need large samples. The MLE of variance is biased downwards.</p></div>
  </div>`},

    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About maximum likelihood, or fitting the Gaussian</p>

  </div>`},

{s:"Part IV", t:"Part IV", div:true, html:`

    <div class="part">Part IV</div>
    <h1>Linear regression: a probabilistic approach</h1>
    <div class="bar"></div>
