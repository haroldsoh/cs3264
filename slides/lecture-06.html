/* ---- Hoeffding, for the ratings: the exact sampling distribution and its tails ----
   Lecture 5's picture with this week's names. The curve is the exact binomial
   distribution of the estimate from V ratings (mass k/V scaled to a density), not a
   Gaussian; the shaded tails are the bad event, and the readout compares their exact
   size with Hoeffding's bound. */
let HF6_m=200, HF6_e=0.10; const HF6_MU=0.735;
function hf6Setm(v){ HF6_m=v; drawHoef6(); }  function hf6Sete(v){ HF6_e=v; drawHoef6(); }
function drawHoef6(){
  const svg=document.getElementById('hoef6'); if(!svg) return;
  const W=560,H=330, ml=48,mr=16,mt=50,mb=44, lo=0.40, hi=1.0, V=HF6_m, mu=HF6_MU, e=HF6_e;
  const pmf=binomPmf6(V,mu), dens=pmf.map(q=>q*V), pk=Math.max(...dens);
  const X=v=>ml+((v-lo)/(hi-lo))*(W-ml-mr), Y=d=>mt+(1-d/(pk*1.12))*(H-mt-mb);
  const pt=k=>X(k/V).toFixed(1)+' '+Y(dens[k]).toFixed(1);
  const ks=[]; for(let k=0;k<=V;k++) if(k/V>=lo) ks.push(k);
  const xs=ks.map(k=>k/V), ds=ks.map(k=>dens[k]);
  /* the density between two bar tops, so a region can end exactly at mu +- eps and the three regions tile the curve */
  const dAt=x=>{ if(x<=xs[0]) return ds[0]; if(x>=xs[xs.length-1]) return ds[ds.length-1]; let i=1; while(xs[i]<x) i++; const t=(x-xs[i-1])/(xs[i]-xs[i-1]); return ds[i-1]+t*(ds[i]-ds[i-1]); };
  const region=(x0,x1,col)=>{ x0=Math.max(x0,lo); x1=Math.min(x1,hi); if(x1<=x0) return '';
    const pts=[[x0,dAt(x0)]]; xs.forEach((x,i)=>{ if(x>x0&&x<x1) pts.push([x,ds[i]]); }); pts.push([x1,dAt(x1)]);
    return '<path d="M'+X(x0).toFixed(1)+' '+(H-mb)+' L'+pts.map(p=>X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' L')+' L'+X(x1).toFixed(1)+' '+(H-mb)+' Z" fill="'+col+'" opacity=".28"/>'; };
  let g='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>';
  [0.4,0.5,0.6,0.7,0.8,0.9,1.0].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+17)+'" text-anchor="middle">'+v.toFixed(1)+'</text>'; });
  g+='<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">the estimate &#956;&#770; from V ratings</text>';
  g+=region(lo,mu-e,'var(--s2)')+region(mu+e,hi,'var(--s2)')+region(mu-e,mu+e,'var(--s4)');
  g+='<path d="M'+ks.map(pt).join(' L')+'" fill="none" stroke="var(--ink)" stroke-width="2.2"/>';
  g+='<line x1="'+X(mu).toFixed(1)+'" y1="'+mt+'" x2="'+X(mu).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--ink)" stroke-dasharray="5 4"/>'
   + '<text class="tick" x="'+X(mu).toFixed(1)+'" y="'+(mt-4)+'" text-anchor="middle">&#956; = '+mu+'</text>';
  [mu-e, mu+e].forEach((v,i)=>{ if(v>hi) return; g+='<line x1="'+X(v).toFixed(1)+'" y1="'+(mt+14)+'" x2="'+X(v).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s2)" stroke-width="1.4"/>'
     + '<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(mt+10)+'" text-anchor="middle" fill="var(--s2)">&#956; '+(i?'+':'&#8722;')+' &#949;</text>'; });
  g+=legendRow(ml, 18, [{t:'good: within &#949;',c:'var(--s4)',w:6},{t:'bad event: off by more than &#949;',c:'var(--s2)',w:6}]);
  svg.innerHTML=g;
  const a=document.getElementById('hf6mv'); if(a) a.textContent=V;
  const b=document.getElementById('hf6ev'); if(b) b.textContent=e.toFixed(2);
  const w=document.getElementById('hf6warn'); if(!w) return;
  let tail=0; pmf.forEach((q,k)=>{ if(Math.abs(k/V-mu)>e+1e-12) tail+=q; });
  const bound=2*Math.exp(-2*V*e*e), fmt=v=>v<0.001?v.toExponential(1):v.toFixed(3);
  const hb=document.getElementById('hf6bound');
  if(hb){ hb.innerHTML='<span class="tex" data-tex="\\Pr(\\text{bad}) \\le 2e^{-2\\cdot '+V+'\\cdot '+e.toFixed(2)+'^2} = '+fmt(bound)+(bound>1?'\\quad(\\text{above } 1\\text{: says nothing})':'')+'"></span>'; if(typeof renderTeX==='function') renderTeX(); }
  w.innerHTML='The shaded tails hold exactly <strong>'+fmt(tail)+'</strong> of the probability. The bound is never below the real tail, at any V.';
}

/* ---- match last week's objects to today's ----------------------------------------
   The Lecture 4 board, with this week's pieces. Chips (today's objects, shuffled) are
   dragged onto slots (last week's objects, in the order of the table); a wrong slot
   flashes and the chip walks home. The engine ignores pointerdowns inside an svg, so
   dragging cannot turn the page. */
let M6G=null, M6G_FLASH=null;
const M6G_CW=380, M6G_SX=470, M6G_SW=420;
function m6gInit(){
  const sub=(b,s,r)=>b+'<tspan dy="4" style="font-size:12px">'+s+'</tspan><tspan dy="-4">'+r+'</tspan>';
  M6G={chips:[
    {id:'ld',   lab:sub('L','D','(h)'),            sub:'the fraction of the N points where h is wrong',  job:'muhat'},
    {id:'n',    lab:'N',                           sub:'the number of points in the dataset',           job:'v'},
    {id:'pt',   lab:'one point',                   sub:'h is wrong (1) or right (0) on it',             job:'draw'},
    {id:'lp',   lab:sub('L','p','(h)'),            sub:'the fraction of all inputs where h is wrong',   job:'mu'}],
    slots:[
    {job:'draw', lab:'one rating',                  sub:'hot (1) or not (0)'},
    {job:'mu',   lab:'&#956;',                      sub:'the fraction of everyone who says hot'},
    {job:'muhat',lab:'&#956;&#770;',                sub:'the fraction of the V ratings that say hot'},
    {job:'v',    lab:'V',                           sub:'the number of ratings'}],
    drag:null, wrong:0};
  M6G.chips.forEach((c,i)=>{ c.hx=20; c.hy=24+i*64; c.x=c.hx; c.y=c.hy; c.locked=false; });
}
function m6gReset(){ M6G=null; drawMatch6(); }
function m6gChip(c){
  return '<g style="cursor:grab">'
   + '<rect x="'+c.x+'" y="'+c.y+'" width="'+M6G_CW+'" height="52" rx="8" fill="var(--s1)" opacity=".18"/>'
   + '<rect x="'+c.x+'" y="'+c.y+'" width="'+M6G_CW+'" height="52" rx="8" fill="none" stroke="var(--s1)" stroke-width="1.8"/>'
   + '<text class="matn" style="font-size:17px" x="'+(c.x+16)+'" y="'+(c.y+22)+'">'+c.lab+'</text>'
   + '<text class="tick" style="font-size:13.5px" x="'+(c.x+16)+'" y="'+(c.y+41)+'">'+c.sub+'</text></g>';
}
function drawMatch6(){
  const svg=document.getElementById('match6'); if(!svg) return;
  if(!M6G) m6gInit();
  if(!svg._drag){
    svg._drag=1; svg.style.touchAction='none';
    const pos=e=>{ const r=svg.getBoundingClientRect(); return [ (e.clientX-r.left)/r.width*900, (e.clientY-r.top)/r.height*300 ]; };
    svg.addEventListener('pointerdown',e=>{
      const [mx,my]=pos(e);
      const c=[...M6G.chips].reverse().find(c=>!c.locked && mx>=c.x&&mx<=c.x+M6G_CW&&my>=c.y&&my<=c.y+52);
      if(!c) return;
      M6G.drag={c, dx:mx-c.x, dy:my-c.y};
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault(); drawMatch6();
    });
    svg.addEventListener('pointermove',e=>{ if(!M6G.drag) return; const [mx,my]=pos(e); M6G.drag.c.x=mx-M6G.drag.dx; M6G.drag.c.y=my-M6G.drag.dy; drawMatch6(); });
    const up=e=>{
      if(!M6G.drag) return;
      const c=M6G.drag.c; M6G.drag=null;
      const cx=c.x+M6G_CW/2, cy=c.y+26;
      const k=M6G.slots.findIndex((s,i)=>{ const sy=20+i*66; return cx>=M6G_SX&&cx<=M6G_SX+M6G_SW&&cy>=sy&&cy<=sy+58; });
      if(k>=0 && M6G.slots[k].job===c.job){ c.locked=true; }
      else if(k>=0){ M6G.wrong++; M6G_FLASH=k; setTimeout(()=>{M6G_FLASH=null; drawMatch6();},450); }
      c.x=c.hx; c.y=c.hy;
      drawMatch6();
    };
    svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  }
  let g='<text class="legend" x="20" y="14">today &#8212; drag each one right</text>'
   + '<text class="legend" x="'+M6G_SX+'" y="14">last week</text>';
  M6G.slots.forEach((s,i)=>{
    const y=20+i*66, hot=(M6G_FLASH===i), done=M6G.chips.find(c=>c.locked&&c.job===s.job);
    if(done){
      g+='<rect x="'+M6G_SX+'" y="'+y+'" width="'+M6G_SW+'" height="58" rx="8" fill="var(--s4)" opacity=".16"/>'
       + '<rect x="'+M6G_SX+'" y="'+y+'" width="'+M6G_SW+'" height="58" rx="8" fill="none" stroke="var(--s4)" stroke-width="1.8"/>'
       + '<text class="matn" style="font-size:16.5px" x="'+(M6G_SX+18)+'" y="'+(y+24)+'">'+s.lab+' &#10003; &#8212; '+done.lab+'</text>'
       + '<text class="tick" style="font-style:italic" x="'+(M6G_SX+18)+'" y="'+(y+44)+'">'+s.sub+'</text>';
    }else{
      g+='<rect x="'+M6G_SX+'" y="'+y+'" width="'+M6G_SW+'" height="58" rx="8" fill="'+(hot?'var(--accent)':'var(--bg-alt)')
       + '" opacity="'+(hot?'.25':'1')+'" stroke="'+(hot?'var(--accent)':'var(--rule)')+'" stroke-width="1.5"'+(hot?'':' stroke-dasharray="5 4"')+'/>'
       + '<text class="matn" style="font-size:16px" x="'+(M6G_SX+M6G_SW/2)+'" y="'+(y+25)+'" text-anchor="middle">'+s.lab+'</text>'
       + '<text class="tick" x="'+(M6G_SX+M6G_SW/2)+'" y="'+(y+44)+'" text-anchor="middle" style="font-style:italic">'+s.sub+'</text>';
    }
  });
  const done=M6G.chips.filter(c=>c.locked).length;
  M6G.chips.forEach(c=>{ if(c.locked) return; if(M6G.drag&&M6G.drag.c===c) return; g+=m6gChip(c); });
  if(M6G.drag) g+=m6gChip(M6G.drag.c);
  if(done===4) g+='<text class="legend" x="20" y="292" fill="var(--s4)">All four placed. New ratings give a new &#956;&#770;, a new dataset a new L<tspan dy="3" style="font-size:11px">D</tspan><tspan dy="-3">(h); the number each one estimates does not move.</tspan></text>';
  else g+='<text class="tick" x="20" y="292">'+done+' of 4 placed'+(M6G.wrong?' &#183; '+M6G.wrong+' wrong '+(M6G.wrong>1?'tries':'try')+' &#8212; wrong slots bounce back':'')+'</text>';
  svg.innerHTML=g;
}

/* ---- the finite-class bound against N ---------------------------------------------
   Pr(bad event) <= |H| 2 exp(-2 N eps^2), against N on a log axis, with the |H| = 1
   curve (last week's, for one hypothesis) kept for comparison and the delta = 0.05
   line read off. Above 1 the bound says nothing; that region is shaded. */
let PAC6_LH=3, PAC6_E=0.10; const PAC6_D=0.05;
function pac6SetH(l){ PAC6_LH=l; drawPac6(); }  function pac6SetE(e){ PAC6_E=e; drawPac6(); }
function drawPac6(){
  const svg=document.getElementById('pac6'); if(!svg) return;
  const W=560,H=300, ml=52,mr=18,mt=30,mb=46, N0=10, N1=1e6, LX=Math.log10(N1/N0), M=Math.pow(10,PAC6_LH), e=PAC6_E;
  const bnd=(N,m)=>Math.min(1.25, 2*m*Math.exp(-2*N*e*e));
  const X=N=>ml+(Math.log10(N/N0)/LX)*(W-ml-mr), Y=v=>mt+(1-v/1.25)*(H-mt-mb);
  let g='<rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(Y(1)-mt).toFixed(1)+'" fill="var(--s2)" opacity=".07"/>'
   + '<text class="tick" x="'+(W-mr-6)+'" y="'+(mt+14)+'" text-anchor="end" fill="var(--s2)">above 1: the bound says nothing</text>';
  [0,0.25,0.5,0.75,1].forEach(v=>{ g+='<line x1="'+ml+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(2)+'</text>'; });
  [10,100,1e3,1e4,1e5,1e6].forEach(n=>{ g+='<text class="tick" x="'+X(n).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+(n>=1e4?'10'+(''+Math.round(Math.log10(n))).replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]):n.toLocaleString('en'))+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">data points N  (log scale)</text>';
  const path=m=>{ let s=''; for(let i=0;i<=300;i++){ const N=N0*Math.pow(10,i/300*LX); s+=(s?' L':'M')+X(N).toFixed(1)+' '+Y(bnd(N,m)).toFixed(1); } return s; };
  g+='<path d="'+path(1)+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.4" opacity=".6"/>'
   + '<path d="'+path(M)+'" fill="none" stroke="var(--s2)" stroke-width="3"/>';
  g+='<line x1="'+ml+'" y1="'+Y(PAC6_D).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(PAC6_D).toFixed(1)+'" stroke="var(--s4)" stroke-width="1.6" stroke-dasharray="6 4"/>'
   + '<text class="tick" x="'+(W-mr-6)+'" y="'+(Y(PAC6_D)-6).toFixed(1)+'" text-anchor="end" fill="var(--s4)">&#948; = 0.05</text>';
  const N1c=Math.log(2*M)/(2*e*e), Nd=Math.log(2*M/PAC6_D)/(2*e*e), Nd1=Math.log(2/PAC6_D)/(2*e*e);
  if(Nd>=N0&&Nd<=N1) g+='<circle cx="'+X(Nd).toFixed(1)+'" cy="'+Y(PAC6_D).toFixed(1)+'" r="5.5" fill="var(--s4)" stroke="var(--bg)" stroke-width="1.5"/>'
   + '<text class="tick" x="'+(X(Nd)+9).toFixed(1)+'" y="'+(Y(PAC6_D)-8).toFixed(1)+'" fill="var(--s4)" font-weight="700">N = '+Math.ceil(Nd).toLocaleString('en')+'</text>';   /* right of the marker, above the axis ticks */
  g+=legendRow(ml, 20, [{t:'this |&#8459;| and &#949;',c:'var(--s2)',w:3},{t:'|&#8459;| = 1: one hypothesis, last week',c:'var(--ink-soft)'}]);
  svg.innerHTML=g;
  const a=document.getElementById('pac6hv'); if(a) a.textContent=M.toLocaleString('en');
  const b=document.getElementById('pac6ev'); if(b) b.textContent=e.toFixed(2);
  const w=document.getElementById('pac6warn'); if(!w) return;
  const f=v=>Math.ceil(v).toLocaleString('en');
  w.innerHTML='|&#8459;| = '+M.toLocaleString('en')+', &#949; = '+e.toFixed(2)+': the bound is above 1 &#8212; says nothing &#8212; until N &#8776; '+f(Math.max(N1c,0))
   + ', and falls below &#948; = 0.05 at <strong>N = '+f(Nd)+'</strong>'+(M>1?' (one hypothesis: '+f(Nd1)+', so the class costs '+(Math.ceil(Nd)-Math.ceil(Nd1)).toLocaleString('en')+' more points)':'')
   + '. The real probability of the bad event is smaller than the curve: this is an upper bound.';
}

/* ---- 1/eps against 1/eps^2: the two sample sizes ------------------------------------
   N needed against the tolerance, log scale: the general bound (Hoeffding + union)
   and the realizable one (direct count + union), for the chosen |H| and delta = 0.05. */
let RLZC6_E=0.05, RLZC6_LH=3; const RLZC6_D=0.05;
function rlzc6SetE(e){ RLZC6_E=e; drawRlzc6(); }  function rlzc6SetH(l){ RLZC6_LH=l; drawRlzc6(); }
function drawRlzc6(){
  const svg=document.getElementById('rlzc6'); if(!svg) return;
  const W=560,H=300, ml=58,mr=18,mt=30,mb=46, e0=0.01, e1=0.50, M=Math.pow(10,RLZC6_LH), d=RLZC6_D;
  const gen=e=>Math.log(2*M/d)/(2*e*e), rlz=e=>Math.log(M/d)/e;
  const ylo=1, yhi=7;   /* log10 N from 10 to 10^7 */
  const X=e=>ml+((e-e0)/(e1-e0))*(W-ml-mr), Y=n=>mt+(1-(Math.log10(n)-ylo)/(yhi-ylo))*(H-mt-mb);
  let g='';
  for(let p=ylo;p<=yhi;p++){ g+='<line x1="'+ml+'" y1="'+Y(Math.pow(10,p)).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(Math.pow(10,p)).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(Math.pow(10,p))+4).toFixed(1)+'" text-anchor="end">10'+(''+p).replace(/\d/g,q=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+q])+'</text>'; }
  [0.05,0.10,0.20,0.30,0.40,0.50].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+v.toFixed(2)+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">tolerance &#949;</text>'
   + '<text class="legend" transform="translate(14,'+((mt+H-mb)/2)+') rotate(-90)" text-anchor="middle">data points needed</text>';
  const path=f=>{ let s=''; for(let i=0;i<=200;i++){ const e=e0+(e1-e0)*i/200; s+=(s?' L':'M')+X(e).toFixed(1)+' '+Y(Math.max(10,Math.min(1e7,f(e)))).toFixed(1); } return s; };
  g+='<path d="'+path(gen)+'" fill="none" stroke="var(--s2)" stroke-width="3"/><path d="'+path(rlz)+'" fill="none" stroke="var(--s4)" stroke-width="3"/>';
  const e=RLZC6_E, ng=gen(e), nr=rlz(e);
  g+='<line x1="'+X(e).toFixed(1)+'" y1="'+mt+'" x2="'+X(e).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/>'
   + '<circle cx="'+X(e).toFixed(1)+'" cy="'+Y(ng).toFixed(1)+'" r="5.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="1.5"/>'
   + '<circle cx="'+X(e).toFixed(1)+'" cy="'+Y(nr).toFixed(1)+'" r="5.5" fill="var(--s4)" stroke="var(--bg)" stroke-width="1.5"/>'
   + '<text class="tick" x="'+(X(e)+9).toFixed(1)+'" y="'+(Y(ng)-6).toFixed(1)+'" fill="var(--s2)" font-weight="700">'+Math.ceil(ng).toLocaleString('en')+'</text>'
   + '<text class="tick" x="'+(X(e)+9).toFixed(1)+'" y="'+(Y(nr)+16).toFixed(1)+'" fill="var(--s4)" font-weight="700">'+Math.ceil(nr).toLocaleString('en')+'</text>';
  g+=legendRow(ml, 20, [{t:'general: &#8733; 1/&#949;&#178;',c:'var(--s2)',w:3},{t:'realizable: &#8733; 1/&#949;',c:'var(--s4)',w:3}]);
  svg.innerHTML=g;
  const a=document.getElementById('rlzc6ev'); if(a) a.textContent=e.toFixed(2);
  const b=document.getElementById('rlzc6hv'); if(b) b.textContent=M.toLocaleString('en');
  const w=document.getElementById('rlzc6warn'); if(!w) return;
  w.innerHTML='At &#949; = '+e.toFixed(2)+' with |&#8459;| = '+M.toLocaleString('en')+': the general bound asks for <strong>'+Math.ceil(ng).toLocaleString('en')+'</strong> points, the realizable one for <strong>'+Math.ceil(nr).toLocaleString('en')+'</strong>, '
   + (ng/nr).toFixed(1)+' times fewer. Halve &#949;: the general number goes up four times, the realizable one twice. The ratio is about 2/&#949;, so the realizable case matters most when you want a tight tolerance.';
}


/* ---- Lecture 1's hiring demo, as it was --------------------------------------
   Candidates have a true ability (grey tick) and an exam score = ability + luck. You hire the
   top scorer; the readout says how often that is the best candidate and by how much the winning
   score flatters them. Each candidate is a hypothesis; the exam is the training set. */
const H_W=560,H_H=330,H_ML=46,H_MR=14,H_MT=18,H_MB=44, H_LO=20,H_HI=90;
let HIRE_N=12, HIRE_SD=1.0, HIRE_SEED=1, HIRE_T=0, HIRE_ANIM=null;
const H_POOL=(function(){ const r=lcg5(20260009), a=[]; for(let i=0;i<40;i++) a.push(55+11*gauss5(r)); return a; })();
const hX=(i,n)=>H_ML+(i+0.5)*(H_W-H_ML-H_MR)/n;
const hY=v=>H_MT+(H_H-H_MT-H_MB)*(H_HI-v)/(H_HI-H_LO);
const argmax=a=>a.reduce((b,v,i)=>v>a[b]?i:b,0);
function hAbility(n){ return H_POOL.slice(0,n); }
function hLuck(n,sd,seed){ const r=lcg5(seed), e=[]; for(let i=0;i<n;i++) e.push(sd*4.2*gauss5(r)); return e; }
function drawHire(){
  const svg=document.getElementById('hiresvg'); if(!svg) return;
  const n=HIRE_N, A=hAbility(n), E=hLuck(n,HIRE_SD,HIRE_SEED);
  const S=A.map((a,i)=>a+E[i]);
  const best=argmax(A), hired=argmax(S);
  let g='';
  for(let v=30;v<=90;v+=15){ const py=hY(v);
    g+='<line class="gridline" x1="'+H_ML+'" y1="'+py+'" x2="'+(H_W-H_MR)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(H_ML-9)+'" y="'+(py+4)+'" text-anchor="end">'+v+'</text>'; }
  g+='<line class="axis" x1="'+H_ML+'" y1="'+(H_H-H_MB)+'" x2="'+(H_W-H_MR)+'" y2="'+(H_H-H_MB)+'"/>'
   + '<line class="axis" x1="'+H_ML+'" y1="'+H_MT+'" x2="'+H_ML+'" y2="'+(H_H-H_MB)+'"/>';
  const r=n>26?3.4:(n>16?4.4:5.6);
  for(let i=0;i<n;i++){
    const x=hX(i,n), ya=hY(A[i]), ys=hY(A[i]+E[i]*HIRE_T);
    g+='<line x1="'+(x-7)+'" y1="'+ya+'" x2="'+(x+7)+'" y2="'+ya+'" stroke="var(--ink-soft)" stroke-width="2" opacity=".55"/>';
    if(HIRE_T>0.02)
      g+='<line x1="'+x+'" y1="'+ya+'" x2="'+x+'" y2="'+ys+'" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>';
    const isH=(i===hired&&HIRE_T>0.98), isB=(i===best);
    if(isH) g+='<circle cx="'+x+'" cy="'+ys+'" r="'+(r+6)+'" fill="var(--accent)" opacity=".16"/>';
    g+='<circle cx="'+x+'" cy="'+ys+'" r="'+r+'" fill="'+(isH?'var(--accent)':'var(--ink)')+'"'
     + (isB?' stroke="var(--accent2)" stroke-width="2.4"':'')+'/>';
  }
  g+='<g transform="translate('+(H_ML+6)+','+(H_H-H_MB+20)+')">'
   + '<circle cx="6" cy="-4" r="5" fill="var(--ink)" stroke="var(--accent2)" stroke-width="2.4"/>'
   + '<text class="legend" x="17" y="0">truly best</text>'
   + '<circle cx="112" cy="-4" r="5" fill="var(--accent)"/>'
   + '<text class="legend" x="123" y="0">hired</text>'
   + '<line x1="196" y1="-4" x2="210" y2="-4" stroke="var(--ink-soft)" stroke-width="2" opacity=".55"/>'
   + '<text class="legend" x="217" y="0">true ability (never observed)</text></g>';
  svg.innerHTML=g;
  const hit=document.getElementById('hirehit'), gap=document.getElementById('hiregap'), wn=document.getElementById('hirewarn');
  if(!hit||!gap||!wn) return;
  if(HIRE_T<0.98){ hit.textContent='—'; gap.textContent='—'; return; }
  hit.textContent = hired===best ? 'yes' : 'no';
  hit.style.color = hired===best ? 'var(--accent2)' : 'var(--accent)';
  gap.textContent = (S[hired]-A[hired]>=0?'+':'') + (S[hired]-A[hired]).toFixed(1);
  let win=0, over=0, R=400;
  for(let k=0;k<R;k++){ const e=hLuck(n,HIRE_SD,1000+k*7919), sc=A.map((a,i)=>a+e[i]);
    const h=argmax(sc); if(h===best) win++; over+=sc[h]-A[h]; }
  const pct=Math.round(100*win/R), avg=(over/R).toFixed(1);
  if(HIRE_SD===0) wn.innerHTML='With no luck in the score, the exam measures skill exactly — the top scorer <em>is</em> the best. Add some.';
  else wn.innerHTML='Over 400 runs the top scorer is genuinely the best <strong>'+pct+'%</strong> of the time, '
    + 'and their score flatters them by <strong>+'+avg+'</strong> on average. '
    + (pct<50?'Push the number of candidates up and watch it get worse.':'');
}
function hireRun(){
  HIRE_SEED=(HIRE_SEED*1103515245+12345)>>>0;
  const t0=performance.now(), DUR=620;
  if(HIRE_ANIM) cancelAnimationFrame(HIRE_ANIM);
  const step=()=>{ const e=Math.min(1,(performance.now()-t0)/DUR);
    HIRE_T=1-Math.pow(1-e,3);
    drawHire();
    HIRE_ANIM = e<1 ? requestAnimationFrame(step) : null; };
  HIRE_ANIM=requestAnimationFrame(step);
}
function hireReset(){ if(HIRE_ANIM) cancelAnimationFrame(HIRE_ANIM); HIRE_ANIM=null; HIRE_T=0; drawHire();
  const w=document.getElementById('hirewarn'); if(w) w.textContent='Nobody has taken the exam yet. Grey ticks are true ability — which you never get to see.'; }

/* ---- the two guarantees, on one dataset --------------------------------------------
   The eight hypotheses of unif6, one dataset of N points, eps = 0.10. h-hat is the lowest dot,
   h* the lowest green line. Dashed: L_D(h-hat) + eps, the bound for the pick, and L_p(h*) + 2 eps,
   the bound against the best in the class. Both are promised only on a good dataset, which the
   readout checks. */
let PICK6_S=1; const PICK6_N=50, PICK6_EPS=0.10;
function pick6Best(LD){ let hh=0, hs=0; LD.forEach((v,k)=>{ if(v<LD[hh]) hh=k; }); UNIF6_LP.forEach((v,k)=>{ if(v<UNIF6_LP[hs]) hs=k; }); return [hh,hs]; }
function pick6New(){ PICK6_S++; drawPick6(); }
function pick6Unlucky(){
  const ok=(LD,k)=>Math.abs(LD[k]-UNIF6_LP[k])<=PICK6_EPS;
  for(let pass=0; pass<2; pass++) for(let s=PICK6_S+1; s<PICK6_S+5001; s++){ const LD=unif6LD(s,PICK6_N), [hh,hs]=pick6Best(LD);
    if(hh!==hs && (pass===1 || LD.every((v,k)=>ok(LD,k)))){ PICK6_S=s; drawPick6(); return; } }   /* first a good dataset with a wrong pick; failing that, any wrong pick */
  drawPick6(); }
function drawPick6(){
  const svg=document.getElementById('pick6'); if(!svg) return;
  const W=560,H=300, ml=50,mr=14,mt=34,mb=42, M=UNIF6_LP.length, N=PICK6_N, e=PICK6_EPS;
  const LD=unif6LD(PICK6_S,N), [hh,hs]=pick6Best(LD);
  const X=k=>ml+(k+0.5)*(W-ml-mr)/M, Y=v=>mt+(1-v)*(H-mt-mb), bw=(W-ml-mr)/M*0.58;
  let g='';
  [0,0.25,0.5,0.75,1].forEach(v=>{ g+='<line x1="'+ml+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(2)+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>';
  UNIF6_LP.forEach((p,k)=>{ const x=X(k), out=Math.abs(LD[k]-p)>e;
    g+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+Y(p+e).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(Y(p-e)-Y(p+e)).toFixed(1)+'" fill="var(--s4)" opacity=".17"/>'
     + '<line x1="'+(x-bw/2).toFixed(1)+'" y1="'+Y(p).toFixed(1)+'" x2="'+(x+bw/2).toFixed(1)+'" y2="'+Y(p).toFixed(1)+'" stroke="var(--s4)" stroke-width="'+(k===hs?3.6:2.4)+'"/>'
     + '<circle cx="'+x.toFixed(1)+'" cy="'+Y(LD[k]).toFixed(1)+'" r="6.5" fill="'+(out?'var(--s2)':'var(--s1)')+'" stroke="var(--bg)" stroke-width="1.6"/>'
     + '<text class="tick" x="'+x.toFixed(1)+'" y="'+(H-mb+17)+'" text-anchor="middle">h<tspan font-size="10" dy="3">'+(k+1)+'</tspan></text>'; });
  g+='<circle cx="'+X(hh).toFixed(1)+'" cy="'+Y(LD[hh]).toFixed(1)+'" r="12" fill="none" stroke="var(--accent)" stroke-width="2.4"/>'
   + '<text class="tick" x="'+(X(hh)+15).toFixed(1)+'" y="'+(Y(LD[hh])+5).toFixed(1)+'" fill="var(--accent)" font-weight="700">&#293;</text>'
   + '<text class="tick" x="'+X(hs).toFixed(1)+'" y="'+(Y(UNIF6_LP[hs])-11-(hs===hh?14:0)).toFixed(1)+'" text-anchor="middle" fill="var(--s4)" font-weight="700">h*</text>';
  const b1=LD[hh]+e, b2=UNIF6_LP[hs]+2*e;
  const sub6=(b,s,r)=>b+'<tspan font-size="10" dy="3">'+s+'</tspan><tspan dy="-3">'+r+'</tspan>';
  g+='<line x1="'+ml+'" y1="'+Y(b1).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(b1).toFixed(1)+'" stroke="var(--accent)" stroke-width="1.8" stroke-dasharray="6 4"/>'
   + '<text class="tick" x="'+(W-mr-4)+'" y="'+(Y(b1)-5+(b1<b2&&Math.abs(b2-b1)<0.06?14:0)).toFixed(1)+'" text-anchor="end" fill="var(--accent)" font-weight="700">'+sub6('L','D','(&#293;) + &#949; = '+b1.toFixed(2))+'</text>'
   + '<line x1="'+ml+'" y1="'+Y(b2).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(b2).toFixed(1)+'" stroke="var(--s2)" stroke-width="1.8" stroke-dasharray="6 4"/>'
   + '<text class="tick" x="'+(W-mr-4)+'" y="'+(Y(b2)-5+(b2<=b1&&Math.abs(b2-b1)<0.06?14:0)).toFixed(1)+'" text-anchor="end" fill="var(--s2)" font-weight="700">'+sub6('L','p','(h*) + 2&#949; = '+b2.toFixed(2))+'</text>';

const CONTROLS='input,button,a,select,textarea,label,.demo,.demo-ctrl,.bbtn,.basisbtns,video,iframe,svg';
let downInControl=false;
canvas.addEventListener('pointerdown',e=>{ downInControl=!!(e.target.closest&&e.target.closest(CONTROLS)); });

  if(document.body.classList.contains('inking')) return;

/* ============================================================
   ANNOTATION LAYER
   Draw over the slide with a mouse, trackpad or pen tablet. Pen pressure is
   used for stroke width when the device reports it. Ink is kept per slide.
   D toggles · E eraser · C clears the current slide · strokes survive navigation.
   ============================================================ */
const ink=document.getElementById('ink'), ictx=ink.getContext('2d');
let inkColor='#9B2C2C', inkWidth=2.2, drawing=false, erasing=false, inkStore={};
function sizeInk(){
  const r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  const keep=ink.width?ictx.getImageData(0,0,ink.width,ink.height):null;
  ink.width=w*r; ink.height=h*r; ink.style.width=w+'px'; ink.style.height=h+'px';
  ictx.setTransform(r,0,0,r,0,0); ictx.lineCap='round'; ictx.lineJoin='round';
  if(keep) try{ictx.putImageData(keep,0,0);}catch(_){}
}
addEventListener('resize',sizeInk); sizeInk();
function toggleInk(){
  document.body.classList.toggle('inking');
  document.querySelectorAll('.ib-sw').forEach(sw=>sw.classList.toggle('sel',sw.dataset.c===inkColor));
}
function clearInk(){ ictx.clearRect(0,0,ink.width,ink.height); delete inkStore[idx]; }
function saveInk(){ try{ inkStore[idx]=ink.toDataURL(); }catch(_){} }
function loadInk(i){
  ictx.clearRect(0,0,ink.width,ink.height);
  const d=inkStore[i]; if(!d) return;
  const im=new Image(); im.onload=()=>{ ictx.globalCompositeOperation='source-over'; ictx.drawImage(im,0,0,ink.width/(devicePixelRatio||1),ink.height/(devicePixelRatio||1)); }; im.src=d;
}
ink.addEventListener('pointerdown',e=>{ drawing=true; ink.setPointerCapture(e.pointerId);
  ictx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ictx.strokeStyle=inkColor; ictx.beginPath(); ictx.moveTo(e.clientX,e.clientY); });
ink.addEventListener('pointermove',e=>{ if(!drawing) return;
  /* pen pressure scales the chosen nib; a mouse just uses the nib width */
  const nib = erasing ? inkWidth*8 : inkWidth;
  ictx.lineWidth = (e.pressure>0 && e.pressure<1) ? nib*(0.45+1.3*e.pressure) : nib;
  ictx.lineTo(e.clientX,e.clientY); ictx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>ink.addEventListener(t,()=>{ if(drawing){drawing=false; saveInk();} }));
document.querySelectorAll('.ib-sw').forEach(sw=>sw.onclick=()=>{ inkColor=sw.dataset.c; setEraser(false);
  document.querySelectorAll('.ib-sw').forEach(o=>o.classList.toggle('sel',o===sw)); });

function spreadCentredText(){
  document.querySelectorAll('.slide p, .slide .figcap, .slide .lede').forEach(function(p){
    /* max-width only: an auto inline margin would make a flex item shrink-wrap
       instead of stretching, which is the very problem we are fixing. */
    if(getComputedStyle(p).textAlign === 'center') p.style.maxWidth='none';
  });
}

/* ---- presenter clock ---- P starts/stops. Shows elapsed time and how far
   ahead or behind the planned cumulative time you are at this slide. ---- */
let t0=null, tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updClock(){
  if(t0===null) return;
  const el=(performance.now()-t0)/60000;               // minutes elapsed
  document.getElementById('cl-el').textContent=fmt(performance.now()-t0);
  const plan=cumMin(idx), d=el-plan;
  const dl=document.getElementById('cl-dl');
  dl.textContent=(d>=0?'+':'&#8722;').replace('&#8722;','-')+Math.abs(d).toFixed(1)+'m vs plan ('+plan.toFixed(0)+'m / '+EST_TOTAL.toFixed(0)+'m)';
  dl.className='dl '+(d>0.5?'behind':(d<-0.5?'ahead':''));
}
function toggleClock(){
  document.body.classList.toggle('timing');
  if(document.body.classList.contains('timing')){ t0=performance.now(); tick=setInterval(updClock,1000); updClock(); }
  else { clearInterval(tick); t0=null; }
}

/* ---- YouTube facade -------------------------------------------------------------
   `button` and `iframe` are already in CONTROLS, so neither the play button nor the player
   advances the slide on click.

   YouTube's player refuses an opaque origin: opened straight from Finder this page is
   file://, and the embed dies with "Error 153 - video player configuration error". There is
   no embed parameter that fixes it. So served over http(s) we play inline, and off the disk
   we hand off to youtube.com in a new tab. */
const CAN_EMBED = location.protocol === 'http:' || location.protocol === 'https:';

}

  if(!CAN_EMBED){
    const b=w.querySelector('.vidbadge'); if(b) b.textContent='Video \u2192 YouTube';
    btn.title='Opens on YouTube \u2014 inline playback needs the deck served over http, not opened from disk';
  }
  btn.addEventListener('click',()=>{
    if(!CAN_EMBED){ window.open('https://www.youtube.com/watch?v='+w.dataset.yt,'_blank','noopener'); return; }
    if(w.classList.contains('live')) return;
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+w.dataset.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title=w.dataset.title||'Video';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    btn.style.display='none';
    w.appendChild(f);
    w.classList.add('live');
  });
});

paint();

/* ---------- PRINT: every slide, every fragment, every figure ----------
   Every slide is in the DOM, but paint() draws only the current slide's figure and
   reveals only the fragments up to the current step -- so an unprepared print gives
   one slide and a lot of empty boxes. Before the browser lays out the pages, reveal
   every fragment and run every registered draw function once. A dark theme is swapped
   to paper for the duration: black pages are not a kindness to anyone's printer.
   ?print in the URL prepares the same way at load, which is how the PDFs are made. */
let PRINT_THEME=null;
function preparePrint(){
  PRINT_THEME=document.body.dataset.theme;
  if(PRINT_THEME==='nocturne') document.body.dataset.theme='paper';
  document.querySelectorAll('.frag').forEach(e=>e.classList.add('on'));
  Object.keys(DRAW).forEach(k=>{ try{ DRAW[k](); }catch(err){} });
}
function restorePrint(){
  if(PRINT_THEME) document.body.dataset.theme=PRINT_THEME;
  document.querySelectorAll('.frag').forEach(e=>e.classList.remove('on'));
  paint();
}
addEventListener('beforeprint',preparePrint);
addEventListener('afterprint',restorePrint);
if(/[?&]print/.test(location.search)) preparePrint();

</script>
</body>
