  <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-bottom:8px;position:relative">
    <svg id="bit6" viewBox="0 0 960 316" style="width:100%;display:block"></svg>
    <img id="bit6meme" src="media/yoda-so-screwed.png" alt="Yoda: so screwed we are" style="position:absolute;right:0;top:14%;width:18.5%;border-radius:6px;visibility:hidden">
  </div>
  <div class="row top" style="gap:20px;align-items:flex-start">
    <div class="col" style="flex:1.5"><div class="warn" id="bit6warn" style="min-height:70px;margin-top:0"></div></div>
    <div class="col">
      <p style="font-size:16px;max-width:none"><span class="tex" data-tex="\\mathcal{H} = \\{\\,y : \\{0,1\\}^3 \\to \\{0,1\\}\\,\\}"></span>: all binary classifiers on three bits. The data has five of the eight
      possible inputs.</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
        <button class="bbtn" id="bit6a" type="button">add a hypothesis</button>
        <button class="bbtn" id="bit6all" type="button">all eight</button>
        <button class="bbtn" id="bit6r" type="button">reset</button>
      </div>
    </div>
  </div>`},

{s:"Part I", t:"What went wrong", html:`
  <div class="eyebrow">What the table shows</div>
  <h2 style="margin-bottom:14px">A perfect fit says nothing about the unseen rows</h2>
  <p style="font-size:20px">All eight hypotheses fit the five rows in the data, and between them they give
  <strong>every</strong> labelling of the three rows that are not.</p>
  <div class="dgrid frag" data-f="0" style="grid-template-columns:auto minmax(0,1fr);gap:13px 24px;margin-top:18px">
    <div style="font-size:19.5px"><strong>Training error</strong></div>
    <div style="font-size:19px">Zero, for all eight. It cannot separate them.</div>
    <div class="frag" data-f="1" style="font-size:19.5px"><strong>Real risk</strong></div>
    <div class="frag" data-f="1" style="font-size:19px">Different for each one, and the data does not say which.</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px;padding:13px 20px">
    <p style="font-size:19.5px;max-width:none">With no assumptions, learning is <strong>impossible</strong>.</p>
  </div>`},

{s:"Part I", t:"Two assumptions", draw:"asm6", html:`
  <div class="eyebrow">What we assume from here on</div>
  <h2 style="margin-bottom:10px">Two assumptions, and what each one does</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col">
      <p style="font-size:18.5px;max-width:none"><strong>1 &#183; The data is a sample.</strong> Every point, seen or unseen,
      is drawn independently from one <strong>fixed</strong> distribution <span class="tex" data-tex="p(x,t)"></span>.</p>
      <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-top:6px"><svg id="asm6" viewBox="0 0 460 220" style="width:100%;display:block"></svg></div>
    </div>
    <div class="col frag" data-f="0">
      <p style="font-size:18.5px;max-width:none"><strong>2 &#183; The class is restricted.</strong> We choose from a class
      <span style="color:var(--s4)"><span class="tex" data-tex="\\mathcal{H}"></span></span> fixed before the data.</p>
      <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-top:6px"><svg id="asm6b" viewBox="0 0 460 220" style="width:100%;display:block"></svg></div>
    </div>
  </div>
  <div class="card accent frag" data-f="1" style="margin-top:10px;padding:10px 20px">
    <p style="font-size:18px;max-width:none">Both assumptions are very general. The price: no exact statement about the
    unseen points, only one that is <strong>probably, approximately, correct</strong>.</p>
  </div>`},

{s:"Part II", t:"Part II", div:true, html:`
  <div class="divider">
    <div class="part">Part II</div>
    <h1>Is learning probable?</h1>
    <div class="bar"></div>
    <div class="sub">A finite class, and the data that chose the hypothesis.</div>
  </div>`},

{s:"Part II", t:"The gap to bound", draw:"of5", html:`
  <div class="eyebrow">From last week &#183; Lecture 5, slide 10</div>
  <h2 style="margin-bottom:8px">The gap between the two curves</h2>
  <div class="row top" style="gap:24px">
    <div class="col" style="flex:1.35">
      <div class="fig" style="background:transparent;box-shadow:none;padding:0">
        <svg id="of5" viewBox="0 0 560 330" style="width:100%%;display:block"></svg>
      </div>
    </div>
    <div class="col">
      <p style="font-size:20px;max-width:none">Ten points, one polynomial.</p>
      <p style="font-size:20px;max-width:none;margin-top:8px"><strong style="color:var(--s1)">Training error</strong>: measured on
      the points the polynomial was fitted to.</p>
      <p style="font-size:20px;max-width:none;margin-top:8px"><strong style="color:var(--s2)">Held-out error</strong>: measured on
      new points, so an estimate of the generalisation error.</p>
      <p class="frag" data-f="0" style="font-size:20px;max-width:none;margin-top:14px">Today: how large can the gap between the
      two curves be?</p>
      <p class="frag" data-f="1" style="font-size:20px;max-width:none;margin-top:8px">On <strong>binary classification</strong>: from
      here on, an error is the fraction of points labelled wrong.</p>
    </div>
  </div>`},

{s:"Part II", t:"The bound, turned round", draw:"bnd6", html:`
  <div class="eyebrow">Live demo &#183; the statement we can make</div>
  <h2 style="margin-bottom:6px">Generalisation error &#8804; training error + penalty</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bnd6" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:16px;max-width:none">A small gap cannot be promised on every dataset: some samples mislead. What can be
      promised: with probability at least <span class="tex" data-tex="1-\\delta"></span> over the draw of the data, the gap is at most <span class="tex" data-tex="\\varepsilon"></span>, so</p>
      <div class="eq" style="margin:6px 0 8px;font-size:19px"><span class="texd" data-tex="\\text{generalisation error} \\;\\le\\; \\text{training error} + \\varepsilon"></span></div>
      <p style="font-size:16px;max-width:none"><strong>Probably approximately correct.</strong> Approximately: the gap is at most <span class="tex" data-tex="\\varepsilon"></span>.
      Probably: on all but a fraction <span class="tex" data-tex="\\delta"></span> of datasets. The <span class="tex" data-tex="\\varepsilon"></span> is a <strong>penalty</strong> added to what you measured.</p>
      <p style="font-size:16px;max-width:none;margin-top:6px">A sketch, for binary classification: as the class grows, the training
      error falls and the penalty rises. The bound is the blue curve lifted by the penalty, and it sits above the red one.</p>
      <div class="btn-row" style="margin-top:8px"><button class="bbtn" id="bnd6b" type="button">add the penalty</button></div>
      <p class="frag" data-f="0" style="font-size:16px;max-width:none;margin-top:8px">What sets the penalty &#8212; the class, the
      number of points, <span class="tex" data-tex="\\delta"></span> &#8212; is the rest of today.</p>
    </div>
  </div>`},

{s:"Part II", t:"Learning objectives", html:`
  <div class="eyebrow">Where we are going</div>
  <h2 style="margin-bottom:10px">Learning objectives, and the route</h2>
  <div class="row top stretch" style="gap:12px">
    <div class="col card" style="padding:10px 14px">
      <div class="eyebrow" style="margin-bottom:4px">1</div>
      <p style="font-size:15.5px;max-width:none">Say why Hoeffding applies to a hypothesis fixed in advance, and not to the one
      training picked.</p>
    </div>
    <div class="col card frag" data-f="0" style="padding:10px 14px">
      <div class="eyebrow" style="margin-bottom:4px">2</div>
      <p style="font-size:15.5px;max-width:none">Derive the finite-class bound from Hoeffding and the union bound.</p>
    </div>
    <div class="col card frag" data-f="1" style="padding:10px 14px">
      <div class="eyebrow" style="margin-bottom:4px">3</div>
      <p style="font-size:15.5px;max-width:none">Explain what the finite-class bound, and the guarantee obtained from it, say.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:12px 18px">
    <div class="eyebrow" style="margin-bottom:6px;color:var(--accent)">The route</div>
    <div class="dgrid" style="grid-template-columns:1fr 1fr;gap:8px 28px">
      <p style="font-size:16.5px;max-width:none"><strong>1 &#183; One fixed hypothesis.</strong> Last week&#8217;s ratings, translated
      into a classifier: Hoeffding.</p>
      <p style="font-size:16.5px;max-width:none"><strong>2 &#183; Why the pick breaks it.</strong> A dataset that misleads; ask for
      every hypothesis at once.</p>
      <p style="font-size:16.5px;max-width:none"><strong>3 &#183; Hoeffding and the union bound, combined.</strong> The finite-class
      bound.</p>
      <p style="font-size:16.5px;max-width:none"><strong>4 &#183; Reading it.</strong> How much data; the penalty; the pick; when a
      perfect fit exists.</p>
    </div>
  </div>`},

{s:"Part II", t:"Hot or Not, again", html:`
  <div class="eyebrow">From last week &#183; the simplest version of the question</div>
  <h2 style="margin-bottom:8px">Remember Hot or Not?</h2>
  <div class="row top" style="gap:22px">
    <div class="col" style="flex:0.8"><img src="media/hotornot.png" alt="hotornot.com in 2004, via the Internet Archive" style="width:100%;border:1px solid var(--rule);border-radius:8px"></div>
    <div class="col" style="flex:1.35">
      <p style="font-size:18px;max-width:none">Each visitor rates a photo: <span class="tex" data-tex="t \\in \\{0, 1\\}"></span>. <span class="tex" data-tex="\\mu"></span> is the unknown fraction of the population that
      says <em>hot</em>. The estimate from <span class="tex" data-tex="V"></span> ratings is their average, <span class="tex" data-tex="\\widehat{\\mu} = \\tfrac{1}{V}\\sum_i t_i"></span>.</p>
      <p style="font-size:18px;max-width:none;margin-top:10px">Three sets of <span class="tex" data-tex="V = 20"></span> ratings of the same photo:</p>
      <div style="margin-top:6px;font-size:17px;line-height:1.35">
        <div style="letter-spacing:.02em">&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293; &#128078;</div>
        <div class="dim" style="font-size:16px;margin-bottom:6px">count 19 &#183; estimate <span class="tex" data-tex="\\widehat{\\mu} = 0.95"></span></div>
      </div>
      <div style="font-size:17px;line-height:1.35">
        <div style="letter-spacing:.02em">&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293; &#128078;&#128078;&#128078;&#128078;&#128078;&#128078;&#128078;&#128078;</div>
        <div class="dim" style="font-size:16px;margin-bottom:6px">count 12 &#183; estimate <span class="tex" data-tex="\\widehat{\\mu} = 0.60"></span></div>
      </div>
      <div style="font-size:17px;line-height:1.35">
        <div style="letter-spacing:.02em">&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293; &#128078;&#128078;&#128078;&#128078;</div>
        <div class="dim" style="font-size:16px;margin-bottom:6px">count 16 &#183; estimate <span class="tex" data-tex="\\widehat{\\mu} = 0.80"></span></div>
      </div>
      <p class="frag" data-f="0" style="font-size:18px;max-width:none;margin-top:8px">The true fraction was <span class="tex" data-tex="\\mu = 0.735"></span>. Each set of
      ratings is a different dataset, and each gives a different estimate: one far too high, one far too low, one close.</p>
    </div>
  </div>`},

{s:"Part II", t:"The histogram, again", draw:"clt5", html:`
  <div class="eyebrow">From last week &#183; the same photo, a thousand sets of ratings</div>
  <h2 style="margin-bottom:6px">Many estimates make a bell</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="clt5" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17px;max-width:none">1000 sets of <span class="tex" data-tex="V"></span> ratings, <span class="tex" data-tex="\\mu = 0.735"></span>. One estimate per set; the bars count them.</p>
      <div class="btn-row" style="margin-top:8px">
        <button class="bbtn" id="cltv5" type="button">V = 5</button>
        <button class="bbtn sel" id="cltv20" type="button">V = 20</button>
        <button class="bbtn" id="cltv100" type="button">V = 100</button>
      </div>
      <div class="warn" id="cltwarn" style="min-height:72px"></div>
      <p class="frag" data-f="0" style="font-size:16.5px;max-width:none;margin-top:8px">The estimates scatter around <span class="tex" data-tex="\\mu"></span>, and
      the scatter narrows as <span class="tex" data-tex="V"></span> grows: its variance is exactly <span class="tex" data-tex="\\mu(1-\\mu)/V"></span>.</p>
    </div>
  </div>`},

{s:"Part II", t:"Hoeffding's inequality", draw:"hoef6", html:`
  <div class="eyebrow">From last week &#183; Lecture 5, slide 47</div>
  <h2 style="margin-bottom:6px">Hoeffding&#8217;s inequality bounds the bad event</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="hoef6" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:16.5px;max-width:none">The average of <span class="tex" data-tex="V"></span> independent ratings, each 0 or 1, stays close to its
      expectation <span class="tex" data-tex="\\mu"></span>:</p>
      <div class="eq" style="margin:6px 0 8px;font-size:20px"><span class="texd" data-tex="\\Pr\\bigl(|\\widehat{\\mu} - \\mu| > \\varepsilon\\bigr) \\;\\le\\; 2e^{-2V\\varepsilon^2}"></span></div>
      <p style="font-size:16px;max-width:none">Nothing about the bell shape is used: the bound holds at every <span class="tex" data-tex="V"></span>, and for
      any bounded quantity, not only 0 or 1.</p>
      <div class="ctrl-row" style="margin-top:6px"><label>ratings V <span class="val" id="hf6mv">200</span></label>
        <input type="range" id="hf6mr" min="20" max="2000" step="20" value="200"></div>
      <div class="ctrl-row"><label>&#949; <span class="val" id="hf6ev">0.10</span></label>
        <input type="range" id="hf6er" min="0.01" max="0.50" step="0.01" value="0.10"></div>
      <div id="hf6bound" style="text-align:center;font-size:21px;margin:6px 0 4px"></div>
      <div class="warn" id="hf6warn" style="min-height:72px"></div>
    </div>
  </div>`},

{s:"Part II", t:"The setting", html:`
  <div class="eyebrow">Assumptions &#183; the simplest version</div>
  <h2 style="margin-bottom:12px">Today&#8217;s setting</h2>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:13px 24px">
    <div style="font-size:19.5px"><strong>Data</strong></div>
    <div style="font-size:19.5px"><span class="tex" data-tex="\\mathcal{D} = \\{(x_n,t_n)\\}_{n=1}^{N}"></span>, drawn independently from a fixed <span class="tex" data-tex="p(x,t)"></span> we never see</div>
    <div class="frag" data-f="0" style="font-size:19.5px"><strong>Hypothesis class</strong></div>
    <div class="frag" data-f="0" style="font-size:19.5px"><span class="tex" data-tex="\\mathcal{H}"></span>, fixed before the data, <strong>finite</strong> with <span class="tex" data-tex="|\\mathcal{H}|"></span> members</div>
    <div class="frag" data-f="1" style="font-size:19.5px"><strong>Loss</strong></div>
    <div class="frag" data-f="1" style="font-size:19.5px">right or wrong: <span class="tex" data-tex="\\ell(h(x),t) = \\mathbb{1}[\\,h(x) \\neq t\\,]"></span></div>
    <div class="frag" data-f="2" style="font-size:19.5px"><strong>Dataset loss</strong> (computable)</div>
    <div class="eq frag" data-f="2" style="margin:0;text-align:left;font-size:22px"><span class="texd" data-tex="L_{\\mathcal{D}}(h) = \\frac{1}{N}\\sum_{n=1}^{N} \\ell\\bigl(h(x_n), t_n\\bigr)"></span></div>
    <div class="frag" data-f="2" style="font-size:19.5px"><strong>Generalisation loss</strong> (what we want)</div>
    <div class="eq frag" data-f="2" style="margin:0;text-align:left;font-size:22px"><span class="texd" data-tex="L_p(h) = \\mathbb{E}_{p(x,t)}\\bigl[\\ell(h(x), t)\\bigr]"></span></div>
  </div>
  <p class="caption frag" data-f="3" style="margin-top:14px">Same two quantities as last week, measured on the training set
  rather than a held-out one. The tutorial uses these names; <em>Learning From Data</em> writes them <span class="tex" data-tex="E_{\\text{in}}"></span> and <span class="tex" data-tex="E_{\\text{out}}"></span>.</p>`},

{s:"Part II", t:"The two losses", draw:"grd6", html:`
  <div class="eyebrow">Live demo &#183; three hypotheses, one dataset</div>
  <h2 style="margin-bottom:6px">The two losses, and a dataset that misleads</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-bottom:6px">
    <svg id="grd6" viewBox="0 0 960 250" style="width:100%;display:block"></svg>
  </div>
  <div class="row top" style="gap:18px;align-items:flex-start">
    <div class="col" style="flex:1.5"><div class="warn" id="grd6warn" style="min-height:74px;margin-top:0"></div></div>
    <div class="col">
      <p style="font-size:14.5px;max-width:none">Each cell is one input, all equally likely; red: that hypothesis gets it wrong,
      so <span class="tex" data-tex="L_p(h)"></span> is the fraction of red in its grid. The ringed cells are one dataset, the same for all three; <span class="tex" data-tex="L_{\\mathcal{D}}(h)"></span> is the fraction
      of red among them.</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:6px">
        <button class="bbtn" id="grd6s" type="button">draw a new dataset</button>
        <button class="bbtn" id="grd6u" type="button">an unlucky dataset</button>
      </div>
      <div class="ctrl-row" style="margin-top:6px"><label>dataset size N <span class="val" id="grd6nv">10</span></label>
        <input type="range" id="grd6nr" min="5" max="60" step="5" value="10"></div>
    </div>
  </div>`},

{s:"Part II", t:"Match the pieces", draw:"match6", html:`
  <div class="eyebrow">Activity &#183; Last week&#8217;s objects, today&#8217;s names</div>
  <h2 style="margin-bottom:8px">A classifier being right or wrong is a rating</h2>
  <p style="font-size:18px;margin-bottom:6px">Each Hot-or-Not object on the right has a counterpart in today&#8217;s setting.
  <strong>Drag</strong> today&#8217;s object onto last week&#8217;s &#8212; a wrong slot bounces back.</p>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0">
    <svg id="match6" viewBox="0 0 900 300" style="width:100%;display:block"></svg>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="bbtn" id="m6gr" type="button">reset</button>
  </div>`},

{s:"Part II", t:"Hoeffding, again", html:`
  <div class="eyebrow">For one hypothesis, fixed before the data</div>
  <h2 style="margin-bottom:12px">So Hoeffding applies, exactly as it did last week</h2>
  <div class="row top stretch" style="gap:20px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Last week &#183; ratings</div>
      <div class="eq" style="margin:6px 0 0;font-size:21px"><span class="texd" data-tex="\\Pr\\bigl(|\\widehat{\\mu} - \\mu| > \\varepsilon\\bigr) \\;\\le\\; 2e^{-2V\\varepsilon^2}"></span></div>
      <p class="small" style="margin-top:10px"><span class="tex" data-tex="V"></span> ratings, each 0 or 1, drawn independently.</p>
    </div>
    <div class="col card accent frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Today &#183; one classifier</div>
      <div class="eq" style="margin:6px 0 0;font-size:21px"><span class="texd" data-tex="\\Pr\\bigl(|L_{\\mathcal{D}}(h) - L_p(h)| > \\varepsilon\\bigr) \\;\\le\\; 2e^{-2N\\varepsilon^2}"></span></div>
      <p class="small" style="margin-top:10px"><span class="tex" data-tex="N"></span> points, each loss 0 or 1, drawn independently &#8212; <strong>as long as <span class="tex" data-tex="h"></span> was
      chosen before the data was drawn</strong>.</p>
    </div>
  </div>
  <p class="frag" data-f="1" style="font-size:19px;margin-top:16px">Read it as <strong>verification</strong>: fix a classifier,
  then draw the data, and the inequality says how far its dataset loss can sit from its generalisation loss.</p>`},

{s:"Part II", t:"Verification is not learning", html:`
  <div class="eyebrow">What training does differently</div>
  <h2 style="margin-bottom:14px">But that is not what learning does</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Verification</div>
      <p style="font-size:19px;max-width:none">Choose <span class="tex" data-tex="h"></span> &#8594; draw <span class="tex" data-tex="\\mathcal{D}"></span> &#8594; compute <span class="tex" data-tex="L_{\\mathcal{D}}(h)"></span>.</p>
      <hr class="rule">
      <p class="small">The hypothesis does not depend on the data, so Hoeffding applies to it directly.</p>
    </div>
    <div class="col card accent frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Learning</div>
      <p style="font-size:19px;max-width:none">Draw <span class="tex" data-tex="\\mathcal{D}"></span> &#8594; <strong>search <span class="tex" data-tex="\\mathcal{H}"></span></strong> &#8594; return the <span class="tex" data-tex="\\hat{h}"></span> with the
      smallest training error.</p>
      <hr class="rule">
      <p class="small">The hypothesis is a function of the data. Hoeffding does not apply to it: the winner was chosen
      for having a low score.</p>
    </div>
  </div>
  <p class="frag" data-f="1" style="font-size:19.5px;margin-top:16px">Last week&#8217;s validation scores had the same
  problem on a shortlist. Here the search covers the whole class, and each score is computed on the data used for the search.</p>`},

{s:"Part II", t:"Who do you hire?", draw:"hire", html:`
  <div class="eyebrow">From Lecture 1 &#183; why this happens, concretely</div>
  <h2 style="margin-bottom:8px">Candidates sit for an exam. You hire the top scorer.</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="hiresvg" viewBox="0 0 560 330" width="100%"></svg></div>
    <div class="demo-ctrl">
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button class="bbtn" id="hirego" type="button">Run the exam</button>
        <button class="bbtn" id="hirereset" type="button">Reset</button>
      </div>
      <div class="ctrl-row"><label>Candidates <span class="val" id="hirenv">12</span></label>
        <input type="range" id="hiren" min="4" max="40" step="1" value="12"></div>
      <div class="ctrl-row"><label>Luck in the score <span class="val" id="hiresdv">1.0</span></label>
        <input type="range" id="hiresd" min="0" max="3" step="0.1" value="1"></div>
      <div class="readout">
        <div class="stat train"><div class="k">hired the best?</div><div class="v" id="hirehit">&#8212;</div></div>
        <div class="stat test"><div class="k">winner flattered by</div><div class="v" id="hiregap">&#8212;</div></div>
      </div>
      <div class="warn" id="hirewarn">Nobody has taken the exam yet. Grey ticks are true ability &#8212; which you never get to see.</div>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:10px;text-align:center">
    Each candidate is a hypothesis in the class; the exam is your <strong>training set</strong>. Fitting <em>is</em> hiring the top
    scorer &#8212; and you inherit <em class="hl">their luck along with their ability</em>.</p>`},

{s:"Part II", t:"The optimiser's curse", html:`
  <div class="eyebrow">From Lecture 1 &#183; why this happens</div>
  <h2 style="margin-bottom:14px">The optimiser&#8217;s curse: the trouble is the <em>argmin</em></h2>
  <div class="row top" style="gap:34px">
    <div class="col" style="flex:1.15">
      <p style="font-size:20px;margin-bottom:4px">For <strong>any single</strong> hypothesis fixed in advance, the training error
      is right on average: off only by noise, which averages out.</p>
      <div class="eq" style="margin:6px 0 12px;font-size:20px"><span class="texd" data-tex="L_{\\mathcal{D}}(h) = L_p(h) + \\eta(h), \\qquad \\mathbb{E}\\bigl[\\eta(h)\\bigr] = 0"></span></div>
      <p class="frag" data-f="0" style="font-size:20px;margin-bottom:4px">But we do not evaluate one hypothesis. We
      <em class="hl">search a class</em> and keep the winner:</p>
      <div class="eq frag" data-f="0" style="margin:6px 0 12px;font-size:20px"><span class="texd" data-tex="\\hat{h} = \\operatorname*{arg\\,min}_{h \\in \\mathcal{H}}\\ \\bigl(L_p(h) + \\eta(h)\\bigr)"></span></div>
      <p class="frag" data-f="1" style="font-size:20px">The argmin chases <strong>both</strong> terms. It rewards a genuinely good
      hypothesis and one that merely got lucky alike, so the winner tends to be lucky as well as good, and its training
      error is <strong>biased downwards</strong>.</p>
    </div>
    <div class="col">
      <div class="card accent">
        <p style="font-size:20px;max-width:none">The richer the class <span class="tex" data-tex="\\mathcal{H}"></span>, the more hypotheses there are to get lucky.
        <strong>Capacity buys luck.</strong></p>
      </div>
      <p class="caption frag" data-f="2" style="margin-top:14px">Lecture 1 said Week 6 would make this precise. The rest of this
      part does.</p>
    </div>
  </div>`},

{s:"Part II", t:"What has to hold instead", draw:"unif6", html:`
  <div class="eyebrow">Live demo &#183; eight hypotheses, one dataset at a time</div>
  <h2 style="margin-bottom:6px">Ask for every hypothesis to be close at once</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="unif6" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:16.5px;max-width:none">We cannot know in advance which hypothesis the search will return. So ask for
      a statement that covers all of them:</p>
      <div class="eq" style="margin:6px 0 8px;font-size:19px"><span class="texd" data-tex="\\text{for every } h \\in \\mathcal{H}: \\;\\; |L_{\\mathcal{D}}(h) - L_p(h)| \\le \\varepsilon"></span></div>
      <div class="btn-row" style="margin-top:4px">
        <button class="bbtn" id="unif6s" type="button">draw a new dataset</button>
        <button class="bbtn" id="unif6u" type="button">an unlucky dataset</button>
        <button class="bbtn" id="unif6m" type="button">how often? 1,000 datasets</button>
      </div>
      <div class="ctrl-row" style="margin-top:8px"><label>data points N <span class="val" id="unif6nv">50</span></label>
        <input type="range" id="unif6nr" min="10" max="400" step="10" value="50"></div>
      <div class="warn" id="unif6warn" style="min-height:124px"></div>
      <p class="caption" style="margin-top:6px;font-size:14.5px">Holding for every hypothesis at once is called
      <strong>uniform convergence</strong>.</p>
    </div>
  </div>`},

{s:"Part II", t:"The union bound, recalled", draw:"union5", html:`
  <div class="eyebrow">From last week</div>
  <h2 style="margin-bottom:6px">The union bound</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="union5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none">The probability that <em>at least one</em> of several events happens is
      at most the sum of their probabilities:</p>
      <div class="eq" style="margin:6px 0 8px;font-size:21px"><span class="texd" data-tex="\\Pr\\Bigl(\\textstyle\\bigcup_{j} B_j\\Bigr) \\le \\sum_{j} \\Pr(B_j)"></span></div>
      <p style="font-size:16.5px;max-width:none">Equality when the events are <strong>mutually exclusive</strong>; when they
      overlap, the sum counts the overlap more than once.</p>
      <div class="ctrl-row" style="margin-top:6px"><label>number of events <span class="val" id="unmv">3</span></label>
        <input type="range" id="unmr" min="1" max="8" step="1" value="3"></div>
      <div class="warn" id="unwarn" style="min-height:88px"></div>
    </div>
  </div>`},

{s:"Part II", t:"Paying for the search", html:`
  <div class="eyebrow">The two tools, applied</div>
  <h2 style="margin-bottom:8px">Hoeffding and the union bound, combined</h2>
  <div class="row top stretch" style="gap:16px">
    <div class="col card" style="padding:9px 14px">
      <div class="eyebrow" style="margin-bottom:3px">Tool 1 &#183; Hoeffding, for one <span class="tex" data-tex="h"></span> fixed before the data</div>
      <div class="eq" style="margin:0;font-size:18px"><span class="texd" data-tex="\\Pr\\bigl(|L_{\\mathcal{D}}(h) - L_p(h)| > \\varepsilon\\bigr) \\le 2e^{-2N\\varepsilon^2}"></span></div>
    </div>
    <div class="col card" style="padding:9px 14px">
      <div class="eyebrow" style="margin-bottom:3px">Tool 2 &#183; the union bound</div>
      <div class="eq" style="margin:0;font-size:18px"><span class="texd" data-tex="\\Pr\\Bigl(\\textstyle\\bigcup_j B_j\\Bigr) \\le \\sum_j \\Pr(B_j)"></span></div>
    </div>
  </div>
  <p style="font-size:17.5px;margin-top:10px">The bad event is that <em>some</em> hypothesis has a gap bigger than <span class="tex" data-tex="\\varepsilon"></span>: a union of
  one event per hypothesis, <span class="tex" data-tex="B_h = \\bigl\\{\\,|L_{\\mathcal{D}}(h) - L_p(h)| > \\varepsilon\\,\\bigr\\}"></span>.</p>
  <div style="text-align:center"><div style="display:inline-grid;grid-template-columns:auto auto auto;gap:9px 14px;align-items:center;text-align:left"><div class="x" style="text-align:right;font-size:22px"><span class="tex" data-tex="\\Pr\\Bigl(\\textstyle\\bigcup_{h \\in \\mathcal{H}} B_h\\Bigr)"></span></div><div class="x" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\displaystyle\\sum_{h \\in \\mathcal{H}} \\Pr(B_h)"></span></div><div class="dnote" style="font-size:15px;max-width:34ch">tool 2, with one <span class="tex" data-tex="B_h"></span> per hypothesis</div><div class="x frag" data-f="0" style="text-align:right;font-size:22px"></div><div class="x frag" data-f="0" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\displaystyle\\sum_{h \\in \\mathcal{H}} 2e^{-2N\\varepsilon^2}"></span></div><div class="dnote frag" data-f="0" style="font-size:15px;max-width:34ch">tool 1, once per hypothesis: each <span class="tex" data-tex="h"></span> was fixed before the data</div><div class="x frag" data-f="1" style="text-align:right;font-size:22px"></div><div class="x frag" data-f="1" style="font-size:22px"><span class="tex" data-tex="=\\; |\\mathcal{H}| \\cdot 2e^{-2N\\varepsilon^2}"></span></div><div class="dnote frag" data-f="1" style="font-size:15px;max-width:34ch">the same number, <span class="tex" data-tex="|\\mathcal{H}|"></span> times over</div></div></div>`},

{s:"Part II", t:"The result", html:`
  <div class="eyebrow">Put together</div>
  <h2 style="margin-bottom:10px">The probability of the bad event, bounded</h2>
  <div class="card accent" style="padding:16px 22px">
    <div class="eq" style="margin:0;font-size:26px"><span class="texd" data-tex="\\Pr\\Bigl(\\exists\\, h \\in \\mathcal{H}: \\; |L_{\\mathcal{D}}(h) - L_p(h)| > \\varepsilon\\Bigr) \\;\\le\\; |\\mathcal{H}| \\cdot 2e^{-2N\\varepsilon^2}"></span></div>
  </div>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:12px 24px;margin-top:16px">
    <div class="frag" data-f="0" style="font-size:19px"><strong>Approximately correct</strong></div>
    <div class="frag" data-f="0" style="font-size:18.5px">every hypothesis&#8217;s training error is within <span class="tex" data-tex="\\varepsilon"></span> of its generalisation
    error &#8212; including whichever one training picks</div>
    <div class="frag" data-f="1" style="font-size:19px"><strong>Probably</strong></div>
    <div class="frag" data-f="1" style="font-size:18.5px">except on datasets whose total probability is at most the right-hand side.
    Call that <span class="tex" data-tex="\\delta"></span>.</div>
    <div class="frag" data-f="2" style="font-size:19px"><strong>An upper bound</strong></div>
    <div class="frag" data-f="2" style="font-size:18.5px">the true probability of the bad event is smaller; the right-hand side is
    what we can compute.</div>
  </div>
  `},

{s:"Part II", t:"Solving for N", html:`
  <div class="eyebrow">Reading the result &#183; first way</div>
  <h2 style="margin-bottom:8px">How much data makes the bad event rare?</h2>
  <p style="font-size:18px">Ask for the bad event to have probability at most <span class="tex" data-tex="\\delta"></span>, and solve for <span class="tex" data-tex="N"></span>.</p>
  <div style="margin-top:8px"><div style="text-align:center"><div style="display:inline-grid;grid-template-columns:auto auto auto;gap:9px 14px;align-items:center;text-align:left"><div class="x" style="text-align:right;font-size:22px"><span class="tex" data-tex="|\\mathcal{H}| \\cdot 2e^{-2N\\varepsilon^2}"></span></div><div class="x" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\delta"></span></div><div class="dnote" style="font-size:15px;max-width:34ch">the result, with <span class="tex" data-tex="\\delta"></span> as the target</div><div class="x frag" data-f="0" style="text-align:right;font-size:22px"><span class="tex" data-tex="e^{-2N\\varepsilon^2}"></span></div><div class="x frag" data-f="0" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\dfrac{\\delta}{2|\\mathcal{H}|}"></span></div><div class="dnote frag" data-f="0" style="font-size:15px;max-width:34ch">divide by <span class="tex" data-tex="2|\\mathcal{H}|"></span></div><div class="x frag" data-f="1" style="text-align:right;font-size:22px"><span class="tex" data-tex="-2N\\varepsilon^2"></span></div><div class="x frag" data-f="1" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\ln\\dfrac{\\delta}{2|\\mathcal{H}|} = -\\ln\\dfrac{2|\\mathcal{H}|}{\\delta}"></span></div><div class="dnote frag" data-f="1" style="font-size:15px;max-width:34ch">take logarithms</div><div class="x frag" data-f="2" style="text-align:right;font-size:22px"><span class="tex" data-tex="N"></span></div><div class="x frag" data-f="2" style="font-size:22px"><span class="tex" data-tex="\\ge\\; \\dfrac{1}{2\\varepsilon^2}\\,\\ln\\dfrac{2|\\mathcal{H}|}{\\delta}"></span></div><div class="dnote frag" data-f="2" style="font-size:15px;max-width:34ch">divide by <span class="tex" data-tex="-2\\varepsilon^2"></span>, which flips the inequality</div></div></div></div>
  <div class="card accent frag" data-f="3" style="margin-top:12px;padding:10px 20px">
    <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="N \\;\\ge\\; \\frac{1}{2\\varepsilon^2}\\,\\ln\\!\\Bigl(\\frac{2|\\mathcal{H}|}{\\delta}\\Bigr)"></span></div>
  </div>
  <p class="caption frag" data-f="3" style="margin-top:8px">Enough data for tolerance <span class="tex" data-tex="\\varepsilon"></span> with confidence <span class="tex" data-tex="1-\\delta"></span>. The size of the class
  sits inside a logarithm; the next slide shows what that means.</p>`},

{s:"Part II", t:"How much data is that?", draw:"sc6", html:`
  <div class="eyebrow">Live demo &#183; reading the result, first way</div>
  <h2 style="margin-bottom:6px">A bigger class needs only a little more data</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="sc6" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:16.5px;max-width:none">The bound, solved for the number of points. The size of the class sits inside
      a logarithm:</p>
      <div class="eq" style="margin:2px 0 8px;font-size:20px"><span class="texd" data-tex="N \\ge \\tfrac{1}{2\\varepsilon^2}\\ln(2|\\mathcal{H}|/\\delta)"></span></div>
      <div class="ctrl-row"><label>&#949; <span class="val" id="sc6ev">0.10</span></label>
        <input type="range" id="sc6er" min="0.01" max="0.50" step="0.01" value="0.10"></div>
      <div class="ctrl-row"><label>&#948; <span class="val" id="sc6dv">0.050</span></label>
        <input type="range" id="sc6dr" min="-3" max="-0.5" step="0.02" value="-1.3"></div>
      <div class="warn" id="sc6warn" style="min-height:128px"></div>
    </div>
  </div>`},

{s:"Part II", t:"Solving for the tolerance", html:`
  <div class="eyebrow">Reading the result &#183; second way</div>
  <h2 style="margin-bottom:8px">The smallest tolerance the data supports</h2>
  <p style="font-size:18px">The same result, now solved for <span class="tex" data-tex="\\varepsilon"></span> with <span class="tex" data-tex="N"></span> and <span class="tex" data-tex="\\delta"></span> given.</p>
  <div style="margin-top:8px"><div style="text-align:center"><div style="display:inline-grid;grid-template-columns:auto auto auto;gap:9px 14px;align-items:center;text-align:left"><div class="x" style="text-align:right;font-size:22px"><span class="tex" data-tex="|\\mathcal{H}| \\cdot 2e^{-2N\\varepsilon^2}"></span></div><div class="x" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\delta"></span></div><div class="dnote" style="font-size:15px;max-width:34ch">the result, with <span class="tex" data-tex="\\delta"></span> as the target</div><div class="x frag" data-f="0" style="text-align:right;font-size:22px"><span class="tex" data-tex="2N\\varepsilon^2"></span></div><div class="x frag" data-f="0" style="font-size:22px"><span class="tex" data-tex="\\ge\\; \\ln\\dfrac{2|\\mathcal{H}|}{\\delta}"></span></div><div class="dnote frag" data-f="0" style="font-size:15px;max-width:34ch">divide by <span class="tex" data-tex="2|\\mathcal{H}|"></span>, take logarithms, flip the sign</div><div class="x frag" data-f="1" style="text-align:right;font-size:22px"><span class="tex" data-tex="\\varepsilon"></span></div><div class="x frag" data-f="1" style="font-size:22px"><span class="tex" data-tex="\\ge\\; \\sqrt{\\dfrac{\\ln(2|\\mathcal{H}|/\\delta)}{2N}}"></span></div><div class="dnote frag" data-f="1" style="font-size:15px;max-width:34ch">divide by <span class="tex" data-tex="2N"></span>, take the square root</div><div class="x frag" data-f="2" style="text-align:right;font-size:22px"><span class="tex" data-tex="|L_{\\mathcal{D}}(h) - L_p(h)|"></span></div><div class="x frag" data-f="2" style="font-size:22px"><span class="tex" data-tex="\\le\\; \\varepsilon \\quad \\text{for every } h"></span></div><div class="dnote frag" data-f="2" style="font-size:15px;max-width:34ch">the good event, which has probability at least <span class="tex" data-tex="1-\\delta"></span></div></div></div></div>
  <p class="frag" data-f="3" style="font-size:17.5px;margin-top:12px">With probability at least <span class="tex" data-tex="1-\\delta"></span>, every <span class="tex" data-tex="h \\in \\mathcal{H}"></span> has
  <span class="tex" data-tex="|L_{\\mathcal{D}}(h) - L_p(h)| \\le \\varepsilon"></span> with this <span class="tex" data-tex="\\varepsilon"></span>. In particular:</p>
  <div class="card accent frag" data-f="3" style="margin-top:8px;padding:10px 20px">
    <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="L_p(h) \\;\\le\\; L_{\\mathcal{D}}(h) + \\sqrt{\\frac{\\ln\\bigl(2|\\mathcal{H}|/\\delta\\bigr)}{2N}}"></span></div>
  </div>`},

{s:"Part II", t:"Back to the figure", draw:"bnd6f", html:`
  <div class="eyebrow">Reading the result &#183; the penalty, on the figure</div>
  <h2 style="margin-bottom:6px">Where the upper bound comes from</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bnd6f" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:16px;max-width:none">The sketch of the opening slide, with the penalty now a formula. For every hypothesis
      at once, with probability at least <span class="tex" data-tex="1-\\delta"></span>:</p>
      <div class="eq" style="margin:6px 0 8px;font-size:19px"><span class="texd" data-tex="L_p(h) \\;\\le\\; L_{\\mathcal{D}}(h) + \\sqrt{\\frac{\\ln(2|\\mathcal{H}|/\\delta)}{2N}}"></span></div>
      <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:7px 16px;align-items:center">
        <div class="frag" data-f="0" style="font-size:17px"><span class="tex" data-tex="\\ln|\\mathcal{H}|"></span></div>
        <div class="frag" data-f="0" style="font-size:15.5px">a bigger class costs more, but only through a logarithm</div>
        <div class="frag" data-f="1" style="font-size:17px"><span class="tex" data-tex="1/\\sqrt{N}"></span></div>
        <div class="frag" data-f="1" style="font-size:15.5px">more data shrinks it: four times the data halves the penalty</div>
        <div class="frag" data-f="2" style="font-size:17px"><span class="tex" data-tex="\\ln(1/\\delta)"></span></div>
        <div class="frag" data-f="2" style="font-size:15.5px">more confidence costs little: <span class="tex" data-tex="\\delta"></span> from 0.05 to 0.001 raises <span class="tex" data-tex="\\ln(1/\\delta)"></span> by
        <span class="tex" data-tex="\\ln 50 \\approx 3.9"></span></div>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"What the pick is worth", html:`
  <div class="eyebrow">Back to the learner</div>
  <h2 style="margin-bottom:8px">What this says about the hypothesis you picked</h2>
  <p style="font-size:17px">Training returns <span class="tex" data-tex="\\hat{h}"></span>, the hypothesis with the smallest training error; <span class="tex" data-tex="h^{*}"></span> is the best in the class,
  <span class="tex" data-tex="L_p(h^{*}) \\le L_p(h)"></span> for every <span class="tex" data-tex="h"></span>. With probability at least <span class="tex" data-tex="1-\\delta"></span>, every <span class="tex" data-tex="h"></span> satisfies both <span class="tex" data-tex="L_p(h) \\le L_{\\mathcal{D}}(h) + \\varepsilon"></span> and <span class="tex" data-tex="L_{\\mathcal{D}}(h) \\le L_p(h) + \\varepsilon"></span>.</p>
  <div style="margin-top:8px"><div style="text-align:center"><div style="display:inline-grid;grid-template-columns:auto auto auto;gap:9px 14px;align-items:center;text-align:left"><div class="x" style="text-align:right;font-size:22px"><span class="tex" data-tex="L_p(\\hat{h})"></span></div><div class="x" style="font-size:22px"><span class="tex" data-tex="\\le\\; L_{\\mathcal{D}}(\\hat{h}) + \\varepsilon"></span></div><div class="dnote" style="font-size:15px;max-width:34ch">the first inequality, for <span class="tex" data-tex="\\hat{h}"></span> &#8212; allowed, because it holds for every <span class="tex" data-tex="h"></span></div><div class="x frag" data-f="0" style="text-align:right;font-size:22px"></div><div class="x frag" data-f="0" style="font-size:22px"><span class="tex" data-tex="\\le\\; L_{\\mathcal{D}}(h^{*}) + \\varepsilon"></span></div><div class="dnote frag" data-f="0" style="font-size:15px;max-width:34ch"><span class="tex" data-tex="\\hat{h}"></span> has the smallest training error, so <span class="tex" data-tex="L_{\\mathcal{D}}(\\hat{h}) \\le L_{\\mathcal{D}}(h^{*})"></span></div><div class="x frag" data-f="1" style="text-align:right;font-size:22px"></div><div class="x frag" data-f="1" style="font-size:22px"><span class="tex" data-tex="\\le\\; L_p(h^{*}) + \\varepsilon + \\varepsilon"></span></div><div class="dnote frag" data-f="1" style="font-size:15px;max-width:34ch">the second inequality, for <span class="tex" data-tex="h^{*}"></span></div></div></div></div>
  <div class="card accent frag" data-f="2" style="margin-top:10px;padding:10px 20px">
    <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="L_p(\\hat{h}) \\;\\le\\; L_p(h^{*}) + 2\\varepsilon"></span></div>
  </div>
  <p class="frag" data-f="3" style="font-size:17px;margin-top:8px">On new data, <span class="tex" data-tex="\\hat{h}"></span> is at most <span class="tex" data-tex="2\\varepsilon"></span> worse than the best hypothesis in
  the class. It cannot do better than the class: if every <span class="tex" data-tex="h \\in \\mathcal{H}"></span> is bad, so is <span class="tex" data-tex="\\hat{h}"></span>.</p>`},

{s:"Part II", t:"The two bounds, drawn", draw:"pick6", html:`
  <div class="eyebrow">Live demo &#183; both guarantees, on one dataset</div>
  <h2 style="margin-bottom:6px">Where the pick lands</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="pick6" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:16px;max-width:none">Eight hypotheses, <span class="tex" data-tex="N = 50"></span>, <span class="tex" data-tex="\\varepsilon = 0.10"></span>. Green: <span class="tex" data-tex="L_p(h)"></span>, fixed. Dots: <span class="tex" data-tex="L_{\\mathcal{D}}(h)"></span> on this dataset. <span class="tex" data-tex="\\hat{h}"></span> is the
      lowest dot, <span class="tex" data-tex="h^{*}"></span> the lowest green line.</p>
      <div class="btn-row" style="margin-top:8px">
        <button class="bbtn" id="pick6s" type="button">draw a new dataset</button>
        <button class="bbtn" id="pick6u" type="button">a dataset where the pick is not the best</button>
      </div>
      <div class="warn" id="pick6warn" style="min-height:130px"></div>
    </div>
  </div>`},

{s:"Part II", t:"What realizable means", draw:"rlz6", html:`
  <div class="eyebrow">Two cases</div>
  <h2 style="margin-bottom:8px">Is the truth in the class?</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-bottom:6px">
    <svg id="rlz6" viewBox="0 0 960 220" style="width:100%;display:block"></svg>
  </div>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:10px 24px;margin-top:8px">
    <div style="font-size:19px"><strong>Realizable</strong></div>
    <div style="font-size:18.5px">Some hypothesis in the class labels every input correctly: <span class="tex" data-tex="L_p(h^{*}) = 0"></span>. The best in the class makes no
    mistakes at all.</div>
    <div class="frag" data-f="0" style="font-size:19px"><strong>Not realizable</strong></div>
    <div class="frag" data-f="0" style="font-size:18.5px">Every hypothesis in the class makes some mistakes: <span class="tex" data-tex="L_p(h) > 0 \\text{ for every } h \\in \\mathcal{H}"></span>. The best we
    can hope for is <span class="tex" data-tex="L_p(h^{*})"></span>. This is the tutorial&#8217;s agnostic case.</div>
  </div>`},

{s:"Part II", t:"The realizable case, derived", draw:"rlzg6", html:`
  <div class="eyebrow">When a perfect fit exists</div>
  <h2 style="margin-bottom:6px">The realizable case</h2>
  <p style="font-size:16px">Suppose some <span class="tex" data-tex="h^{*} \\in \\mathcal{H}"></span> has <span class="tex" data-tex="L_p(h^{*}) = 0"></span>, and training returns an <span class="tex" data-tex="\\hat{h}"></span> with <strong>zero</strong> training error. The gap for
  <span class="tex" data-tex="\\hat{h}"></span> is <span class="tex" data-tex="L_p(\\hat{h})"></span> itself, so the bad event is <span class="tex" data-tex="L_p(\\hat{h}) > \\varepsilon"></span>: the same <span class="tex" data-tex="\\varepsilon"></span> as before. Call <span class="tex" data-tex="h"></span> <em>bad</em> if <span class="tex" data-tex="L_p(h) > \\varepsilon"></span>. Training can return a bad hypothesis
  only if some bad <span class="tex" data-tex="h"></span> makes no mistake on any of the <span class="tex" data-tex="N"></span> points.</p>
  <div class="row top" style="gap:16px;align-items:center;margin-top:6px">
    <div class="col" style="flex:0 0 auto"><svg id="rlzg6" viewBox="0 0 240 218" width="240" height="218" style="display:block"></svg></div>
    <div class="col">
      <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center">
        <div class="eq" style="margin:0;text-align:left;font-size:17px"><span class="tex" data-tex="1 - L_p(h_2) = 0.78"></span></div>
        <div style="font-size:15px">one sampled point misses the red cells</div>
        <div class="eq" style="margin:0;text-align:left;font-size:17px"><span class="tex" data-tex="(1 - L_p(h_2))^{N} = 0.78^{10} \\approx 0.08"></span></div>
        <div style="font-size:15px">all <span class="tex" data-tex="N = 10"></span> points miss them: this dataset cannot tell <span class="tex" data-tex="h_2"></span> from a perfect hypothesis</div>
        <div class="eq" style="margin:0;text-align:left;font-size:17px"><span class="tex" data-tex="(1 - L_p(h))^{N} \\le (1 - \\varepsilon)^{N} \\le e^{-\\varepsilon N}"></span></div>
        <div style="font-size:15px">for any bad <span class="tex" data-tex="h"></span>, since <span class="tex" data-tex="L_p(h) > \\varepsilon"></span>: the first line of the derivation</div>
      </div>
    </div>
  </div>
  <div style="margin-top:6px"><div style="text-align:center"><div style="display:inline-grid;grid-template-columns:auto auto auto;gap:9px 14px;align-items:center;text-align:left"><div class="x" style="text-align:right;font-size:19px"><span class="tex" data-tex="\\Pr(\\text{one bad } h \\text{ makes no mistake on } N \\text{ points})"></span></div><div class="x" style="font-size:19px"><span class="tex" data-tex="=\\; (1 - L_p(h))^N \\le (1-\\varepsilon)^N \\le e^{-\\varepsilon N}"></span></div><div class="dnote" style="font-size:15px;max-width:34ch"><span class="tex" data-tex="N"></span> independent points, each missing <span class="tex" data-tex="h"></span>&#8217;s mistakes with probability at most <span class="tex" data-tex="1-\\varepsilon"></span></div><div class="x frag" data-f="0" style="text-align:right;font-size:19px"><span class="tex" data-tex="\\Pr(\\text{some bad } h \\text{ makes no mistake})"></span></div><div class="x frag" data-f="0" style="font-size:19px"><span class="tex" data-tex="\\le\\; |\\mathcal{H}|\\, e^{-\\varepsilon N}"></span></div><div class="dnote frag" data-f="0" style="font-size:15px;max-width:34ch">tool 2, the union bound, over at most <span class="tex" data-tex="|\\mathcal{H}|"></span> bad hypotheses</div></div></div></div>
  <div class="card accent frag" data-f="1" style="margin-top:8px;padding:8px 20px">
    <div class="eq" style="margin:0;font-size:21px"><span class="texd" data-tex="\\Pr\\bigl(L_p(\\hat{h}) > \\varepsilon\\bigr) \\le |\\mathcal{H}|\\, e^{-\\varepsilon N} \\le \\delta \\quad\\Longleftrightarrow\\quad N \\;\\ge\\; \\frac{1}{\\varepsilon}\\,\\ln\\!\\Bigl(\\frac{|\\mathcal{H}|}{\\delta}\\Bigr)"></span></div>
  </div>
  <p class="caption frag" data-f="2" style="margin-top:6px;font-size:13.5px">No Hoeffding step this time: the first line is a direct
  calculation, and it gives <span class="tex" data-tex="1/\\varepsilon"></span> where Hoeffding gave <span class="tex" data-tex="1/\\varepsilon^2"></span>.</p>`},

{s:"Part II", t:"The realizable case, compared", draw:"rlzc6", html:`
  <div class="eyebrow">Live demo &#183; the two sample sizes against the tolerance</div>
  <h2 style="margin-bottom:6px"><span class="tex" data-tex="1/\\varepsilon"></span> against <span class="tex" data-tex="1/\\varepsilon^2"></span></h2>
  <div class="demo">
    <div class="demo-plot"><svg id="rlzc6" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:4px 14px;font-size:16px;align-items:center">
        <div><span style="color:var(--s2)">general</span></div><div class="eq" style="margin:0;text-align:left;font-size:17px"><span class="tex" data-tex="N \\ge \\tfrac{1}{2\\varepsilon^2}\\ln(2|\\mathcal{H}|/\\delta)"></span></div>
        <div><span style="color:var(--s4)">realizable</span></div><div class="eq" style="margin:0;text-align:left;font-size:17px"><span class="tex" data-tex="N \\ge \\tfrac{1}{\\varepsilon}\\ln(|\\mathcal{H}|/\\delta)"></span></div>
      </div>
      <div class="ctrl-row" style="margin-top:8px"><label>&#949; <span class="val" id="rlzc6ev">0.05</span></label>
        <input type="range" id="rlzc6er" min="0.01" max="0.50" step="0.01" value="0.05"></div>
      <div class="ctrl-row"><label><span class="tex" data-tex="|\\mathcal{H}|"></span> <span class="val" id="rlzc6hv">1,000</span></label>
        <input type="range" id="rlzc6hr" min="0" max="9" step="1" value="3"></div>
      <div class="warn" id="rlzc6warn" style="min-height:96px"></div>
      <p class="caption" style="margin-top:6px;font-size:14px"><span class="tex" data-tex="\\delta = 0.05"></span> throughout. The general bound also holds in the realizable case; it
      is just weaker. The tutorial works through both.</p>
    </div>
  </div>`},

{s:"Part II", t:"The objectives", html:`
  <div class="eyebrow">Part II, in one slide &#183; what was learnt</div>
  <h2 style="margin-bottom:12px">The objectives</h2>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:14px 24px;align-items:start">
    <div style="font-size:18px"><strong>1 &#183; Hoeffding, and who it applies to</strong></div>
    <div style="font-size:17px">To an <span class="tex" data-tex="h"></span> fixed before the data: <span class="tex" data-tex="\\Pr(|L_{\\mathcal{D}}(h) - L_p(h)| > \\varepsilon) \\le 2e^{-2N\\varepsilon^2}"></span>. Not to <span class="tex" data-tex="\\hat{h}"></span>, which is a function of the data: a dataset can make
    a bad hypothesis look good, and the pick finds it.</div>
    <div class="frag" data-f="0" style="font-size:18px"><strong>2 &#183; The finite-class bound</strong></div>
    <div class="frag" data-f="0" style="font-size:17px">Ask for every hypothesis at once. Hoeffding once per hypothesis, the union bound
    over the class: <span class="tex" data-tex="\\Pr(\\text{bad event}) \\le |\\mathcal{H}| \\cdot 2e^{-2N\\varepsilon^2}"></span>.</div>
    <div class="frag" data-f="1" style="font-size:18px"><strong>3 &#183; What it says</strong></div>
    <div class="frag" data-f="1" style="font-size:17px">Enough data: <span class="tex" data-tex="N \\ge \\tfrac{1}{2\\varepsilon^2}\\ln(2|\\mathcal{H}|/\\delta)"></span>.<br>As a bound, for every <span class="tex" data-tex="h"></span>: <span class="tex" data-tex="L_p(h) \\le L_{\\mathcal{D}}(h) + \\sqrt{\\ln(2|\\mathcal{H}|/\\delta)/2N}"></span>.<br>The pick:
    <span class="tex" data-tex="L_p(\\hat{h}) \\le L_p(h^{*}) + 2\\varepsilon"></span>.<br>A perfect fit: <span class="tex" data-tex="N \\ge \\tfrac{1}{\\varepsilon}\\ln(|\\mathcal{H}|/\\delta)"></span>.</div>
  </div>
  <p class="caption frag" data-f="1" style="margin-top:12px">All with probability at least <span class="tex" data-tex="1-\\delta"></span> over the draw of the data.</p>`},

{s:"Part II", t:"Not yet", html:`
  <div class="eyebrow">Part II, in one slide</div>
  <h2 style="margin-bottom:12px">What we do not have yet</h2>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:16px 26px">
    <div style="font-size:19.5px"><strong>A finite class</strong></div>
    <div style="font-size:19px">The bound needed <span class="tex" data-tex="|\\mathcal{H}| < \\infty"></span>. A linear classifier&#8217;s class is not finite; neither is any class with a real-valued
    parameter.</div>
    <div class="frag" data-f="0" style="font-size:19.5px"><strong>An equal share for every hypothesis</strong></div>
    <div class="frag" data-f="0" style="font-size:19px">The union bound gave each hypothesis the same <span class="tex" data-tex="\\delta/|\\mathcal{H}|"></span> of the failure budget,
    plausible or not.</div>
    <div class="frag" data-f="1" style="font-size:19.5px"><strong>Worst cases</strong></div>
    <div class="frag" data-f="1" style="font-size:19px">Every bound today holds for any distribution and any class, so it is loose.
    Whether it says anything about the networks people actually train is a live question.</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px;padding:12px 20px">
    <p style="font-size:19px;max-width:none">All three are Part III.</p>
  </div>`},

{s:"Part II", t:"Questions (Part II)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About the goal, the two tools, or how much data the bound asks for.</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part III", t:"Part III", div:true, html:`
  <div class="divider">
    <div class="part">Part III</div>
    <h1>Further explorations</h1>
    <div class="bar"></div>
    <div class="sub">Where the finite-class bound breaks, and two ideas that repair it. Today, the idea of each; the
    details are beyond this course.</div>
  </div>`},

{s:"Part III", t:"Where the bound breaks", html:`
  <div class="eyebrow">Start from what we have</div>
  <h2 style="margin-bottom:10px">Put an infinite class into the bound</h2>
  <p style="font-size:18.5px">With probability at least <span class="tex" data-tex="1-\\delta"></span>, for every <span class="tex" data-tex="h \\in \\mathcal{H}"></span>:</p>
  <div class="eq" style="margin:8px 0 12px;font-size:24px"><span class="texd" data-tex="L_p(h) \\;\\le\\; L_{\\mathcal{D}}(h) + \\sqrt{\\frac{\\ln(2|\\mathcal{H}|/\\delta)}{2N}}"></span></div>
  <div class="dgrid frag" data-f="0" style="grid-template-columns:auto minmax(0,1fr);gap:12px 24px;margin-top:4px">
    <div style="font-size:19px"><strong>A linear classifier</strong></div>
    <div style="font-size:19px">In the plane, <span class="tex" data-tex="h(x) = \\operatorname{sign}(w_1 x_1 + w_2 x_2 + b)"></span>: three real numbers, any point of <span class="tex" data-tex="\\mathbb{R}^3"></span>. Not <span class="tex" data-tex="|\\mathcal{H}|"></span> hypotheses but uncountably
    many: <span class="tex" data-tex="|\\mathcal{H}| = \\infty"></span>.</div>
    <div class="frag" data-f="1" style="font-size:19px"><strong>Substitute</strong></div>
    <div class="frag" data-f="1" style="font-size:19px"><span class="tex" data-tex="L_p(h) \\le L_{\\mathcal{D}}(h) + \\sqrt{\\ln(2 \\cdot \\infty/\\delta)/2N} = \\infty"></span> &#8212; that is, <span class="tex" data-tex="L_p(h) - L_{\\mathcal{D}}(h) \\le \\infty"></span>. True, and it says nothing.</div>
    <div class="frag" data-f="2" style="font-size:19px"><strong>What happens</strong></div>
    <div class="frag" data-f="2" style="font-size:19px">Linear classifiers trained on a few hundred points do generalise.</div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:14px;padding:12px 20px">
    <p style="font-size:19px;max-width:none">The bound is true and says nothing. Where did <span class="tex" data-tex="|\\mathcal{H}|"></span> enter the argument?</p>
  </div>`},

{s:"Part III", t:"Where |H| came from", draw:"ovc6", html:`
  <div class="eyebrow">Tool 2, again</div>
  <h2 style="margin-bottom:6px">Where <span class="tex" data-tex="|\\mathcal{H}|"></span> came from</h2>
  <p style="font-size:18px;margin-bottom:0">One bad event per hypothesis, <span class="tex" data-tex="B_h = \\bigl\\{\\,|L_{\\mathcal{D}}(h) - L_p(h)| > \\varepsilon\\,\\bigr\\}"></span>, and the union bound over the class
  <span class="tex" data-tex="h_1, \\dots, h_{|\\mathcal{H}|}"></span>:</p>
  <div class="eq" style="margin:6px 0 4px;font-size:22px"><span class="texd" data-tex="\\Pr\\bigl(B_{h_1} \\cup B_{h_2} \\cup \\cdots \\cup B_{h_{|\\mathcal{H}|}}\\bigr) \\;\\le\\; \\underbrace{\\Pr(B_{h_1}) + \\Pr(B_{h_2}) + \\cdots + \\Pr(B_{h_{|\\mathcal{H}|}})}_{|\\mathcal{H}| \\text{ terms: equal to the left side only if no two events overlap}}"></span></div>
  <div class="row top" style="gap:16px;align-items:flex-start">
    <div class="col"><svg id="ovc6a" viewBox="0 0 300 244" style="width:100%;display:block"></svg></div>
    <div class="col frag" data-f="0"><svg id="ovc6b" viewBox="0 0 300 244" style="width:100%;display:block"></svg></div>
    <div class="col frag" data-f="0" style="flex:1.2"><svg id="ovc6c" viewBox="0 0 360 244" style="width:100%;display:block"></svg></div>
  </div>
  <p class="frag" data-f="1" style="font-size:17px;margin-top:4px">Two lines a sliver apart: <span class="tex" data-tex="\\Delta L_p"></span> is the probability of the sliver,
  and <span class="tex" data-tex="\\Delta L_{\\mathcal{D}}"></span> is the number of data points inside it &#8212; here none. So <span class="tex" data-tex="|L_{\\mathcal{D}}(h_1) - L_p(h_1)| \\approx |L_{\\mathcal{D}}(h_2) - L_p(h_2)|"></span>: when one bad event happens, so does the other. The sum
  charged for both, and for every line in between.</p>`},

{s:"Part III", t:"Two ideas", html:`
  <div class="eyebrow">What can replace <span class="tex" data-tex="|\\mathcal{H}|"></span></div>
  <h2 style="margin-bottom:16px">Two ideas that repair the count</h2>
  <div class="row top stretch" style="gap:18px">
    <div class="col card" style="padding:16px 20px">
      <div class="eyebrow" style="margin-bottom:6px">1 &#183; Count on the data, not in the class</div>
      <p style="font-size:18px;max-width:none">On <span class="tex" data-tex="N"></span> given points an infinite class can still produce only finitely many labellings,
      at most <span class="tex" data-tex="2^N"></span>. Count those instead of the hypotheses: the <strong>growth function</strong>.</p>
    </div>
    <div class="col card frag" data-f="0" style="padding:16px 20px">
      <div class="eyebrow" style="margin-bottom:6px">2 &#183; Weigh the hypotheses</div>
      <p style="font-size:18px;max-width:none">Keep the sum, but split the failure budget <span class="tex" data-tex="\\delta"></span> unevenly: a prior over the class decides
      which hypotheses get the larger shares. Towards <strong>PAC-Bayes</strong>.</p>
    </div>
  </div>`},

{s:"Part III", t:"Dichotomies, drawn", draw:"dich6", html:`
  <div class="eyebrow">Idea 1 &#183; count on the data</div>
  <h2 style="margin-bottom:6px">On a dataset, a classifier is only a labelling</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0">
    <svg id="dich6" viewBox="0 0 960 262" style="width:100%;display:block"></svg>
  </div>
  <div class="row top" style="gap:22px;margin-top:8px">
    <div class="col"><p style="font-size:17px;max-width:none">Infinitely many lines put the left point alone on its side. On these
    three points they all have the same dataset loss; their <span class="tex" data-tex="L_p"></span> differ, but neighbouring lines only by a sliver, so their bad events
    overlap almost completely. The sum charged for each line separately.</p></div>
    <div class="col frag" data-f="0"><p style="font-size:17px;max-width:none">So count what the class can do on the points. Each
    distinct labelling of <span class="tex" data-tex="N"></span> points is a <em>dichotomy</em>, and there are at most <span class="tex" data-tex="2^N"></span> of them, however large the class. The
    <strong>growth function</strong> is the most the class can produce on any <span class="tex" data-tex="N"></span> points:</p>
    <div class="eq" style="margin:4px 0 0;font-size:18px"><span class="texd" data-tex="m_{\\mathcal{H}}(N) = \\max_{x_1, \\dots, x_N} \\bigl|\\{(h(x_1), \\dots, h(x_N)) : h \\in \\mathcal{H}\\}\\bigr| \\;\\le\\; 2^N"></span></div></div>
  </div>`},

{s:"Part III", t:"Positive rays", draw:"ray6", html:`
  <div class="eyebrow">Counting labellings &#183; the simplest class</div>
  <h2 style="margin-bottom:6px">Positive rays on the line: <span class="tex" data-tex="N+1"></span> labellings</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0">
    <svg id="ray6" viewBox="0 0 960 250" style="width:100%;display:block"></svg>
  </div>
  <div class="row top" style="gap:22px;margin-top:6px">
    <div class="col"><p style="font-size:17.5px;max-width:none"><span class="tex" data-tex="h_a(x) = \\operatorname{sign}(x - a)"></span>: everything to the right of <span class="tex" data-tex="a"></span> is labelled <span class="tex" data-tex="+1"></span>, everything to the
    left <span class="tex" data-tex="-1"></span>. With <span class="tex" data-tex="N"></span> points on the line, <span class="tex" data-tex="a"></span> can fall in one of <span class="tex" data-tex="N+1"></span> gaps, and every <span class="tex" data-tex="a"></span> in the same gap gives the same
    labelling.</p></div>
    <div class="col frag" data-f="0"><p style="font-size:17.5px;max-width:none">So a class with infinitely many hypotheses makes only
    <span class="tex" data-tex="N+1"></span> labellings of <span class="tex" data-tex="N"></span> points: <span class="tex" data-tex="m_{\\mathcal{H}}(N) = N+1"></span>.</p></div>
  </div>`},

{s:"Part III", t:"Intervals", draw:"intv6", html:`
  <div class="eyebrow">Counting labellings &#183; two parameters</div>
  <h2 style="margin-bottom:6px">Intervals on the line: <span class="tex" data-tex="\\tfrac{1}{2}N(N+1)+1"></span> labellings</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0">
    <svg id="intv6" viewBox="0 0 960 250" style="width:100%;display:block"></svg>
  </div>
  <div class="row top" style="gap:22px;margin-top:6px">
    <div class="col"><p style="font-size:17.5px;max-width:none"><span class="tex" data-tex="+1"></span> inside <span class="tex" data-tex="[a, b]"></span>, <span class="tex" data-tex="-1"></span> outside. The labelling is fixed by the two gaps
    that <span class="tex" data-tex="a"></span> and <span class="tex" data-tex="b"></span> fall in: two different gaps out of <span class="tex" data-tex="N+1"></span>, or the same gap twice, which labels every point <span class="tex" data-tex="-1"></span>.</p></div>
    <div class="col frag" data-f="0"><p style="font-size:17.5px;max-width:none"><span class="tex" data-tex="m_{\\mathcal{H}}(N) = \\binom{N+1}{2} + 1 = \\tfrac{1}{2}N(N+1) + 1"></span>. Four points: 11 labellings out of the 16
    possible.</p></div>
  </div>`},

{s:"Part III", t:"How many labellings can a line make?", draw:"dic6", html:`
  <div class="eyebrow">Live demo &#183; counting labellings &#183; a line in the plane</div>
  <h2 style="margin-bottom:6px">Lines in the plane: <span class="tex" data-tex="N^2 - N + 2"></span> labellings</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-bottom:6px">
    <svg id="dic6" viewBox="0 0 960 300" style="width:100%;display:block"></svg>
  </div>
  <div class="row top" style="gap:18px;align-items:flex-start">
    <div class="col" style="flex:1.4"><div class="warn" id="dic6warn" style="min-height:62px;margin-top:0"></div></div>
    <div class="col">
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="bbtn sel" id="dic6n3" type="button">3 points</button>
        <button class="bbtn" id="dic6n4" type="button">4 points</button>
        <button class="bbtn" id="dic6n5" type="button">5 points</button>
      </div>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:7px">
        <button class="bbtn sel" id="dic6general" type="button">general position</button>
        <button class="bbtn" id="dic6line" type="button">on a line</button>
      </div>
      <p style="font-size:14.5px;max-width:none;margin-top:8px">For <span class="tex" data-tex="N"></span> points in general position, a line cuts off a run of
      consecutive points around their outline: <span class="tex" data-tex="N"></span> places to start, <span class="tex" data-tex="N-1"></span> lengths, plus the two one-colour labellings:
      <span class="tex" data-tex="N^2 - N + 2"></span>. Points on a line allow fewer; the growth function takes the most over all placements.</p>
    </div>
  </div>`},

{s:"Part III", t:"Polynomial or exponential", draw:"grow6", html:`
  <div class="eyebrow">Live demo &#183; the replacement for <span class="tex" data-tex="|\\mathcal{H}|"></span></div>
  <h2 style="margin-bottom:6px">The growth function, and the bound with it</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="grow6" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:15.5px;max-width:none"><span class="tex" data-tex="m_{\\mathcal{H}}(N) = \\max_{x_1,\\dots,x_N} |\\{(h(x_1),\\dots,h(x_N)) : h \\in \\mathcal{H}\\}|"></span>: the most labellings the class can produce on any <span class="tex" data-tex="N"></span> points. Finite even
      when the class is not, and a polynomial for all three classes we counted. Dashed: <span class="tex" data-tex="2^N"></span>, every labelling possible.</p>
      <div class="btn-row" style="margin-top:6px">
        <button class="bbtn" id="grow6ray" type="button">positive rays</button>
        <button class="bbtn" id="grow6intv" type="button">intervals</button>
        <button class="bbtn sel" id="grow6perc" type="button">linear classifiers</button>
      </div>
      <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin-top:8px;font-size:15px">
        <div>rays</div><div class="eq" style="margin:0;text-align:left;font-size:15.5px"><span class="tex" data-tex="m_{\\mathcal{H}}(N) = N+1"></span></div>
        <div>intervals</div><div class="eq" style="margin:0;text-align:left;font-size:15.5px"><span class="tex" data-tex="\\tfrac{1}{2}N(N+1) + 1"></span></div>
        <div>linear classifiers</div><div class="eq" style="margin:0;text-align:left;font-size:15.5px"><span class="tex" data-tex="N^2 - N + 2"></span></div>
      </div>
    </div>
  </div>
  <div class="card accent frag" data-f="0" style="margin-top:8px;padding:10px 20px">
    <p style="font-size:16px;max-width:none;margin-bottom:2px">With <span class="tex" data-tex="m_{\\mathcal{H}}(2N)"></span> in place of <span class="tex" data-tex="|\\mathcal{H}|"></span> the bound survives. With probability at least
    <span class="tex" data-tex="1-\\delta"></span>, for every <span class="tex" data-tex="h \\in \\mathcal{H}"></span>:</p>
    <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="L_p(h) \\;\\le\\; L_{\\mathcal{D}}(h) + \\sqrt{\\frac{8}{N}\\ln\\frac{4\\,m_{\\mathcal{H}}(2N)}{\\delta}}"></span></div>
  </div>
  <p class="caption frag" data-f="0" style="margin-top:8px">For more about the growth function, the <strong>VC dimension</strong> and
  <strong>Rademacher complexity</strong>: CS5339.</p>`},

{s:"Part III", t:"Towards PAC-Bayes: weigh hypotheses", draw:"pb6", html:`
  <div class="eyebrow">Idea 2 &#183; weigh the hypotheses</div>
  <h2 style="margin-bottom:6px">Towards PAC-Bayes: weigh hypotheses</h2>
  <p style="font-size:17px;margin-bottom:2px">The union bound covers the bad events out of one budget, <span class="tex" data-tex="\\delta"></span>. Twelve hypotheses: three
  linear classifiers, four quadratics, five cubics.</p>
  <svg id="pb6a" viewBox="0 0 960 112" style="width:100%;display:block"></svg>
  <svg id="pb6b" class="frag" data-f="0" viewBox="0 0 960 112" style="width:100%;display:block"></svg>
  <div class="frag" data-f="1" style="margin-top:4px"><div style="text-align:center"><div style="display:inline-grid;grid-template-columns:auto auto auto;gap:9px 14px;align-items:center;text-align:left"><div class="x" style="text-align:right;font-size:20px"><span class="tex" data-tex="L_p(h)"></span></div><div class="x" style="font-size:20px"><span class="tex" data-tex="\\le\\; L_{\\mathcal{D}}(h) + \\sqrt{\\tfrac{1}{2N}\\ln\\tfrac{2}{\\delta P(h)}}"></span></div><div class="dnote" style="font-size:15px;max-width:34ch">Hoeffding for <span class="tex" data-tex="h"></span> with its own share <span class="tex" data-tex="\\delta P(h)"></span> of the budget; the shares add to <span class="tex" data-tex="\\delta"></span></div><div class="x" style="text-align:right;font-size:20px"></div><div class="x" style="font-size:20px"><span class="tex" data-tex="=\\; L_{\\mathcal{D}}(h) + \\sqrt{\\tfrac{\\ln(1/P(h)) + \\ln(2/\\delta)}{2N}}"></span></div><div class="dnote" style="font-size:15px;max-width:34ch">the penalty is now <span class="tex" data-tex="\\ln\\tfrac{1}{P(h)}"></span>: how implausible <span class="tex" data-tex="h"></span> was before the data</div></div></div></div>
  <p class="frag" data-f="2" style="font-size:17px;margin-top:8px">A class with a real-valued parameter: <span class="tex" data-tex="P(h) = 0"></span> for every single <span class="tex" data-tex="h"></span>, so
  the penalty is <span class="tex" data-tex="\\ln\\tfrac{1}{0} = \\infty"></span> again. The repair, next: bound a distribution over hypotheses instead of one.</p>`},

{s:"Part III", t:"PAC-Bayes", html:`
  <div class="eyebrow">Idea 2, one step further</div>
  <h2 style="margin-bottom:8px">PAC-Bayes: bound a distribution over hypotheses</h2>
  <p style="font-size:18px">A prior <span class="tex" data-tex="P"></span> fixed before the data; after the data, any distribution <span class="tex" data-tex="Q"></span> over the class (a posterior, an
  ensemble, the spread of training runs). To classify, draw <span class="tex" data-tex="h \\sim Q"></span> and use it. This randomised classifier has generalisation loss
  <span class="tex" data-tex="\\mathbb{E}_{h \\sim Q}[L_p(h)]"></span> and dataset loss <span class="tex" data-tex="\\mathbb{E}_{h \\sim Q}[L_{\\mathcal{D}}(h)]"></span>. With probability at least <span class="tex" data-tex="1-\\delta"></span>, for every <span class="tex" data-tex="Q"></span>:</p>
  <div class="card accent" style="margin-top:10px;padding:12px 20px">
    <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="\\mathbb{E}_{h \\sim Q}\\bigl[L_p(h)\\bigr] \\;\\le\\; \\mathbb{E}_{h \\sim Q}\\bigl[L_{\\mathcal{D}}(h)\\bigr] + \\sqrt{\\frac{\\mathrm{KL}(Q \\,\\|\\, P) + \\ln\\frac{2\\sqrt{N}}{\\delta}}{2N}}"></span></div>
  </div>
  <div class="dgrid frag" data-f="0" style="grid-template-columns:auto minmax(0,1fr);gap:10px 24px;margin-top:12px">
    <div style="font-size:18.5px"><strong><span class="tex" data-tex="\\mathrm{KL}(Q\\,\\|\\,P)"></span></strong></div>
    <div style="font-size:18px">how far <span class="tex" data-tex="Q"></span> moved from <span class="tex" data-tex="P"></span>. If <span class="tex" data-tex="Q"></span> puts all its probability on a single <span class="tex" data-tex="h"></span>, it is <span class="tex" data-tex="\\ln\\tfrac{1}{P(h)}"></span>: the previous slide&#8217;s
    penalty.</div>
    <div class="frag" data-f="1" style="font-size:18.5px"><strong>A real-valued parameter</strong></div>
    <div class="frag" data-f="1" style="font-size:18px"><span class="tex" data-tex="P(h) = 0"></span> for every single <span class="tex" data-tex="h"></span>, but <span class="tex" data-tex="\\mathrm{KL}(Q\\,\\|\\,P)"></span> is finite whenever <span class="tex" data-tex="Q"></span> spreads over a region
    that <span class="tex" data-tex="P"></span> gives mass to. That is what the last slide could not do.</div>
    <div class="frag" data-f="2" style="font-size:18.5px"><strong>Non-vacuous</strong></div>
    <div class="frag" data-f="2" style="font-size:18px">Bounds of this form have been computed for trained networks with millions of
    parameters (Dziugaite &amp; Roy, 2017; Lotfi et al., 2022).</div>
  </div>
  <p class="caption frag" data-f="2" style="margin-top:10px">McAllester (1999). The majority vote under <span class="tex" data-tex="Q"></span> is a different classifier;
  for 0&#8211;1 loss its error is at most twice the randomised one&#8217;s. Reading, if you want it: Guedj, <em>A primer on
  PAC-Bayesian learning</em> (2019).</p>`},

{s:"Part III", t:"The models that are said to break it", draw:"puz5", html:`
  <div class="eyebrow">Live demo &#183; where today&#8217;s models sit</div>
  <h2 style="margin-bottom:6px">Today&#8217;s networks sit far to the right</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="puz5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:18px;max-width:none">ResNet-18: <strong>11 million</strong> parameters.<br>CIFAR-10:
      <strong>50 thousand</strong> images.<br>&#8776; 200 parameters per data point.</p>
      <p style="font-size:16.5px;max-width:none;margin-top:8px">Every bound today wants <span class="tex" data-tex="N"></span> well above the complexity of the
      class: <span class="tex" data-tex="\\ln|\\mathcal{H}|"></span> for a finite one, its successors for infinite ones. These models have many more parameters than data
      points, can fit random labels perfectly, and still generalise. This is where current theory is working.</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin:10px 0">
        <button class="bbtn sel" id="puz0" type="button">the U</button>
        <button class="bbtn" id="puz1" type="button">extend it</button>
        <button class="bbtn" id="puz2" type="button">where today&#8217;s models sit</button>
        <button class="bbtn" id="puz3" type="button">what we observe</button>
      </div>
      <div class="warn" id="puzwarn" style="min-height:104px"></div>
    </div>
  </div>`},

{s:"Part III", t:"The usual conclusion", draw:"ddx6", html:`
  <div class="eyebrow">What is often said next</div>
  <h2 style="margin-bottom:10px">&#8220;The textbooks must be re-written&#8221;</h2>
  <div class="row top" style="gap:22px">
    <div class="col" style="flex:1.05">
      <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:12px 18px">
        <div style="font-size:18.5px"><strong>Benign overfitting</strong></div>
        <div style="font-size:17.5px">A network can fit randomly labelled images perfectly and still generalise on real ones.</div>
        <div class="frag" data-f="0" style="font-size:18.5px"><strong>Double descent</strong></div>
        <div class="frag" data-f="0" style="font-size:17.5px">Test error falls, rises, and falls again as models grow past the
        point where they fit the data exactly.</div>
        <div class="frag" data-f="1" style="font-size:18.5px"><strong>Overparametrisation</strong></div>
        <div class="frag" data-f="1" style="font-size:17.5px">More parameters than data points, and performance improves anyway.</div>
      </div>
    </div>
    <div class="col">
      <div class="fig" style="background:transparent;box-shadow:none;padding:0">
        <svg id="ddx6" viewBox="0 0 590 336" style="width:100%%;display:block"></svg>
      </div>
      <p class="caption" style="margin-top:2px;font-size:13.5px">A schematic, not a measurement: test error against model size. The
      training error reaches zero where the model first fits the data exactly, and stays there.</p>
    </div>
  </div>
  <p class="frag" data-f="2" style="font-size:18px;margin-top:12px">These are being discussed now. Recent work argues that none of
  the three is specific to deep learning, and that the ideas of this part &#8212; priors over hypotheses, PAC-Bayes &#8212;
  explain them once the models and the data are read properly.</p>
  <p class="caption frag" data-f="2" style="margin-top:6px">Andrew Gordon Wilson, <em>Position: Deep Learning is Not So Mysterious
  or Different</em>, ICML 2025.</p>`},

{s:"Part III", t:"Questions (Part III)", div:true, html:`

{s:"Summary", t:"Summary", div:true, html:`
