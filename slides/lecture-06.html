/* ---- cross-validation, as a picture ------------------------------------------
   Stage 0: the data. 1: K folds, each held out once, fit on the rest, score on the
   held-out block. 2: average the K scores into one number for this M. 3: repeat for
   every M and pick the smallest. Numbers are the deck's own (N = 14, K = 5). */
let CVI_ST=0;
function cviStage(s){ CVI_ST=s; drawCvIdea5(); }
function drawCvIdea5(){
  const svg=document.getElementById('cvi5'); if(!svg) return;
  const W=960,H=300, N=CV.N, K=CV.K, d=cvData(N), M0=3;
  const x0=24, cw=22, ch=18, gap=3, rowh=34, y0=58;
  let g='';
  const cells=(y,held,op)=>{ let s=''; for(let i=0;i<N;i++) s+='<rect x="'+(x0+i*(cw+gap))+'" y="'+y+'" width="'+cw+'" height="'+ch+'" rx="3" fill="'+(held&&held.indexOf(i)>=0?'var(--accent)':'var(--rule)')+'" opacity="'+op+'"/>'; return s; };
  g+='<text class="legend" x="'+x0+'" y="'+(y0-30)+'" font-weight="700">'+N+' data points</text>'
   + '<text class="tick" x="'+(x0+N*(cw+gap)+10)+'" y="'+(y0-30)+'" fill="var(--ink-soft)">'+(CVI_ST===0?'no unseen data to score on':'')+'</text>';
  if(CVI_ST===0){ g+=cells(y0-16,null,1); svg.innerHTML=g; cviUi(); return; }
  const errs=[];
  for(let k=0;k<K;k++){ const F=cvFoldErr(d,M0,k); errs.push(F.err); const y=y0-16+k*rowh;
    g+=cells(y,F.held,k===0||CVI_ST>=1?1:0.5)
     + '<text class="tick" x="'+(x0+N*(cw+gap)+12)+'" y="'+(y+13)+'" fill="var(--ink-soft)">fit on grey &#8594; score on <tspan fill="var(--accent)">red</tspan>: '
     + '<tspan fill="var(--ink)" font-weight="700">'+F.err.toFixed(2)+'</tspan></text>'; }
  const yb=y0-16+K*rowh+4;
  if(CVI_ST>=2){ const av=errs.reduce((a,b)=>a+b,0)/K;
    g+='<line x1="'+(x0+N*(cw+gap)+12)+'" y1="'+yb+'" x2="'+(x0+N*(cw+gap)+230)+'" y2="'+yb+'" stroke="var(--rule)"/>'
     + '<text class="legend" x="'+(x0+N*(cw+gap)+12)+'" y="'+(yb+20)+'">average = <tspan font-weight="700">'+av.toFixed(3)+'</tspan> = the score for M = '+M0+'</text>'; }
  if(CVI_ST>=3){ const ox=660, ow=280, oy=40, oh=200, MX=9, hi=1.6;
    const Xm=m=>ox+(m/MX)*ow, Ym=v=>oy+(1-Math.min(v,hi)/hi)*oh;
    g+='<line x1="'+ox+'" y1="'+(oy+oh)+'" x2="'+(ox+ow)+'" y2="'+(oy+oh)+'" stroke="var(--rule)"/><line x1="'+ox+'" y1="'+oy+'" x2="'+ox+'" y2="'+(oy+oh)+'" stroke="var(--rule)"/>';
    const sc=[]; for(let m=0;m<=MX;m++) sc.push(cvScore(N,m));
    let best=0; sc.forEach((v,m)=>{ if(v<sc[best]) best=m; });
    g+='<clipPath id="cviclip"><rect x="'+ox+'" y="'+oy+'" width="'+ow+'" height="'+oh+'"/></clipPath>'
     + '<path clip-path="url(#cviclip)" d="M'+sc.map((v,m)=>Xm(m).toFixed(1)+' '+Ym(v).toFixed(1)).join(' L')+'" fill="none" stroke="var(--accent)" stroke-width="2.4"/>';
    sc.forEach((v,m)=>{ if(v<=hi) g+='<circle cx="'+Xm(m).toFixed(1)+'" cy="'+Ym(v).toFixed(1)+'" r="3.4" fill="var(--accent)"/>'; g+='<text class="tick" x="'+Xm(m).toFixed(1)+'" y="'+(oy+oh+15)+'" text-anchor="middle">'+m+'</text>'; });
    g+='<circle cx="'+Xm(best).toFixed(1)+'" cy="'+Ym(sc[best]).toFixed(1)+'" r="8" fill="none" stroke="var(--s4)" stroke-width="2.4"/>'
     + '<text class="legend" x="'+(ox+ow/2)+'" y="'+(oy-14)+'" text-anchor="middle" font-weight="700">the same, at every M</text>'
     + '<text class="legend" x="'+(ox+ow/2)+'" y="'+(oy+oh+36)+'" text-anchor="middle">degree M &#183; pick the smallest: <tspan fill="var(--s4)" font-weight="700">M = '+best+'</tspan></text>'
     + '<text class="tick" x="'+(ox+ow-4)+'" y="'+(oy+oh-8)+'" text-anchor="end" fill="var(--ink-soft)">high degrees run off the top</text>'; }
  svg.innerHTML=g; cviUi();
}
function cviUi(){ ['cvi0','cvi1','cvi2','cvi3'].forEach((id,i)=>{ const b=document.getElementById(id); if(b) b.classList.toggle('sel', CVI_ST===i); });
  const w=document.getElementById('cviwarn'); if(w) w.innerHTML=[
    'Training error cannot choose the degree: it always prefers the largest. And there is no unseen data to score on.',
    'So make some. Split into <strong>K = 5</strong> folds; hold each one out in turn; fit by least squares on the rest; score on the held-out block. Every point is scored exactly once, by a fit that never saw it.',
    'Average the five scores: <strong>one number for this M</strong>. That is the cross-validation score.',
    'Repeat for every candidate M and take the smallest. Cross-validation is not a way of fitting &#8212; it is a way of <em>scoring</em>.'][CVI_ST]; }

    const note=(cx,cy,col,txt,tw,cls)=>{ const t=placeTag(vis, cx, cy, tw, 14, {x0:ml,x1:W-mr,y0:mt,y1:H-mb});
      return leaderLine(cx,cy,t,col)+'<text class="'+(cls||'legend')+'" x="'+t.x.toFixed(1)+'" y="'+t.y.toFixed(1)+'" text-anchor="'+t.a+'" fill="'+col+'" '+halo+'>'+txt+'</text>'; };
    g+=note(X(DD.n), mt+6, 'var(--s4)', 'variance &#8593; off the chart', 190, 'tick');
    g+=note(X(120), Y(V[at(120)]), 'var(--s4)', 'variance falls as p grows', 285);
    g+=note(X(170), Y(B[at(170)]), 'var(--s1)', DFX_PROF==='concentrated'?'bias&#178; creeps up (shrinkage)':'bias&#178; keeps falling (all signal)', 190);
  } else {
    const xhi=1.6, yhi=2.0, X=v=>ml+(Math.min(v,xhi*1.3)/xhi)*(W-ml-mr), Y=v=>mt+(1-Math.min(v,yhi*1.3)/yhi)*(H-mt-mb);
    [0,0.5,1,1.5,2].forEach(v=>{ g+='<line x1="'+ml+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; });
    [0.4,0.8,1.2,1.6].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+v.toFixed(1)+'</text>'; });
    g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
     + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">the variance term: how much the fit moves with the data</text>'
     + '<clipPath id="dfxclip"><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'"/></clipPath>';
    const vis=[]; { const b={x0:W-mr-4-280,y0:H-mb-8-13,x1:W-mr-4,y1:H-mb-8+3}; vis.push([[b.x0,b.y0],[b.x1,b.y0]],[[b.x1,b.y0],[b.x1,b.y1]],[[b.x1,b.y1],[b.x0,b.y1]],[[b.x0,b.y1],[b.x0,b.y0]]); }
    const branch=(sel,col,dash)=>{ const pts=[]; ps.forEach((p,i)=>{ if(sel(p)) pts.push([X(V[i]),Y(T[i]),p]); });
      for(let k=1;k<pts.length;k++){ const s=clipToPlot(pts[k-1],pts[k],{x0:ml,x1:W-mr,y0:mt,y1:H-mb}); if(s) vis.push(s); }
      let s='<g clip-path="url(#dfxclip)"><path d="M'+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L')+'" fill="none" stroke="'+col+'" stroke-width="2.6"'+(dash?' stroke-dasharray="7 4"':'')+'/>';
      for(let k=3;k<pts.length-1;k+=Math.max(3,Math.floor(pts.length/5))){ const a=pts[k-1], b=pts[k+1]; const dx=b[0]-a[0], dy=b[1]-a[1], L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
        s+='<path d="M'+(pts[k][0]+ux*7).toFixed(1)+' '+(pts[k][1]+uy*7).toFixed(1)+'L'+(pts[k][0]-ux*4-uy*5).toFixed(1)+' '+(pts[k][1]-uy*4+ux*5).toFixed(1)+'L'+(pts[k][0]-ux*4+uy*5).toFixed(1)+' '+(pts[k][1]-uy*4-ux*5).toFixed(1)+'Z" fill="'+col+'"/>'; }
      return s+'</g>'; };
    g+=branch(p=>p<DD.n,'var(--s1)',false)+branch(p=>p>DD.n,'var(--s3)',true);
    const tag=p=>{ const i=at(p); if(i<0||V[i]>xhi||T[i]>yhi) return '';
      const t=placeTag(vis, X(V[i]), Y(T[i]), 44, 13, {x0:ml,x1:W-mr,y0:mt,y1:H-mb});
      return '<circle cx="'+X(V[i]).toFixed(1)+'" cy="'+Y(T[i]).toFixed(1)+'" r="3.6" fill="var(--ink)"/>'+leaderLine(X(V[i]),Y(T[i]),t,'var(--ink-soft)')+'<text class="tick" x="'+t.x.toFixed(1)+'" y="'+t.y.toFixed(1)+'" text-anchor="'+t.a+'" '+halo+'>p = '+p+'</text>'; };
    g+=tag(1)+tag(13)+tag(40)+tag(60)+tag(80)+tag(200);
    g+=legendRow(ml, 22, [{t:'p &lt; n: each extra parameter adds variance',c:'var(--s1)'},{t:'p &gt; n: each extra parameter removes variance',c:'var(--s3)',d:1}]);
    g+='<text class="tick" x="'+(W-mr-4)+'" y="'+(H-mb-8)+'" text-anchor="end" fill="var(--ink-soft)">&#8594; near p = n both branches run off to the right</text>';
  }
  svg.innerHTML=g;
  const why=document.getElementById('dfxwhy');
  if(why){ if(DFX_ST===3){
    why.innerHTML='<div style="margin:2px 0 4px"><span class="texd" data-tex="\\text{bias}^2 \\approx \\underbrace{(1-\\tfrac{n}{p})^2\\,\\|\\beta_{1:p}\\|^2}_{\\text{shrunk by } n/p} + \\underbrace{\\|\\beta_{p+1:D}\\|^2}_{\\text{coordinates not used}}"></span></div>'
      + '<div style="margin:2px 0 6px"><span class="texd" data-tex="\\text{variance} \\approx \\underbrace{\\|\\beta_{1:p}\\|^2\\,\\tfrac{n}{p}\\bigl(1-\\tfrac{n}{p}\\bigr)}_{\\text{which directions is random}} + \\underbrace{\\bigl(\\sigma^2 + \\|\\beta_{p+1:D}\\|^2\\bigr)\\tfrac{n}{p-n-1}}_{\\text{noise, diluted over } p}"></span></div>'
      + '';
    if(typeof renderTeX==='function') renderTeX(); } else why.innerHTML=''; }
  /* the caption slot on the right carries the profile-specific sentence in stage 3 */
  const cap=document.getElementById('dfxcap');
  if(cap){ if(!cap.dataset.orig) cap.dataset.orig=cap.innerHTML; cap.innerHTML=(DFX_ST===3)?'Past the threshold the fit is the truth <em>projected onto the n directions the data spans</em>: on average shrunk by n/p, so bias&#178; grows with p; which directions is random, so that variance falls with p, and the noise is diluted over p. '+DFX_WHY[DFX_PROF]+' Closed forms for this Gaussian design; they match the simulation to two decimals.':cap.dataset.orig; }
  ['dfx1','dfx2','dfx3'].forEach((id,i)=>{ const b=document.getElementById(id); if(b) b.classList.toggle('sel', DFX_ST===i+1); });
  ['dfxf','dfxs'].forEach((id,i)=>{ const b=document.getElementById(id); if(b) b.classList.toggle('sel', DFX_PROF===['concentrated','spread'][i]); });
  const w=document.getElementById('dfxwarn'); if(!w) return;
  const f=v=>v.toFixed(2);
  w.style.display=(DFX_ST===3)?'none':'';   /* stage 3 gives the readout's room to the formulas */
  if(DFX_ST===3){ w.innerHTML=''; }
  else if(DFX_ST===1){
    w.innerHTML = DFX_PROF==='concentrated'
      ? 'Past p = n, <span style="color:var(--s4)">variance falls</span>: '+f(V[at(52)])+' at p = 52, '+f(V[at(60)])+' at 60, '+f(V[at(200)])+' at 200 &#8212; a minimum-norm fit through more coordinates is smoother. '
        + '<span style="color:var(--s1)">Bias&#178; creeps up</span> as the fit shrinks toward zero: '+f(B[at(40)])+' &#8594; '+f(B[at(200)])+'. The total falls while variance drops faster than bias rises, then turns up once bias takes over.'
      : 'Past p = n, <span style="color:var(--s4)">variance falls</span> ('+f(V[at(52)])+' &#8594; '+f(V[at(200)])+') and <span style="color:var(--s1)">bias&#178; keeps falling</span> too ('+f(B[at(45)])+' &#8594; '+f(B[at(200)])+'), because every added coordinate carries signal. Both terms fall, so the total ends below anything before the threshold.';
  } else {
    w.innerHTML = 'Same errors, but the x-axis is now the <strong>variance term</strong> &#8212; the complexity the decomposition actually trades against. Below the threshold each parameter adds variance, so the models move right. Above it each parameter <em>removes</em> variance, so they come back. On this axis the modern models are low-variance models and there is no second descent'
      + (DFX_PROF==='concentrated' ? ' &#8212; they sit above the classical branch because they carry the extra bias of shrinkage.' : ' &#8212; and they end below where the classical branch started, because they also omit less signal.');
  }
}

/* ---- the guarantee against model complexity ------------------------------------
   Candidates are degrees 0..M with real risks in a U (the deck's conceptual curve, on a
   0-1 loss). For each M: the best candidate's real risk; the real risk of the candidate
   the validation scores pick (V points, 200 draws); and the bound. */
let BND_V=120, BND_D=0.05, BND_M=12;
function bndSetM(v){ BND_M=v; drawBnd5(); }
function bndSetV(v){ BND_V=v; drawBnd5(); }
function bndSetD(v){ BND_D=v; drawBnd5(); }
/* Two panels. A: the best candidate's real risk, the real risk of the pick, the bound, on a
   0-1 axis. B: pick minus best on its own (zoomed) axis, because on the 0-1 axis the two
   curves sit on top of each other. */
function drawBnd5(){
  const svg=document.getElementById('bnd5'); if(!svg) return;
  const W=560,H=300, ml=54,mr=16, MAXM=39, L=400;
  const aT=34,aB=166, bT=194,bB=262;
  const R=[]; for(let q=0;q<=MAXM;q++) R.push(selTrue(q,MAXM+1));
  const best=[],pick=[],bound=[],exc=[],pens=[];
  for(let M=0;M<=MAXM;M++){ let b=Infinity; for(let q=0;q<=M;q++) b=Math.min(b,R[q]); best.push(b);
    let acc=0; const r=lcg5(1234+M*17);
    for(let l=0;l<L;l++){ let bi=0,bs=Infinity; for(let q=0;q<=M;q++){ const sc=R[q]+Math.sqrt(R[q]*(1-R[q])/BND_V)*gauss5(r); if(sc<bs){bs=sc;bi=q;} } acc+=R[bi]; }
    const pn=2*Math.sqrt(Math.log(2*(M+1)/BND_D)/(2*BND_V)); pens.push(pn);
    pick.push(acc/L); bound.push(b+pn); exc.push(Math.max(0,acc/L-b)); }
  const X=M=>ml+(M/MAXM)*(W-ml-mr);
  const YA=v=>aT+(1-Math.min(v,1.3))*(aB-aT);
  const eLo=1e-3, eHi=1;
  const YB=v=>bB-(Math.log10(Math.min(Math.max(v,eLo),eHi))+3)/3*(bB-bT);
  const pen=2*Math.sqrt(Math.log(2*(BND_M+1)/BND_D)/(2*BND_V));
  let g='';
  [0,0.5,1].forEach(v=>{ g+='<line x1="'+ml+'" y1="'+YA(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+YA(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(YA(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; });
  [[1e-3,'0.001'],[1e-2,'0.01'],[1e-1,'0.1'],[1,'1']].forEach(([v,lab])=>{ g+='<line x1="'+ml+'" y1="'+YB(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+YB(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(YB(v)+4).toFixed(1)+'" text-anchor="end">'+lab+'</text>'; });
  [0,10,20,30,39].forEach(M=>{ g+='<text class="tick" x="'+X(M).toFixed(1)+'" y="'+(bB+15)+'" text-anchor="middle">'+M+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+aB+'" x2="'+(W-mr)+'" y2="'+aB+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+aT+'" x2="'+ml+'" y2="'+aB+'" stroke="var(--rule)"/>'
   + '<line x1="'+ml+'" y1="'+bB+'" x2="'+(W-mr)+'" y2="'+bB+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+bT+'" x2="'+ml+'" y2="'+bB+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">largest degree considered, M  (candidates 0 &#8230; M)</text>'
   + '<text class="legend" x="'+(ml+2)+'" y="'+(bT-7)+'" fill="var(--ink-soft)">below, log scale: <tspan fill="var(--s2)">pick &#8722; best</tspan> &#183; the penalty (dashed)</text>'
   + '<clipPath id="bndclipA"><rect x="'+ml+'" y="'+aT+'" width="'+(W-ml-mr)+'" height="'+(aB-aT)+'"/></clipPath>'
   + '<clipPath id="bndclipB"><rect x="'+ml+'" y="'+bT+'" width="'+(W-ml-mr)+'" height="'+(bB-bT)+'"/></clipPath>';
  const line=(arr,Y,col,w,dash)=>'<path d="M'+arr.map((v,M)=>X(M).toFixed(1)+' '+Y(v).toFixed(1)).join(' L')+'" fill="none" stroke="'+col+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="7 4"':'')+'/>';
  g+='<g clip-path="url(#bndclipA)">'+line(bound,YA,'var(--ink)',2.4,true)+line(best,YA,'var(--ink-soft)',2.4)+line(pick,YA,'var(--s2)',2.8)
   + '<line x1="'+X(BND_M).toFixed(1)+'" y1="'+aT+'" x2="'+X(BND_M).toFixed(1)+'" y2="'+aB+'" stroke="var(--s1)" stroke-width="1.6" stroke-dasharray="3 3"/>'
   + [[bound,'var(--ink)'],[best,'var(--ink-soft)'],[pick,'var(--s2)']].map(([arr,c])=>'<circle cx="'+X(BND_M).toFixed(1)+'" cy="'+YA(arr[BND_M]).toFixed(1)+'" r="4.5" fill="'+c+'" stroke="var(--bg)" stroke-width="1.5"/>').join('')+'</g>';
  g+='<g clip-path="url(#bndclipB)"><path d="M'+X(0).toFixed(1)+' '+bB+' L'+exc.map((v,M)=>X(M).toFixed(1)+' '+YB(v).toFixed(1)).join(' L')+' L'+X(MAXM).toFixed(1)+' '+bB+' Z" fill="var(--s2)" opacity=".18"/>'
   + line(exc,YB,'var(--s2)',2.4)+line(pens,YB,'var(--ink)',2.2,true)
   + '<line x1="'+X(BND_M).toFixed(1)+'" y1="'+bT+'" x2="'+X(BND_M).toFixed(1)+'" y2="'+bB+'" stroke="var(--s1)" stroke-width="1.6" stroke-dasharray="3 3"/>'
   + '<circle cx="'+X(BND_M).toFixed(1)+'" cy="'+YB(exc[BND_M]).toFixed(1)+'" r="4.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="1.5"/>'
   + '<circle cx="'+X(BND_M).toFixed(1)+'" cy="'+YB(pens[BND_M]).toFixed(1)+'" r="4.5" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/></g>';
  g+=legendRow(ml, 20, [{t:'best candidate',c:'var(--ink-soft)'},{t:'the pick (real risk)',c:'var(--s2)',w:2.8},{t:'the bound',c:'var(--ink)',d:1}]);
  svg.innerHTML=g;
  const a=document.getElementById('bndvv'); if(a) a.textContent=BND_V;
  const b2=document.getElementById('bnddv'); if(b2) b2.textContent=BND_D.toFixed(3);
  const mv=document.getElementById('bndmv'); if(mv) mv.textContent=BND_M;
  const w=document.getElementById('bndwarn'); if(!w) return;
  const M=BND_M;
  w.innerHTML='M = '+M+' ('+(M+1)+' candidates), V = '+BND_V+', &#948; = '+BND_D.toFixed(3)+': best <strong>'+best[M].toFixed(3)+'</strong> &#183; the pick <strong>'+pick[M].toFixed(3)+'</strong> (excess '+exc[M].toFixed(3)+') &#183; the bound <strong>'+(bound[M]>1.3?'&gt; 1.3 (vacuous)':bound[M].toFixed(2))+'</strong>, penalty '+pen.toFixed(2)+'. '
   + (exc[M]>0?'The penalty is '+Math.round(pen/exc[M])+'&#215; the excess. ':'')+'More candidates: the penalty grows only through ln(2(M+1)/&#948;). More validation points: both fall like 1/&#8730;V. The penalty is a worst case; the excess is what one experiment pays.';
}


/* ---- Hot or Not, repeated: the histogram of the sample averages -----------------------
   1000 sets of V Bernoulli(mu) ratings; one estimate per set; bars count the estimates.
   Optional Gaussian overlay with the CLT standard deviation sqrt(mu(1-mu)/V). */
let CLT_V=20, CLT_G=false;
function cltSetV(v){ CLT_V=v; drawClt5(); }
function cltToggleG(){ CLT_G=!CLT_G; drawClt5(); }
function drawClt5(){
  const svg=document.getElementById('clt5'); if(!svg) return;
  const W=560,H=300, ml=54,mr=16,mt=30,mb=44, MU=0.735, T=1000, V=CLT_V;
  const r=lcg5(20250908+V);
  const w=V<=20?1/V:0.02, nb=Math.round(1/w), cnt=new Array(nb+1).fill(0);
  let sum=0,sum2=0;
  for(let t=0;t<T;t++){ let k=0; for(let i=0;i<V;i++) if(r()<MU) k++; const m=k/V; sum+=m; sum2+=m*m; cnt[Math.round(m/w)]++; }
  const mean=sum/T, sd=Math.sqrt(Math.max(0,sum2/T-mean*mean)), sdth=Math.sqrt(MU*(1-MU)/V);
  const ymax=Math.max(...cnt)*1.15;
  const X=v=>ml+v*(W-ml-mr), Y=c=>mt+(1-c/ymax)*(H-mt-mb);
  const st=ymax>400?100:ymax>200?50:ymax>80?20:10;
  let g='';
  for(let c=0;c<=ymax;c+=st) g+='<line x1="'+ml+'" y1="'+Y(c).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(c).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(c)+4).toFixed(1)+'" text-anchor="end">'+c+'</text>';
  [0,0.25,0.5,0.75,1].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+v.toFixed(2)+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">estimate from one set of V ratings</text>'
   + '<clipPath id="cltclip"><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'"/></clipPath><g clip-path="url(#cltclip)">';
  const bw=X(w)-X(0);
  cnt.forEach((c,k)=>{ if(!c) return; g+='<rect x="'+(X(k*w)-bw/2+0.5).toFixed(1)+'" y="'+Y(c).toFixed(1)+'" width="'+Math.max(1,bw-1).toFixed(1)+'" height="'+(Y(0)-Y(c)).toFixed(1)+'" fill="var(--s1)" opacity=".55"/>'; });
  if(CLT_G){ let dpath=''; for(let x=0;x<=1.0001;x+=0.004){ const y=T*w*Math.exp(-(x-MU)*(x-MU)/(2*sdth*sdth))/(sdth*Math.sqrt(2*Math.PI)); dpath+=(dpath?' L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); } g+='<path d="'+dpath+'" fill="none" stroke="var(--s2)" stroke-width="2.4"/>'; }
  g+='<line x1="'+X(MU).toFixed(1)+'" y1="'+mt+'" x2="'+X(MU).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s4)" stroke-width="1.8" stroke-dasharray="5 4"/></g>';
  const items=[{t:'estimates, 1000 sets of V',c:'var(--s1)',w:7},{t:'μ = 0.735',c:'var(--s4)',d:1}]; if(CLT_G) items.push({t:'Gaussian, sd √(μ(1−μ)/V)',c:'var(--s2)',w:2.4});
  g+=legendRow(ml, 20, items);
  svg.innerHTML=g;
  [[5,'cltv5'],[20,'cltv20'],[100,'cltv100']].forEach(([v,id])=>{ const b=document.getElementById(id); if(b) b.classList.toggle('sel', v===V); });
  const bg=document.getElementById('cltg'); if(bg){ bg.classList.toggle('sel', CLT_G); bg.textContent=CLT_G?'hide the Gaussian':'overlay a Gaussian'; }
  const wr=document.getElementById('cltwarn'); if(!wr) return;
  wr.innerHTML='V = '+V+': the 1000 estimates average <strong>'+mean.toFixed(3)+'</strong> (&#956; = 0.735). Their standard deviation is <strong>'+sd.toFixed(3)+'</strong>, and &#8730;(&#956;(1&#8722;&#956;)/V) is '+sdth.toFixed(3)+'.';
}


/* ---- the Hoeffding bound against V, with a slider for the tolerance --------------------
   V on a log axis so that changing epsilon slides the curve sideways: the bound depends on V*eps^2,
   so halving eps is a shift of x4 in V. The region above 1 is shaded (a probability bound above
   1 says nothing) and the crossing with delta = 0.05 is marked. */
let HFV_E=0.10;
function hfvSet(e){ HFV_E=e; drawHfv5(); }
function drawHfv5(){
  const svg=document.getElementById('hfv5'); if(!svg) return;
  const W=560,H=330, ml=54,mr=18,mt=30,mb=46, V0=10,V1=20000, yhi=1.25, DEL=0.05;
  const LX=Math.log10(V1)-1;
  const X=v=>ml+(Math.log10(v)-1)/LX*(W-ml-mr), Y=b=>mt+(1-Math.min(b,yhi)/yhi)*(H-mt-mb), Yc=b=>mt+(1-b/yhi)*(H-mt-mb);   /* curves are not clamped: they leave through the top of the frame */
  const bound=(v,e)=>2*Math.exp(-2*v*e*e);
  let g='';
  g+='<rect x="'+ml+'" y="'+Y(yhi).toFixed(1)+'" width="'+(W-ml-mr)+'" height="'+(Y(1)-Y(yhi)).toFixed(1)+'" fill="var(--s2)" opacity=".08"/>'
   + '<text class="tick" x="'+(W-mr-6)+'" y="'+(Y(1)-6).toFixed(1)+'" text-anchor="end" fill="var(--s2)">above 1: says nothing</text>';
  [0,0.25,0.5,0.75,1].forEach(b=>{ g+='<line x1="'+ml+'" y1="'+Y(b).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(b).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(b)+4).toFixed(1)+'" text-anchor="end">'+b.toFixed(2)+'</text>'; });
  [10,100,1000,10000].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+v.toLocaleString('en')+'</text>'; });

/* ---- is learning possible? the 3-bit table ------------------------------------
   Eight possible inputs; five of them are in the data. Reveal hypotheses that all
   agree with the data on those five and enumerate every labelling of the other
   three: the data alone decides nothing off the sample. */
let BIT6_K = 0;
function bit6Add(n){ BIT6_K = (n === -99) ? 0 : Math.max(0, Math.min(8, n === 8 ? 8 : BIT6_K + n)); drawBit6(); }

/* ---- the two losses, three hypotheses at once ----------------------------------
   Three 10x10 grids, one hypothesis each: the whole input space, one cell per point,
   equally likely; red where that hypothesis is wrong, so L_p is the fraction of red.
   The ringed cells are one dataset, the same cells in all three grids; L_D is the
   fraction of red among them. "An unlucky dataset" searches seeds for one on which a
   worse hypothesis has the lowest dataset loss, which is the point of the slide. */
const GRD6 = [{risk:0.15, seed:11}, {risk:0.22, seed:23}, {risk:0.35, seed:37}];
let GRD6_S = 1, GRD6_N = 10, GRD6_NOTE = '';
function grd6Resample(){ GRD6_S++; GRD6_NOTE=''; drawGrd6(); }
function grd6SetN(n){ GRD6_N = n; GRD6_NOTE=''; drawGrd6(); }
function grd6Maps(){ return GRD6.map(h=>{ const K=10, nred=Math.round(h.risk*K*K), r0=lcg5(h.seed), idx=[];
  for(let i=0;i<K*K;i++) idx.push(i);
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(r0()*(i+1)); const t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
  return new Set(idx.slice(0,nred)); }); }
function grd6Sample(s,N){ const K=10, r1=lcg5(7919+s*104729+N*31), pool=[], samp=[];
  for(let i=0;i<K*K;i++) pool.push(i);
  for(let i=0;i<N;i++){ const j=i+Math.floor(r1()*(K*K-i)); const t=pool[i]; pool[i]=pool[j]; pool[j]=t; samp.push(pool[i]); }
  return samp; }
function grd6Losses(maps,samp){ return maps.map(m=>{ let hit=0; samp.forEach(c=>{ if(m.has(c)) hit++; }); return hit/samp.length; }); }
function grd6Unlucky(){
  const maps=grd6Maps();
  for(let s=GRD6_S+1; s<GRD6_S+20001; s++){
    const L=grd6Losses(maps, grd6Sample(s,GRD6_N)); let best=0; L.forEach((v,k)=>{ if(v<L[best]) best=k; });
    if(best!==0){ GRD6_S=s; GRD6_NOTE=''; drawGrd6(); return; } }
  GRD6_NOTE=' No such dataset among 20,000 draws at N = '+GRD6_N+': with this many points the pick is reliable.'; drawGrd6();
}
function drawGrd6(){
  const svg = document.getElementById('grd6'); if(!svg) return;
  const K=10, cs=16, gy=40, GX=[80,400,720], maps=grd6Maps(), samp=grd6Sample(GRD6_S,GRD6_N), L=grd6Losses(maps,samp);   /* compact: the row below needs its height */
  let best=0; L.forEach((v,k)=>{ if(v<L[best]) best=k; });
  const tied = L.filter(v=>v===L[best]).length>1;
  const sub=(b,s,r)=>b+'<tspan dy="5" style="font-size:12px">'+s+'</tspan><tspan dy="-5">'+r+'</tspan>';
  let g='';
  GRD6.forEach((h,q)=>{ const gx=GX[q], red=maps[q];
    g+='<text class="legend" x="'+(gx+K*cs/2)+'" y="14" text-anchor="middle" font-weight="700">h<tspan dy="4" style="font-size:11px">'+(q+1)+'</tspan><tspan dy="-4"> &#183; wrong on '+Math.round(h.risk*100)+'% of inputs</tspan></text>'
     + '<text class="legend" x="'+(gx+K*cs/2)+'" y="32" text-anchor="middle" style="font-size:15px;font-weight:700" fill="var(--s2)">'+sub('L','p','(h'+'<tspan dy="4" style="font-size:10px">'+(q+1)+'</tspan><tspan dy="-4">) = '+h.risk.toFixed(2)+'</tspan>')+'</text>';
    for(let i=0;i<K*K;i++){ const cx=gx+(i%K)*cs, cy=gy+Math.floor(i/K)*cs;
      g+='<rect x="'+cx+'" y="'+cy+'" width="'+(cs-1)+'" height="'+(cs-1)+'" fill="'+(red.has(i)?'var(--s2)':'var(--s1)')+'" opacity="'+(red.has(i)?0.75:0.30)+'"/>'; }
    samp.forEach(i=>{ const cx=gx+(i%K)*cs, cy=gy+Math.floor(i/K)*cs;
      g+='<rect x="'+(cx+1)+'" y="'+(cy+1)+'" width="'+(cs-3)+'" height="'+(cs-3)+'" fill="none" stroke="var(--ink)" stroke-width="2"/>'; });
    const win = q===best;
    g+='<text class="legend" x="'+(gx+K*cs/2)+'" y="'+(gy+K*cs+24)+'" text-anchor="middle" style="font-size:19px;font-weight:700" fill="'+(win?'var(--accent)':'var(--ink)')+'">'+sub('L','D','(h'+'<tspan dy="4" style="font-size:11px">'+(q+1)+'</tspan><tspan dy="-4">) = '+L[q].toFixed(2)+'</tspan>')+'</text>';
    if(win) g+='<text class="tick" x="'+(gx+K*cs/2)+'" y="'+(gy+K*cs+42)+'" text-anchor="middle" fill="var(--accent)" font-weight="700">lowest training error'+(tied?' (tied)':'')+'</text>';

  w.innerHTML = 'This dataset: '+list+(best===0

    : ' The lowest training error is <strong>h<sub>'+(best+1)+'</sub>&#8217;s</strong>, but on the whole grid h<sub>1</sub> is better (L<sub>p</sub> '+GRD6[0].risk.toFixed(2)+' against '+GRD6[best].risk.toFixed(2)+'). Picking by training error picks the wrong hypothesis: <strong>this dataset misleads the pick</strong>.')

/* ---- the coin experiment (Learning From Data, Exercise 1.10) ---------------------
   1,000 fair coins, 10 flips each. c1 is the first coin, crand a coin picked before
   the flips, cmin the coin with the fewest heads. Hoeffding holds for c1 and crand,
   which were chosen before the data; it fails for cmin, chosen because of it. */
let ERM6_S=14, ERM6_REP=null;   /* a typical round: c1 and crand near half heads, cmin at zero */
const ERM6_COINS=1000, ERM6_FLIPS=10;
function erm6Flip(){ ERM6_S++; ERM6_REP=null; drawErm6(); }
function erm6Repeat(){
  const cdf=[]; let acc=0; for(let k=0;k<=ERM6_FLIPS;k++){ let c=1; for(let i=0;i<k;i++) c=c*(ERM6_FLIPS-i)/(i+1); acc+=c/Math.pow(2,ERM6_FLIPS); cdf.push(acc); }
  const r=lcg5(99173+ERM6_S*7), R=500; let a=0,b=0,c=0;
  for(let t=0;t<R;t++){ let mn=ERM6_FLIPS, first=0, rnd=0; const pick=Math.floor(r()*ERM6_COINS);
    for(let i=0;i<ERM6_COINS;i++){ const u=r(); let k=0; while(u>cdf[k]) k++; if(i===0) first=k; if(i===pick) rnd=k; if(k<mn) mn=k; }
    if(first<=1) a++; if(rnd<=1) b++; if(mn<=1) c++; }
  ERM6_REP={R:R, c1:a/R, crand:b/R, cmin:c/R}; drawErm6();
}
function drawErm6(){
  const svg=document.getElementById('erm6'); if(!svg) return;
  const W=560,H=300, ml=54,mr=16,mt=36,mb=46, F=ERM6_FLIPS;
  const r=lcg5(20260915+ERM6_S*31), heads=[];
  for(let i=0;i<ERM6_COINS;i++){ let k=0; for(let f=0;f<F;f++) if(r()<0.5) k++; heads.push(k); }
  const pick=Math.floor(lcg5(777+ERM6_S)()*ERM6_COINS);
  let mi=0; heads.forEach((k,i)=>{ if(k<heads[mi]) mi=i; });
  const cnt=new Array(F+1).fill(0); heads.forEach(k=>cnt[k]++);
  const ymax=Math.max(...cnt)*1.18, X=k=>ml+((k+0.5)/(F+1))*(W-ml-mr), Y=c=>mt+(1-c/ymax)*(H-mt-mb), bw=(W-ml-mr)/(F+1)-6;
  let g='';
  for(let c=0;c<=ymax;c+=50) g+='<line x1="'+ml+'" y1="'+Y(c).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(c).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(c)+4).toFixed(1)+'" text-anchor="end">'+c+'</text>';
  for(let k=0;k<=F;k+=2) g+='<text class="tick" x="'+X(k).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+(k/F).toFixed(1)+'</text>';
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">fraction of heads in 10 flips &#183; bars count the 1,000 coins</text>';
  cnt.forEach((c,k)=>{ if(c) g+='<rect x="'+(X(k)-bw/2).toFixed(1)+'" y="'+Y(c).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(Y(0)-Y(c)).toFixed(1)+'" fill="var(--s1)" opacity=".45"/>'; });
  g+='<line x1="'+X(F/2).toFixed(1)+'" y1="'+mt+'" x2="'+X(F/2).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s4)" stroke-width="1.6" stroke-dasharray="5 4"/>'
   + '<text class="tick" x="'+(X(F/2)+6).toFixed(1)+'" y="'+(mt-6)+'" fill="var(--s4)">every coin is fair: &#956; = 0.5</text>';
  const sb=s=>'c<tspan font-size="10" dy="3">'+s+'</tspan>';
  const marks=[[sb('1'),heads[0],'var(--ink)',0],[sb('rand'),heads[pick],'var(--s3)',1],[sb('min'),heads[mi],'var(--s2)',2]];

/* ---- how much data a finite class needs ---------------------------------------
   N >= ln(2M/delta) / (2 eps^2), against M on a log axis: M enters through a log,
   so a class a million times larger costs a constant factor more data. */
let SC6_E = 0.10, SC6_D = 0.05;
function sc6SetE(e){ SC6_E = e; drawSc6(); }
function sc6SetD(d){ SC6_D = d; drawSc6(); }
function drawSc6(){
  const svg = document.getElementById('sc6'); if(!svg) return;
  const W=560,H=300, ml=58,mr=18,mt=30,mb=46, M0=1, M1=1e9;
  const need=(M,e,d)=>Math.log(2*M/d)/(2*e*e);
  const LX=Math.log10(M1);
  const X=m=>ml+(Math.log10(m)/LX)*(W-ml-mr);
  const ymax=Math.max(400, 1.15*need(M1, SC6_E, 0.001));   /* the axis depends on ε only: moving δ shifts the line instead of rescaling the axis */
  const Y=n=>mt+(1-n/ymax)*(H-mt-mb);   /* not clamped: the clip path cuts curves at the frame */
  const st=(()=>{ const raw=ymax/5, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; })();
  let g='';
  for(let n=0;n<=ymax;n+=st) g+='<line x1="'+ml+'" y1="'+Y(n).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(n).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(n)+4).toFixed(1)+'" text-anchor="end">'+n.toLocaleString('en')+'</text>';
  [1,1e3,1e6,1e9].forEach(m=>{ const lab = m===1?'1':(m===1e3?'10³':(m===1e6?'10⁶':'10⁹'));
    g+='<text class="tick" x="'+X(m).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+lab+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">|&#8459;|, the size of the hypothesis class  (log scale)</text>'
   + '<clipPath id="sc6clip"><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'"/></clipPath><g clip-path="url(#sc6clip)">';
  const path=(e,d)=>{ let s=''; for(let i=0;i<=200;i++){ const m=Math.pow(10, i/200*LX); s+=(s?' L':'M')+X(m).toFixed(1)+' '+Y(need(m,e,d)).toFixed(1); } return s; };
  [[0.05,'var(--ink-soft)'],[0.20,'var(--ink-soft)']].forEach(([e,c])=>{ g+='<path d="'+path(e,SC6_D)+'" fill="none" stroke="'+c+'" stroke-width="1.2" opacity=".55"/>'; });
  if(Math.abs(SC6_D-0.05)>1e-9) g+='<path d="'+path(SC6_E,0.05)+'" fill="none" stroke="var(--s2)" stroke-width="1.6" stroke-dasharray="6 4" opacity=".6"/>';
  g+='<path d="'+path(SC6_E,SC6_D)+'" fill="none" stroke="var(--s2)" stroke-width="3"/></g>';
  if(Math.abs(SC6_D-0.05)>1e-9) g+='<text class="tick" x="'+X(30).toFixed(1)+'" y="'+(Y(need(30,SC6_E,0.05))-7).toFixed(1)+'" fill="var(--s2)" stroke="var(--bg)" stroke-width="3" paint-order="stroke">&#948; = 0.05</text>';
  [[0.05,'ε = 0.05'],[0.20,'ε = 0.20']].forEach(([e,lab])=>{ const n=need(1e6,e,SC6_D); if(n<ymax*0.98)
    g+='<text class="tick" x="'+(X(1e6)+6).toFixed(1)+'" y="'+(Y(n)-6).toFixed(1)+'" fill="var(--ink-soft)">'+lab+'</text>'; });
  svg.innerHTML=g;
  const a=document.getElementById('sc6ev'); if(a) a.textContent=SC6_E.toFixed(2);
  const b=document.getElementById('sc6dv'); if(b) b.textContent=SC6_D.toFixed(3);
  const w=document.getElementById('sc6warn'); if(!w) return;
  const f=m=>Math.ceil(need(m,SC6_E,SC6_D)).toLocaleString('en');
  const step=Math.log(1000)/(2*SC6_E*SC6_E);
  const shift=Math.log(0.05/SC6_D)/(2*SC6_E*SC6_E);
  w.innerHTML='At &#949; = '+SC6_E.toFixed(2)+', &#948; = '+SC6_D.toFixed(3)+': <strong>1,000</strong> hypotheses need '+f(1e3)
   + ' points, <strong>a million</strong> need '+f(1e6)+', <strong>a billion</strong> need '+f(1e9)+'. '
   + 'Each time the class gets <strong>1,000 times bigger</strong>, you need about <strong>'+Math.round(step)+' more points</strong> &#8212; a fixed amount, not a multiple. '
   + (Math.abs(shift)<0.5 ? 'Changing &#948; moves the whole line up or down by the same amount at every |&#8459;|.'
      : '&#948; = '+SC6_D.toFixed(3)+' puts the line <strong>'+Math.abs(Math.round(shift)).toLocaleString('en')+' points '+(shift>0?'higher':'lower')+'</strong> than &#948; = 0.05 (dashed), at every |&#8459;|.')
   + ' Halving &#949; multiplies every number by four.';
}

/* ---- dichotomies: how many labellings can a line actually produce? --------------
   Achievability is decided by sweeping directions: project the points on a
   direction, and every cut of the sorted order is a linearly separable labelling
   (with its complement). 1440 directions is far more than enough for five points. */
const DIC6_SETS = {
  general: {3:[[0.24,0.32],[0.74,0.28],[0.50,0.74]],
            4:[[0.22,0.30],[0.76,0.26],[0.80,0.74],[0.26,0.72]],
            5:[[0.50,0.80],[0.83,0.56],[0.70,0.22],[0.30,0.22],[0.17,0.56]]},
  line:    {3:[[0.20,0.50],[0.50,0.50],[0.80,0.50]],
            4:[[0.16,0.50],[0.38,0.50],[0.62,0.50],[0.84,0.50]],
            5:[[0.14,0.50],[0.32,0.50],[0.50,0.50],[0.68,0.50],[0.86,0.50]]}};
let DIC6_N = 3, DIC6_CFG = 'general';
function dic6SetN(n){ DIC6_N = n; drawDic6(); }
function dic6SetCfg(c){ DIC6_CFG = c; drawDic6(); }
function dic6Reach(pts){
  const n = pts.length, out = new Set();
  for(let a=0;a<1440;a++){
    const th = a*Math.PI/720, ux = Math.cos(th), uy = Math.sin(th);
    const ord = pts.map((p,i)=>[p[0]*ux + p[1]*uy, i]).sort((A,B)=>A[0]-B[0]);
    for(let cut=0;cut<=n;cut++){
      /* only cut where the projections really differ: a line cannot split tied points */
      if(cut>0 && cut<n && ord[cut][0] - ord[cut-1][0] < 1e-9) continue;
      let m = 0; for(let k=cut;k<n;k++) m |= (1 << ord[k][1]);
      out.add(m); out.add(((1<<n)-1) ^ m);
    }
  }
  return out;
}
function drawDic6(){
  const svg = document.getElementById('dic6'); if(!svg) return;
  const W=960, H=300, n=DIC6_N, pts=DIC6_SETS[DIC6_CFG][n], reach=dic6Reach(pts), total=1<<n;
  const P=(p,x0,y0,s)=>[x0+p[0]*s, y0+(1-p[1])*s];
  let g='';
  /* the point set, large */
  const bx=26, by=44, bs=200;
  g+='<rect x="'+bx+'" y="'+by+'" width="'+bs+'" height="'+bs+'" fill="var(--bg-alt)" stroke="var(--rule)"/>';
  pts.forEach((p,i)=>{ const [X,Y]=P(p,bx,by,bs); g+='<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="7" fill="var(--ink)"/>'
    + '<text class="tick" x="'+(X+11).toFixed(1)+'" y="'+(Y+5).toFixed(1)+'" font-size="12">'+(i+1)+'</text>'; });
  g+='<text class="legend" x="'+bx+'" y="'+(by-10)+'">'+n+' points'+(DIC6_CFG==='line'?', on a line':', in general position')+'</text>';
  /* every labelling, marked achievable or not */
  const cols=8, ix0=290, iy0=44, iw=80, ih=(n>4?58:66), ps=(n>4?30:34);
  for(let m=0;m<total;m++){
    const cx = ix0 + (m%cols)*iw, cy = iy0 + Math.floor(m/cols)*ih, ok = reach.has(m);
    g+='<rect x="'+cx+'" y="'+cy+'" width="'+(iw-9)+'" height="'+(ih-9)+'" fill="'+(ok?'var(--bg-alt)':'none')+'" stroke="'+(ok?'var(--rule)':'var(--s2)')+'"'+(ok?'':' stroke-dasharray="3 3" opacity=".55"')+'/>';
    pts.forEach((p,i)=>{ const [X,Y]=P(p, cx+8, cy+6, ps), on=(m>>i)&1;
      g+='<circle cx="'+X.toFixed(1)+'" cy="'+Y.toFixed(1)+'" r="3.4" fill="'+(on?'var(--s2)':'var(--s1)')+'" opacity="'+(ok?0.95:0.3)+'"/>'; });
    if(!ok) g+='<line x1="'+(cx+4)+'" y1="'+(cy+4)+'" x2="'+(cx+iw-13)+'" y2="'+(cy+ih-13)+'" stroke="var(--s2)" stroke-width="1.6" opacity=".6"/>';
  }
  g+='<text class="legend" x="'+ix0+'" y="'+(iy0-10)+'">every one of the '+total+' labellings &#183; crossed out: no line can produce it</text>';
  svg.innerHTML=g;
  [3,4,5].forEach(k=>{ const b=document.getElementById('dic6n'+k); if(b) b.classList.toggle('sel', k===n); });
  ['general','line'].forEach(c=>{ const b=document.getElementById('dic6'+c); if(b) b.classList.toggle('sel', c===DIC6_CFG); });
  const w=document.getElementById('dic6warn'); if(!w) return;
  const k=reach.size, formula = n*n - n + 2;
  w.innerHTML='A line produces <strong>'+k+'</strong> of the '+total+' labellings'
   + (DIC6_CFG==='general' ? ' &#8212; the most any '+n+' points allow, and the formula gives '+formula+'.' : ', fewer than the '+formula+' that '+n+' points in general position allow. The growth function takes the maximum over configurations, so this one does not lower it.')
   + (n===3 && DIC6_CFG==='general' ? ' Three points in general position are <strong>shattered</strong>: every labelling is available.' : '')
   + (n===4 ? ' Four points are never shattered by a line: the two &#8220;diagonal&#8221; labellings are impossible. That is the <strong>break point</strong>.' : '');
}

/* ---- the growth function against 2^N -------------------------------------------
   Three classes with their exact growth functions, on a log axis, against the 2^N
   a shattering class would need. Polynomial versus exponential, seen. */
let GROW6_K = 'perc';
function grow6Set(k){ GROW6_K = k; drawGrow6(); }
const GROW6 = {
  ray:  {t:'positive rays', f:N=>N+1, d:1},
  intv: {t:'intervals', f:N=>N*(N+1)/2 + 1, d:2},
  perc: {t:'linear classifiers', f:N=>N*N - N + 2, d:3}};
function drawGrow6(){
  const svg = document.getElementById('grow6'); if(!svg) return;
  const W=560,H=250, ml=58,mr=18,mt=22,mb=44, NMAX=20, YHI=Math.log10(Math.pow(2,NMAX));
  const X=N=>ml+(N/NMAX)*(W-ml-mr), Y=v=>mt+(1-Math.log10(Math.max(v,1))/YHI)*(H-mt-mb);
  let g='';
  [1,10,100,1e3,1e4,1e5,1e6].forEach(v=>{ if(Math.log10(v)>YHI) return;
    g+='<line x1="'+ml+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+(v>=1000?('10'+String(Math.round(Math.log10(v))).replace(/[0-9]/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d])):v)+'</text>'; });
  [0,5,10,15,20].forEach(N=>{ g+='<text class="tick" x="'+X(N).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+N+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">number of points, N</text>';
  const path=f=>{ let s=''; for(let N=1;N<=NMAX;N++) s+=(s?' L':'M')+X(N).toFixed(1)+' '+Y(f(N)).toFixed(1); return s; };
  g+='<path d="'+path(N=>Math.pow(2,N))+'" fill="none" stroke="var(--s2)" stroke-width="2.6" stroke-dasharray="7 4"/>';
  Object.keys(GROW6).forEach(k=>{ const G=GROW6[k];
    g+='<path d="'+path(G.f)+'" fill="none" stroke="'+(k===GROW6_K?'var(--s1)':'var(--ink-soft)')+'" stroke-width="'+(k===GROW6_K?3:1.4)+'" opacity="'+(k===GROW6_K?1:0.5)+'"/>'; });
  const G=GROW6[GROW6_K];
  g+='<text class="tick" x="'+(X(NMAX)-6)+'" y="'+(Y(G.f(NMAX))-8)+'" text-anchor="end" fill="var(--s1)">'+G.t+'</text>';
  svg.innerHTML=g;
  Object.keys(GROW6).forEach(k=>{ const b=document.getElementById('grow6'+k); if(b) b.classList.toggle('sel', k===GROW6_K); });
}

/* ---- the VC bound, and how much data it asks for --------------------------------
   Omega(N) = sqrt( (8/N) ln(4 m(2N)/delta) ) with m(2N) <= (2N)^d + 1. */
let VC6_D = 3, VC6_DELTA = 0.05;
function vc6SetD(d){ VC6_D = d; drawVc6(); }
function vc6SetDelta(x){ VC6_DELTA = x; drawVc6(); }
function drawVc6(){
  const svg = document.getElementById('vc6'); if(!svg) return;
  const W=560,H=300, ml=54,mr=18,mt=30,mb=46, N0=10, N1=1e6, LX=Math.log10(N1)-1;
  const om=(N,d)=>Math.sqrt((8/N)*Math.log(4*(Math.pow(2*N,d)+1)/VC6_DELTA));
  const X=N=>ml+(Math.log10(N)-1)/LX*(W-ml-mr), Y=v=>mt+(1-v/2)*(H-mt-mb);   /* not clamped: the clip path cuts curves at the frame */
  let g='';
  [0,0.5,1,1.5,2].forEach(v=>{ g+='<line x1="'+ml+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; });
  [10,100,1e3,1e4,1e5,1e6].forEach(N=>{ const lab=N>=1000?('10'+String(Math.round(Math.log10(N))).replace(/[0-9]/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[+d])):N;
    g+='<text class="tick" x="'+X(N).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+lab+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">training set size N  (log scale)</text>'
   + '<rect x="'+ml+'" y="'+Y(2)+'" width="'+(W-ml-mr)+'" height="'+(Y(1)-Y(2))+'" fill="var(--s2)" opacity=".07"/>'
   + '<text class="tick" x="'+(W-mr-6)+'" y="'+(Y(1)-6)+'" text-anchor="end" fill="var(--s2)">above 1: says nothing</text>';
  const path=d=>{ let s=''; for(let i=0;i<=220;i++){ const N=Math.pow(10,1+i/220*LX); s+=(s?' L':'M')+X(N).toFixed(1)+' '+Y(om(N,d)).toFixed(1); } return s; };
  g+='<clipPath id="vc6clip"><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'"/></clipPath><g clip-path="url(#vc6clip)">';
  [1,3,10].forEach(d=>{ if(d===VC6_D) return; g+='<path d="'+path(d)+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.3" opacity=".5"/>'; });
  g+='<path d="'+path(VC6_D)+'" fill="none" stroke="var(--s1)" stroke-width="3"/>';
  /* where the bound first drops below 0.1 */
  let hit=null; for(let i=0;i<=220;i++){ const N=Math.pow(10,1+i/220*LX); if(om(N,VC6_D)<=0.1){ hit=N; break; } }
  if(hit) g+='<line x1="'+X(hit).toFixed(1)+'" y1="'+Y(0.1).toFixed(1)+'" x2="'+X(hit).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s4)" stroke-dasharray="3 3"/>'
    + '<circle cx="'+X(hit).toFixed(1)+'" cy="'+Y(0.1).toFixed(1)+'" r="4.5" fill="var(--s4)" stroke="var(--bg)" stroke-width="1.5"/>';
  g+='</g>';
  if(hit){ const right=X(hit)>ml+0.6*(W-ml-mr);   /* near the right edge: put the label on the left of the marker */
    g+='<text class="tick" x="'+(right?X(hit)-8:X(hit)+8).toFixed(1)+'" y="'+(Y(0.35)).toFixed(1)+'" text-anchor="'+(right?'end':'start')+'" fill="var(--s4)">&#937; &#8804; 0.1 at N &#8776; '+Math.round(hit).toLocaleString('en')+'</text>'; }
  g+=legendRow(ml, 20, [{t:'this d',c:'var(--s1)',w:3},{t:'d = 1, 3, 10',c:'var(--ink-soft)'}]);
  svg.innerHTML=g;
  const a=document.getElementById('vc6dv'); if(a) a.textContent=VC6_D;
  const b=document.getElementById('vc6xv'); if(b) b.textContent=VC6_DELTA.toFixed(2);
  const w=document.getElementById('vc6warn'); if(!w) return;
  w.innerHTML='VC dimension <strong>'+VC6_D+'</strong>, &#948; = '+VC6_DELTA.toFixed(2)+': the penalty is '
   + om(100,VC6_D).toFixed(2)+' at N = 100, '+om(1000,VC6_D).toFixed(2)+' at 1,000, '+om(1e5,VC6_D).toFixed(2)+' at 100,000. '
   + (hit ? 'It reaches 0.1 at about <strong>N = '+Math.round(hit).toLocaleString('en')+'</strong>. ' : 'It never reaches 0.1 on this axis. ')
   + 'The rule of thumb from the same chapter asks for far less: <strong>N &#8776; 10 d</strong> = '+(10*VC6_D)+' points.';
}

/* ---- restriction bias against soft inductive bias -------------------------------
   After Wilson (ICML 2025), Figure 4. Three panels, same picture of a hypothesis
   space each time: the ring marks hypotheses that generalise well, the hatched
   wedge those that fit the data and generalise badly, and the dots are where a
   learner's preference puts its mass. */
let SIB6_ST = 0;
function sib6Stage(s){ SIB6_ST = s; drawSib6(); }
function drawSib6(){
  const svg = document.getElementById('sib6'); if(!svg) return;
  const W=960, H=300, pw=300, y0=54, cy=y0+108, rx=126, ry=100;
  const panels=[
    {t:'Flexible, no preference', s:'every hypothesis equally likely', kind:'uniform'},
    {t:'Flexible, soft preference', s:'all of them allowed, simple ones preferred', kind:'soft'},
    {t:'Restricted', s:'most hypotheses ruled out entirely', kind:'hard'}];
  let g='';
  panels.forEach((p,k)=>{
    if(k > SIB6_ST) return;
    const cx = 160 + k*pw;
    /* the whole space, and inside it the hypotheses that generalise well */
    if(p.kind==='hard'){
      g+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="var(--rule)" stroke-dasharray="4 4"/>'
       + '<ellipse cx="'+(cx-30)+'" cy="'+(cy+14)+'" rx="52" ry="44" fill="var(--s1)" opacity=".30" stroke="var(--s1)"/>';
    } else {
      g+='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="var(--s1)" opacity="'+(p.kind==='uniform'?0.16:0.10)+'" stroke="var(--s1)"/>';
      if(p.kind==='soft') [0.78,0.56,0.34].forEach((f,i)=>{ g+='<ellipse cx="'+(cx-14)+'" cy="'+(cy+8)+'" rx="'+(rx*f).toFixed(0)+'" ry="'+(ry*f).toFixed(0)+'" fill="var(--s1)" opacity=".13" stroke="none"/>'; });
    }
    /* the good-generalisation region, and the overfitting wedge */
    g+='<ellipse cx="'+(cx-16)+'" cy="'+(cy+6)+'" rx="58" ry="46" fill="none" stroke="var(--s4)" stroke-width="2.4"/>'
     + '<path d="M'+(cx+62)+' '+(cy-64)+'a70 58 0 0 1 34 92l-30-24Z" fill="var(--s2)" opacity=".16" stroke="var(--s2)" stroke-dasharray="3 3"/>'
     + '<text class="tick" x="'+(cx+86)+'" y="'+(cy-14)+'" text-anchor="middle" fill="var(--s2)" font-size="12">overfits</text>';
    /* where the learner's mass actually sits */
    const r=lcg5(4242+k*97);
    for(let i=0;i<26;i++){
      let dx, dy;
      if(p.kind==='uniform'){ do{ dx=(r()*2-1); dy=(r()*2-1); }while(dx*dx+dy*dy>1); dx*=rx*0.92; dy*=ry*0.92; }
      else if(p.kind==='soft'){ dx=gauss5(r)*rx*0.30 - 14; dy=gauss5(r)*ry*0.28 + 8;
        if(dx*dx/(rx*rx)+dy*dy/(ry*ry)>1){ dx*=0.5; dy*=0.5; } }
      else { do{ dx=(r()*2-1); dy=(r()*2-1); }while(dx*dx+dy*dy>1); dx=dx*52-30; dy=dy*44+14; }
      g+='<circle cx="'+(cx+dx).toFixed(1)+'" cy="'+(cy+dy).toFixed(1)+'" r="2.8" fill="var(--ink)" opacity=".62"/>';
    }
    /* the label goes on top of the dots, with a halo, so the dots cannot hide it */
    g+='<text class="tick" x="'+(cx-16)+'" y="'+(cy+10)+'" text-anchor="middle" fill="var(--s4)" font-weight="700" stroke="var(--bg)" stroke-width="4" paint-order="stroke" stroke-linejoin="round">generalises</text>';
    g+='<text class="legend" x="'+cx+'" y="'+(y0-22)+'" text-anchor="middle" font-weight="700">'+p.t+'</text>'
     + '<text class="tick" x="'+cx+'" y="'+(y0-6)+'" text-anchor="middle">'+p.s+'</text>';
  });
  svg.innerHTML=g;
  [0,1,2].forEach(k=>{ const b=document.getElementById('sib6s'+k); if(b) b.classList.toggle('sel', k===SIB6_ST); });
  const w=document.getElementById('sib6warn'); if(!w) return;
  w.innerHTML=[
    'A flexible class with no preference spreads its mass everywhere, including over the hypotheses that fit the data and generalise badly. The worst case the VC bound allows for is a fair description of this panel.',
    'Keep the same flexible class, but prefer some solutions over others: a prior, a penalty, an architecture. Nothing is ruled out, so the truth is still in the class; most of the mass sits on simple solutions, so among the fits to the data a simple one is chosen. This is a <strong>soft inductive bias</strong>.',
    'A restriction bias: shrink the class until the bad solutions are gone. This works when the smaller class still contains the hypotheses that generalise; here part of the green ring has been ruled out with them.'][SIB6_ST];
}

/* ---- towards PAC-Bayes: the failure budget delta, split evenly or by a prior ------------
   Twelve hypotheses in three groups (3 linear, 4 quadratic, 5 cubic). Bar a: the union bound's
   equal shares delta/|H|. Bar b: the shares delta*P(h) under a prior that prefers the simpler
   groups (0.20, 0.06 and 0.032 each; they add to one). Hoeffding on a share gives the hypothesis
   its own tolerance, which is the slide's derivation. */
const PB6_GROUPS=[{t:'linear',n:3,p:0.20,c:'var(--s1)'},{t:'quadratic',n:4,p:0.06,c:'var(--s4)'},{t:'cubic',n:5,p:0.032,c:'var(--s3)'}];
function drawPb6(){
  const x0=70, x1=880, yT=32, yB=68, M=PB6_GROUPS.reduce((a,G)=>a+G.n,0);
  const bar=(id,title,shares,labFn)=>{
    const svg=document.getElementById(id); if(!svg) return;
    let g='<text class="legend" x="'+x0+'" y="17" fill="var(--ink)">'+title+'</text>', x=x0, k=0;
    PB6_GROUPS.forEach(G=>{ for(let i=0;i<G.n;i++,k++){ const w=(x1-x0)*shares[k];
      g+='<rect x="'+x.toFixed(1)+'" y="'+yT+'" width="'+w.toFixed(1)+'" height="'+(yB-yT)+'" fill="'+G.c+'" opacity=".5" stroke="var(--bg)" stroke-width="2"/>';
      const s=labFn(k,shares[k],w);

/* ---- shared: a line n.x = c clipped to a box, and a max-margin separating line ---- */
function lineInBox6(nx,ny,c,x0,y0,x1,y1){
  const P=[];
  if(Math.abs(ny)>1e-9) [x0,x1].forEach(x=>{ const y=(c-nx*x)/ny; if(y>=y0-1e-6&&y<=y1+1e-6) P.push([x,y]); });
  if(Math.abs(nx)>1e-9) [y0,y1].forEach(y=>{ const x=(c-ny*y)/nx; if(x>=x0-1e-6&&x<=x1+1e-6) P.push([x,y]); });
  if(P.length<2) return null;
  let best=[P[0],P[1]], d=-1;
  for(let i=0;i<P.length;i++) for(let k=i+1;k<P.length;k++){ const dd=Math.hypot(P[i][0]-P[k][0],P[i][1]-P[k][1]); if(dd>d){ d=dd; best=[P[i],P[k]]; } }
  return best;
}
function sepLine6(P, m, off){
  let best=null;
  for(let a=0;a<720;a++){ const th=a*Math.PI/360, nx=Math.cos(th), ny=Math.sin(th);
    const pr=P.map(p=>p[0]*nx+p[1]*ny);
    const ones=pr.filter((v,i)=>(m>>i)&1), zeros=pr.filter((v,i)=>!((m>>i)&1));
    let lo, hi;
    if(!ones.length){ lo=Math.max(...zeros); hi=lo+2*off; }
    else if(!zeros.length){ hi=Math.min(...ones); lo=hi-2*off; }
    else { lo=Math.max(...zeros); hi=Math.min(...ones); }
    if(hi-lo>0 && (!best || hi-lo>best.margin+1e-9)) best={nx,ny,c:(lo+hi)/2,margin:hi-lo};
  }
  return best;
}

/* ---- uniform convergence, drawn: eight hypotheses, eight bands, one dataset -------- */
let UNIF6_S=1, UNIF6_N=50, UNIF6_STAT=null;
const UNIF6_LP=[0.34,0.10,0.46,0.22,0.52,0.16,0.40,0.28], UNIF6_EPS=0.10;   /* not in order: the order is not the point */
function unif6New(){ UNIF6_S++; UNIF6_STAT=null; drawUnif6(); }
function unif6SetN(n){ UNIF6_N=n; UNIF6_STAT=null; drawUnif6(); }
function unif6LD(s,N){ const r=lcg5(5150+s*977+N*3); return UNIF6_LP.map(p=>{ let e=0; for(let n=0;n<N;n++) if(r()<p) e++; return e/N; }); }
function unif6Unlucky(){
  for(let s=UNIF6_S+1; s<UNIF6_S+5001; s++){ const LD=unif6LD(s,UNIF6_N); if(LD.some((v,k)=>Math.abs(v-UNIF6_LP[k])>UNIF6_EPS)){ UNIF6_S=s; UNIF6_STAT=null; drawUnif6(); return; } }
  drawUnif6();
}
function unif6Many(){
  const r=lcg5(31337+UNIF6_S*13), R=1000, each=new Array(UNIF6_LP.length).fill(0); let any=0;
  for(let t=0;t<R;t++){ let bad=false;
    UNIF6_LP.forEach((p,k)=>{ let e=0; for(let n=0;n<UNIF6_N;n++) if(r()<p) e++; if(Math.abs(e/UNIF6_N-p)>UNIF6_EPS){ each[k]++; bad=true; } });
    if(bad) any++; }
  UNIF6_STAT={R:R, each:each.map(v=>v/R), any:any/R}; drawUnif6();
}
function drawUnif6(){
  const svg=document.getElementById('unif6'); if(!svg) return;
  const W=560,H=300, ml=50,mr=14,mt=34,mb=42, M=UNIF6_LP.length, N=UNIF6_N;
  const LD=unif6LD(UNIF6_S,N);

  let g='';
  [0,0.25,0.5,0.75,1].forEach(v=>{ g+='<line x1="'+ml+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+v.toFixed(2)+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>';
  let nout=0;
  UNIF6_LP.forEach((p,k)=>{ const x=X(k), out=Math.abs(LD[k]-p)>UNIF6_EPS; if(out) nout++;
    g+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+Y(p+UNIF6_EPS).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(Y(p-UNIF6_EPS)-Y(p+UNIF6_EPS)).toFixed(1)+'" fill="var(--s4)" opacity=".17"/>'
     + '<line x1="'+(x-bw/2).toFixed(1)+'" y1="'+Y(p).toFixed(1)+'" x2="'+(x+bw/2).toFixed(1)+'" y2="'+Y(p).toFixed(1)+'" stroke="var(--s4)" stroke-width="2.4"/>'
     + '<circle cx="'+x.toFixed(1)+'" cy="'+Y(LD[k]).toFixed(1)+'" r="6.5" fill="'+(out?'var(--s2)':'var(--s1)')+'" stroke="var(--bg)" stroke-width="1.6"/>'
     + '<text class="tick" x="'+x.toFixed(1)+'" y="'+(H-mb+17)+'" text-anchor="middle">h<tspan font-size="10" dy="3">'+(k+1)+'</tspan></text>'; });
  const sub6=(b,s,r)=>b+'<tspan font-size="10" dy="3">'+s+'</tspan><tspan dy="-3">'+r+'</tspan>';
  g+=legendRow(ml, 18, [{t:sub6('L','p','(h), fixed'),c:'var(--s4)',w:2.4},{t:'band: within ε',c:'var(--s4)',w:8},{t:sub6('L','D','(h), this dataset'),c:'var(--s1)',w:7}]);
  svg.innerHTML=g;

/* ---- the goal: the gap over datasets, and the bad event as its tails ---------------
   One fixed hypothesis with generalisation error 0.30, scored on N points. The dataset
   loss is a binomial mean, so the gap L_D - L_p takes the values k/N - 0.30 with exact
   binomial probabilities: a histogram over every possible dataset. The bars beyond
   +-eps are the bad event, and their total is what delta has to cover. */
let GOAL6_E=0.10, GOAL6_N=50; const GOAL6_P=0.30;
function goal6SetE(e){ GOAL6_E=e; drawGoal6(); }
function goal6SetN(n){ GOAL6_N=n; drawGoal6(); }
function binomPmf6(N,p){ const lg=[0]; for(let k=1;k<=N;k++) lg.push(lg[k-1]+Math.log(k));
  const out=[]; for(let k=0;k<=N;k++) out.push(Math.exp(lg[N]-lg[k]-lg[N-k]+k*Math.log(p)+(N-k)*Math.log(1-p))); return out; }
function drawGoal6(id){
  const fid=(typeof id==='string')?id:'goal6', svg=document.getElementById(fid); if(!svg) return;
  const W=560,H=300, ml=50,mr=16,mt=40,mb=48, N=GOAL6_N, p=GOAL6_P, lo=-0.32, hi=0.32;
  const pmf=binomPmf6(N,p), pk=Math.max(...pmf);
  const X=v=>ml+((v-lo)/(hi-lo))*(W-ml-mr), Y=d=>mt+(1-d/(pk*1.1))*(H-mt-mb);
  const bw=Math.max(1.5,(1/N)/(hi-lo)*(W-ml-mr)-1);
  let g='', tail=0;
  pmf.forEach((q,k)=>{ const v=k/N-p, bad=Math.abs(v)>GOAL6_E+1e-12; if(bad) tail+=q; if(v<lo||v>hi) return;
    g+='<rect x="'+(X(v)-bw/2).toFixed(1)+'" y="'+Y(q).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(H-mb-Y(q)).toFixed(1)+'" fill="'+(bad?'var(--s2)':'var(--s4)')+'" opacity="'+(bad?0.85:0.55)+'"/>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>';
  [-0.3,-0.2,-0.1,0,0.1,0.2,0.3].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+17)+'" text-anchor="middle">'+(v>0?'+':'')+v.toFixed(1)+'</text>'; });
  g+='<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-8)+'" text-anchor="middle">the gap, training error &#8722; generalisation error, one dataset each</text>';
  [-GOAL6_E, GOAL6_E].forEach((v,i)=>{ g+='<line x1="'+X(v).toFixed(1)+'" y1="'+(mt+14)+'" x2="'+X(v).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s2)" stroke-width="1.4"/>'
    + '<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(mt+10)+'" text-anchor="middle" fill="var(--s2)">'+(i?'+':'&#8722;')+'&#949;</text>'; });
  g+='<line x1="'+X(0).toFixed(1)+'" y1="'+mt+'" x2="'+X(0).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--ink)" stroke-dasharray="5 4" opacity=".6"/>';
  g+=legendRow(ml, 18, [{t:'gap within &#949;',c:'var(--s4)',w:6},{t:'bad event: gap beyond &#949;',c:'var(--s2)',w:6}]);
  svg.innerHTML=g;
  const a=document.getElementById('goal6ev'); if(a) a.textContent=GOAL6_E.toFixed(2);
  const b=document.getElementById('goal6nv'); if(b) b.textContent=N;
  const w=document.getElementById('goal6warn'); if(!w) return;
  w.innerHTML='One hypothesis with generalisation error 0.30, scored on <strong>N = '+N+'</strong> points, over every possible dataset. '
   + 'The gap is beyond &#949; = '+GOAL6_E.toFixed(2)+' on <strong>'+(100*tail).toFixed(1)+'%</strong> of datasets. No N makes that zero; what we can ask is that it stays below a number we choose, &#948;.';
}

/* ---- the bound, as a schematic: loss against the size of the class ----------------
   Binary classification, nothing measured. As the class grows the training error of the
   pick falls and the penalty rises; the bound is the training error lifted by the penalty,
   and the generalisation error sits between the two. 'bnd6' reveals the penalty on a
   button and calls it a sketch; 'bnd6f' and 'bnd6r' always show it, with its formula. */
let BND6_ST=0;
function bnd6Toggle(){ BND6_ST=1-BND6_ST; drawBnd6(); }
function drawBnd6(id){
  const fid=(typeof id==='string')?id:'bnd6', svg=document.getElementById(fid); if(!svg) return;
  const formula=(fid!=='bnd6'), ST=formula?1:BND6_ST;
  const W=560,H=330, ml=50,mr=18,mt=40,mb=44, ymax=0.78;
  const tr=x=>0.04+0.56*Math.exp(-4*x), pen=x=>0.06+0.52*Math.pow(x,0.75), gen=x=>tr(x)+0.6*(pen(x)-0.06)+0.02, bd=x=>tr(x)+pen(x);
  const X=x=>ml+x*(W-ml-mr), Y=v=>mt+(1-Math.min(v,ymax)/ymax)*(H-mt-mb);
  const pts=f=>{ const o=[]; for(let i=0;i<=100;i++){ const x=i/100; o.push(X(x).toFixed(1)+' '+Y(f(x)).toFixed(1)); } return o; };
  const path=f=>'M'+pts(f).join(' L');
  let g='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-mb+22)+'" text-anchor="middle">size of the hypothesis class, |&#8459;| (log scale) &#8594;</text>'
   + '<text class="legend" transform="translate(16,'+((mt+H-mb)/2)+') rotate(-90)" text-anchor="middle">loss</text>'
   + '<text class="tick" x="'+(ml-8)+'" y="'+(H-mb+4)+'" text-anchor="end">0</text>';
  if(ST){
    g+='<path d="M'+pts(tr).join(' L')+' L'+pts(bd).reverse().join(' L')+' Z" fill="var(--accent)" opacity=".13"/>'
     + '<path d="'+path(bd)+'" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-dasharray="7 4"/>';
    const xo=0.72;
    g+='<line x1="'+X(xo).toFixed(1)+'" y1="'+Y(tr(xo)).toFixed(1)+'" x2="'+X(xo).toFixed(1)+'" y2="'+Y(bd(xo)).toFixed(1)+'" stroke="var(--accent)" stroke-width="2"/>'
     + '<text class="legend" x="'+(X(xo)+8).toFixed(1)+'" y="'+((Y(tr(xo))+Y(bd(xo)))/2+5).toFixed(1)+'" fill="var(--accent)" font-weight="700">penalty</text>'
     + '<text class="legend" x="'+X(0.02).toFixed(1)+'" y="'+(Y(bd(0.02))-10).toFixed(1)+'" fill="var(--ink)" font-weight="700">training error + penalty: the bound</text>'
     + (formula ? '<text class="legend" x="'+(W-mr-4)+'" y="'+Y(0.72).toFixed(1)+'" text-anchor="end" fill="var(--accent)" font-weight="700">penalty = &#8730;(ln(2|&#8459;|/&#948;) / 2N)</text>' : '');
  }
  g+='<path d="'+path(tr)+'" fill="none" stroke="var(--s1)" stroke-width="2.8"/><path d="'+path(gen)+'" fill="none" stroke="var(--s2)" stroke-width="3"/>';
  g+=legendRow(ml+6, 22, ST ? [{t:'training error',c:'var(--s1)'},{t:'generalisation error',c:'var(--s2)'},{t:'training error + penalty',c:'var(--ink)',d:1}]
                          : [{t:'training error',c:'var(--s1)'},{t:'generalisation error',c:'var(--s2)'}]);
  svg.innerHTML=g;
  const b=document.getElementById('bnd6b'); if(b&&fid==='bnd6'){ b.textContent=BND6_ST?'hide the penalty':'add the penalty'; b.classList.toggle('sel',!!BND6_ST); }
}
function drawBnd6f(){ drawBnd6('bnd6f'); }
function drawBnd6r(){ drawBnd6('bnd6r'); }
function drawRev6(){ drawGoal6('goal6r'); drawBnd6('bnd6r'); }   /* the Lecture 6 review slide shows both */
