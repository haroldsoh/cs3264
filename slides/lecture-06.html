<style>
/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank
   ============================================================ */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide transition: opacity only, short, and NO transform.
   A transform (especially a scale) promotes the slide to a composited layer and
   re-rasterises the text, which makes heavy glyphs read as arriving before light
   ones. Nothing that carries text is allowed to animate transform or scale. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s linear,visibility .14s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.leaving{opacity:0}

/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
li.qz::before{display:none}li.qz{padding-left:6px}
