/* ---------------------------------------------------------------- DEMO 2 — run the story
   Press the button: the coin decides the class, then the class's fitted Gaussian
   produces a listing. A dataset is what this loop leaves behind. */
let S4_PTS=[], S4_SEED=90210, S4_ELL=false, S4_LAST='', S4_PEND=null;
/* the two steps of one draw, split so each can be pressed on its own */
function s4Flip(){
  const r=lcg(S4_SEED); S4_SEED=(S4_SEED*1103515245+12345)>>>0;
  const B=nbFit();
  S4_PEND = r()<B.pi ? 1 : 0;
  S4_LAST='step 1 &#8212; the coin came up <strong>'+(S4_PEND?'1: sells':'0: still on the lot')
    + '</strong>. Its features are not decided yet; step 2 draws them from that class&#8217;s own distribution.';
  drawSamp4();
}
function s4Feat(){
  if(S4_PEND===null){
    S4_LAST='Step 1 first: flip the class. The class decides which distribution the features come from.';
    drawSamp4(); return;
  }
  const r=lcg(S4_SEED); S4_SEED=(S4_SEED*1103515245+12345)>>>0;
  const B=nbFit(), t=S4_PEND, c=t?B.c1:B.c0;
  const x=[c.m[0]+Math.sqrt(c.v[0])*gaussOf(r), c.m[1]+Math.sqrt(c.v[1])*gaussOf(r)];
  S4_PTS.push([x,t]); S4_PEND=null;
  S4_LAST='step 2 &#8212; drew (age '+x[0].toFixed(1)+', '
    + (x[1]*10000).toLocaleString('en-US',{maximumFractionDigits:0})+' km) from the '
    + (t?'sells':'lot')+' cloud. One labelled row, done.';
  drawSamp4();
}
function s4Draw(n){
  const r=lcg(S4_SEED); S4_SEED=(S4_SEED*1103515245+12345)>>>0;
  const B=nbFit();
  for(let i=0;i<n;i++){
    const t=r()<B.pi?1:0, c=t?B.c1:B.c0;
    const x=[c.m[0]+Math.sqrt(c.v[0])*gaussOf(r), c.m[1]+Math.sqrt(c.v[1])*gaussOf(r)];
    S4_PTS.push([x,t]);
  }
  S4_PEND=null;
  S4_LAST='thirty draws, both steps each &#8212; the loop run at full speed.';
  drawSamp4();
}
function s4Reset(){ S4_PTS=[]; S4_LAST=''; S4_PEND=null; drawSamp4(); }
function drawSamp4(){
  const svg=document.getElementById('s4svg'); if(!svg) return;
  const W=560,H=330, A=ax4(W,H,0,13,0,16,4,4,46);
  const B=nbFit();
  let g=clipDef4(A,W,H,'cps4')+A.s+axlab4(A,W,H,'age (years)','mileage (10,000 km)');
  if(S4_ELL){
    g+=ellipse4(A,B.c1.m,[[B.c1.v[0],0],[0,B.c1.v[1]]],'var(--s1)',false);
    g+=ellipse4(A,B.c0.m,[[B.c0.v[0],0],[0,B.c0.v[1]]],'var(--s2)',false);
  }
  S4_PTS.forEach(([p,t])=>{
    g+= t ? '<circle cx="'+A.X(p[0])+'" cy="'+A.Y(p[1])+'" r="4.1" fill="var(--s1)" opacity=".88"/>'
          : '<path d="M'+(A.X(p[0])-3.7)+' '+(A.Y(p[1])-3.7)+'l7.4 7.4M'+(A.X(p[0])+3.7)+' '+(A.Y(p[1])-3.7)+'l-7.4 7.4" stroke="var(--s2)" stroke-width="1.9" stroke-linecap="round"/>';
  });
  /* a class has been flipped but its features not yet drawn: mark the waiting cloud */
  if(S4_PEND!==null){
    const B2=nbFit(), c=S4_PEND?B2.c1:B2.c0, col=S4_PEND?'var(--s1)':'var(--s2)';
    g+='<circle cx="'+A.X(c.m[0])+'" cy="'+A.Y(c.m[1])+'" r="13" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-dasharray="5 4"/>'
     + '<text class="tick" x="'+A.X(c.m[0])+'" y="'+(A.Y(c.m[1])-20)+'" text-anchor="middle" fill="'+col
     + '" paint-order="stroke" stroke="var(--bg)" stroke-width="3.5">class flipped &#8212; features pending</text>';
  }
  svg.innerHTML=g;
  const nv=document.getElementById('s4n'); if(nv) nv.textContent=S4_PTS.length;
  const eb=document.getElementById('s4e'); if(eb) eb.classList.toggle('sel',S4_ELL);
  const wn=document.getElementById('s4warn');
  if(wn) wn.innerHTML = (S4_PTS.length===0 && !S4_LAST)
    ? 'Two presses per listing: <em>1</em> flips the class coin, <em>2</em> draws the features from '
      + 'the flipped class&#8217;s own distribution. (The two distributions are the ones fitted to '
      + 'our sixty listings.)'
    : (S4_LAST + (S4_PTS.length>=25
        ? '<br>Two clouds are forming &#8212; one per class. A dataset is what this loop leaves behind.'
        : ''));
}

/* ---------------------------------------------------------------- DEMO 3 — the joint is too big
   Parameter counts as the number of features grows. Everything printed is the
   formula evaluated, nothing typed in. */
let P4_E=4;
function drawParams4(){
  const svg=document.getElementById('p4svg'); if(!svg) return;
  const M=Math.pow(2,P4_E);
  const full=M+M*(M+1)/2, naive=2*M;
  /* 2^M - 1 in log10, so M = 8192 prints a number instead of Infinity */
  const lgBin=M*Math.log10(2);
  const fmt=v=> v>=1e12 ? v.toExponential(1) : v>=1e6 ? (v/1e6).toFixed(1)+'&#8201;M' : v>=1e3 ? (v/1e3).toFixed(1)+'&#8201;k' : ''+Math.round(v);
  const fmtBin=()=> lgBin<12 ? fmt(Math.pow(2,M)-1)
    : '&#8776;&#8201;10<tspan dy="-6" style="font-size:11px">'+Math.round(lgBin)+'</tspan><tspan dy="6"></tspan>';
  const W=560,H=200;
  let g='<text class="legend" x="16" y="20">per class, with M = '+M+' features</text>';
  const row=(y,lab,val,col,frac)=>{
    g+='<text class="legend" x="16" y="'+(y+16)+'">'+lab+'</text>'
     + '<rect x="230" y="'+y+'" width="'+Math.max(3,244*frac)+'" height="22" rx="3" fill="'+col+'" opacity=".8"/>'
     + '<text class="matn" style="font-size:15px" x="'+(230+Math.max(3,244*frac)+8)+'" y="'+(y+16)+'">'+val+'</text>';
  };
  const cap=Math.max(Math.log10(full),lgBin,Math.log10(2));
  row(44,'full Gaussian: M + M(M+1)/2', fmt(full),'var(--s2)', Math.log10(full)/cap);
  row(84,'naive Gaussian: 2M', fmt(naive),'var(--s1)', Math.log10(Math.max(naive,2))/cap);
  row(140,'binary features, full joint: 2&#8309;&#8202;&#8722;&#8202;1'.replace('&#8309;','<tspan dy="-6" style="font-size:11px">M</tspan><tspan dy="6"></tspan>'), fmtBin(),'var(--s2)', Math.max(lgBin,Math.log10(2))/cap);
  row(174,'binary features, naive: M', fmt(M),'var(--s1)', Math.log10(Math.max(M,2))/cap);
  g+='<text class="tick" x="230" y="128">bars on a log scale</text>';
  svg.innerHTML=g;
  const mv=document.getElementById('p4mv'); if(mv) mv.textContent=M;
}

/* ---------------------------------------------------------------- DEMO 4 — the naive assumption
   Fit both ways and draw what the assumption keeps and drops: the full 2x2
   covariance ellipse tilts; the naive one is axis-aligned. */
let N4_MODE='naive';
function drawNaive4(){
  const svg=document.getElementById('n4svg'); if(!svg) return;
  const W=560,H=310, A=ax4(W,H,0,13,0,16,4,4,46);
  const B=nbFit();
  let g=clipDef4(A,W,H,'cpn4')+A.s+axlab4(A,W,H,'age (years)','mileage (10,000 km)');
  g+=scatter4(D4_LOT,A.X,A.Y,'lot')+scatter4(D4_SOLD,A.X,A.Y,'sold');
  if(N4_MODE==='naive'||N4_MODE==='both'){
    g+=ellipse4(A,B.c1.m,[[B.c1.v[0],0],[0,B.c1.v[1]]],'var(--s1)',false);
    g+=ellipse4(A,B.c0.m,[[B.c0.v[0],0],[0,B.c0.v[1]]],'var(--s2)',false);
  }
  if(N4_MODE==='full'||N4_MODE==='both'){
    g+=ellipse4(A,B.c1.m,B.c1.cov,'var(--s1)',true);
    g+=ellipse4(A,B.c0.m,B.c0.cov,'var(--s2)',true);
  }
  svg.innerHTML=g;
  document.querySelectorAll('[data-n4]').forEach(b=>b.classList.toggle('sel',b.dataset.n4===N4_MODE));
  const wn=document.getElementById('n4warn');
  const r1=B.c1.cov[0][1]/Math.sqrt(B.c1.cov[0][0]*B.c1.cov[1][1]);
  if(wn) wn.innerHTML = N4_MODE==='naive'
    ? 'Two numbers per feature per class: a mean and a variance. The ellipses are '
      + '<strong>axis-aligned</strong> &#8212; within a class, age tells you nothing about mileage.'
    : (N4_MODE==='full'
      ? 'The full fit is <strong>allowed</strong> a tilt &#8212; one extra number per class here, '
        + 'M(M&#8722;1)/2 in general. On these cars it barely uses it: within a class the two '
        + 'features are nearly uncorrelated (r = '+r1.toFixed(2)+' among sold cars).'
      : 'Solid: the naive fit. Dashed: the full fit. What the assumption drops is the within-class '
        + '<strong>correlation</strong> &#8212; and on these cars there is almost none to drop, '
        + 'which is why the two fits sit nearly on top of each other.');
}

/* ---------------------------------------------------------------- DEMO 5 — the fitted model
   Ellipses, posterior colour, decision boundary; readouts are the fitted numbers. */
let F4_HOV=null;
function drawFit4(){
  const svg=document.getElementById('f4svg'); if(!svg) return;
  const W=560,H=310, A=ax4(W,H,0,13,0,16,4,4,46);
  const B=nbFit();
  if(!svg._hov){
    svg._hov=1; svg.style.touchAction='none';
    const toData=e=>{
      const r=svg.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width*560, py=(e.clientY-r.top)/r.height*358;
      const age=(px-A.X(0))/(A.X(13)-A.X(0))*13, mi=(py-A.Y(0))/(A.Y(16)-A.Y(0))*16;
      return (age<0||age>13||mi<0||mi>16)?null:[age,mi];
    };
    svg.addEventListener('pointermove',e=>{ F4_HOV=toData(e); drawFit4(); });
    svg.addEventListener('pointerdown',e=>{ e.preventDefault(); F4_HOV=toData(e); drawFit4(); });
    svg.addEventListener('pointerleave',()=>{ F4_HOV=null; drawFit4(); });
  }
  let g=clipDef4(A,W,H,'cpf4')
    + A.s.replace(/<line class="gridline"[^>]*\/>/g,'')
    + axlab4(A,W,H,'age (years)','mileage (10,000 km)');
  g+=nbField(A,'cpf4',{});
  g+=ellipse4(A,B.c1.m,[[B.c1.v[0],0],[0,B.c1.v[1]]],'var(--s1)',false);
  g+=ellipse4(A,B.c0.m,[[B.c0.v[0],0],[0,B.c0.v[1]]],'var(--s2)',false);
  g+=nbHalf(A,'cpf4',{});
  g+=scatter4(D4_LOT,A.X,A.Y,'lot')+scatter4(D4_SOLD,A.X,A.Y,'sold');
  g+=nbBar(330);
  /* the hover readout: a reserved box, so nothing pops in and out */
  g+='<g transform="translate('+(A.ml+10)+','+(A.mt+14)+')">'
   + '<rect x="-8" y="-12" width="330" height="26" rx="4" fill="var(--bg)" opacity=".88"/>';
  if(F4_HOV){
    const p=nbPost(F4_HOV,{});
    const sells=p>0.5, col=sells?'var(--s1)':'var(--s2)';
    g+='<text class="matn" style="font-size:14.5px" x="0" y="5" fill="'+col+'">age '
     + F4_HOV[0].toFixed(1)+', mileage '+F4_HOV[1].toFixed(1)+' &#8594; '
     + (sells?'sells':'stays on the lot')+' &#183; p(sells | x) '
     + (p>0.995?'&gt; 0.99':(p<0.005?'&lt; 0.01':'= '+p.toFixed(2)))+'</text>';
    g+='</g><path d="M'+(A.X(F4_HOV[0])-7)+' '+A.Y(F4_HOV[1])+'h14M'+A.X(F4_HOV[0])+' '
     + (A.Y(F4_HOV[1])-7)+'v14" stroke="'+col+'" stroke-width="2" fill="none"/>'
     + '<circle cx="'+A.X(F4_HOV[0])+'" cy="'+A.Y(F4_HOV[1])+'" r="9" fill="none" stroke="'+col+'" stroke-width="1.6"/>';
  }else{
    g+='<text class="tick" x="0" y="5">move the mouse over the plot &#8212; each point gets classified</text></g>';
  }
  svg.innerHTML=g;
  const el=document.getElementById('f4stats');
  if(el) el.innerHTML='&#960;&#770; = 30/60 = '+nbFit().pi.toFixed(2)
    + ' &nbsp;&#183;&nbsp; sold: age '+B.c1.m[0].toFixed(1)+' &#177; '+Math.sqrt(B.c1.v[0]).toFixed(1)
    + ', mileage '+B.c1.m[1].toFixed(1)+' &#177; '+Math.sqrt(B.c1.v[1]).toFixed(1)
    + '<br>lot: age '+B.c0.m[0].toFixed(1)+' &#177; '+Math.sqrt(B.c0.v[0]).toFixed(1)
    + ', mileage '+B.c0.m[1].toFixed(1)+' &#177; '+Math.sqrt(B.c0.v[1]).toFixed(1);
}

/* ---------------------------------------------------------------- DEMO 6 — prediction, factor by factor

/* ---------------------------------------------------------------- DEMO 12 — the constrained maximum
   The K = 3 simplex with the contours of the log-likelihood over it, and the
   maximum sitting at the count fractions. Counts are a stated example; the
   contours and the marked maximum are computed from them. */
const LG4_N=[24,21,15];
/* The simplex as a heatmap. The dot is a candidate pi, draggable with the mouse;
   the bars to the right are that pi, and the readout is its log-likelihood. */
const LG4_V=[[80,278],[480,278],[280,48]];      /* corners pi1, pi2, pi3 */
let LG4_P=[0.18,0.50,0.32], LG4_IMG=null;
function lg4Screen(b){ const V=LG4_V;
  return [b[0]*V[0][0]+b[1]*V[1][0]+b[2]*V[2][0], b[0]*V[0][1]+b[1]*V[1][1]+b[2]*V[2][1]]; }
function lg4Bary(x,y){ const V=LG4_V;
  const d=(V[1][1]-V[2][1])*(V[0][0]-V[2][0])+(V[2][0]-V[1][0])*(V[0][1]-V[2][1]);
  let a=((V[1][1]-V[2][1])*(x-V[2][0])+(V[2][0]-V[1][0])*(y-V[2][1]))/d;
  let b=((V[2][1]-V[0][1])*(x-V[2][0])+(V[0][0]-V[2][0])*(y-V[2][1]))/d;
  let c=1-a-b;
  a=Math.max(a,0.01); b=Math.max(b,0.01); c=Math.max(c,0.01);
  const s=a+b+c; return [a/s,b/s,c/s]; }
const lg4LL=b=>LG4_N[0]*Math.log(b[0])+LG4_N[1]*Math.log(b[1])+LG4_N[2]*Math.log(b[2]);
/* viridis, from five control points */
function lg4Col(u){
  const S=[[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]];
  const t=Math.max(0,Math.min(1,u))*4, i=Math.min(3,Math.floor(t)), f=t-i;
  return [0,1,2].map(k=>Math.round(S[i][k]+f*(S[i+1][k]-S[i][k])));
}
function lg4Heat(){
  if(LG4_IMG) return LG4_IMG;
  const N=LG4_N[0]+LG4_N[1]+LG4_N[2];
  const opt=[LG4_N[0]/N,LG4_N[1]/N,LG4_N[2]/N], mx=lg4LL(opt);
  const x0=LG4_V[0][0], y0=LG4_V[2][1], w=LG4_V[1][0]-x0, h=LG4_V[0][1]-y0;
  const R=2, cw=w*R, ch=h*R;
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d'), im=ctx.createImageData(cw,ch);
  for(let py=0;py<ch;py++) for(let px=0;px<cw;px++){
    const b=lg4BaryRaw(x0+px/R, y0+py/R);
    const o=(py*cw+px)*4;
    if(b[0]<-0.002||b[1]<-0.002||b[2]<-0.002){ im.data[o+3]=0; continue; }
    const bb=[Math.max(b[0],1e-6),Math.max(b[1],1e-6),Math.max(b[2],1e-6)];
    const u=1-Math.min(1,(mx-lg4LL(bb))/30);
    const c=lg4Col(u);
    im.data[o]=c[0]; im.data[o+1]=c[1]; im.data[o+2]=c[2]; im.data[o+3]=255;
  }
  ctx.putImageData(im,0,0);
  LG4_IMG={url:cv.toDataURL(), x:x0, y:y0, w:w, h:h};
  return LG4_IMG;
}
function lg4BaryRaw(x,y){ const V=LG4_V;
  const d=(V[1][1]-V[2][1])*(V[0][0]-V[2][0])+(V[2][0]-V[1][0])*(V[0][1]-V[2][1]);
  const a=((V[1][1]-V[2][1])*(x-V[2][0])+(V[2][0]-V[1][0])*(y-V[2][1]))/d;
  const b=((V[2][1]-V[0][1])*(x-V[2][0])+(V[0][0]-V[2][0])*(y-V[2][1]))/d;
  return [a,b,1-a-b]; }
/* ================================================================ WHY THE LAGRANGIAN
   The K = 2 case of the very problem the previous slide drew: maximise
   f(p) = N1 ln p1 + N2 ln p2 subject to g(p) = p1 + p2 - 1 = 0. Small enough
   to draw honestly, and the answer (N_k/N) is one they can check.        */
const LG_N=[24,16];                       /* counts; N = 40, optimum (0.6, 0.4) */
const LGF=(a,b)=>LG_N[0]*Math.log(Math.max(a,1e-6))+LG_N[1]*Math.log(Math.max(b,1e-6));
const LGGRAD=(a,b)=>[LG_N[0]/Math.max(a,1e-6), LG_N[1]/Math.max(b,1e-6)];
const LG_OPT=[LG_N[0]/(LG_N[0]+LG_N[1]), LG_N[1]/(LG_N[0]+LG_N[1])];

/* ---- slide A: the surface, and the constraint drawn on it (axonometric) ---- */
/* square axes: equal pixels per unit on both axes, so a right angle in the
   data really is a right angle on screen (ax4 stretches the two independently) */
function axSq4(W,H,ml,mt,side,step){
  const X=x=>ml+x*side, Y=y=>mt+(1-y)*side;
  let s='';
  for(let g=0;g<=1+1e-9;g+=step){
    const py=Y(g), px=X(g);
    s+='<line class="gridline" x1="'+ml+'" y1="'+py+'" x2="'+(ml+side)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(py+4)+'" text-anchor="end">'+(+g.toFixed(1))+'</text>'
     + '<line class="gridline" x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(mt+side)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(mt+side+17)+'" text-anchor="middle">'+(+g.toFixed(1))+'</text>';
  }
  s+='<line class="axis" x1="'+ml+'" y1="'+(mt+side)+'" x2="'+(ml+side)+'" y2="'+(mt+side)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(mt+side)+'"/>'
   + '<text class="legend" x="'+(ml+side/2)+'" y="'+(mt+side+34)+'" text-anchor="middle">&#960;&#8321;</text>'
   + '<text class="legend" x="'+(-(mt+side/2))+'" y="'+(ml-30)+'" text-anchor="middle" transform="rotate(-90)">&#960;&#8322;</text>';
  return {s:s,X:X,Y:Y,ml:ml,mt:mt,side:side};
}
/* a small square marking a right angle between unit dirs d1, d2 at (x,y) */
function rightAngle4(A,x,y,d1,d2,col){
  const t=0.058;
  const p0=[x+d1[0]*t, y+d1[1]*t];
  const p1=[p0[0]+d2[0]*t, p0[1]+d2[1]*t];
  const p2=[x+d2[0]*t, y+d2[1]*t];
  return '<path d="M'+A.X(p0[0]).toFixed(1)+' '+A.Y(p0[1]).toFixed(1)
   + 'L'+A.X(p1[0]).toFixed(1)+' '+A.Y(p1[1]).toFixed(1)
   + 'L'+A.X(p2[0]).toFixed(1)+' '+A.Y(p2[1]).toFixed(1)
   + '" fill="none" stroke="'+col+'" stroke-width="1.5" opacity=".9"/>';
}

/* ---- slide A: the surface, rotatable ---- */
let LGS4_AZ=0.62, LGS4_EL=0.52;
function drawLgSurf4(){
  const svg=document.getElementById('lgs4svg'); if(!svg) return;
  if(!svg._rot){
    svg._rot=1; svg.style.touchAction='none'; svg.style.cursor='grab';
    let px=0, py=0;
    svg.addEventListener('pointerdown',e=>{ svg._dn=1; px=e.clientX; py=e.clientY;
      svg.style.cursor='grabbing'; e.preventDefault();
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}; });
    svg.addEventListener('pointermove',e=>{
      if(!svg._dn) return;
      LGS4_AZ += (e.clientX-px)*0.011;
      LGS4_EL = Math.max(0.10, Math.min(1.32, LGS4_EL + (e.clientY-py)*0.008));
      px=e.clientX; py=e.clientY; drawLgSurf4();
    });
    const up=()=>{ svg._dn=0; svg.style.cursor='grab'; };
    svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  }
  const ox=300, oy=214, S=150, ZS=118;
  const ca=Math.cos(LGS4_AZ), sa=Math.sin(LGS4_AZ), se=Math.sin(LGS4_EL);
  /* depth: larger means farther from the viewer */
  const depth=(a,b)=>{ const u=a-0.5, v=b-0.5; return u*sa+v*ca; };
  const P=(a,b,z)=>{ const u=a-0.5, v=b-0.5;
    return [ox+S*(u*ca-v*sa), oy-S*se*(u*sa+v*ca)-ZS*z]; };
  const zOf=(a,b)=>Math.max(0,Math.min(1,(LGF(a,b)+70)/70));
  let g='';
  const fl=[P(0,0,0),P(1,0,0),P(1,1,0),P(0,1,0)];
  g+='<path d="'+pathOf(fl)+' Z" fill="var(--bg-alt)" stroke="var(--rule)" stroke-width="1.2"/>';
  /* wireframe, painted far-to-near */
  const NL=10, FINE=32, LO=0.05, strokes=[];
  for(let i=0;i<=NL;i++){
    const a=LO+i*(1-2*LO)/NL; const pts=[];
    for(let j=0;j<=FINE;j++){ const b=LO+j*(1-2*LO)/FINE; pts.push(P(a,b,zOf(a,b))); }
    strokes.push([depth(a,0.5), pts]);
  }
  for(let j=0;j<=NL;j++){
    const b=LO+j*(1-2*LO)/NL; const pts=[];
    for(let i=0;i<=FINE;i++){ const a=LO+i*(1-2*LO)/FINE; pts.push(P(a,b,zOf(a,b))); }
    strokes.push([depth(0.5,b), pts]);
  }
  strokes.sort((p,q)=>q[0]-p[0]);
  strokes.forEach(([d,pts],k)=>{
    g+='<path d="'+pathOf(pts)+'" fill="none" stroke="var(--s1)" stroke-width="1" opacity="'
     + (0.20+0.30*(k/strokes.length)).toFixed(2)+'"/>';
  });
  let floorC=[], liftC=[];
  for(let i=0;i<=70;i++){
    const a=0.06+i*0.88/70, b=1-a;
    floorC.push(P(a,b,0)); liftC.push(P(a,b,zOf(a,b)));
  }
  g+='<path d="'+pathOf(floorC)+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="6 4" opacity=".8"/>';
  if(LGS4_STEP>=1){
    for(let i=0;i<=70;i+=7){
      const A2=floorC[i], B2=liftC[i];
      g+='<line x1="'+A2[0].toFixed(1)+'" y1="'+A2[1].toFixed(1)+'" x2="'+B2[0].toFixed(1)+'" y2="'+B2[1].toFixed(1)
       + '" stroke="var(--accent)" stroke-width="1" opacity=".28"/>';
    }
    g+='<path d="'+pathOf(liftC)+'" fill="none" stroke="var(--accent)" stroke-width="3.2"/>';
  }
  if(LGS4_STEP>=2){
    const O=P(LG_OPT[0],LG_OPT[1],zOf(LG_OPT[0],LG_OPT[1]));
    g+='<circle cx="'+O[0].toFixed(1)+'" cy="'+O[1].toFixed(1)+'" r="6.5" fill="var(--accent)" stroke="#fff" stroke-width="2"/>'
     + '<text class="matn" style="font-size:15px" x="'+(O[0]+13)+'" y="'+(O[1]-9)+'" fill="var(--accent)">&#960; = ('
     + LG_OPT[0].toFixed(2)+', '+LG_OPT[1].toFixed(2)+')</text>';
  }
  const E1=P(1,0,0), E2=P(0,1,0), E0=P(0,0,0);
  g+='<text class="tick" x="'+E1[0].toFixed(0)+'" y="'+(E1[1]+16).toFixed(0)+'" text-anchor="middle">&#960;&#8321; = 1</text>'
   + '<text class="tick" x="'+E2[0].toFixed(0)+'" y="'+(E2[1]+16).toFixed(0)+'" text-anchor="middle">&#960;&#8322; = 1</text>'
   + '<text class="tick" x="'+E0[0].toFixed(0)+'" y="'+(E0[1]+16).toFixed(0)+'" text-anchor="middle">0</text>'
   + '<text class="legend" x="14" y="18">height: ln p(D | &#960;) &#183; <tspan style="fill:var(--accent)">drag to rotate</tspan></text>';
  svg.innerHTML=g;
  const wn=document.getElementById('lgs4warn');
  if(wn) wn.innerHTML = LGS4_STEP===0
    ? 'The surface just keeps climbing as &#960;&#8321;, &#960;&#8322; grow &#8212; it has <strong>no summit</strong>. Setting the derivative to zero asks for N&#8342;/&#960;&#8342; = 0, which has no solution.'
    : (LGS4_STEP===1
      ? 'Dashed: the constraint on the floor. Solid: that line <strong>lifted onto the surface</strong>. Along it, the climb has to stop somewhere.'
      : 'And it does &#8212; the top of the <strong>curve</strong>, at the count fractions (0.60, 0.40). The next slides turn that into a condition we can solve.');
  for(let i=0;i<3;i++){ const b=document.getElementById('lgs4b'+i); if(b) b.classList.toggle('sel',LGS4_STEP===i); }
}
let LGS4_STEP=0;
function lgs4Step(k){ LGS4_STEP=k; drawLgSurf4(); }

/* ---- slides B & C: the same surface from directly overhead ---- */
const LGSQ=()=>axSq4(560,330,139,14,282,0.2);
/* a muted viridis wash of f under the contours: same colormap as the triangle on
   the constrained-maximum slide, kept faint so the rings stay the main reading */
let _lgHeat=null;
function lgHeat4(A){
  if(_lgHeat) return _lgHeat;
  const R=2, n=Math.round(A.side*R);
  const cv=document.createElement('canvas'); cv.width=n; cv.height=n;
  const ctx=cv.getContext('2d'), im=ctx.createImageData(n,n);
  const LO=-54, HI=-34.5;
  for(let py=0;py<n;py++) for(let px=0;px<n;px++){
    const a=px/(n-1), b=1-py/(n-1);
    const u=Math.max(0,Math.min(1,(LGF(Math.max(a,1e-4),Math.max(b,1e-4))-LO)/(HI-LO)));
    const c=lg4Col(u), o=(py*n+px)*4;
    im.data[o]=c[0]; im.data[o+1]=c[1]; im.data[o+2]=c[2]; im.data[o+3]=255;
  }

/* marching-squares contours of ell at the given levels; hi = index to emphasise */
function lgContours4(A,levels,hi){
  let g='';
  levels.forEach((lev,li)=>{
    let s='';
    const n=120;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      const a0=0.02+i*0.97/n, b0=0.02+j*0.97/n, a1=0.02+(i+1)*0.97/n, b1=0.02+(j+1)*0.97/n;
      const c=[[a0,b0],[a1,b0],[a1,b1],[a0,b1]].map(([a,b])=>[a,b,LGF(a,b)-lev]);
      const pts=[];
      for(let e=0;e<4;e++){ const A2=c[e], B2=c[(e+1)%4];
        if((A2[2]>0)!==(B2[2]>0)){ const t=A2[2]/(A2[2]-B2[2]);
          pts.push([A.X(A2[0]+t*(B2[0]-A2[0])), A.Y(A2[1]+t*(B2[1]-A2[1]))]); } }
      if(pts.length===2)
        s+='<line x1="'+pts[0][0].toFixed(1)+'" y1="'+pts[0][1].toFixed(1)+'" x2="'+pts[1][0].toFixed(1)+'" y2="'+pts[1][1].toFixed(1)+'"/>';
    }

      + ' <strong>along</strong> the constraint is '+(dot>=0?'+':'&#8722;')+Math.abs(dot).toFixed(1)+'. '

/* ---------------------------------------------------------------- DEMO — the Dirichlet prior
   A density over the triangle itself. dirHeat colours a simplex by
   sum_k a_k ln pi_k (the log of prod pi_k^{a_k}, up to the normaliser);
   the window scales with the surface so gentle priors still show shape. */
function dirHeat(A,V,R){
  const S=A[0]+A[1]+A[2];
  const opt=S>0?[A[0]/S,A[1]/S,A[2]/S]:[1/3,1/3,1/3];
  const lp=b=>A[0]*Math.log(b[0])+A[1]*Math.log(b[1])+A[2]*Math.log(b[2]);
  const mx=S>0?lp([Math.max(opt[0],1e-9),Math.max(opt[1],1e-9),Math.max(opt[2],1e-9)]):0;
  const W=Math.max(2.5,0.6*S);
  const x0=V[0][0], y0=V[2][1], w=V[1][0]-x0, h=V[0][1]-y0;
  const cw=Math.round(w*R), ch=Math.round(h*R);
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
  const ctx=cv.getContext('2d'), im=ctx.createImageData(cw,ch);
  const d=(V[1][1]-V[2][1])*(V[0][0]-V[2][0])+(V[2][0]-V[1][0])*(V[0][1]-V[2][1]);
  for(let py=0;py<ch;py++) for(let px=0;px<cw;px++){
    const x=x0+px/R, y=y0+py/R;
    const a=((V[1][1]-V[2][1])*(x-V[2][0])+(V[2][0]-V[1][0])*(y-V[2][1]))/d;
    const b=((V[2][1]-V[0][1])*(x-V[2][0])+(V[0][0]-V[2][0])*(y-V[2][1]))/d;
    const c=1-a-b, o=(py*cw+px)*4;
    if(a<-0.002||b<-0.002||c<-0.002){ im.data[o+3]=0; continue; }
    const u=S>0?1-Math.min(1,(mx-lp([Math.max(a,1e-6),Math.max(b,1e-6),Math.max(c,1e-6)]))/W):1;
    const col=lg4Col(u);
    im.data[o]=col[0]; im.data[o+1]=col[1]; im.data[o+2]=col[2]; im.data[o+3]=255;
  }
  ctx.putImageData(im,0,0);
  return {url:cv.toDataURL(), x:x0, y:y0, w:w, h:h};
}
function dirTri(A,V,R,ring){
  const hm=dirHeat(A,V,R);
  let g='<image href="'+hm.url+'" x="'+hm.x+'" y="'+hm.y+'" width="'+hm.w+'" height="'+hm.h+'" preserveAspectRatio="none"/>'
   + '<path d="'+pathOf([V[0],V[1],V[2]])+' Z" fill="none" stroke="var(--rule)" stroke-width="1.4"/>';
  const S=A[0]+A[1]+A[2];
  if(ring&&S>0){
    const m=[A[0]/S,A[1]/S,A[2]/S];
    const P=[m[0]*V[0][0]+m[1]*V[1][0]+m[2]*V[2][0], m[0]*V[0][1]+m[1]*V[1][1]+m[2]*V[2][1]];
    g+='<circle cx="'+P[0].toFixed(1)+'" cy="'+P[1].toFixed(1)+'" r="5.5" fill="none" stroke="#1c1c1c" stroke-width="2"/>';

}

function lr4Fit(){
  if(_lr4) return _lr4;
  const all=D4_SOLD.map(p=>[p,1]).concat(D4_LOT.map(p=>[p,0]));
  const mx=all.reduce((a,[p])=>a+p[0],0)/all.length, my=all.reduce((a,[p])=>a+p[1],0)/all.length;
  const sx=Math.sqrt(all.reduce((a,[p])=>a+(p[0]-mx)*(p[0]-mx),0)/all.length);
  const sy=Math.sqrt(all.reduce((a,[p])=>a+(p[1]-my)*(p[1]-my),0)/all.length);
  let w=[0,0,0];
  for(let it=0;it<12000;it++){
    const g=[0.01*w[0],0.01*w[1],0.01*w[2]];
    all.forEach(([p,t])=>{ const z=[1,(p[0]-mx)/sx,(p[1]-my)/sy];
      const d=sig(w[0]*z[0]+w[1]*z[1]+w[2]*z[2])-t;
      for(let i=0;i<3;i++) g[i]+=d*z[i]; });
    for(let i=0;i<3;i++) w[i]-=0.4/all.length*g[i];
  }
  _lr4=[w[0]-w[1]*mx/sx-w[2]*my/sy, w[1]/sx, w[2]/sy];
  return _lr4;
}

/* ---------------------------------------------------------------- DEMO 14 — learning curves
   Naive Bayes against logistic regression as the training set grows: train on the
   first N of an interleaved stream of the sixty cars, test on the rest, average
   over three fixed interleavings to damp the noise of one ordering. Everything is
   fitted here, at load time, and cached. */
let _lc=null;
function lcCurves(){
  if(_lc) return _lc;
  const mkSeq=seed=>{
    const r=lcg(seed);
    const s=D4_SOLD.slice(), l=D4_LOT.slice();
    /* deterministic shuffle of each class, then interleave */
    for(let i=s.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=s[i]; s[i]=s[j]; s[j]=t; }
    for(let i=l.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); const t=l[i]; l[i]=l[j]; l[j]=t; }
    const seq=[];
    for(let i=0;i<30;i++){ seq.push([s[i],1]); seq.push([l[i],0]); }
    return seq;
  };
  const lrFit=data=>{
    const mx=data.reduce((a,[p])=>a+p[0],0)/data.length, my=data.reduce((a,[p])=>a+p[1],0)/data.length;
    const sx=Math.sqrt(data.reduce((a,[p])=>a+(p[0]-mx)*(p[0]-mx),0)/data.length)||1;
    const sy=Math.sqrt(data.reduce((a,[p])=>a+(p[1]-my)*(p[1]-my),0)/data.length)||1;
    let w=[0,0,0];
    for(let it=0;it<3000;it++){
      const g=[0.02*w[0],0.02*w[1],0.02*w[2]];
      data.forEach(([p,t])=>{ const z=[1,(p[0]-mx)/sx,(p[1]-my)/sy];
        const d=sig(w[0]*z[0]+w[1]*z[1]+w[2]*z[2])-t;
        for(let i=0;i<3;i++) g[i]+=d*z[i]; });
      for(let i=0;i<3;i++) w[i]-=0.5/data.length*g[i];
    }
    return p=>sig(w[0]+w[1]*(p[0]-mx)/sx+w[2]*(p[1]-my)/sy)>0.5?1:0;
  };
  const nbFitN=data=>{
    const cls=t=>data.filter(([,tt])=>tt===t).map(([p])=>p);
    /* pooled per-feature variance of the training set, used to steady the tiny-N
       class variances: three cars would otherwise pretend to have almost no spread */
    const allp=data.map(([p])=>p);
    const pm=[allp.reduce((a,p)=>a+p[0],0)/allp.length, allp.reduce((a,p)=>a+p[1],0)/allp.length];
    const vp=[allp.reduce((a,p)=>a+(p[0]-pm[0])*(p[0]-pm[0]),0)/allp.length,
              allp.reduce((a,p)=>a+(p[1]-pm[1])*(p[1]-pm[1]),0)/allp.length];
    const st=D=>{
      const n=Math.max(D.length,1);
      const m=[D.reduce((a,p)=>a+p[0],0)/n, D.reduce((a,p)=>a+p[1],0)/n];
      const ve=[D.reduce((a,p)=>a+(p[0]-m[0])*(p[0]-m[0]),0)/n,
                D.reduce((a,p)=>a+(p[1]-m[1])*(p[1]-m[1]),0)/n];
      const v=[ (D.length*ve[0]+3*vp[0])/(D.length+3), (D.length*ve[1]+3*vp[1])/(D.length+3) ];
      return {n:D.length,m,v};
    };
    const s1=st(cls(1)), s0=st(cls(0)), pi=s1.n/Math.max(s1.n+s0.n,1);
    return p=>{
      const l1=Math.log(Math.max(pi,1e-9))+Math.log(NPDF4(p[0],s1.m[0],s1.v[0]))+Math.log(NPDF4(p[1],s1.m[1],s1.v[1]));
      const l0=Math.log(Math.max(1-pi,1e-9))+Math.log(NPDF4(p[0],s0.m[0],s0.v[0]))+Math.log(NPDF4(p[1],s0.m[1],s0.v[1]));
      return l1>l0?1:0;
    };
  };
  const Ns=[6,10,14,18,22,26,30,34,38,42];
  const nb=[], lr=[];
  Ns.forEach(N=>{
    let eNB=0, eLR=0, tot=0;
    [11,42,73].forEach(seed=>{
      const seq=mkSeq(seed), tr=seq.slice(0,N), te=seq.slice(N);
      const fNB=nbFitN(tr), fLR=lrFit(tr);
      te.forEach(([p,t])=>{ if(fNB(p)!==t) eNB++; if(fLR(p)!==t) eLR++; tot++; });
    });
    nb.push(eNB/tot); lr.push(eLR/tot);
  });
  _lc={Ns,nb,lr};
  return _lc;
}

  g+='<path d="'+pathOf(Ns.map((N,i)=>[A.X(N),A.Y(nb[i])]))+'" fill="none" stroke="var(--ink)" stroke-width="2.6" clip-path="url(#cplc)"/>';

function df4Load(){
  if(_df4px) return true;
  if(!df4Load.img){
    const im=new Image();
    im.onload=()=>{ const cv=document.createElement('canvas'); cv.width=128; cv.height=128;
      const cx=cv.getContext('2d'); cx.drawImage(im,0,0,128,128);
      _df4px=cx.getImageData(0,0,128,128); df4Eps(); drawDiff4(); };
    im.src='data:image/jpeg;base64,'+DF4_B64;
    df4Load.img=im;
  }
  return false;
}
function df4Eps(){
  const r=lcg(_df4seed);
  _df4eps=new Float32Array(128*128*3);
  for(let i=0;i<_df4eps.length;i++) _df4eps[i]=gaussOf(r);
}
function df4Resample(){ _df4seed=(_df4seed*1103515245+12345)>>>0; df4Eps(); drawDiff4(); }
function drawDiff4(){
  const cv=document.getElementById('df4cv'); if(!cv) return;
  if(!df4Load()) return;
  const ab=1-DF_T*DF_T;             /* abar falls from 1 to 0 as the slider rises;
                                       quadratic in t so the readable range is wide */
  const ca=Math.sqrt(ab), cb=Math.sqrt(1-ab);
  const ctx=cv.getContext('2d');
  const out=ctx.createImageData(128,128);
  const src=_df4px.data;
  for(let i=0,j=0;i<src.length;i+=4,j+=3){
    for(let k=0;k<3;k++){
      const x0=src[i+k]/127.5-1;
      const v=(ca*x0+cb*_df4eps[j+k]+1)*127.5;
      out.data[i+k]=v<0?0:(v>255?255:v);
    }
    out.data[i+3]=255;
  }
  ctx.putImageData(out,0,0);
  const tv=document.getElementById('df4tv'); if(tv) tv.textContent=(DF_T*100).toFixed(0)+'%';
  const wn=document.getElementById('df4warn');
  if(wn) wn.innerHTML = DF_T<0.05
    ? 'Noise level zero: the image as it is. Drag the slider &#8212; this direction needs no learning at all.'
    : (DF_T>0.9
      ? 'The image is gone; what remains is noise. A diffusion model is trained to run this film '
        + '<strong>backwards</strong>, one small denoising step at a time.'
      : 'Part-way: every pixel is &#8730;&#8203;&#945;&#772;&#8202;x&#8320; + &#8730;&#8203;(1&#8722;&#945;&#772;)&#8202;&#949;, '
        + 'for one fixed draw of noise &#949;. Structure fades; noise takes over.');
}

/* ================================================================ WORDS AS FEATURES
   The same naive-Bayes recipe on a different kind of feature. A six-word vocabulary and
   sixteen labelled emails, small enough that every number on screen can be checked by
   hand. "meeting" never appears in spam, which is what makes the zero problem bite. */
const SP4_V   = ['free','winner','urgent','invoice','meeting','lunch'];
const SP4_SPAM= [7,6,5,2,0,1];         /* spam emails (of 8) containing each word */
const SP4_HAM = [1,1,2,5,6,6];
const SP4_N   = 8;
const SP4_TEST= [1,1,1,0,1,0];         /* the email we have to judge */
let   SP4_A   = 0;                     /* the smoothing count, added to every cell */

const sp4p=(c,a)=>(c+a)/(SP4_N+2*a);   /* Bernoulli MLE, or its MAP under a Beta prior */
function sp4Score(a){
  let ls=Math.log(0.5), lh=Math.log(0.5), zeroS=false, zeroH=false;
  SP4_V.forEach((w,j)=>{
    const ps=sp4p(SP4_SPAM[j],a), ph=sp4p(SP4_HAM[j],a);
    const fs=SP4_TEST[j]?ps:1-ps, fh=SP4_TEST[j]?ph:1-ph;
    if(fs<=0) zeroS=true; else ls+=Math.log(fs);
    if(fh<=0) zeroH=true; else lh+=Math.log(fh);
  });
  const S=zeroS?0:Math.exp(ls), H=zeroH?0:Math.exp(lh);
  return {S:S, H:H, post:(S+H)>0 ? S/(S+H) : NaN, zeroS:zeroS, zeroH:zeroH};
}

function drawCounts4(){

  SP4_V.forEach((w,j)=>{
    const y=54+j*31, zero=SP4_SPAM[j]===0;
    let cx=x0;
    const cell=(i,txt,col)=>{ const t='<text class="matn" style="font-size:15px'+(col?';fill:'+col:'')+'" x="'
      + (i?cx+cw[i]-8:cx)+'" y="'+y+'" text-anchor="'+(i?'end':'start')+'">'+txt+'</text>'; cx+=cw[i]; return t; };
    g+=cell(0,w);
    g+=cell(1,SP4_SPAM[j], zero?'var(--accent)':'');
    g+=cell(2,SP4_HAM[j]);
    g+=cell(3,(SP4_SPAM[j]/SP4_N).toFixed(3), zero?'var(--accent)':'');

  });
  g+='<text class="legend" x="'+x0+'" y="'+(54+6*31+2)+'">every estimate is a count over a count &#8212; and one is zero</text>';
  svg.innerHTML=g;
}

/* the same email, scored, with the smoothing dial */
/* the figure body, so the alpha = 0 slide before the fix and the interactive slide
   after it stay in step: one renderer, two callers. */
function spam4Body(a){
  const r=sp4Score(a), W=560,H=290, x0=16;

  SP4_V.forEach((w,j)=>{
    const y=44+j*27, ps=sp4p(SP4_SPAM[j],a), ph=sp4p(SP4_HAM[j],a);
    const fs=SP4_TEST[j]?ps:1-ps, fh=SP4_TEST[j]?ph:1-ph;

     + '<text class="matn" style="font-size:15px'+(fs<=0?';fill:var(--accent)':'')+'" x="300" y="'+y+'" text-anchor="end">'+fs.toFixed(3)+'</text>'
     + '<text class="matn" style="font-size:15px" x="392" y="'+y+'" text-anchor="end">'+fh.toFixed(3)+'</text>';

   + '<text class="matn" style="font-size:15px'+(r.zeroS?';fill:var(--accent)':'')+'" x="300" y="'+yb+'" text-anchor="end">'+(r.zeroS?'0':r.S.toExponential(2))+'</text>'
   + '<text class="matn" style="font-size:15px" x="392" y="'+yb+'" text-anchor="end">'+(r.zeroH?'0':r.H.toExponential(2))+'</text>';

     + '<text class="matn" style="font-size:16px" x="'+bx+'" y="'+(by+20)+'" fill="var(--accent)">are zero</text>';
  }else{
    [['spam',r.post,'var(--s2)'],['ham',1-r.post,'var(--s1)']].forEach(([lab,p,col],i)=>{
      const y=by+i*74;
      g+='<text class="tick" x="'+bx+'" y="'+y+'">'+lab+'</text>'
       + '<rect x="'+bx+'" y="'+(y+8)+'" width="'+Math.max(1,bw*p)+'" height="20" rx="3" fill="'+col+'" opacity=".8"/>'
       + '<text class="matn" style="font-size:16px" x="'+bx+'" y="'+(y+46)+'">'+(p*100).toFixed(1)+'%</text>';
    });

  g+='<text class="legend" x="'+bx+'" y="18">posterior</text>';
  /* say what the numbers are: a Bernoulli factor per word, not a raw word probability */
  g+='<text class="tick" x="'+x0+'" y="'+(yb+24)+'">a word <tspan font-style="italic">in</tspan> the email contributes p(word | class)</text>'
   + '<text class="tick" x="'+x0+'" y="'+(yb+42)+'">a word <tspan font-style="italic">not</tspan> in it contributes 1 &#8722; p(word | class)</text>';

/* ================================================================ TOWARD NEURAL NETWORKS
   Two sigmoid units with opposite signs sum to a bump: the smallest demonstration that
   the pieces already on the table -- weighted sums and squashings -- compose into new
   nonlinear functions. Sliders move the two step positions and the shared steepness. */
let NN4_C1=3.0, NN4_C2=7.0, NN4_S=2.0;
function drawBump4(){
  const svg=document.getElementById('nn4svg'); if(!svg) return;
  const W=560,H=290, A=ax4(W,H,0,10,-1.25,1.25,2,0.5,52);
  const u1=x=>sig(NN4_S*(x-NN4_C1)), u2=x=>sig(NN4_S*(x-NN4_C2));
  const f=x=>u1(x)-u2(x);
  let g=clipDef4(A,W,H,'cpnn4')+A.s;
  g+='<line x1="'+A.X(0)+'" y1="'+A.Y(0)+'" x2="'+A.X(10)+'" y2="'+A.Y(0)+'" stroke="var(--rule)" stroke-width="1.2" stroke-dasharray="4 4"/>';
  g+='<path d="'+pathOf(lin(0,10,240).map(x=>[A.X(x),A.Y(u1(x))]))+'" fill="none" stroke="var(--s1)" stroke-width="1.8" opacity=".55" clip-path="url(#cpnn4)"/>';
  g+='<path d="'+pathOf(lin(0,10,240).map(x=>[A.X(x),A.Y(-u2(x))]))+'" fill="none" stroke="var(--s2)" stroke-width="1.8" opacity=".55" clip-path="url(#cpnn4)"/>';
  g+='<path d="'+pathOf(lin(0,10,300).map(x=>[A.X(x),A.Y(f(x))]))+'" fill="none" stroke="var(--accent2)" stroke-width="3" clip-path="url(#cpnn4)"/>';
  const halo=' paint-order="stroke" stroke="var(--bg)" stroke-width="3.5" stroke-linejoin="round"';
  g+='<text class="legend" x="'+A.X(9.7)+'" y="'+(A.Y(u1(9.7))-8)+'" text-anchor="end" fill="var(--s1)"'+halo+'>+&#963;(s(x&#8202;&#8722;&#8202;c&#8321;))</text>'
   + '<text class="legend" x="'+A.X(9.7)+'" y="'+(A.Y(-u2(9.7))+16)+'" text-anchor="end" fill="var(--s2)"'+halo+'>&#8722;&#963;(s(x&#8202;&#8722;&#8202;c&#8322;))</text>';
  const mid=(NN4_C1+NN4_C2)/2;
  g+='<text class="legend" x="'+A.X(mid)+'" y="'+(A.Y(f(mid))-10)+'" text-anchor="middle" fill="var(--accent2)"'+halo+'>the sum</text>';
  g+=axlab4(A,W,H,'x','two units, added');
  svg.innerHTML=g;
  const ids={nn4c1v:NN4_C1.toFixed(1), nn4c2v:NN4_C2.toFixed(1), nn4sv:NN4_S.toFixed(1)};
  Object.keys(ids).forEach(k=>{const e=document.getElementById(k); if(e) e.textContent=ids[k];});
}

/* ================================================================ CHAIN THE STORY
   p(t) p(z|t) p(x | f(z)) run live: coin, then a usage level z from the class's own
   Gaussian, then features grown through a NONLINEAR f -- so the samples land along a
   curve no table of per-class Gaussians would produce. The strip at the bottom shows
   the middle variable being drawn; the plane above shows where f carries it. */
let CH4_PTS=[], CH4_SEED=31337;
const ch4f=z=>[0.5+1.05*z, 1.2+0.50*z+0.17*z*z];          /* z -> (age, mileage) */
const CH4_Z1={m:2.0,s:0.7}, CH4_Z0={m:4.9,s:0.8};         /* p(z|t): sold cars used less */
function ch4Draw(n){
  const r=lcg(CH4_SEED); CH4_SEED=(CH4_SEED*1103515245+12345)>>>0;
  for(let i=0;i<n;i++){
    const t=r()<0.5?1:0, c=t?CH4_Z1:CH4_Z0;
    const z=Math.min(7.2,Math.max(0.2, c.m+c.s*gaussOf(r)));
    const [a,m]=ch4f(z);
    CH4_PTS.push([t, z, a+0.35*gaussOf(r), m+0.35*gaussOf(r)]);
  }
  drawChain4();
}
function ch4Reset(){ CH4_PTS=[]; drawChain4(); }
function drawChain4(){
  const svg=document.getElementById('ch4svg'); if(!svg) return;
  const W=560, A=ax4(W,235,0,10,0,16,2,4,52);
  let g=clipDef4(A,W,235,'cpch4')+A.s;
  /* the spine: where f puts each usage level */
  g+='<path d="'+pathOf(lin(0.2,7.2,90).map(z=>{const p=ch4f(z);return [A.X(p[0]),A.Y(p[1])];}))
   + '" fill="none" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="6 4" opacity=".65" clip-path="url(#cpch4)"/>';
  const sp=ch4f(6.6);
  g+='<text class="tick" x="'+(A.X(sp[0])-8)+'" y="'+(A.Y(sp[1])+16)+'" text-anchor="end">x = f(z) + noise</text>';
  g+=scatter4(CH4_PTS.filter(p=>!p[0]).map(p=>[p[2],p[3]]),A.X,A.Y,'lot')
   + scatter4(CH4_PTS.filter(p=> p[0]).map(p=>[p[2],p[3]]),A.X,A.Y,'sold');
  g+=axlab4(A,W,235,'','mileage (10,000 km)');
  g+='<text class="legend" x="'+((52+W-14)/2)+'" y="231" text-anchor="middle">age (years)</text>';
  /* ---- the strip below: z being drawn, class by class ---- */
  const sy=326, st=256, X2=z=>52+(z-0)/(8-0)*(W-14-52);
  g+='<line class="axis" x1="52" y1="'+sy+'" x2="'+(W-14)+'" y2="'+sy+'"/>';
  [[CH4_Z1,'var(--s1)'],[CH4_Z0,'var(--s2)']].forEach(([c,col])=>{
    const pk=NPDF4(c.m,c.m,c.s*c.s);
    g+='<path d="'+pathOf(lin(0,8,120).map(z=>[X2(z), sy-52*NPDF4(z,c.m,c.s*c.s)/pk]))
     + '" fill="none" stroke="'+col+'" stroke-width="2" opacity=".75"/>';
  });
  CH4_PTS.slice(-40).forEach(p=>{
    g+='<line x1="'+X2(p[1])+'" y1="'+(sy-9)+'" x2="'+X2(p[1])+'" y2="'+sy
     + '" stroke="var(--s'+(p[0]?1:2)+')" stroke-width="1.6" opacity=".8"/>';
  });
  g+='<text class="legend" x="52" y="'+(st+6)+'">z &#8212; how hard the car was used, drawn from its class&#8217;s curve</text>';
  svg.innerHTML=g;
  const nv=document.getElementById('ch4n'); if(nv) nv.textContent=CH4_PTS.length;
}

/* t-SNE of the 1797 scikit-learn digits (perplexity 30, PCA init, seed 0), computed
   offline and embedded as coordinates in [0,999]. The map never saw the labels. */
/* ================================================================ THE LEARNED MANIFOLD
   A real MNIST VAE with a two-dimensional latent: Taylor Denouden's released
   decoder (github.com/tayden/VAE-Latent-Space-Explorer, MIT). We ran that
   decoder offline over a 41x41 grid of z in [-2.5, 2.5]^2 and stored the
   result as one sprite sheet; hovering looks up the cell for the z under the
   pointer, so what you see is genuinely p(x | z) from a trained model. */
const VZ_N=41, VZ_LIM=2.5, VZ_CELL=28;
let VZ_IMG=null, VZ_AT=null;
function drawVaez4(){
  const box=document.getElementById('vz4box'), cv=document.getElementById('vz4out');
  if(!box||!cv) return;
  if(!VZ_IMG){
    VZ_IMG=new Image();
    VZ_IMG.onload=()=>drawVaez4();
    VZ_IMG.src='media/vae-mnist-grid.png';
  }
  if(!box._hov){
    box._hov=1; box.style.cursor='crosshair'; box.style.touchAction='none';
    const at=e=>{ const r=box.getBoundingClientRect();
      VZ_AT=[ Math.max(0,Math.min(0.9999,(e.clientX-r.left)/r.width)),
              Math.max(0,Math.min(0.9999,(e.clientY-r.top)/r.height)) ];
      drawVaez4(); };
    box.addEventListener('pointermove',at);
    box.addEventListener('pointerdown',e=>{ e.preventDefault(); at(e); });
    box.addEventListener('pointerleave',()=>{ VZ_AT=null; drawVaez4(); });
  }
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
  const at=VZ_AT||[0.5,0.5];
  const j=Math.min(VZ_N-1, Math.floor(at[0]*VZ_N));      /* column -> z1 */
  const i=Math.min(VZ_N-1, Math.floor(at[1]*VZ_N));      /* row    -> z2 */
  if(VZ_IMG.complete && VZ_IMG.naturalWidth){
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(VZ_IMG, j*VZ_CELL, i*VZ_CELL, VZ_CELL, VZ_CELL, 0, 0, cv.width, cv.height);
  }
  const mk=document.getElementById('vz4mark');
  if(mk){
    mk.style.display=VZ_AT?'block':'none';
    mk.style.left=(j/VZ_N*100).toFixed(3)+'%';
    mk.style.top=(i/VZ_N*100).toFixed(3)+'%';
    mk.style.width=(100/VZ_N).toFixed(3)+'%';
    mk.style.height=(100/VZ_N).toFixed(3)+'%';
  }
  const cap=document.getElementById('vz4cap');
  if(cap){
    const z1=(-VZ_LIM + j*(2*VZ_LIM)/(VZ_N-1)).toFixed(2);
    const z2=( VZ_LIM - i*(2*VZ_LIM)/(VZ_N-1)).toFixed(2);
    cap.innerHTML = VZ_AT
      ? 'decoded at <strong>z = (' + z1 + ', ' + z2 + ')</strong>'
      : 'move the pointer over the plane';
  }
}

/* ================================================================ MATCH THE PIECES
   Drag each familiar piece onto the job it does in the generative model. Wrong slot
   flashes and the chip walks home; right slot locks it in. The engine's click-to-
   advance ignores pointerdowns inside an svg, so dragging cannot turn the page. */
let M4G=null, M4G_FLASH=null;
function m4gInit(){
  /* The pieces are shuffled; the jobs are NOT -- they stay in modelling order
     (prior, class-conditionals, fit, prediction) so the finished board reads as
     the steps of the model. The shuffle is a fixed derangement of that order, so
     no piece sits beside its own job and the answer is never just top-to-top.
     Hard-coded rather than randomised, so the board is identical every delivery. */
  M4G={chips:[
    {id:'mle',  lab:'MLE',       sub:'maximum likelihood &#183; Lecture 2', job:'fit'},
    {id:'bayes',lab:'Bayes&#8217; rule', sub:'the disease example', job:'test'},
    {id:'bern', lab:'Bernoulli', sub:'Lecture 3', job:'prior'},
    {id:'gauss',lab:'Gaussian',  sub:'Lecture 2', job:'cond'}],
    slots:[
    {job:'prior',lab:'which class a row belongs to', sub:'the class prior'},
    {job:'cond', lab:'one distribution over features, per class', sub:'the class-conditionals'},
    {job:'fit',  lab:'choose the parameters from the data', sub:'the fit &#8212; closed form today'},
    {job:'test', lab:'turn the story around at test time', sub:'the prediction step'}],
    drag:null, wrong:0};
  M4G.chips.forEach((c,i)=>{ c.hx=30; c.hy=24+i*64; c.x=c.hx; c.y=c.hy; c.locked=false; });
}
function drawMatch4(){
  const svg=document.getElementById('m4gsvg'); if(!svg) return;
  if(!M4G) m4gInit();
  if(!svg._drag){
    svg._drag=1; svg.style.touchAction='none';
    const pos=e=>{ const r=svg.getBoundingClientRect();
      return [ (e.clientX-r.left)/r.width*900, (e.clientY-r.top)/r.height*300 ]; };
    svg.addEventListener('pointerdown',e=>{
      const [mx,my]=pos(e);
      const c=[...M4G.chips].reverse().find(c=>!c.locked && mx>=c.x&&mx<=c.x+310&&my>=c.y&&my<=c.y+52);
      if(!c) return;
      M4G.drag={c, dx:mx-c.x, dy:my-c.y};
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault(); drawMatch4();
    });
    svg.addEventListener('pointermove',e=>{
      if(!M4G.drag) return;
      const [mx,my]=pos(e);
      M4G.drag.c.x=mx-M4G.drag.dx; M4G.drag.c.y=my-M4G.drag.dy;
      drawMatch4();
    });
    const up=e=>{
      if(!M4G.drag) return;
      const c=M4G.drag.c; M4G.drag=null;
      const cx=c.x+155, cy=c.y+26;
      const k=M4G.slots.findIndex(s=>{ const sy=20+M4G.slots.indexOf(s)*66;
        return cx>=460&&cx<=880&&cy>=sy&&cy<=sy+58; });
      if(k>=0 && M4G.slots[k].job===c.job){
        c.locked=true;
      }else{
        if(k>=0){ M4G.wrong++; M4G_FLASH=k; setTimeout(()=>{M4G_FLASH=null; drawMatch4();},450); }
      }
      c.x=c.hx; c.y=c.hy;
      drawMatch4();
    };
    svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  }
  let g='<text class="legend" x="30" y="12">the pieces &#8212; drag each one right</text>'
   + '<text class="legend" x="470" y="12">the jobs in the generative model</text>';
  M4G.slots.forEach((s,i)=>{
    const y=20+i*66, hot=(M4G_FLASH===i);
    const done=M4G.chips.find(c=>c.locked&&c.job===s.job);
    if(done){
      g+='<rect x="460" y="'+y+'" width="420" height="58" rx="8" fill="var(--s4)" opacity=".16"/>'
       + '<rect x="460" y="'+y+'" width="420" height="58" rx="8" fill="none" stroke="var(--s4)" stroke-width="1.8"/>'
       + '<text class="matn" style="font-size:16.5px" x="478" y="'+(y+24)+'">'+done.lab+' &#10003; &#8212; '+s.lab+'</text>'
       + '<text class="tick" style="font-style:italic" x="478" y="'+(y+44)+'">'+s.sub+'</text>';
    }else{
      g+='<rect x="460" y="'+y+'" width="420" height="58" rx="8" fill="'+(hot?'var(--accent)':'var(--bg-alt)')
       + '" opacity="'+(hot?'.25':'1')+'" stroke="'+(hot?'var(--accent)':'var(--rule)')+'" stroke-width="1.5"'
       + (hot?'':' stroke-dasharray="5 4"')+'/>'
       + '<text class="tick" style="font-size:15px" x="670" y="'+(y+25)+'" text-anchor="middle">'+s.lab+'</text>'
       + '<text class="tick" x="670" y="'+(y+44)+'" text-anchor="middle" style="font-style:italic">'+s.sub+'</text>';
    }
  });
  const done=M4G.chips.filter(c=>c.locked).length;
  M4G.chips.forEach(c=>{
    if(c.locked) return;
    if(M4G.drag&&M4G.drag.c===c) return;
    g+=m4gChip(c);
  });
  if(M4G.drag) g+=m4gChip(M4G.drag.c);
  if(done===4)
    g+='<text class="legend" x="30" y="292" fill="var(--s4)">All four placed. Every part was already on the table &#8212; the assembly is the only new step.</text>';
  else
    g+='<text class="tick" x="30" y="292">'+done+' of 4 placed'+(M4G.wrong?' &#183; '+M4G.wrong+' wrong '+(M4G.wrong>1?'tries':'try')+' &#8212; wrong slots bounce back':'')+'</text>';
  svg.innerHTML=g;
}
function m4gChip(c){
  return '<g style="cursor:grab">'
   + '<rect x="'+c.x+'" y="'+c.y+'" width="310" height="52" rx="8" fill="var(--s1)" opacity=".18"/>'
   + '<rect x="'+c.x+'" y="'+c.y+'" width="310" height="52" rx="8" fill="none" stroke="var(--s1)" stroke-width="1.8"/>'
   + '<text class="matn" style="font-size:17px" x="'+(c.x+16)+'" y="'+(c.y+22)+'">'+c.lab+'</text>'
   + '<text class="tick" style="font-size:13.5px" x="'+(c.x+16)+'" y="'+(c.y+41)+'">'+c.sub+'</text></g>';
}
function m4gReset(){ M4G=null; drawMatch4(); }

/* ================================================================ WHICH PARADIGM, AS A GAME
   Seven situations, two columns. Drag each situation to the paradigm it favours;
   the wrong column flashes and the chip walks home; the right column keeps it and
   shows the reason. Same pointer machinery as the pieces game. */
let W4G=null, W4G_FLASH=null;
function w4gInit(){
  W4G={chips:[
    {lab:'labelled data is plentiful', side:1, why:'the boundary can be learned directly'},
    {lab:'fields go missing routinely', side:0, why:'integrating out the gap is built in'},
    {lab:'features co-vary, with no good model for it', side:1, why:'let the boundary absorb it'},
    {lab:'new classes appear over time', side:0, why:'fit the new cloud, leave the rest alone'},
    {lab:'you must generate or simulate data', side:0, why:'the fitted joint can be sampled'},
    {lab:'one question&#8217;s accuracy is all that matters', side:1, why:'spend everything on p(t | x)'},
    {lab:'labelled data is scarce', side:0, why:'the assumptions stand in for the data you lack'}],
    drag:null, wrong:0};
  W4G.chips.forEach((c,i)=>{ c.hx=335; c.hy=24+i*45; c.x=c.hx; c.y=c.hy; c.placed=false; });
}
function w4gCol(side){ return side? {x:660,name:'lean discriminative'} : {x:10,name:'lean generative'}; }
function drawWhich4(){
  const svg=document.getElementById('w4gsvg'); if(!svg) return;
  if(!W4G) w4gInit();
  if(!svg._drag){
    svg._drag=1; svg.style.touchAction='none';
    const pos=e=>{ const r=svg.getBoundingClientRect();
      return [ (e.clientX-r.left)/r.width*980, (e.clientY-r.top)/r.height*360 ]; };
    svg.addEventListener('pointerdown',e=>{
      const [mx,my]=pos(e);
      const c=[...W4G.chips].reverse().find(c=>!c.placed && mx>=c.x&&mx<=c.x+310&&my>=c.y&&my<=c.y+42);
      if(!c) return;
      W4G.drag={c, dx:mx-c.x, dy:my-c.y};
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      e.preventDefault(); drawWhich4();
    });
    svg.addEventListener('pointermove',e=>{
      if(!W4G.drag) return;
      const [mx,my]=pos(e);
      W4G.drag.c.x=mx-W4G.drag.dx; W4G.drag.c.y=my-W4G.drag.dy;
      drawWhich4();
    });
    const up=e=>{
      if(!W4G.drag) return;
      const c=W4G.drag.c; W4G.drag=null;
      const cx=c.x+155;
      const k= cx<330 ? 0 : (cx>650 ? 1 : -1);
      if(k===c.side){ c.placed=true; }
      else if(k>=0){ W4G.wrong++; W4G_FLASH=k; setTimeout(()=>{W4G_FLASH=null; drawWhich4();},450); }
      c.x=c.hx; c.y=c.hy;
      drawWhich4();
    };
    svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  }
  let g='';
  [0,1].forEach(side=>{
    const col=w4gCol(side), hot=(W4G_FLASH===side);
    g+='<rect x="'+col.x+'" y="22" width="310" height="322" rx="10" fill="'+(hot?'var(--accent)':'var(--bg-alt)')
     + '" opacity="'+(hot?'.25':'1')+'" stroke="'+(hot?'var(--accent)':'var(--rule)')+'" stroke-width="1.5"'
     + (hot?'':' stroke-dasharray="5 4"')+'/>'
     + '<text class="legend" x="'+(col.x+155)+'" y="14" text-anchor="middle">'+col.name+'&#8230;</text>';
    const placed=W4G.chips.filter(c=>c.placed&&c.side===side);
    placed.forEach((c,i)=>{
      const y=32+i*76;
      g+='<rect x="'+(col.x+8)+'" y="'+y+'" width="294" height="68" rx="8" fill="var(--s4)" opacity=".16"/>'
       + '<rect x="'+(col.x+8)+'" y="'+y+'" width="294" height="68" rx="8" fill="none" stroke="var(--s4)" stroke-width="1.6"/>'
       + '<text class="matn" style="font-size:13.5px" x="'+(col.x+20)+'" y="'+(y+24)+'">'+c.lab+' &#10003;</text>'
       + '<text class="tick" style="font-style:italic" x="'+(col.x+20)+'" y="'+(y+47)+'">'+c.why+'</text>';
    });
  });
  const left=W4G.chips.filter(c=>!c.placed).length;
  if(left)
    g+='<text class="legend" x="490" y="14" text-anchor="middle">the situations &#8212; drag each to a column</text>';
  W4G.chips.forEach(c=>{
    if(c.placed) return;
    if(W4G.drag&&W4G.drag.c===c) return;
    g+=w4gChip(c);
  });
  if(W4G.drag) g+=w4gChip(W4G.drag.c);
  g+= left===0
    ? '<text class="legend" x="490" y="200" text-anchor="middle" fill="var(--s4)">All seven placed &#8212; a per-problem decision.</text>'
    : '<text class="tick" x="490" y="356" text-anchor="middle">'+(7-left)+' of 7 placed'+(W4G.wrong?' &#183; '+W4G.wrong+' wrong &#8212; a wrong column flashes':'')+'</text>';
  svg.innerHTML=g;
}
function w4gChip(c){
  return '<g style="cursor:grab">'
   + '<rect x="'+c.x+'" y="'+c.y+'" width="310" height="42" rx="8" fill="var(--s1)" opacity=".18"/>'
   + '<rect x="'+c.x+'" y="'+c.y+'" width="310" height="42" rx="8" fill="none" stroke="var(--s1)" stroke-width="1.8"/>'
   + '<text class="matn" style="font-size:13.5px" x="'+(c.x+14)+'" y="'+(c.y+26)+'">'+c.lab+'</text></g>';
}
function w4gReset(){ W4G=null; drawWhich4(); }

const DRAW={rc4:drawRc4,gen4:drawGen4,samp4:drawSamp4,params4:drawParams4,bow4:drawBow4,counts4:drawCounts4,spam4:drawSpam4,chain4:drawChain4,vaez4:drawVaez4,match4:drawMatch4,which4:drawWhich4,naive4:drawNaive4,fit4:drawFit4,pred4:drawPred4,miss4:drawMiss4,dream4:drawDream4,dup4:drawDup4,bound4:drawBound4,hand4:drawHand4,lag4:drawLag4,vs4:drawVs4,diri4:drawDirIntro4,dir4:drawDir4,lgsurf4:drawLgSurf4,lgperp4:drawLgPerp4,lgtan4:drawLgTan4,spam4z:drawSpam4Z,learn4:drawLearn4,vae4:drawVae4,diff4:drawDiff4};
document.getElementById('p4m')?.addEventListener('input',e=>{P4_E=+e.target.value;drawParams4();});
document.getElementById('sp4a')?.addEventListener('input',e=>{SP4_A=+e.target.value;drawSpam4();});
document.getElementById('pr4a')?.addEventListener('input',e=>{PR4[0]=+e.target.value;drawPred4();});
document.getElementById('pr4m')?.addEventListener('input',e=>{PR4[1]=+e.target.value;drawPred4();});
document.getElementById('m4a')?.addEventListener('input',e=>{M4[0]=+e.target.value;drawMiss4();});
document.getElementById('m4m')?.addEventListener('input',e=>{M4[1]=+e.target.value;drawMiss4();});
document.getElementById('du4a')?.addEventListener('input',e=>{DU4[0]=+e.target.value;drawDup4();});
document.getElementById('du4m')?.addEventListener('input',e=>{DU4[1]=+e.target.value;drawDup4();});
document.getElementById('df4t')?.addEventListener('input',e=>{DF_T=+e.target.value;drawDiff4();});
['dr4a1','dr4a2','dr4a3'].forEach((id,i)=>{document.getElementById(id)?.addEventListener('input',e=>{DR4_A[i]=+e.target.value;drawDir4();});});
document.addEventListener('click',e=>{ const t=e.target; if(!t) return;
  const n=t.closest&&t.closest('[data-n4]'); if(n){ N4_MODE=n.dataset.n4; drawNaive4(); }
  const b=t.closest&&t.closest('[data-b4]'); if(b){ B4_SHARED=(b.dataset.b4==='shared'); drawBound4(); }
  const h=t.closest&&t.closest('[data-h4]'); if(h){ H4_STEP=+h.dataset.h4; drawHand4(); }
  if(t.id==='s4f')  s4Flip();
  if(t.id==='s42')  s4Feat();
  if(t.id==='s4sp') s4Draw(30);
  if(t.id==='s4e'){ S4_ELL=!S4_ELL; drawSamp4(); }
  if(t.id==='s4r')  s4Reset();
  if(t.id==='m4x'){ M4_NOM=!M4_NOM; drawMiss4(); }
  if(t.id==='m4y'){ M4_NOA=!M4_NOA; drawMiss4(); }
  if(t.id==='g41')  g4Draw();
  if(t.id==='ch41') ch4Draw(1);
  if(t.id==='ch4sp') ch4Draw(20);
  if(t.id==='ch4r') ch4Reset();
  if(t.id==='m4gr') m4gReset();
  if(t.id==='w4gr') w4gReset();
  if(t.id==='lg4mx') lag4Snap();
  if(t.id&&t.id.slice(0,5)==='lgs4b') lgs4Step(+t.id.slice(5));
  if(t.id==='lgt4max') lgt4Mode('max');
  if(t.id==='lgt4min') lgt4Mode('min');
  if(t.id==='df4rs') df4Resample();
  if(t.id==='g4r')  g4Reset();
});

/* Click-to-advance, but never from a control. We remember where the pointer went DOWN:
   dragging a slider and releasing over the slide would otherwise fire a click on the
   slide and skip a page. */
const CONTROLS='input,button,a,select,textarea,label,.demo,.demo-ctrl,.bbtn,.basisbtns,video,iframe,svg';
let downInControl=false;
canvas.addEventListener('pointerdown',e=>{ downInControl=!!(e.target.closest&&e.target.closest(CONTROLS)); });
canvas.addEventListener('click',e=>{
  if(document.body.classList.contains('inking')) return;
  if(downInControl){ downInControl=false; return; }
  if(e.target.closest&&e.target.closest(CONTROLS)) return;
  next(); });

/* ============================================================
   ANNOTATION LAYER
   Draw over the slide with a mouse, trackpad or pen tablet. Pen pressure is
   used for stroke width when the device reports it. Ink is kept per slide.
   D toggles · E eraser · C clears the current slide · strokes survive navigation.
   ============================================================ */
const ink=document.getElementById('ink'), ictx=ink.getContext('2d');
let inkColor='#9B2C2C', inkWidth=2.2, drawing=false, erasing=false, inkStore={};
function sizeInk(){
  const r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  const keep=ink.width?ictx.getImageData(0,0,ink.width,ink.height):null;
  ink.width=w*r; ink.height=h*r; ink.style.width=w+'px'; ink.style.height=h+'px';
  ictx.setTransform(r,0,0,r,0,0); ictx.lineCap='round'; ictx.lineJoin='round';
  if(keep) try{ictx.putImageData(keep,0,0);}catch(_){}
}
addEventListener('resize',sizeInk); sizeInk();
function toggleInk(){
  document.body.classList.toggle('inking');
  document.querySelectorAll('.ib-sw').forEach(sw=>sw.classList.toggle('sel',sw.dataset.c===inkColor));
}
function clearInk(){ ictx.clearRect(0,0,ink.width,ink.height); delete inkStore[idx]; }
function saveInk(){ try{ inkStore[idx]=ink.toDataURL(); }catch(_){} }
function loadInk(i){
  ictx.clearRect(0,0,ink.width,ink.height);
  const d=inkStore[i]; if(!d) return;
  const im=new Image(); im.onload=()=>{ ictx.globalCompositeOperation='source-over'; ictx.drawImage(im,0,0,ink.width/(devicePixelRatio||1),ink.height/(devicePixelRatio||1)); }; im.src=d;
}
ink.addEventListener('pointerdown',e=>{ drawing=true; ink.setPointerCapture(e.pointerId);
  ictx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ictx.strokeStyle=inkColor; ictx.beginPath(); ictx.moveTo(e.clientX,e.clientY); });
ink.addEventListener('pointermove',e=>{ if(!drawing) return;
  /* pen pressure scales the chosen nib; a mouse just uses the nib width */
  const nib = erasing ? inkWidth*8 : inkWidth;
  ictx.lineWidth = (e.pressure>0 && e.pressure<1) ? nib*(0.45+1.3*e.pressure) : nib;
  ictx.lineTo(e.clientX,e.clientY); ictx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>ink.addEventListener(t,()=>{ if(drawing){drawing=false; saveInk();} }));
document.querySelectorAll('.ib-sw').forEach(sw=>sw.onclick=()=>{ inkColor=sw.dataset.c; setEraser(false);
  document.querySelectorAll('.ib-sw').forEach(o=>o.classList.toggle('sel',o===sw)); });
function setEraser(on){ erasing=on;
  document.getElementById('ib-eraser').classList.toggle('sel',on); }
document.getElementById('ib-eraser').onclick=()=>setEraser(!erasing);
document.querySelectorAll('.ib-sz').forEach(b=>b.onclick=()=>{ inkWidth=+b.dataset.w;
  document.querySelectorAll('.ib-sz').forEach(o=>o.classList.toggle('sel',o===b)); });
document.getElementById('ib-clear').onclick=clearInk;
document.getElementById('ib-off').onclick=toggleInk;

/* A centred paragraph should span its container. The global p{max-width:62ch} keeps
   body copy readable, but on a centred line it leaves the text in a narrow box pinned
   to the left, which reads as mis-centred. Runs once over every slide paragraph. */
/* Scale each site preview so a 1440px-wide render fits the box exactly. */
function fitSiteFrames(){
  document.querySelectorAll('.siteframe').forEach(function(f){
    const ifr=f.querySelector('iframe'); if(!ifr) return;
    const w=f.clientWidth; if(!w) return;
    ifr.style.transform='scale('+(w/1440)+')';
  });
}
addEventListener('resize',fitSiteFrames);

function spreadCentredText(){
  document.querySelectorAll('.slide p, .slide .figcap, .slide .lede').forEach(function(p){
    /* max-width only: an auto inline margin would make a flex item shrink-wrap
       instead of stretching, which is the very problem we are fixing. */
    if(getComputedStyle(p).textAlign === 'center') p.style.maxWidth='none';
  });
}

/* ---- presenter clock ---- P starts/stops. Shows elapsed time and how far
   ahead or behind the planned cumulative time you are at this slide. ---- */
let t0=null, tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updClock(){
  if(t0===null) return;
  const el=(performance.now()-t0)/60000;               // minutes elapsed
  document.getElementById('cl-el').textContent=fmt(performance.now()-t0);
  const plan=cumMin(idx), d=el-plan;
  const dl=document.getElementById('cl-dl');
  dl.textContent=(d>=0?'+':'&#8722;').replace('&#8722;','-')+Math.abs(d).toFixed(1)+'m vs plan ('+plan.toFixed(0)+'m / '+EST_TOTAL.toFixed(0)+'m)';
  dl.className='dl '+(d>0.5?'behind':(d<-0.5?'ahead':''));
}
function toggleClock(){
  document.body.classList.toggle('timing');
  if(document.body.classList.contains('timing')){ t0=performance.now(); tick=setInterval(updClock,1000); updClock(); }
  else { clearInterval(tick); t0=null; }
}

setTheme('paper');
spreadCentredText();
renderTeX();
fitSiteFrames();
highlight();

/* ---- YouTube facade -------------------------------------------------------------
   `button` and `iframe` are already in CONTROLS, so neither the play button nor the player
   advances the slide on click.

   YouTube's player refuses an opaque origin: opened straight from Finder this page is
   file://, and the embed dies with "Error 153 - video player configuration error". There is
   no embed parameter that fixes it. So served over http(s) we play inline, and off the disk
   we hand off to youtube.com in a new tab. */
const CAN_EMBED = location.protocol === 'http:' || location.protocol === 'https:';
function closeYT(w){
  const f=w.querySelector('iframe'); if(f) f.remove();
  const b=w.querySelector('.ytfacade'); if(b) b.style.display='';
  w.classList.remove('live');
}
document.querySelectorAll('.ytwrap').forEach(w=>{
  const btn=w.querySelector('.ytfacade');
  if(!CAN_EMBED){
    const b=w.querySelector('.vidbadge'); if(b) b.textContent='Video \u2192 YouTube';
    btn.title='Opens on YouTube \u2014 inline playback needs the deck served over http, not opened from disk';
  }
  btn.addEventListener('click',()=>{
    if(!CAN_EMBED){ window.open('https://www.youtube.com/watch?v='+w.dataset.yt,'_blank','noopener'); return; }
    if(w.classList.contains('live')) return;
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+w.dataset.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title=w.dataset.title||'Video';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    btn.style.display='none';
    w.appendChild(f);
    w.classList.add('live');
  });
});

paint();

/* ---------- PRINT: every slide, every fragment, every figure ----------
   Every slide is in the DOM, but paint() draws only the current slide's figure and
   reveals only the fragments up to the current step -- so an unprepared print gives
   one slide and a lot of empty boxes. Before the browser lays out the pages, reveal
   every fragment and run every registered draw function once. A dark theme is swapped
   to paper for the duration: black pages are not a kindness to anyone's printer.
   ?print in the URL prepares the same way at load, which is how the PDFs are made. */
let PRINT_THEME=null;
function preparePrint(){
  PRINT_THEME=document.body.dataset.theme;
  if(PRINT_THEME==='nocturne') document.body.dataset.theme='paper';
  document.querySelectorAll('.frag').forEach(e=>e.classList.add('on'));
  Object.keys(DRAW).forEach(k=>{ try{ DRAW[k](); }catch(err){} });
}
function restorePrint(){
  if(PRINT_THEME) document.body.dataset.theme=PRINT_THEME;
  document.querySelectorAll('.frag').forEach(e=>e.classList.remove('on'));
  paint();
}
addEventListener('beforeprint',preparePrint);
addEventListener('afterprint',restorePrint);
if(/[?&]print/.test(location.search)) preparePrint();

</script>
