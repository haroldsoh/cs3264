<title>CS3264 · Lecture 4 — Naive Bayes</title>
<!-- KaTeX, bundled locally in media/katex so the deck still works with no network -->
<link rel="stylesheet" href="media/katex/katex.min.css">
<script defer src="media/katex/katex.min.js"></script>
<style>
/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank
   ============================================================ */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide transition: opacity only, short, and NO transform.
   A transform (especially a scale) promotes the slide to a composited layer and
   re-rasterises the text, which makes heavy glyphs read as arriving before light
   ones. Nothing that carries text is allowed to animate transform or scale. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s linear,visibility .14s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.leaving{opacity:0}

/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
li.qz::before{display:none}li.qz{padding-left:6px}
.demo-ctrl{flex:.72}
.ctrl-row{margin-bottom:18px}
.ctrl-row label{font-family:var(--font-sans);font-size:11.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:8px}
.ctrl-row .val{color:var(--accent);font-weight:700;font-size:14.5px;letter-spacing:0}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:var(--rule);outline:none;cursor:pointer}

/* ---------- PRINT: one page per slide ----------
   The deck is a 1280x720 design canvas that fit() scales to the window. For print we
   drop that scale, let the slides flow one after another instead of stacking, and set
   the page to the same 1280x720 -- 13.333in x 7.5in at 96dpi, the standard widescreen
   slide size -- so a printed page is what the projector shows, at 1:1.
   Chrome's "Save as PDF" destination turns this into a deck PDF. */
@media print{
  @page{ size:13.333in 7.5in; margin:0 }
  html,body{height:auto;overflow:visible}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none}

    background:transparent;transition:none}
  .slide{position:relative;inset:auto;width:1280px;height:720px;overflow:hidden;
    background:var(--bg);opacity:1!important;visibility:visible!important;
    transition:none!important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .frag{opacity:1!important}
  /* presenter chrome has no business on paper */
  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}

{s:"Recap", t:"Logistic regression, in one slide", html:`
  <div class="eyebrow">Last week&#8217;s model</div>
  <h2 style="margin-bottom:14px">Logistic regression, in one slide</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,330px)">
    <div style="font-size:20px"><strong>Data</strong></div><div class="eq" style="margin:0;text-align:left"><span class="tex" data-tex="\\mathcal{D} = \\{(\\mathbf{x}_n,t_n)\\},\\ t_n \\in \\{0,1\\}"></span></div>
    <div class="dnote">labels, not numbers</div>
    <div class="frag" data-f="0" style="font-size:20px"><strong>Function</strong></div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="tex" data-tex="y = \\sigma(\\mathbf{w}^\\top\\mathbf{x})"></span></div>
    <div class="dnote frag" data-f="0">the parameter &#956; &#8212; score, squashed</div>
    <div class="frag" data-f="1" style="font-size:20px"><strong>Likelihood</strong></div><div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="tex" data-tex="p(\\mathbf{t} \\mid \\mathbf{X},\\mathbf{w}) = \\prod_n \\mathrm{Bern}\\bigl(t_n \\mid y_n\\bigr)"></span></div>
    <div class="dnote frag" data-f="1">a Bernoulli per observation</div>
    <div class="frag" data-f="2" style="font-size:20px"><strong>Loss</strong></div><div class="eq frag" data-f="2" style="margin:0;text-align:left"><span class="tex" data-tex="-\\sum_n \\bigl[t_n \\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr]"></span></div>
    <div class="dnote frag" data-f="2">cross-entropy &#8212; its negative log</div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:16px;text-align:center">
    No closed form; fitted by gradient descent with <span class="tex" data-tex="\\sum_n (y_n-t_n)\\mathbf{x}_n"></span>. The prior added the
    regulariser, the posterior needed Laplace.</p>`},

    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Discriminative &#8212; Lectures 1&#8211;3</div>
      <div class="eq" style="margin:4px 0 8px;font-size:21px"><span class="texd" data-tex="p(t \\mid \\mathbf{x})"></span></div>
      <p style="font-size:20px;max-width:none">Model the <strong>conditional</strong>: the label given
      the features. It answers one fixed question about the data; where the features themselves
      come from is left unmodelled.</p>
    </div>
    <div class="col card accent frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Generative &#8212; today</div>
      <div class="eq" style="margin:4px 0 8px;font-size:21px"><span class="texd" data-tex="p(\\mathbf{x}, t) = p(\\mathbf{x} \\mid t)\\,p(t)"></span></div>
      <p style="font-size:20px;max-width:none">Model the <strong>joint</strong>: how a whole labelled
      row comes to exist. A <strong>generative model</strong> is a model of the data itself &#8212;
      a story you can <strong>run</strong>, and out come rows that look like your dataset.</p>
    </div>
  </div>
  <div class="card frag" data-f="1" style="margin-top:16px;padding:14px 22px">
    <p style="font-size:20.5px;max-width:none">At test time the generative model still answers the
    dealer&#8217;s question &#8212; through <strong>Bayes&#8217; rule</strong>: <span class="tex" data-tex="p(t \\mid \\mathbf{x}) \\propto p(\\mathbf{x} \\mid t)\\,p(t)"></span></p>
  </div>`},

{s:"Part I", t:"Why model the data itself?", html:`
  <div class="eyebrow">The case for the harder job</div>
  <h2 style="margin-bottom:14px">Why model the data itself?</h2>
  <div class="row top stretch" style="gap:20px">
    <div class="col card accent frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">You can sample</div>
      <p style="font-size:19px;max-width:none">Run the story forwards and the
      model <strong>produces data</strong>: a plausible listing, a sentence, an image. <span class="tex" data-tex="p(t \\mid \\mathbf{x})"></span> by itself
      defines no distribution over <span class="tex" data-tex="\\mathbf{x}"></span> to sample from.</p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px">Missing features</div>
      <p style="font-size:19px;max-width:none">A model of <span class="tex" data-tex="\\mathbf{x}"></span> can
      <strong>integrate out</strong> what it did not observe &#8212; Part III shows this costing
      one line.</p>
    </div>
    <div class="col card frag" data-f="2">
      <div class="eyebrow" style="margin-bottom:8px">Scarce labels, new classes</div>
      <p style="font-size:19px;max-width:none">Each class is fitted on its
      own, so a new class is one new fit &#8212; and the story&#8217;s assumptions stand in for the
      data you lack.</p>
    </div>
    <div class="col card frag" data-f="3">
      <div class="eyebrow" style="margin-bottom:8px">The unfamiliar</div>
      <p style="font-size:19px;max-width:none"><span class="tex" data-tex="p(\\mathbf{x})"></span> is a direct estimate of how unusual an
      input is: when it is tiny, the model can say &#8220;unlike anything I fitted&#8221;. The
      epistemic uncertainty of Weeks 2&#8211;3 is about <span class="tex" data-tex="\\mathbf{w}"></span>, not <span class="tex" data-tex="\\mathbf{x}"></span>.</p>
    </div>
  </div>
  <p class="caption frag" data-f="4" style="margin-top:14px">The cost, stated now and weighed in
  Part III: modelling all of <span class="tex" data-tex="\\mathbf{x}"></span> is a harder job than drawing one boundary, and if the story is
  wrong, the answers inherit the error.</p>`},

{s:"Part I", t:"Generative models, today", html:`
  <div class="eyebrow">The modern family</div>
  <h2 style="margin-bottom:10px">Where today&#8217;s generative models sit</h2>
  <p style="font-size:19px;margin-bottom:10px">A language model generates text; a diffusion model
  generates images. Both are <strong>generative models</strong>: they model the data itself, and
  generation and scoring are queries against that model. The families differ in how they write <span class="tex" data-tex="p(\\mathbf{x})"></span> down
  &#8212; and that choice decides what each can do.</p>
  <table style="font-size:17.5px">
    <thead><tr><th style="width:27%">Family</th><th style="width:37%">How it writes the story</th><th style="width:12%">Evaluate <span class="tex" data-tex="p(\\mathbf{x})"></span>?</th><th style="width:12%">Sample?</th><th style="width:12%">Latent?</th></tr></thead>
    <tbody>
      <tr><td><strong>Naive Bayes, GMM</strong></td><td>a simple parametric cloud per class</td><td>yes</td><td>yes</td><td>the class</td></tr>
      <tr class="frag" data-f="0"><td><strong>Autoregressive</strong> &#183; language models</td><td>the product rule, one token at a time</td><td>yes</td><td>yes</td><td>none</td></tr>
      <tr class="frag" data-f="1"><td><strong>VAE</strong></td><td>draw a code, decode it to data</td><td>a bound</td><td>yes</td><td>yes</td></tr>
      <tr class="frag" data-f="2"><td><strong>Diffusion</strong></td><td>learn to undo noise, step by step</td><td>a bound</td><td>yes, slowly</td><td>the noise path</td></tr>
      <tr class="frag" data-f="3"><td><strong>Normalising flow</strong></td><td>an invertible map from a simple density</td><td>yes</td><td>yes</td><td>yes</td></tr>
      <tr class="frag" data-f="4"><td><strong>GAN</strong></td><td>a generator judged by a critic</td><td>no</td><td>yes</td><td>yes</td></tr>
    </tbody>
  </table>
  <p class="caption" style="margin-top:12px">The last three columns are what each
  family can be asked for: a value of <span class="tex" data-tex="p(\\mathbf{x})"></span> (outlier detection, compression), samples (generation),
  a latent variable (structure to explore). We start at the first row &#8212;
  naive Bayes, the one fitted by counting. That is today.</p>`},

{s:"Part I", t:"What they produce", html:`
  <div class="eyebrow">The same paradigm, three outputs</div>
  <h2 style="margin-bottom:10px">Run the story forwards and this comes out</h2>
  <div class="row top stretch" style="gap:20px">
    <div class="col card" style="padding:14px 16px">
      <div class="eyebrow" style="margin-bottom:8px">A language model &#183; text</div>
      <div style="font-family:var(--font-mono);font-size:15px;line-height:1.55;background:var(--bg-alt);border-radius:6px;padding:10px 12px">
        <span style="opacity:.65">The 2019 hatchback, one owner and</span><br>
        <span style="border-bottom:2px solid var(--s1)">full service history,</span>

        <span style="border-bottom:2px solid var(--s1)">nine days.</span>
      </div>
      <p class="caption" style="margin-top:8px">dimmed: the prompt; underlined: generated, one
      token at a time, each drawn from <span class="tex" data-tex="p(x^i \\mid x^{<i})"></span> &#8212; the product rule as a story (schematic).</p>
    </div>
    <div class="col card frag" data-f="0" style="padding:14px 16px">
      <div class="eyebrow" style="margin-bottom:8px">A VAE &#183; a whole space of digits</div>
      <img src="media/vae-manifold.png" style="width:100%;border-radius:4px" alt="learned MNIST manifold">
      <p class="caption" style="margin-top:8px">the learned 2-D latent space, decoded over a grid
      &#8212; Kingma &amp; Welling (2014), Fig.&#8201;4b.</p>

    <div class="col card frag" data-f="1" style="padding:14px 16px">

      <img src="media/ddpm-faces.png" style="width:100%;border-radius:4px" alt="DDPM CelebA-HQ samples">
      <p class="caption" style="margin-top:8px">faces sampled from the model &#8212;
      Ho, Jain &amp; Abbeel (2020), Fig.&#8201;1, CelebA-HQ.</p>
    </div>
  </div>`},

{s:"Part I", t:"The story, run backwards", draw:"gen4", html:`
  <div class="eyebrow">Notion before notation</div>
  <h2 style="margin-bottom:10px">The story, run backwards</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:8px">
    <svg viewBox="0 0 900 140"><g id="gen4fig"></g></svg>
  </div>
  <div class="row top frag" data-f="0" style="gap:30px;margin-top:6px">
    <div class="col">
      <p style="font-size:20.5px">Last week the coin came <strong>last</strong>. Here it comes
      <strong>first</strong>: the class is decided, and the features are drawn from that
      class&#8217;s own distribution.</p>
    </div>
    <div class="col">
      <p style="font-size:20.5px">Two ingredients, then: the coin&#8217;s parameter <span class="tex" data-tex="\\pi"></span> &#8212; the
      <strong>class prior</strong> &#8212; and one distribution over features <strong>per
      class</strong>, <span class="tex" data-tex="p(\\mathbf{x} \\mid t)"></span> &#8212; the <strong>class-conditionals</strong>.</p>
    </div>
  </div>`},

{s:"Part I", t:"How a dataset is generated", draw:"samp4", html:`
  <div class="eyebrow">Live demo &#183; run the story</div>
  <h2 style="margin-bottom:10px">Run the story and a dataset falls out</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="s4svg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:19px"><span class="texd" data-tex="t \\sim \\mathrm{Bern}(\\pi), \\qquad \\mathbf{x} \\sim p(\\mathbf{x} \\mid t)"></span></div>
      <div style="display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="s4f" type="button">1 &#183; flip the class</button>
        <button class="bbtn" id="s42" type="button">2 &#183; draw the features</button>
        <button class="bbtn" id="s4sp" type="button">thirty at once</button>
      </div>
      <div style="display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="s4e" type="button">show the two distributions</button>
        <button class="bbtn" id="s4r" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">listings generated</span><span class="v" id="s4n">0</span></div>
      <div class="warn" id="s4warn" style="min-height:66px"></div>
    </div>
  </div>`},

{s:"Part I", t:"Predict first", html:`
  <div class="actbadge">Predict first</div>
  <div class="actq" style="font-size:25px;margin:12px 0 10px">You know both clouds &#8212; each
  class&#8217;s distribution &#8212; and how common each class is. A new car arrives at <span class="tex" data-tex="\\mathbf{x}_\\ast"></span>.
  How should you classify it?</div>
  <div class="row" style="gap:20px;margin-top:14px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">A</div><p style="font-size:19.5px;max-width:none">Assign it to the cloud whose <strong>centre is nearest</strong>.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">B</div><p style="font-size:19.5px;max-width:none">Assign it to the class under which this <span class="tex" data-tex="\\mathbf{x}_\\ast"></span> is <strong>most probable</strong>, weighted by how common the class is.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">C</div><p style="font-size:19.5px;max-width:none">Ignore the clouds and fit last week&#8217;s line.</p></div>
  </div>
  <p class="caption frag" data-f="0" style="margin-top:16px;text-align:center">Commit to one.
  Nearest-centre ignores both the spreads and the class frequencies &#8212; B uses everything the
  story gives us.</p>`},

{s:"Part I", t:"Bayes at test time", html:`
  <div class="eyebrow">The answer is B &#8212; and it is a rule you know</div>
  <h2 style="margin-bottom:14px">Bayes&#8217; rule turns the story around</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,300px)">
    <div style="font-size:20px">the story gives</div><div class="eq" style="margin:0"><span class="tex" data-tex="p(\\mathbf{x} \\mid t)\\,p(t)"></span></div>
    <div class="dnote">how a labelled row is produced</div>
    <div class="frag" data-f="0" style="font-size:20px">the dealer wants</div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="tex" data-tex="p(t \\mid \\mathbf{x})"></span></div>
    <div class="dnote frag" data-f="0">the label, given the row</div>
    <div class="frag" data-f="1" style="font-size:20px">Bayes&#8217; rule</div><div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="texd" data-tex="p(t \\mid \\mathbf{x}) = \\frac{p(\\mathbf{x} \\mid t)\\,p(t)}{\\sum_{t'} p(\\mathbf{x} \\mid t')\\,p(t')}"></span></div>
    <div class="dnote frag" data-f="1">the denominator is the sum of the numerators</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:14px 22px">
    <p style="font-size:20.5px;max-width:none">Lecture 2&#8217;s disease example was exactly this:
    the lab measures <span class="tex" data-tex="p({+}\\mid D)"></span> &#8212; the test result given the illness &#8212; and the patient wants
    <span class="tex" data-tex="p(D \\mid {+})"></span>. You have already run a generative classifier by hand.</p>
  </div>`},

{s:"Part I", t:"Part I in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part I in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The split</div><p style="font-size:20px;max-width:none">Discriminative models answer one question, <span class="tex" data-tex="p(t \\mid \\mathbf{x})"></span>. Generative models tell the data&#8217;s whole story, <span class="tex" data-tex="p(\\mathbf{x}, t)"></span> &#8212; and can be run to produce data.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Two ingredients</div><p style="font-size:20px;max-width:none">A class prior <span class="tex" data-tex="p(t)"></span> and one class-conditional <span class="tex" data-tex="p(\\mathbf{x} \\mid t)"></span> per class; Bayes&#8217; rule turns the story around at test time.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The plan</div><p style="font-size:20px;max-width:none">LLMs and diffusion models live in this paradigm. We start with naive Bayes &#8212; the member fitted by counting.</p></div>
  </div>`},

{s:"Part I", t:"Questions (Part I)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About the generative flip, or discriminative versus generative</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part II", t:"Part II", div:true, html:`
  <div class="divider">
    <div class="part">Part II</div>
    <h1>Naive Bayes</h1>
    <div class="bar"></div>
    <div class="sub">One assumption makes the whole thing countable.</div>
  </div>`},

{s:"Part II", t:"The setup", html:`
  <div class="eyebrow">Data, model, loss</div>
  <h2 style="margin-bottom:14px">Write the model down</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,330px)">
    <div style="font-size:20px"><strong>Data</strong></div><div class="eq" style="margin:0;text-align:left"><span class="tex" data-tex="\\mathcal{D} = \\{(\\mathbf{x}_n, t_n)\\}_{n=1}^{N}"></span></div>
    <div class="dnote"><span class="tex" data-tex="M"></span> features per row: <span class="tex" data-tex="x_n^m"></span> is feature <span class="tex" data-tex="m"></span> of listing <span class="tex" data-tex="n"></span></div>
    <div class="frag" data-f="0" style="font-size:20px"><strong>Prior</strong></div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="tex" data-tex="p(t) = \\mathrm{Bern}(t \\mid \\pi)"></span></div>
    <div class="dnote frag" data-f="0">the coin from the story</div>
    <div class="frag" data-f="1" style="font-size:20px"><strong>Class-conditionals</strong></div><div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="tex" data-tex="p(\\mathbf{x} \\mid t, \\boldsymbol{\\theta})"></span></div>
    <div class="dnote frag" data-f="1">one distribution over rows, per class &#8212; still to be chosen</div>
    <div class="frag" data-f="2" style="font-size:20px"><strong>Loss</strong></div><div class="eq frag" data-f="2" style="margin:0;text-align:left"><span class="tex" data-tex="\\min_{\\boldsymbol{\\theta}}\\ {-\\ln p(\\mathcal{D} \\mid \\boldsymbol{\\theta})}"></span></div>
    <div class="dnote frag" data-f="2">MLE &#8212; pick the parameters that make the data we saw most probable</div>
  </div>
  <p class="figcap frag" data-f="3" style="margin-top:16px;text-align:center">
    One question stands open: what should a distribution over whole rows,
    <span class="tex" data-tex="p(\\mathbf{x} \\mid t)"></span>, actually <em>be</em>?</p>`},

{s:"Part II", t:"Old pieces, new jobs", draw:"match4", html:`
  <div class="eyebrow">Interactive &#183; nothing here is new machinery</div>
  <h2 style="margin-bottom:8px">Match each piece to its job</h2>
  <p style="font-size:19px;margin-bottom:6px">Every part of this model is one you have met.
  <strong>Drag</strong> each piece onto the job it does here &#8212; a wrong slot bounces back.</p>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0">
    <svg id="m4gsvg" viewBox="0 0 900 300" style="width:100%;display:block"></svg>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="bbtn" id="m4gr" type="button">reset</button>
  </div>`},

{s:"Part II", t:"The joint is too big", draw:"params4", html:`
  <div class="eyebrow">Live demo &#183; count the parameters</div>
  <h2 style="margin-bottom:10px">A distribution over whole rows is a big object</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="p4svg" viewBox="0 0 560 200"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">Our cars have two features. A spam filter looking
      at word counts has <strong>thousands</strong> &#8212; and a full joint over them needs a
      parameter for every way the features can co-vary.</p>
      <div class="ctrl-row" style="margin-top:10px"><label>features M <span class="val" id="p4mv">16</span></label>
        <input type="range" id="p4m" min="1" max="13" step="1" value="4"></div>
      <div class="warn" id="p4warn">With more parameters than data, most cells get few or no examples
      to estimate from. The way out is an assumption that cuts the count down to
      <strong>linear in M</strong>.</div>
    </div>
  </div>`},

{s:"Part II", t:"The naive assumption", draw:"naive4", html:`
  <div class="eyebrow">Live demo &#183; what it keeps, what it drops</div>
  <h2 style="margin-bottom:10px">Within a class, treat the features as independent</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="n4svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="p(\\mathbf{x} \\mid t) = \\prod_{m=1}^{M} p(x^m \\mid t) = \\prod_{m=1}^{M} \\mathcal{N}\\bigl(x^m \\mid \\mu_t^m, v_t^m\\bigr)"></span></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="bbtn sel" data-n4="naive" type="button">naive</button>
        <button class="bbtn" data-n4="full" type="button">full</button>
        <button class="bbtn" data-n4="both" type="button">both</button>
      </div>
      <div class="warn" id="n4warn" style="min-height:88px"></div>
      <p class="caption" style="margin-top:8px">Conditional independence, not independence: age and
      mileage are correlated <em>across</em> the whole lot &#8212; old cars have more kilometres
      &#8212; while <em>within</em> one class the model treats them as unrelated. Lecture 2&#8217;s
      distinction, load-bearing at last.</p>
    </div>
  </div>`},

{s:"Part II", t:"The likelihood", html:`
  <div class="eyebrow">Step 1 &#8212; the probability of the data</div>
  <h2 style="margin-bottom:16px">The likelihood, with the switch trick again</h2>
  <div style="display:grid;grid-template-columns:290px minmax(0,1fr);column-gap:26px;row-gap:20px;align-items:center">
    <div><div style="font-size:19.5px">start from i.i.d. rows</div>
      <div class="dnote" style="margin-top:4px">each row is class prior &#215; class-conditional</div></div>
    <div class="eq" style="margin:0;font-size:19.5px;text-align:left"><span class="tex" data-tex="p(\\mathcal{D} \\mid \\boldsymbol{\\theta}) = \\prod_{n=1}^{N} p(\\mathbf{x}_n \\mid t_n, \\boldsymbol{\\theta})\\, p(t_n \\mid \\boldsymbol{\\theta})"></span></div>
    <div class="frag" data-f="0"><div style="font-size:19.5px">one row&#8217;s factor, with the switch</div>
      <div class="dnote" style="margin-top:4px"><span class="tex" data-tex="t_n"></span> switches on the first bracket when the row sold,
      the second when it did not &#8212; Lecture 3&#8217;s Bernoulli trick</div></div>
    <div class="eq frag" data-f="0" style="margin:0;font-size:18px;text-align:left"><span class="tex" data-tex="\\Bigl[\\pi \\prod_m \\mathcal{N}(x_n^m \\mid \\mu_1^m, v_1^m)\\Bigr]^{t_n} \\Bigl[(1-\\pi) \\prod_m \\mathcal{N}(x_n^m \\mid \\mu_0^m, v_0^m)\\Bigr]^{1-t_n}"></span></div>
    <div class="frag" data-f="1"><div style="font-size:19.5px">all <span class="tex" data-tex="N"></span> rows together</div>
      <div class="dnote" style="margin-top:4px">the whole model, written out</div></div>
    <div class="eq frag" data-f="1" style="margin:0;font-size:18px;text-align:left"><span class="tex" data-tex="p(\\mathcal{D} \\mid \\boldsymbol{\\theta}) = \\prod_{n=1}^{N} \\Bigl[\\pi \\prod_m \\mathcal{N}(x_n^m \\mid \\mu_1^m, v_1^m)\\Bigr]^{t_n} \\Bigl[(1-\\pi) \\prod_m \\mathcal{N}(x_n^m \\mid \\mu_0^m, v_0^m)\\Bigr]^{1-t_n}"></span></div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:18px;padding:13px 20px">
    <p style="font-size:20px;max-width:none">Every factor is something we can write down: <span class="tex" data-tex="\\pi"></span> or
    <span class="tex" data-tex="1-\\pi"></span> from the coin, and one Gaussian per feature, from the class the row belongs to.</p>
  </div>`},

{s:"Part II", t:"The log splits", html:`
  <div class="eyebrow">Step 2 &#8212; take the log</div>
  <h2 style="margin-bottom:14px">The log-likelihood falls into four separate sums</h2>
  <div class="eq" style="margin:4px 0 14px;font-size:20px"><span class="texd" data-tex="\\ln p(\\mathcal{D}\\mid\\boldsymbol{\\theta}) = \\underbrace{\\sum_n t_n \\ln \\pi}_{A} + \\underbrace{\\sum_n (1-t_n)\\ln(1-\\pi)}_{B} + \\underbrace{\\sum_n \\sum_m t_n \\ln \\mathcal{N}(x_n^m \\mid \\mu_1^m, v_1^m)}_{C} + \\underbrace{\\sum_n \\sum_m (1-t_n) \\ln \\mathcal{N}(x_n^m \\mid \\mu_0^m, v_0^m)}_{D}"></span></div>
  <div class="row top stretch" style="gap:16px">
    <div class="col card frag" data-f="0" style="padding:12px 16px"><div class="eyebrow" style="margin-bottom:6px">A</div>
      <div class="eq" style="margin:0;font-size:15.5px;white-space:nowrap"><span class="tex" data-tex="\\textstyle\\sum_n t_n \\ln \\pi"></span></div><p class="caption" style="margin-top:6px">only <span class="tex" data-tex="\\pi"></span></p></div>
    <div class="col card frag" data-f="1" style="padding:12px 16px"><div class="eyebrow" style="margin-bottom:6px">B</div>
      <div class="eq" style="margin:0;font-size:15.5px;white-space:nowrap"><span class="tex" data-tex="\\textstyle\\sum_n (1-t_n)\\ln(1-\\pi)"></span></div><p class="caption" style="margin-top:6px">only <span class="tex" data-tex="\\pi"></span></p></div>
    <div class="col card frag" data-f="2" style="padding:12px 16px"><div class="eyebrow" style="margin-bottom:6px">C</div>
      <div class="eq" style="margin:0;font-size:15.5px;white-space:nowrap"><span class="tex" data-tex="\\textstyle\\sum_{n,m} t_n \\ln \\mathcal{N}(x_n^m \\mid \\mu_1^m, v_1^m)"></span></div><p class="caption" style="margin-top:6px">only class-1 params</p></div>
    <div class="col card frag" data-f="3" style="padding:12px 16px"><div class="eyebrow" style="margin-bottom:6px">D</div>
      <div class="eq" style="margin:0;font-size:15.5px;white-space:nowrap"><span class="tex" data-tex="\\textstyle\\sum_{n,m} (1-t_n) \\ln \\mathcal{N}(x_n^m \\mid \\mu_0^m, v_0^m)"></span></div><p class="caption" style="margin-top:6px">only class-0 params</p></div>
  </div>
  <div class="card accent frag" data-f="4" style="margin-top:16px;padding:14px 22px">
    <p style="font-size:20.5px;max-width:none"><span class="tex" data-tex="\\pi"></span> appears only in A and B, and each class&#8217;s
    Gaussian parameters in only one of C and D &#8212; so each block can be maximised on its own,
    and every block is a problem we have already solved.</p>
  </div>`},

{s:"Part II", t:"Solving for the prior", html:`
  <div class="eyebrow">Step 3 &#8212; differentiate, piece by piece</div>
  <h2 style="margin-bottom:12px">The prior: Lecture 2&#8217;s coin, again</h2>
  <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr) minmax(0,270px);gap:8px 16px">
    <div style="font-size:19px">only A and B hold <span class="tex" data-tex="\\pi"></span></div><div class="eq" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="\\ell(\\pi) = N_1 \\ln \\pi + N_0 \\ln(1-\\pi)"></span></div>
    <div class="dnote">writing <span class="tex" data-tex="N_1, N_0"></span> for the class counts</div>
    <div class="frag" data-f="0" style="font-size:19px">differentiate</div><div class="eq frag" data-f="0" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="\\frac{d\\ell}{d\\pi} = \\frac{N_1}{\\pi} - \\frac{N_0}{1-\\pi}"></span></div>
    <div class="dnote frag" data-f="0"><span class="tex" data-tex="\\tfrac{d}{d\\pi}\\ln\\pi = \\tfrac1\\pi"></span> and <span class="tex" data-tex="\\tfrac{d}{d\\pi}\\ln(1-\\pi) = \\tfrac{-1}{1-\\pi}"></span>, term by term</div>
    <div class="frag" data-f="1" style="font-size:19px">set it to zero</div><div class="eq frag" data-f="1" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="\\frac{N_1}{\\pi} = \\frac{N_0}{1-\\pi}"></span></div>
    <div class="dnote frag" data-f="1">the two pulls balance</div>
    <div class="frag" data-f="2" style="font-size:19px">cross-multiply</div><div class="eq frag" data-f="2" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="N_1 (1-\\pi) = N_0\\, \\pi \\;\\Rightarrow\\; N_1 = (N_0 + N_1)\\,\\pi"></span></div>
    <div class="dnote frag" data-f="2">gather the <span class="tex" data-tex="\\pi"></span> terms</div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:14px;padding:13px 22px;text-align:center">
    <div class="eq" style="margin:0;font-size:25px"><span class="texd" data-tex="\\hat{\\pi} = \\frac{N_1}{N_0 + N_1}"></span></div>
    <p class="caption" style="margin-top:8px">The fraction of listings that sold. A count.</p>
  </div>`},

{s:"Part II", t:"Solving for the features", html:`
  <div class="eyebrow">Step 3, continued</div>
  <h2 style="margin-bottom:14px">The features: Lecture 2&#8217;s Gaussian, per class</h2>
  <p style="font-size:20px;margin-bottom:8px">Sum C is a Gaussian log-likelihood restricted to the
  class-1 rows &#8212; the <span class="tex" data-tex="t_n"></span> factor keeps only them. Take one feature <span class="tex" data-tex="m"></span> and differentiate for its
  mean, exactly as in Week 2:</p>
  <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;margin-bottom:10px">
    <div class="frag" data-f="0" style="font-size:18.5px">the <span class="tex" data-tex="\\mu_1^m"></span> terms of sum C</div>
    <div class="eq frag" data-f="0" style="margin:0;font-size:18.5px;text-align:left"><span class="texd" data-tex="\\sum_n t_n \\Bigl[-\\tfrac{(x_n^m - \\mu_1^m)^2}{2 v_1^m}\\Bigr] + \\text{const}"></span></div>
    <div class="frag" data-f="1" style="font-size:18.5px">differentiate, set to zero</div>
    <div class="eq frag" data-f="1" style="margin:0;font-size:18.5px;text-align:left"><span class="texd" data-tex="\\sum_n t_n \\frac{x_n^m - \\mu_1^m}{v_1^m} = 0 \\;\\Rightarrow\\; \\sum_n t_n x_n^m = \\hat{\\mu}_1^m \\sum_n t_n"></span></div>
  </div>
  <div class="row top" style="gap:26px">
    <div class="col card frag" data-f="2" style="text-align:center">
      <div class="eyebrow" style="margin-bottom:8px">The mean</div>
      <div class="eq" style="margin:0;font-size:21px"><span class="texd" data-tex="\\hat{\\mu}_1^m = \\frac{1}{N_1} \\sum_n t_n\\, x_n^m"></span></div>
      <p class="caption" style="margin-top:8px">the class-1 average of feature <span class="tex" data-tex="m"></span></p>
    </div>
    <div class="col card frag" data-f="2" style="text-align:center">
      <div class="eyebrow" style="margin-bottom:8px">The variance &#8212; same route</div>
      <div class="eq" style="margin:0;font-size:21px"><span class="texd" data-tex="\\hat{v}_1^m = \\frac{1}{N_1} \\sum_n t_n\\, (x_n^m - \\hat{\\mu}_1^m)^2"></span></div>
      <p class="caption" style="margin-top:8px">the class-1 spread of feature <span class="tex" data-tex="m"></span></p>
    </div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:12px;padding:12px 22px">
    <p style="font-size:20.5px;max-width:none"><strong>Training is counting and averaging.</strong>
    No gradient descent, no iterations, one pass over the data &#8212; the first closed-form fit
    since Week 2.</p>
  </div>`},

{s:"Part II", t:"From maths to code", html:`
  <div class="eyebrow">The notebook &#183; Naive Bayes</div>
  <h2 style="margin-bottom:12px">The prediction, as code</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.3">
      <div class="nb">
        <div class="nb-bar"><span class="dot"></span>In&nbsp;[7]</div>
        <pre class="code">def classifyGaussNB(x, theta0, theta1):
  theta = [theta0, theta1]
  logpx_c = [log(1-pi), log(pi)]
  for c in range(2):
    for m in range(x.shape[1]):
      # one log-factor per feature, from class c
      logpx_c[c] += stats.norm.logpdf(
          x[0][m], theta[c][0][m], np.sqrt(theta[c][1][m]))
  logpx_c -= np.max(logpx_c)   # the shift, as in softmax
  pc_x = exp(logpx_c) / np.sum(exp(logpx_c))
  return np.argmax(pc_x), pc_x</pre>
      </div>
    </div>
    <div class="col">
      <p style="font-size:20px">The sum of <strong>log</strong>-factors, not the product of
      factors: a few hundred densities below one multiply into a number float64 cannot hold.
      Logs turn the underflow into a sum.</p>
      <hr class="rule">
      <p style="font-size:20px">The exponent-and-normalise at the end is the same
      shift-and-normalise story as the softmax in Lecture 3.</p>
      <p class="nblink" style="margin-top:14px">Full notebook on Colab &#8212;
      <strong>CS3264 Lecture 4: Naive Bayes</strong>. Link on Piazza.</p>
    </div>
  </div>`},

  </div>`},

{s:"Part II", t:"Part II (so far) in one slide", html:`
  <div class="eyebrow">Before we keep going</div>
  <h2 style="margin-bottom:16px">Part II (so far) in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The assumption</div><p style="font-size:20px;max-width:none">Within a class, features are independent: <span class="tex" data-tex="p(\\mathbf{x} \\mid t) = \\prod_m p(x^m \\mid t)"></span>. Parameter count drops from quadratic (or exponential) to linear in M.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The fit</div><p style="font-size:20px;max-width:none">The log-likelihood splits by parameter, so training is <strong>counting and averaging</strong> &#8212; closed form, one pass.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Prediction</div><p style="font-size:20px;max-width:none">Two products of per-feature factors, normalised by their sum. In logs, for the arithmetic&#8217;s sake.</p></div>
  </div>`},

{s:"Part II", t:"A Categorical prior", html:`
  <div class="eyebrow">The K-class coin</div>
  <h2 style="margin-bottom:14px">The prior becomes Categorical</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,320px)">
    <div style="font-size:20px">the label</div><div class="eq" style="margin:0;text-align:left"><span class="tex" data-tex="\\mathbf{t} = (0,0,1,0)^\\top"></span></div>
    <div class="dnote">one-hot, exactly as in Lecture 3&#8217;s multi-class part</div>
    <div class="frag" data-f="0" style="font-size:20px">the prior</div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="texd" data-tex="p(\\mathbf{t} \\mid \\boldsymbol{\\pi}) = \\mathrm{Cat}(\\mathbf{t} \\mid \\boldsymbol{\\pi}) = \\prod_{k=1}^{K} \\pi_k^{t_k}"></span></div>
    <div class="dnote frag" data-f="0">the exponent switch again &#8212; one factor survives</div>
    <div class="frag" data-f="1" style="font-size:20px">its negative log, over all N labels</div><div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="texd" data-tex="\\mathcal{L} = -\\sum_n \\sum_k t_{nk} \\ln \\pi_k = -\\sum_k N_k \\ln \\pi_k"></span></div>
    <div class="dnote frag" data-f="1"><span class="tex" data-tex="N_k = \\textstyle\\sum_n t_{nk}"></span> just counts the class-k rows; and <span class="tex" data-tex="\\textstyle\\sum_k \\pi_k = 1"></span> is a constraint
      the maximisation must respect</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:14px 22px">
    <p style="font-size:20.5px;max-width:none">New situation: maximise a function of <span class="tex" data-tex="\\boldsymbol{\\pi}"></span>
    <strong>subject to</strong> <span class="tex" data-tex="\\textstyle\\sum_k \\pi_k = 1"></span>. Setting the derivative to zero ignores the constraint
    &#8212; we need a tool that does not.</p>
  </div>`},

{s:"Part II", t:"The constrained maximum", draw:"lag4", html:`
  <div class="eyebrow">Live demo &#183; notion before notation</div>
  <h2 style="margin-bottom:10px">What a constrained maximum looks like</h2>
  <div class="demo">

      slide&#8217;s log-likelihood,</p>
      <div class="eq" style="margin:6px 0;font-size:19px;text-align:left"><span class="texd" data-tex="\\ln p(\\mathcal{D} \\mid \\boldsymbol{\\pi}) = \\sum_k N_k \\ln \\pi_k,"></span></div>
      <p style="font-size:19px;max-width:none">for counts <span class="tex" data-tex="(N_1, N_2, N_3) = (24, 21, 15)"></span> of 60 rows.
      <strong>Drag the dot</strong>; the bars are the <span class="tex" data-tex="\\boldsymbol{\\pi}"></span> it stands for.</p>
      <svg id="lg4bars" viewBox="0 0 320 226" style="width:100%;display:block;margin-top:4px"></svg>
      <div style="display:flex;gap:8px;margin-top:4px">
        <button class="bbtn" id="lg4mx" type="button">jump to the maximum</button>

      &#8212; and the next slide gives the tool that finds it exactly; the ones after it show
