    </div>
  </div>`},

{s:"Part II", t:"The Lagrangian", html:`
  <div class="eyebrow">The tool first &#8212; the slides that follow say where it comes from</div>
  <h2 style="margin-bottom:14px">The Lagrangian</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.15">
      <div class="card" style="padding:16px 22px">
        <div class="eyebrow" style="margin-bottom:8px">The recipe</div>
        <p style="font-size:20px;max-width:none">To minimise <span class="tex" data-tex="f(\\mathbf{x})"></span> subject to <span class="tex" data-tex="g(\\mathbf{x}) = 0"></span>, build</p>
        <div class="eq" style="margin:8px 0;font-size:22px"><span class="texd" data-tex="\\tilde{\\mathcal{L}}(\\mathbf{x}, \\lambda) = f(\\mathbf{x}) + \\lambda\\, g(\\mathbf{x})"></span></div>
        <p style="font-size:20px;max-width:none">and solve <span class="tex" data-tex="\\nabla_{\\mathbf{x}} \\tilde{\\mathcal{L}} = 0"></span> <em>and</em> <span class="tex" data-tex="\\partial \\tilde{\\mathcal{L}} / \\partial \\lambda = 0"></span> together.</p>
      </div>
      <p class="frag" data-f="0" style="font-size:19.5px;margin-top:12px">The second equation
      <em>is</em> the constraint &#8212; so any solution of the pair automatically satisfies it.
      <span class="tex" data-tex="\\lambda"></span> is a new unknown that prices how strongly the constraint pushes back.</p>
    </div>
    <div class="col frag" data-f="1">
      <div class="card accent">
        <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Ours</div>
        <div class="eq" style="margin:4px 0 0;font-size:20px"><span class="texd" data-tex="\\tilde{\\mathcal{L}} = -\\sum_k N_k \\ln \\pi_k + \\lambda\\Bigl(\\sum_k \\pi_k - 1\\Bigr)"></span></div>
        <p class="caption" style="margin-top:10px">here <span class="tex" data-tex="f"></span> is the loss &#8212; the negative
        log-likelihood &#8212; plus <span class="tex" data-tex="\\lambda"></span> times how far the <span class="tex" data-tex="\\pi_k"></span> stray from summing to one</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"The constraint, in three dimensions", draw:"lgsurf4", html:`
  <div class="eyebrow">Live demo &#183; notion before notation</div>
  <h2 style="margin-bottom:10px">The top of a curve, not the top of a hill</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lgs4svg" viewBox="0 0 600 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19px;max-width:none">Take K = 2, so the picture fits on a page. The
      surface is the log-likelihood <span class="tex" data-tex="\\ell(\\boldsymbol{\\pi}) = N_1 \\ln \\pi_1 + N_2 \\ln \\pi_2"></span> over every pair, and the constraint <span class="tex" data-tex="g(\\boldsymbol{\\pi}) = \\pi_1 + \\pi_2 - 1 = 0"></span> is a
      <strong>line</strong> on the floor &#8212; the K = 2 triangle.</p>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="bbtn sel" id="lgs4b0" type="button">1 &#183; the surface</button>
        <button class="bbtn" id="lgs4b1" type="button">2 &#183; lift the constraint</button>
        <button class="bbtn" id="lgs4b2" type="button">3 &#183; its highest point</button>
      </div>
      <div class="warn" id="lgs4warn" style="min-height:88px"></div>
      <p class="caption" style="margin-top:8px;font-size:15px">Counts <span class="tex" data-tex="(N_1, N_2) = (24, 16)"></span> of 40. Unconstrained, the
      likelihood just climbs &#8212; the constraint is what makes the question answerable at all.</p>
      <p class="figcap" style="margin-top:6px;max-width:none;font-size:15px">Worth ten minutes on your own:
      <a href="https://youtu.be/GR4ff0dTLTw" target="_blank" rel="noopener">Constrained
      Optimization: Intuition behind the Lagrangian</a> walks the same picture.</p>
    </div>
  </div>`},

{s:"Part II", t:"Gradients and level sets", draw:"lgperp4", html:`
  <div class="eyebrow">The same surface, seen from above</div>
  <h2 style="margin-bottom:10px">A gradient is perpendicular to its own level set</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lgp4svg" viewBox="0 0 560 358"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:18px;max-width:none">The same surface from <strong>directly
      overhead</strong>. Height becomes blue <strong>contour rings</strong> &#8212; each a set of <span class="tex" data-tex="\\boldsymbol{\\pi}"></span>
      with the same <span class="tex" data-tex="\\ell"></span>. The red line is the constraint.</p>
      <p class="frag" data-f="0" style="font-size:18px;max-width:none;margin-top:7px">
      <strong>Fact 1.</strong> Walk along a ring and <span class="tex" data-tex="\\ell"></span> does not change, so <span class="tex" data-tex="\\nabla \\ell"></span> cannot point along
      it &#8212; it points straight <em>across</em>. The square marks the right angle.</p>
      <p class="frag" data-f="1" style="font-size:18px;max-width:none;margin-top:7px">
      <strong>Fact 2.</strong> The constraint is a level set too &#8212; of <span class="tex" data-tex="g"></span> &#8212; so <span class="tex" data-tex="\\nabla g"></span> is
      perpendicular to it, everywhere along it. Here <span class="tex" data-tex="\\nabla g = (1, 1)"></span> at every point.</p>
      <p class="frag" data-f="2" style="font-size:18px;max-width:none;margin-top:7px">
      <strong>Why perpendicular?</strong> A step <span class="tex" data-tex="\\mathbf{u}"></span> keeps you on the line exactly when <span class="tex" data-tex="\\nabla g^{\\top} \\mathbf{u} = 0"></span> &#8212;
      that is, when <span class="tex" data-tex="\\mathbf{u} \\perp \\nabla g"></span>. Here that allows <span class="tex" data-tex="\\mathbf{u} = \\pm(1, -1)"></span>: up one in <span class="tex" data-tex="\\pi_1"></span>, down one in <span class="tex" data-tex="\\pi_2"></span>.</p>
      <p class="frag" data-f="3" style="font-size:18px;max-width:none;margin-top:7px">
      So <span class="tex" data-tex="\\nabla g"></span> is not what holds you on the line &#8212; <span class="tex" data-tex="g(\\boldsymbol{\\pi}) = 0"></span> does. It names the way <em>off</em>, and the
      allowed steps are the ones perpendicular to it. Two normals, then &#8212; the next slide asks
      what must be true where they line up.</p>
    </div>
  </div>`},

{s:"Part II", t:"Why the gradients line up", draw:"lgtan4", html:`
  <div class="eyebrow">Live demo &#183; drag along the constraint, and flip the sign</div>
  <h2 style="margin-bottom:10px">The gradient has nowhere left to point</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lgt4svg" viewBox="0 0 560 358"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19px;max-width:none">Anywhere on the line, split the gradient into a part
      <strong>along</strong> the line and a part across it. While the along-part is not zero you can
      still step and do better, without leaving the constraint.</p>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="bbtn sel" id="lgt4max" type="button">maximise <span class="tex" data-tex="\\ell"></span></button>
        <button class="bbtn" id="lgt4min" type="button">minimise <span class="tex" data-tex="f = -\\ell"></span></button>
      </div>
      <div class="warn" id="lgt4warn" style="min-height:88px"></div>
      <div class="card accent frag" data-f="0" style="margin-top:9px;padding:11px 18px">
        <p style="font-size:18.5px;max-width:none">At the answer the two gradients lie on the
        <strong>same line</strong> &#8212; parallel here, antiparallel when you flip the button. So one
        is a multiple of the other, and writing that multiple as <span class="tex" data-tex="-\\lambda"></span> they sum to zero:</p>
        <div class="eq" style="margin:7px 0 5px;font-size:19px"><span class="texd" data-tex="\\nabla \\ell + \\lambda \\nabla g = 0"></span></div>
        <p style="font-size:18.5px;max-width:none">That one equation is the whole condition. The next
        slide builds it into a function.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Where the Lagrangian comes from", html:`
  <div class="eyebrow">Why that form, and not another</div>
  <h2 style="margin-bottom:12px">Where the Lagrangian comes from</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,300px)">
    <div style="font-size:19px">the problem we set</div>
    <div class="eq" style="margin:0;text-align:left"><span class="texd" data-tex="\\max_{\\boldsymbol{\\pi}}\\ \\ell(\\boldsymbol{\\pi}) \\quad \\text{subject to} \\quad g(\\boldsymbol{\\pi}) = 0"></span></div>
    <div class="dnote">climb <span class="tex" data-tex="\\ell"></span>, but only along the line</div>
    <div class="frag" data-f="0" style="font-size:19px">what the picture forced</div>
    <div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="texd" data-tex="\\nabla \\ell + \\lambda \\nabla g = 0"></span></div>
    <div class="dnote frag" data-f="0">the two gradients on one line, from the last slide</div>
    <div class="frag" data-f="1" style="font-size:19px">now write down</div>
    <div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="texd" data-tex="\\mathcal{L}(\\boldsymbol{\\pi}, \\lambda) = \\ell(\\boldsymbol{\\pi}) + \\lambda\\, g(\\boldsymbol{\\pi})"></span></div>
    <div class="dnote frag" data-f="1">and take its two derivatives</div>
    <div class="frag" data-f="2" style="font-size:19px">the <span class="tex" data-tex="\\boldsymbol{\\pi}"></span> part gives</div>
    <div class="eq frag" data-f="2" style="margin:0;text-align:left"><span class="texd" data-tex="\\nabla_{\\boldsymbol{\\pi}} \\mathcal{L} = \\nabla \\ell + \\lambda \\nabla g = 0"></span></div>
    <div class="dnote frag" data-f="2">exactly the condition we derived</div>
    <div class="frag" data-f="3" style="font-size:19px">the <span class="tex" data-tex="\\lambda"></span> part gives</div>
    <div class="eq frag" data-f="3" style="margin:0;text-align:left"><span class="texd" data-tex="\\partial \\mathcal{L} / \\partial \\lambda = g(\\boldsymbol{\\pi}) = 0"></span></div>
    <div class="dnote frag" data-f="3">exactly the constraint we started from</div>
  </div>
  <div class="card accent frag" data-f="4" style="margin-top:13px;padding:12px 20px">
    <p style="font-size:19px;max-width:none">So solving <span class="tex" data-tex="\\nabla \\mathcal{L} = 0"></span> &#8212; one unconstrained problem in <span class="tex" data-tex="\\boldsymbol{\\pi}"></span>
    and <span class="tex" data-tex="\\lambda"></span> &#8212; delivers both halves at once, and any solution it returns is a point that satisfies
    the constraint <em>and</em> the optimality condition.</p>
  </div>`},

{s:"Part II", t:"The signs, and Bishop&#8217;s convention", html:`
  <div class="eyebrow">One shape, two jobs</div>
  <h2 style="margin-bottom:12px">Maximise or minimise &#8212; the shape does not change</h2>
  <p style="font-size:19.5px;margin-bottom:14px">&#8220;No allowed step improves&#8221; reads the
  same whether you are climbing or descending, so the same argument on the loss <span class="tex" data-tex="f = -\\ell"></span> gives the same
  equation &#8212; with one difference: the constant it produces has the opposite sign.</p>
  <div class="row top stretch" style="gap:20px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Maximising <span class="tex" data-tex="\\ell"></span></div>
      <div class="eq" style="margin:0;font-size:18.5px"><span class="texd" data-tex="\\mathcal{L} = \\ell + \\lambda g, \\quad \\lambda = -N"></span></div>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">Minimising <span class="tex" data-tex="f = -\\ell"></span> &#8212; our loss</div>
      <div class="eq" style="margin:0;font-size:18.5px"><span class="texd" data-tex="\\tilde{\\mathcal{L}} = f + \\lambda g, \\quad \\lambda = +N"></span></div>
    </div>
    <div class="col card accent frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Objective + <span class="tex" data-tex="\\lambda g"></span></div>
      <p style="font-size:18.5px;max-width:none">The two are the same function times &#8722;1 once <span class="tex" data-tex="\\lambda"></span>
      flips with it: same <span class="tex" data-tex="\\boldsymbol{\\pi} = (0.6,\\ 0.4)"></span>, opposite <span class="tex" data-tex="\\lambda"></span>.</p>
    </div>
  </div>
  <p class="frag" data-f="2" style="font-size:19.5px;margin-top:14px">This is <strong>Bishop&#8217;s
  convention</strong> (PRML, Appendix E): objective + <span class="tex" data-tex="\\lambda g"></span>, with <span class="tex" data-tex="\\lambda"></span> free to take either sign. The
  textbook reads straight onto these slides.</p>
  <p class="caption frag" data-f="3" style="margin-top:10px">We use the minimising form from here,
  because that is how we posed fitting. One caution: <span class="tex" data-tex="\\nabla \\mathcal{L} = 0"></span> finds a <strong>stationary</strong> point
  &#8212; max, min or saddle.</p>`},

{s:"Part II", t:"The Lagrangian, again", html:`
  <div class="eyebrow">The same tool, now derived &#8212; Week 10 leans on it</div>
  <h2 style="margin-bottom:14px">The Lagrangian, again</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.15">
      <div class="card" style="padding:16px 22px">
        <div class="eyebrow" style="margin-bottom:8px">The recipe</div>
        <p style="font-size:20px;max-width:none">To minimise <span class="tex" data-tex="f(\\mathbf{x})"></span> subject to <span class="tex" data-tex="g(\\mathbf{x}) = 0"></span>, build</p>
        <div class="eq" style="margin:8px 0;font-size:22px"><span class="texd" data-tex="\\tilde{\\mathcal{L}}(\\mathbf{x}, \\lambda) = f(\\mathbf{x}) + \\lambda\\, g(\\mathbf{x})"></span></div>
        <p style="font-size:20px;max-width:none">and solve <span class="tex" data-tex="\\nabla_{\\mathbf{x}} \\tilde{\\mathcal{L}} = 0"></span> <em>and</em> <span class="tex" data-tex="\\partial \\tilde{\\mathcal{L}} / \\partial \\lambda = 0"></span> together.</p>
      </div>
      <p class="frag" data-f="0" style="font-size:19.5px;margin-top:12px">The second equation
      <em>is</em> the constraint &#8212; so any solution of the pair automatically satisfies it.
      <span class="tex" data-tex="\\lambda"></span> is a new unknown that prices how strongly the constraint pushes back.</p>
    </div>
    <div class="col frag" data-f="1">
      <div class="card accent">
        <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Ours</div>
        <div class="eq" style="margin:4px 0 0;font-size:20px"><span class="texd" data-tex="\\tilde{\\mathcal{L}} = -\\sum_k N_k \\ln \\pi_k + \\lambda\\Bigl(\\sum_k \\pi_k - 1\\Bigr)"></span></div>
        <p class="caption" style="margin-top:10px">here <span class="tex" data-tex="f"></span> is the loss &#8212; the negative
        log-likelihood &#8212; plus <span class="tex" data-tex="\\lambda"></span> times how far the <span class="tex" data-tex="\\pi_k"></span> stray from summing to one</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Solving for the class fractions", html:`
  <div class="eyebrow">Turn the handle</div>
  <h2 style="margin-bottom:14px">Solve it</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,300px)">
    <div style="font-size:20px">our Lagrangian</div><div class="eq" style="margin:0;text-align:left"><span class="texd" data-tex="\\tilde{\\mathcal{L}} = -\\sum_k N_k \\ln \\pi_k + \\lambda\\Bigl(\\sum_k \\pi_k - 1\\Bigr)"></span></div>
    <div class="dnote">the loss, plus <span class="tex" data-tex="\\lambda"></span> times the constraint</div>
    <div class="frag" data-f="0" style="font-size:20px">each <span class="tex" data-tex="\\pi_k"></span></div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="texd" data-tex="\\frac{\\partial \\tilde{\\mathcal{L}}}{\\partial \\pi_k} = -\\frac{N_k}{\\pi_k} + \\lambda = 0"></span></div>
    <div class="dnote frag" data-f="0">one equation per class</div>
    <div class="frag" data-f="1" style="font-size:20px">so</div><div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="texd" data-tex="\\pi_k = \\frac{N_k}{\\lambda}"></span></div>
    <div class="dnote frag" data-f="1">every class fraction is its count over the same <span class="tex" data-tex="\\lambda"></span></div>
    <div class="frag" data-f="2" style="font-size:20px">the constraint</div><div class="eq frag" data-f="2" style="margin:0;text-align:left"><span class="texd" data-tex="\\sum_k \\pi_k = \\sum_k \\frac{N_k}{\\lambda} = 1 \\;\\Rightarrow\\; \\lambda = \\sum_k N_k = N"></span></div>
    <div class="dnote frag" data-f="2">which fixes <span class="tex" data-tex="\\lambda"></span></div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:16px;padding:13px 22px;text-align:center">
    <div class="eq" style="margin:0;font-size:26px"><span class="texd" data-tex="\\hat{\\pi}_k = \\frac{N_k}{N}"></span></div>
    <p class="caption" style="margin-top:8px">The count fraction you would have guessed &#8212;
    now derived. The same Lagrangian returns for SVMs in Week 10.</p>
  </div>`},

{s:"Part II", t:"The Dirichlet distribution", draw:"diri4", html:`
  <div class="eyebrow">From MLE to MAP &#183; a prior for <span class="tex" data-tex="\\boldsymbol{\\pi}"></span></div>
  <h2 style="margin-bottom:14px">A prior that lives on the triangle</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,330px)">
    <div style="font-size:20px">the parameter</div><div class="eq" style="margin:0;text-align:left"><span class="tex" data-tex="\\boldsymbol{\\pi} = (\\pi_1, \\ldots, \\pi_K), \\quad \\textstyle\\sum_k \\pi_k = 1"></span></div>
    <div class="dnote">a point of the triangle &#8212; so its prior must be a density
      <em>over the triangle</em></div>
    <div class="frag" data-f="0" style="font-size:20px">the density</div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="texd" data-tex="p(\\boldsymbol{\\pi}) = \\mathrm{Dir}(\\boldsymbol{\\pi} \\mid \\alpha_1{+}1, \\ldots, \\alpha_K{+}1) \\propto \\prod_{k=1}^{K} \\pi_k^{\\alpha_k}"></span></div>
    <div class="dnote frag" data-f="0">the <strong>Dirichlet</strong>: one factor per class, with
      pseudo-counts <span class="tex" data-tex="\\alpha_k \\ge 0"></span> as exponents; the normaliser has no <span class="tex" data-tex="\\boldsymbol{\\pi}"></span> in it</div>
    <div class="frag" data-f="1" style="font-size:20px">its log</div><div class="eq frag" data-f="1" style="margin:0;text-align:left"><span class="texd" data-tex="\\ln p(\\boldsymbol{\\pi}) = \\sum_k \\alpha_k \\ln \\pi_k + \\mathrm{const}"></span></div>
    <div class="dnote frag" data-f="1">the log-likelihood&#8217;s shape, with <span class="tex" data-tex="\\alpha_k"></span> where the
      counts <span class="tex" data-tex="N_k"></span> were</div>
  </div>
  <div class="fig frag" data-f="2" style="background:transparent;box-shadow:none;padding:0;margin-top:12px">
    <svg id="dri4svg" viewBox="0 0 900 210" style="width:100%;max-width:840px;display:block;margin:0 auto"></svg>
  </div>
  <p class="caption frag" data-f="2" style="margin-top:4px;text-align:center">Three priors on the
  K = 3 triangle &#8212; brighter is higher, the ring marks the peak. For K = 2 the Dirichlet is
  the <strong>Beta</strong> distribution on a coin.</p>`},

{s:"Part II", t:"Pseudo-counts, on the triangle", draw:"dir4", html:`
  <div class="eyebrow">Live demo &#183; drag the pseudo-counts</div>
  <h2 style="margin-bottom:10px">What the pseudo-counts do to the prior</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="dr4svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 8px;font-size:20px"><span class="texd" data-tex="p(\\boldsymbol{\\pi}) \\propto \\pi_1^{\\alpha_1}\\, \\pi_2^{\\alpha_2}\\, \\pi_3^{\\alpha_3}"></span></div>
      <div class="ctrl-row"><label>pseudo-count <span style="text-transform:none">&#945;&#8321;</span> <span class="val" id="dr4v1">1.0</span></label>
        <input type="range" id="dr4a1" min="0" max="8" step="0.5" value="1"></div>
      <div class="ctrl-row"><label>pseudo-count <span style="text-transform:none">&#945;&#8322;</span> <span class="val" id="dr4v2">1.0</span></label>
        <input type="range" id="dr4a2" min="0" max="8" step="0.5" value="1"></div>
      <div class="ctrl-row"><label>pseudo-count <span style="text-transform:none">&#945;&#8323;</span> <span class="val" id="dr4v3">1.0</span></label>
        <input type="range" id="dr4a3" min="0" max="8" step="0.5" value="1"></div>
      <div class="warn" id="dr4warn" style="min-height:88px"></div>
      <p class="caption" style="margin-top:8px">The peak sits at <span class="tex" data-tex="\\alpha_k / \\textstyle\\sum_j \\alpha_j"></span> &#8212; the same constrained
      maximisation as two slides ago, run on imaginary rows. Larger pseudo-counts also make the
      peak <strong>sharper</strong>: a more stubborn prior.</p>
    </div>
  </div>`},

{s:"Part II", t:"Maximising the posterior", html:`
  <div class="eyebrow">Step by step &#183; the same handle, turned once more</div>
  <h2 style="margin-bottom:14px">Maximise the posterior instead</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,320px)">
    <div style="font-size:20px">Bayes, on the parameters</div><div class="eq" style="margin:0;text-align:left"><span class="tex" data-tex="p(\\boldsymbol{\\pi} \\mid \\mathcal{D}) \\propto p(\\mathcal{D} \\mid \\boldsymbol{\\pi})\\, p(\\boldsymbol{\\pi})"></span></div>
    <div class="dnote">the evidence has no <span class="tex" data-tex="\\boldsymbol{\\pi}"></span> in it &#8212; dropped</div>
    <div class="frag" data-f="0" style="font-size:20px">plug both in</div><div class="eq frag" data-f="0" style="margin:0;text-align:left"><span class="tex" data-tex="\\propto \\prod_k \\pi_k^{N_k} \\cdot \\prod_k \\pi_k^{\\alpha_k} = \\prod_k \\pi_k^{\\,N_k + \\alpha_k}"></span></div>
    <div class="dnote frag" data-f="0">real counts and pseudo-counts <strong>add</strong> &#8212;
      that is the whole trick</div>
    <div class="frag" data-f="1" style="font-size:20px">its log</div><div class="eq frag" data-f="1" style="margin:0;font-size:18px;text-align:left"><span class="tex" data-tex="\\ln p(\\boldsymbol{\\pi} \\mid \\mathcal{D}) = \\textstyle\\sum_k (N_k + \\alpha_k) \\ln \\pi_k + \\mathrm{const}"></span></div>
    <div class="dnote frag" data-f="1">the MLE problem again &#8212; <span class="tex" data-tex="N_k + \\alpha_k"></span> in place of <span class="tex" data-tex="N_k"></span>, same
      constraint <span class="tex" data-tex="\\textstyle\\sum_k \\pi_k = 1"></span></div>
    <div class="frag" data-f="2" style="font-size:20px">the same Lagrangian</div><div class="eq frag" data-f="2" style="margin:0;font-size:18px;text-align:left"><span class="tex" data-tex="\\pi_k = \\frac{N_k + \\alpha_k}{\\lambda}, \\qquad \\lambda = \\textstyle\\sum_j (N_j + \\alpha_j) = N + \\textstyle\\sum_j \\alpha_j"></span></div>
    <div class="dnote frag" data-f="2">identical algebra: derivative, then the constraint
      fixes <span class="tex" data-tex="\\lambda"></span></div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:16px;padding:14px 22px;text-align:center">
    <div class="eq" style="margin:0;font-size:25px"><span class="texd" data-tex="\\hat{\\pi}_{k,\\mathrm{MAP}} = \\frac{N_k + \\alpha_k}{N + \\sum_j \\alpha_j}"></span></div>
    <p class="caption" style="margin-top:8px">each count, padded by its pseudo-count. Equal
    pseudo-counts <span class="tex" data-tex="\\alpha_k = \\alpha"></span> give <span class="tex" data-tex="\\tfrac{N_k+\\alpha}{N+K\\alpha}"></span>.</p>
  </div>`},

{s:"Part II", t:"MAP, here as well", html:`
  <div class="eyebrow">From MLE to MAP</div>
  <h2 style="margin-bottom:12px">What the prior buys</h2>
  <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:8px 18px">
    <div style="font-size:19px;align-self:center">the estimate, read as a blend</div>
    <div class="eq" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="\\hat{\\pi}_{k,\\mathrm{MAP}} = \\frac{N}{N + \\sum_j \\alpha_j} \\cdot \\frac{N_k}{N} \\;+\\; \\frac{\\sum_j \\alpha_j}{N + \\sum_j \\alpha_j} \\cdot \\frac{\\alpha_k}{\\sum_j \\alpha_j}"></span></div>
  </div>
  <p class="caption" style="margin-top:8px">a weighted average of the <strong>data&#8217;s</strong>
  fractions and the <strong>prior&#8217;s</strong> peak, with weights <span class="tex" data-tex="N"></span> and <span class="tex" data-tex="\\textstyle\\sum_j \\alpha_j"></span>: with plenty of
  data the prior fades; with little, the pseudo-counts steady the answer.</p>
  <div class="row top" style="gap:24px;margin-top:14px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">Same move as ridge</div>
      <p style="font-size:19.5px;max-width:none">MLE plus a prior, maximised &#8212; that is MAP,
      exactly as in Lectures 2 and 3. Every parameter here can get the same
      treatment.</p>
    </div>
    <div class="col card accent frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Why bother, with data this easy?</div>
      <p style="font-size:19.5px;max-width:none">Because counts can be <strong>zero</strong>. Shortly
      we run this model on text &#8212; and meet a zero that silences five other
      features. The fix will be this pseudo-count.</p>
    </div>
  </div>`},

{s:"Part II", t:"Staying Bayesian", html:`
  <div class="eyebrow">The third option &#183; MLE, MAP, and now this</div>
  <h2 style="margin-bottom:12px">The Bayesian answer, still in closed form</h2>
  <p style="font-size:19.5px;margin-bottom:10px">MLE and MAP both hand back a single <span class="tex" data-tex="\\boldsymbol{\\theta}"></span>. The
  Bayesian answer refuses to pick: keep <span class="tex" data-tex="p(\\boldsymbol{\\theta} \\mid \\mathcal{D})"></span> and <strong>average</strong> the prediction over it.</p>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,300px)">
    <div style="font-size:19.5px">the predictive</div>
    <div class="eq" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="p(x^* \\mid \\mathcal{D}) = \\int p(x^* \\mid \\boldsymbol{\\theta})\\, p(\\boldsymbol{\\theta} \\mid \\mathcal{D})\\, d\\boldsymbol{\\theta}"></span></div>
    <div class="dnote">not a plug-in &#8212; every <span class="tex" data-tex="\\boldsymbol{\\theta}"></span> gets a vote, weighted by how plausible it is</div>
    <div class="frag" data-f="0" style="font-size:19.5px">the prior we chose</div>
    <div class="eq frag" data-f="0" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="\\boldsymbol{\\pi} \\sim \\mathrm{Dir}(\\alpha_1{+}1, \\ldots, \\alpha_K{+}1) \\;\\Longrightarrow\\; \\boldsymbol{\\pi} \\mid \\mathcal{D} \\sim \\mathrm{Dir}(N_k{+}\\alpha_k{+}1)"></span></div>
    <div class="dnote frag" data-f="0"><strong>conjugate</strong>: the posterior is a Dirichlet
      again, so the integral has a closed form</div>
    <div class="frag" data-f="1" style="font-size:19.5px">so the class prior becomes</div>
    <div class="eq frag" data-f="1" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="p(t = k \\mid \\mathcal{D}) = \\frac{N_k + \\alpha_k + 1}{N + \\sum_j \\alpha_j + K}"></span></div>
    <div class="dnote frag" data-f="1">counts and pseudo-counts again &#8212; but the posterior&#8217;s
      <strong>mean</strong>, where MAP took its peak</div>
  </div>
  <div class="row top stretch frag" data-f="2" style="gap:20px;margin-top:14px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Our sixty rows</div>
      <p style="font-size:18.5px;max-width:none">MAP gives (0.40, 0.35, 0.25); the Bayesian
      predictive gives (0.397, 0.349, 0.254) &#8212; pulled a little toward even. They agree as the
      data grows.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">And the Gaussians?</div>
      <p style="font-size:18.5px;max-width:none">With the conjugate prior on an unknown mean
      <em>and</em> variance, the predictive is a <strong>Student-t</strong>: same centre, heavier
      tails, because we do not know the spread exactly.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">The product survives</div>
      <p style="font-size:18.5px;max-width:none">Independent priors per feature keep the posterior
      factorised, so the predictive is still a product of one-dimensional terms. No sampling
      anywhere.</p>
    </div>
  </div>`},

{s:"Part II", t:"Words instead of measurements", draw:"bow4", html:`
  <div class="eyebrow">The same recipe, a different kind of feature</div>
  <h2 style="margin-bottom:10px">Naive Bayes made its name on text</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.15">
      <p style="font-size:20px">Age and mileage were numbers, so each <span class="tex" data-tex="p(x^m \\mid t)"></span> got a Gaussian. Words are
      not numbers. Fix a <strong>vocabulary</strong> and ask one yes-or-no question per word:
      <em>did this word appear?</em></p>
      <p class="frag" data-f="0" style="font-size:20px;margin-top:10px">The email becomes a vector of
      0s and 1s &#8212; a <strong>bag of words</strong>, because the order is thrown away. And the
      naive assumption is back: given the class, the words are treated as
      independent.</p>
      <p class="caption frag" data-f="1" style="margin-top:10px">Nothing else in the derivation
      changes. Same prior, same product over features, same Bayes step at the end &#8212; only the
      per-feature distribution is swapped.</p>
    </div>
    <div class="col">
      <div class="fig"><svg id="bow4svg" viewBox="0 0 560 210"></svg></div>
    </div>
  </div>`},

{s:"Part II", t:"Bernoulli or multinomial", html:`
  <div class="eyebrow">An aside &#183; the same fork as Lecture 3</div>
  <h2 style="margin-bottom:14px">Which distribution for a word?</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Bernoulli &#183; did it appear?</div>
      <p style="font-size:19.5px;max-width:none">One coin per vocabulary word, flipped once per
      email: <span class="tex" data-tex="p(x^m = 1 \\mid t) = \\mu_t^m"></span>. Words that are <strong>absent</strong> count too &#8212; they contribute <span class="tex" data-tex="1 - \\mu_t^m"></span>.</p>
      <p class="caption" style="margin-top:8px">Good for short documents, where a word appearing
      twice says little more than appearing once.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">Multinomial &#183; how many times?</div>
      <p style="font-size:19.5px;max-width:none">One die with <span class="tex" data-tex="M"></span> faces &#8212; one per vocabulary word &#8212; rolled once per word in the
      document: <span class="tex" data-tex="\\textstyle\\prod_m (\\mu_t^m)^{c^m}"></span>, where <span class="tex" data-tex="c^m"></span> counts the occurrences.</p>
      <p class="caption" style="margin-top:8px">Good for longer documents, where repetition is
      evidence. This is the usual choice for text classification.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:16px;text-align:center">We take the Bernoulli
  branch, because the counting is easier to do on the board. Everything that follows &#8212; the
  zero, and the fix &#8212; applies to both.</p>`},

{s:"Part II", t:"Counting the corpus", draw:"counts4", html:`
  <div class="eyebrow">Fitting is still just counting</div>
  <h2 style="margin-bottom:10px">Sixteen emails, six words</h2>
  <div class="row top" style="gap:26px">
    <div class="col" style="flex:1.25">
      <div class="fig"><svg id="cnt4svg" viewBox="0 0 560 250"></svg></div>
    </div>
    <div class="col">
      <p style="font-size:19.5px">The same maximum-likelihood argument as the class prior gives the
      same shape of answer &#8212; a count over a count:</p>
      <div class="eq" style="margin:10px 0;font-size:20px"><span class="texd" data-tex="\\hat{\\mu}_t^m = \\frac{\\#\\{\\text{class-}t\\text{ emails containing word } m\\}}{\\#\\{\\text{class-}t\\text{ emails}\\}}"></span></div>
      <p style="font-size:19.5px">Eight spam, eight ham, so the prior is <span class="tex" data-tex="\\tfrac12"></span> either way. Every other
      number on the left is one division.</p>
      <p class="caption frag" data-f="0" style="margin-top:10px">One cell is <strong>zero</strong>:
      &#8220;meeting&#8221; never turns up in the spam pile. It is about to cause more trouble than
      its size suggests.</p>
    </div>
  </div>`},

{s:"Part II", t:"The zero, in the numbers", draw:"spam4z", html:`
  <div class="eyebrow">The same email, scored on raw counts</div>
  <h2 style="margin-bottom:10px">What the zero does to the arithmetic</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="sp4zsvg" viewBox="0 0 560 290"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">The email contains <em>free</em>, <em>winner</em>,
      <em>urgent</em> and <em>meeting</em>. Six factors per class, each an estimate from the
      counts, at <span class="tex" data-tex="\\alpha = 0"></span>.</p>
      <p class="frag" data-f="0" style="font-size:19.5px;max-width:none;margin-top:12px">
      <em>meeting</em> never appeared in a spam email, so its factor is <span class="tex" data-tex="0"></span>. The spam product is
      <span class="tex" data-tex="0"></span>, the ham product is not, and Bayes&#8217; rule returns <strong>ham</strong> &#8212; whatever
      the other five words say.</p>
      <p class="caption frag" data-f="1" style="margin-top:12px">Three words point hard at spam and
      are simply not heard. The next slide says why one zero can do this; the fix follows, and then
      this figure returns with a dial on it.</p>
    </div>
  </div>`},

{s:"Part II", t:"One unseen word", html:`
  <div class="eyebrow">Where counting alone fails</div>
  <h2 style="margin-bottom:12px">A single zero annihilates the product</h2>
  <div class="row top" style="gap:26px">
    <div class="col" style="flex:1.2">
      <p style="font-size:19.5px">The class score is a <strong>product</strong>, so one zero factor
      makes the whole thing zero, whatever the other factors say:</p>
      <div class="eq" style="margin:11px 0;font-size:19.5px"><span class="texd" data-tex="p(\\mathbf{x} \\mid \\text{spam}) = \\prod_m (\\cdots) \\times \\underbrace{0}_{\\text{meeting}} \\times (\\cdots) = 0"></span></div>
      <p class="frag" data-f="0" style="font-size:19.5px">Feed that into Bayes&#8217; rule and the
      zero survives &#8212; it is the whole numerator:</p>
      <div class="eq frag" data-f="0" style="margin:11px 0;font-size:18px"><span class="texd" data-tex="p(\\text{spam} \\mid \\mathbf{x}) = \\frac{\\pi_{\\text{spam}} \\cdot 0}{\\pi_{\\text{spam}} \\cdot 0 + \\pi_{\\text{ham}}\\, p(\\mathbf{x} \\mid \\text{ham})} = 0"></span></div>
      <p class="frag" data-f="1" style="font-size:19.5px">So <span class="tex" data-tex="p(\\text{spam} \\mid \\mathbf{x}) = 0"></span> exactly, and <span class="tex" data-tex="p(\\text{ham} \\mid \\mathbf{x}) = 1"></span>. The class prior
      cannot rescue it and neither can the other words.</p>
    </div>
    <div class="col frag" data-f="2">
      <p style="font-size:20px">An email with <em>free</em>, <em>winner</em> and <em>urgent</em>
      in it is ruled not-spam &#8212; because it also contains <em>meeting</em>.</p>
      <p style="font-size:20px;margin-top:10px">Eight emails were never going to contain every
      word in the language. The estimate is not wrong to say &#8220;rare&#8221;; it is wrong to say
      <strong>impossible</strong>.</p>
    </div>
  </div>`},

{s:"Part II", t:"Laplace smoothing", html:`
  <div class="eyebrow">The fix is one we know</div>
  <h2 style="margin-bottom:14px">Put a prior on the word probabilities</h2>
  <div class="dgrid" style="grid-template-columns:minmax(0,1fr) max-content;gap:12px 28px">
    <div style="font-size:19px;align-self:center">Each word is a coin: present or absent. That is
      the same object as the class fractions, with <span class="tex" data-tex="K = 2"></span> &#8212; so put the same
      <strong>Dirichlet</strong> on it</div>
    <div class="eq" style="margin:0;font-size:20px;text-align:left"><span class="texd" data-tex="(\\mu_t^m,\\ 1 - \\mu_t^m) \\sim \\mathrm{Dir}(\\alpha_1{+}1,\\ \\alpha_2{+}1)"></span></div>
    <div class="frag" data-f="0" style="font-size:19px;align-self:center">Nothing says present should
      be favoured over absent, so take the hyperparameters <strong>equal</strong> &#8212; one number
      <span class="tex" data-tex="a"></span> instead of a vector</div>
    <div class="eq frag" data-f="0" style="margin:0;font-size:20px;text-align:left"><span class="texd" data-tex="\\alpha_1 = \\alpha_2 = a"></span></div>
    <div class="frag" data-f="1" style="font-size:19px;align-self:center">Then the MAP estimate is
      the one we already derived, with the two counts <span class="tex" data-tex="(c_t^m,\\ N_t - c_t^m)"></span></div>
    <div class="eq frag" data-f="1" style="margin:0;font-size:20px;text-align:left"><span class="texd" data-tex="\\hat{\\mu}_t^m = \\frac{c_t^m + \\alpha_1}{N_t + \\alpha_1 + \\alpha_2} = \\frac{c_t^m + a}{N_t + 2a}"></span></div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:14px 20px">
    <p style="font-size:19.5px;max-width:none">This is <strong>Laplace smoothing</strong>, and <span class="tex" data-tex="a = 1"></span> is
    the usual choice: behave as though every word had been seen once present and once absent in each
    class. Nothing is ever exactly impossible again &#8212; and it is the same move that turned least
    squares into ridge.</p>
  </div>`},

{s:"Part II", t:"Spam, scored", draw:"spam4", html:`
  <div class="eyebrow">Live demo &#183; turn the smoothing up</div>
  <h2 style="margin-bottom:10px">The same email, before and after the fix</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="sp4svg" viewBox="0 0 560 290"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">The email contains <em>free</em>, <em>winner</em>,
      <em>urgent</em> and <em>meeting</em>. Start at <span class="tex" data-tex="\\alpha = 0"></span> &#8212; the raw counts &#8212; and turn the
      dial up.</p>
      <div class="ctrl-row" style="margin-top:10px"><label>smoothing <span style="text-transform:none">&#945;</span> <span class="val" id="sp4av">0.0</span></label>
        <input type="range" id="sp4a" min="0" max="2" step="0.1" value="0"></div>
      <div class="warn" id="sp4warn" style="min-height:92px"></div>
      <p class="caption frag" data-f="0" style="margin-top:10px">Smoothing is not a patch bolted on
      afterwards. It is MAP instead of MLE &#8212; the same move that turned least squares into
      ridge, and cross-entropy into its regularised twin.</p>
    </div>
  </div>`},

{s:"Part II", t:"Questions (Part II)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About the model, the counting, or the Lagrangian</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part III", t:"Part III", div:true, html:`
  <div class="divider">
    <div class="part">Part III</div>
    <h1>What the joint buys</h1>
    <div class="bar"></div>
    <div class="sub">Missing features, new listings &#8212; and where it loses.</div>
  </div>`},

{s:"Part III", t:"Missing data", draw:"miss4", html:`
  <div class="eyebrow">Live demo &#183; the empty field</div>
  <h2 style="margin-bottom:10px">A missing feature costs one factor</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="m4svg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none;margin-bottom:6px">Start from what we already
      compute &#8212; the posterior with both fields filled in:</p>
      <div class="eq" style="margin:0 0 8px;font-size:15px;text-align:left"><span class="texd" data-tex="p(t \\mid x^{\\mathrm{age}}, x^{\\mathrm{mile}}) \\propto \\pi_t\\, p(x^{\\mathrm{age}} \\mid t)\\, p(x^{\\mathrm{mile}} \\mid t)"></span></div>
      <p class="frag" data-f="0" style="font-size:17.5px;max-width:none;margin-bottom:6px">Now the
      mileage is blank. What we want is <span class="tex" data-tex="p(t \\mid x^{\\mathrm{age}})"></span>, so <strong>sum the missing field out</strong> of the
      joint &#8212; the sum rule:</p>
      <div class="eq frag" data-f="0" style="margin:0 0 8px;font-size:15px;text-align:left"><span class="texd" data-tex="p(t, x^{\\mathrm{age}}) = \\int \\pi_t\\, p(x^{\\mathrm{age}} \\mid t)\\, p(x^{\\mathrm{mile}} \\mid t)\\, dx^{\\mathrm{mile}}"></span></div>
      <p class="frag" data-f="1" style="font-size:17.5px;max-width:none;margin-bottom:6px">Only one
      factor depends on <span class="tex" data-tex="x^{\\mathrm{mile}}"></span>, so the integral slides past the others &#8212; and that factor is a
      density, so it integrates to one:</p>
      <div class="eq frag" data-f="1" style="margin:0 0 8px;font-size:15px;text-align:left"><span class="texd" data-tex="= \\pi_t\\, p(x^{\\mathrm{age}} \\mid t) \\underbrace{\\int p(x^{\\mathrm{mile}} \\mid t)\\, dx^{\\mathrm{mile}}}_{=\\ 1} \\quad\\Rightarrow\\quad p(t \\mid x^{\\mathrm{age}}) \\propto \\pi_t\\, p(x^{\\mathrm{age}} \\mid t)"></span></div>
      <div class="ctrl-row"><label>age <span class="val" id="m4av">5.0</span></label>
        <input type="range" id="m4a" min="0.5" max="12.5" step="0.1" value="5"></div>
      <div class="ctrl-row"><label>mileage <span class="val" id="m4mv">8.0</span></label>
        <input type="range" id="m4m" min="0.5" max="15.5" step="0.1" value="8"></div>
      <div style="display:flex;gap:8px;margin:8px 0 0">
        <button class="bbtn" id="m4y" type="button">age unknown</button>
        <button class="bbtn" id="m4x" type="button">mileage unknown</button>
      </div>
      <p class="caption" style="margin-top:8px;font-size:15px">Press both and every factor leaves:
      the posterior falls back to the class prior. Logistic regression&#8217;s <span class="tex" data-tex="\\mathbf{w}^\\top\\mathbf{x}"></span> has no value to
      put in the empty slot &#8212; the formula is stuck until you invent one.</p>
    </div>
  </div>`},

{s:"Part III", t:"Generate a listing", draw:"dream4", html:`
  <div class="eyebrow">Live demo &#183; run the story forwards</div>
  <h2 style="margin-bottom:10px">The model can produce listings</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="g4svg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:20px;max-width:none">The same two lines as Part I&#8217;s story &#8212;
      coin, then class-conditional &#8212; now offered as an output of the fitted model. What falls
      out is a new listing.</p>
      <div style="display:flex;gap:8px;margin:12px 0 8px">
        <button class="bbtn" id="g41" type="button">sample a listing</button>
        <button class="bbtn" id="g4r" type="button">clear</button>
      </div>
      <p class="caption" style="margin-top:8px">This is the literal sense of
      <em>generative</em>. The generative models later in the course &#8212; and the large ones
      outside it &#8212; scale this same idea: model the data&#8217;s distribution, then draw
      from it.</p>
    </div>
  </div>`},

{s:"Part III", t:"Where naive loses", draw:"dup4", html:`
  <div class="eyebrow">Live demo &#183; the assumption&#8217;s bill arrives</div>
  <h2 style="margin-bottom:10px">Correlated features get counted twice</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="du4svg" viewBox="0 0 560 210"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">Add a <strong>copy</strong> of the mileage column
      &#8212; no new information &#8212; and the posterior moves anyway: independence counts the
      copy as a second witness, so whatever mileage says is said twice.</p>
      <div class="ctrl-row" style="margin-top:8px"><label>age <span class="val" id="du4av">6.5</span></label>
        <input type="range" id="du4a" min="0.5" max="12.5" step="0.1" value="6.5"></div>
      <div class="ctrl-row"><label>mileage <span class="val" id="du4mv">9.0</span></label>
        <input type="range" id="du4m" min="0.5" max="15.5" step="0.1" value="9"></div>
      <p class="caption" style="margin-top:8px">When features overlap <strong>within a class</strong>,
      Naive Bayes double-counts the shared information and its posteriors tend to run
      <strong>overconfident</strong>. (Our two features barely do &#8212; within each class they are
      nearly uncorrelated &#8212; which is why our posteriors behave.) The ranking of classes often
      survives; read the probabilities with care.</p>
    </div>
  </div>`},

{s:"Part III", t:"Two boundaries, one dataset", draw:"vs4", html:`
  <div class="eyebrow">Live demo &#183; the trade, on our cars</div>
  <h2 style="margin-bottom:10px">Generative against discriminative, on the same sixty</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="v4svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">Naive Bayes spends its capacity describing the
      clouds; logistic regression spends all of it on the boundary. On these sixty cars the two
      disagree mainly at the edges.</p>
      <hr class="rule">
      <p style="font-size:19.5px;max-width:none;margin-top:10px">The common empirical pattern:
      with <strong>little data</strong> the generative model&#8217;s assumptions help; with
      <strong>plenty</strong>, the discriminative model usually classifies more accurately &#8212;
      it optimises the thing being scored. Choosing is a modelling decision, not a rule.</p>
    </div>
  </div>`},

{s:"Part III", t:"Which paradigm?", html:`
  <div class="actbadge">Activity &#183; show of hands</div>
  <div class="actq" style="font-size:24px;margin:12px 0 12px">Three jobs. Which one is the
  <strong>strongest case for the generative approach</strong>?</div>
  <div class="row top stretch" style="gap:20px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">A</div><p style="font-size:19.5px;max-width:none">A spam filter, with <strong>ten million labelled emails</strong> and one job: classify.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">B</div><p style="font-size:19.5px;max-width:none">Hospital triage from <strong>three hundred records</strong>, where fields are often blank.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">C</div><p style="font-size:19.5px;max-width:none">A fraud system where <strong>new fraud patterns</strong> keep appearing.</p></div>
  </div>
  <div class="card accent frag" data-f="0" style="margin-top:16px;padding:13px 20px">
    <p style="font-size:19.5px;max-width:none"><strong>B</strong> has two arguments at once: little
    data and routine missingness. <strong>C</strong> is arguable &#8212; a generative model adds a new
    class by fitting its cloud, leaving the others untouched. <strong>A</strong> is home turf for the
    discriminative side: plentiful labels, one question, accuracy the only score.</p>
  </div>`},

{s:"Part III", t:"The Ng&#8211;Jordan comparison", html:`
  <div class="eyebrow">NIPS (now NeurIPS) &#183; published 2002</div>
  <h2 style="margin-bottom:12px">Ng &amp; Jordan studied this trade-off</h2>
  <div class="row top" style="gap:26px">
    <div class="col" style="flex:0 0 200px">
      <img src="media/andrew-ng.jpg" style="width:200px;height:200px;object-fit:cover;object-position:center 22%;border-radius:8px" alt="Andrew Ng">
      <p class="caption" style="margin-top:6px"><strong>Andrew Ng</strong> &#8212; then a PhD student
      at Berkeley; schooled partly in Singapore, at Raffles Institution.
      <span style="opacity:.7">photo: TechCrunch, CC&#8201;BY&#8201;2.0</span></p>
    </div>
    <div class="col" style="flex:0 0 200px">
      <img src="media/michael-jordan.jpg" style="width:200px;height:200px;object-fit:cover;border-radius:8px" alt="Michael I. Jordan">
      <p class="caption" style="margin-top:6px"><strong>Michael I. Jordan</strong> &#8212; UC
      Berkeley; Ng&#8217;s PhD advisor.
      <span style="opacity:.7">photo: UC Berkeley CDSS</span></p>
    </div>
    <div class="col">
      <p style="font-size:20px">The pairing they studied is <strong>exactly today&#8217;s</strong>:
      naive Bayes and logistic regression &#8212; the same family of boundaries, fitted the
      generative way and the discriminative way.</p>
      <p class="frag" data-f="0" style="font-size:20px;margin-top:10px">The paper gives this
      trade a <strong>theory</strong>: which side wins depends on how much data you have
      &#8212; and on how well the assumed story fits. Next slide.</p>
      <p class="caption frag" data-f="0" style="margin-top:10px">&#8220;On Discriminative vs.
      Generative Classifiers: A comparison of logistic regression and naive Bayes.&#8221;</p>
    </div>
  </div>`},

{s:"Part III", t:"Two regimes, proved and measured", html:`
  <div class="eyebrow">Ng &amp; Jordan (2002) &#183; the two results</div>
  <h2 style="margin-bottom:12px">Two regimes, proved and measured</h2>
  <div class="row top" style="gap:22px;margin-bottom:10px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Asymptotically</div>
      <p style="font-size:19px;max-width:none">With unlimited data, logistic regression&#8217;s
      error is <strong>no higher</strong> than naive Bayes&#8217;s &#8212; it fits the same family
      of boundaries without the independence assumption.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">On the way there</div>
      <p style="font-size:19px;max-width:none">With M features, naive Bayes needs on the order of
      <strong>log&#8201;M</strong> examples to approach its asymptote; logistic regression needs on
      the order of <strong>M</strong>. The generative model arrives first &#8212; at a higher
      error.</p>
    </div>
  </div>
  <div class="row top frag" data-f="1" style="gap:14px">
    <div class="col"><div class="fig" style="padding:6px"><img src="media/nj-pima.png" style="width:100%" alt="pima"></div></div>
    <div class="col"><div class="fig" style="padding:6px"><img src="media/nj-adult.png" style="width:100%" alt="adult"></div></div>
    <div class="col"><div class="fig" style="padding:6px"><img src="media/nj-promoters.png" style="width:100%" alt="promoters"></div></div>
  </div>
  <p class="caption frag" data-f="1" style="margin-top:8px">Three of the paper&#8217;s fifteen UCI
  panels (Ng &amp; Jordan 2002, Fig.&#8201;1; <strong>solid = naive Bayes, dashed = logistic
  regression</strong>). <em>pima</em> and <em>adult</em> show the predicted crossing; on
  <em>promoters</em>, a small dataset, logistic regression has not caught up within the data
  available.</p>`},

{s:"Part III", t:"Head to head", html:`
  <div class="eyebrow">The two paradigms, side by side</div>
  <h2 style="margin-bottom:12px">What each one assumes, and what it costs</h2>
  <table style="font-size:16.5px">
    <thead><tr><th style="width:26%"></th><th style="width:37%">Generative &#8212; model <span class="tex" data-tex="p(\\mathbf{x},t)"></span></th><th style="width:37%">Discriminative &#8212; model <span class="tex" data-tex="p(t \\mid \\mathbf{x})"></span></th></tr></thead>
    <tbody>
      <tr class="frag" data-f="0"><td><strong>What it learns</strong></td><td>how each class&#8217;s features are distributed</td><td>where the classes differ</td></tr>
      <tr class="frag" data-f="1"><td><strong>Data efficiency</strong></td><td>reaches its asymptotic error on little data &#8212; on the order of <span class="tex" data-tex="\\log M"></span> examples</td><td>needs more &#8212; on the order of <span class="tex" data-tex="M"></span> &#8212; but keeps improving</td></tr>
      <tr class="frag" data-f="2"><td><strong>Its assumption</strong></td><td>a form for <span class="tex" data-tex="p(\\mathbf{x} \\mid t)"></span>: here, independent features given the class. If that is wrong, the asymptote is higher and more data will not lower it</td><td>a form for the boundary: log-odds linear in the features it is given. No assumption about <span class="tex" data-tex="p(\\mathbf{x})"></span>, so independence cannot hurt it &#8212; but linearity can be wrong too</td></tr>
      <tr class="frag" data-f="3"><td><strong>Missing features</strong></td><td>integrate them out; the factor simply leaves</td><td>no <span class="tex" data-tex="p(\\mathbf{x})"></span> to integrate over &#8212; impute a value, add a missing-indicator feature, or fit one model per missingness pattern</td></tr>
      <tr class="frag" data-f="4"><td><strong>A new class appears</strong></td><td>fit its class-conditional, leave the others untouched</td><td>refit the boundary against everything</td></tr>
      <tr class="frag" data-f="5"><td><strong>Unfamiliar input</strong></td><td><span class="tex" data-tex="p(\\mathbf{x})"></span> is a direct estimate of how unusual the input is</td><td>no <span class="tex" data-tex="p(\\mathbf{x})"></span>; the epistemic uncertainty of Weeks 2&#8211;3 is about <span class="tex" data-tex="\\mathbf{w}"></span>, not <span class="tex" data-tex="\\mathbf{x}"></span></td></tr>
      <tr class="frag" data-f="6"><td><strong>Can it generate?</strong></td><td>yes, by construction</td><td>not by itself &#8212; <span class="tex" data-tex="p(t \\mid \\mathbf{x})"></span> defines no distribution over <span class="tex" data-tex="\\mathbf{x}"></span></td></tr>
      <tr class="frag" data-f="7"><td><strong>Cost</strong></td><td>modelling all of <span class="tex" data-tex="\\mathbf{x}"></span>, including structure the decision does not use</td><td>only the boundary is modelled</td></tr>
    </tbody>
  </table>
  <p class="caption frag" data-f="8" style="margin-top:8px;font-size:15px">Rows two and three are
  the trade-off: data efficiency in exchange for an assumption about <span class="tex" data-tex="p(\\mathbf{x} \\mid t)"></span> &#8212; the discriminative
  model swaps that for an assumption about the boundary.</p>`},

{s:"Part III", t:"When to choose which", draw:"which4", html:`
  <div class="eyebrow">Interactive &#183; the decision, as a game</div>
  <h2 style="margin-bottom:8px">When to choose which</h2>
  <p style="font-size:19px;margin-bottom:6px">Seven situations. <strong>Drag</strong> each onto the
  paradigm it favours &#8212; a wrong column flashes and the chip walks home.</p>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0;width:100%;max-width:1060px;margin:0 auto">
    <svg id="w4gsvg" viewBox="0 0 980 360" style="width:100%;display:block"></svg>
  </div>
  <div style="display:flex;gap:8px;margin-top:4px;align-items:center">
    <button class="bbtn" id="w4gr" type="button">reset</button>
    <p class="frag" data-f="0" style="font-size:17px;margin:0 0 0 14px;color:var(--ink-soft)">And the
    two combine: a generative model can supply structure, features, or training signal to a
    discriminative one.</p>
  </div>`},

{s:"Part III", t:"The story can hold a function", html:`
  <div class="eyebrow">Richer stories &#183; 1 of 3</div>
  <h2 style="margin-bottom:12px">Let a function drive the generation</h2>
  <p style="font-size:20px;margin-bottom:8px">Look at what naive Bayes really does with the class:
  <span class="tex" data-tex="t"></span> <strong>chooses the parameters</strong> of the feature distribution. Write that choice as a
  function:</p>
  <div class="eq" style="margin:10px 0 14px;font-size:22px"><span class="texd" data-tex="p(t)\\;p\\bigl(\\mathbf{x} \\mid f(t)\\bigr), \\qquad f(t) = (\\boldsymbol{\\mu}_t, \\mathbf{v}_t)"></span></div>
  <div class="row top stretch" style="gap:24px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">What <span class="tex" data-tex="f"></span> is today</div>
      <p style="font-size:19.5px;max-width:none">A <strong>lookup table</strong> with one row per
      class: <span class="tex" data-tex="f(1) = (\\boldsymbol{\\mu}_1, \\mathbf{v}_1),\\ f(0) = (\\boldsymbol{\\mu}_0, \\mathbf{v}_0)"></span>. Fitted by counting and averaging.</p>
    </div>
    <div class="col card accent frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">What <span class="tex" data-tex="f"></span> can be</div>
      <p style="font-size:19.5px;max-width:none">Any function &#8212; including a <strong>neural
      network</strong>: the distribution&#8217;s parameters <em>computed</em> from the input rather
      than stored. Bayes&#8217; rule at test time does not change.</p>
    </div>
  </div>`},

{s:"Part III", t:"Chain the story", draw:"chain4", html:`
  <div class="eyebrow">Richer stories &#183; 2 of 3 &#183; live demo</div>
  <h2 style="margin-bottom:10px">Chain the story, and bend it</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="ch4svg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19px;max-width:none">Give the story a <strong>middle</strong>: the class
      decides how hard the car was used, <span class="tex" data-tex="z"></span> &#8212; and the features grow out of <span class="tex" data-tex="z"></span> through a
      <strong>nonlinear</strong> <span class="tex" data-tex="f"></span>:</p>
      <div class="eq" style="margin:8px 0 10px;font-size:20px"><span class="texd" data-tex="p(t)\\;p(z \\mid t)\\;p\\bigl(\\mathbf{x} \\mid f(z)\\bigr)"></span></div>
      <div style="display:flex;gap:8px;margin:0 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="ch41" type="button">generate a car</button>
        <button class="bbtn" id="ch4sp" type="button">twenty more</button>
        <button class="bbtn" id="ch4r" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">cars generated</span><span class="v" id="ch4n">0</span></div>
      <p class="caption frag" data-f="0" style="margin-top:6px">The samples land along <span class="tex" data-tex="f"></span>&#8217;s
      curve, not in the axis-aligned ellipses we fitted today. Simple named pieces,
      chained through a nonlinear function, make a rich <span class="tex" data-tex="p(\\mathbf{x})"></span>. The class may also enter <span class="tex" data-tex="f"></span> directly: <span class="tex" data-tex="p(\\mathbf{x} \\mid f(z, t))"></span>.</p>
    </div>
  </div>`},

{s:"Part III", t:"When the middle is hidden", html:`
  <div class="eyebrow">Richer stories &#183; 3 of 3</div>
  <h2 style="margin-bottom:12px">Usually <span class="tex" data-tex="z"></span> is invisible &#8212; <em>latent</em></h2>
  <div class="row top" style="gap:26px">
    <div class="col">
      <p style="font-size:20px">Today every training row arrived <strong>labelled</strong> &#8212;
      the story&#8217;s first variable was visible, and the demo even showed us <span class="tex" data-tex="z"></span>. In the wild the
      middle of the story is unobserved &#8212; a <strong>latent variable</strong> &#8212; and the
      dataset holds <span class="tex" data-tex="\\mathbf{x}"></span> alone.</p>
      <p class="frag" data-f="0" style="font-size:20px;margin-top:10px">What remains to maximise is
      the probability of what was observed &#8212; with the hidden part summed out:</p>
      <div class="eq frag" data-f="0" style="margin:10px 0 0;font-size:21px"><span class="texd" data-tex="p(\\mathbf{x}) = \\sum_{t} \\int p(t)\\,p(z \\mid t)\\,p\\bigl(\\mathbf{x} \\mid f(z)\\bigr)\\,dz"></span></div>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px">Learning with hidden variables</div>
      <p style="font-size:19.5px;max-width:none">is <strong>unsupervised learning</strong>, and it is
      the later part of this semester: clustering first, then Week 12, where <span class="tex" data-tex="f"></span> is a neural network
      and <span class="tex" data-tex="z"></span> is never observed.</p>
      <p class="caption" style="margin-top:8px">Two members of that family have names you will keep
      hearing &#8212; a quick look at each.</p>
    </div>
  </div>`},

{s:"Part III", t:"Teaser: the VAE", draw:"vae4", html:`
  <div class="eyebrow">Lookahead &#183; Week 12</div>
  <h2 style="margin-bottom:10px">Swap the coin for a dial</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:8px">
    <svg viewBox="0 0 760 185"><g id="vae4fig"></g></svg>
  </div>
  <div class="row top frag" data-f="0" style="gap:30px;margin-top:4px">
    <div class="col">
      <p style="font-size:20px">Same two-step story. The discrete class becomes a continuous
      <strong>latent code</strong> <span class="tex" data-tex="\\mathbf{z} \\sim \\mathcal{N}(\\mathbf{0},\\mathbf{I})"></span>, and the two fitted clouds become a network that maps every
      <span class="tex" data-tex="\\mathbf{z}"></span> to a distribution over data &#8212; a <strong>variational autoencoder</strong>.</p>
    </div>
    <div class="col">
      <p style="font-size:20px">The catch is one we have met: with a network in the middle,
      <span class="tex" data-tex="p(\\mathbf{z} \\mid \\mathbf{x})"></span> has <strong>no closed form</strong> &#8212; Lecture 3&#8217;s lesson at scale. The
      &#8220;V&#8221; names the fix, and Week 12 builds it &#8212; KL divergence first,
      then the VAE.</p>
    </div>
  </div>`},

{s:"Part III", t:"Latent space, explored", draw:"vaez4", html:`
  <div class="eyebrow">Live demo &#183; a real VAE, decoded</div>
  <h2 style="margin-bottom:10px">The space organises itself</h2>
  <div class="row top" style="gap:22px">
    <div class="col" style="flex:0 0 316px">
      <div id="vz4box" style="position:relative;line-height:0;border-radius:6px;overflow:hidden;background:#000">
        <img src="media/vae-mnist-grid.png" style="width:100%;display:block" alt="MNIST VAE latent manifold">
        <div id="vz4mark" style="position:absolute;display:none;border:2px solid var(--accent);pointer-events:none"></div>
      </div>
      <p class="caption" style="margin-top:6px;text-align:center">the whole plane, <span class="tex" data-tex="z_1"></span> across, <span class="tex" data-tex="z_2"></span> up</p>
    </div>
    <div class="col" style="flex:0 0 236px">
      <div class="fig" style="padding:8px;background:#000;text-align:center">
        <canvas id="vz4out" width="240" height="240" style="width:100%;max-width:224px;display:inline-block"></canvas>
      </div>
      <p class="caption" style="margin-top:8px;text-align:center" id="vz4cap">move the pointer over the plane</p>
    </div>
    <div class="col">
      <p style="font-size:19px"><strong>Move the pointer over the plane.</strong> Every square is
      <span class="tex" data-tex="p(\\mathbf{x} \\mid \\mathbf{z})"></span> decoded at one <span class="tex" data-tex="\\mathbf{z}"></span> &#8212; not a stored image. Between the digits they morph, because the
      space is continuous.</p>
      <p class="frag" data-f="0" style="font-size:19px;margin-top:11px">Nobody told it about digit
      classes. Yet the 1s, 7s, 0s and 3s each took their own territory, and neighbours look alike.
      That is the sense in which <strong>the space organises itself</strong>.</p>
      <p class="frag" data-f="1" style="font-size:19px;margin-top:11px">That is what a latent buys:
      a continuous space you can walk, sample from, or hand to Bayes&#8217; rule &#8212; instead of
      a bag of stored examples.</p>
      <p class="caption frag" data-f="2" style="margin-top:11px">Decoder: T.&#8201;Denouden,
      <em>VAE-Latent-Space-Explorer</em> (MIT) &#8212; a convolutional VAE with a 2-D latent,
      trained on MNIST. We ran it over a 41&#215;41 grid of <span class="tex" data-tex="\\mathbf{z} \\in [-2.5,\\, 2.5]^2"></span>. We build this in Week 12.</p>
    </div>
  </div>`},

{s:"Part III", t:"Teaser: diffusion", draw:"diff4", html:`
  <div class="eyebrow">Lookahead &#183; beyond the syllabus, but one idea</div>
  <h2 style="margin-bottom:10px">Destroy an image slowly, learn to undo it</h2>
  <div class="demo">
    <div class="demo-plot" style="text-align:center">
      <p class="caption" style="margin:0 0 6px;text-align:center">forward &#8212; add a little noise
      at a time &#8594;</p>
      <canvas id="df4cv" width="128" height="128" style="width:340px;height:340px;max-width:100%;border-radius:8px;display:inline-block"></canvas>
      <p class="caption" style="margin:6px 0 0;text-align:center">&#8592; reverse &#8212; what the
      model is <strong>trained</strong> to do, one small step at a time</p>
    </div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">The forward direction needs no learning: mix the
      image with noise until nothing of it remains. A <strong>diffusion model</strong> is trained
      on the reverse &#8212; remove a little of the noise at a time &#8212; so a fresh draw of pure
      noise can be walked back into an image.</p>
      <div class="ctrl-row" style="margin-top:10px"><label>noise level <span class="val" id="df4tv">0%</span></label>
        <input type="range" id="df4t" min="0" max="1" step="0.02" value="0"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="bbtn" id="df4rs" type="button">a different draw of noise</button>
      </div>
      <div class="warn" id="df4warn" style="min-height:88px"></div>
      <p class="caption" style="margin-top:8px">Each denoising step is trained to predict the added
      noise, scored by <strong>squared error</strong> &#8212; Week 1&#8217;s loss. The face is
      itself a diffusion-model sample &#8212; Ho, Jain &amp; Abbeel (2020), Fig.&#8201;1, CelebA-HQ.
      Beyond the required syllabus; the idea is the takeaway.</p>
    </div>
  </div>`},

{s:"Part III", t:"Part III in one slide", html:`
  <div class="eyebrow">Before we close</div>
  <h2 style="margin-bottom:16px">Part III in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Bought</div><p style="font-size:20px;max-width:none">Missing features cost one factor; new listings cost one draw. Both come from owning a model of <span class="tex" data-tex="\\mathbf{x}"></span>.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Paid</div><p style="font-size:20px;max-width:none">Features that overlap within a class get double-counted, and the posteriors tend to run overconfident &#8212; and with plenty of data, a discriminative fit usually classifies better.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Kept</div><p style="font-size:20px;max-width:none">The framework, and the road: put a nonlinear <span class="tex" data-tex="f"></span> inside the story, chain in a middle variable &#8212; and when <span class="tex" data-tex="z"></span> is hidden, that is unsupervised learning, from clustering to Week 12&#8217;s VAE.</p></div>
  </div>`},

{s:"Part III", t:"Summary", html:`
  <div class="eyebrow">Today, in one slide</div>
  <h2 style="margin-bottom:14px">The recipe, run on the inputs</h2>
  <div class="row top stretch" style="gap:24px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">The flip</div>
      <p style="font-size:20px;max-width:none">Model <span class="tex" data-tex="p(\\mathbf{x} \\mid t)"></span> and <span class="tex" data-tex="p(t)"></span> &#8212; how a labelled row is
      produced. Bayes&#8217; rule answers the dealer at test time.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">The assumption</div>
      <p style="font-size:20px;max-width:none">Features independent within a class:
      <span class="tex" data-tex="p(\\mathbf{x} \\mid t) = \\prod_m p(x^m \\mid t)"></span>. Parameters linear in M.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">The fit</div>
      <p style="font-size:20px;max-width:none">MLE in closed form: <span class="tex" data-tex="\\hat{\\pi}_k = N_k/N"></span>, class means, class
      variances &#8212; counting and averaging. MAP and the full posterior stay closed form too.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:18px;text-align:center">
    Same three ingredients as every week &#8212; data, model, loss &#8212; with the model, for the
    first time, telling the whole story of the row.</p>`},

{s:"Part III", t:"Key ideas", html:`
  <div class="eyebrow">Recap</div>
  <h2 style="margin-bottom:16px">What to take away</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Two modelling routes</div>
      <p style="font-size:20px;max-width:none">Discriminative models answer the question directly;
      generative models tell the data&#8217;s story and answer via Bayes&#8217; rule. Each buys
      different things.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Independence is a lever</div>
      <p style="font-size:20px;max-width:none">One conditional-independence assumption turned a
      joint with far too many parameters into a per-feature product &#8212; and training into
      counting.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Constraints join the course</div>
      <p style="font-size:20px;max-width:none">The Lagrangian fitted the Categorical prior in three
      lines. It returns for SVMs in Week 10.</p>
    </div>
  </div>`},

{s:"Part III", t:"Summary: over four weeks", html:`
  <div class="eyebrow">Where we are &#183; Week 4 of 13</div>
  <h2 style="margin-bottom:12px">Summary: over four weeks</h2>
  <table style="font-size:16.5px">
    <thead><tr><th style="width:15%">Week</th><th style="width:18%">The model</th>
      <th style="width:20%">The loss we minimised</th><th style="width:21%">&#8230; which was a likelihood</th>
      <th style="width:26%">How we fitted it</th></tr></thead>
    <tbody>
      <tr><td><strong>1</strong>&nbsp;Regression</td><td>a line, then a curve</td><td>squared error</td><td>Gaussian noise around the line</td><td>MLE</td></tr>
      <tr class="frag" data-f="0"><td><strong>2</strong>&nbsp;Probability</td><td>Gaussians, priors</td><td>negative log-likelihood</td><td>the Gaussian&#8217;s own, plus a prior</td><td>MLE, MAP, and the full posterior &#8212; closed form</td></tr>
      <tr class="frag" data-f="1"><td><strong>3</strong>&nbsp;Classification</td><td>a boundary, <span class="tex" data-tex="y = \\sigma(\\mathbf{w}^\\top \\mathbf{x})"></span></td><td>cross-entropy</td><td>Bernoulli, one flip per row</td><td>MLE and MAP by gradient descent; the posterior only <strong>approximately</strong> (Laplace)</td></tr>

const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;
function highlight(){
  /* Placeholders are delimited by private-use code points and indexed with a
     LETTER, not a digit: a digit index would be re-matched by the number rule. */
  const OPEN='', CLOSE='';
  document.querySelectorAll('pre.code').forEach(function(pre){
    if(pre.dataset.hl) return; pre.dataset.hl='1';
    let h=pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const stash=[];
    const keep=function(html){ stash.push(html); return OPEN+String.fromCharCode(65+stash.length-1)+CLOSE; };
    h=h.replace(/#[^\n]*/g, function(m){ return keep('<span class="tok-com">'+m+'</span>'); });
    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    h=h.replace(/\b([A-Za-z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
    h=h.replace(new RegExp(OPEN+'([A-Z])'+CLOSE,'g'), function(_,c){ return stash[c.charCodeAt(0)-65]; });
    pre.innerHTML=h;
  });
}

/* ---------------------------------------------------------------- the fit
   Naive Bayes trained on the sixty cars: one count, four means, four variances,
   and (for the comparison ellipse) the full 2x2 sample covariances. */
let _nb=null;
function nbFit(){
  if(_nb) return _nb;
  const stats=D=>{
    const n=D.length;
    const m=[D.reduce((a,p)=>a+p[0],0)/n, D.reduce((a,p)=>a+p[1],0)/n];
    const v=[D.reduce((a,p)=>a+(p[0]-m[0])*(p[0]-m[0]),0)/n,
             D.reduce((a,p)=>a+(p[1]-m[1])*(p[1]-m[1]),0)/n];
    const c01=D.reduce((a,p)=>a+(p[0]-m[0])*(p[1]-m[1]),0)/n;
    return {n,m,v,cov:[[v[0],c01],[c01,v[1]]]};
  };
  const s1=stats(D4_SOLD), s0=stats(D4_LOT);
  _nb={pi:s1.n/(s1.n+s0.n), c1:s1, c0:s0};
  return _nb;
}
/* class-conditional density under the naive model */
function nbPx(cls,x){
  const B=nbFit(), c=cls?B.c1:B.c0;
  return NPDF4(x[0],c.m[0],c.v[0])*NPDF4(x[1],c.m[1],c.v[1]);
}
/* posterior p(sold | x), optionally with shared (pooled) variances, optionally
   ignoring one feature (the missing-data slide drops its factor) */
function nbPost(x,opts){
  opts=opts||{};
  const B=nbFit();
  const v1=opts.shared?[ (B.c1.n*B.c1.v[0]+B.c0.n*B.c0.v[0])/60, (B.c1.n*B.c1.v[1]+B.c0.n*B.c0.v[1])/60 ]:B.c1.v;
  const v0=opts.shared?v1:B.c0.v;
  let l1=Math.log(B.pi), l0=Math.log(1-B.pi);
  if(!opts.skipAge){ l1+=Math.log(NPDF4(x[0],B.c1.m[0],v1[0])); l0+=Math.log(NPDF4(x[0],B.c0.m[0],v0[0])); }
  if(!opts.skipMile){ l1+=Math.log(NPDF4(x[1],B.c1.m[1],v1[1])); l0+=Math.log(NPDF4(x[1],B.c0.m[1],v0[1])); }
  if(opts.dupMile){ l1+=Math.log(NPDF4(x[1],B.c1.m[1],v1[1])); l0+=Math.log(NPDF4(x[1],B.c0.m[1],v0[1])); }
  const m=Math.max(l1,l0);
  return Math.exp(l1-m)/(Math.exp(l1-m)+Math.exp(l0-m));
}

function ellipse4(A,m,C,col,dash){
  const tr=C[0][0]+C[1][1], dd=Math.sqrt(Math.max(0,(C[0][0]-C[1][1])*(C[0][0]-C[1][1])/4+C[0][1]*C[0][1]));
  const l1=tr/2+dd, l2=Math.max(tr/2-dd,1e-9);
  const th=Math.abs(C[0][1])<1e-12?0:Math.atan2(l1-C[0][0],C[0][1]);
  let pts=[];
  for(let i=0;i<=72;i++){ const t=i/72*2*Math.PI;
    const ex=2*Math.sqrt(l1)*Math.cos(t), ey=2*Math.sqrt(l2)*Math.sin(t);
    pts.push([A.X(m[0]+ex*Math.cos(th)-ey*Math.sin(th)), A.Y(m[1]+ex*Math.sin(th)+ey*Math.cos(th))]); }
  return '<path d="'+pathOf(pts)+' Z" fill="none" stroke="'+col+'" stroke-width="2.2"'
   + (dash?' stroke-dasharray="6 4"':'')+'/>';
}

  const gx=i=>(i+0.5)*13/NB_GX, gy=j=>(j+0.5)*16/NB_GY;
  const V=[];
  for(let i=0;i<NB_GX;i++){ V.push([]);
    for(let j=0;j<NB_GY;j++) V[i].push(nbPost([gx(i),gy(j)],opts)-0.5); }
  for(let i=0;i<NB_GX-1;i++) for(let j=0;j<NB_GY-1;j++){
    const c=[[gx(i),gy(j),V[i][j]],[gx(i+1),gy(j),V[i+1][j]],
             [gx(i+1),gy(j+1),V[i+1][j+1]],[gx(i),gy(j+1),V[i][j+1]]];
    const pts=[];
    for(let e=0;e<4;e++){ const [xa,ya,va]=c[e], [xb,yb,vb]=c[(e+1)%4];
      if((va>0)!==(vb>0)){ const t=va/(va-vb); pts.push([xa+t*(xb-xa), ya+t*(yb-ya)]); } }
    if(pts.length===2)
      seg+='<line x1="'+A.X(pts[0][0])+'" y1="'+A.Y(pts[0][1])+'" x2="'+A.X(pts[1][0])+'" y2="'+A.Y(pts[1][1])+'"/>';
  }
  return '<g stroke="var(--ink)" stroke-width="2.6" clip-path="url(#'+cid+')">'+seg+'</g>';
}
function nbBar(yTop){
  const x0=120, w=320, n=48;
  let s='<text class="legend" x="'+(x0+w/2)+'" y="'+(yTop-6)+'" text-anchor="middle">background: p(sells | x) from the fitted model</text>';
  for(let i=0;i<n;i++){
    const p=i/(n-1), a=Math.abs(p-0.5)*2*0.34;
    s+='<rect x="'+(x0+i*w/n)+'" y="'+yTop+'" width="'+(w/n+0.5)+'" height="12" fill="var(--s'+(p>0.5?1:2)+')" opacity="'+Math.max(a,0.012).toFixed(3)+'"/>';
  }
  s+='<rect x="'+x0+'" y="'+yTop+'" width="'+w+'" height="12" fill="none" stroke="var(--rule)"/>';
  [[0,'0 &#8212; does not sell'],[0.5,'&#189;'],[1,'1 &#8212; sells']].forEach(([p,lab])=>{
    s+='<text class="tick" x="'+(x0+p*w)+'" y="'+(yTop+27)+'" text-anchor="middle">'+lab+'</text>'; });
  return s;
}
