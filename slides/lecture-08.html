<style>
/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank
   ============================================================ */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide changes are immediate to keep text appearance stable. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}


/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
li.qz::before{display:none}li.qz{padding-left:6px}
#of5 text,#bvp5 text,#bvs5 text,#bvc5 text,#bvi5 text,#bvk5 text,#bvt5 text,#cvc5 text,#dd5 text,#hfv5 text,#uat7a text,#uat7b text,#uat7c text,#uat7d text,#relu7 text,#depth7 text,#act7 text,#sgd7 text,#grd6 text,#grow6 text,#vc6 text,#sc6 text,#goal6 text,#goal6r text,#bnd6 text,#bnd6f text,#bnd6r text,#ddx6 text,#hoef6 text,#pick6 text,#rlzc6 text{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.texd .katex{font-size:1.12em}

/* ---- figures, images, video ---- */
/* Rounded corners, no outline. A border plus a filled background drew a visible
   box around every image — obvious when the image letterboxes inside it. */

  background:transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.fig img,.fig video{display:block;width:100%;height:auto}
/* Click-to-load YouTube facade. Nothing is requested from Google until the play button is
   pressed, so the deck opens instantly and makes no third-party connection if the video is
   never reached. Used wherever we point at someone else's clip instead of re-hosting it. */
.ytfacade{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;
  position:relative;line-height:0;border-radius:inherit;overflow:hidden}
.ytfacade img{display:block;width:100%;height:auto}
.ytplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:55px;
  border-radius:13px;background:rgba(18,18,18,.72);transition:background .16s ease}
.ytplay::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-38%,-50%);
  border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff}
.ytfacade:hover .ytplay,.ytfacade:focus-visible .ytplay{background:#cc0000}
.ytwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
/* Height-capped figures: letterbox rather than crop.
   Flex + max-height (not grid + height:100%) — a percentage height inside an
   auto-sized grid row resolves to auto, which lets the image overflow and clip. */
/* letterboxed figures get no shadow either — there is nothing to cast one */
.fig[class*="h-"]{display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none}
.fig[class*="h-"] img,.fig[class*="h-"] video{width:auto;height:auto;max-width:100%;max-height:100%}
.fig[class*="h-"] svg{width:100%;height:100%}

.fig.h-290{height:290px}.fig.h-330{height:330px}

/* ---------- PRINT: one page per slide ----------
   The deck is a 1280x720 design canvas that fit() scales to the window. For print we
   drop that scale, let the slides flow one after another instead of stacking, and set
   the page to the same 1280x720 -- 13.333in x 7.5in at 96dpi, the standard widescreen
   slide size -- so a printed page is what the projector shows, at 1:1.
   Chrome's "Save as PDF" destination turns this into a deck PDF. */
@media print{
  @page{ size:13.333in 7.5in; margin:0 }
  html,body{height:auto;overflow:visible}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none}
  #stage{position:static;display:block;transition:none}
  #canvas{transform:none!important;width:1280px;height:auto;overflow:visible;
    background:transparent;transition:none}
  .slide{position:relative;inset:auto;width:1280px;height:720px;overflow:hidden;
    background:var(--bg);opacity:1!important;visibility:visible!important;
    transition:none!important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .frag{opacity:1!important}
  /* presenter chrome has no business on paper */
  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}

{s:"Part I", t:"Question: how many weights?", html:`<div class="actbadge">Question</div><div class="actq" style="font-size:29px;margin:16px 0 30px">The convolution has 24 connections. An MLP layer has 80. How many weights does the convolution learn?</div><div class="f7-answers"><button class="card q8opt" type="button" data-ok="0"><strong>A.</strong> 80</button><button class="card q8opt" type="button" data-ok="0"><strong>B.</strong> 24</button><button class="card q8opt" type="button" data-ok="1"><strong>C.</strong> 3</button></div>`},

{s:"Part I", t:"Weight sharing", draw:"share8", html:`<div class="eyebrow">The answer is C &#183; Property 2 &#183; Parameter sharing</div><h2>Weight sharing</h2><svg id="share8" class="l8-fig" viewBox="0 0 1040 376" role="img" aria-label="The connections that use one kernel weight are highlighted"></svg><div class="l8-buttons"><button class="bbtn" id="share8w0" type="button">First weight</button><button class="bbtn sel" id="share8w1" type="button">Middle weight</button><button class="bbtn" id="share8w2" type="button">Last weight</button></div><div class="l8-readout" id="share8r"></div>`},

{s:"Part I", t:"Question: the weight matrix", html:`<div class="actbadge">Question</div><div class="actq" style="font-size:29px;margin:16px 0 26px">Write the convolution as <span class="tex" data-tex="\\mathbf y=\\mathbf W\\mathbf x"></span>. What does the weight matrix look like?</div><div class="frag" data-f="0"><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="\\mathbf W=\\begin{bmatrix}1&-1&1&0&0&\\cdots&0\\\\0&1&-1&1&0&\\cdots&0\\\\\\vdots&&\\ddots&\\ddots&\\ddots&&\\vdots\\\\0&\\cdots&0&0&1&-1&1\\end{bmatrix}"></span></div><p class="n7-centre-note">The matrix is <strong>sparse with shared weights</strong>.<br>Sparse means most entries are zero.<br>Shared weights appear as the same three values in every row, shifted one place.</p></div>`},

{s:"Part I", t:"Equivariance to translation", draw:"equi8", html:`<div class="eyebrow">I-B &#183; Property 3 &#183; Equivariance</div><h2>Equivariance to translation</h2><svg id="equi8" class="l8-fig" viewBox="0 0 1040 412" role="img" aria-label="The input and its output, before and after the input is shifted to the right"></svg><div class="l8-slider"><label for="equi8s">Shift the input right by <output id="equi8v">0</output></label><input id="equi8s" type="range" min="0" max="2" step="1" value="0"></div>`},

{s:"Part I", t:"Equivariance", html:`<div class="eyebrow">I-B &#183; Property 3 &#183; Equivariance</div><h2>Equivariance</h2><div class="l8-split l8-equi"><div><p class="n7-copy" style="font-size:26px">A function <span class="tex" data-tex="f"></span> is <strong style="color:var(--s2)">equivariant</strong> to a transformation <span class="tex" data-tex="g"></span> if</p><div class="eq l7-eq n7-equation" style="font-size:36px"><span class="texd" data-tex="f(g(x))=g(f(x))"></span></div><ul class="flow7-bullets f7-bullets"><li><span class="tex" data-tex="g"></span>: the same shift in input and output</li><li><span class="tex" data-tex="f"></span>: stride-1 convolution, away from boundaries</li></ul><p class="n7-copy" style="font-size:24px;margin-top:24px"><strong>Invariant:</strong> <span class="tex" data-tex="f(g(x))=f(x)"></span></p></div><div class="l8-equi-figs"><img src="media/l8-equivariant-invariant.png" alt="Equivariant: transforming an image with g and then segmenting it with f gives the same result as segmenting first and then transforming. Invariant: a rotated digit 3 is still classified as 3."><img src="media/l8-translation-equivariance.png" alt="A digit 4 is translated by T. Its feature maps are translated by the same T: mapping then translating equals translating then mapping."><p class="cred">Image credit: <a href="https://chriswolfvision.medium.com/what-is-translation-equivariance-and-why-do-we-use-convolutions-to-get-it-6f18139d4c59" target="_blank" rel="noopener">chriswolfvision.medium.com</a></p></div></div>`},

{s:"Part I", t:"Multiple kernels / filters", draw:"multi8", html:`<div class="eyebrow">I-B &#183; Stage 1 of 3 &#183; Convolution</div><h2>Multiple kernels / filters</h2><svg id="multi8" class="l8-fig" viewBox="0 0 1040 400" role="img" aria-label="Three kernels applied to the same input give three output rows, called channels"></svg><div class="l8-buttons"><button class="bbtn sel" id="multi8k0" type="button">Kernel 1</button><button class="bbtn" id="multi8k1" type="button">Kernel 2</button><button class="bbtn" id="multi8k2" type="button">Kernel 3</button></div>`},

{s:"Part III", t:"Step 1: positional embeddings", html:`<div class="eyebrow">III-B &#183; Step 1 of 4</div><h2>Self-attention steps</h2><div class="l8-steps"><div class="l8-steps-stack"><div class="l8-step">Combine the<br>value vectors</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute attention<br>weights</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute query, key,<br>and value matrices</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step on">Add position<br>information</div></div><div class="l8-steps-body"><div class="l8-emb"><div class="l8-emb-col"><div class="zh">&#25105;</div><div class="py">W&#466;</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_1"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_1"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_1"></span></div></div><div class="l8-emb-col frag" data-f="0"><div class="zh">&#32473;</div><div class="py">g&#283;i</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_2"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_2"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_2"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#22905;</div><div class="py">t&#257;</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_3"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_3"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_3"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#20080;</div><div class="py">m&#462;i</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_4"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_4"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_4"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#20102;</div><div class="py">le</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_5"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_5"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_5"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#19968;</div><div class="py">y&#299;</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_6"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_6"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_6"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#21488;</div><div class="py">t&#225;i</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_7"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_7"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_7"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#30005;</div><div class="py">di&#224;n</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_8"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_8"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_8"></span></div></div><div class="l8-emb-col frag" data-f="1"><div class="zh">&#33041;</div><div class="py">n&#462;o</div><svg class="l8-emb-arrow" viewBox="0 0 16 32" aria-hidden="true"><line x1="8" y1="0" x2="8" y2="22"/><path d="M8 32 l-7 -12 h14 z"/></svg><div class="m"><span class="tex" data-tex="\\hat{\\mathbf e}_9"></span></div><div class="op">+</div><div class="m"><span class="tex" data-tex="\\mathbf p_9"></span></div><div class="op">=</div><div class="m"><span class="tex" data-tex="\\mathbf e_9"></span></div></div></div><p class="n7-small l8-centre" style="margin-top:14px"><span class="tex" data-tex="\\hat{\\mathbf e}_i"></span>: what the token is. &ensp; <span class="tex" data-tex="\\mathbf p_i"></span>: where the token is.</p></div></div>`},

{s:"Part III", t:"Step 1: the matrix E", html:`<div class="eyebrow">III-B &#183; Step 1 of 4</div><h2>Self-attention steps</h2><div class="l8-steps"><div class="l8-steps-stack"><div class="l8-step">Combine the<br>value vectors</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute attention<br>weights</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute query, key,<br>and value matrices</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step on">Add position<br>information</div></div><div class="l8-steps-body"><div class="eq l7-eq n7-equation" style="font-size:42px"><span class="texd" data-tex="\\mathbf E=\\begin{bmatrix}\\mathbf e_1^{\\top}\\\\[5pt]\\mathbf e_2^{\\top}\\\\[2pt]\\vdots\\\\[2pt]\\mathbf e_T^{\\top}\\end{bmatrix}"></span></div><p class="n7-centre-note">Each row represents one token.</p></div></div>`},

{s:"Part III", t:"Step 2: query, key, value", html:`<div class="eyebrow">III-B &#183; Step 2 of 4</div><h2>Self-attention steps</h2><div class="l8-steps"><div class="l8-steps-stack"><div class="l8-step">Combine the<br>value vectors</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute attention<br>weights</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step on">Compute query, key,<br>and value matrices</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Add position<br>information</div></div><div class="l8-steps-body"><div class="l8-qkv" style="font-size:34px"><strong style="color:var(--s1)">Query</strong><span><span class="tex" data-tex="\\mathbf E\\,\\mathbf W_Q=\\textcolor{#2E6DA4}{\\mathbf Q}"></span></span><strong style="color:var(--s4)">Key</strong><span><span class="tex" data-tex="\\mathbf E\\,\\mathbf W_K=\\textcolor{#3F7F62}{\\mathbf K}"></span></span><strong style="color:var(--s5)">Value</strong><span><span class="tex" data-tex="\\mathbf E\\,\\mathbf W_V=\\textcolor{#7B3FA0}{\\mathbf V}"></span></span></div><p class="n7-centre-note" style="margin-top:26px">Learned projections produce queries, keys, and values. Queries and keys determine how much of each value to use.</p></div></div>`},

{s:"Part III", t:"Step 3: attention weights", html:`<div class="eyebrow">III-B &#183; Step 3 of 4</div><h2>Self-attention steps</h2><div class="l8-steps"><div class="l8-steps-stack"><div class="l8-step">Combine the<br>value vectors</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step on">Compute attention<br>weights</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute query, key,<br>and value matrices</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Add position<br>information</div></div><div class="l8-steps-body"><p class="n7-copy"><strong>Idea:</strong> compare each query with every key.</p><div class="eq l7-eq n7-equation" style="font-size:34px"><span class="texd" data-tex="\\textcolor{#B8862B}{\\mathbf S}=\\operatorname{softmax}\\!\\left(\\frac{\\textcolor{#2E6DA4}{\\mathbf Q}\\,\\textcolor{#3F7F62}{\\mathbf K}^{\\top}}{\\sqrt{d_k}}\\right)"></span></div><ul class="flow7-bullets f7-bullets"><li><strong>Dot product:</strong> a query–key score.</li><li><strong>Scaling:</strong> divide by <span class="tex" data-tex="\\sqrt{d_k}"></span>, where <span class="tex" data-tex="d_k"></span> is the key dimension.</li><li><strong>Softmax:</strong> apply to each row. The weights sum to 1.</li></ul></div></div>`},

{s:"Part III", t:"Step 3: a picture of the weights", draw:"heat8", html:`<div class="eyebrow">III-B &#183; Step 3 of 4</div><h2>Self-attention steps</h2><div class="l8-steps"><div class="l8-steps-stack"><div class="l8-step">Combine the<br>value vectors</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step on">Compute attention<br>weights</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute query, key,<br>and value matrices</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Add position<br>information</div></div><div class="l8-steps-body"><p class="n7-copy"><strong>Idea:</strong> compare each query with every key.</p><div class="l8-narrow" style="max-width:360px"><svg id="heat8" class="l8-fig" viewBox="0 0 480 470" role="img" aria-label="A nine by nine grid of attention weights for the Chinese sentence. Nearby and related words get larger weights"></svg></div><p class="n7-small l8-centre" style="margin:2px 0 0">Example weights chosen for this illustration.</p></div></div>`},

{s:"Part III", t:"Step 4: extract features", draw:"sv8", html:`<div class="eyebrow">III-B &#183; Step 4 of 4</div><h2>Self-attention steps</h2><div class="l8-steps"><div class="l8-steps-stack"><div class="l8-step on">Combine the<br>value vectors</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute attention<br>weights</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Compute query, key,<br>and value matrices</div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div class="l8-step">Add position<br>information</div></div><div class="l8-steps-body"><p class="n7-copy"><strong>Idea:</strong> combine the value vectors using these weights.</p><div class="l8-narrow" style="max-width:680px"><svg id="sv8" class="l8-fig" viewBox="0 0 770 344" role="img" aria-label="The nine by nine grid of attention weights, times a grid of values with one row per word, gives the output grid"></svg></div><div class="eq l7-eq n7-equation l8-tight" style="font-size:30px"><span class="texd" data-tex="\\mathbf O=\\textcolor{#B8862B}{\\mathbf S}\\,\\textcolor{#7B3FA0}{\\mathbf V}"></span></div></div></div>`},

{s:"Part III", t:"Self-attention summary", html:`<div class="eyebrow">III-B &#183; All four steps</div><h2>Self-attention summary</h2><div class="card l8-sdpa"><div class="l8-sdpa-title">Scaled dot-product attention</div><div class="l8-sum-grid"><div class="l8-step">Combine the<br>value vectors</div><div class="l8-sum-eq"><div class="eq l7-eq n7-equation" style="font-size:24px"><span class="texd" data-tex="\\mathbf O=\\textcolor{#B8862B}{\\mathbf S}\\,\\textcolor{#7B3FA0}{\\mathbf V}"></span></div></div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div></div><div class="l8-step">Compute attention<br>weights</div><div class="l8-sum-eq"><div class="eq l7-eq n7-equation" style="font-size:23px"><span class="texd" data-tex="\\textcolor{#B8862B}{\\mathbf S}=\\operatorname{softmax}\\!\\left(\\frac{\\textcolor{#2E6DA4}{\\mathbf Q}\\,\\textcolor{#3F7F62}{\\mathbf K}^{\\top}}{\\sqrt{d_k}}\\right)"></span></div></div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div></div><div class="l8-step">Compute query, key,<br>and value matrices</div><div class="l8-sum-eq"><div class="l8-qkv" style="font-size:22px"><strong style="color:var(--s1)">Query</strong><span><span class="tex" data-tex="\\mathbf E\\,\\mathbf W_Q=\\textcolor{#2E6DA4}{\\mathbf Q}"></span></span><strong style="color:var(--s4)">Key</strong><span><span class="tex" data-tex="\\mathbf E\\,\\mathbf W_K=\\textcolor{#3F7F62}{\\mathbf K}"></span></span><strong style="color:var(--s5)">Value</strong><span><span class="tex" data-tex="\\mathbf E\\,\\mathbf W_V=\\textcolor{#7B3FA0}{\\mathbf V}"></span></span></div></div><svg class="l8-step-arrow" viewBox="0 0 28 22" aria-hidden="true"><path d="M14 0 L27 12 H19 V22 H9 V12 H1 Z"/></svg><div></div><div class="l8-step">Add position<br>information</div><div class="l8-sum-eq"><div class="eq l7-eq n7-equation" style="font-size:19px"><span class="texd" data-tex="\\mathbf E=\\begin{bmatrix}\\mathbf e_1^{\\top}\\\\[3pt]\\mathbf e_2^{\\top}\\\\\\vdots\\\\\\mathbf e_T^{\\top}\\end{bmatrix}"></span></div></div></div></div>`},

pacity:0.14;stroke:var(--s1);stroke-width:2.5"/><text x="840" y="110" text-anchor="middle" style="font-family:var(--font-sans);font-size:20px;font-weight:400;fill:var(--ink)">Scaled dot-product</text><text x="840" y="138" text-anchor="middle" style="font-family:var(--font-sans);font-size:20px;font-weight:400;fill:var(--ink)">attention 3</text><line x1="840" y1="70" x2="840.00" y2="55.50" style="stroke:var(--s1);stroke-width:3;stroke-linecap:round"/><path d="M840 46 L845.04 56.50 L834.96 56.50 Z" style="fill:var(--s1)"/><line x1="840" y1="206" x2="840.00" y2="171.50" style="stroke:var(--s1);stroke-width:3;stroke-linecap:round"/><path d="M840 162 L845.04 172.50 L834.96 172.50 Z" style="fill:var(--s1)"/><line x1="200" y1="206" x2="840" y2="206" style="stroke:var(--s1);stroke-width:3"/><line x1="520" y1="206" x2="520" y2="232" style="stroke:var(--s1);stroke-width:3"/><text x="520" y="256" text-anchor="middle" style="font-family:var(--font-sans);font-size:20px;font-weight:700;fill:var(--ink)">Input sequence</text></svg><div class="l8-lab l8-lab-c" style="left:19.231%;top:8.397%;font-size:27px;font-size:2.5962cqw;color:var(--s1)"><span class="tex" data-tex="\\mathbf O_1"></span></div><div class="l8-lab l8-lab-c" style="left:50.000%;top:8.397%;font-size:27px;font-size:2.5962cqw;color:var(--s1)"><span class="tex" data-tex="\\mathbf O_2"></span></div><div class="l8-lab l8-lab-c" style="left:80.769%;top:8.397%;font-size:27px;font-size:2.5962cqw;color:var(--s1)"><span class="tex" data-tex="\\mathbf O_3"></span></div><div class="l8-lab l8-lab-r" style="left:15.962%;top:8.397%;font-size:27px;font-size:2.5962cqw;color:var(--s1)"><span class="tex" data-tex="\\big["></span></div><div class="l8-lab l8-lab-l" style="left:84.038%;top:8.397%;font-size:27px;font-size:2.5962cqw;color:var(--s1)"><span class="tex" data-tex="\\big]\\times\\mathbf W_O"></span></div></div><p class="n7-centre-note">Each head learns its own <span class="tex" data-tex="\\mathbf W_Q,\\mathbf W_K,\\mathbf W_V"></span>.</p>`},

{s:"Part III", t:"Transformers", html:`<div class="eyebrow">III-C &#183; Attention replaces recurrence</div><h2>Transformers</h2><div class="l8-check"><div><span>&#9989;</span>Variable-length sequences</div><div><span>&#9989;</span>Uses sequence order <em>(with positional embeddings)</em></div><div><span>&#9989;</span>Shared parameters across positions</div></div><div class="l8-check" style="margin-top:26px;font-size:24px"><div><span>&#9989;</span><span><strong>Shorter gradient paths across positions</strong><br><span class="n7-small">Attention connects distant positions directly.</span></span></div><div><span>&#9989;</span><span><strong>Access to context at every position</strong><br><span class="n7-small">Keep a representation for each token.</span></span></div><div><span>&#9989;</span><span><strong>Parallel computation within each layer</strong><br><span class="n7-small">Update positions without waiting for earlier state updates.</span></span></div></div><p class="n7-small frag" data-f="0" style="margin-top:18px"><strong>Blocks:</strong> attention and feed-forward layers, with residual paths and normalization.<br>Gradient problems remain possible. Full attention has quadratic cost. <a href="https://arxiv.org/abs/2410.01201" target="_blank" rel="noopener">RNNs remain useful (Feng et al., 2024)</a></p>`},

{s:"Part III", t:"Question: remove the positions", html:`<div class="actbadge">Question</div><div class="actq" style="font-size:28px;margin:16px 0 30px">Assume self-attention without positional embeddings. Each token can attend to every token. If we swap two input words, what happens to the outputs?</div><div class="f7-answers"><button class="card q8opt" type="button" data-ok="0"><strong>A.</strong> Nothing changes.</button><button class="card q8opt" type="button" data-ok="1"><strong>B.</strong> The two outputs swap as well.</button><button class="card q8opt" type="button" data-ok="0"><strong>C.</strong> Every output changes.</button></div>`},

{s:"Part III", t:"Permutation equivariance", html:`<div class="eyebrow">The answer is B</div><h2>Permutation equivariance</h2><div class="eq l7-eq n7-equation" style="font-size:34px"><span class="texd" data-tex="f(\\mathbf P\\mathbf E)=\\mathbf P\\,f(\\mathbf E)"></span></div><p class="n7-centre-note"><span class="tex" data-tex="\\mathbf P"></span> reorders the rows. <span class="tex" data-tex="f"></span> is self-attention without positional embeddings.</p><ul class="flow7-bullets f7-bullets"><li>Reordering the inputs gives the <strong>same reordering</strong> of the outputs.</li><li>&#8220;dog bites man&#8221; and &#8220;man bites dog&#8221; give the same outputs, but reordered.</li><li>Positional embeddings let the model use word order.</li></ul>`},

{s:"Part IV", t:"Part IV", div:true, html:`<div class="divider"><div class="num">Part IV</div><h1>Summary</h1><div class="bar"></div><div class="sub">What we learnt.</div></div>`},

{s:"Part IV", t:"Key ideas, again", html:`<div class="eyebrow">Main ideas</div><h2>Key ideas</h2><div class="d7-key-message">Neural networks are &#8220;differentiable programs&#8221;.</div><table class="l8-table"><thead><tr><th>Architecture</th><th>Computation structure</th><th>Assumption about the data</th></tr></thead><tbody><tr><td>CNN</td><td>Small shared filters</td><td>Patterns are local, and can appear anywhere</td></tr><tr><td>RNN</td><td>A state updated in order</td><td>Order matters</td></tr><tr><td>Transformer</td><td>Content-based attention</td><td>Useful context can be far away</td></tr></tbody></table>`},

{s:"Part IV", t:"Learning objectives, again", html:`<div class="eyebrow">Return to the learning objectives</div><h2>Learning objectives</h2><div class="flow7-body"><div class="flow7-numbered"><div class="flow7-no">1</div><div><strong>Explain</strong> how network structure expresses assumptions about the data.</div><div class="flow7-no">2</div><div><strong>Compute</strong> convolution, ReLU, and max-pooling outputs.</div><div class="flow7-no">3</div><div><strong>Explain</strong> sparse connections, weight sharing, and equivariance.</div><div class="flow7-no">4</div><div><strong>Explain</strong> the strengths and limits of RNNs.</div><div class="flow7-no">5</div><div><strong>Compute</strong> self-attention in four steps.</div></div></div>`},

{s:"Activity", t:"Mirror symmetry: two goals", draw:"mirGoals8", html:`<div class="eyebrow">Activity · Choose the output</div><h2>Mirror symmetry: two goals</h2><p class="n7-copy">Flip an input image. How should the model output respond?</p><svg id="mirGoals8" class="l8-fig" viewBox="0 0 1040 218" role="img" aria-label="Equivariance: a feature map flips. Invariance: the class label remains L shape."></svg><div class="l8-two"><div><div class="eq l7-eq n7-equation" style="font-size:30px"><span class="texd" data-tex="f(R\\mathbf x)=R f(\\mathbf x)"></span></div></div><div><div class="eq l7-eq n7-equation" style="font-size:30px"><span class="texd" data-tex="g(R\\mathbf x)=g(\\mathbf x)"></span></div></div></div><p class="n7-centre-note"><span class="tex" data-tex="R"></span> denotes a mirror flip.</p>`},

{s:"Activity", t:"Design an operation that is mirror equivariant", html:`<div class="actbadge">Activity &#183; in pairs &#183; 10 minutes</div><div class="actq" style="font-size:31px;margin:16px 0 8px">Design an operation that is mirror equivariant</div><p class="n7-copy">Start with a one-dimensional input. Assume convolution with stride 1 and equal zero-padding on both ends.</p><div class="eq l7-eq n7-equation" style="font-size:30px"><span class="texd" data-tex="f(\\operatorname{flip}(\\mathbf x))=\\operatorname{flip}(f(\\mathbf x))"></span></div><div class="flow7-numbered"><div class="flow7-no">1</div><div>Which kernels <span class="tex" data-tex="[w_1,w_2]"></span> already work?</div><div class="flow7-no">2</div><div>Modify the operation so that <strong>any</strong> kernel works.</div><div class="flow7-no">3</div><div>Check: flip the input. Does the output flip?</div></div><p class="n7-copy" style="margin-top:32px"><strong>Hint:</strong> What happens to a local patch when the entire input is mirrored or flipped?</p>`},

{s:"Activity", t:"Example: sum of two filter outputs", draw:"mirrorExample8", html:`<div class="eyebrow">Activity · One example</div><h2>Sum of two filter outputs</h2><p class="n7-centre-note">Apply a kernel and its mirror. Add their output maps.</p><svg id="mirrorExample8" class="l8-fig" viewBox="0 0 1040 280" role="img" aria-label="Convolution with a kernel and its mirror, added together, gives a mirror-equivariant map"></svg><div class="l8-buttons"><button class="bbtn" id="mirEx8dn0" type="button">w&#8321; &#8722;</button><button class="bbtn" id="mirEx8up0" type="button">w&#8321; +</button><button class="bbtn" id="mirEx8dn1" type="button">w&#8322; &#8722;</button><button class="bbtn" id="mirEx8up1" type="button">w&#8322; +</button></div><div class="l8-readout" id="mirrorExample8r"></div>`},

{s:"Activity", t:"Activity: mirror invariance", draw:"mirLabelPrompt8", html:`<div class="eyebrow">Activity · Continue in pairs</div><h2>Can the label stay the same?</h2><p class="n7-copy">We now have a mirror-equivariant feature map.</p><div class="eq l7-eq n7-equation" style="font-size:32px"><span class="texd" data-tex="f(R\\mathbf x)=R f(\\mathbf x)"></span></div><svg id="mirLabelPrompt8" class="l8-fig" viewBox="0 0 1040 178" role="img" aria-label="A feature map and its reversed map should produce the same class label. The computation is left as a question."></svg><div class="flow7-numbered"><div class="flow7-no">1</div><div>How would you turn this map into a label that stays the same after a flip?</div><div class="flow7-no">2</div><div>Explain why your proposed computation works.</div></div><div class="eq l7-eq n7-equation" style="font-size:32px"><span class="texd" data-tex="g(R\\mathbf x)=g(\\mathbf x)"></span></div>`},

{s:"Activity", t:"Follow a local patch", draw:"patchFlip8", html:`<div class="eyebrow">Activity · Think about one local patch</div><h2>What does a flip do to a patch?</h2><p class="n7-copy">The entries reverse, and the patch moves to the corresponding mirrored position.</p><svg id="patchFlip8" class="l8-fig" viewBox="0 0 1040 330" role="img" aria-label="Follow the patch [2,3]: reverse its entries to [3,2], then move it to the corresponding position in the mirrored input"></svg><div class="l8-buttons"><button class="bbtn" id="patchFlip8next" type="button">1. Reverse the patch</button><button class="bbtn" id="patchFlip8reset" type="button">Reset</button></div><div class="l8-readout" id="patchFlip8r" style="min-height:68px"></div>`},

{s:"Activity", t:"Make the local response invariant", draw:"localMirror8", html:`<div class="eyebrow">Activity · Two ways to keep the local response unchanged</div><h2>Make the local response invariant</h2><svg id="localMirror8" class="l8-fig" viewBox="0 0 1040 350" role="img" aria-label="A patch and its mirror give the same response with a symmetric kernel, or by combining responses from a kernel and its reverse"></svg><div class="l8-buttons"><button class="bbtn sel" id="local8d0" type="button">Symmetric kernel</button><button class="bbtn" id="local8d1" type="button">Kernel + reverse</button><span class="l8-gap"></span><button class="bbtn sel" id="local8m1" type="button">Sum</button><button class="bbtn" id="local8m3" type="button">Mean</button><button class="bbtn" id="local8m2" type="button">Maximum</button></div><div class="l8-readout" id="localMirror8r" style="min-height:68px"></div>`},

{s:"Activity", t:"Test mirror equivariance", draw:"mirror8", html:`<div class="eyebrow">Activity · Compare the solutions</div><h2>Test mirror equivariance</h2><svg id="mirror8" class="l8-fig" viewBox="0 0 1040 308" role="img" aria-label="Original and flipped inputs, the separate response from each kernel, and the combined output compared with the flipped original output"></svg><div class="l8-buttons"><button class="bbtn" id="mir8dn0" type="button">w&#8321; &#8722;</button><button class="bbtn" id="mir8up0" type="button">w&#8321; +</button><button class="bbtn" id="mir8dn1" type="button">w&#8322; &#8722;</button><button class="bbtn" id="mir8up1" type="button">w&#8322; +</button><span class="l8-gap"></span><button class="bbtn" id="mir8sym" type="button">Use [1,1]</button></div><div class="l8-buttons"><button class="bbtn sel" id="mir8m0" type="button">One kernel</button><button class="bbtn" id="mir8m1" type="button">Sum of both outputs</button><button class="bbtn" id="mir8m3" type="button">Mean of both outputs</button><button class="bbtn" id="mir8m2" type="button">Max of both outputs</button></div><div class="l8-readout" id="mirror8r"></div>`},

{s:"Activity", t:"How about 2-D images?", draw:"mirror2d8", html:`<div class="eyebrow">Activity · 2-D convolution · Stride 1, no padding</div><h2>How about 2-D images?</h2><svg id="mirror2d8" class="l8-fig" viewBox="0 0 1040 355" role="img" aria-label="A kernel with identical columns is left-right symmetric but not up-down symmetric. Compare convolution of the flipped image with the flipped original output"></svg><div class="l8-buttons"><button class="bbtn sel" id="mirror2d8m0" type="button">Flip left–right</button><button class="bbtn" id="mirror2d8m1" type="button">Flip up–down</button></div><div class="l8-readout" id="mirror2d8r" style="min-height:68px"></div>`},

{s:"Activity", t:"From equivariance to invariance", draw:"mirPool8", html:`<div class="eyebrow">Activity · Now keep the output unchanged</div><h2>From equivariance to invariance</h2><p class="n7-copy">How can we turn this equivariant feature map into an invariant score?</p><svg id="mirPool8" class="l8-fig" viewBox="0 0 1040 262" role="img" aria-label="Original and mirrored inputs produce mirrored feature maps. Keeping the map preserves equivariance. Pooling every position produces the same score."></svg><div class="l8-buttons"><button class="bbtn" id="mirPool8flip" type="button">Flip the input</button><button class="bbtn" id="mirPool8case" type="button">Try another input</button><span class="l8-gap"></span><button class="bbtn sel" id="mirPool8m0" type="button">Keep the map</button><button class="bbtn" id="mirPool8m1" type="button">Mean of all positions</button><button class="bbtn" id="mirPool8m2" type="button">Maximum of all positions</button></div><div class="l8-readout" id="mirPool8r"></div><div id="mirPool8equiv"><div class="eq l7-eq n7-equation" style="font-size:28px"><span class="texd" data-tex="f(R\\mathbf x)=R f(\\mathbf x)"></span></div></div><div id="mirPool8invariant" style="display:none"><div class="eq l7-eq n7-equation" style="font-size:28px"><span class="texd" data-tex="g(\\mathbf x)=\\operatorname{pool}(f(\\mathbf x)),\\qquad g(R\\mathbf x)=g(\\mathbf x)"></span></div></div><p class="n7-small l8-centre">The map uses the symmetric kernel <span class="tex" data-tex="[1,1]"></span>. Pooling combines every output position into one score.</p>`},

{s:"Activity", t:"Data augmentation", draw:"aug8", html:`<div class="eyebrow">A separate approach · Training data</div><h2>Data augmentation</h2><p class="n7-copy">For classification, add flipped images with the same label.</p><svg id="aug8" class="l8-fig" viewBox="0 0 1040 210" role="img" aria-label="An image and its horizontal reflection, both labelled L shape"></svg><ul class="flow7-bullets f7-bullets"><li>Keep the label only when the flip preserves the class.</li><li>Train on the original and flipped examples.</li></ul><p class="n7-centre-note"><strong>Data augmentation encourages invariance. It does not guarantee it.</strong></p>`},

{s:"Activity", t:"Rotation Invariance", draw:"rot8prompt", html:`<div class="eyebrow">Activity · In pairs · 5 minutes</div><h2>Rotation Invariance</h2><p class="n7-copy">Recognize an L-shaped pattern in any of these four orientations.</p><svg id="rot8prompt" class="l8-fig" viewBox="0 0 1040 155" role="img" aria-label="An L-shaped pattern shown at 0, 90, 180 and 270 degrees"></svg><div class="flow7-numbered"><div class="flow7-no">1</div><div>Let <span class="tex" data-tex="h(\\mathbf x)"></span> be a score from any fixed network. It may change when the image rotates.</div><div class="flow7-no">2</div><div>Use the four orientations to build a score <span class="tex" data-tex="g"></span> that stays the same after a 90° rotation.</div><div class="flow7-no">3</div><div>Explain why your design works. What information does it discard?</div></div>`},

{s:"Activity", t:"Pool over orientations", html:`<div class="eyebrow">Activity · Rotation debrief</div><h2>Pool over the four orientations</h2><div class="d7-key-message" style="font-size:28px;margin:18px 0 20px">Key idea: combine the scores without using their order.</div><div class="eq l7-eq n7-equation" style="font-size:32px"><span class="texd" data-tex="g(\\mathbf x)=\\tfrac14\\sum_{k=0}^{3}h(R^k\\mathbf x)"></span></div><ul class="flow7-bullets f7-bullets"><li><span class="tex" data-tex="R"></span> rotates the image by 90°. Four turns return the original image.</li><li>Rotating the input cycles the same four scores. Their mean stays the same.</li><li>A sum or maximum also works.</li></ul><div class="eq l7-eq n7-equation" style="font-size:25px"><span class="texd" data-tex="g(R\\mathbf x)=\\tfrac14\\left[h(R\\mathbf x)+h(R^2\\mathbf x)+h(R^3\\mathbf x)+h(\\mathbf x)\\right]=g(\\mathbf x)"></span></div><p class="n7-small l8-centre">The guarantee covers multiples of 90°. Use it when orientation should not change the label.</p><p class="cred">Related idea: <a href="https://proceedings.mlr.press/v48/cohenc16.html" target="_blank" rel="noopener">Cohen &amp; Welling (2016), group pooling</a></p>`},

{s:"Activity", t:"Test rotation invariance", draw:"rot8", html:`<div class="eyebrow">Activity · Test your design</div><h2>Test rotation invariance</h2><svg id="rot8" class="l8-fig" viewBox="0 0 1040 276" role="img" aria-label="A fixed reference pattern and four rotated inputs, each with a score computed by matching reference pixels"></svg><div class="l8-buttons"><button class="bbtn" id="rot8turn" type="button">Rotate input 90°</button><button class="bbtn" id="rot8reset" type="button">Reset</button><span class="l8-gap"></span><button class="bbtn sel" id="rot8s0" type="button">L shape</button><button class="bbtn" id="rot8s1" type="button">T shape</button></div><div class="l8-buttons"><button class="bbtn sel" id="rot8m0" type="button">First score</button><button class="bbtn" id="rot8m1" type="button">Mean of all four</button><button class="bbtn" id="rot8m2" type="button">Maximum of all four</button></div><div class="l8-readout" id="rot8r"></div><p class="n7-small l8-centre">Example score <span class="tex" data-tex="h"></span>: the fraction of filled reference pixels also filled in the input.</p>`},

/* Per-slide delivery estimate in minutes. Used for the overview cumulative marks
   and the presenter clock's "vs plan" readout.
   CALIBRATED 11 Aug 2026: the first delivery of this deck planned at 153 min and
   ran 95, so every figure here is an earlier estimate scaled by 0.62. If you add a
   slide, write what you actually expect to spend -- these numbers are now real
   minutes, not the optimistic ones. */
const EST=[0.3, 1.0, 0.3, 0.5, 0.8, 0.8, 1.0, 0.8, 0.3, 0.5, 1.0, 1.0, 1.2, 0.8, 1.0, 1.0, 0.2, 1.2, 1.2, 1.5, 1.8, 1.0, 1.0, 1.0, 1.2, 1.2, 1.2, 1.0, 1.0, 0.5, 0.8, 0.2, 1.2, 0.5, 0.6, 2.5, 0.6, 1.0, 1.3, 2.0, 0.3, 0.4, 0.6, 0.5, 1.0, 1.5, 1.5, 0.3, 0.6, 1.5, 0.5, 1.5, 1.0, 0.6, 1.2, 0.6, 1.0, 1.2, 0.8, 1.0, 0.8, 1.0, 1.2, 1.0, 1.2, 0.3, 1.0, 0.7, 2.0, 1.0, 2.0, 1.0, 3.0, 1.5, 2.0, 2.0, 2.0, 2.0, 1.0, 2.0, 1.0, 2.0, 2.0, 0.3];
const EST_TOTAL=EST.reduce((a,b)=>a+b,0);
const cumMin=i=>EST.slice(0,i+1).reduce((a,b)=>a+(b||0),0);

const canvas=document.getElementById('canvas');
let idx=0,fragStep=0,drawnIdx=-1;
canvas.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}</section>`).join('');
const slides=[...canvas.querySelectorAll('.slide')];

function fragsOf(i){
  const f=[...slides[i].querySelectorAll('.frag')];
  return {list:f,max:f.length?Math.max(...f.map(e=>+(e.dataset.f||0))):-1};
}
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  fragsOf(idx).list.forEach(e=>e.classList.toggle('on',(+(e.dataset.f||0))<fragStep));
  document.getElementById('progress').style.width=((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('pagenum').textContent=`${idx+1} / ${SLIDES.length}`;
  if(t0!==null) updClock();
  /* Draw only on slide ENTRY. Redrawing on every fragment step replaces the whole
     svg, and the re-rasterised text visibly flickers ("the graph font changes when
     the box appears"). Demo listeners call their draw functions directly. */
  const d=SLIDES[idx].draw; if(d&&DRAW[d]&&drawnIdx!==idx) requestAnimationFrame(DRAW[d]);
  drawnIdx=idx;
  /* play video on the slide we just entered, pause and rewind everywhere else */
  slides.forEach((s,i)=>s.querySelectorAll('video').forEach(v=>{
    if(i===idx){ v.playbackRate=+(v.dataset.rate||1); v.play().catch(()=>{}); }
    else if(!v.paused||v.currentTime){ v.pause(); v.currentTime=0; }
  }));
  /* Leaving the slide has to REMOVE the iframe, not pause it: playback cannot be controlled
     across origins without pulling in the YouTube JS API, and an iframe left behind on a
     hidden slide keeps playing audio. */
  document.querySelectorAll('.ytwrap.live').forEach(w=>{
    if(+w.closest('.slide').dataset.i !== idx) closeYT(w);
  });
}
function leave(){ const s=slides[idx]; s.classList.add('leaving');
  setTimeout(()=>s.classList.remove('leaving'),160);
  /* Demos with a default choice reset on slide change, so a slide always opens on that
     choice rather than on whatever was clicked the last time through. Not on paint() --
     that also runs on every fragment step, which would undo a click mid-slide. */
  if(typeof resetDemos==='function') resetDemos(); }
function go(n){ if(n<0||n>=SLIDES.length)return; saveInk(); leave(); idx=n; fragStep=fragsOf(idx).max+1; paint(); loadInk(idx); }
function next(){ const {max}=fragsOf(idx);
  if(fragStep<=max){fragStep++;paint();}
  else if(idx<SLIDES.length-1){saveInk();leave();idx++;fragStep=0;paint();loadInk(idx);} }
function prev(){ if(fragStep>0){fragStep--;paint();}
  else if(idx>0){saveInk();leave();idx--;fragStep=fragsOf(idx).max+1;paint();loadInk(idx);} }

function fit(){ canvas.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)*.955})`; }
addEventListener('resize',fit); fit();

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  /* the browser's own shortcuts are the browser's: Cmd/Ctrl-P prints, Cmd-R reloads,
     Cmd-T opens a tab. Without this the deck swallowed all of them -- and calling
     preventDefault on Cmd-P is what stopped the print dialog from ever appearing. */
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  /* arrows belong to a focused slider, not to navigation */
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(ae.tagName)){
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','PageUp','PageDown',' ','Enter'].includes(e.key)) return;
    if(k==='d'||k==='t'||k==='o'||k==='b') return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  else if(k==='o')toggleOv(); else if(k==='t')cycleTheme();
  else if(k==='b')document.body.classList.toggle('blank');
  else if(k==='d'){e.preventDefault();toggleInk();}
  else if(k==='p'){e.preventDefault();window.print();}
  else if(k==='k'){e.preventDefault();toggleClock();}
  else if(k==='c'&&document.body.classList.contains('inking'))clearInk();
  else if(k==='e'&&document.body.classList.contains('inking'))setEraser(!erasing);
  else if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(e.key==='Escape')ov.classList.remove('on');
});

const ov=document.getElementById('overview');
ov.innerHTML=SLIDES.map((s,i)=>
  `<div class="thumb ${s.div?'divider-t':''}" data-i="${i}">
     ${s.s?`<div class="ts">${s.s}</div>`:''}<div class="tt">${s.t}</div><div class="tn">${i+1}</div></div>`).join('');

/* ---------- minimal Python syntax highlighting ---------- */
const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;
function highlight(){
  /* Placeholders are delimited by private-use code points and indexed with a
     LETTER, not a digit: a digit index would be re-matched by the number rule. */
  const OPEN='', CLOSE='';
  document.querySelectorAll('pre.code').forEach(function(pre){
    if(pre.dataset.hl) return; pre.dataset.hl='1';
    let h=pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const stash=[];
    const keep=function(html){ stash.push(html); return OPEN+String.fromCharCode(65+stash.length-1)+CLOSE; };
    h=h.replace(/#[^\n]*/g, function(m){ return keep('<span class="tok-com">'+m+'</span>'); });
    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    h=h.replace(/\b([A-Za-z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
    h=h.replace(new RegExp(OPEN+'([A-Z])'+CLOSE,'g'), function(_,c){ return stash[c.charCodeAt(0)-65]; });
    pre.innerHTML=h;
  });
}

/* ---------- upright delimiters in maths ----------
   Only letters are variables. Brackets, digits, operators and punctuation are
   set upright. Runs once over every .m span at load. */
/* Render every data-tex node. Re-runnable: demos that rewrite innerHTML call it again.
   Falls back to the raw LaTeX so a bad macro can never blank a slide. */
function renderTeX(){
  if(typeof katex==='undefined'){ setTimeout(renderTeX,40); return; }
  document.querySelectorAll('[data-tex]').forEach(function(el){
    if(el.dataset.done) return;
    try{ katex.render(el.dataset.tex, el,
      {displayMode: el.classList.contains('texd'), throwOnError:false, output:'html',
       /* \htmlClass lets an equation colour its own parts through CSS variables, so
          colour coding follows the theme instead of freezing to the paper palette. */
       trust: c => c.command === '\\htmlClass', strict: false}); }
    catch(e){ el.textContent=el.dataset.tex; }
    el.dataset.done='1';
  });
}
addEventListener('load', renderTeX);

/* ============================================================
   LECTURE 8 — CNNs and Transformers: figures and demos
   The numbers are the ones on last year's slides (AY25-26 Lecture 08): the 1-D input
   0 0 0 1 0 1 1 1 0 0 with kernel 1 -1 1, the 5x5 image with the 1 0 1 / 0 1 0 / 1 0 1
   filter, the 4x4 feature map for ReLU and max pooling, and the sentence 我给她买了一台电脑.
   Every demo redraws its whole svg from a few module-level variables.
   ============================================================ */
function el8(id){ return document.getElementById(id); }
function set8(id, h){ const e=el8(id); if(e) e.innerHTML=h; }
function neg8(v){ return String(v).replace('-','−'); }
function txt8(x, y, t, o){ o=o||{};
  return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'start')+'" style="font-family:'+(o.ff||'var(--font-sans)')+';font-size:'+(o.fs||20)+'px;font-weight:'+(o.fw||400)
       + ';font-style:'+(o.it?'italic':'normal')+';fill:'+(o.c||'var(--ink)')+'">'+t+'</text>'; }
function cell8(x, y, w, h, t, fill, op, o){ o=o||{};
  const fs=o.fs||24;
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(o.rx||0)+'" style="fill:'+fill+';fill-opacity:'+op+';stroke:'+(o.stroke||'var(--bg)')+';stroke-width:'+(o.sw||2)+'"/>'
       + ((t===''||t==null)?'':txt8(x+w/2, y+h/2+fs*0.35, t, {a:'middle', fs:fs, fw:(o.fw||600), c:(o.tc||'var(--ink)')})); }
function box8(x, y, w, h, c, sw){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4" style="fill:none;stroke:'+c+';stroke-width:'+(sw||4)+'"/>'; }
function arr8(x1, y1, x2, y2, c, w, op){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L, sw=w||2;
  const head=Math.min(L*.75,Math.max(9,sw*3.5)), half=head*.48, hx=x2-ux*head, hy=y2-uy*head;
  return '<g style="opacity:'+(op==null?1:op)+'"><line x1="'+x1+'" y1="'+y1+'" x2="'+(hx+ux).toFixed(1)+'" y2="'+(hy+uy).toFixed(1)+'" style="stroke:'+c+';stroke-width:'+sw+';stroke-linecap:round"/>'
       + '<path d="M'+x2+' '+y2+' L'+(hx-uy*half).toFixed(1)+' '+(hy+ux*half).toFixed(1)+' L'+(hx+uy*half).toFixed(1)+' '+(hy-ux*half).toFixed(1)+' z" style="fill:'+c+'"/></g>'; }

function opIn8(v){ return v>0 ? .62 : .2; }                       /* input cells: 0 pale, 1 strong */
function opOut8(v){ return v<=0 ? .16 : Math.min(.3+.25*v, .9); }  /* output cells: larger is stronger */
function sel8(ids, on){ ids.forEach(function(id, i){ const b=el8(id); if(b) b.classList.toggle('sel', i===on); }); }

/* ---------------------------------------------------------------- 1-D convolution */
const X8=[0,0,0,1,0,1,1,1,0,0];
const K8=[[1,-1,1],[0,1,1],[1,-1,-1]];
function conv8(x, k){ const o=[]; for(let i=0;i+k.length<=x.length;i++){ let s=0; for(let r=0;r<k.length;r++) s+=k[r]*x[i+r]; o.push(s); } return o; }
/* geometry shared by the 1-D figures: ten input cells, eight outputs centred over their windows */
const G8={x0:170, cw:86, ch:62};
function inX8(i){ return G8.x0+i*G8.cw; }
function outX8(i){ return G8.x0+(i+1)*G8.cw; }
function rowIn8(y, x, label){ let g=txt8(0, y+G8.ch/2+7, label, {fs:21, fw:700});
  x.forEach(function(v, i){ g+=cell8(inX8(i), y, G8.cw, G8.ch, v, 'var(--s4)', opIn8(v)); }); return g; }
function rowOut8(y, o, label, shown){ let g=txt8(0, y+G8.ch/2+7, label, {fs:21, fw:700});
  o.forEach(function(v, i){ const s=(shown==null||i<shown); g+=cell8(outX8(i), y, G8.cw, G8.ch, s?neg8(v):'', 'var(--s3)', s?opOut8(v):.08); }); return g; }
function rowKer8(y, k, x, label, hi){ let g=txt8(0, y+G8.ch/2+7, label, {fs:21, fw:700});
  k.forEach(function(v, r){ g+=cell8(x+r*G8.cw, y, G8.cw, G8.ch, neg8(v), 'var(--s5)', (hi===r)?.6:.24, {stroke:'var(--bg)'}); }); return g; }

let CONV8_N=0;
function conv1dNext8(){ CONV8_N=Math.min(8, CONV8_N+1); drawConv1d8(); }
function conv1dReset8(){ CONV8_N=0; drawConv1d8(); }
function drawConv1d8(){
  const svg=el8('conv1d8'); if(!svg) return;
  const k=K8[0], o=conv8(X8, k), n=CONV8_N, w=Math.max(0, n-1), yO=14, yI=178, yK=306;
  let g=rowOut8(yO, o, 'Output', n)+rowIn8(yI, X8, 'Input');
  g+=rowKer8(yK, k, inX8(w), 'Kernel weights');
  g+=box8(inX8(w), yI, 3*G8.cw, G8.ch, 'var(--s2)', 4);
  if(n>0){ for(let r=0;r<3;r++) g+=arr8(inX8(w+r)+G8.cw/2, yI-4, outX8(w)+G8.cw/2+(r-1)*14, yO+G8.ch+5, 'var(--ink)', 2.4);
    g+=box8(outX8(w), yO, G8.cw, G8.ch, 'var(--s2)', 4); }
  svg.innerHTML=g;
  const b=el8('conv1d8next'); if(b) b.disabled=(n>=8);
  let h;
  if(n===0) h='Three inputs form the <strong style="color:var(--s2)">receptive field</strong>. Stride 1, with no padding or bias.';
  else h='Output '+n+':&ensp;'+k.map(function(kv, r){ return '('+neg8(kv)+')('+X8[w+r]+')'; }).join(' + ')+' = <strong style="color:var(--s2)">'+neg8(o[w])+'</strong>';
  set8('conv1d8r', h);
}

/* sparse connections: the same figure with every connection drawn, as a convolution or as an MLP */
let SPARSE8='cnn';
function sparseSet8(m){ SPARSE8=m; drawSparse8(); }
function drawSparse8(){
  const svg=el8('sparse8'); if(!svg) return;
  const o=conv8(X8, K8[0]), yO=14, yI=188, mlp=(SPARSE8==='mlp');
  let g='';
  for(let i=0;i<8;i++) for(let j=0;j<10;j++){ if(!mlp && (j<i||j>i+2)) continue;
    g+=arr8(inX8(j)+G8.cw/2, yI-4, outX8(i)+G8.cw/2+(mlp?0:(j-i-1)*14), yO+G8.ch+5, 'var(--ink)', mlp?1.3:2.4, mlp?.55:1); }
  g+=rowOut8(yO, o, 'Output')+rowIn8(yI, X8, 'Input');
  svg.innerHTML=g;
  sel8(['sparse8cnn','sparse8mlp'], mlp?1:0);
  set8('sparse8r', mlp ? 'MLP: every output connects to all 10 inputs. <strong>80 connections.</strong>'
                       : 'Convolution: every output connects to 3 inputs. <strong>24 connections.</strong>');
}

/* weight sharing: one kernel weight, and every connection that uses it */
let SHARE8=1;
function shareSet8(r){ SHARE8=r; drawShare8(); }
function drawShare8(){
  const svg=el8('share8'); if(!svg) return;
  const k=K8[0], o=conv8(X8, k), yO=14, yI=178, yK=306;
  let g='';
  for(let i=0;i<8;i++) for(let r=0;r<3;r++) if(r!==SHARE8) g+=arr8(inX8(i+r)+G8.cw/2, yI-4, outX8(i)+G8.cw/2+(r-1)*14, yO+G8.ch+5, 'var(--ink-soft)', 1.6, .3);
  for(let i=0;i<8;i++) g+=arr8(inX8(i+SHARE8)+G8.cw/2, yI-4, outX8(i)+G8.cw/2+(SHARE8-1)*14, yO+G8.ch+5, 'var(--s5)', 3);
  g+=rowOut8(yO, o, 'Output')+rowIn8(yI, X8, 'Input')+rowKer8(yK, k, inX8(0), 'Kernel weights', SHARE8);

  svg.innerHTML=g;

  set8('share8r', 'The weight <strong style="color:var(--s5)">'+neg8(k[SHARE8])+'</strong> is used by all 8 outputs. There are 24 connections sharing <strong>3 weights</strong>.');
}

/* translation equivariance: shift the input, and the output shifts by the same amount */
let EQUI8=0;
function equiSet8(s){ EQUI8=s; drawEqui8(); }
function shift8(a, s){ const o=a.map(function(){ return 0; }); a.forEach(function(v, i){ if(i+s<a.length) o[i+s]=v; }); return o; }
function drawEqui8(){
  const svg=el8('equi8'); if(!svg) return;
  const k=K8[0], s=EQUI8, x2=shift8(X8, s), o=conv8(X8, k), o2=conv8(x2, k);
  let g=rowOut8(8, o2, 'New output')+rowOut8(78, o, 'Old output')+rowIn8(190, x2, 'New input')+rowIn8(260, X8, 'Old input')+rowKer8(346, k, inX8(0), 'Kernel weights');
  g+=txt8(600, 173, s>0 ? 'Shift by '+s+': the visible output shifts too (stride 1).' : 'Stride 1. Boundary values can affect shift equivariance.', {a:'middle', fs:21, c:'var(--s2)', fw:700});
  svg.innerHTML=g;
  set8('equi8v', s);
}

/* several kernels: each one gives its own output row (a channel) */
let MULTI8=0;
function multiSet8(r){ MULTI8=r; drawMulti8(); }
function drawMulti8(){
  const svg=el8('multi8'); if(!svg) return;
  let g='';
  K8.forEach(function(k, c){ const y=6+c*66, on=(c===MULTI8), o=conv8(X8, k);
    g+=txt8(0, y+G8.ch/2+7, 'Channel '+(c+1), {fs:21, fw:700, c:on?'var(--ink)':'var(--ink-soft)'});
    o.forEach(function(v, i){ g+=cell8(outX8(i), y, G8.cw, G8.ch-4, on?neg8(v):'', 'var(--s3)', on?opOut8(v):.1); });
    if(on) g+=box8(outX8(0), y, 8*G8.cw, G8.ch-4, 'var(--s2)', 3); });
  g+=rowIn8(232, X8, 'Input');
  K8.forEach(function(k, c){ const x=170+c*300, on=(c===MULTI8);
    g+=txt8(x+129, 330, 'Kernel '+(c+1), {a:'middle', fs:20, fw:700, c:on?'var(--s2)':'var(--ink-soft)'});
    k.forEach(function(v, r){ g+=cell8(x+r*86, 340, 86, 54, neg8(v), 'var(--s5)', on?.5:.2); });
    if(on) g+=box8(x, 340, 258, 54, 'var(--s2)', 3); });
  svg.innerHTML=g;
  sel8(['multi8k0','multi8k1','multi8k2'], MULTI8);
