:root{

}
[data-theme="swiss"]{

}
[data-theme="nocturne"]{
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide transition: opacity only, short, and NO transform.
   A transform (especially a scale) promotes the slide to a composited layer and
   re-rasterises the text, which makes heavy glyphs read as arriving before light
   ones. Nothing that carries text is allowed to animate transform or scale. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s linear,visibility .14s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.leaving{opacity:0}

/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:9px 14px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:15px;font-style:italic;color:var(--ink-soft);padding-left:16px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-ctrl{flex:.72}
.ctrl-row{margin-bottom:18px}
.ctrl-row label{font-family:var(--font-sans);font-size:11.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:8px}
.ctrl-row .val{color:var(--accent);font-weight:700;font-size:14.5px;letter-spacing:0}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:var(--rule);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2.5px solid var(--bg);box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);
  cursor:pointer;border:2.5px solid var(--bg)}
.readout{display:flex;gap:10px;margin-top:20px}
.readout .stat{padding:11px 12px}
.readout .stat .v{font-size:25px}
.stat{flex:1;background:var(--bg-alt);border:1px solid var(--rule);border-radius:9px;padding:12px 14px}

.fitfn{fill:none;stroke:var(--accent);stroke-width:3}
.legend{font-family:var(--font-sans);font-size:14px;fill:var(--ink-soft)}
.matn{font-family:var(--font-math);font-size:16px;fill:var(--ink)}

.flowtxt{font-family:var(--font-display);font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle}
.flowarr{stroke:var(--ink);stroke-width:1.8;fill:none;marker-end:url(#ah)}
.appcard{background:var(--bg-alt);border:1px solid var(--rule);border-radius:10px;padding:15px 17px}
.appcard .t{font-family:var(--font-display);font-size:18px;font-weight:700;margin-bottom:3px}
.appcard .d{font-size:13.5px;color:var(--ink-soft);line-height:1.4}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}

   face centred even if one is swapped for an off-ratio photo later. */
.avatar{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;
  margin:0 auto 15px;border:3px solid var(--rule);background:var(--bg-alt)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}

/* ---- figures, images, video ---- */
/* Rounded corners, no outline. A border plus a filled background drew a visible
   box around every image — obvious when the image letterboxes inside it. */
.fig{border-radius:10px;overflow:hidden;line-height:0;position:relative;
  background:transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.fig img,.fig video{display:block;width:100%;height:auto}
/* Click-to-load YouTube facade. Nothing is requested from Google until the play button is
   pressed, so the deck opens instantly and makes no third-party connection if the video is
   never reached. Used wherever we point at someone else's clip instead of re-hosting it. */
.ytfacade{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;
  position:relative;line-height:0;border-radius:inherit;overflow:hidden}
.ytfacade img{display:block;width:100%;height:auto}
.ytplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:55px;
  border-radius:13px;background:rgba(18,18,18,.72);transition:background .16s ease}
.ytplay::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-38%,-50%);
  border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff}
.ytfacade:hover .ytplay,.ytfacade:focus-visible .ytplay{background:#cc0000}
.ytwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
/* Height-capped figures: letterbox rather than crop.
   Flex + max-height (not grid + height:100%) — a percentage height inside an
   auto-sized grid row resolves to auto, which lets the image overflow and clip. */
/* letterboxed figures get no shadow either — there is nothing to cast one */
.fig[class*="h-"]{display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none}
.fig[class*="h-"] img,.fig[class*="h-"] video{width:auto;height:auto;max-width:100%;max-height:100%}
.fig[class*="h-"] svg{width:100%;height:100%}
/* Stock chart, drawn from Yahoo! Finance closes rather than shipped as a picture:
   it themes with the deck, stays sharp at any projector resolution, and carries no
   third-party image licence. */
.sc-grid{stroke:var(--grid);stroke-width:1}
.sc-axis{stroke:var(--rule);stroke-width:1}
.sc-ax{font-family:var(--font-sans);font-size:10px;fill:var(--ink-soft)}
.sc-lab{font-family:var(--font-sans);font-size:11px;font-weight:600}
.sc-val{font-size:11px;font-weight:800}
.fig.h-190{height:190px}.fig.h-230{height:230px}.fig.h-260{height:260px}
.fig.h-290{height:290px}.fig.h-330{height:330px}
.figcap{font-size:22px;font-style:italic;color:var(--ink-soft);margin-top:12px;line-height:1.4}
.cred{font-family:var(--font-sans);font-size:13px;color:var(--ink-soft);margin-top:6px;
  line-height:1.35;opacity:.8;letter-spacing:.01em;text-align:center}
.tile{position:relative;border-radius:10px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.09);line-height:0;min-height:0}
.tile img,.tile video{display:block;width:100%;height:100%;object-fit:cover}
.tile svg{display:block;width:100%;height:100%;background:var(--bg-alt)}
.tile .lbl{position:absolute;left:0;right:0;bottom:0;padding:20px 14px 10px;
  font-family:var(--font-sans);font-size:13.5px;font-weight:700;color:#fff;letter-spacing:.02em;
  background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0));line-height:1.25}
.vidbadge{position:absolute;top:11px;left:11px;z-index:2;font-family:var(--font-sans);font-size:10.5px;
  font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  background:rgba(0,0,0,.55);padding:5px 11px;border-radius:20px;backdrop-filter:blur(6px)}

/* ---- notebook code cells ---- */
.nb{border:1px solid var(--rule);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.nb-bar{display:flex;align-items:center;gap:8px;padding:7px 13px;background:var(--bg-alt);

pre.code{margin:0;padding:15px 17px;background:var(--bg);font-family:var(--font-mono);
  font-size:13.5px;line-height:1.62;overflow:hidden;white-space:pre;color:var(--ink);tab-size:2}
pre.code.sm{font-size:12.4px;line-height:1.55}

.tok-str{color:var(--accent2)}

.nblink{font-family:var(--font-sans);font-size:12px;color:var(--ink-soft)}
.nblink b{color:var(--accent)}

/* ---- in-class activities ---- */
.actbadge{display:inline-block;align-self:flex-start;padding:5px 15px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.actq{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.2;margin:16px 0 20px}
.actopt{display:flex;gap:13px;align-items:flex-start;margin-bottom:12px;font-size:19px;line-height:1.35}

.actqr{text-align:center}
.actqr img{width:170px;display:block;margin:0 auto 10px}

.predcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:6px}
.predcard{border:1.8px solid var(--rule);border-radius:10px;padding:12px 12px 8px;background:var(--bg-alt)}
.predcard .pl{font-family:var(--font-sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.predcard .pd{font-size:14px;color:var(--ink-soft);line-height:1.35;margin-top:6px}
.predcard svg{display:block;width:100%}
.basisbtns{display:flex;gap:8px;margin-bottom:12px}
.bbtn{font-family:var(--font-sans);font-size:13px;padding:6px 15px;border-radius:18px;cursor:pointer;
  border:1.5px solid var(--rule);color:var(--ink-soft);background:var(--bg);transition:none}
.bbtn.sel{border-color:var(--accent);color:var(--bg);background:var(--accent);font-weight:700}

.bbtn[style*='--k']{border-color:var(--k);color:var(--k)}
.bbtn.sel[style*='--k']{background:var(--k);border-color:var(--k);color:var(--bg)}
</style>

{s:"Part I", t:"What is common to ML problems?", html:`
  <div class="eyebrow">Orientation</div>
  <h2>What these problems have in common</h2>
  <div class="row top" style="gap:40px">
    <div class="col">
      <ul style="margin-top:8px">
        <li class="frag" data-f="0">We have <em class="hl">data</em>.</li>
        <li class="frag" data-f="1">We want to find some <em class="hl">pattern</em> or regularity in it.</li>
        <li class="frag" data-f="2">It is <em class="hl">difficult to write that pattern down</em> mathematically by hand.</li>
      </ul>
      <div class="frag" data-f="3" style="margin-top:24px">
        <hr class="rule">
        <p style="font-size:18px">Look at the picture. It is hard to hand-write a rule that reliably
        tells a <em class="hl">pedestrian</em> from a <em class="hl">cyclist</em>, or a car from a
        truck — from pixels alone, under any lighting, at any angle. And for share prices it is not
        even clear that a reliable rule exists. What we <em>can</em> write down is
        <strong>a procedure for searching for one</strong> — and then measure how well it did.</p>
      </div>
    </div>
    <div class="col frag" data-f="0" style="flex:.85">
      <div class="fig"><img src="media/detection.jpg" alt="Object detection on a street scene"></div>
      <p class="cred">Learned object detection — every box is a prediction, not a hand-written rule</p>
    </div>
  </div>`},

{s:"Part I", t:"ML in action — learned locomotion", vid:true, html:`
  <div class="eyebrow">Machine learning in action</div>
  <h2 style="margin-bottom:16px">Nobody programmed this gait</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.5">
      <div class="fig ytwrap" data-yt="I44_zbEwz_w"><span class="vidbadge">Video</span>
        <button class="ytfacade" type="button" aria-label="Play &#8220;Walk, Run, Crawl, RL Fun | Boston Dynamics | Atlas&#8221; on YouTube">
          <img src="https://i.ytimg.com/vi/I44_zbEwz_w/maxresdefault.jpg" alt="Atlas mid-cartwheel in the Boston Dynamics test space">
          <span class="ytplay" aria-hidden="true"></span>
        </button></div>
      <p class="cred"><a href="https://www.youtube.com/watch?v=I44_zbEwz_w" target="_blank" rel="noopener">&#8220;Walk, Run, Crawl, RL Fun&#8221;</a>
        — Boston Dynamics with the RAI Institute. RL policies trained against human motion-capture references.</p>
    </div>
    <div class="col frag" data-f="0">
      <p style="font-size:18px">Nobody wrote these joint torques. Human motion was captured,
      retargeted onto the robot, and a <em class="hl">reinforcement-learning</em> policy was then
      trained to reproduce it. <strong>Imitation</strong> supplies what the motion should look like;
      <strong>RL</strong> makes it survive contact with the real world.</p>
      <hr class="rule">
      <p class="caption">This is the reinforcement-learning branch of the landscape we are about
      to draw. We will not cover RL in depth in CS3264 — but the same three ingredients are underneath it.</p>
    </div>
  </div>`},

{s:"Part I", t:"When we do know the rule", html:`
  <div class="eyebrow">Machine learning in action</div>
  <h2 style="margin-bottom:16px">Sometimes we know the rule &#8212; it is just too slow</h2>
  <div class="row top" style="gap:32px">
    <div class="col" style="flex:1.5">

          <rect x="130" y="96" width="120" height="48" rx="4" class="flowbox"/>
          <text x="190" y="119" class="flowtxt">Learning</text>
          <text x="190" y="136" class="flowtxt">algorithm</text>

        </g>
      </svg>
    </div>
    <div class="col">
      <div class="card frag" data-f="0">
        <h3 style="margin-bottom:8px">Classical programming</h3>
        <p style="font-size:17.5px">A human works out the rule and writes it down.
        Data then flows through that program to produce output.</p>
      </div>
      <div class="card accent frag" data-f="2" style="margin-top:14px">
        <h3 style="margin-bottom:8px">Machine learning</h3>
        <p style="font-size:17.5px">Data <em class="hl">produces</em> the program. We write the

{s:"Part I", t:"What CS3264 is", html:`
  <div class="eyebrow">Scope</div>
  <h2>What CS3264 is — and is not</h2>
  <div class="row top stretch">
    <div class="col">
      <div class="pill">By the end you should be able to</div>
      <ul style="margin-top:18px">
        <li>Describe what ML is, especially supervised and unsupervised learning.</li>

    <div class="col frag" data-f="1">
      <div class="pill ghost">CS3264 is not</div>
      <ul style="margin-top:18px">
        <li class="no">a pure mathematics or statistics course</li>
        <li class="no">a programming course</li>
        <li class="no">a complete survey of machine learning</li>

      <p class="caption" style="margin-top:18px">

        which is the thing that transfers when the tools change.</p>

{s:"Part II", t:"Formalising linear regression", html:`
  <div class="eyebrow">Linear regression</div>
  <h2>Formalising the problem</h2>
  <div class="row top" style="gap:44px">
    <div class="col">
      <div class="frag" data-f="0" style="margin-bottom:22px">
        <div class="eyebrow" style="margin-bottom:6px">① Data</div>
        <div class="eq" style="margin:0"><span class="texd" data-tex="D = \\{(\\mathbf{x}_n,\\, t_n)\\}_{n=1}^{N}"></span></div>
      </div>
      <div class="frag" data-f="1" style="margin-bottom:22px">
        <div class="eyebrow" style="margin-bottom:6px">② Model</div>
        <div class="eq" style="margin:0"><span class="texd" data-tex="y(x;\\mathbf{w}) = w_0 + w_1 x"></span></div>
        <p class="caption" style="margin-top:7px;text-align:center">A line — <span class="tex" data-tex="y = mx + c"></span> — with parameters <span class="tex" data-tex="\\theta = \\{w_0, w_1\\}"></span></p>
      </div>
      <div class="frag" data-f="2">
        <div class="eyebrow" style="margin-bottom:6px">③ Loss</div>
        <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="E(\\mathbf{w}) = \\frac{1}{2}\\sum_{n=1}^{N}\\bigl(y(x_n;\\mathbf{w}) - t_n\\bigr)^2"></span></div>
        <p class="caption" style="margin-top:7px;text-align:center">the “error function” — sum of squared residuals</p>
      </div>
    </div>
    <div class="col frag" data-f="3" style="flex:.9">
      <svg viewBox="0 0 340 250" width="100%">
        <line x1="30" y1="216" x2="322" y2="216" class="axis"/>
        <line x1="30" y1="216" x2="30" y2="14" class="axis"/>
        <text x="326" y="221" class="tick" style="font-style:italic;font-size:14px">x</text>
        <text x="22" y="12" class="tick" style="font-style:italic;font-size:14px">y</text>
        <line x1="42" y1="186" x2="310" y2="56" stroke="var(--accent)" stroke-width="2.6"/>
        <g>
          <line x1="76" y1="190" x2="76" y2="169.5" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3.5 3"/>
          <line x1="120" y1="130" x2="120" y2="148.2" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3.5 3"/>
          <line x1="168" y1="143" x2="168" y2="124.9" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3.5 3"/>
          <line x1="212" y1="88" x2="212" y2="103.5" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3.5 3"/>
          <line x1="256" y1="100" x2="256" y2="82.2" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3.5 3"/>
          <line x1="292" y1="48" x2="292" y2="64.8" stroke="var(--accent2)" stroke-width="2" stroke-dasharray="3.5 3"/>
        </g>
        <g fill="var(--ink)"><circle cx="76" cy="190" r="5"/><circle cx="120" cy="130" r="5"/><circle cx="168" cy="143" r="5"/><circle cx="212" cy="88" r="5"/><circle cx="256" cy="100" r="5"/><circle cx="292" cy="48" r="5"/></g>

{s:"Part II", t:"Deriving the normal equations", html:`
  <div class="eyebrow">Derivation · linear regression</div>
  <h2 style="margin-bottom:16px">Deriving the normal equations</h2>
  <div class="dgrid">
    <div class="lhs frag" data-f="0"><span class="tex" data-tex="E(\\mathbf{w})"></span></div><div class="rhs frag" data-f="0"><span class="tex" data-tex="= \\frac{1}{2}\\sum_{n=1}^{N}\\bigl(\\mathbf{w}^\\top\\mathbf{x}_n - t_n\\bigr)^2"></span></div><div class="why frag" data-f="0">start from the loss, intercept already absorbed into <b>x</b></div>
    <div class="lhs frag" data-f="1"><span class="tex" data-tex="\\mathbf{X}"></span></div><div class="rhs frag" data-f="1"><span class="tex" data-tex="= \\begin{bmatrix}\\mathbf{x}_1^\\top\\\\ \\vdots\\\\ \\mathbf{x}_N^\\top\\end{bmatrix},\\qquad \\mathbf{t} = \\begin{bmatrix}t_1\\\\ \\vdots\\\\ t_N\\end{bmatrix}"></span></div><div class="why frag" data-f="1">stack every row into a design matrix</div>
    <div class="lhs frag" data-f="2"><span class="tex" data-tex="E(\\mathbf{w})"></span></div><div class="rhs frag" data-f="2"><span class="tex" data-tex="= \\frac{1}{2}(\\mathbf{t}-\\mathbf{X}\\mathbf{w})^\\top(\\mathbf{t}-\\mathbf{X}\\mathbf{w})"></span></div><div class="why frag" data-f="2">the sum of squares is an inner product</div>
    <div class="lhs frag" data-f="3"></div><div class="rhs frag" data-f="3"><span class="tex" data-tex="= \\frac{1}{2}\\left(\\mathbf{t}^\\top\\mathbf{t} - 2\\mathbf{w}^\\top\\mathbf{X}^\\top\\mathbf{t} + \\mathbf{w}^\\top\\mathbf{X}^\\top\\mathbf{X}\\mathbf{w}\\right)"></span></div><div class="why frag" data-f="3">expand — the two cross terms are equal scalars, hence the 2</div>
    <div class="lhs frag" data-f="4"><span class="tex" data-tex="\\nabla_{\\mathbf{w}} E"></span></div><div class="rhs frag" data-f="4"><span class="tex" data-tex="= \\mathbf{X}^\\top\\mathbf{X}\\mathbf{w} - \\mathbf{X}^\\top\\mathbf{t}"></span></div><div class="why frag" data-f="4">differentiate with respect to <b>w</b></div>
    <div class="lhs frag" data-f="5"><span class="tex" data-tex="\\mathbf{X}^\\top\\mathbf{X}\\mathbf{w}"></span></div><div class="rhs frag" data-f="5"><span class="tex" data-tex="= \\mathbf{X}^\\top\\mathbf{t}"></span></div><div class="why frag" data-f="5">set the gradient to zero — the <em>normal equations</em></div>
    <div class="lhs big frag" data-f="6"><span class="tex" data-tex="\\mathbf{w}_{\\mathrm{ML}}"></span></div><div class="rhs big frag" data-f="6"><span class="tex" data-tex="= (\\mathbf{X}^\\top\\mathbf{X})^{-1}\\mathbf{X}^\\top\\mathbf{t}"></span></div><div class="why frag" data-f="6">solve, assuming <b>X</b><sup>⊤</sup><b>X</b> is invertible</div>
  </div>`},

{s:"Part II", t:"Why they are called normal equations", html:`
  <div class="eyebrow">A second way to see it</div>
  <h2 style="margin-bottom:10px">Why they are called the <em>normal</em> equations</h2>
  <div class="row top" style="gap:34px">
    <div class="col" style="flex:1.05">
      <svg viewBox="0 0 430 300" width="100%" height="360">
        <defs><marker id="av" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
          <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="currentColor"/></marker></defs>
        <g class="frag" data-f="0">
          <path d="M40,215 L250,255 L392,190 L182,152 Z" fill="var(--accent)" opacity=".09"
                stroke="var(--rule)" stroke-width="1.5"/>
          <text x="330" y="240" class="tx-leaf" style="font-size:13px">column space of <tspan font-weight="700">X</tspan></text>

        </g>

          <!-- corner marker spans the vertical residual and the plane's own edge direction -->
          <path d="M232,173 L245.7,175.6 L245.7,190.6" fill="none" stroke="var(--accent2)" stroke-width="1.8"/>
          <!-- label sits beside the residual, on the empty side: no connector needed,

    <div class="col">
      <p class="frag" data-f="1" style="font-size:18px;margin-bottom:14px">
        <span class="tex" data-tex="\\mathbf{X}\\mathbf{w}"></span> can only ever land
        <strong>inside the plane</strong> spanned by the columns of <span class="tex" data-tex="\\mathbf{X}"></span>.
        The targets <span class="tex" data-tex="\\mathbf{t}"></span> generally do not lie in it.</p>
      <p class="frag" data-f="3" style="font-size:18px;margin-bottom:14px">
        The closest point in the plane is the one where the residual is
        <em class="hl">perpendicular</em> to the plane — <em>normal</em> to it.</p>
      <div class="frag" data-f="4" class="card">
        <div class="eq" style="font-size:21px;margin:0"><span class="texd" data-tex="\\mathbf{X}^\\top(\\mathbf{t}-\\mathbf{X}\\mathbf{w}) = \\mathbf{0}"></span></div>
        <p style="margin-top:8px;font-size:20px">which rearranges to exactly the equations we just derived.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Summary — linear regression", html:`
  <div class="eyebrow">Checkpoint</div>
  <h2>Summary — Linear Regression</h2>
  <div class="card" style="padding:30px 34px">
    <div class="row top" style="gap:40px">
      <div class="col">
        <div class="eyebrow" style="margin-bottom:14px">Key ingredients</div>
        <p style="margin-bottom:11px"><strong>Data</strong> &nbsp;<span class="tex" data-tex="D = \\{(\\mathbf{x}_n,\\, t_n)\\}_{n=1}^{N}"></span></p>
        <p style="margin-bottom:11px"><strong>Model</strong> &nbsp;<span class="tex" data-tex="y(\\mathbf{x}) = \\mathbf{w}^\\top\\mathbf{x}"></span>
          &nbsp;<span class="caption" style="font-style:normal">(recall <span class="tex" data-tex="\\mathbf{x} = [\\,1,\\ x\\,]^\\top"></span>)</span></p>
        <p><strong>Loss</strong> &nbsp;<span class="tex" data-tex="E(\\mathbf{w}) = \\frac{1}{2}\\sum_{n=1}^{N}\\bigl(\\mathbf{w}^\\top\\mathbf{x}_n - t_n\\bigr)^2"></span></p>
      </div>
      <div class="col" style="flex:.8">
        <div class="eyebrow" style="margin-bottom:14px">Solution</div>
        <div class="eq eq-box" style="font-size:26px;margin:0"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{ML}} = (\\mathbf{X}^\\top\\mathbf{X})^{-1}\\mathbf{X}^\\top\\mathbf{t}"></span></div>
      </div>
    </div>
  </div>
  <p class="frag" data-f="0" style="margin-top:24px;text-align:center;font-size:19px">
    Notice how little of that was specific to <em>lines</em>. That is the opening we exploit next.</p>`},

{s:"Part II", t:"Nonlinear regression", html:`
  <div class="eyebrow">Nonlinear regression</div>
  <h2>The same machinery, richer functions</h2>
  <div class="frag" data-f="0">
    <p style="margin-bottom:4px">Replace the input with a vector of <em class="hl">basis functions</em>:</p>
    <div class="eq" style="font-size:24px"><span class="tex" data-tex="x \\mapsto \\boldsymbol{\\phi}(x) = [\\,1,\\ x,\\ x^2,\\ x^3,\\ \\dots,\\ x^{M-1}\\,]^\\top"></span></div>
  </div>
  <div class="frag" data-f="1">
    <div class="eq" style="font-size:24px"><span class="tex" data-tex="y(x;\\mathbf{w}) = \\sum_{i=0}^{M-1} w_i\\,\\phi_i(x) = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x)"></span></div>
    <p class="caption">Still <strong>linear in the weights</strong> — so the entire derivation goes through unchanged,
    with <span class="tex" data-tex="\\boldsymbol{\\Phi}"></span> in place of <span class="tex" data-tex="\\mathbf{X}"></span>.</p>
  </div>
  <div class="frag" data-f="2" style="margin-top:18px">
    <div class="row stretch" style="gap:24px">
      <div class="col card" style="text-align:center">
        <div class="eyebrow" style="margin-bottom:10px">Least squares</div>
        <div class="eq center" style="font-size:24px;margin:0"><span class="tex" data-tex="\\mathbf{w}_{\\mathrm{ML}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
      </div>
      <div class="col card accent frag" data-f="3" style="text-align:center">
        <div class="eyebrow" style="margin-bottom:10px;color:var(--accent)">Ridge / weight decay</div>
        <div class="eq center" style="font-size:24px;margin:0"><span class="tex" data-tex="\\mathbf{w}_{\\mathrm{RR}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\lambda\\mathbf{I})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
      </div>
    </div>
  </div>
  <p class="caption frag" data-f="4" style="margin-top:18px;text-align:center">
    We will earn that second box shortly. First — nothing here said the basis had to be
    <em>polynomials</em>.</p>`},

{s:"Part II", t:"Basis functions are a choice", draw:"basis", html:`
  <div class="eyebrow">Generality</div>
  <h2 style="margin-bottom:10px">Polynomials are only one choice</h2>
  <div class="row" style="gap:22px;align-items:center;margin-bottom:8px;min-height:56px">
    <div class="basisbtns" style="margin:0">
      <span class="bbtn sel" data-b="poly">polynomial</span>
      <span class="bbtn" data-b="gauss">Gaussian</span>
      <span class="bbtn" data-b="sigmoid">sigmoid</span>
    </div>
    <div id="basiseq" style="font-size:20px;min-height:50px;display:flex;align-items:center"></div>
  </div>
  <div class="row top" style="gap:24px">
    <div class="col" style="flex:1.22"><svg id="basisfn" viewBox="0 0 560 250" width="100%"></svg>
      <p class="caption" style="text-align:center;margin-top:2px">the basis functions themselves</p></div>
    <div class="col"><svg id="basisfit" viewBox="0 0 460 250" width="100%"></svg>
      <p class="caption" style="text-align:center;margin-top:2px">the resulting fit</p></div>
  </div>
  <p class="frag" data-f="0" style="margin-top:12px;text-align:center;font-size:17.5px">
    Nothing in the derivation cared which functions we chose — only that the model stayed
    <em class="hl">linear in the weights</em>.</p>`},

{s:"Part II", t:"From maths to code — basis functions", draw:"poly", html:`
  <div class="eyebrow">The notebook · basis functions</div>
  <h2 style="margin-bottom:16px">Same solver, richer features</h2>
  <div class="row top" style="gap:26px">
    <div class="col" style="flex:1.08">
      <div class="nb">
        <div class="nb-bar"><span class="dot"></span>In&nbsp;[8]</div>
        <pre class="code sm">def polyBasis(xs, order):
    xo = xs.reshape(-1, 1)
    X  = np.ones(len(xs))
    for i in np.arange(1, order + 1):
        X = np.c_[X, pow(xo, i)]
    return X

def fitPoly(xs, ts, order):
    Phi = polyBasis(xs, order)
    return pinv(Phi) @ ts.reshape(-1, 1)</pre>
        <div class="nb-out"><div class="ol">Out&nbsp;[8] · order 5</div><span id="polyout">…</span></div>
      </div>
      <p class="caption" style="margin-top:12px;font-size:15px">
        <span class="tex" data-tex="\\texttt{pinv}"></span> is the pseudoinverse via SVD — numerically kinder than
        inverting <span class="tex" data-tex="\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi}"></span> directly.</p>
    </div>
    <div class="col frag" data-f="0"><svg id="polysvg" viewBox="0 0 470 320" width="100%"></svg>
      <p class="caption" style="text-align:center;margin-top:2px">
        Order 5 on the nonlinear data. So what happens if we push the order higher?</p></div>
  </div>`},

{s:"Part II", t:"Training error is not test error", draw:"err", html:`
  <div class="eyebrow">The plot to remember</div>
  <h2 style="margin-bottom:12px">Training error is not test error</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:1.45"><svg id="errsvg" viewBox="0 0 560 340" width="100%"></svg></div>
    <div class="col">
      <ul style="margin-top:4px">
        <li class="frag" data-f="0"><strong style="color:var(--accent2)">Training error</strong>
          falls monotonically. More capacity always fits the data you have better.</li>
        <li class="frag" data-f="1"><strong style="color:var(--accent)">Test error</strong>
          falls, bottoms out, then climbs. That turn is where the model starts fitting noise.</li>
        <li class="frag" data-f="2">The gap between the two curves <em class="hl">is</em> overfitting.</li>
      </ul>
      <div class="frag" data-f="3" style="margin-top:12px">
        <hr class="rule" style="margin:10px 0">
        <p style="font-size:16px">Both curves are measured the same way — squared error against
        <em>observed</em> targets — so they are directly comparable. Notice the test curve never
        reaches zero: it bottoms out near the <strong>noise floor</strong>. No model can beat that,
        however clever. Week 5 gives that floor a name, in the
        <strong>bias–variance decomposition</strong>.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Overfitting", html:`
  <div class="eyebrow">The central problem</div>
  <h2>Overfitting</h2>
  <div class="card accent" style="padding:16px 24px;margin-bottom:10px">
    <p style="font-size:21px;max-width:none">
      Training error is <em class="hl">not</em> generalisation error.<br>
      <span style="font-size:18px;color:var(--ink-soft)">We care about <strong>test</strong> error —
      but all we ever observe is <strong>training</strong> error.</span></p>
  </div>
  <ul class="frag" data-f="0" style="margin-top:2px">
    <li style="margin-bottom:8px">A sufficiently flexible model can fit every training point <em>exactly</em>.</li>
    <li style="margin-bottom:8px">In doing so it fits the <em class="hl">noise</em>, not the signal.</li>
    <li style="margin-bottom:8px">And it does this <em>while the training error keeps improving</em> —
      the number we are watching gets better as the model gets worse.</li>
  </ul>
  <div class="frag" data-f="1" style="margin-top:12px">
    <hr class="rule" style="margin:12px 0">
    <div class="row" style="gap:26px">
      <div class="col">
        <h3 style="font-size:19px">So we cannot detect it from training error alone</h3>
        <p style="font-size:16.5px">No quantity computed on the training set will tell us to stop.
        The only honest signal comes from data the model has <em class="hl">never seen</em> —
        which is exactly why we held some out.</p>
      </div>
      <div class="col frag" data-f="2">
        <h3 style="font-size:19px">How bad can the gap get?</h3>
        <p style="font-size:16.5px">That question has a real answer. <strong>Week 6</strong>,
        <em class="hl">computational learning theory</em>, bounds the gap between training and test
        error in terms of how much capacity the model had.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Who do you hire?", draw:"hire", html:`
  <div class="eyebrow">Why this happens &#8212; concretely</div>
  <h2 style="margin-bottom:8px">Candidates sit for a test. You hire the top scorer.</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="hiresvg" viewBox="0 0 560 330" width="100%"></svg></div>
    <div class="demo-ctrl">
      <div style="display:flex;gap:8px;margin-bottom:16px">

      <div class="ctrl-row"><label>Luck in the score <span class="val" id="hiresdv">1.0</span></label>
        <input type="range" id="hiresd" min="0" max="3" step="0.1" value="1"></div>
      <div class="readout">
        <div class="stat train"><div class="k">hired the best?</div><div class="v" id="hirehit">&#8212;</div></div>
        <div class="stat test"><div class="k">winner flattered by</div><div class="v" id="hiregap">&#8212;</div></div>
      </div>
      <div class="warn" id="hirewarn">Nobody has taken the test yet. Grey ticks are true ability &#8212; which you never get to see.</div>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:10px;text-align:center;font-size:17px">
    Each candidate is a function your model could have chosen; the test is your
    <strong>training set</strong>. Fitting <em>is</em> hiring the top scorer &#8212;
    and you inherit <em class="hl">their luck along with their ability</em>.</p>`},

{s:"Part II", t:"The optimiser's curse", html:`
  <div class="eyebrow">Why this happens</div>
  <h2 style="margin-bottom:14px">The trouble is the <em>argmin</em>, not the measure</h2>
  <div class="row top" style="gap:34px">
    <div class="col" style="flex:1.15">
      <p style="font-size:17.5px;margin-bottom:4px">For <strong>any single</strong> function, training
      error is honest &#8212; off only by noise, and that noise averages out:</p>
      <div class="eq" style="margin:6px 0 12px;font-size:20px"><span class="texd" data-tex="\\widehat{E}(h) = E(h) + \\varepsilon(h), \\qquad \\mathbb{E}\\bigl[\\varepsilon(h)\\bigr] = 0"></span></div>
      <p class="frag" data-f="0" style="font-size:17.5px;margin-bottom:4px">But we do not evaluate one
      function. We <em class="hl">search a set</em> and keep the winner:</p>
      <div class="eq frag" data-f="0" style="margin:6px 0 12px;font-size:20px"><span class="texd" data-tex="\\widehat{h} = \\operatorname*{arg\\,min}_{h\\in\\mathcal{H}}\\ \\bigl(E(h) + \\varepsilon(h)\\bigr)"></span></div>
      <p class="frag" data-f="1" style="font-size:17.5px">The argmin chases <strong>both</strong> terms.
      It rewards a genuinely good function and one that merely <em class="hl">got lucky</em> alike &#8212;
      so the winner is systematically the luckiest, and its training error is
      <strong>biased downwards</strong>.</p>
    </div>
    <div class="col">
      <div class="card accent">
        <p style="font-size:17.5px;max-width:none">The richer the set
        <span class="tex" data-tex="\\mathcal{H}"></span>, the more functions there are to get lucky.
        <strong>Capacity buys luck</strong> &#8212; exactly the knob we were turning with polynomial order.</p>
      </div>
      <p class="caption frag" data-f="2" style="margin-top:14px">Week 6 makes this precise: computational
      learning theory bounds how large the gap can get, in terms of the size of
      <span class="tex" data-tex="\\mathcal{H}"></span>.</p>
    </div>
  </div>`},

{s:"Part II", t:"What actually goes wrong", draw:"wig", html:`
  <div class="eyebrow">Before we fix it — what is the symptom?</div>
  <h2 style="margin-bottom:10px">Wiggly curves are made of enormous weights</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="wigsvg" viewBox="0 0 560 320" width="100%"></svg></div>
    <div class="demo-ctrl">
      <div class="ctrl-row"><label>Polynomial order <span class="val" id="wigov">3</span></label>
        <input type="range" id="wigo" min="1" max="12" step="1" value="3"></div>
      <div class="readout">
        <div class="stat train"><div class="k">largest |w<sub>i</sub>|</div><div class="v" id="wigmax">&#8212;</div></div>
        <div class="stat test"><div class="k">&#8214;w&#8214;</div><div class="v" id="wignorm">&#8212;</div></div>
      </div>
      <div class="warn" id="wigwarn"></div>
      <p class="caption frag" data-f="0" style="margin-top:8px">
        Huge coefficients of alternating sign, cancelling each other to pass through every point.
        <strong>So: penalise the size of the weights.</strong> That is the whole idea of ridge regression.</p>
    </div>
  </div>`},

{s:"Part II", t:"Deriving ridge regression", html:`
  <div class="eyebrow">Derivation · regularisation</div>
  <h2 style="margin-bottom:10px">Deriving ridge regression</h2>
  <div class="row" style="gap:12px;margin-bottom:14px">
    <div class="col card" style="padding:11px 15px">
      <div class="eyebrow" style="margin-bottom:4px">Data — unchanged</div>
      <div style="font-size:17px"><span class="tex" data-tex="D = \\{(\\mathbf{x}_n,\\, t_n)\\}"></span></div></div>
    <div class="col card" style="padding:11px 15px">
      <div class="eyebrow" style="margin-bottom:4px">Model — unchanged</div>
      <div style="font-size:17px"><span class="tex" data-tex="y(x;\\mathbf{w}) = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x)"></span></div></div>
    <div class="col card accent" style="padding:11px 15px">
      <div class="eyebrow" style="margin-bottom:4px;color:var(--accent)">Loss — this is the only change</div>
      <div style="font-size:17px"><span class="tex" data-tex="\\widetilde{E}(\\mathbf{w}) = E(\\mathbf{w}) + \\frac{\\lambda}{2}\\lVert\\mathbf{w}\\rVert_2^2"></span></div></div>
  </div>
  <div class="dgrid">
    <div class="lhs frag" data-f="0"><span class="tex" data-tex="\\widetilde{E}(\\mathbf{w})"></span></div><div class="rhs frag" data-f="0"><span class="tex" data-tex="= \\frac{1}{2}(\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w})^\\top(\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}) + \\frac{\\lambda}{2}\\mathbf{w}^\\top\\mathbf{w}"></span></div><div class="why frag" data-f="0">add a penalty on the size of the weights</div>
    <div class="lhs frag" data-f="1"><span class="tex" data-tex="\\nabla_{\\mathbf{w}} \\widetilde{E}"></span></div><div class="rhs frag" data-f="1"><span class="tex" data-tex="= \\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi}\\mathbf{w} - \\boldsymbol{\\Phi}^\\top\\mathbf{t} + \\lambda\\mathbf{w}"></span></div><div class="why frag" data-f="1">the penalty contributes a single extra term, λ<b>w</b></div>
    <div class="lhs frag" data-f="2"><span class="tex" data-tex="(\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\lambda\\mathbf{I})\\mathbf{w}"></span></div><div class="rhs frag" data-f="2"><span class="tex" data-tex="= \\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div><div class="why frag" data-f="2">set to zero and collect terms in <b>w</b></div>
    <div class="lhs big frag" data-f="3"><span class="tex" data-tex="\\mathbf{w}_{\\mathrm{RR}}"></span></div><div class="rhs big frag" data-f="3"><span class="tex" data-tex="= (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\lambda\\mathbf{I})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div><div class="why frag" data-f="3">λ<b>I</b> keeps this invertible even when Φ<sup>⊤</sup>Φ is not</div>
  </div>
  <p class="caption frag" data-f="4" style="margin-top:16px">
    Same three steps as before — write the objective, differentiate, set to zero.
    Only the objective changed.</p>`},

{s:"Part II", t:"When the normal equations break", html:`
  <div class="eyebrow">A second reason to regularise</div>
  <h2 style="margin-bottom:10px">When the normal equations break</h2>
  <div class="row" style="gap:18px;margin:4px 0 14px;align-items:stretch">
    <div class="col card" style="text-align:center;padding:14px">
      <div class="eyebrow" style="margin-bottom:8px">Least squares</div>
      <div class="eq" style="margin:0;font-size:21px"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{ML}} = (\\mathbf{X}^\\top\\mathbf{X})^{-1}\\mathbf{X}^\\top\\mathbf{t}"></span></div>
    </div>
    <div class="col card accent" style="text-align:center;padding:14px">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Ridge</div>
      <div class="eq" style="margin:0;font-size:21px"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{RR}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\lambda\\mathbf{I})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
    </div>
  </div>
  <p style="margin-bottom:12px">The left-hand inverse only exists if
  <span class="tex" data-tex="\\mathbf{X}^\\top\\mathbf{X}"></span>
  is non-singular. It is not, whenever:</p>
  <div class="row top" style="gap:26px">
    <div class="col card frag" data-f="0">
      <h3 style="font-size:19px">Two features say the same thing</h3>
      <p style="font-size:16.5px">Height in cm and height in inches. One column is a multiple of another,
      so the columns are linearly dependent.</p>
    </div>
    <div class="col card frag" data-f="1">
      <h3 style="font-size:19px">More features than data</h3>
      <p style="font-size:16.5px"><span class="tex" data-tex="M > N"></span> — an order-12 polynomial through
      10 points. Infinitely many weight vectors fit perfectly.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;text-align:center">
    <p style="font-size:19px;max-width:none">The ridge form has no such problem. Adding
    <span class="tex" data-tex="\\lambda\\mathbf{I}"></span> to the diagonal makes the matrix invertible
    <strong>for any</strong> <span class="tex" data-tex="\\lambda > 0"></span>.<br>
    <span style="color:var(--ink-soft);font-size:17px">So regularisation was never only about
    overfitting — it repairs the linear algebra too.</span></p>
  </div>`},

{s:"Part II", t:"Predict — what does λ do to the weight?", html:`
  <span class="actbadge">Predict first</span>
  <div class="actq" style="font-size:27px;margin:12px 0 16px">The data was generated from
    <span class="tex" data-tex="y = 10x"></span> plus noise. Least squares returns
    <span class="tex" data-tex="w \\approx 13.5"></span>.<br>As we turn up <span class="tex" data-tex="\\lambda"></span>, what happens to
    <span class="tex" data-tex="\\mathbf{w}"></span>?</div>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="actopt"><div class="k">A</div><div>It stays at 13.5 — the penalty only affects the loss value</div></div>
      <div class="actopt"><div class="k">B</div><div>It moves towards 10 and stops there</div></div>
      <div class="actopt"><div class="k">C</div><div>It falls steadily towards 0, passing 10 on the way</div></div>
      <div class="actopt"><div class="k">D</div><div>It grows without bound</div></div>
    </div>
    <div class="col card" style="flex:.72">
      <p style="font-size:17px">And a second question worth committing to:
      is there a value of <span class="tex" data-tex="\\lambda"></span> for which the estimate is
      <em class="hl">closer to the truth</em> than least squares?</p>
      <hr class="rule">
      <p class="caption">We will drag the slider and find out.</p>
    </div>
  </div>`},

{s:"Part II", t:"Interactive — the regulariser", draw:"bowl", html:`
  <div class="eyebrow">Live demo · what the regulariser actually does</div>
  <h2 style="margin-bottom:12px">Where the minimum moves</h2>

    <div class="demo-ctrl">

          <div class="v" style="color:var(--ink)">10.00</div></div>

        <div class="stat test"><div class="k">w (ridge)</div><div class="v" id="wrr">&#8212;</div></div>

{s:"Part II", t:"What does the closed form cost?", html:`
  <div class="eyebrow">Looking ahead</div>
  <h2 style="margin-bottom:12px">Exact, but not free</h2>
  <div class="row top" style="gap:34px">
    <div class="col">
      <div class="eq" style="margin:0 0 6px;font-size:22px"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{ML}} = (\\mathbf{X}^\\top\\mathbf{X})^{-1}\\mathbf{X}^\\top\\mathbf{t}"></span></div>
      <div class="eq" style="margin:0 0 12px;font-size:22px"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{RR}} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi} + \\lambda\\mathbf{I})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
      <p class="caption" style="margin-bottom:12px">Both cost the same. Adding
      <span class="tex" data-tex="\\lambda\\mathbf{I}"></span> touches only the diagonal, so
      regularisation is computationally <em class="hl">free</em>.</p>
      <ul>
        <li class="frag" data-f="0">Forming <span class="tex" data-tex="\\mathbf{X}^\\top\\mathbf{X}"></span>
          costs <span class="tex" data-tex="O(N M^2)"></span> arithmetic operations</li>
        <li class="frag" data-f="1">Solving the resulting system costs <span class="tex" data-tex="O(M^3)"></span></li>
        <li class="frag" data-f="2">Separately, <span class="tex" data-tex="\\mathbf{X}"></span> has to
          <em class="hl">fit in memory</em>: <span class="tex" data-tex="N \\times M"></span> numbers</li>
      </ul>
      <p class="caption frag" data-f="3" style="margin-top:12px">
        In every row opposite <span class="tex" data-tex="N \\gg M"></span>, so <span class="tex" data-tex="N M^2"></span>
        dominates <span class="tex" data-tex="M^3"></span> &mdash; the operation counts are just
        <span class="tex" data-tex="N M^2"></span>.</p>
    </div>
    <div class="col frag" data-f="4">
      <table style="font-size:14.5px">
        <tr><th>N</th><th>M</th><th>operations ≈ NM<sup>2</sup></th><th>memory for X</th></tr>
        <tr><td>1 000</td><td>10</td><td>10<sup>5</sup> — instant</td><td>80 KB</td></tr>
        <tr><td>100 000</td><td>100</td><td>10<sup>9</sup> — a second or two</td><td>80 MB</td></tr>
        <tr class="hi"><td>10<sup>6</sup></td><td>10<sup>3</sup></td><td>10<sup>12</sup> — impractical</td><td>8 GB</td></tr>
      </table>
      <p class="cred" style="text-align:left;margin-top:6px">memory assumes 8 bytes per entry</p>
      <p class="caption" style="margin-top:10px">Both columns fail at once, which is why the rest of the
      course reaches for <strong>iterative</strong> methods — gradient descent in Week 8, stochastic
      gradient descent in Week 9. They give up exactness to buy scale.</p>
    </div>
  </div>`},

{s:"Part II", t:"Summary — what we did", html:`
  <div class="eyebrow">Checkpoint</div>
  <h2>What we did today</h2>
  <ul>
    <li class="frag" data-f="0"><strong>Data, model, loss</strong> — the three ingredients behind every method in this course.</li>
    <li class="frag" data-f="1"><strong>Linear regression</strong> has a closed-form solution via the normal equations.</li>
    <li class="frag" data-f="2"><strong>Basis functions</strong> buy nonlinearity while keeping the model linear in <span class="tex" data-tex="\\mathbf{w}"></span>.</li>
    <li class="frag" data-f="3"><strong>Overfitting</strong> — training error is not generalisation error.</li>
    <li class="frag" data-f="4"><strong>Regularisation</strong> controls the weights, and is our first example of <em class="hl">inductive bias</em>.</li>
  </ul>
  <div class="frag" data-f="5" style="margin-top:24px">
    <hr class="rule">
    <div class="row" style="gap:32px">
      <div class="col"><h3>Think about</h3>
        <p style="font-size:17px">What happens with <span class="tex" data-tex="N = 100"></span> at order 10 — does it still overfit?
        What about <span class="tex" data-tex="N = 10^6"></span>? What makes the analytic solution undesirable then?
        What if you change the basis functions?</p></div>
      <div class="col"><h3>Next week</h3>
        <p style="font-size:17px">Regression II — probabilistic modelling and maximum likelihood.
        Where does that <span class="tex" data-tex="\\tfrac{1}{2}"></span> in the loss actually come from?<br>
        <span class="caption">Reading: PRML §1.2, §3.1.1, §3.3</span></p></div>
    </div>
  </div>`},

{s:"Part III", t:"How lectures work", html:`
  <div class="eyebrow">How to get the most out of this</div>
  <h2>How lectures work</h2>

/* ============================================================

/* Per-slide delivery estimate in minutes (see the timing note in the README).
   Used for the overview cumulative marks and the presenter clock. */
const EST=[0.6, 0.7, 1.8, 0.4, 1.3, 2.5, 1.6, 0.4, 1.7, 2.5, 2.3, 3.5, 2.1, 0.4, 0.9, 1.9, 1.8, 4.0, 2.4, 7.9, 2.6, 5.3, 4.0, 4.3, 1.7, 3.0, 4.3, 4.9, 4.0, 3.8, 5.5, 2.9, 3.2, 2.0, 2.4, 4.5, 6.7, 4.0, 4.3, 2.5, 3.3, 3.0, 0.4, 1.4, 2.8, 1.7, 1.5, 2.2, 1.8, 1.6, 0.9, 1.3, 1.3, 1.9, 1.6, 1.4, 3.0, 0.5];
const EST_TOTAL=EST.reduce((a,b)=>a+b,0);
const cumMin=i=>EST.slice(0,i+1).reduce((a,b)=>a+(b||0),0);

const canvas=document.getElementById('canvas');
let idx=0,fragStep=0;
canvas.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}</section>`).join('');
const slides=[...canvas.querySelectorAll('.slide')];

function fragsOf(i){
  const f=[...slides[i].querySelectorAll('.frag')];
  return {list:f,max:f.length?Math.max(...f.map(e=>+(e.dataset.f||0))):-1};
}
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  fragsOf(idx).list.forEach(e=>e.classList.toggle('on',(+(e.dataset.f||0))<fragStep));
  document.getElementById('progress').style.width=((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('pagenum').textContent=`${idx+1} / ${SLIDES.length}`;
  if(t0!==null) updClock();
  const d=SLIDES[idx].draw; if(d&&DRAW[d]) requestAnimationFrame(DRAW[d]);
  /* play video on the slide we just entered, pause and rewind everywhere else */
  slides.forEach((s,i)=>s.querySelectorAll('video').forEach(v=>{
    if(i===idx){ v.playbackRate=+(v.dataset.rate||1); v.play().catch(()=>{}); }
    else if(!v.paused||v.currentTime){ v.pause(); v.currentTime=0; }
  }));
  /* Leaving the slide has to REMOVE the iframe, not pause it: playback cannot be controlled
     across origins without pulling in the YouTube JS API, and an iframe left behind on a
     hidden slide keeps playing audio. */
  document.querySelectorAll('.ytwrap.live').forEach(w=>{
    if(+w.closest('.slide').dataset.i !== idx) closeYT(w);
  });
}
function leave(){ const s=slides[idx]; s.classList.add('leaving');
  setTimeout(()=>s.classList.remove('leaving'),160); }
function go(n){ if(n<0||n>=SLIDES.length)return; saveInk(); leave(); idx=n; fragStep=fragsOf(idx).max+1; paint(); loadInk(idx); }
function next(){ const {max}=fragsOf(idx);
  if(fragStep<=max){fragStep++;paint();}
  else if(idx<SLIDES.length-1){saveInk();leave();idx++;fragStep=0;paint();loadInk(idx);} }
function prev(){ if(fragStep>0){fragStep--;paint();}
  else if(idx>0){saveInk();leave();idx--;fragStep=fragsOf(idx).max+1;paint();loadInk(idx);} }

function fit(){ canvas.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)*.955})`; }
addEventListener('resize',fit); fit();

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  /* arrows belong to a focused slider, not to navigation */
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown') return;
    if(k==='d'||k==='t'||k==='o'||k==='b') return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  else if(k==='o')toggleOv(); else if(k==='t')cycleTheme();
  else if(k==='b')document.body.classList.toggle('blank');
  else if(k==='d'){e.preventDefault();toggleInk();}
  else if(k==='p'){e.preventDefault();toggleClock();}
  else if(k==='c'&&document.body.classList.contains('inking'))clearInk();
  else if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(e.key==='Escape')ov.classList.remove('on');
});

const ov=document.getElementById('overview');
ov.innerHTML=SLIDES.map((s,i)=>
  `<div class="thumb ${s.div?'divider-t':''}" data-i="${i}">
     ${s.s?`<div class="ts">${s.s}</div>`:''}<div class="tt">${s.t}</div><div class="tn">${i+1}</div></div>`).join('');
ov.addEventListener('click',e=>{const t=e.target.closest('.thumb');if(!t)return;go(+t.dataset.i);ov.classList.remove('on');});
function toggleOv(){ ov.classList.toggle('on');
  [...ov.children].forEach((c,i)=>c.classList.toggle('cur',i===idx));
  if(ov.classList.contains('on')) ov.children[idx]?.scrollIntoView({block:'center'}); }

const THEMES=['paper','academic','swiss','nocturne'];
function setTheme(t){ document.body.dataset.theme=t;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('sel',s.dataset.t===t));
  const d=SLIDES[idx].draw; if(d&&DRAW[d]) setTimeout(DRAW[d],520); }
function cycleTheme(){ setTheme(THEMES[(THEMES.indexOf(document.body.dataset.theme)+1)%THEMES.length]); }
document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>setTheme(s.dataset.t));

/* ============================================================
   DEMO 1 — polynomial fitting (mirrors the Colab notebook)
   ============================================================ */
const XS=[0,0.1111,0.2222,0.3333,0.4444,0.5556,0.6667,0.7778,0.8889,1.0];
const TS=[0.529,0.994,0.414,-0.527,-0.527,-0.206,0.484,-1.165,-1.905,-0.877];
const hFn=x=>-x+Math.sin(4*Math.PI*x);
/* Held-out inputs at the midpoints between training points — where a high-order
   interpolant does its worst, so the train/test gap is honest. */
const XT=[0.0556,0.1667,0.2778,0.3889,0.5,0.6111,0.7222,0.8333,0.9444];
/* …and their own noisy observations, drawn from the same process as the training
   targets. Measuring training error against noisy t but test error against the clean
   h(x) would compare two different quantities — and would hide the noise floor, which
   is exactly the irreducible term in the bias-variance decomposition. */
const NOISE_SD=0.3;
const TT=[0.4164,0.8883,-0.4713,-1.8644,-0.3272,0.5926,-0.5463,-1.8991,-1.2779];

const SUPS={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function sup(v){ const [m,e]=v.toExponential(1).split('e');
  return m+'×10'+[...e.replace('+','')].map(c=>SUPS[c]||c).join(''); }

const basis=(xs,o)=>xs.map(x=>{const r=[];for(let i=0;i<=o;i++)r.push(Math.pow(x,i));return r;});
function solve(A,b){ const n=A.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){ let p=c;
    for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    [M[c],M[p]]=[M[p],M[c]];
    if(Math.abs(M[c][c])<1e-14) continue;
    for(let r=0;r<n;r++){ if(r===c) continue;
      const f=M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }
  return M.map((r,i)=>Math.abs(M[i][i])<1e-14?0:r[n]/M[i][i]); }
function fitPoly(order,lambda){
  const P=basis(XS,order),m=order+1;
  const A=Array.from({length:m},()=>Array(m).fill(0)),b=Array(m).fill(0);
  for(let i=0;i<m;i++){
    for(let j=0;j<m;j++){let s=0;for(let n=0;n<P.length;n++)s+=P[n][i]*P[n][j];A[i][j]=s;}
    A[i][i]+=lambda;
    let s=0; for(let n=0;n<P.length;n++) s+=P[n][i]*TS[n]; b[i]=s; }
  return solve(A,b); }
const evalPoly=(w,x)=>w.reduce((s,c,i)=>s+c*Math.pow(x,i),0);
const rmse=(p,t)=>Math.sqrt(p.reduce((s,v,i)=>s+(v-t[i])**2,0)/p.length);

function drawFit(){
  const svg=document.getElementById('fitsvg'); if(!svg)return;
  const order=+document.getElementById('ord').value, sl=+document.getElementById('lam').value;
  /* wide log sweep so 'far too little' is reachable, not just 0 vs enough */
  const lambda=sl===0?0:Math.exp(-32+(sl-1)*0.323);
  document.getElementById('ordv').textContent=order;
  document.getElementById('lamv').textContent=sl===0?'λ = 0':'λ = '+sup(lambda);
  const w=fitPoly(order,lambda);
  const trE=rmse(XS.map(x=>evalPoly(w,x)),TS), teE=rmse(XT.map(x=>evalPoly(w,x)),TT);
  document.getElementById('trerr').textContent=trE.toFixed(3);
  document.getElementById('teerr').textContent=teE>99?'≫':teE.toFixed(3);
  const warn=document.getElementById('warn'), gap=teE/Math.max(trE,1e-6);
  if(trE<0.02&&teE>0.6)
    warn.textContent='Training error is essentially zero — and yet the fit is wrong. We have fitted the noise. This is overfitting.';
  else if(gap>3&&teE>0.6)
    warn.textContent='Test error is pulling away from training error. This is overfitting.';
  else if(trE>0.42&&sl>0)
    warn.textContent='Too much regularisation: the weights are crushed and the model can no longer bend. This is underfitting.';
  else if(trE>0.42)
    warn.textContent='Both errors are high and close together — the model is too rigid to represent the pattern. This is underfitting.';
  else if(sl>0&&order>=7&&teE<0.6)
    warn.textContent='Regularisation tames the weights: a flexible model that still generalises.';
  else warn.textContent='';

  const W=560,H=340,ml=44,mr=14,mt=14,mb=34;
  const x2p=x=>ml+x*(W-ml-mr), y2p=y=>mt+(2.6-y)/5.2*(H-mt-mb);
  let s='';
  for(let g=-2;g<=2;g++){const py=y2p(g);
    s+=`<line class="gridline" x1="${ml}" y1="${py}" x2="${W-mr}" y2="${py}"/>
        <text class="tick" x="${ml-9}" y="${py+4}" text-anchor="end">${g}</text>`;}
  for(let g=0;g<=1.0001;g+=0.25){const px=x2p(g);
    s+=`<line class="gridline" x1="${px}" y1="${mt}" x2="${px}" y2="${H-mb}"/>
        <text class="tick" x="${px}" y="${H-mb+18}" text-anchor="middle">${g.toFixed(2)}</text>`;}
  s+=`<line class="axis" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/>
      <line class="axis" x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}"/>`;
  let d=''; for(let x=0;x<=1.0001;x+=0.005) d+=(d?'L':'M')+x2p(x)+','+y2p(hFn(x))+' ';
  s+=`<path class="truefn" d="${d}"/>`;
  let f='',pen=true;
  for(let x=0;x<=1.0001;x+=0.004){ const y=evalPoly(w,x);
    if(y>3.4||y<-3.4){pen=true;continue;}
    f+=(pen?'M':'L')+x2p(x)+','+y2p(y)+' ';pen=false; }
  s+=`<path class="fitfn" d="${f}"/>`;
  XS.forEach((x,i)=>s+=`<circle class="datapt" cx="${x2p(x)}" cy="${y2p(TS[i])}" r="5"/>`);
  s+=`<g transform="translate(${W-172},${mt+4})">
    <line x1="0" y1="0" x2="26" y2="0" class="fitfn"/><text class="legend" x="33" y="4">fitted model</text>
    <line x1="0" y1="19" x2="26" y2="19" class="truefn"/><text class="legend" x="33" y="23">true h(x)</text>
    <circle class="datapt" cx="13" cy="38" r="4.5"/><text class="legend" x="33" y="42">observed data</text></g>`;
  svg.innerHTML=s;
}

/* ============================================================
   DEMO 2 — the regulariser as a second bowl
   ============================================================ */
/* y = 10x + noise. Only 12 points and a fair amount of noise, so least squares
   lands well above the truth (13.46 vs 10) — otherwise the "true w" marker sits
   on top of the data estimate and the whole point of the slide disappears. */
const BX=[],BT=[], W_TRUE=10, SEED_BOWL=462;
(function(){ let seed=SEED_BOWL; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  for(let i=0;i<12;i++){ const x=i/11; BX.push(x);
    BT.push(10*x+3.0*((rnd()+rnd()+rnd()+rnd()+rnd()+rnd()-3)));} })();
const S2=BX.reduce((s,x)=>s+x*x,0), SXT=BX.reduce((s,x,i)=>s+x*BT[i],0), STT=BT.reduce((s,t)=>s+t*t,0);
const errW=w=>0.5*(w*w*S2-2*w*SXT+STT);

function drawBowl(){
  const svg=document.getElementById('bowlsvg'); if(!svg)return;
  const sl=+document.getElementById('blam').value;
  const lambda=sl===0?0:Math.exp(-3+sl*0.058);
  document.getElementById('blamv').textContent=sl===0?'λ = 0':'λ = '+lambda.toFixed(lambda<10?2:0);
  const wML=SXT/S2, wRR=SXT/(S2+lambda);
  document.getElementById('wml').textContent=wML.toFixed(2);
  document.getElementById('wrr').textContent=wRR.toFixed(2);
  const bw=document.getElementById('bwarn');
  const errML=Math.abs(wML-W_TRUE), errRR=Math.abs(wRR-W_TRUE);
  if(sl===0) bw.textContent='λ = 0: pure least squares. Noise alone puts it '+errML.toFixed(2)+' away from the true weight.';
  else if(errRR<errML*0.55) bw.textContent='Note this: a little shrinkage has moved the estimate CLOSER to the truth than least squares.';
  else if(wRR<W_TRUE*0.55) bw.textContent='Too much penalty — the weight is dragged towards zero and the model underfits.';
  else bw.textContent='The minimum of the total loss sits between the data fit and zero. That is shrinkage.';

  const W=560,H=330,ml=46,mr=14,mt=16,mb=36, wMin=-4,wMax=16;
  const x2p=w=>ml+(w-wMin)/(wMax-wMin)*(W-ml-mr);
  let maxY=0; for(let w=wMin;w<=wMax;w+=0.5) maxY=Math.max(maxY,errW(w)+0.5*lambda*w*w);
  maxY=Math.max(maxY,errW(wMin)); const y2p=v=>mt+(1-v/maxY)*(H-mt-mb);
  let s='';
  for(let g=0;g<=4;g++){const py=mt+g/4*(H-mt-mb);
    s+=`<line class="gridline" x1="${ml}" y1="${py}" x2="${W-mr}" y2="${py}"/>`;}
  for(let g=wMin;g<=wMax;g+=4){const px=x2p(g);
    s+=`<line class="gridline" x1="${px}" y1="${mt}" x2="${px}" y2="${H-mb}"/>
        <text class="tick" x="${px}" y="${H-mb+18}" text-anchor="middle">${g}</text>`;}
  s+=`<line class="axis" x1="${ml}" y1="${H-mb}" x2="${W-mr}" y2="${H-mb}"/>
      <line class="axis" x1="${ml}" y1="${mt}" x2="${ml}" y2="${H-mb}"/>
      <text class="tick" x="${(ml+W)/2}" y="${H-mb+33}" text-anchor="middle" style="font-style:italic;font-size:13px">w</text>`;
  const curve=(fn,cls,extra='')=>{let d='';
    for(let w=wMin;w<=wMax;w+=0.1){const v=fn(w); if(v>maxY*1.02)  {d='';continue;}
      d+=(d?'L':'M')+x2p(w)+','+y2p(v)+' ';} return `<path d="${d}" ${extra} class="${cls}"/>`;};
  s+=curve(w=>errW(w),'',`fill="none" stroke="var(--accent2)" stroke-width="2.4" stroke-dasharray="6 4"`);
  if(lambda>0) s+=curve(w=>0.5*lambda*w*w,'',`fill="none" stroke="var(--accent)" stroke-width="2" opacity=".5"`);
  s+=curve(w=>errW(w)+0.5*lambda*w*w,'',`fill="none" stroke="var(--accent)" stroke-width="3.2"`);
  const mark=(w,col,lbl,dy)=>`<line x1="${x2p(w)}" y1="${mt}" x2="${x2p(w)}" y2="${H-mb}"
      stroke="${col}" stroke-width="1.6" stroke-dasharray="3 3"/>
    <circle cx="${x2p(w)}" cy="${y2p(errW(w)+0.5*lambda*w*w)}" r="5.5" fill="${col}"/>
    <text class="legend" x="${x2p(w)+8}" y="${mt+dy}" style="fill:${col};font-weight:700">${lbl}</text>`;
  /* the weight the data was actually generated from */
  s+='<line x1="'+x2p(W_TRUE)+'" y1="'+mt+'" x2="'+x2p(W_TRUE)+'" y2="'+(H-mb)+'"'
   + ' stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="2 4" opacity=".55"/>'
   + '<rect x="'+(x2p(W_TRUE)+4)+'" y="'+(H-mb-22)+'" width="74" height="17" rx="4" fill="var(--bg)" opacity=".88"/>'
   + '<text class="legend" x="'+(x2p(W_TRUE)+9)+'" y="'+(H-mb-10)+'" style="fill:var(--ink);font-weight:700">true w = 10</text>';
  s+=mark(wML,'var(--accent2)','w (data only)',14);
  if(lambda>0) s+=mark(wRR,'var(--accent)','w (ridge)',32);
  /* legend sits bottom-left: the error bowl is high on the left, so this stays clear */
  s+=`<g transform="translate(${ml+16},${H-mb-62})">
      <rect x="-9" y="-13" width="128" height="60" rx="6" fill="var(--bg)" opacity=".82"/>
      <line x1="0" y1="0" x2="24" y2="0" stroke="var(--accent2)" stroke-width="2.4" stroke-dasharray="6 4"/>
      <text class="legend" x="31" y="4">error</text>
      <line x1="0" y1="17" x2="24" y2="17" stroke="var(--accent)" stroke-width="2" opacity=".5"/>
      <text class="legend" x="31" y="21">regulariser</text>
      <line x1="0" y1="34" x2="24" y2="34" stroke="var(--accent)" stroke-width="3.2"/>
      <text class="legend" x="31" y="38">total loss</text></g>`;
  svg.innerHTML=s;
}

/* shared mini-plot: draws axes + grid, returns pixel mappers */
function axes(W,H,xlo,xhi,ylo,yhi,xstep,ystep){
  const ml=42,mr=12,mt=12,mb=32;
  const X=x=>ml+(x-xlo)/(xhi-xlo)*(W-ml-mr), Y=y=>mt+(yhi-y)/(yhi-ylo)*(H-mt-mb);
  let s='';
  for(let g=ylo;g<=yhi+1e-9;g+=ystep){ const py=Y(g);
    s+='<line class="gridline" x1="'+ml+'" y1="'+py+'" x2="'+(W-mr)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(py+4)+'" text-anchor="end">'+(+g.toFixed(2))+'</text>'; }
  for(let g=xlo;g<=xhi+1e-9;g+=xstep){ const px=X(g);
    s+='<line class="gridline" x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(H-mb)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(H-mb+17)+'" text-anchor="middle">'+(+g.toFixed(2))+'</text>'; }
  s+='<line class="axis" x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'"/>';
  return {s:s,X:X,Y:Y};
}
