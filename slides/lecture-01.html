/* ---------- minimal Python syntax highlighting ---------- */
const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;
function highlight(){
  /* Placeholders are delimited by private-use code points and indexed with a
     LETTER, not a digit: a digit index would be re-matched by the number rule. */
  const OPEN='', CLOSE='';
  document.querySelectorAll('pre.code').forEach(function(pre){
    if(pre.dataset.hl) return; pre.dataset.hl='1';
    let h=pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const stash=[];
    const keep=function(html){ stash.push(html); return OPEN+String.fromCharCode(65+stash.length-1)+CLOSE; };
    h=h.replace(/#[^\n]*/g, function(m){ return keep('<span class="tok-com">'+m+'</span>'); });
    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    h=h.replace(/\b([A-Za-z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
    h=h.replace(new RegExp(OPEN+'([A-Z])'+CLOSE,'g'), function(_,c){ return stash[c.charCodeAt(0)-65]; });
    pre.innerHTML=h;
  });
}

/* ---------- upright delimiters in maths ----------
   Only letters are variables. Brackets, digits, operators and punctuation are
   set upright. Runs once over every .m span at load. */
/* Render every data-tex node. Re-runnable: demos that rewrite innerHTML call it again.
   Falls back to the raw LaTeX so a bad macro can never blank a slide. */
function renderTeX(){
  if(typeof katex==='undefined'){ setTimeout(renderTeX,40); return; }
  document.querySelectorAll('[data-tex]').forEach(function(el){
    if(el.dataset.done) return;
    try{ katex.render(el.dataset.tex, el,
      {displayMode: el.classList.contains('texd'), throwOnError:false, output:'html',
       /* \htmlClass lets an equation colour its own parts through CSS variables, so
          colour coding follows the theme instead of freezing to the paper palette. */
       trust: c => c.command === '\\htmlClass', strict: false}); }
    catch(e){ el.textContent=el.dataset.tex; }
    el.dataset.done='1';
  });
}
addEventListener('load', renderTeX);

function uprightDelimiters(){
  const LETTER=/[A-Za-zͰ-Ͽ]/;
  document.querySelectorAll('.m').forEach(function(m){
    const w=document.createTreeWalker(m,NodeFilter.SHOW_TEXT), nodes=[];
    while(w.nextNode()) nodes.push(w.currentNode);
    nodes.forEach(function(n){
      if(n.parentElement.closest('.up,.vec,.mat,.op')) return;
      const t=n.nodeValue; if(!t.trim()) return;
      const frag=document.createDocumentFragment();
      let buf='',mode=null;
      const flush=function(){ if(!buf) return;
        if(mode==='up'){ const sp=document.createElement('span'); sp.className='up'; sp.textContent=buf; frag.appendChild(sp); }
        else frag.appendChild(document.createTextNode(buf));
        buf=''; };
      for(const ch of t){ const md=LETTER.test(ch)?'it':'up';
        if(md!==mode){ flush(); mode=md; } buf+=ch; }
      flush();
      n.parentNode.replaceChild(frag,n);
    });
  });
}

/* The classic train/test curve — the picture bias-variance decomposition explains. */
function drawErr(){
  const svg=document.getElementById('errsvg'); if(!svg) return;
  const MAXO=12, tr=[], te=[];
  for(let o=1;o<=MAXO;o++){ const w=fitPoly(o,0);
    tr.push(rmse(XS.map(x=>evalPoly(w,x)),TS));
    te.push(Math.min(rmse(XT.map(x=>evalPoly(w,x)),TT),2.0)); }
  const W=560,H=340,ml=52,mr=14,mt=16,mb=40, ymax=2.0;
  const X2=o=>ml+(o-1)/(MAXO-1)*(W-ml-mr), Y2=v=>mt+(1-v/ymax)*(H-mt-mb);
  let g='';
  for(let v=0;v<=ymax+1e-9;v+=0.5){ const py=Y2(v);
    g+='<line class="gridline" x1="'+ml+'" y1="'+py+'" x2="'+(W-mr)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(ml-9)+'" y="'+(py+4)+'" text-anchor="end">'+v.toFixed(1)+'</text>'; }
  for(let o=1;o<=MAXO;o++){ const px=X2(o);
    g+='<line class="gridline" x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(H-mb)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(H-mb+18)+'" text-anchor="middle">'+o+'</text>'; }
  g+='<line class="axis" x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'"/>'
   + '<text class="tick" x="'+((ml+W)/2)+'" y="'+(H-mb+34)+'" text-anchor="middle">polynomial order</text>'
   + '<text class="tick" transform="translate(14,'+((mt+H-mb)/2)+') rotate(-90)" text-anchor="middle">RMSE</text>';
  const path=a=>a.map((v,i)=>(i?'L':'M')+X2(i+1)+','+Y2(Math.min(v,ymax))).join(' ');
  // mark the minimum of the test curve
  let bi=0; te.forEach((v,i)=>{ if(v<te[bi]) bi=i; });
  g+='<line x1="'+X2(bi+1)+'" y1="'+mt+'" x2="'+X2(bi+1)+'" y2="'+(H-mb)+'" stroke="var(--ink-soft)" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>'
   + '<text class="legend" x="'+(X2(bi+1)+7)+'" y="'+(mt+13)+'" style="fill:var(--ink);font-weight:700">best generalisation</text>';
  /* the irreducible floor: no model can do better than the noise in the observations */
  g+='<line x1="'+ml+'" y1="'+Y2(NOISE_SD)+'" x2="'+(W-mr)+'" y2="'+Y2(NOISE_SD)+'"'
   + ' stroke="var(--ink-soft)" stroke-width="1.5" stroke-dasharray="2 5"/>'
   + '<text class="legend" x="'+(W-mr-4)+'" y="'+(Y2(NOISE_SD)-6)+'" text-anchor="end">'
   + 'noise floor &#963; = '+NOISE_SD+'</text>';
  g+='<path d="'+path(tr)+'" fill="none" stroke="var(--accent2)" stroke-width="2.8"/>';
  g+='<path d="'+path(te)+'" fill="none" stroke="var(--accent)" stroke-width="3"/>';
  tr.forEach((v,i)=>g+='<circle cx="'+X2(i+1)+'" cy="'+Y2(Math.min(v,ymax))+'" r="3.6" fill="var(--accent2)"/>');
  te.forEach((v,i)=>g+='<circle cx="'+X2(i+1)+'" cy="'+Y2(Math.min(v,ymax))+'" r="3.6" fill="var(--accent)"/>');
  g+='<g transform="translate('+(ml+16)+','+(mt+8)+')">'
   + '<line x1="0" y1="0" x2="24" y2="0" stroke="var(--accent2)" stroke-width="2.8"/><text class="legend" x="31" y="4">train</text>'
   + '<line x1="0" y1="17" x2="24" y2="17" stroke="var(--accent)" stroke-width="3"/><text class="legend" x="31" y="21">test</text></g>';
  svg.innerHTML=g;
}

/* ============================================================
   DEMO 5 — basis functions are a choice
   The derivation never cared what the basis was, only that the model stayed
   linear in w. Same solver, three different families.
   ============================================================ */
let BASIS_MODE='poly';
const NBASIS=9;
function basisFns(mode){
  const f=[x=>1];
  if(mode==='poly'){ for(let j=1;j<NBASIS;j++) f.push(x=>Math.pow(x,j)); }
  else if(mode==='gauss'){ const sd=0.12;
    for(let j=0;j<NBASIS-1;j++){ const mu=j/(NBASIS-2);
      f.push(x=>Math.exp(-Math.pow(x-mu,2)/(2*sd*sd))); } }
  else { const sc=0.06;
    for(let j=0;j<NBASIS-1;j++){ const mu=j/(NBASIS-2);
      f.push(x=>1/(1+Math.exp(-(x-mu)/sc))); } }
  return f;
}
function fitBasis(mode){
  const F=basisFns(mode), m=F.length;
  const Phi=XS.map(x=>F.map(f=>f(x)));
  const A=Array.from({length:m},()=>Array(m).fill(0)), b=Array(m).fill(0);
  for(let i=0;i<m;i++){
    for(let j=0;j<m;j++){ let a=0; for(let n=0;n<Phi.length;n++) a+=Phi[n][i]*Phi[n][j]; A[i][j]=a; }
    A[i][i]+=1e-7;                    /* a whisper of ridge, purely for numerical sanity */
    let c=0; for(let n=0;n<Phi.length;n++) c+=Phi[n][i]*TS[n]; b[i]=c;
  }
  return {w:solve(A,b), F:F};
}
/* what each family actually is, so the picture is tied to the formula */
/* No tall parentheses: this renderer cannot stretch fences (there is no working
   equivalent of \left( ... \right) ), so anything that would need a two-line
   bracket is written so it does not — e.g. the Gaussian goes in an exponent. */
const P_ = '<mo stretchy="false">(</mo>', P__ = '<mo stretchy="false">)</mo>';
const PHI_J = '<msub><mi>&#966;</mi><mi>j</mi></msub>'+P_+'<mi>x</mi>'+P__+'<mo>=</mo>';
const XMU = P_+'<mi>x</mi><mo>&#8722;</mo><msub><mi>&#956;</mi><mi>j</mi></msub>'+P__;
const BASIS_EQ={
  poly:'<span class="tex" data-tex="\\phi_j(x) = x^{\\,j}"></span>',
  gauss:'<span class="tex" data-tex="\\phi_j(x) = \\exp\\!\\left(-\\frac{(x-\\mu_j)^2}{2s^2}\\right)"></span>',
  sigmoid:'<span class="tex" data-tex="\\phi_j(x) = \\sigma\\!\\left(\\frac{x-\\mu_j}{s}\\right),\\quad \\sigma(a)=\\frac{1}{1+e^{-a}}"></span>'
};
function drawBasis(){
  const a=document.getElementById('basisfn'), c=document.getElementById('basisfit');
  if(!a||!c) return;
  document.querySelectorAll('.bbtn').forEach(b=>b.classList.toggle('sel', b.dataset.b===BASIS_MODE));
  const eqBox=document.getElementById('basiseq');
  if(eqBox){ eqBox.innerHTML=BASIS_EQ[BASIS_MODE]||''; renderTeX(); }   /* new node: re-render */
  const {w,F}=fitBasis(BASIS_MODE);

  /* left: the basis functions, drawn a little beyond [0,1] so the tails and the
     full sigmoid transitions are visible rather than clipped at the edges */
  const W=560,H=250,A1=axes(W,H,-0.2,1.2,-0.1,1.15,0.2,0.5);
  let g=A1.s;
  g+='<line x1="'+A1.X(0)+'" y1="'+A1.Y(-0.1)+'" x2="'+A1.X(0)+'" y2="'+A1.Y(1.15)+'" stroke="var(--rule)" stroke-width="1.2" stroke-dasharray="3 3"/>'
   + '<line x1="'+A1.X(1)+'" y1="'+A1.Y(-0.1)+'" x2="'+A1.X(1)+'" y2="'+A1.Y(1.15)+'" stroke="var(--rule)" stroke-width="1.2" stroke-dasharray="3 3"/>';
  for(let j=1;j<F.length;j++){
    let d='';
    for(let x=-0.2;x<=1.2001;x+=0.004){ const y=F[j](x); if(y<-0.15||y>1.2) continue;
      d+=(d?'L':'M')+A1.X(x)+','+A1.Y(y)+' '; }
    const hue=j/(F.length-1);
    g+='<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="1.9" opacity="'+(0.32+0.55*hue).toFixed(2)+'"/>';
  }
  g+='<line x1="'+A1.X(-0.2)+'" y1="'+A1.Y(1)+'" x2="'+A1.X(1.2)+'" y2="'+A1.Y(1)+'" stroke="var(--ink-soft)" stroke-width="1.4" stroke-dasharray="4 4"/>';
  g+='<text class="legend" x="'+(A1.X(1.2)-4)+'" y="'+(A1.Y(1)-6)+'" text-anchor="end">&#966;&#8320; = 1 (bias)</text>';
  a.innerHTML=g;

  /* right: the fit */
  const A2=axes(W,H,0,1,-3,3,0.25,1);
  let h=A2.s, d='';
  for(let x=0;x<=1.0001;x+=0.005) d+=(d?'L':'M')+A2.X(x)+','+A2.Y(hFn(x))+' ';
  h+='<path class="truefn" d="'+d+'"/>';
  let f='',pen=true;
  for(let x=0;x<=1.0001;x+=0.003){ let y=0; for(let j=0;j<F.length;j++) y+=w[j]*F[j](x);
    if(y>3.2||y<-3.2){pen=true;continue;} f+=(pen?'M':'L')+A2.X(x)+','+A2.Y(y)+' ';pen=false; }
  h+='<path class="fitfn" d="'+f+'"/>';
  XS.forEach((x,i)=>h+='<circle class="datapt" cx="'+A2.X(x)+'" cy="'+A2.Y(TS[i])+'" r="4.2"/>');
  c.innerHTML=h;
}
document.addEventListener('click',e=>{ const b=e.target.closest&&e.target.closest('.bbtn');
  if(!b) return; BASIS_MODE=b.dataset.b; drawBasis(); });

/* ============================================================
   DEMO 6 — leverage. Squared error punishes a big miss quadratically, so one
   bad point can drag the whole line. Students predict, then move it themselves.
   ============================================================ */
const DRAG_I=7;                       /* the point they can grab */
let DRAG_T=LT[DRAG_I], dragging=false;
function fitLine(ts){
  const n=LX.length, Sx=LX.reduce((a,b)=>a+b,0), Sxx=LX.reduce((a,b)=>a+b*b,0);
  const St=ts.reduce((a,b)=>a+b,0), Sxt=LX.reduce((a,x,i)=>a+x*ts[i],0);
  return solve([[n,Sx],[Sx,Sxx]],[St,Sxt]);
}
const D_W=560,D_H=350,D_ML=46,D_MR=14,D_MT=14,D_MB=34,D_LO=-2,D_HI=8;
const dX=x=>D_ML+x*(D_W-D_ML-D_MR);
const dY=y=>D_MT+(D_HI-y)/(D_HI-D_LO)*(D_H-D_MT-D_MB);
const dYinv=py=>D_HI-(py-D_MT)/(D_H-D_MT-D_MB)*(D_HI-D_LO);
function drawDrag(){
  const svg=document.getElementById('dragsvg'); if(!svg) return;
  const ts=LT.slice(); ts[DRAG_I]=DRAG_T;
  const w=fitLine(ts), w0=fitLine(LT);
  let g='';
  for(let v=-2;v<=8.001;v+=2){ const py=dY(v);
    g+='<line class="gridline" x1="'+D_ML+'" y1="'+py+'" x2="'+(D_W-D_MR)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(D_ML-9)+'" y="'+(py+4)+'" text-anchor="end">'+v+'</text>'; }
  for(let v=0;v<=1.001;v+=0.25){ const px=dX(v);
    g+='<line class="gridline" x1="'+px+'" y1="'+D_MT+'" x2="'+px+'" y2="'+(D_H-D_MB)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(D_H-D_MB+18)+'" text-anchor="middle">'+v.toFixed(2)+'</text>'; }
  g+='<line class="axis" x1="'+D_ML+'" y1="'+(D_H-D_MB)+'" x2="'+(D_W-D_MR)+'" y2="'+(D_H-D_MB)+'"/>'
   + '<line class="axis" x1="'+D_ML+'" y1="'+D_MT+'" x2="'+D_ML+'" y2="'+(D_H-D_MB)+'"/>';
  /* original fit, for reference */
  g+='<line x1="'+dX(0)+'" y1="'+dY(w0[0])+'" x2="'+dX(1)+'" y2="'+dY(w0[0]+w0[1])+'"'
   + ' stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="5 4"/>';
  /* residual stems */
  LX.forEach((x,i)=>{ const t=ts[i], yhat=w[0]+w[1]*x;
    g+='<line x1="'+dX(x)+'" y1="'+dY(t)+'" x2="'+dX(x)+'" y2="'+dY(yhat)+'"'
     + ' stroke="var(--accent2)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"/>'; });
  g+='<line x1="'+dX(0)+'" y1="'+dY(w[0])+'" x2="'+dX(1)+'" y2="'+dY(w[0]+w[1])+'" class="fitfn"/>';
  LX.forEach((x,i)=>{ if(i===DRAG_I) return;
    g+='<circle class="datapt" cx="'+dX(x)+'" cy="'+dY(ts[i])+'" r="5"/>'; });
  g+='<circle cx="'+dX(LX[DRAG_I])+'" cy="'+dY(DRAG_T)+'" r="10" fill="var(--accent)" opacity=".18"/>'
   + '<circle cx="'+dX(LX[DRAG_I])+'" cy="'+dY(DRAG_T)+'" r="6.5" fill="var(--accent)" style="cursor:grab"/>';
  g+='<g transform="translate('+(D_W-160)+','+(D_MT+6)+')">'
   + '<line x1="0" y1="0" x2="24" y2="0" class="fitfn"/><text class="legend" x="31" y="4">current fit</text>'
   + '<line x1="0" y1="18" x2="24" y2="18" stroke="var(--ink-soft)" stroke-width="1.8" stroke-dasharray="5 4"/>'
   + '<text class="legend" x="31" y="22">original fit</text></g>';
  svg.innerHTML=g;
  /* readouts */
  const yhat=w[0]+w[1]*LX[DRAG_I], r=DRAG_T-yhat;
  const sq=LX.map((x,i)=>Math.pow(ts[i]-(w[0]+w[1]*x),2));
  const share=sq[DRAG_I]/sq.reduce((a,b)=>a+b,0);
  document.getElementById('dres').textContent=r.toFixed(2);
  document.getElementById('dshare').textContent=(share*100).toFixed(0)+'%';
  const wn=document.getElementById('dwarn');
  if(share>0.75) wn.textContent='One point is now contributing most of the total loss — and the line has bent to appease it.';
  else if(share>0.45) wn.textContent='This single point already accounts for nearly half the loss.';
  else if(Math.abs(DRAG_T-LT[DRAG_I])<0.3) wn.textContent='Move it. Squared error means a miss twice as large costs four times as much.';
  else wn.textContent='';
}
(function(){
  const svg=document.getElementById('dragsvg');
  if(!svg) return;
  const upd=e=>{ const b=svg.getBoundingClientRect();
    const py=(e.clientY-b.top)/b.height*D_H;
    DRAG_T=Math.max(D_LO+0.2,Math.min(D_HI-0.2,dYinv(py))); drawDrag(); };
  svg.addEventListener('pointerdown',e=>{ const b=svg.getBoundingClientRect();
    const px=(e.clientX-b.left)/b.width*D_W, py=(e.clientY-b.top)/b.height*D_H;
    if(Math.hypot(px-dX(LX[DRAG_I]),py-dY(DRAG_T))<40){ dragging=true; svg.setPointerCapture(e.pointerId); upd(e); } });
  svg.addEventListener('pointermove',e=>{ if(dragging) upd(e); });
  ['pointerup','pointercancel'].forEach(t=>svg.addEventListener(t,()=>{dragging=false;}));
  document.addEventListener('click',e=>{ if(e.target&&e.target.id==='dreset'){ DRAG_T=LT[DRAG_I]; drawDrag(); } });
})();

/* ============================================================
   DEMO 7 — "which line is best?"  Notion before notation: students judge by eye,
   then we put a number on the judgement and discover it is the loss.
   ============================================================ */
const CAND = {A:[1.25,1.95], B:[-0.15,3.95], C:null};   /* C is filled with the least-squares fit */
let PICK='A', PICK_SHOW=false;
function sse(w){ return LX.reduce((a,x,i)=>a+Math.pow(w[0]+w[1]*x-LT[i],2),0); }
function drawPick(){
  const svg=document.getElementById('picksvg'); if(!svg) return;
  if(!CAND.C){ const n=LX.length, Sx=LX.reduce((a,b)=>a+b,0), Sxx=LX.reduce((a,b)=>a+b*b,0),
    St=LT.reduce((a,b)=>a+b,0), Sxt=LX.reduce((a,x,i)=>a+x*LT[i],0);
    CAND.C=solve([[n,Sx],[Sx,Sxx]],[St,Sxt]); }
  document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('sel',b.dataset.p===PICK));
  const W=560,H=320,A=axes(W,H,0,1,0,4,0.25,1);
  let g=A.s;
  /* each candidate keeps its own colour so it stays identifiable in "all three" */
  const COLS={A:'var(--accent2)',B:'var(--accent-soft)',C:'var(--accent)'};
  const show=k=>{
    const w=CAND[k], on=(PICK===k), c=COLS[k];
    if(PICK_SHOW&&on) LX.forEach((x,i)=>{
      g+='<line x1="'+A.X(x)+'" y1="'+A.Y(LT[i])+'" x2="'+A.X(x)+'" y2="'+A.Y(w[0]+w[1]*x)+'"'
       + ' stroke="'+c+'" stroke-width="1.8" stroke-dasharray="3 3"/>'; });
    g+='<line x1="'+A.X(0)+'" y1="'+A.Y(w[0])+'" x2="'+A.X(1)+'" y2="'+A.Y(w[0]+w[1])+'"'
     + ' stroke="'+c+'" stroke-width="'+(on?3.2:2)+'" opacity="'+(on?1:0.5)+'"'
     + (on?'':' stroke-dasharray="6 4"')+'/>'
     + '<text class="legend" x="'+(A.X(1)+5)+'" y="'+(A.Y(w[0]+w[1])+4)+'"'
     + ' style="fill:'+c+';font-weight:700;opacity:'+(on?1:0.65)+'">'+k+'</text>';
  };
  ['A','B','C'].forEach(k=>{ if(PICK==='all'||PICK!==k) show(k); });
  if(PICK!=='all') show(PICK);
  LX.forEach((x,i)=>g+='<circle class="datapt" cx="'+A.X(x)+'" cy="'+A.Y(LT[i])+'" r="5"/>');
  svg.innerHTML=g;
  const out=document.getElementById('pickout'), wn=document.getElementById('pickwarn');
  if(PICK_SHOW && PICK!=='all'){
    out.style.display='flex';
    document.getElementById('picksse').textContent=sse(CAND[PICK]).toFixed(2);
    const best=['A','B','C'].map(k=>sse(CAND[k])), me=sse(CAND[PICK]);
    wn.textContent = (me<=Math.min.apply(null,best)+1e-9)
      ? 'This is the smallest total. No other line beats it — and that is what "best" meant all along.'
      : 'Compare with the others. Smaller total = closer to every point at once.';
  } else if(PICK_SHOW){ out.style.display='none';
    wn.textContent='Pick a single line to total up its errors.';
  } else { out.style.display='none'; wn.textContent=''; }
}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('[data-p]');
  if(b){ PICK=b.dataset.p; drawPick(); return; }
  if(e.target&&e.target.id==='pickshow'){ PICK_SHOW=!PICK_SHOW;
    e.target.textContent=PICK_SHOW?'hide the errors':'show the errors'; drawPick(); }
});

/* ============================================================
   DEMO 8 — the symptom behind overfitting: the weights explode.
   Motivates ridge before any algebra appears.
   ============================================================ */
function drawWig(){
  const svg=document.getElementById('wigsvg'); if(!svg) return;
  const o=+document.getElementById('wigo').value;
  document.getElementById('wigov').textContent=o;
  const w=fitPoly(o,0);
  const mx=Math.max.apply(null,w.map(Math.abs));
  const nrm=Math.sqrt(w.reduce((a,v)=>a+v*v,0));
  /* sup() already renders unicode superscripts — reuse it rather than a bare 'e+' */
  const fmt=v=>Math.abs(v)>=1000?sup(v):v.toFixed(1);
  document.getElementById('wigmax').textContent=fmt(mx);
  document.getElementById('wignorm').textContent=fmt(nrm);
  const wn=document.getElementById('wigwarn');
  if(mx>1e4) wn.textContent='The coefficients are in the tens of thousands, with alternating signs — they cancel to thread every point.';
  else if(mx>100) wn.textContent='Coefficients are growing fast, and flipping sign from one term to the next.';
  else wn.textContent='Still a tame set of weights.';
  /* left: the curve; right: |w_i| on a log scale */
  const W=560,H=320,mid=330;
  const A=axes(mid,H,0,1,-3,3,0.5,1);
  let g=A.s, d='';
  for(let x=0;x<=1.0001;x+=0.005) d+=(d?'L':'M')+A.X(x)+','+A.Y(hFn(x))+' ';
  g+='<path class="truefn" d="'+d+'"/>';
  let f='',pen=true;
  for(let x=0;x<=1.0001;x+=0.003){ const y=evalPoly(w,x);
    if(y>3.2||y<-3.2){pen=true;continue;} f+=(pen?'M':'L')+A.X(x)+','+A.Y(y)+' ';pen=false; }
  g+='<path class="fitfn" d="'+f+'"/>';
  XS.forEach((x,i)=>g+='<circle class="datapt" cx="'+A.X(x)+'" cy="'+A.Y(TS[i])+'" r="4"/>');
  /* Symmetric-log bars about a zero line: sign is shown by direction, magnitude by
     a log scale in each direction, so alternating signs are visible directly. */
  const bl=mid+52, bw=W-bl-12, bt=22, bh=H-22-46;
  const symlog=v=>Math.sign(v)*Math.log10(1+Math.abs(v));
  const top=Math.max(1, Math.ceil(Math.log10(1+mx)));
  const zero=bt+bh/2, half=bh/2;
  const by=v=>zero-symlog(v)/top*half;
  const decades=[]; for(let e=0;e<=top;e+=Math.max(1,Math.round(top/3))) decades.push(e);
  decades.forEach(e=>{ const val=Math.pow(10,e);
    [1,-1].forEach(sgn=>{ if(e===0&&sgn<0) return; const y=by(sgn*val);
      g+='<line class="gridline" x1="'+bl+'" y1="'+y+'" x2="'+(bl+bw)+'" y2="'+y+'"/>'
       + '<text class="tick" x="'+(bl-6)+'" y="'+(y+4)+'" text-anchor="end">'
       + (sgn<0?'&#8722;':'')+'10<tspan baseline-shift="super" font-size="8">'+e+'</tspan></text>'; }); });
  const cw=bw/w.length;
  w.forEach((v,i)=>{ const y=by(v), h0=Math.abs(y-zero);
    g+='<rect x="'+(bl+i*cw+2)+'" y="'+Math.min(y,zero)+'" width="'+(cw-4)+'" height="'+Math.max(h0,1)+'"'
     + ' fill="'+(v<0?'var(--accent2)':'var(--accent)')+'" opacity=".85"/>'; });
  g+='<line x1="'+bl+'" y1="'+zero+'" x2="'+(bl+bw)+'" y2="'+zero+'" stroke="var(--ink)" stroke-width="1.6"/>'
   + '<text class="tick" x="'+(bl-6)+'" y="'+(zero+4)+'" text-anchor="end">0</text>'
   + '<text class="tick" x="'+(bl+bw/2)+'" y="'+(bt+bh+26)+'" text-anchor="middle">w&#7522; by coefficient (signed, log scale)</text>';
  svg.innerHTML=g;
}
document.getElementById('wigo')?.addEventListener('input',drawWig);


/* ============================================================
   DEMO 10 — the hiring test.  The optimiser's curse made concrete before it is made
   algebraic: every score is ability + luck, we keep the maximum, and the winner is
   systematically the luckiest rather than the best. Raising "candidates" is the
   same knob as raising model capacity — more draws, more chances to get lucky.
   ============================================================ */
const H_W=560,H_H=330,H_ML=46,H_MR=14,H_MT=18,H_MB=44;
/* 20..90 fits the widest swing the luck slider can produce (sd 3 -> +/-12.6 on
   abilities spanning 33..77) while still filling the plot at the default sd of 1. */
const H_LO=20,H_HI=90;
let HIRE_N=12, HIRE_SD=1.0, HIRE_SEED=1, HIRE_T=0, HIRE_ANIM=null;
const hX=(i,n)=>H_ML+(i+0.5)*(H_W-H_ML-H_MR)/n;
const hY=v=>H_MT+(H_H-H_MT-H_MB)*(H_HI-v)/(H_HI-H_LO);
function lcg(seed){ let x=seed>>>0; return function(){ x=(x*1664525+1013904223)>>>0; return (x>>>8)/16777216; }; }
function gauss(r){ let u=0,v=0; while(u===0)u=r(); while(v===0)v=r();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
/* One fixed pool of candidates, sliced to n. Two reasons: the truth must not move
   when you re-run the test (only the luck may), and raising "candidates" must mean
   ADDING people to the same pool — otherwise the comparison across n is between two
   different cohorts and the trend reads as noise. */
/* Seed chosen so that BOTH long-run numbers move monotonically as candidates are added
   — % correct down, flattery up. With an arbitrary pool they wobble, because whether the
   top two are close is an accident of the draw, and a wobbling demo teaches the wrong
   lesson while you are standing in front of it. */
const H_POOL=(function(){ const r=lcg(20260009), a=[]; for(let i=0;i<40;i++) a.push(55+11*gauss(r)); return a; })();
function hAbility(n){ return H_POOL.slice(0,n); }
function hLuck(n,sd,seed){ const r=lcg(seed), e=[]; for(let i=0;i<n;i++) e.push(sd*4.2*gauss(r)); return e; }
const argmax=a=>a.reduce((b,v,i)=>v>a[b]?i:b,0);

function drawHire(){
  const svg=document.getElementById('hiresvg'); if(!svg) return;
  const n=HIRE_N, A=hAbility(n), E=hLuck(n,HIRE_SD,HIRE_SEED);
  const S=A.map((a,i)=>a+E[i]);
  const best=argmax(A), hired=argmax(S);
  let g='';
  for(let v=30;v<=90;v+=15){ const py=hY(v);
    g+='<line class="gridline" x1="'+H_ML+'" y1="'+py+'" x2="'+(H_W-H_MR)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(H_ML-9)+'" y="'+(py+4)+'" text-anchor="end">'+v+'</text>'; }
  g+='<line class="axis" x1="'+H_ML+'" y1="'+(H_H-H_MB)+'" x2="'+(H_W-H_MR)+'" y2="'+(H_H-H_MB)+'"/>'
   + '<line class="axis" x1="'+H_ML+'" y1="'+H_MT+'" x2="'+H_ML+'" y2="'+(H_H-H_MB)+'"/>';
  const r=n>26?3.4:(n>16?4.4:5.6);
  for(let i=0;i<n;i++){
    const x=hX(i,n), ya=hY(A[i]), ys=hY(A[i]+E[i]*HIRE_T);
    /* true ability: a tick you never actually observe */
    g+='<line x1="'+(x-7)+'" y1="'+ya+'" x2="'+(x+7)+'" y2="'+ya+'" stroke="var(--ink-soft)" stroke-width="2" opacity=".55"/>';
    if(HIRE_T>0.02)
      g+='<line x1="'+x+'" y1="'+ya+'" x2="'+x+'" y2="'+ys+'" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>';
    const isH=(i===hired&&HIRE_T>0.98), isB=(i===best);
    if(isH) g+='<circle cx="'+x+'" cy="'+ys+'" r="'+(r+6)+'" fill="var(--accent)" opacity=".16"/>';
    g+='<circle cx="'+x+'" cy="'+ys+'" r="'+r+'" fill="'+(isH?'var(--accent)':'var(--ink)')+'"'
     + (isB?' stroke="var(--accent2)" stroke-width="2.4"':'')+'/>';
  }
  /* who is who */
  g+='<g transform="translate('+(H_ML+6)+','+(H_H-H_MB+20)+')">'
   + '<circle cx="6" cy="-4" r="5" fill="var(--ink)" stroke="var(--accent2)" stroke-width="2.4"/>'
   + '<text class="legend" x="17" y="0">truly best</text>'
   + '<circle cx="112" cy="-4" r="5" fill="var(--accent)"/>'
   + '<text class="legend" x="123" y="0">hired</text>'
   + '<line x1="196" y1="-4" x2="210" y2="-4" stroke="var(--ink-soft)" stroke-width="2" opacity=".55"/>'
   + '<text class="legend" x="217" y="0">true ability (never observed)</text></g>';
  svg.innerHTML=g;

  const hit=document.getElementById('hirehit'), gap=document.getElementById('hiregap'),
        wn=document.getElementById('hirewarn');
  if(HIRE_T<0.98){ hit.textContent='—'; gap.textContent='—'; return; }
  hit.textContent = hired===best ? 'yes' : 'no';
  hit.style.color = hired===best ? 'var(--accent2)' : 'var(--accent)';
  gap.textContent = (S[hired]-A[hired]>=0?'+':'') + (S[hired]-A[hired]).toFixed(1);
  /* the long run: how often the top scorer is actually the best, and by how much
     the winning score flatters them */
  let win=0, over=0, R=400;
  for(let k=0;k<R;k++){ const e=hLuck(n,HIRE_SD,1000+k*7919), sc=A.map((a,i)=>a+e[i]);
    const h=argmax(sc); if(h===best) win++; over+=sc[h]-A[h]; }
  const pct=Math.round(100*win/R), avg=(over/R).toFixed(1);
  if(HIRE_SD===0) wn.innerHTML='With no luck in the score, the test is perfect — the top scorer <em>is</em> the best. Add some.';
  else wn.innerHTML='Over 400 runs the top scorer is genuinely the best <strong>'+pct+'%</strong> of the time, '
    + 'and their score flatters them by <strong>+'+avg+'</strong> on average. '
    + (pct<50?'Push the number of candidates up and watch it get worse.':'');
}
function hireRun(){
  HIRE_SEED=(HIRE_SEED*1103515245+12345)>>>0;
  const t0=performance.now(), DUR=620;
  if(HIRE_ANIM) cancelAnimationFrame(HIRE_ANIM);
  const step=()=>{ const e=Math.min(1,(performance.now()-t0)/DUR);
    HIRE_T=1-Math.pow(1-e,3);
    drawHire();
    HIRE_ANIM = e<1 ? requestAnimationFrame(step) : null; };
  HIRE_ANIM=requestAnimationFrame(step);
}
document.addEventListener('click',e=>{ if(!e.target) return;
  if(e.target.id==='hirego') hireRun();
  if(e.target.id==='hirereset'){ if(HIRE_ANIM) cancelAnimationFrame(HIRE_ANIM); HIRE_ANIM=null;
    HIRE_T=0; drawHire();
    document.getElementById('hirewarn').textContent='Nobody has taken the test yet. Grey ticks are true ability — which you never get to see.'; }
});
(function(){
  const nEl=document.getElementById('hiren'), sdEl=document.getElementById('hiresd');
  if(!nEl) return;
  nEl.addEventListener('input',()=>{ HIRE_N=+nEl.value;
    document.getElementById('hirenv').textContent=HIRE_N; drawHire(); });
  sdEl.addEventListener('input',()=>{ HIRE_SD=+sdEl.value;
    document.getElementById('hiresdv').textContent=HIRE_SD.toFixed(1); drawHire(); });
})();

const DRAW={hire:drawHire,fit:drawFit,bowl:drawBowl,lin:drawLin,poly:drawPoly,err:drawErr,basis:drawBasis,drag:drawDrag,pick:drawPick,wig:drawWig};
['ord','lam'].forEach(id=>document.getElementById(id)?.addEventListener('input',drawFit));
document.getElementById('blam')?.addEventListener('input',drawBowl);
/* Click-to-advance, but never from a control. We remember where the pointer went DOWN:
   dragging a slider and releasing over the slide would otherwise fire a click on the
   slide and skip a page. */
const CONTROLS='input,button,a,select,textarea,label,.demo,.demo-ctrl,.bbtn,.basisbtns,video,iframe,svg';
let downInControl=false;
canvas.addEventListener('pointerdown',e=>{ downInControl=!!(e.target.closest&&e.target.closest(CONTROLS)); });
canvas.addEventListener('click',e=>{
  if(document.body.classList.contains('inking')) return;
  if(downInControl){ downInControl=false; return; }
  if(e.target.closest&&e.target.closest(CONTROLS)) return;
  next(); });

/* ============================================================
   ANNOTATION LAYER
   Draw over the slide with a mouse, trackpad or pen tablet. Pen pressure is
   used for stroke width when the device reports it. Ink is kept per slide.
   D toggles · C clears the current slide · strokes survive navigation.
   ============================================================ */
const ink=document.getElementById('ink'), ictx=ink.getContext('2d');
let inkColor='#9B2C2C', inkWidth=2.2, drawing=false, inkStore={};
function sizeInk(){
  const r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  const keep=ink.width?ictx.getImageData(0,0,ink.width,ink.height):null;
  ink.width=w*r; ink.height=h*r; ink.style.width=w+'px'; ink.style.height=h+'px';
  ictx.setTransform(r,0,0,r,0,0); ictx.lineCap='round'; ictx.lineJoin='round';
  if(keep) try{ictx.putImageData(keep,0,0);}catch(_){}
}
addEventListener('resize',sizeInk); sizeInk();
function toggleInk(){
  document.body.classList.toggle('inking');
  document.querySelectorAll('.ib-sw').forEach(sw=>sw.classList.toggle('sel',sw.dataset.c===inkColor));
}
function clearInk(){ ictx.clearRect(0,0,ink.width,ink.height); delete inkStore[idx]; }
function saveInk(){ try{ inkStore[idx]=ink.toDataURL(); }catch(_){} }
function loadInk(i){
  ictx.clearRect(0,0,ink.width,ink.height);
  const d=inkStore[i]; if(!d) return;
  const im=new Image(); im.onload=()=>ictx.drawImage(im,0,0,ink.width/(devicePixelRatio||1),ink.height/(devicePixelRatio||1)); im.src=d;
}
ink.addEventListener('pointerdown',e=>{ drawing=true; ink.setPointerCapture(e.pointerId);
  ictx.strokeStyle=inkColor; ictx.beginPath(); ictx.moveTo(e.clientX,e.clientY); });
ink.addEventListener('pointermove',e=>{ if(!drawing) return;
  /* pen pressure scales the chosen nib; a mouse just uses the nib width */
  ictx.lineWidth = (e.pressure>0 && e.pressure<1) ? inkWidth*(0.45+1.3*e.pressure) : inkWidth;
  ictx.lineTo(e.clientX,e.clientY); ictx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>ink.addEventListener(t,()=>{ if(drawing){drawing=false; saveInk();} }));
document.querySelectorAll('.ib-sw').forEach(sw=>sw.onclick=()=>{ inkColor=sw.dataset.c;
  document.querySelectorAll('.ib-sw').forEach(o=>o.classList.toggle('sel',o===sw)); });
document.querySelectorAll('.ib-sz').forEach(b=>b.onclick=()=>{ inkWidth=+b.dataset.w;
  document.querySelectorAll('.ib-sz').forEach(o=>o.classList.toggle('sel',o===b)); });
document.getElementById('ib-clear').onclick=clearInk;
document.getElementById('ib-off').onclick=toggleInk;

/* A centred paragraph should span its container. The global p{max-width:62ch} keeps
   body copy readable, but on a centred line it leaves the text in a narrow box pinned
   to the left, which reads as mis-centred. Runs once over every slide paragraph. */
/* Scale each site preview so a 1440px-wide render fits the box exactly. */
function fitSiteFrames(){
  document.querySelectorAll('.siteframe').forEach(function(f){
    const ifr=f.querySelector('iframe'); if(!ifr) return;
    const w=f.clientWidth; if(!w) return;
    ifr.style.transform='scale('+(w/1440)+')';
  });
}
addEventListener('resize',fitSiteFrames);

function spreadCentredText(){
  document.querySelectorAll('.slide p, .slide .figcap, .slide .lede').forEach(function(p){
    /* max-width only: an auto inline margin would make a flex item shrink-wrap
       instead of stretching, which is the very problem we are fixing. */
    if(getComputedStyle(p).textAlign === 'center') p.style.maxWidth='none';
  });
}

/* ---- presenter clock ---- P starts/stops. Shows elapsed time and how far
   ahead or behind the planned cumulative time you are at this slide. ---- */
let t0=null, tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updClock(){
  if(t0===null) return;
  const el=(performance.now()-t0)/60000;               // minutes elapsed
  document.getElementById('cl-el').textContent=fmt(performance.now()-t0);
  const plan=cumMin(idx), d=el-plan;
  const dl=document.getElementById('cl-dl');
  dl.textContent=(d>=0?'+':'&#8722;').replace('&#8722;','-')+Math.abs(d).toFixed(1)+'m vs plan ('+plan.toFixed(0)+'m / '+EST_TOTAL.toFixed(0)+'m)';
  dl.className='dl '+(d>0.5?'behind':(d<-0.5?'ahead':''));
}
function toggleClock(){
  document.body.classList.toggle('timing');
  if(document.body.classList.contains('timing')){ t0=performance.now(); tick=setInterval(updClock,1000); updClock(); }
  else { clearInterval(tick); t0=null; }
}

setTheme('paper');
spreadCentredText();
renderTeX();
fitSiteFrames();
highlight();

/* ---- YouTube facade -------------------------------------------------------------
   `button` and `iframe` are already in CONTROLS, so neither the play button nor the player
   advances the slide on click.

   YouTube's player refuses an opaque origin: opened straight from Finder this page is
   file://, and the embed dies with "Error 153 - video player configuration error". There is
   no embed parameter that fixes it. So served over http(s) we play inline, and off the disk
   we hand off to youtube.com in a new tab. */
const CAN_EMBED = location.protocol === 'http:' || location.protocol === 'https:';
function closeYT(w){
  const f=w.querySelector('iframe'); if(f) f.remove();
  const b=w.querySelector('.ytfacade'); if(b) b.style.display='';
  w.classList.remove('live');
}
document.querySelectorAll('.ytwrap').forEach(w=>{
  const btn=w.querySelector('.ytfacade');
  if(!CAN_EMBED){
    const b=w.querySelector('.vidbadge'); if(b) b.textContent='Video \u2192 YouTube';
    btn.title='Opens on YouTube \u2014 inline playback needs the deck served over http, not opened from disk';
  }
  btn.addEventListener('click',()=>{
    if(!CAN_EMBED){ window.open('https://www.youtube.com/watch?v='+w.dataset.yt,'_blank','noopener'); return; }
    if(w.classList.contains('live')) return;
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+w.dataset.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title=w.dataset.title||'Video';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    btn.style.display='none';
    w.appendChild(f);
    w.classList.add('live');
  });
});

paint();
</script>
