{s:"Part III", t:"Deriving the gradient", html:`
  <div class="eyebrow">Step 4 &#8212; differentiate</div>
  <h2 style="margin-bottom:14px">Deriving the gradient</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,270px);gap:8px 14px">
    <div style="font-size:19px">the model</div><div class="eq" style="margin:0;font-size:19px"><span class="tex" data-tex="y_n = \\sigma(\\mathbf{w}^\\top\\mathbf{x}_n)"></span></div>
    <div class="dnote">the score, squashed</div>
    <div style="font-size:19px">the loss</div><div class="eq" style="margin:0;font-size:19px"><span class="tex" data-tex="\\mathcal{L} = -\\sum_n \\bigl[t_n\\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr]"></span></div>
    <div class="dnote">what we are differentiating</div>
    <div class="frag" data-f="0" style="font-size:19px">one fact</div><div class="eq frag" data-f="0" style="margin:0;font-size:19px"><span class="tex" data-tex="\\sigma'(a) = \\sigma(a)\\bigl(1-\\sigma(a)\\bigr)"></span></div>
    <div class="dnote frag" data-f="0">the sigmoid&#8217;s derivative &#8212; two lines to verify at home</div>
    <div class="frag" data-f="1" style="font-size:19px">so</div><div class="eq frag" data-f="1" style="margin:0;font-size:19px"><span class="tex" data-tex="\\nabla_{\\mathbf{w}} \\ln y_n = (1-y_n)\\,\\mathbf{x}_n"></span></div>
    <div class="dnote frag" data-f="1">chain rule; the <span class="tex" data-tex="y_n"></span> in <span class="tex" data-tex="y_n'/y_n"></span> cancels</div>
    <div class="frag" data-f="2" style="font-size:19px">and</div><div class="eq frag" data-f="2" style="margin:0;font-size:19px"><span class="tex" data-tex="\\nabla_{\\mathbf{w}} \\ln (1-y_n) = -\\,y_n\\,\\mathbf{x}_n"></span></div>
    <div class="dnote frag" data-f="2">same steps, opposite sign</div>
    <div class="frag" data-f="3" style="font-size:19px">assemble</div><div class="eq frag" data-f="3" style="margin:0;font-size:19px"><span class="tex" data-tex="\\nabla_{\\mathbf{w}}\\mathcal{L} = -\\sum_n \\bigl[t_n(1-y_n) - (1-t_n)\\,y_n\\bigr]\\mathbf{x}_n"></span></div>
    <div class="dnote frag" data-f="3">the <span class="tex" data-tex="t_n y_n"></span> terms cancel</div>
  </div>
  <div class="card accent frag" data-f="4" style="margin-top:12px;padding:12px 20px">
    <div class="eq" style="margin:0;font-size:24px"><span class="texd" data-tex="\\nabla_{\\mathbf{w}}\\,\\mathcal{L} = \\sum_{n=1}^{N} \\bigl(y_n - t_n\\bigr)\\,\\mathbf{x}_n"></span></div>
    <p class="caption" style="margin-top:6px;text-align:center">All the sigmoid&#8217;s curvature
    collapses out of the gradient &#8212; what the sigmoid&#8211;cross-entropy pairing buys.</p>
  </div>`},

{s:"Part III", t:"No closed form", html:`
  <div class="eyebrow">Now set it to zero</div>
  <h2 style="margin-bottom:14px">The step that worked twice does not work here</h2>
  <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:10px 16px">
    <div style="font-size:19.5px">last week</div><div class="eq" style="margin:0;font-size:19px"><span class="texd" data-tex="\\boldsymbol{\\Phi}^\\top(\\boldsymbol{\\Phi}\\mathbf{w} - \\mathbf{t}) = 0 \\;\\Rightarrow\\; \\mathbf{w} = (\\boldsymbol{\\Phi}^\\top\\boldsymbol{\\Phi})^{-1}\\boldsymbol{\\Phi}^\\top\\mathbf{t}"></span></div>
    <div class="frag" data-f="0" style="font-size:19.5px">this week</div><div class="eq frag" data-f="0" style="margin:0;font-size:19px"><span class="texd" data-tex="\\sum_{n=1}^{N} \\Bigl(\\frac{1}{1 + e^{-\\mathbf{w}^\\top\\mathbf{x}_n}} - t_n\\Bigr)\\,\\mathbf{x}_n = 0"></span></div>
  </div>
  <div class="row top frag" data-f="1" style="gap:26px;margin-top:14px">
    <div class="col">
      <p style="font-size:20px">Last week <span class="tex" data-tex="\\mathbf{w}"></span> appeared <strong>linearly</strong>, so the terms
      collected and one rearrangement solved it.</p>
    </div>
    <div class="col">
      <p style="font-size:20px">Here <span class="tex" data-tex="\\mathbf{w}"></span> sits <strong>inside the exponential, inside the fraction,
      inside every term</strong> of the sum &#8212; and each term has a different <span class="tex" data-tex="\\mathbf{x}_n"></span>. No sequence of
      algebraic moves brings <span class="tex" data-tex="\\mathbf{w}"></span> out to one side.</p>
    </div>
  </div>
  <p class="caption frag" data-f="2" style="margin-top:14px">The good news is on the next slide:
  that gradient has a shape you have seen before.</p>`},

{s:"Part III", t:"The same gradient", html:`
  <div class="eyebrow">Worth pausing on</div>
  <h2 style="margin-bottom:14px">The same gradient as linear regression</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Linear regression</div>
      <div class="eq" style="margin:4px 0 0;font-size:21px"><span class="texd" data-tex="\\sum_n (y_n - t_n)\\,\\mathbf{x}_n"></span></div>
      <p class="caption" style="margin-top:10px">with <span class="tex" data-tex="y_n = \\mathbf{w}^\\top\\mathbf{x}_n"></span> &#8212; derived in Lecture 1</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Logistic regression</div>
      <div class="eq" style="margin:4px 0 0;font-size:21px"><span class="texd" data-tex="\\sum_n (y_n - t_n)\\,\\mathbf{x}_n"></span></div>
      <p class="caption" style="margin-top:10px">with <span class="tex" data-tex="y_n = \\sigma(\\mathbf{w}^\\top\\mathbf{x}_n)"></span></p>
    </div>
  </div>
  <div class="card frag" data-f="0" style="margin-top:18px;padding:14px 22px">
    <p style="font-size:21px;max-width:none"><strong>(prediction &#8722; target) &#215; input</strong>,
    summed over the data. Identical. The two models differ only in how the prediction is formed.</p>
  </div>
  <div class="frag" data-f="1" style="margin-top:12px">
    <div class="dgrid" style="grid-template-columns:max-content max-content max-content;justify-content:start;gap:6px 26px;font-size:18px">
      <div class="dnote" style="padding-left:0">target distribution</div><div class="dnote" style="padding-left:0">its matched squashing</div><div class="dnote" style="padding-left:0">gradient</div>
      <div>Gaussian</div><div>none (identity)</div><div class="eq" style="margin:0;font-size:19px"><span class="tex" data-tex="\\textstyle\\sum_n (y_n-t_n)\\mathbf{x}_n"></span></div>
      <div>Bernoulli</div><div>sigmoid</div><div class="eq" style="margin:0;font-size:19px"><span class="tex" data-tex="\\textstyle\\sum_n (y_n-t_n)\\mathbf{x}_n"></span></div>
      <div>Categorical</div><div>softmax</div><div class="eq" style="margin:0;font-size:19px"><span class="tex" data-tex="\\textstyle\\sum_n (\\mathbf{y}_n-\\mathbf{t}_n)\\mathbf{x}_n^\\top"></span></div>
    </div>
    <p class="caption" style="margin-top:8px">Why: each distribution has a <em>matched</em> squashing
    for which the messy derivative of the squashing exactly cancels against the loss &#8212; we saw
    the cancellation happen two slides ago. Pair them differently and the tidy form is lost. The
    third row is checked in Part IV; Week 8&#8217;s networks use these same pairings at their output
    layer.</p>
  </div>`},

{s:"Part III", t:"The perceptron", draw:"xor", html:`
  <div class="eyebrow">1958 &#183; the same update, before the probability</div>
  <h2 style="margin-bottom:14px">This update is older than it looks</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.1">
      <p style="font-size:20px">Rosenblatt&#8217;s <strong>perceptron</strong> used the hard step
      <span class="tex" data-tex="y = \\mathbb{1}[\\mathbf{w}^\\top\\mathbf{x} > 0]"></span> in place of the sigmoid, and updated with</p>
      <div class="eq" style="margin:10px 0;font-size:22px"><span class="texd" data-tex="\\mathbf{w} \\leftarrow \\mathbf{w} + \\eta\\,(t_n - y_n)\\,\\mathbf{x}_n"></span></div>
      <p style="font-size:20px">&#8212; error times feature, the expression we just derived, with
      <span class="tex" data-tex="y_n"></span> hardened to 0 or 1. Misclassified points move the boundary; correct ones leave it
      alone.</p>
      <p class="caption" style="margin-top:10px">Many texts, PRML among them, write the same rule
      with <span class="tex" data-tex="\\mathrm{sign}(\\mathbf{w}^\\top\\mathbf{x})"></span> and targets in <span class="tex" data-tex="\\{-1,+1\\}"></span>, updating by <span class="tex" data-tex="\\mathbf{w} \\leftarrow \\mathbf{w} + \\eta\\, t_n \\mathbf{x}_n"></span> on the mistakes. Same algorithm, the other label
      convention &#8212; the one flagged at the start of the lecture.</p>
    </div>
    <div class="col">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">What was proved</div>
        <p class="frag" data-f="0" style="font-size:19px;max-width:none">On linearly separable
        data the loop <strong>stops after finitely many updates</strong> with a separating line
        (Novikoff, 1962).</p>
      </div>
      <div class="row top frag" data-f="1" style="gap:14px;margin-top:12px">
        <div class="col card accent" style="flex:1.2">
          <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">What could not be fixed</div>
          <p style="font-size:19px;max-width:none">A single line cannot represent <strong>XOR</strong>
          (Minsky &amp; Papert, 1969) &#8212; the four points on the right. The answer &#8212;
          <strong>stack these units</strong> &#8212; is where the neural-network weeks begin.</p>
        </div>
        <div class="col"><div class="fig h-190"><svg viewBox="0 0 300 250" id="xorsvg"></svg></div></div>
      </div>
    </div>
  </div>`},

{s:"Part III", t:"One step, by hand", draw:"gdm", html:`
  <div class="eyebrow">Live demo &#183; four cars, slowly</div>
  <h2 style="margin-bottom:10px">What one step actually does</h2>

{s:"Part III", t:"Gradient descent", draw:"gd", html:`
  <div class="eyebrow">Live demo &#183; now with all 46 cars</div>
  <h2 style="margin-bottom:10px">Walk downhill instead</h2>
  <div class="demo">

{s:"Part III", t:"Separable data", draw:"sep", html:`
  <div class="eyebrow">Why the demo&#8217;s loss never stopped falling</div>
  <h2 style="margin-bottom:10px">Perfect separation breaks maximum likelihood</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="sepsvg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">If a line separates the classes perfectly, growing
      <span class="tex" data-tex="\\lVert\\mathbf{w}\\rVert"></span> moves every <span class="tex" data-tex="y_n"></span> closer to its label &#8212; so every term of the loss
      <span class="tex" data-tex="-\\bigl[t_n\\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr]"></span> keeps falling, and the whole loss slides towards 0 <strong>without ever reaching a
      minimum</strong>:</p>
      <p class="caption frag" data-f="0" style="margin:8px 0 0">The data does not move: the picture
      on the left holds the feature fixed, so growing <span class="tex" data-tex="\\lVert\\mathbf{w}\\rVert"></span> steepens the curve towards a step. Measured
      in score units <span class="tex" data-tex="\\mathbf{w}^\\top\\mathbf{x}"></span> instead, the curve would be the one fixed sigmoid and the <em>points</em>
      would fly outward &#8212; the same fact, read on a different axis.</p>
      <svg id="seplsvg" viewBox="0 0 420 150" style="width:100%;display:block;margin:4px 0 0"></svg>
      <p class="caption" style="margin:0 0 6px">Computed from the ten points on the left; the dots
      mark the two curves drawn there.</p>
      <div class="card accent frag" data-f="1" style="margin-top:10px;padding:12px 16px;text-align:center">
        <p style="font-size:21px;max-width:none"><strong>How do we fix this?</strong></p>
      </div>
    </div>
  </div>`},

{s:"Part III", t:"The prior returns", draw:"sepfix", html:`
  <div class="eyebrow">The fix is one we already know</div>
  <h2 style="margin-bottom:10px">Bring back the prior &#8212; the gradient, with MAP</h2>
  <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:8px 20px;margin-bottom:12px">
    <div style="font-size:19px;align-self:center">the MAP loss, from Part II</div><div class="eq" style="margin:0;font-size:21px;text-align:left"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = -\\sum_n\\bigl[t_n\\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr] + \\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert^2"></span></div>
    <div class="frag" data-f="0" style="font-size:19px;align-self:center">differentiate</div><div class="eq frag" data-f="0" style="margin:0;font-size:21px;text-align:left"><span class="texd" data-tex="\\nabla_{\\mathbf{w}}\\mathcal{L} = \\sum_n (y_n - t_n)\\,\\mathbf{x}_n + \\alpha\\mathbf{w}"></span></div>
  </div>
  <div class="row top" style="gap:26px">
    <div class="col frag" data-f="1" style="flex:1">
      <p style="font-size:20px;max-width:none">The prior contributes <span class="tex" data-tex="\\alpha\\mathbf{w}"></span> &#8212; a pull back towards
      zero that <strong>grows with</strong> <span class="tex" data-tex="\\lVert\\mathbf{w}\\rVert"></span>.</p>
      <p style="font-size:20px;max-width:none;margin-top:10px">The likelihood&#8217;s urge to
      inflate the weights now meets a force that stiffens as they grow, and the two balance at a
      finite <span class="tex" data-tex="\\mathbf{w}"></span>.</p>
    </div>
    <div class="col frag" data-f="2" style="flex:1.15">
      <div class="fig"><svg id="sfxsvg" viewBox="0 0 560 250"></svg></div>
      <p class="caption" style="margin-top:6px">The same ten points as the last slide. On separated
      data the loss alone has no minimiser; the regularised loss does.</p>
    </div>
  </div>`},

{s:"Part III", t:"From maths to code", html:`
  <div class="eyebrow">The notebook &#183; logistic regression</div>
  <h2 style="margin-bottom:12px">The gradient, as code</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.3">
      <div class="nb">
        <div class="nb-bar"><span class="dot"></span>In&nbsp;[16]</div>
        <pre class="code">def learnLogisticRegModel(X, T, eta=0.1, lbd=0.01, maxitr=10000):
  w = np.random.random([X.shape[1]])
  for i in range(maxitr):
    gradL = np.zeros([X.shape[1]])
    for n in range(X.shape[0]):
      # the gradient we derived, term by term
      gradL += (logistic(np.dot(w, X[n,:])) - T[n]) * X[n,:]
    gradL += lbd*w
    w = w - (eta/X.shape[0])*gradL
  return w</pre>
      </div>
    </div>
    <div class="col">
      <p style="font-size:20px">One line does the work, and it is the gradient we derived
      read left to right.</p>
      <hr class="rule">
      <p style="font-size:20px"><code>lbd</code> is <span class="tex" data-tex="\\alpha"></span>, the prior term from the last slide. Set it to zero and you have
      plain maximum likelihood &#8212; and, on separated data, the runaway.</p>
      <p class="nblink" style="margin-top:14px">Full notebook on Colab &#8212;
      <strong>CS3264 Lecture 3: Linear Classification</strong>. Link on Piazza.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:14px;text-align:center">
    A fixed number of steps and a fixed step size. Week 9&#8217;s stochastic gradient descent asks
    how to choose both properly.</p>`},

{s:"Part III", t:"Nonlinear boundaries", draw:"lift", html:`

  </div>`},

{s:"Part III", t:"Two rungs climbed", html:`
  <div class="eyebrow">Where we are on the ladder</div>
  <h2 style="margin-bottom:16px">Two rungs climbed, one to go</h2>
  <div class="row top stretch" style="gap:20px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">MLE <span style="color:var(--s4)">&#10003;</span></div><p style="font-size:19.5px;max-width:none">Cross-entropy is its negative log; fitted by walking downhill &#8212; and on separated data it runs away.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">MAP <span style="color:var(--s4)">&#10003;</span></div><p style="font-size:19.5px;max-width:none">The prior adds <span class="tex" data-tex="\\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert^2"></span> to the loss and <span class="tex" data-tex="\\alpha\\mathbf{w}"></span> to the gradient &#8212; the regulariser, and the fix for the runaway.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Bayesian &#8212; next</div><p style="font-size:19.5px;max-width:none">Both rungs still hand back <strong>one</strong> <span class="tex" data-tex="\\mathbf{w}"></span>. Keeping the whole posterior is the third rung, and it starts now.</p></div>
  </div>`},

{s:"Part III", t:"The posterior, this time", html:`
  <div class="actbadge">Predict first</div>
  <div class="actq" style="font-size:24px;margin:12px 0 14px">Same move as last week: <span class="tex" data-tex="p(\\mathbf{w}\\mid\\mathcal{D}) \\propto p(\\mathcal{D}\\mid\\mathbf{w})\\,p(\\mathbf{w})"></span>, with the
  prior we have used all lecture, <span class="tex" data-tex="p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{0}, \\alpha^{-1}\\mathbf{I})"></span>. Last week both factors were Gaussian, and the posterior came
  out Gaussian &#8212; exactly. <strong>Does that happen here?</strong></div>
  <div class="row" style="gap:20px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">A</div><p style="font-size:20px;max-width:none">Yes &#8212; the prior is Gaussian, so the posterior is Gaussian too.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">B</div><p style="font-size:20px;max-width:none">No &#8212; the likelihood is a product of sigmoids, and the product has no standard form.</p></div>
  </div>`},

{s:"Part III", t:"The posterior, seen", draw:"bpost", html:`
  <div class="eyebrow">The answer is B</div>
  <h2 style="margin-bottom:12px">Not Gaussian &#8212; and here is the picture</h2>
  <div class="row top" style="gap:28px">
    <div class="col">
      <p style="font-size:19.5px">Multiply sigmoids into a Gaussian and the
      result is no standard distribution &#8212; and no other choice of prior does better. This is the
      first model in the course whose posterior has <strong>no closed form</strong>.</p>
      <p style="font-size:19.5px;margin-top:10px">Near the peak the rings look almost elliptical
      &#8212; but a Gaussian&#8217;s rings are ellipses <em>centred on its mean</em>, all the way out.
      Here the <span style="color:var(--accent)">peak</span> and the
      <span style="color:var(--s2)">mean</span> do not even coincide, and the outer rings reach
      further down-left than up-right.</p>
      <p class="caption" style="margin-top:10px">The true posterior for the four-car toy &#8212; two
      weights, so weight space fits on a slide. <span class="tex" data-tex="\\ln p(\\mathbf{w}\\mid\\mathcal{D})"></span> evaluated on a grid; each ring drops by a fixed
      amount from the peak.</p>
    </div>
    <div class="col" style="flex:1.1">
      <div class="fig"><svg id="bqsvg" viewBox="0 0 560 310"></svg></div>
    </div>
  </div>`},

{s:"Part III", t:"The Laplace approximation", draw:"blap", html:`
  <div class="eyebrow">PRML &#167;4.4</div>
  <h2 style="margin-bottom:12px">Approximate the posterior with a Gaussian</h2>
  <div class="row top" style="gap:26px">
    <div class="col" style="flex:1.25">
      <p style="font-size:19.5px">The exact posterior is out of reach, but near its peak it looked
      almost Gaussian. So look for a Gaussian stand-in,</p>
      <div class="eq" style="margin:8px 0;font-size:20px"><span class="texd" data-tex="q(\\mathbf{w}) = \\mathcal{N}(\\mathbf{w} \\mid \\mathbf{m},\\ \\mathbf{S})"></span></div>
      <p style="font-size:19.5px">with the centre <span class="tex" data-tex="\\mathbf{m}"></span> and the spread <span class="tex" data-tex="\\mathbf{S}"></span> ours to choose.</p>
      <div class="dgrid frag" data-f="1" style="grid-template-columns:max-content minmax(0,1fr);gap:12px 14px;margin-top:12px">
        <div style="font-size:19px">centre it at the peak</div><div class="eq" style="margin:0;font-size:18.5px"><span class="texd" data-tex="\\mathbf{m} = \\mathbf{w}_{\\mathrm{MAP}} = \\arg\\max_{\\mathbf{w}} \\ln p(\\mathbf{w}\\mid\\mathcal{D})"></span></div>
        <div class="frag" data-f="2" style="font-size:19px">match the curvature there</div><div class="eq frag" data-f="2" style="margin:0;font-size:18.5px"><span class="texd" data-tex="\\mathbf{S}^{-1} = \\alpha\\mathbf{I} + \\sum_{n} y_n(1-y_n)\\,\\mathbf{x}_n\\mathbf{x}_n^\\top"></span></div>
      </div>
      <p class="caption frag" data-f="2" style="margin-top:8px">The curvature matrix is the Hessian
      of <span class="tex" data-tex="-\\ln p(\\mathbf{w}\\mid\\mathcal{D})"></span> at the peak: the prior&#8217;s <span class="tex" data-tex="\\alpha\\mathbf{I}"></span>, plus one term per car weighted by how undecided the
      model is there.</p>
      <p class="frag" data-f="3" style="font-size:19px;margin-top:10px">This choice is the
      <strong>Laplace approximation</strong>: expand <span class="tex" data-tex="\\ln p(\\mathbf{w}\\mid\\mathcal{D})"></span> to second order around its peak, and
      exponentiate &#8212; a quadratic in the exponent <em>is</em> a Gaussian.</p>
    </div>
    <div class="col">
      <div class="fig frag" data-f="0"><svg id="blsvg" viewBox="0 0 560 310"></svg></div>
      <p class="caption frag" data-f="0" style="margin-top:6px">The true posterior again, with the
      fitted Gaussian&#8217;s 1&#963; and 2&#963; rings dashed.</p>
      <p class="caption frag" data-f="3" style="margin-top:8px"><strong>What is matched:</strong> the
      peak, and the curvature at the peak. <strong>Not</strong> the moments &#8212; the mean, as the
      last slide showed, sits elsewhere, and <span class="tex" data-tex="q"></span> ignores it. Good near the peak, blind to the
      asymmetry.</p>
    </div>
  </div>`},

{s:"Part III", t:"Where the curvature comes from", html:`
  <div class="eyebrow">The derivation &#8212; two short steps</div>
  <h2 style="margin-bottom:8px">Where <span class="tex" data-tex="\\mathbf{S}^{-1}"></span> comes from</h2>
  <div class="eyebrow" style="margin-bottom:6px">Step 1 &#183; a quadratic exponent is a Gaussian</div>
  <p style="font-size:19px;max-width:none;margin-bottom:2px"><strong>Taylor-expand</strong> <span class="tex" data-tex="\\ln p(\\mathbf{w}\\mid\\mathcal{D})"></span> to
  second order about the peak. The peak is a maximum, so the gradient there is zero and the linear
  term drops out:</p>
  <div class="eq" style="margin:0 0 6px;font-size:20px"><span class="texd" data-tex="\\ln p(\\mathbf{w}\\mid\\mathcal{D}) \\approx \\ln p(\\mathbf{w}_{\\mathrm{MAP}}\\mid\\mathcal{D}) + \\underbrace{\\mathbf{g}^\\top(\\mathbf{w}-\\mathbf{w}_{\\mathrm{MAP}})}_{\\mathbf{g}\\,=\\,\\mathbf{0}\\ \\text{at the peak}} - \\tfrac{1}{2}(\\mathbf{w}-\\mathbf{w}_{\\mathrm{MAP}})^\\top \\mathbf{H}\\,(\\mathbf{w}-\\mathbf{w}_{\\mathrm{MAP}})"></span></div>
  <p class="frag" data-f="0" style="font-size:19px;max-width:none;margin-bottom:2px">What is left is
  a constant plus a quadratic. Exponentiate &#8212; and a quadratic exponent is exactly a Gaussian:</p>
  <div class="eq frag" data-f="0" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="p(\\mathbf{w}\\mid\\mathcal{D}) \\propto e^{-\\frac{1}{2}(\\mathbf{w}-\\mathbf{w}_{\\mathrm{MAP}})^\\top \\mathbf{H} (\\mathbf{w}-\\mathbf{w}_{\\mathrm{MAP}})} = \\mathcal{N}\\bigl(\\mathbf{w} \\mid \\mathbf{w}_{\\mathrm{MAP}},\\ \\mathbf{H}^{-1}\\bigr)"></span></div>
  <div class="eyebrow frag" data-f="1" style="margin-bottom:6px">Step 2 &#183; compute <span class="tex" data-tex="\\mathbf{H} = \\nabla\\nabla\\mathcal{L}"></span> &#8212; differentiate the gradient once more</div>
  <div class="row frag" data-f="1" style="gap:30px;align-items:center;margin-bottom:2px">
    <div class="col"><p style="font-size:19px;max-width:none">The MAP gradient, already derived:</p></div>
    <div class="col"><p class="frag" data-f="2" style="font-size:19px;max-width:none">one more derivative, with <span class="tex" data-tex="\\nabla y_n = y_n(1-y_n)\\,\\mathbf{x}_n"></span>:</p></div>
  </div>
  <div class="row" style="gap:30px;align-items:center">
    <div class="col"><div class="eq frag" data-f="1" style="margin:0;font-size:20px"><span class="texd" data-tex="\\nabla\\mathcal{L} = \\sum_n (y_n - t_n)\\,\\mathbf{x}_n + \\alpha\\mathbf{w}"></span></div></div>
    <div class="col"><div class="eq frag" data-f="2" style="margin:0;font-size:20px"><span class="texd" data-tex="\\mathbf{H} = \\alpha\\mathbf{I} + \\sum_n y_n(1-y_n)\\,\\mathbf{x}_n\\mathbf{x}_n^\\top"></span></div></div>
  </div>
  <p class="frag" data-f="3" style="font-size:19.5px;max-width:none;margin-top:14px">Evaluate at
  <span class="tex" data-tex="\\mathbf{w}_{\\mathrm{MAP}}"></span> and set <span class="tex" data-tex="\\mathbf{S} = \\mathbf{H}^{-1}"></span>. Each car adds curvature <span class="tex" data-tex="y_n(1-y_n)\\,\\mathbf{x}_n\\mathbf{x}_n^\\top"></span> &#8212; largest where <span class="tex" data-tex="y_n = \\tfrac{1}{2}"></span>, where the
  model is least decided; near zero where it is already certain. Certain cars pin the
  posterior down no further.</p>`},

{s:"Part III", t:"Predicting with the posterior", draw:"bfan", html:`
  <div class="eyebrow">Live demo &#183; every draw is a boundary</div>
  <h2 style="margin-bottom:10px">Average over boundaries, not one boundary</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bfsvg" viewBox="0 0 560 358"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:19px"><span class="texd" data-tex="p(t{=}1 \\mid \\mathbf{x}, \\mathcal{D}) \\approx \\frac{1}{K}\\sum_{s=1}^{K} \\sigma(\\mathbf{w}_s^\\top\\mathbf{x}), \\qquad \\mathbf{w}_s \\sim q"></span></div>
      <div class="ctrl-row"><label>listings observed N <span class="val" id="bfnv">16</span></label>

      <div class="warn" id="bfwarn" style="min-height:92px"></div>
      <p class="caption" style="margin-top:8px">Forty draws from q &#8212; <strong>the Laplace
      Gaussian of the last slide, refitted for each N</strong> &#8212; shaded and thickened by their
      probability under it. The background colour is the <strong>average of the draws</strong>: the
      sampled posterior predictive itself.</p>
      <p class="caption" style="margin-top:6px">The classification twin of last week&#8217;s
      &#8220;averaging over weights&#8221; demo. PRML &#167;4.5.2 gives a closed-form shortcut for
      the average (a probit approximation); the sampled version is the idea itself.</p>
    </div>
  </div>`},

{s:"Part III", t:"Back to the two cars", draw:"bcar", html:`
  <div class="eyebrow">What the width buys</div>
  <h2 style="margin-bottom:10px">The two cars, resolved</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bcsvg" viewBox="0 0 560 358"></svg></div>
    <div class="demo-ctrl">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">Car P &#8212; at the data&#8217;s edge</div>

      </div>

      </div>

{s:"Part III", t:"Part III in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part III in one slide</h2>
  <div class="row top stretch" style="gap:18px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The bad news</div><p style="font-size:19px;max-width:none">No closed form. The weights sit inside a sigmoid inside a sum, and cannot be isolated.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The good news</div><p style="font-size:19px;max-width:none">The gradient is <span class="tex" data-tex="\\sum_n (y_n - t_n)\\mathbf{x}_n"></span> &#8212; the same expression as linear regression.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">So</div><p style="font-size:19px;max-width:none">Walk downhill. This is the first model in the course that has to be fitted iteratively.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">And the posterior</div><p style="font-size:19px;max-width:none">Also out of closed form &#8212; a Gaussian fitted at its peak (Laplace) stands in, and predictions widen where data is scarce.</p></div>
  </div>`},

  <div class="divider" style="align-items:center;text-align:center">

{s:"Part IV", t:"Part IV", div:true, html:`
  <div class="divider">
    <div class="part">Part IV</div>
    <h1>More than two classes</h1>
    <div class="bar"></div>
    <div class="sub">The same derivation, one distribution further along.</div>
  </div>`},

{s:"Part IV", t:"K classes", html:`
  <div class="eyebrow">Generalising</div>
  <h2 style="margin-bottom:14px">Three outcomes, not two</h2>
  <p style="font-size:21px;margin-bottom:12px">The dealer's real question is not
  yes-or-no. It is: <em>sells fast</em>, <em>sells slowly</em>, or <em>does not sell</em>.</p>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">The target becomes a vector</div>
        <div class="eq" style="margin:6px 0 0;font-size:21px"><span class="texd" data-tex="\\mathbf{t} = (0,1,0)^\\top \\quad\\text{for class 2}"></span></div>
        <p class="caption" style="margin-top:9px"><strong>One-hot</strong>: a 1 in the position of the
        true class, zeros elsewhere.</p>
      </div>
    </div>
    <div class="col frag" data-f="0">
      <p style="font-size:20.5px">Each component is an <strong>indicator</strong>:
      <span class="tex" data-tex="t_k = \\mathbb{I}\\bigl[\\text{the class is } k\\bigr]"></span>, so exactly one entry is 1 and the rest are 0.</p>
      <hr class="rule">
      <p style="font-size:20.5px">Written this way the target has the same shape as the answer. The
      model returns <span class="tex" data-tex="K"></span> probabilities, one per class, and the likelihood of a single car is
      <span class="tex" data-tex="\\textstyle\\prod_{k=1}^{K} y_k^{\\,t_k}"></span> &#8212; the exponents switch every factor off except the true class&#8217;s, exactly as
      <span class="tex" data-tex="\\mu^{t}(1-\\mu)^{1-t}"></span> did with two.</p>
    </div>
  </div>
  <p class="caption frag" data-f="1" style="margin-top:14px">We now need <span class="tex" data-tex="K"></span> scores instead of one, so
  <span class="tex" data-tex="\\mathbf{w}"></span> becomes a matrix: one weight vector per class.</p>`},

{s:"Part IV", t:"The categorical distribution", draw:"cat", html:`
  <div class="eyebrow">Missing piece 1, again &#183; a distribution that produces one of K labels</div>
  <h2 style="margin-bottom:12px">A die instead of a coin</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:1.15">
      <p style="font-size:20.5px">One roll, <span class="tex" data-tex="K"></span> faces, and one number per face. The whole distribution
      is a vector <span class="tex" data-tex="\\boldsymbol{\\mu} = (\\mu_1,\\dots,\\mu_K)"></span> that must be non-negative and <strong>sum to one</strong>:</p>
      <div class="eq" style="margin:14px 0 10px;font-size:24px"><span class="texd" data-tex="p(\\mathbf{t} \\mid \\boldsymbol{\\mu}) = \\prod_{k=1}^{K} \\mu_k^{\\,t_k}, \\qquad \\sum_{k=1}^{K}\\mu_k = 1"></span></div>
      <p style="font-size:20px">With <span class="tex" data-tex="\\mathbf{t}"></span> one-hot, every exponent is 0 except the true class&#8217;s,
      whose exponent is 1 &#8212; so the product collapses to <span class="tex" data-tex="\\mu_{\\text{true}}"></span>. The exponents are switches, exactly
      as they were for the coin.</p>
      <p class="frag" data-f="1" style="font-size:20px;margin-top:10px"><strong>Check it at <span class="tex" data-tex="K=2"></span>:</strong>
      write <span class="tex" data-tex="\\mu_1 = \\mu"></span> and <span class="tex" data-tex="\\mu_2 = 1-\\mu"></span>, and the formula becomes <span class="tex" data-tex="\\mu^{t_1}(1-\\mu)^{t_2}"></span> &#8212; the Bernoulli, unchanged.</p>
    </div>
    <div class="col">
      <div class="fig"><svg id="catsvg" viewBox="0 0 300 230"></svg></div>
      <p class="caption frag" data-f="0" style="margin-top:8px">The constraint is the whole
      difficulty: <span class="tex" data-tex="K-1"></span> free numbers, not <span class="tex" data-tex="K"></span>. A linear score respects no such constraint &#8212; which
      is what the next slide has to fix.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Softmax", draw:"sm", html:`
  <div class="eyebrow">Live demo &#183; move the scores</div>
  <h2 style="margin-bottom:10px">From K scores to K probabilities</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="msvg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:21px"><span class="texd" data-tex="y_k = \\frac{\\exp(a_k)}{\\sum_{j} \\exp(a_j)}"></span></div>
      <div class="ctrl-row"><label>sells fast <span class="val" id="smz0">2.0</span></label>
        <input type="range" id="sm0" min="-3" max="5" step="0.1" value="2"></div>
      <div class="ctrl-row"><label>sells slowly <span class="val" id="smz1">1.0</span></label>
        <input type="range" id="sm1" min="-3" max="5" step="0.1" value="1"></div>
      <div class="ctrl-row"><label>does not sell <span class="val" id="smz2">0.1</span></label>
        <input type="range" id="sm2" min="-3" max="5" step="0.1" value="0.1"></div>
      <p class="caption" style="margin-top:10px">Exponentiate to make everything positive, then divide
      by the total so the three add to one. Bigger score, bigger share &#8212; the ordering
      survives, as it did through the sigmoid.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Softmax, in code", html:`
  <div class="eyebrow">From the maths to the implementation</div>
  <h2 style="margin-bottom:12px">One shift stands between the formula and working code</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.15">
      <p style="font-size:20px">The formula only ever sees score <strong>differences</strong> &#8212;
      shifting every score by the same <span class="tex" data-tex="c"></span> changes nothing:</p>
      <div class="eq" style="margin:10px 0;font-size:21px"><span class="texd" data-tex="\\frac{e^{a_k - c}}{\\sum_j e^{a_j - c}} = \\frac{e^{a_k}\\,e^{-c}}{e^{-c}\\sum_j e^{a_j}} = \\frac{e^{a_k}}{\\sum_j e^{a_j}}"></span></div>
      <p style="font-size:20px">That free shift is what makes the code safe: <span class="tex" data-tex="e^{a}"></span> overflows float64
      once a score passes about 710, so shift everything down by the max &#8212; the largest exponent
      becomes <span class="tex" data-tex="e^{0}=1"></span> and nothing can blow up.</p>
    </div>
    <div class="col">
      <div class="nb">
        <div class="nb-bar"><span class="dot"></span>softmax, as it is actually written</div>
        <pre class="code">z = a - np.max(a)
y = np.exp(z) / np.sum(np.exp(z))</pre>
      </div>
      <p class="caption" style="margin-top:10px">The demo on the last slide runs exactly these two
      lines.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Softmax generalises sigmoid", html:`
  <div class="eyebrow">It is not a new idea</div>
  <h2 style="margin-bottom:14px">With two classes, softmax <em>is</em> the sigmoid</h2>
  <div class="dgrid" style="grid-template-columns:max-content auto minmax(0,300px);justify-content:start">
    <div style="font-size:20px">1 &#183; write softmax for <span class="tex" data-tex="K=2"></span></div><div class="eq" style="margin:0"><span class="tex" data-tex="y_1 = \\frac{e^{a_1}}{e^{a_1}+e^{a_2}}"></span></div>
    <div class="dnote">two scores, two probabilities</div>
    <div class="frag" data-f="0" style="font-size:20px">2 &#183; divide top and bottom by <span class="tex" data-tex="e^{a_1}"></span></div><div class="eq frag" data-f="0" style="margin:0"><span class="tex" data-tex="y_1 = \\frac{1}{1+e^{-(a_1-a_2)}}"></span></div>
    <div class="dnote frag" data-f="0">the free shift from the last slide, used as algebra</div>
    <div class="frag" data-f="1" style="font-size:20px">3 &#183; recognise it</div><div class="eq frag" data-f="1" style="margin:0"><span class="tex" data-tex="y_1 = \\sigma(a_1 - a_2)"></span></div>
    <div class="dnote frag" data-f="1">the sigmoid, applied to the score <em>difference</em></div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:14px 22px">
    <p style="font-size:20.5px;max-width:none">Only the <strong>difference</strong> <span class="tex" data-tex="a_1 - a_2"></span> ever mattered.
    So for two classes you may pin one score at zero and keep a single weight vector &#8212; which is
    precisely the model of Parts I&#8211;III.</p>
  </div>`},

{s:"Part IV", t:"Categorical cross entropy", html:`
  <div class="eyebrow">Turn the same handle</div>
  <h2 style="margin-bottom:12px">And the loss follows again</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,300px)">
    <div style="font-size:20px">distribution</div><div class="eq" style="margin:0"><span class="tex" data-tex="p(\\mathbf{t}\\mid\\mathbf{x}) = \\prod_{k=1}^{K} y_k^{\\,t_k}"></span></div>
    <div class="dnote">Categorical &#8212; the <span class="tex" data-tex="K"></span>-outcome generalisation of the Bernoulli</div>
    <div style="font-size:20px">likelihood</div><div class="eq" style="margin:0"><span class="tex" data-tex="\\prod_{n}\\prod_{k} y_{nk}^{\\,t_{nk}}"></span></div>
    <div class="dnote">i.i.d. across the data</div>
    <div style="font-size:20px">negative log</div><div class="eq" style="margin:0"><span class="tex" data-tex="\\mathcal{L} = -\\sum_{n}\\sum_{k} t_{nk}\\ln y_{nk}"></span></div>
    <div class="dnote">and there it is</div>
  </div>
  <div class="card accent frag" data-f="0" style="margin-top:16px;padding:14px 22px">
    <p style="font-size:21px;max-width:none">Because <span class="tex" data-tex="\\mathbf{t}"></span> is one-hot, the inner sum keeps exactly one
    term: <strong>the negative log of the probability you gave the true class</strong>.</p>
  </div>
  <p class="caption frag" data-f="1" style="margin-top:12px">And the gradient is
  <span class="tex" data-tex="\\sum_n (y_n - t_n)\\mathbf{x}_n"></span> once more &#8212; the third time today.</p>`},

{s:"Part IV", t:"Multi-label or multi-class", html:`
  <div class="eyebrow">Two different questions</div>
  <h2 style="margin-bottom:12px">Exactly one class, or any number of tags?</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Multi-class &#8212; exactly one</div>
      <p style="font-size:19px;max-width:none"><em>Sells fast / sells slowly / does not sell.</em>
      A flat is <em>rented / not rented</em>. A listing&#8217;s body type is <em>sedan / SUV /
      hatchback</em>. One is true, the rest are false: <strong>softmax</strong> couples the scores,
      the probabilities compete and sum to 1, one categorical cross-entropy.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Multi-label &#8212; any subset</div>
      <p style="font-size:19px;max-width:none"><em>Accident-free &#183; negotiable &#183;
      export-ready.</em> A rental tagged <em>near MRT &#183; furnished &#183; pets allowed</em>. Any
      combination can hold at once: <strong><span class="tex" data-tex="K"></span> independent sigmoids</strong>, one per tag; the <span class="tex" data-tex="K"></span>
      binary cross-entropies just add.</p>
    </div>
  </div>
  <div class="card frag" data-f="0" style="margin-top:12px;padding:12px 20px">
    <p style="font-size:19.5px;max-width:none"><strong>The common bug is using softmax for
    tags.</strong> Softmax forces competition &#8212; raising &#8220;furnished&#8221; must lower
    &#8220;near MRT&#8221; &#8212; when the tags do not compete at all.</p>
  </div>
  <div class="actq frag" data-f="1" style="font-size:20px;margin-top:12px">Check yourself: for the
  tag setup, what is the <strong>generative story</strong> &#8212; how many coins, and what does
  each one need?</div>
  <p class="caption frag" data-f="2" style="margin-top:8px;text-align:center">One coin per tag, each
  with its own bias from its own sigmoid &#8212; <span class="tex" data-tex="K"></span> copies of this lecture&#8217;s story running
  side by side.</p>`},

{s:"Part IV", t:"Part IV (so far) in one slide", html:`
  <div class="eyebrow">Before we keep going</div>
  <h2 style="margin-bottom:16px">Part IV (so far) in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The target</div><p style="font-size:20px;max-width:none">One-hot, for the same reason labels were never numbers: no class sits between two others.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The squashing</div><p style="font-size:20px;max-width:none">Softmax. At <span class="tex" data-tex="K=2"></span> it reduces to the sigmoid, so nothing was replaced.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The loss</div><p style="font-size:20px;max-width:none">Categorical cross-entropy, from the same negative log. And the same gradient.</p></div>
  </div>`},

{s:"Part IV", t:"The next-token head", draw:"head", html:`
  <div class="eyebrow">Where you have already met K = 128,256</div>
  <h2 style="margin-bottom:10px">An LLM&#8217;s last layer is a softmax classifier</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:8px">
    <svg viewBox="0 0 900 140"><g id="headfig"></g></svg>
  </div>
  <div class="row top frag" data-f="0" style="gap:30px;margin-top:6px">
    <div class="col" style="flex:1.15">
      <div class="eq" style="margin:0;font-size:21px"><span class="texd" data-tex="p(\\text{token } k \\mid \\text{context}) = \\mathrm{softmax}(\\mathbf{W}\\mathbf{h})_k, \\qquad \\mathbf{W} \\in \\mathbb{R}^{V \\times d}"></span></div>
    </div>
    <div class="col">
      <p style="font-size:20px">Everything left of <span class="tex" data-tex="\\mathbf{h}"></span> is Weeks 8&#8211;9. The last two boxes are
      <strong>today&#8217;s lecture unchanged</strong>: a linear score per class, a softmax across
      them &#8212; with the vocabulary as the classes.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:12px;text-align:center">
    The pretraining loss is the categorical cross-entropy we just derived: the negative
    log-probability of the token that actually came next.</p>`},

{s:"Part IV", t:"Temperature", draw:"temp", html:`
  <div class="eyebrow">The sampling dial on every LLM API</div>
  <h2 style="margin-bottom:10px">Temperature</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="tpsvg" viewBox="0 0 560 290"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:22px"><span class="texd" data-tex="y_k = \\frac{\\exp(a_k / T)}{\\sum_j \\exp(a_j / T)}"></span></div>
      <div class="ctrl-row"><label>temperature T <span class="val" id="tmpv">1.00</span></label>
        <input type="range" id="tmp" min="0.25" max="4" step="0.05" value="1"></div>
      <div class="warn" id="tpwarn"></div>
      <p class="caption" style="margin-top:10px">Dividing the scores by <span class="tex" data-tex="T"></span> is rescaling <span class="tex" data-tex="\\lVert\\mathbf{w}\\rVert"></span> &#8212;
      the same dial as the steepness slider on the sigmoid in Part I. And the separable-data runaway was this dial
      sliding towards <span class="tex" data-tex="T=0"></span> on its own: certainty the data had not earned.</p>
    </div>
  </div>`},

{s:"Part IV", t:"The price of the denominator", draw:"costk", html:`
  <div class="eyebrow">Now the arithmetic bill</div>
  <h2 style="margin-bottom:10px">The cost lives in the denominator</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="cksvg" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="y_k = \\frac{\\exp(a_k)}{Z}, \\qquad Z = \\sum_{j=1}^{K}\\exp(a_j)"></span></div>
      <p style="font-size:19.5px;max-width:none"><span class="tex" data-tex="Z"></span> touches <strong>every class</strong>: one
      token&#8217;s probability needs all <span class="tex" data-tex="K"></span> scores, its gradient reaches every row of <span class="tex" data-tex="\\mathbf{W}"></span>, and
      training keeps the whole logit tensor for the backward pass. The line is that tensor&#8217;s
      size against <span class="tex" data-tex="K"></span>, for one batch of 8 &#215; 4,096 tokens in fp32 &#8212; straight on log axes,
      and unforgiving.</p>
      <div class="card accent frag" data-f="0" style="margin-top:12px;padding:12px 16px">
        <p style="font-size:19.5px;max-width:none">That one line is why large models share their two
        word tables, never hold the whole logit tensor at once, and split the vocabulary across GPUs.
        The thing being optimised is the classifier you derived today.</p>
      </div>
    </div>
  </div>`},

{s:"Part IV", t:"Summary", html:`
  <div class="eyebrow">Today, in one slide</div>
  <h2 style="margin-bottom:14px">One recipe, a second time</h2>
  <div class="row top stretch" style="gap:24px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Last week</div>
      <p style="font-size:20px;max-width:none">Gaussian target &#8594; <strong>squared error</strong>.</p>
      <div class="eq" style="margin:10px 0 0;font-size:19px"><span class="texd" data-tex="\\tfrac12\\sum_n (t_n-y_n)^2"></span></div>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">This week</div>
      <p style="font-size:20px;max-width:none">Bernoulli target &#8594; <strong>cross-entropy</strong>.</p>
      <div class="eq" style="margin:10px 0 0;font-size:19px"><span class="texd" data-tex="-\\sum_n \\bigl[t_n\\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr]"></span></div>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:9px">Both</div>
      <p style="font-size:20px;max-width:none">Same prior, same regulariser, same gradient.</p>
      <div class="eq" style="margin:10px 0 0;font-size:19px"><span class="texd" data-tex="\\sum_n (y_n-t_n)\\mathbf{x}_n"></span></div>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:18px;text-align:center">
    Choose the distribution that fits the target, and the loss is no longer yours to invent.</p>`},

{s:"Part IV", t:"Key ideas", html:`
  <div class="eyebrow">Recap</div>
  <h2 style="margin-bottom:16px">What to take away</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Labels are not numbers</div>
      <p style="font-size:20px;max-width:none">Least squares fails on classification because it
      measures distance to a target value, and charges you for confident correct answers.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Sigmoid and Bernoulli</div>
      <p style="font-size:20px;max-width:none">The sigmoid makes the linear score a probability, and
      does it by treating that score as the <strong>log-odds</strong>. The boundary stays straight.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Iterate, from here on</div>
      <p style="font-size:20px;max-width:none">Cross-entropy has no closed-form minimiser. Gradient
      descent enters the course here, and it does not leave.</p>
    </div>
  </div>`},

/* Per-slide delivery estimate in minutes. Used for the overview cumulative marks
   and the presenter clock's "vs plan" readout.
   CALIBRATED 11 Aug 2026: the first delivery of this deck planned at 153 min and
   ran 95, so every figure here is an earlier estimate scaled by 0.62. If you add a
   slide, write what you actually expect to spend -- these numbers are now real
   minutes, not the optimistic ones. */
const EST=[0.6, 0.2, 1.0, 1.2, 1.5, 0.9, 0.2, 1.4, 1.4, 0.9, 1.1, 1.0, 1.0, 1.3, 1.9, 1.2, 0.8, 0.2, 1.2, 2.2, 1.8, 1.1, 1.5, 1.2, 1.9, 1.8, 1.4, 1.7, 1.1, 0.7, 1.1, 0.2, 1.4, 1.4, 2.1, 1.5, 1.5, 1.3, 1.5, 1.1, 1.7, 1.7, 0.8, 1.1, 0.2, 1.7, 1.4, 1.5, 1.4, 2.0, 1.7, 1.3, 1.7, 1.3, 1.9, 0.9, 0.2, 1.3, 0.9, 1.4, 1.7, 1.3, 1.9, 1.3, 0.7, 1.1, 0.2, 1.4, 1.5, 1.4, 1.2, 1.4, 1.7, 1.5, 0.7, 1.5, 1.5, 1.7, 1.2, 1.1, 0.6, 0.3];
const EST_TOTAL=EST.reduce((a,b)=>a+b,0);
const cumMin=i=>EST.slice(0,i+1).reduce((a,b)=>a+(b||0),0);

const canvas=document.getElementById('canvas');
let idx=0,fragStep=0,drawnIdx=-1;
canvas.innerHTML=SLIDES.map((s,i)=>`<section class="slide" data-i="${i}">${s.html}</section>`).join('');
const slides=[...canvas.querySelectorAll('.slide')];

function fragsOf(i){
  const f=[...slides[i].querySelectorAll('.frag')];
  return {list:f,max:f.length?Math.max(...f.map(e=>+(e.dataset.f||0))):-1};
}
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  fragsOf(idx).list.forEach(e=>e.classList.toggle('on',(+(e.dataset.f||0))<fragStep));
  document.getElementById('progress').style.width=((idx+1)/SLIDES.length*100)+'%';
  document.getElementById('pagenum').textContent=`${idx+1} / ${SLIDES.length}`;
  if(t0!==null) updClock();
  /* Draw only on slide ENTRY. Redrawing on every fragment step replaces the whole
     svg, and the re-rasterised text visibly flickers ("the graph font changes when
     the box appears"). Demo listeners call their draw functions directly. */
  const d=SLIDES[idx].draw; if(d&&DRAW[d]&&drawnIdx!==idx) requestAnimationFrame(DRAW[d]);
  drawnIdx=idx;
  /* play video on the slide we just entered, pause and rewind everywhere else */
  slides.forEach((s,i)=>s.querySelectorAll('video').forEach(v=>{
    if(i===idx){ v.playbackRate=+(v.dataset.rate||1); v.play().catch(()=>{}); }
    else if(!v.paused||v.currentTime){ v.pause(); v.currentTime=0; }
  }));
  /* Leaving the slide has to REMOVE the iframe, not pause it: playback cannot be controlled
     across origins without pulling in the YouTube JS API, and an iframe left behind on a
     hidden slide keeps playing audio. */
  document.querySelectorAll('.ytwrap.live').forEach(w=>{
    if(+w.closest('.slide').dataset.i !== idx) closeYT(w);
  });
}
function leave(){ const s=slides[idx]; s.classList.add('leaving');
  setTimeout(()=>s.classList.remove('leaving'),160);
  /* Demos with a default choice reset on slide change, so a slide always opens on that
     choice rather than on whatever was clicked the last time through. Not on paint() --
     that also runs on every fragment step, which would undo a click mid-slide. */
  if(typeof resetDemos==='function') resetDemos(); }
function go(n){ if(n<0||n>=SLIDES.length)return; saveInk(); leave(); idx=n; fragStep=fragsOf(idx).max+1; paint(); loadInk(idx); }
function next(){ const {max}=fragsOf(idx);
  if(fragStep<=max){fragStep++;paint();}
  else if(idx<SLIDES.length-1){saveInk();leave();idx++;fragStep=0;paint();loadInk(idx);} }
function prev(){ if(fragStep>0){fragStep--;paint();}
  else if(idx>0){saveInk();leave();idx--;fragStep=fragsOf(idx).max+1;paint();loadInk(idx);} }

function fit(){ canvas.style.transform=`scale(${Math.min(innerWidth/1280,innerHeight/720)*.955})`; }
addEventListener('resize',fit); fit();

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  /* the browser's own shortcuts are the browser's: Cmd/Ctrl-P prints, Cmd-R reloads,
     Cmd-T opens a tab. Without this the deck swallowed all of them -- and calling
     preventDefault on Cmd-P is what stopped the print dialog from ever appearing. */
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  /* arrows belong to a focused slider, not to navigation */
  const ae=document.activeElement;
  if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)){
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown') return;
    if(k==='d'||k==='t'||k==='o'||k==='b') return;
  }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(SLIDES.length-1);
  else if(k==='o')toggleOv(); else if(k==='t')cycleTheme();
  else if(k==='b')document.body.classList.toggle('blank');
  else if(k==='d'){e.preventDefault();toggleInk();}
  else if(k==='p'){e.preventDefault();window.print();}
  else if(k==='k'){e.preventDefault();toggleClock();}
  else if(k==='c'&&document.body.classList.contains('inking'))clearInk();
  else if(k==='e'&&document.body.classList.contains('inking'))setEraser(!erasing);
  else if(k==='f')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  else if(e.key==='Escape')ov.classList.remove('on');
});

/* ---------- minimal Python syntax highlighting ---------- */
const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;
function highlight(){
  /* Placeholders are delimited by private-use code points and indexed with a
     LETTER, not a digit: a digit index would be re-matched by the number rule. */
  const OPEN='', CLOSE='';
  document.querySelectorAll('pre.code').forEach(function(pre){
    if(pre.dataset.hl) return; pre.dataset.hl='1';
    let h=pre.textContent.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const stash=[];
    const keep=function(html){ stash.push(html); return OPEN+String.fromCharCode(65+stash.length-1)+CLOSE; };
    h=h.replace(/#[^\n]*/g, function(m){ return keep('<span class="tok-com">'+m+'</span>'); });
    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');
    h=h.replace(/\b(\d+\.?\d*)\b/g,'<span class="tok-num">$1</span>');
    h=h.replace(/\b([A-Za-z_]\w*)(?=\()/g,'<span class="tok-fn">$1</span>');
    h=h.replace(new RegExp(OPEN+'([A-Z])'+CLOSE,'g'), function(_,c){ return stash[c.charCodeAt(0)-65]; });
    pre.innerHTML=h;
  });
}

/* Render every data-tex node. Re-runnable: demos that rewrite innerHTML call it again.
   Falls back to the raw LaTeX so a bad macro can never blank a slide. */
function renderTeX(){
  if(typeof katex==='undefined'){ setTimeout(renderTeX,40); return; }
  document.querySelectorAll('[data-tex]').forEach(function(el){
    if(el.dataset.done) return;
    try{ katex.render(el.dataset.tex, el,
      {displayMode: el.classList.contains('texd'), throwOnError:false, output:'html',
       /* \htmlClass lets an equation colour its own parts through CSS variables, so
          colour coding follows the theme instead of freezing to the paper palette. */
       trust: c => c.command === '\\htmlClass', strict: false}); }
    catch(e){ el.textContent=el.dataset.tex; }
    el.dataset.done='1';
  });
}

/* ============================================================
   LECTURE 3 DEMOS
   Same conventions as Lectures 1 and 2: each draw function rebuilds the innerHTML
   of one SVG, and paint() calls it through the DRAW registry when its slide is
   entered. Nothing here is fitted at runtime except where the point IS the fitting
   (the gradient-descent demo), so the slides are reproducible.
   ============================================================ */

function lin(a,b,n){const o=[];for(let i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o;}
function pathOf(pts){return 'M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L');}
const sig=z=>1/(1+Math.exp(-z));
const dot3=(w,p)=>w[0]+w[1]*p[0]+w[2]*p[1];

/* Axes helper. Lecture 1 has one, but it lives in that deck's demo block rather than
   the shared engine, so it is not carried across by the build. */
function ax3(W,H,xlo,xhi,ylo,yhi,xstep,ystep,ml){
  ml=ml||44; const mr=14,mt=14,mb=34;
  const X=x=>ml+(x-xlo)/(xhi-xlo)*(W-ml-mr), Y=y=>mt+(yhi-y)/(yhi-ylo)*(H-mt-mb);
  let s='';
  for(let g=Math.ceil(ylo/ystep-1e-9)*ystep;g<=yhi+1e-9;g+=ystep){ const py=Y(g);
    s+='<line class="gridline" x1="'+ml+'" y1="'+py+'" x2="'+(W-mr)+'" y2="'+py+'"/>'
     + '<text class="tick" x="'+(ml-8)+'" y="'+(py+4)+'" text-anchor="end">'+(+g.toFixed(2))+'</text>'; }
  for(let g=Math.ceil(xlo/xstep-1e-9)*xstep;g<=xhi+1e-9;g+=xstep){ const px=X(g);
    s+='<line class="gridline" x1="'+px+'" y1="'+mt+'" x2="'+px+'" y2="'+(H-mb)+'"/>'
     + '<text class="tick" x="'+px+'" y="'+(H-mb+17)+'" text-anchor="middle">'+(+g.toFixed(2))+'</text>'; }
  s+='<line class="axis" x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'"/>'
   + '<line class="axis" x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'"/>';
  return {s:s,X:X,Y:Y,ml:ml,mr:mr,mt:mt,mb:mb};
}

/* Fitted here, from the data above, rather than pasted in. A pasted weight vector and
   a pasted point cloud can drift apart without anything complaining, and a boundary
   that is not actually the fit of the points on screen would be a lie told carefully.
   Least squares is a 3x3 solve; logistic needs iteration, so it is cached. */
function solve3(M,b){
  const A=M.map((r,i)=>r.concat([b[i]]));
  for(let c=0;c<3;c++){
    let p=c; for(let r=c+1;r<3;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    const t=A[c]; A[c]=A[p]; A[p]=t;
    for(let r=0;r<3;r++){ if(r===c) continue;
      const f=A[r][c]/A[c][c];
      for(let k=c;k<4;k++) A[r][k]-=f*A[c][k]; }
  }
  return [A[0][3]/A[0][0], A[1][3]/A[1][1], A[2][3]/A[2][2]];
}
function lsqFit(pos,neg){
  /* +-1 targets: the natural coding when you treat the label as a regression target */
  const rows=pos.map(p=>[[1,p[0],p[1]],1]).concat(neg.map(p=>[[1,p[0],p[1]],-1]));
  const M=[[0,0,0],[0,0,0],[0,0,0]], b=[0,0,0];
  rows.forEach(([x,t])=>{ for(let i=0;i<3;i++){ b[i]+=x[i]*t;
    for(let j=0;j<3;j++) M[i][j]+=x[i]*x[j]; } });
  return solve3(M,b);
}
const _logCache={};
function logFit(pos,neg,key){
  if(_logCache[key]) return _logCache[key];
  /* {0,1} targets, because that is how the Bernoulli is defined. Standardised
     internally so one step size works, then mapped back to the plotted units. */
  const all=pos.map(p=>[p,1]).concat(neg.map(p=>[p,0]));
  const mx=all.reduce((a,[p])=>a+p[0],0)/all.length, my=all.reduce((a,[p])=>a+p[1],0)/all.length;
  const sx=Math.sqrt(all.reduce((a,[p])=>a+(p[0]-mx)*(p[0]-mx),0)/all.length);
  const sy=Math.sqrt(all.reduce((a,[p])=>a+(p[1]-my)*(p[1]-my),0)/all.length);
  let w=[0,0,0];
  for(let it=0;it<20000;it++){
    const gr=[0,0,0];
    all.forEach(([p,t])=>{
      const z1=(p[0]-mx)/sx, z2=(p[1]-my)/sy, y=sig(w[0]+w[1]*z1+w[2]*z2), d=y-t;
      gr[0]+=d; gr[1]+=d*z1; gr[2]+=d*z2; });
    for(let i=0;i<3;i++) w[i]-=0.5/all.length*gr[i];
  }
  const out=[w[0]-w[1]*mx/sx-w[2]*my/sy, w[1]/sx, w[2]/sy];
  _logCache[key]=out; return out;
}

function scatter(A,X,Y,cls){
  return A.map(p=>cls==='sold'
    ? '<circle cx="'+X(p[0])+'" cy="'+Y(p[1])+'" r="4.1" fill="var(--s1)" opacity=".88"/>'
    : '<path d="M'+(X(p[0])-3.7)+' '+(Y(p[1])-3.7)+'l7.4 7.4M'+(X(p[0])+3.7)+' '+(Y(p[1])-3.7)+'l-7.4 7.4" '
      + 'stroke="var(--s2)" stroke-width="1.9" stroke-linecap="round"/>').join('');
}
function bline(w,A,xlo,xhi,ylo,yhi,col,dash,wid,cid){
  /* draw w0 + w1 x + w2 y = 0, clipped to the box; near-vertical is the interesting
     case here, so solve for x when the mileage coefficient is tiny */
  let pts;
  if(Math.abs(w[2])>1e-6){ pts=[[xlo,-(w[0]+w[1]*xlo)/w[2]],[xhi,-(w[0]+w[1]*xhi)/w[2]]]; }
  else { const xv=-w[0]/w[1]; pts=[[xv,ylo],[xv,yhi]]; }
  return '<line x1="'+A.X(pts[0][0])+'" y1="'+A.Y(pts[0][1])+'" x2="'+A.X(pts[1][0])+'" y2="'+A.Y(pts[1][1])
   + '" stroke="'+col+'" stroke-width="'+(wid||2.6)+'"'+(dash?' stroke-dasharray="7 5"':'')
   + ' clip-path="url(#'+cid+')"/>';
}
function clipDef(A,W,H,id){
  return '<defs><clipPath id="'+id+'"><rect x="'+A.ml+'" y="'+A.mt+'" width="'+(W-A.ml-A.mr)
   + '" height="'+(H-A.mt-A.mb)+'"/></clipPath></defs>';
}
const axlab=(A,W,H,xl,yl)=>
  '<text class="legend" x="'+((A.ml+W-A.mr)/2)+'" y="'+(H-3)+'" text-anchor="middle">'+xl+'</text>'
 +'<text class="legend" x="'+(-(A.mt+H-A.mb)/2)+'" y="12" text-anchor="middle" transform="rotate(-90)">'+yl+'</text>';

/* ---------------------------------------------------------------- DEMO 2 — least squares, staged
   Four scenes instead of buttons: the clean data (question), the clean fit
   (answer), the data with the ex-Grab cars (question again), and the refit
   (answer again). Only least squares is drawn — the lecture wants the failure in
   focus, not the repair. The wrong-count in the final scene is computed from the
   picture. */
const fmtCoef=v=>(v<0?'\u2212':'+')+Math.abs(v).toFixed(3);
function lsqScene(id, opts){
  const svg=document.getElementById(id); if(!svg) return;
  const yhi = opts.fleet ? 40 : 20, ystep = opts.fleet ? 10 : 5;
  const W=560,H=310, A=ax3(W,H,0,16,0,yhi,4,ystep);
  const neg = opts.fleet ? D_LOT.concat(D_FLEET) : D_LOT;
  let g=clipDef(A,W,H,'cp'+id)+A.s+axlab(A,W,H,'age (years)','mileage (10,000 km)');
  g+=scatter(neg,A.X,A.Y,'lot')+scatter(D_SOLD,A.X,A.Y,'sold');
  let nWrong=0;
  if(opts.line){
    const wl=lsqFit(D_SOLD,neg);
    g+=bline(wl,A,0,16,0,yhi,'var(--accent)',false,2.8,'cp'+id);
    neg.concat(D_SOLD).forEach((p,i)=>{
      const isSold=i>=neg.length, pred=dot3(wl,p)>0;
      if(pred!==isSold){ nWrong++;
        if(opts.circles)
          g+='<circle cx="'+A.X(p[0])+'" cy="'+A.Y(p[1])+'" r="8.5" fill="none" '
           + 'stroke="var(--accent)" stroke-width="2"/>'; }
    });
  }
  if(opts.fleet){
    /* point at the newcomers so the second question reads instantly */
    const fx=A.X(12.9), fy=A.Y(28);
    g+='<rect x="'+(fx-84)+'" y="'+(fy-58)+'" width="168" height="22" rx="4" fill="var(--bg)" opacity=".85"/>'
     + '<text class="legend" x="'+fx+'" y="'+(fy-42)+'" text-anchor="middle">the fourteen ex-Grab cars</text>';
  }
  svg.innerHTML=g;
  return nWrong;
}
