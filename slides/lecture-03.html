<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS3264 · Lecture 3 — Linear Classification</title>
<!-- KaTeX, bundled locally in media/katex so the deck still works with no network -->
<link rel="stylesheet" href="media/katex/katex.min.css">
<script defer src="media/katex/katex.min.js"></script>
<style>
/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank
   ============================================================ */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide transition: opacity only, short, and NO transform.
   A transform (especially a scale) promotes the slide to a composited layer and
   re-rasterises the text, which makes heavy glyphs read as arriving before light
   ones. Nothing that carries text is allowed to animate transform or scale. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s linear,visibility .14s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.leaving{opacity:0}

/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
.demo-ctrl{flex:.72}
.ctrl-row{margin-bottom:18px}
.ctrl-row label{font-family:var(--font-sans);font-size:11.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:8px}
.ctrl-row .val{color:var(--accent);font-weight:700;font-size:14.5px;letter-spacing:0}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:var(--rule);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:2.5px solid var(--bg);box-shadow:var(--shadow)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--accent);

/* ---------- PRINT: one page per slide ----------

@media print{

  .frag{opacity:1!important}

  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}

const SLIDES = [
{s:"", t:"Title", html:`
  <div class="eyebrow">CS3264 &#183; Semester 1, AY2026/27</div>

{s:"Recap", t:"Recap", div:true, html:`
  <div class="divider">

    <div class="bar"></div>

{s:"Recap", t:"Data, model, loss", html:`
  <div class="eyebrow">The frame, from Lecture 1</div>
  <h2 style="margin-bottom:16px">Every method here has three ingredients</h2>
  <div class="grid3" style="margin-top:4px">
    <div class="appcard" style="padding:20px"><div class="t">Data</div>
      <div class="d" style="font-size:17.5px;margin-top:6px"><span class="tex" data-tex="\\mathcal{D} = \\{(\\mathbf{x}_n, t_n)\\}_{n=1}^{N}"></span><br>what we are given</div></div>
    <div class="appcard" style="padding:20px"><div class="t">Model</div>
      <div class="d" style="font-size:17.5px;margin-top:6px"><span class="tex" data-tex="y(\\mathbf{x};\\mathbf{w}) = \\mathbf{w}^\\top\\boldsymbol{\\phi}(\\mathbf{x})"></span><br>the shape we assume</div></div>
    <div class="appcard" style="padding:20px"><div class="t">Loss</div>
      <div class="d" style="font-size:17.5px;margin-top:6px"><span class="tex" data-tex="E(\\mathbf{w}) = \\tfrac12\\sum_n \\bigl(y_n - t_n\\bigr)^2"></span><br>what counts as wrong</div></div>
  </div>
  <div class="row top stretch frag" data-f="0" style="gap:22px;margin-top:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Lecture 1&#8217;s technique</div>
      <p style="font-size:20px;max-width:none"><strong>Write the loss down directly.</strong>
      Squared error, because it measures the miss and punishes big misses more. State what should
      count as wrong, then minimise it.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Lecture 2&#8217;s technique</div>
      <p style="font-size:20px;max-width:none"><strong>Model the data probabilistically.</strong>
      Say how the data was produced, and the loss is <em>derived</em> from that story rather than
      chosen. The next slide replays the recipe.</p>
    </div>
  </div>`},

{s:"Recap", t:"The recipe", html:`
  <div class="eyebrow">Last week</div>
  <h2 style="margin-bottom:16px">The recipe</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Write the model</div>
      <p style="font-size:20px;max-width:none">Say how the data was <strong>generated</strong>. Last week that was
      <span class="tex" data-tex="t = \\mathbf{w}^\\top\\boldsymbol{\\phi}(x) + \\varepsilon"></span> with Gaussian noise.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">Take the negative log</div>
      <p style="font-size:20px;max-width:none">Of the likelihood, and of the prior. Products become
      sums; the exponential disappears.</p>
    </div>
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Read off the loss</div>
      <p style="font-size:20px;max-width:none">Squared error came from the noise. The regulariser came
      from the prior. Neither was chosen.</p>
    </div>
  </div>
  <div class="eq" style="margin:20px 0 0;font-size:26px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = \\underbrace{\\tfrac12\\lVert\\mathbf{t}-\\boldsymbol{\\Phi}\\mathbf{w}\\rVert_2^2}_{\\text{from the noise}} + \\underbrace{\\tfrac{\\lambda}{2}\\lVert\\mathbf{w}\\rVert_2^2}_{\\text{from the prior}}"></span></div>`},

{s:"Recap", t:"MLE, MAP, Bayesian", html:`
  <div class="eyebrow">Last week&#8217;s ladder, spelled out</div>
  <h2 style="margin-bottom:14px">Three ways to handle the weights</h2>
  <div class="row top stretch" style="gap:18px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">MLE &#183; maximum likelihood</div>
      <div class="eq" style="margin:2px 0 8px;font-size:19.5px"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{ML}} = \\arg\\max_{\\mathbf{w}}\\ p(\\mathcal{D} \\mid \\mathbf{w})"></span></div>
      <p style="font-size:18.5px;max-width:none">Pick the single <span class="tex" data-tex="\\mathbf{w}"></span> under which the data you saw is
      <strong>most probable</strong>. Only the likelihood enters.</p>
      <hr class="rule">
      <p class="small" style="max-width:none">Its negative log gave squared error. One <span class="tex" data-tex="\\mathbf{w}"></span> comes out;
      predictions carry only the noise term.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">MAP &#183; maximum a posteriori</div>
      <div class="eq" style="margin:2px 0 8px;font-size:19.5px"><span class="texd" data-tex="\\mathbf{w}_{\\mathrm{MAP}} = \\arg\\max_{\\mathbf{w}}\\ p(\\mathcal{D} \\mid \\mathbf{w})\\,p(\\mathbf{w})"></span></div>
      <p style="font-size:18.5px;max-width:none">Pick the single most probable <span class="tex" data-tex="\\mathbf{w}"></span> <strong>after
      seeing the data</strong> &#8212; the peak of the posterior. The prior now enters.</p>
      <hr class="rule">
      <p class="small" style="max-width:none">Its negative log gave squared error <em>plus the
      regulariser</em>. Still one <span class="tex" data-tex="\\mathbf{w}"></span> out.</p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px">Bayesian &#183; keep the distribution</div>
      <div class="eq" style="margin:2px 0 8px;font-size:19.5px"><span class="texd" data-tex="p(\\mathbf{w} \\mid \\mathcal{D}) \\propto p(\\mathcal{D} \\mid \\mathbf{w})\\,p(\\mathbf{w})"></span></div>
      <p style="font-size:18.5px;max-width:none">Do not pick. Keep the <strong>whole
      posterior</strong>, and average predictions over every plausible <span class="tex" data-tex="\\mathbf{w}"></span>.</p>
      <hr class="rule">
      <p class="small" style="max-width:none">Predictions also carry how unsure the data leaves us
      about <span class="tex" data-tex="\\mathbf{w}"></span> &#8212; the width MAP threw away.</p>
    </div>
  </div>
  <div class="card frag" data-f="2" style="margin-top:14px;padding:12px 20px">
    <p style="font-size:19.5px;max-width:none"><strong>How they relate:</strong> all three start from
    the same likelihood. MAP is MLE with a prior attached; the posterior is the distribution whose
    peak MAP keeps and whose width it discards. Today runs the same ladder on labels.</p>
  </div>`},

  <div class="demo">
    <div class="demo-plot"><svg id="csvg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:20px;max-width:none">You are the dealer now, not the buyer. The question is
      no longer <em>what is it worth</em> but:</p>
      <div class="card accent" style="padding:12px 16px;margin:12px 0">
        <p style="font-size:20.5px;max-width:none">Will this car <strong>sell within 30 days</strong>?</p>
      </div>
      <p class="caption">Age and mileage &#8212; features you already know. The answer is now one of
      two things, not a number on a scale.</p>
    </div>
  </div>`},

{s:"Part I", t:"What actually changed", html:`
  <div class="eyebrow">Notation, once</div>
  <h2 style="margin-bottom:14px">Only the target changed</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,340px);margin-top:6px">
    <div style="font-size:20px">Data</div><div class="eq" style="margin:0"><span class="tex" data-tex="\\mathcal{D} = \\{(\\mathbf{x}_n, t_n)\\}_{n=1}^{N}"></span></div>
    <div class="dnote">familiar inputs &#8212; age and mileage</div>
    <div style="font-size:20px">Last week</div><div class="eq" style="margin:0"><span class="tex" data-tex="t_n \\in \\mathbb{R}"></span></div>
    <div class="dnote">a number anywhere on the line</div>
    <div style="font-size:20px">This week</div><div class="eq" style="margin:0"><span class="tex" data-tex="t_n \\in \\{0, 1\\}"></span></div>
    <div class="dnote">one of two labels, and nothing in between</div>
  </div>
  <hr class="rule" style="margin:18px 0 14px">
  <p style="font-size:21px">There is no half-sold car. <strong>0 and 1 are names, not quantities</strong>
  &#8212; we could equally have written &#8220;slow&#8221; and &#8220;fast&#8221;. Nothing about the
  target is closer to 1 than to 0.</p>
  <p class="caption" style="margin-top:10px">One convention note: we will sometimes code the labels
  as <span class="tex" data-tex="\\{-1, +1\\}"></span> instead of <span class="tex" data-tex="\\{0, 1\\}"></span> when the algebra is tidier that way &#8212; the next demo does exactly this.
  Names either way.</p>`},

{s:"Part I", t:"Learning objectives", html:`
  <div class="eyebrow">Where we are going</div>
  <h2 style="margin-bottom:18px">Today</h2>
  <div class="row top stretch" style="gap:26px">
    <div class="col">
      <div class="eyebrow" style="margin-bottom:10px">The pieces &#183; Part I</div>
      <ul style="margin:0">
        <li style="font-size:19.5px;margin-bottom:8px">Why least squares is the wrong tool for a
          label &#8212; shown, not asserted.</li>
        <li style="font-size:19.5px;margin-bottom:8px">The <strong>Bernoulli</strong>, and the
          <strong>sigmoid</strong> that feeds it.</li>
        <li style="font-size:19.5px">The geometry of the boundary &#8212; what <span class="tex" data-tex="\\mathbf{w}"></span> and the bias
          each control.</li>
      </ul>
    </div>
    <div class="col">
      <div class="eyebrow" style="margin-bottom:10px">The derivation &#183; Parts II&#8211;III</div>
      <ul style="margin:0">
        <li style="font-size:19.5px;margin-bottom:8px"><strong>Cross-entropy</strong>, derived
          exactly as squared error was &#8212; from the model, not chosen.</li>
        <li style="font-size:19.5px;margin-bottom:8px">The probability is not yet a decision:
          <strong>thresholds, costs</strong> and imbalance.</li>
        <li style="font-size:19.5px">No closed form this time &#8212; the gradient, and
          <strong>walking downhill</strong>.</li>
      </ul>
    </div>
    <div class="col">
      <div class="eyebrow" style="margin-bottom:10px">At scale &#183; Part IV</div>
      <ul style="margin:0">
        <li style="font-size:19.5px;margin-bottom:8px"><strong>Softmax</strong>: more than two
          classes, and why it is the same idea again.</li>
        <li style="font-size:19.5px;margin-bottom:8px">Multi-class or <strong>multi-label</strong>
          &#8212; two different questions.</li>
        <li style="font-size:19.5px">The same softmax at <strong>K = 128,256</strong> &#8212; a
          language model&#8217;s last layer, and its temperature dial.</li>
      </ul>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:20px;text-align:center">
    By the end, cross-entropy &#8212; the loss most classifiers in this course train on, neural
    networks included &#8212; will be one you derived.</p>`},

{s:"Part I", t:"Predict first", draw:"lsqQ1", html:`
  <div class="actbadge">Predict first</div>
  <div class="actq" style="font-size:24px;margin:10px 0 8px">Code the labels as <span class="tex" data-tex="t={+}1"></span> and <span class="tex" data-tex="t={-}1"></span> and run
  <em class="hl">last week&#8217;s least-squares fit</em> on these cars. Does its zero line
  separate the two groups?</div>
  <div class="demo">
    <div class="demo-plot"><svg id="lq1svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <div class="card" style="margin-bottom:12px"><div class="eyebrow" style="margin-bottom:6px">A</div>
        <p style="font-size:20px;max-width:none">It fits the data and <strong>separates</strong> the two groups.</p></div>
      <div class="card"><div class="eyebrow" style="margin-bottom:6px">B</div>
        <p style="font-size:20px;max-width:none">It does <strong>not</strong> separate them.</p></div>
    </div>
  </div>`},

{s:"Part I", t:"It separates", draw:"lsqA1", html:`
  <div class="eyebrow">Run the fit</div>
  <h2 style="margin-bottom:10px">It is A &#8212; least squares does the job here</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="la1svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <div class="warn" id="lw1"></div>
      <p class="caption" style="margin-top:10px">The line drawn is where the fitted value crosses
      zero &#8212; everything above it gets called <span class="tex" data-tex="-1"></span>, everything below <span class="tex" data-tex="+1"></span>.</p>
    </div>
  </div>`},

{s:"Part I", t:"Predict again", draw:"lsqQ2", html:`
  <div class="actbadge">Predict again</div>
  <div class="actq" style="font-size:24px;margin:10px 0 8px">Fourteen <strong>ex-Grab cars</strong>
  join the lot: old, enormous mileage, obviously slow sellers &#8212; and all far on the correct
  side of the line we just fitted. Refit. Does the new line still separate the groups?</div>
  <div class="demo">
    <div class="demo-plot"><svg id="lq2svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <div class="card" style="margin-bottom:12px"><div class="eyebrow" style="margin-bottom:6px">A</div>
        <p style="font-size:20px;max-width:none">It still fits and <strong>separates</strong> them &#8212; the newcomers are already on the correct side.</p></div>
      <div class="card"><div class="eyebrow" style="margin-bottom:6px">B</div>
        <p style="font-size:20px;max-width:none">It does <strong>not</strong> &#8212; the refit gets cars wrong.</p></div>
      <p class="caption frag" data-f="0" style="margin-top:12px">The newcomers gave the fit no new
      information about the boundary &#8212; or did they?</p>
    </div>
  </div>`},

{s:"Part I", t:"Least squares breaks", draw:"lsqA2", html:`
  <div class="eyebrow">Refit, with the ex-Grab cars in</div>
  <h2 style="margin-bottom:10px">It is B &#8212; the refit is worse than before</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="la2svg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <div class="warn" id="lw2"></div>
      <p class="caption" style="margin-top:10px">Circled: the cars the new line gets wrong. Adding
      easy, obviously-correct examples <em>damaged</em> the fit &#8212; the next slide is about
      why.</p>
    </div>
  </div>`},

{s:"Part I", t:"Why it breaks", draw:"why", html:`
  <div class="eyebrow">The mechanism</div>
  <h2 style="margin-bottom:14px">Squared error punishes being &#8220;too correct&#8221;</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:1.05">
      <p style="font-size:20.5px">Under the boundary fitted <em>before</em> they arrived, an ex-Grab
      car sits far on the correct side: its linear score comes out around <span class="tex" data-tex="-4.5"></span> when its target is
      <span class="tex" data-tex="t=-1"></span>. Squared error charges that car</p>
      <div class="eq" style="margin:12px 0;font-size:23px"><span class="texd" data-tex="(-4.5 - (-1))^2 \\approx 12.5"></span></div>
      <p style="font-size:20.5px">for being &#8220;too correct&#8221;. The only way to reduce the
      charge is to tilt the boundary until that score comes back towards <span class="tex" data-tex="-1"></span> &#8212; and the tilt is
      paid for by the cars near the boundary, the ones that actually matter.</p>
    </div>
    <div class="col" style="flex:1.05">
      <div class="fig h-290"><svg viewBox="0 0 460 300"><g id="whysvg"></g></svg></div>
      <p class="caption frag" data-f="0" style="margin-top:8px"><strong>Reading the figure:</strong>
      the curve is one car&#8217;s squared loss against its linear score; zero loss sits exactly at
      the target <span class="tex" data-tex="-1"></span>.</p>
      <p class="caption frag" data-f="1" style="margin-top:6px">The gap along the axis from the
      dashed line to a car is its <strong>residual</strong>; the height is that residual squared.
      The ex-Grab car sits 3.5 past the target, so it is charged &#8776; 12.5; a car near the boundary
      is charged &#8776; 0.4.</p>
      <p class="caption frag" data-f="2" style="margin-top:6px">The pull each car exerts on the fit
      is the <strong>slope where it stands</strong>:</p>
      <div class="warn frag" data-f="2" id="whypull" style="min-height:66px;margin-top:6px"></div>
    </div>
  </div>`},

{s:"Part I", t:"Not probabilities either", html:`
  <div class="eyebrow">A second, separate problem</div>
  <h2 style="margin-bottom:14px">And the output is not a probability</h2>
  <div class="row top" style="gap:32px">
    <div class="col">
      <p style="font-size:21px">Last week's model returns <span class="tex" data-tex="\\mathbf{w}^\\top\\mathbf{x}"></span>, which is a real number. Feed it a car
      and it will happily answer</p>
      <div class="eq" style="margin:12px 0;font-size:23px"><span class="texd" data-tex="1.4 \\quad\\text{or}\\quad -0.3"></span></div>
      <p style="font-size:21px">There is no reading of &#8220;probability it sells&#8221; on which
      either number means anything.</p>
    </div>
    <div class="col frag" data-f="0">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:9px">Two separate faults</div>
        <p style="font-size:20px;max-width:none"><strong>1. The loss</strong> is wrong &#8212; it
        penalises confident correct answers.</p>
        <hr class="rule">
        <p style="font-size:20px;max-width:none"><strong>2. The output</strong> is an unbounded
        number, when what the question needs is a probability in <span class="tex" data-tex="[0,1]"></span>.</p>
      </div>

    </div>
  </div>`},

{s:"Part I", t:"The problem, in one slide", html:`
  <div class="eyebrow">Before we go on</div>
  <h2 style="margin-bottom:16px">The problem, in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The change</div><p style="font-size:20px;max-width:none">Same inputs, same three ingredients. The target is now a label &#8212; a name, not a quantity.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">What we tried</div><p style="font-size:20px;max-width:none">Least squares, unchanged. A group of easy, far-away cars rotated the boundary until it got hard ones wrong &#8212; squared error charges for being <em>too</em> correct.</p></div>
    <div class="col card accent"><div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">So we need</div><p style="font-size:20px;max-width:none">A distribution that produces labels, and an output that is a probability. Those are the two pieces we build next.</p></div>
  </div>`},

{s:"Part I", t:"Part I", div:true, html:`
  <div class="divider">
    <div class="part">Part I &#183; continued</div>
    <h1>Building the right model</h1>
    <div class="bar"></div>
    <div class="sub">Last week&#8217;s story, two missing pieces, and the fix.</div>
  </div>`},

{s:"Part I", t:"Last week's story", draw:"regen", html:`
  <div class="eyebrow">Recap &#183; the generative story we already have</div>
  <h2 style="margin-bottom:10px">Last week&#8217;s story</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:8px">
    <svg viewBox="0 0 900 110"><g id="rgfig"></g></svg>
  </div>
  <div class="row top frag" data-f="0" style="gap:30px;margin-top:8px">
    <div class="col">
      <p style="font-size:20.5px">A deterministic part &#8212; the curve, linear or nonlinear in the
      features &#8212; and Gaussian noise on top. That story produced <strong>numbers</strong>, and
      its negative log produced squared error.</p>
    </div>
    <div class="col">
      <p style="font-size:20.5px">For labels it fails twice, as we just saw: the loss punishes
      &#8220;too correct&#8221;, and nothing in the story produces a <strong>probability</strong>.
      We need to replace the random part.</p>
    </div>
  </div>`},

{s:"Part I", t:"Why w is perpendicular", draw:"hp2", html:`
  <div class="eyebrow">Why w meets it at a right angle &#183; live demo</div>
  <h2 style="margin-bottom:8px">The line is where the score crosses zero</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="hp2svg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19px;max-width:none;margin-bottom:4px">Last week&#8217;s linear part, noise
      dropped, zero bias, centred features:</p>
      <div class="eq" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="s(\\mathbf{x}) = \\mathbf{w}^\\top\\mathbf{x} = w_1 x_1 + w_2 x_2"></span></div>
      <div class="ctrl-row" style="display:flex;flex-wrap:nowrap;gap:7px;margin-bottom:14px">
        <button class="bbtn" data-hps="1" type="button" style="padding:6px 11px;white-space:nowrap">1 &#183; features</button>
        <button class="bbtn" data-hps="2" type="button" style="padding:6px 11px;white-space:nowrap">2 &#183; the score</button>
        <button class="bbtn" data-hps="3" type="button" style="padding:6px 11px;white-space:nowrap">3 &#183; the crossing</button>
      </div>
      <div class="ctrl-row" style="margin-bottom:12px"><label>w&#8321; &#183; age <span class="val" id="hp2w1v">0.0</span></label>
        <input type="range" id="hp2w1" min="-1.2" max="1.2" step="0.1" value="0"></div>
      <div class="ctrl-row" style="margin-bottom:10px"><label>w&#8322; &#183; mileage <span class="val" id="hp2w2v">&#8722;1.0</span></label>
        <input type="range" id="hp2w2" min="-1.2" max="1.2" step="0.1" value="-1"></div>
      <div class="stat" style="margin-bottom:8px"><span class="k">tilt of the plane</span><span class="v" id="hp2nv" style="font-size:18px">&#8212;</span></div>
      <div class="warn" id="hp2warn" style="min-height:72px"></div>
      <p class="frag" data-f="0" style="font-size:18px;max-width:none;margin-top:10px">Scale both
      weights up and the plane tilts more steeply, but crosses zero along the <strong>same</strong>
      line: the boundary follows the <strong>direction</strong> of <span class="tex" data-tex="\\mathbf{w}"></span>, not its size.</p>
    </div>
  </div>`},

{s:"Part I", t:"The geometry of w", draw:"geo", html:`
  <div class="eyebrow">Live demo &#183; the same plane, seen from above</div>
  <h2 style="margin-bottom:10px">What the three numbers do</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="geosvg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19px;max-width:none;margin-bottom:4px">The same picture from straight
      above, with the bias put back:</p>
      <div class="eq" style="margin:0 0 12px;font-size:20px"><span class="texd" data-tex="s(\\mathbf{x}) = w_0 + w_1 x_1 + w_2 x_2"></span></div>
      <div class="ctrl-row" style="margin-bottom:12px"><label>w&#8321; &#183; age <span class="val" id="geow1v">0.7</span></label>
        <input type="range" id="geow1" min="-1.5" max="1.5" step="0.1" value="0.7"></div>
      <div class="ctrl-row" style="margin-bottom:12px"><label>w&#8322; &#183; mileage <span class="val" id="geow2v">&#8722;0.9</span></label>
        <input type="range" id="geow2" min="-1.5" max="1.5" step="0.1" value="-0.9"></div>
      <div class="ctrl-row" style="margin-bottom:10px"><label>bias w&#8320; <span class="val" id="geobv">0.0</span></label>
        <input type="range" id="geob" min="-2.5" max="2.5" step="0.1" value="0"></div>
      <div class="warn" id="geowarn" style="min-height:72px"></div>
    </div>
  </div>`},

{s:"Part I", t:"A cut is not a probability", html:`
  <div class="eyebrow">Which is not yet what we asked for</div>
  <h2 style="margin-bottom:14px">The cut can be right and still say too little</h2>
  <div class="row top" style="gap:26px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px">What the score gives</div>
      <p style="font-size:20px;max-width:none">A <strong>side</strong>. <span class="tex" data-tex="s > 0"></span> says sells, <span class="tex" data-tex="s < 0"></span> says it
      does not, and the line says where the answer changes.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">What it will not give</div>
      <p style="font-size:20px;max-width:none">A car at <span class="tex" data-tex="s = 0.1"></span> and a car at <span class="tex" data-tex="s = 7"></span> both read
      &#8220;sells&#8221;. One sits on the line, the other far past it. <strong>How sure?</strong></p>
    </div>
  </div>
  <div class="card accent frag" data-f="1" style="margin-top:18px;padding:14px 18px">
    <p style="font-size:20.5px;max-width:none">We want <span class="tex" data-tex="p(\\text{sells} \\mid \\mathbf{x})"></span> &#8212; a number between 0 and 1. Two
    pieces are missing: a distribution that <strong>produces labels</strong>, and a way to turn an
    unbounded score into the <strong>one number</strong> that distribution needs.</p>
  </div>`},

{s:"Part I", t:"Bernoulli", draw:"bern", html:`
  <div class="eyebrow">Missing piece 1 &#183; a distribution that produces labels</div>
  <h2 style="margin-bottom:12px">The Bernoulli distribution</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:1.15">
      <p style="font-size:21px">A coin comes up heads or tails. A car sells or does not. One number
      fixes the whole distribution: the probability of the outcome we call 1.</p>
      <div class="eq" style="margin:16px 0 10px;font-size:26px"><span class="texd" data-tex="\\mathrm{Bern}(t \\mid \\mu) = \\mu^{t}\\,(1-\\mu)^{1-t}, \\qquad t \\in \\{0,1\\}"></span></div>
      <p style="font-size:20px">Check it: put <span class="tex" data-tex="t=1"></span> in and you get <span class="tex" data-tex="\\mu"></span>; put <span class="tex" data-tex="t=0"></span> in and you get <span class="tex" data-tex="1-\\mu"></span>.
      One formula, both cases &#8212; the exponents act as switches.</p>
    </div>
    <div class="col">
      <div class="fig"><svg id="bernsvg" viewBox="0 0 300 210"></svg></div>
      <div class="ctrl-row" style="margin-top:8px"><label><span style="text-transform:none">&#956;</span> <span class="val" id="bmuv">0.35</span></label>
        <input type="range" id="bmu" min="0.05" max="0.95" step="0.05" value="0.35"></div>
      <p class="caption" style="text-align:center;margin-top:4px">Two bars, and they must sum to one</p>
    </div>
  </div>`},

{s:"Part I", t:"Bernoulli or Binomial", html:`
  <div class="eyebrow">An aside</div>
  <h2 style="margin-bottom:14px">Bernoulli or Binomial?</h2>
  <div class="row top" style="gap:30px">
    <div class="col">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">Bernoulli</div>
        <p style="font-size:20px;max-width:none">Models <strong>which outcomes you saw, in order</strong>:
        H,H,T,H. Each observation is its own factor.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="eyebrow" style="margin-bottom:8px">Binomial</div>
        <p style="font-size:20px;max-width:none">Models <strong>how many</strong> came up heads:
        &#8220;3 of 4&#8221;. It carries a <span class="tex" data-tex="\\binom{N}{m}"></span> because many orderings give the same count.</p>
      </div>
    </div>
    <div class="col frag" data-f="0">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">Choose Bernoulli when&#8230;</div>
        <p style="font-size:19.5px;max-width:none">&#8230;each observation has <strong>its own</strong>
        <span class="tex" data-tex="\\mu"></span>. Our cars: every car&#8217;s <span class="tex" data-tex="\\mu(\\mathbf{x})"></span> depends on that car&#8217;s age and mileage, so no two
        factors in the likelihood are alike. This is today&#8217;s case.</p>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="eyebrow" style="margin-bottom:8px">Choose Binomial when&#8230;</div>
        <p style="font-size:19.5px;max-width:none">&#8230;the trials share <strong>one</strong> <span class="tex" data-tex="\\mu"></span> and
        only the <strong>count</strong> is kept. 340 clicks out of 2,000 impressions of the same ad;
        3 defective boards in a batch of 50 from one line.</p>
      </div>
    </div>
  </div>`},

{s:"Part I", t:"The sigmoid", draw:"sig", html:`
  <div class="eyebrow">Missing piece 2 &#183; live demo</div>
  <h2 style="margin-bottom:10px">The Bernoulli only accepts &#956; between 0 and 1</h2>
  <div class="demo">
    <div class="demo-ctrl">
      <div class="card">
        <div class="eyebrow" style="margin-bottom:8px">What the linear model gives</div>
        <div class="eq" style="margin:6px 0 0;font-size:21px"><span class="texd" data-tex="\\mathbf{w}^\\top\\mathbf{x} \\in (-\\infty, \\infty)"></span></div>
        <p class="caption" style="margin-top:6px">any real number, unbounded</p>
      </div>
      <div style="text-align:center;font-size:26px;color:var(--accent);margin:6px 0">&#8595;</div>
      <div class="card accent">
        <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">What the Bernoulli needs</div>
        <div class="eq" style="margin:6px 0 0;font-size:21px"><span class="texd" data-tex="\\mu \\in [0,1]"></span></div>
        <p class="caption" style="margin-top:6px">a probability, and nothing outside</p>
      </div>
      <div class="ctrl-row" style="margin-top:12px"><label>steepness <span class="val" id="sigwv">1.0</span></label>
        <input type="range" id="sigw" min="0.2" max="4" step="0.1" value="1"></div>
    </div>
    <div class="demo-plot">
      <div class="eq" style="margin:0 0 8px;font-size:22px;text-align:center"><span class="texd" data-tex="\\sigma(a) = \\frac{1}{1+e^{-a}}"></span></div>
      <svg id="ssvg" viewBox="0 0 560 250"></svg>
      <p class="caption" style="margin-top:8px">Grey dashed is the raw linear score,
      which runs off the top and bottom; the sigmoid keeps the <strong>ordering</strong> and folds the
      ends into 0 and 1 &#8212; a <em>squashing</em> function (the neural-network literature calls
      it a transfer or activation function). <strong>The boundary is where <span class="tex" data-tex="\\sigma = \\tfrac12"></span></strong> &#8212; exactly <span class="tex" data-tex="\\mathbf{w}^\\top\\mathbf{x} = 0"></span>, still a straight
      line in <span class="tex" data-tex="\\mathbf{x}"></span>. Hence <em>linear</em> classification.</p>
    </div>
  </div>`},

{s:"Part I", t:"Log odds", draw:"odds", html:`
  <div class="eyebrow">Why this squashing and not another</div>
  <h2 style="margin-bottom:12px">The linear score <em>is</em> the log-odds</h2>
  <div class="row top" style="gap:28px">
    <div class="col" style="flex:1.05">
      <p style="font-size:20px"><strong>Odds</strong> are how gamblers state beliefs: 3-to-1 on
      means <span class="tex" data-tex="p = 0.75"></span>. Taking the <strong>log</strong> does two useful things:</p>
      <p class="frag" data-f="0" style="font-size:20px;margin-top:10px"><strong>It makes the scale
      symmetric.</strong> Odds of 3:1 and 1:3 become +1.1 and &#8722;1.1 &#8212; half the line
      favours each class, and 0 is an even bet: the boundary.</p>
      <p class="frag" data-f="1" style="font-size:20px;margin-top:10px"><strong>It makes evidence
      add.</strong> Independent factors multiply odds, so they <em>add</em> log-odds &#8212; and a
      quantity that adds is exactly what a linear function <span class="tex" data-tex="\\mathbf{w}^\\top\\mathbf{x}"></span> can be.</p>
    </div>
    <div class="col" style="flex:1.15">
      <div class="fig"><svg id="oddsvg" viewBox="0 0 560 210"></svg></div>
      <p class="caption" style="margin-top:6px">The same beliefs on both rulers: probabilities pinch
      up near 0 and 1; log-odds spread them evenly.</p>
    </div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:14px;padding:12px 20px">
    <p style="font-size:20px;max-width:none">Inverting the sigmoid gives <span class="tex" data-tex="\\ln\\tfrac{y}{1-y} = \\mathbf{w}^\\top\\mathbf{x}"></span> exactly: choosing
    &#963; is choosing to model the <strong>log-odds as linear</strong> in the features.
    Tutorial 2 next week derives this properly.</p>
  </div>`},

{s:"Part I", t:"The generative picture", draw:"gen3", html:`
  <div class="eyebrow">The pieces, assembled</div>
  <h2 style="margin-bottom:10px">A generative story for one car&#8217;s label</h2>
  <div class="fig" style="background:transparent;box-shadow:none;margin-bottom:8px">
    <svg viewBox="0 0 900 140"><g id="gen3fig"></g></svg>
  </div>
  <div class="row top" style="gap:30px;margin-top:6px">
    <div class="col">
      <p style="font-size:20.5px">A <strong>deterministic</strong> part: the car&#8217;s features are
      weighed into a score, and the score is squashed into a probability <span class="tex" data-tex="\\mu"></span>.</p>
    </div>
    <div class="col">
      <p style="font-size:20.5px">A <strong>stochastic</strong> part: a coin with bias <span class="tex" data-tex="\\mu"></span> is flipped
      <strong>once</strong>. The label is whatever came up &#8212; that is all we ever observe.</p>
    </div>
  </div>
  <p class="figcap frag" data-f="0" style="margin-top:12px;text-align:center">
    Lecture 2&#8217;s story was signal plus Gaussian noise. This is the same shape &#8212; a
    deterministic part and a random part &#8212; with a coin where the noise was.</p>`},

{s:"Part I", t:"How a dataset is generated", draw:"lgen3", html:`
  <div class="eyebrow">Live demo &#183; flip the coins yourself</div>
  <h2 style="margin-bottom:10px">Run the story and a dataset falls out</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="lg3svg" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 12px;font-size:19px"><span class="texd" data-tex="t \\sim \\mathrm{Bern}\\bigl(\\mu(\\mathbf{x})\\bigr), \\qquad \\mu(\\mathbf{x}) = \\sigma(\\mathbf{w}^\\top\\mathbf{x})"></span></div>
      <div class="ctrl-row" style="margin-bottom:12px"><label>age of the car <span class="val" id="lg3xv">4.0</span></label>
        <input type="range" id="lg3x" min="0.6" max="13.4" step="0.2" value="4"></div>
      <div class="ctrl-row" style="margin-bottom:12px"><label>its mileage <span class="val" id="lg3yv">6.0</span></label>
        <input type="range" id="lg3y" min="1" max="19" step="0.5" value="6"></div>
      <div style="display:flex;gap:8px;margin:10px 0 8px;flex-wrap:wrap">
        <button class="bbtn" id="lg3d" type="button">draw a label</button>
        <button class="bbtn" id="lg3sp" type="button">a whole dataset</button>
        <button class="bbtn" id="lg3r" type="button">reset</button>
      </div>
      <div class="stat" style="margin-bottom:8px"><span class="k">labels drawn</span><span class="v" id="lg3n">0</span></div>
      <div class="warn" id="lg3warn" style="min-height:66px"></div>
      <p class="caption" style="margin-top:8px"><strong>Click the plane</strong> to put a car there
      and flip its coin; drag to move without flipping. The background is <span class="tex" data-tex="\\mu(\\mathbf{x})"></span> itself: blue where the
      coin is loaded towards a sale, red towards the lot. Repeat draws are nudged apart so they stay
      countable.</p>
    </div>
  </div>`},

{s:"Part I", t:"The structure, but not the weights", html:`
  <div class="eyebrow">One thing missing</div>
  <h2 style="margin-bottom:14px">We have the structure &#8212; not the weights</h2>
  <p style="font-size:21px;margin-bottom:14px">The story says how labels are produced <em>given</em>
  <span class="tex" data-tex="\\mathbf{w}"></span>. Nobody has told us <span class="tex" data-tex="\\mathbf{w}"></span>. The recap ladder says there are three ways to get it:</p>
  <div class="row top stretch" style="gap:20px">
    <div class="col card frag" data-f="0"><div class="eyebrow" style="margin-bottom:8px">MLE</div><p style="font-size:19.5px;max-width:none">The <span class="tex" data-tex="\\mathbf{w}"></span> under which the observed labels are most probable.</p></div>
    <div class="col card frag" data-f="0"><div class="eyebrow" style="margin-bottom:8px">MAP</div><p style="font-size:19.5px;max-width:none">The most probable <span class="tex" data-tex="\\mathbf{w}"></span> after the data &#8212; the prior enters.</p></div>
    <div class="col card frag" data-f="0"><div class="eyebrow" style="margin-bottom:8px">Bayesian</div><p style="font-size:19.5px;max-width:none">No single <span class="tex" data-tex="\\mathbf{w}"></span> &#8212; keep the whole posterior.</p></div>
  </div>
  <p class="figcap frag" data-f="1" style="margin-top:16px;text-align:center">
    Part II climbs the first two rungs for this model. The third comes later today.</p>`},

{s:"Part I", t:"The pieces, in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">The pieces, in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The story</div><p style="font-size:20px;max-width:none">Features &#8594; score &#8594; probability &#8594; one coin flip. The flip is the only random step, and it is the label &#8212; last week&#8217;s story with a coin where the noise was.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Bernoulli + sigmoid</div><p style="font-size:20px;max-width:none">The coin is a Bernoulli, <span class="tex" data-tex="\\mu^t(1-\\mu)^{1-t}"></span>; the sigmoid turns the unbounded score into the parameter <span class="tex" data-tex="\mu"></span> without disturbing the ordering.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">Why that squashing</div><p style="font-size:20px;max-width:none">It makes <span class="tex" data-tex="\\mathbf{w}^\\top\\mathbf{x}"></span> the log-odds. The boundary is still a straight line. More in Tutorial 2.</p></div>
  </div>`},

{s:"Part I", t:"Questions (Part I)", div:true, html:`
  <div class="divider" style="align-items:center;text-align:center">
    <h1 style="font-size:60px">Questions?</h1>
    <div class="bar" style="margin:18px auto 20px"></div>
    <p class="lede" style="font-size:20px;margin-bottom:20px;max-width:44ch">About the generative story, the Bernoulli, the sigmoid, or log-odds</p>
    <div style="text-align:center"><img src="media/pollev-qr.svg" alt="pollev.com/haroldsoh QR" style="width:176px;display:block;margin:0 auto 11px"><div style="font-family:var(--font-sans);font-size:19px;letter-spacing:.02em;color:var(--ink)"><strong>pollev.com/haroldsoh</strong></div></div>
  </div>`},

{s:"Part II", t:"Part II", div:true, html:`
  <div class="divider">
    <div class="part">Part II</div>
    <h1>Logistic regression</h1>
    <div class="bar"></div>
    <div class="sub">Same three steps as last week. A different distribution.</div>
  </div>`},

{s:"Part II", t:"The setup", html:`
  <div class="eyebrow">Data, model, loss</div>
  <h2 style="margin-bottom:14px">Write the model down</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,330px)">
    <div style="font-size:20px"><strong>Data</strong></div><div class="eq" style="margin:0"><span class="tex" data-tex="\\mathcal{D} = \\{(\\mathbf{x}_n,t_n)\\},\\ t_n \\in \\{0,1\\}"></span></div>
    <div class="dnote">labels, not numbers</div>
    <div class="frag" data-f="0" style="font-size:20px"><strong>Function</strong></div><div class="eq frag" data-f="0" style="margin:0"><span class="tex" data-tex="y = \\sigma(\\mathbf{w}^\\top\\mathbf{x})"></span></div>
    <div class="dnote frag" data-f="0">the parameter <span class="tex" data-tex="\\mu(\\mathbf{x})"></span> &#8212; the deterministic part of the story</div>
    <div class="frag" data-f="1" style="font-size:20px"><strong>Likelihood</strong></div><div class="eq frag" data-f="1" style="margin:0"><span class="tex" data-tex="p(t \\mid \\mathbf{x},\\mathbf{w}) = \\mathrm{Bern}\\bigl(t \\mid \\sigma(\\mathbf{w}^\\top\\mathbf{x})\\bigr)"></span></div>
    <div class="dnote frag" data-f="1">Bernoulli, with <span class="tex" data-tex="y"></span> as its parameter</div>
    <div class="frag" data-f="2" style="font-size:20px"><strong>Prior</strong></div><div class="eq frag" data-f="2" style="margin:0"><span class="tex" data-tex="p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{w} \\mid \\mathbf{0}, \\alpha^{-1}\\mathbf{I})"></span></div>
    <div class="dnote frag" data-f="2">the same one as last week</div>
  </div>
  <hr class="rule frag" data-f="3" style="margin:18px 0 12px">
  <p class="frag" data-f="3" style="font-size:21px">And the loss is <strong>not written down</strong>. As last week, we obtain
  it &#8212; from the likelihood alone for MLE, and with the prior for MAP.</p>
  <p class="caption frag" data-f="4" style="margin-top:10px">Note what did <em>not</em> change: the score is
  still linear in <span class="tex" data-tex="\\mathbf{w}"></span>. That is why this is still called linear classification.</p>`},

{s:"Part II", t:"The likelihood", html:`
  <div class="eyebrow">Step 1 &#8212; the probability of the data</div>
  <h2 style="margin-bottom:14px">The likelihood</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,300px)">
    <div style="font-size:20px"><span class="tex" data-tex="p(\\mathcal{D}\\mid\\mathbf{w})"></span></div><div class="eq" style="margin:0"><span class="tex" data-tex="= p(t_1,\\dots,t_N \\mid \\mathbf{X},\\mathbf{w})"></span></div>
    <div class="dnote">the joint probability of every label</div>
    <div class="frag" data-f="0" style="font-size:20px"></div><div class="eq frag" data-f="0" style="margin:0"><span class="tex" data-tex="= \\prod_{n=1}^{N} \\mathrm{Bern}\\bigl[\\sigma(\\mathbf{w}^\\top\\mathbf{x}_n)\\bigr]"></span></div>
    <div class="dnote frag" data-f="0">i.i.d. &#8212; the joint factorises</div>
    <div class="frag" data-f="1" style="font-size:20px"></div><div class="eq frag" data-f="1" style="margin:0"><span class="tex" data-tex="= \\prod_{n=1}^{N} y_n^{\\,t_n}\\,(1-y_n)^{1-t_n}"></span></div>
    <div class="dnote frag" data-f="1">writing <span class="tex" data-tex="y_n = \\sigma(\\mathbf{w}^\\top\\mathbf{x}_n)"></span> for short</div>
  </div>
  <p class="figcap frag" data-f="2" style="margin-top:18px;text-align:center">
    Structurally identical to last week's Gaussian likelihood. Only the factor inside the product
    is different.</p>`},

{s:"Part II", t:"Cross entropy", html:`
  <div class="eyebrow">Step 2 &#8212; take logs</div>
  <h2 style="margin-bottom:12px">Cross-entropy, derived</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,290px)">
    <div style="font-size:20px">start from</div><div class="eq" style="margin:0"><span class="tex" data-tex="p(\\mathcal{D}\\mid\\mathbf{w}) = \\prod_{n=1}^{N} y_n^{\\,t_n}\\,(1-y_n)^{1-t_n}"></span></div>
    <div class="dnote">where the last slide ended</div>
    <div class="frag" data-f="0" style="font-size:20px">take the log</div><div class="eq frag" data-f="0" style="margin:0"><span class="tex" data-tex="\\ln p(\\mathcal{D}\\mid\\mathbf{w}) = \\sum_{n} \\ln\\Bigl[y_n^{\\,t_n}(1-y_n)^{1-t_n}\\Bigr]"></span></div>
    <div class="dnote frag" data-f="0">log of a product is a sum of logs</div>
    <div class="frag" data-f="1" style="font-size:20px"></div><div class="eq frag" data-f="1" style="margin:0"><span class="tex" data-tex="\\phantom{\\ln p(\\mathcal{D}\\mid\\mathbf{w})} = \\sum_{n} \\Bigl[t_n \\ln y_n + (1-t_n)\\ln(1-y_n)\\Bigr]"></span></div>
    <div class="dnote frag" data-f="1">the exponents come down</div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:16px 24px">
    <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">Negate it, and that is the loss</div>
    <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = -\\sum_{n=1}^{N} \\Bigl[\\, t_n \\ln y_n + (1-t_n)\\ln(1-y_n) \\,\\Bigr]"></span></div>
    <p class="caption" style="margin-top:10px;text-align:center"><strong>Binary cross-entropy.</strong>
    Note the minus sign covers the whole bracket.</p>
  </div>
  <p class="figcap frag" data-f="2" style="margin-top:14px;text-align:center">
    The negative log of the Bernoulli likelihood &#8212; the same route that produced squared error last week.</p>`},

{s:"Part II", t:"What the loss looks like", draw:"bce", html:`
  <div class="eyebrow">Live demo &#183; one point at a time</div>
  <h2 style="margin-bottom:10px">Reading the loss</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bsvg" viewBox="0 0 560 250"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:20px"><span class="texd" data-tex="\\mathcal{L}_n = -\\bigl[\\,t_n \\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr]"></span></div>
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="bbtn sel" data-bce="1" type="button">true label t = 1</button>
        <button class="bbtn" data-bce="0" type="button">t = 0</button>
      </div>
      <div class="warn" id="bwarn2" style="min-height:66px"></div>
      <p class="caption" style="margin-top:10px">Only one of the two terms is ever active: the
      <span class="tex" data-tex="t_n"></span> and <span class="tex" data-tex="1-t_n"></span> factors switch the other off.</p>
    </div>
  </div>`},

{s:"Part II", t:"MAP", html:`
  <div class="eyebrow">Step 3 &#8212; and the prior</div>
  <h2 style="margin-bottom:14px">Add the prior, get the regulariser</h2>
  <p style="font-size:20px;margin-bottom:10px">Exactly last week&#8217;s move: maximising the posterior
  is minimising the sum of two negative logs. Take the prior a line at a time.</p>
  <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;margin-bottom:10px">
    <div style="font-size:19px;align-self:center">the prior, unchanged from last week</div>
    <div class="eq" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{w} \\mid \\mathbf{0},\\ \\alpha^{-1}\\mathbf{I})"></span></div>
    <div class="frag" data-f="0" style="font-size:19px;align-self:center">write it out</div>
    <div class="eq frag" data-f="0" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="p(\\mathbf{w}) = \\left(\\tfrac{\\alpha}{2\\pi}\\right)^{\\!D/2} \\exp\\!\\left(-\\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert^2\\right)"></span></div>
    <div class="frag" data-f="1" style="font-size:19px;align-self:center">its negative log</div>
    <div class="eq frag" data-f="1" style="margin:0;font-size:19px;text-align:left"><span class="texd" data-tex="-\\ln p(\\mathbf{w}) = \\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert^2 + \\text{const}"></span></div>
  </div>
  <p class="caption frag" data-f="1" style="margin:0 0 10px">The constant does not depend on <span class="tex" data-tex="\\mathbf{w}"></span>, so it
  cannot change where the minimum sits &#8212; drop it and add what is left to the cross-entropy:</p>
  <div class="eq frag" data-f="2" style="margin:6px 0 14px;font-size:23px"><span class="texd" data-tex="\\mathcal{L}(\\mathbf{w}) = \\underbrace{-\\sum_{n}\\bigl[t_n\\ln y_n + (1-t_n)\\ln(1-y_n)\\bigr]}_{\\text{cross-entropy}} \\;+\\; \\underbrace{\\tfrac{\\alpha}{2}\\lVert\\mathbf{w}\\rVert_2^2}_{\\text{from the prior}}"></span></div>
  <div class="row top" style="gap:26px">
    <div class="col card frag" data-f="3">
      <div class="eyebrow" style="margin-bottom:8px">The second term</div>
      <p style="font-size:19.5px;max-width:none">is the same <span class="tex" data-tex="\\ell_2"></span> penalty as ridge regression, out of the
      same zero-mean Gaussian prior.</p>
    </div>
    <div class="col card accent frag" data-f="3">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">Worth noticing</div>
      <p style="font-size:19.5px;max-width:none">The <em>likelihood</em> changed. The <em>prior</em> did not
      &#8212; so the regulariser is identical.</p>
    </div>
  </div>`},

{s:"Part II", t:"Back to the car", html:`
  <div class="eyebrow">What the dealer gets</div>
  <h2 style="margin-bottom:14px">Back to the car</h2>
  <div class="row top" style="gap:30px">
    <div class="col" style="flex:1.1">
      <p style="font-size:21px">The model no longer answers yes or no. It answers with a
      probability:</p>
      <div class="dgrid" style="grid-template-columns:auto auto;margin-top:12px;gap:10px 20px">
        <div style="font-size:20px">3 years, 50,000 km</div>
        <div class="eq" style="margin:0"><span class="tex" data-tex="y > 0.99"></span></div>
        <div style="font-size:20px">5 years, 82,000 km</div>
        <div class="eq" style="margin:0"><span class="tex" data-tex="y \\approx 0.5"></span></div>
      </div>
      <p class="caption" style="margin-top:12px">The second car sits almost exactly on the fitted
      boundary from Part I &#8212; and the model says so, rather than guessing a side.</p>
    </div>
    <div class="col frag" data-f="0">
      <div class="card accent">
        <div class="eyebrow" style="margin-bottom:9px;color:var(--accent)">The half is not sacred</div>
        <p style="font-size:20px;max-width:none">Classify as &#8220;will sell&#8221; when <span class="tex" data-tex="y > c"></span> &#8212; but
        nothing forces <span class="tex" data-tex="c = \\tfrac12"></span>. If unsold stock is expensive, buy only when <span class="tex" data-tex="y > 0.8"></span>.</p>
        <hr class="rule">
        <p style="font-size:20px;max-width:none">The model supplies the probability. The threshold is
        a <strong>business decision</strong>, and now the two are cleanly separated.</p>
      </div>
    </div>
  </div>`},

{s:"Part II", t:"Choosing the threshold", draw:"thr", html:`
  <div class="eyebrow">Live demo &#183; the fit is fixed &#8212; the cut is not</div>
  <h2 style="margin-bottom:10px">The probability is not yet a decision</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="tsvg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:19.5px;max-width:none">The model outputs <span class="tex" data-tex="y = p(\\text{sells} \\mid \\mathbf{x})"></span>. To <em>act</em> you still pick a
      cut <span class="tex" data-tex="c"></span> and buy when <span class="tex" data-tex="y > c"></span>. The two mistakes it can make cost different money:
      a car <strong>bought that then sits</strong> ties up capital; a
      <strong>quick seller passed over</strong> is margin someone else earns.</p>
      <div class="ctrl-row" style="margin-top:8px"><label>cut c <span class="val" id="thcv">0.50</span></label>
        <input type="range" id="thc" min="0.05" max="0.95" step="0.05" value="0.5"></div>
      <div class="row" style="gap:16px;margin:8px 0">
        <div class="stat"><span class="k">bought, then sat &#183; false positives</span><span class="v" id="thfp">&#8212;</span></div>
        <div class="stat"><span class="k">sellers passed over &#183; false negatives</span><span class="v" id="thfn">&#8212;</span></div>
      </div>
      <div class="warn" id="thwarn"></div>
    </div>
  </div>`},

{s:"Part II", t:"The dealer's numbers", html:`
  <div class="actbadge">Activity &#183; show of hands</div>
  <div class="actq" style="font-size:24.5px;margin:12px 0 12px">The dealer prices the two mistakes:
  a car <strong>bought that then sits</strong> costs about <strong>$800</strong> of holding; a
  <strong>quick seller passed over</strong> forfeits about <strong>$500</strong> of margin.<br>
  Where should the cut <span class="tex" data-tex="c"></span> go?</div>
  <div class="row" style="gap:20px;margin-top:14px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">A</div><p style="font-size:20px;max-width:none"><strong>Below &#189;</strong> &#8212; buy more freely.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">B</div><p style="font-size:20px;max-width:none"><strong>At &#189;</strong> &#8212; the mistakes roughly balance.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:6px">C</div><p style="font-size:20px;max-width:none"><strong>Above &#189;</strong> &#8212; buy only when quite sure.</p></div>
  </div>`},

{s:"Part II", t:"The cost of a cut", draw:"cost", html:`
  <div class="eyebrow">PRML &#167;1.5 &#183; decision theory, in three lines</div>
  <h2 style="margin-bottom:10px">It is C &#8212; and the exact cut can be derived</h2>
  <div class="row top" style="gap:26px">
    <div class="col" style="flex:.95">
      <div class="dgrid" style="grid-template-columns:max-content minmax(0,1fr);gap:10px 14px">
        <div style="font-size:19px">buy, and it sits</div><div class="eq" style="margin:0;font-size:18.5px"><span class="texd" data-tex="\\mathbb{E}[\\text{cost of buying}] = (1-y)\\times 800"></span></div>
        <div class="frag" data-f="0" style="font-size:19px">pass, and it would have sold</div><div class="eq frag" data-f="0" style="margin:0;font-size:18.5px"><span class="texd" data-tex="\\mathbb{E}[\\text{cost of passing}] = y \\times 500"></span></div>
        <div class="frag" data-f="1" style="font-size:19px">buy when</div><div class="eq frag" data-f="1" style="margin:0;font-size:18.5px"><span class="texd" data-tex="(1-y)\\, 800 < y\\, 500"></span></div>
      </div>
      <div class="card accent frag" data-f="1" style="margin-top:12px;padding:12px 18px;text-align:center">
        <div class="eq" style="margin:0;font-size:22px"><span class="texd" data-tex="y > \\frac{800}{800+500} \\approx 0.615"></span></div>
      </div>
      <p class="caption frag" data-f="2" style="margin-top:10px">The cut is the <strong>cost
      ratio</strong> &#8212; no new fitting, just arithmetic on the model&#8217;s probability. On
      the right, the model&#8217;s expected cost bottoms out exactly at that ratio. The faint
      curves are the realised cost &#8212; the sixty cars, and seven resamples of them. Each one
      puts its minimum somewhere different: with data this small the derivation is the sturdier
      guide.</p>
    </div>
    <div class="col frag" data-f="2" style="flex:1.05">
      <div class="fig"><svg id="cstsvg" viewBox="0 0 560 290"></svg></div>
    </div>
  </div>`},

{s:"Part II", t:"The ROC curve", draw:"roc", html:`
  <div class="actbadge">Predict first &#183; then drag</div>
  <h2 style="margin-bottom:10px">Sweep the cut and a curve appears</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="rocsvg" viewBox="0 0 560 310"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:18.5px;max-width:none">Turn the two error counts into <strong>rates</strong>:
      the fraction of cars that <em>did</em> sell which we caught, against the fraction of the rest we
      bought by mistake. Each cut <span class="tex" data-tex="c"></span> gives one point; sweeping it traces the curve.</p>
      <p style="font-size:18.5px;max-width:none;margin-top:8px"><strong>ROC</strong> is short for
      <strong>receiver operating characteristic</strong> &#8212; from wartime radar, where the
      &#8220;receiver&#8221; was the operator judging whether a blip was an aircraft, trading missed
      planes against false alarms.</p>
      <div class="actq" style="font-size:18.5px;margin:9px 0 7px">Before dragging: as <span class="tex" data-tex="c"></span> rises from
      &#189; towards 1, which way does the point move &#8212; towards (0,0) or towards (1,1)?</div>
      <div class="ctrl-row"><label>your cut c <span class="val" id="roccv">0.50</span></label>
        <input type="range" id="rocc" min="0.02" max="0.98" step="0.02" value="0.5"></div>
      <p class="caption frag" data-f="0" style="margin-top:7px">Towards <strong>(0,0)</strong>: a
      stricter cut calls fewer cars positive of either kind. Choosing a threshold is choosing where
      to stand on the curve.</p>
      <p class="caption frag" data-f="1" style="margin-top:6px"><strong>AUC</strong> is what it says:
      the <strong>area under the curve</strong> &#8212; equal to the probability that a random seller
      scores above a random non-seller.</p>
    </div>
  </div>`},

{s:"Part II", t:"Part II in one slide", html:`
  <div class="eyebrow">Before we move on</div>
  <h2 style="margin-bottom:16px">Part II in one slide</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The model</div><p style="font-size:20px;max-width:none">A Bernoulli whose parameter is the sigmoid of a linear score. Two familiar pieces, joined.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">The loss</div><p style="font-size:20px;max-width:none">Cross-entropy, obtained by taking the negative log &#8212; the same handle that gave squared error last week.</p></div>
    <div class="col card"><div class="eyebrow" style="margin-bottom:8px">With a prior</div><p style="font-size:20px;max-width:none">The same <span class="tex" data-tex="\\ell_2"></span> penalty appears, because the prior on the weights never changed.</p></div>
  </div>`},

  <div class="divider">
