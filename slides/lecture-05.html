/* ============================================================

:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide transition: opacity only, short, and NO transform.
   A transform (especially a scale) promotes the slide to a composited layer and
   re-rasterises the text, which makes heavy glyphs read as arriving before light
   ones. Nothing that carries text is allowed to animate transform or scale. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .14s linear,visibility .14s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide.leaving{opacity:0}

/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
li.qz::before{display:none}li.qz{padding-left:6px}
#of5 text,#bvp5 text,#bvs5 text,#bvc5 text,#bvi5 text,#bvk5 text,#bvt5 text,#cvc5 text,#dd5 text,#hfv5 text{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.texd .katex{font-size:1.12em}

/* ---------- PRINT: one page per slide ----------
   The deck is a 1280x720 design canvas that fit() scales to the window. For print we
   drop that scale, let the slides flow one after another instead of stacking, and set
   the page to the same 1280x720 -- 13.333in x 7.5in at 96dpi, the standard widescreen
   slide size -- so a printed page is what the projector shows, at 1:1.
   Chrome's "Save as PDF" destination turns this into a deck PDF. */
@media print{
  @page{ size:13.333in 7.5in; margin:0 }
  html,body{height:auto;overflow:visible}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none}
  #stage{position:static;display:block;transition:none}
  #canvas{transform:none!important;width:1280px;height:auto;overflow:visible;
    background:transparent;transition:none}
  .slide{position:relative;inset:auto;width:1280px;height:720px;overflow:hidden;
    background:var(--bg);opacity:1!important;visibility:visible!important;
    transition:none!important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .frag{opacity:1!important}
  /* presenter chrome has no business on paper */
  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}

{s:"Part I", t:"Reading an expectation", html:`
  <div class="eyebrow">Notation &#183; before the first one appears</div>
  <h2 style="margin-bottom:12px">An expectation is a weighted average</h2>
  <div class="eq" style="margin:10px 0 14px;font-size:27px"><span class="texd" data-tex="\\mathbb{E}_{p(z)}\\bigl[f(z)\\bigr] = \\int f(z)\\, p(z)\\, dz \\qquad \\text{(a sum, if } z \\text{ is discrete)}"></span></div>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:9px 22px">
    <div style="font-size:20px"><span class="tex" data-tex="f(z)"></span></div><div style="font-size:20px">the quantity you care about</div>
    <div style="font-size:20px"><span class="tex" data-tex="p(z)"></span></div><div style="font-size:20px">how likely each <span class="tex" data-tex="z"></span> is &#8212; the <strong>weights</strong></div>
    <div style="font-size:20px">the subscript</div><div style="font-size:20px"><strong>what is random</strong>, and under which distribution</div>
  </div>
  <div class="row top stretch frag" data-f="0" style="gap:18px;margin-top:16px">
    <div class="col card">
      <p style="font-size:19px;max-width:none"><span class="tex" data-tex="\\mathbb{E}_{p(t \\mid x)}[t]"></span> &#8212; average <em>target</em> at a fixed input. Averages over the noise.</p>
    </div>
    <div class="col card">
      <p style="font-size:19px;max-width:none"><span class="tex" data-tex="\\mathbb{E}_{p(\\mathcal{D})}[y(x,\\mathcal{D})]"></span> &#8212; average <em>prediction</em> at <span class="tex" data-tex="x"></span>. Averages over datasets.</p>
    </div>
  </div>
  <div class="warn frag" data-f="1" style="margin-top:14px;font-size:17px">Different subscript, different average. Keeping the two apart is today&#8217;s whole derivation.</div>`},

{s:"Part I", t:"Two different expectations", html:`
  <div class="eyebrow">The gap, written down</div>
  <h2 style="margin-bottom:12px">Training error &#8800; generalisation error</h2>
  <div class="eq" style="margin:14px 0 18px;font-size:24px"><span class="texd" data-tex="\\underbrace{\\frac{1}{N}\\sum_{n=1}^{N}\\bigl(y(x_n,\\mathcal{D}) - t_n\\bigr)^2}_{\\textbf{training error}} \\;\\neq\\; \\underbrace{\\mathbb{E}_{p(x,t)}\\bigl[(y(x,\\mathcal{D}) - t)^2\\bigr]}_{\\textbf{generalisation error}}"></span></div>
  <div class="row top stretch frag" data-f="0" style="gap:20px">
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s1)">Left</div>
      <p style="font-size:19.5px;max-width:none">Average over <strong>your <span class="tex" data-tex="N"></span> points</strong>. Computable.</p>
    </div>
    <div class="col card">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s2)">Right</div>
      <p style="font-size:19.5px;max-width:none">Average over the <strong>unknown distribution</strong> <span class="tex" data-tex="p(x,t)"></span>. The
      number that matters. Not computable.</p>
    </div>
  </div>
  <p class="caption frag" data-f="1" style="margin-top:14px">Stance today: <strong>frequentist</strong>.
  The truth is fixed; the <em>data</em> is what is random. Weeks 2 and 4 did the reverse.</p>`},

{s:"Part I", t:"Two questions", html:`
  <div class="eyebrow">Where the next two lectures go</div>
  <h2 style="margin-bottom:16px">Two questions about generalisation error</h2>
  <div class="row top stretch" style="gap:22px">
    <div class="col card accent">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--accent)">This week</div>
      <p style="font-size:21px;max-width:none">Can we <strong>break it apart</strong>?</p>
      <hr class="rule">
      <p style="font-size:19.5px;max-width:none">Yes: three pieces, each responding differently to model
      complexity.</p>
    </div>
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px">Next week</div>
      <p style="font-size:21px;max-width:none">How far can it be from the <strong>training error</strong>?</p>
      <hr class="rule">
      <p style="font-size:19.5px;max-width:none">A bound that holds with high probability &#8212; PAC.</p>
    </div>
  </div>`},

{s:"Part I", t:"The key idea", html:`
  <div class="eyebrow">PRML &#167;3.2 &#183; today in one line</div>
  <h2 style="margin-bottom:14px">Generalisation error splits into three</h2>
  <div class="eq" style="margin:14px 0 20px;font-size:28px"><span class="texd" data-tex="\\underbrace{\\mathbb{E}\\bigl[(y(x,\\mathcal{D}) - t)^2\\bigr]}_{\\text{generalisation error}} = \\textcolor{#2E6DA4}{(\\text{bias})^2} + \\textcolor{#3F7F62}{\\text{variance}} + \\textcolor{#B03A31}{\\text{noise}}"></span></div>
  <div class="row top stretch" style="gap:18px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s1)">Bias&#178;</div>
      <p style="font-size:19.5px;max-width:none">Average model vs truth. A limitation of the
      <em>family</em>.</p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s4)">Variance</div>
      <p style="font-size:19.5px;max-width:none">How much the fit moves when the training set changes.
      Sensitivity to the <em>sample</em>.</p>
    </div>
    <div class="col card frag" data-f="2">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s2)">Noise</div>
      <p style="font-size:19.5px;max-width:none">Scatter in <span class="tex" data-tex="t"></span> itself. No model, no data removes it.</p>
    </div>
  </div>`},

{s:"Part III", t:"Part III", div:true, html:`
  <div class="divider">

    <div class="bar"></div>
    <div class="sub">Add and subtract twice; three terms fall out.</div>

{s:"Part III", t:"Two averages", draw:"bva5", html:`
  <div class="eyebrow">Setting up &#183; everything hangs on these two</div>
  <h2 style="margin-bottom:8px">Two averages, over two different things</h2>
  <div class="row top" style="gap:20px">
    <div class="col" style="flex:1.15">
      <div class="fig" style="background:transparent;box-shadow:none;padding:0">
        <svg id="bva5" viewBox="0 0 560 330" style="width:100%;display:block"></svg>
      </div>
      <p class="caption" style="margin-top:4px;font-size:14.5px">At one input <span class="tex" data-tex="x"></span>: green rings are targets you might observe
      there, and the green curve their average, <span class="tex" data-tex="\\bar{t}(x)"></span>. Red dots are predictions, one per dataset, and the blue dashed curve
      their average, <span class="tex" data-tex="\\bar{y}(x)"></span>.</p>
    </div>
    <div class="col" style="flex:1">
      <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:9px 14px;align-items:center">
        <div class="eq" style="margin:0;text-align:left;font-size:21px"><span class="texd" data-tex="p(t, x) = p(x)\\, p(t \\mid x)"></span></div>
        <div class="dnote" style="font-size:15.5px">an input, then a target for it</div>
        <div class="eq frag" data-f="0" style="margin:0;text-align:left;font-size:21px"><span class="texd" data-tex="\\bar{t}(x) = \\mathbb{E}_{p(t \\mid x)}[t]"></span></div>
        <div class="dnote frag" data-f="0" style="font-size:15.5px"><strong style="color:var(--s4)">the green centre</strong>: the average
        target at this input, an average over the <strong style="color:var(--s2)">noise</strong>. The green curve is this at every <span class="tex" data-tex="x"></span>.</div>
        <div class="eq frag" data-f="1" style="margin:0;text-align:left;font-size:21px"><span class="texd" data-tex="\\mathcal{D} \\sim p(\\mathcal{D}) = \\textstyle\\prod_{n=1}^{N} p(x_n, t_n)"></span></div>
        <div class="dnote frag" data-f="1" style="font-size:15.5px"><span class="tex" data-tex="N"></span> points. Each dataset gives one fit, and so one
        <strong style="color:var(--s2)">red dot</strong>, <span class="tex" data-tex="y(x, \\mathcal{D})"></span>.</div>
        <div class="eq frag" data-f="2" style="margin:0;text-align:left;font-size:21px"><span class="texd" data-tex="\\bar{y}(x) = \\mathbb{E}_{p(\\mathcal{D})}\\bigl[y(x,\\mathcal{D})\\bigr]"></span></div>
        <div class="dnote frag" data-f="2" style="font-size:15.5px"><strong style="color:var(--s1)">the blue centre</strong>: an average over
        <strong>datasets</strong>. The blue dashed curve is this at every <span class="tex" data-tex="x"></span>.</div>
      </div>
      <div class="warn frag" data-f="3" style="margin-top:12px;font-size:16px"><span class="tex" data-tex="\\bar{t}(x)"></span> averages over the noise at one input; <span class="tex" data-tex="\\bar{y}(x)"></span> averages
      over datasets. Two different averages, over two different sources of randomness.</div>
    </div>
  </div>`},

{s:"Part III", t:"The first split", html:`
  <div class="eyebrow">Add and subtract the average model</div>
  <h2 style="margin-bottom:8px">Split one: peel off the variance</h2>
  <p style="font-size:18px;margin-bottom:2px">The target, averaged over inputs, targets <em>and</em> datasets:</p>
  <div class="eq" style="margin:2px 0 8px;font-size:23px"><span class="texd" data-tex="\\mathbb{E}_{p(x,t)}\\,\\mathbb{E}_{p(\\mathcal{D})}\\bigl[(y(x,\\mathcal{D}) - t)^2\\bigr]"></span></div>
  <p class="frag" data-f="0" style="font-size:18px;margin-bottom:2px">Add and subtract <span class="tex" data-tex="\\bar{y}(x)"></span> (nothing changes):</p>
  <div class="eq frag" data-f="0" style="margin:2px 0 8px;font-size:23px"><span class="texd" data-tex="= \\mathbb{E}_{p(x,t)}\\,\\mathbb{E}_{p(\\mathcal{D})}\\bigl[\\bigl(\\underbrace{y(x,\\mathcal{D}) - \\bar{y}(x)}_{a} + \\underbrace{\\bar{y}(x) - t}_{b}\\bigr)^2\\bigr]"></span></div>
  <p class="frag" data-f="1" style="font-size:18px;margin-bottom:2px">Expand the square:</p>
  <div class="eq frag" data-f="1" style="margin:2px 0 6px;font-size:21px"><span class="texd" data-tex="= \\underbrace{\\textcolor{#3F7F62}{\\mathbb{E}_{p(x)}\\mathbb{E}_{p(\\mathcal{D})}\\bigl[(y - \\bar{y})^2\\bigr]}}_{\\textcolor{#3F7F62}{\\textbf{variance}}} + \\mathbb{E}_{p(x,t)}\\bigl[(\\bar{y} - t)^2\\bigr] + 2\\,\\mathbb{E}_{p(x,t)}\\mathbb{E}_{p(\\mathcal{D})}\\bigl[(y - \\bar{y})(\\bar{y} - t)\\bigr]"></span></div>
  <div class="card accent frag" data-f="2" style="margin-top:6px;padding:9px 16px">
    <p style="font-size:17px;max-width:none">The cross term <strong>vanishes</strong>. <span class="tex" data-tex="(\\bar{y} - t)"></span> does not depend on
    <span class="tex" data-tex="\\mathcal{D}"></span>, so take the dataset average inside: <span class="tex" data-tex="\\mathbb{E}_{p(\\mathcal{D})}[y(x,\\mathcal{D})] - \\bar{y}(x)"></span>, which is zero by definition.</p>
  </div>`},

{s:"Part III", t:"The second split", html:`
  <div class="eyebrow">Add and subtract the best constant</div>
  <h2 style="margin-bottom:8px">Split two: separate bias from noise</h2>
  <p style="font-size:18px;margin-bottom:2px">Left over from split one: <span class="tex" data-tex="\\mathbb{E}_{p(x,t)}[(\\bar{y} - t)^2]"></span>. Same trick, now with <span class="tex" data-tex="\\bar{t}(x)"></span>:</p>
  <div class="eq" style="margin:2px 0 8px;font-size:23px"><span class="texd" data-tex="\\mathbb{E}_{p(x,t)}\\bigl[(\\bar{y}(x) - t)^2\\bigr] = \\mathbb{E}_{p(x)}\\,\\mathbb{E}_{p(t \\mid x)}\\bigl[\\bigl(\\bar{y}(x) - \\bar{t}(x) + \\bar{t}(x) - t\\bigr)^2\\bigr]"></span></div>
  <p class="frag" data-f="0" style="font-size:18px;margin-bottom:2px">Expand:</p>
  <div class="eq frag" data-f="0" style="margin:2px 0 6px;font-size:21px"><span class="texd" data-tex="= \\underbrace{\\textcolor{#2E6DA4}{\\mathbb{E}_{p(x)}\\bigl[(\\bar{y} - \\bar{t})^2\\bigr]}}_{\\textcolor{#2E6DA4}{(\\textbf{bias})^2}} + \\underbrace{\\textcolor{#B03A31}{\\mathbb{E}_{p(x)}\\mathbb{E}_{p(t \\mid x)}\\bigl[(\\bar{t} - t)^2\\bigr]}}_{\\textcolor{#B03A31}{\\textbf{noise}}} + 2\\,\\mathbb{E}_{p(x)}\\mathbb{E}_{p(t \\mid x)}\\bigl[(\\bar{y} - \\bar{t})(\\bar{t} - t)\\bigr]"></span></div>
  <div class="card frag" data-f="1" style="margin-top:6px;padding:9px 16px">
    <p style="font-size:17px;max-width:none">This cross term <strong>vanishes</strong> too. Hint: <span class="tex" data-tex="(\\bar{y}(x) - \\bar{t}(x))"></span> does
    not depend on <span class="tex" data-tex="t"></span>, so pull it out of the inner average &#8212; then look at <span class="tex" data-tex="\\mathbb{E}_{p(t \\mid x)}[\\bar{t}(x) - t]"></span>.
    <strong>Two lines; yours to write.</strong></p>
  </div>`},

{s:"Part III", t:"The decomposition", html:`
  <div class="eyebrow">Put the two splits together</div>
  <h2 style="margin-bottom:12px">Three terms</h2>
  <div class="eq" style="margin:12px 0 18px;font-size:22px"><span class="texd" data-tex="\\mathbb{E}\\bigl[(y(x,\\mathcal{D}) - t)^2\\bigr] = \\underbrace{\\textcolor{#2E6DA4}{\\mathbb{E}\\bigl[(\\bar{y}(x) - \\bar{t}(x))^2\\bigr]}}_{\\textcolor{#2E6DA4}{(\\text{bias})^2}} + \\underbrace{\\textcolor{#3F7F62}{\\mathbb{E}\\bigl[(y(x,\\mathcal{D}) - \\bar{y}(x))^2\\bigr]}}_{\\textcolor{#3F7F62}{\\text{variance}}} + \\underbrace{\\textcolor{#B03A31}{\\mathbb{E}\\bigl[(\\bar{t}(x) - t)^2\\bigr]}}_{\\textcolor{#B03A31}{\\text{noise}}}"></span></div>
  <div class="row top stretch" style="gap:18px">
    <div class="col card frag" data-f="0">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s1)">(bias)&#178;</div>
      <p style="font-size:19px;max-width:none">Wrong on average. Shrinks if the family can express the
      truth. <strong>More data does not help.</strong></p>
    </div>
    <div class="col card frag" data-f="1">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s4)">variance</div>
      <p style="font-size:19px;max-width:none">Unstable across datasets. Shrinks with more data, or a
      more constrained model.</p>
    </div>
    <div class="col card frag" data-f="2">
      <div class="eyebrow" style="margin-bottom:8px;color:var(--s2)">noise</div>
      <p style="font-size:19px;max-width:none">The floor. Contains no <span class="tex" data-tex="y"></span>, so nothing you choose touches it.</p>
    </div>
  </div>
  <p class="caption frag" data-f="3" style="margin-top:14px">An identity, not an approximation &#8212; for
  squared loss.</p>`},

{s:"Part III", t:"What it does not say", html:`
  <div class="eyebrow">What the decomposition is for</div>
  <h2 style="margin-bottom:14px">An explanatory tool</h2>
  <div class="card accent" style="padding:13px 20px">
    <p style="font-size:19.5px;max-width:none"><strong>What it is:</strong> a way of saying where an error comes
    from &#8212; the <span style="color:var(--s1)">family</span> (bias), the
    <span style="color:var(--s4)">sample</span> (variance), or the <span style="color:var(--s2)">world</span>
    (noise). The next slides use it to read how error changes with model complexity.</p>
  </div>
  <div class="dgrid frag" data-f="0" style="grid-template-columns:auto minmax(0,1fr);gap:13px 24px;margin-top:16px">
    <div style="font-size:19.5px"><strong>Not computable</strong></div>
    <div style="font-size:19px"><span class="tex" data-tex="\\bar{y}(x)"></span> needs datasets you never had; <span class="tex" data-tex="\\bar{t}(x)"></span> needs repeated targets at one input.</div>
    <div class="frag" data-f="1" style="font-size:19.5px"><strong>Not general</strong></div>
    <div class="frag" data-f="1" style="font-size:19px">An identity for <strong>squared loss</strong>.
    0&#8211;1 loss has no clean three-way split.</div>
    <div class="frag" data-f="2" style="font-size:19.5px"><strong>Not a law that complexity hurts</strong></div>
    <div class="frag" data-f="2" style="font-size:19px">The U shape is what an experiment measures, not a
    theorem.</div>
  </div>`},

{s:"Part III", t:"One term at a time", draw:"bvk5", html:`
  <div class="eyebrow">Live demo &#183; isolate each piece</div>
  <h2 style="margin-bottom:4px">Three terms, looked at separately</h2>
  <div class="eq" style="margin:0 0 6px;font-size:19px"><span class="texd" data-tex="\\mathbb{E}\\bigl[(y-t)^2\\bigr] = \\textcolor{#2E6DA4}{(\\text{bias})^2} + \\textcolor{#3F7F62}{\\text{variance}} + \\textcolor{#B03A31}{\\text{noise}}"></span></div>
  <div class="demo">
    <div class="demo-plot"><svg id="bvk5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none">One picture per term. Switch the term; switch the model
      between <strong>simple</strong> and <strong>flexible</strong>; watch which ones move.</p>
      <div style="display:flex;gap:8px;margin:9px 0;flex-wrap:wrap">
        <button class="bbtn sel" id="bvkb" type="button">bias</button>
        <button class="bbtn" id="bvkv" type="button">variance</button>
        <button class="bbtn" id="bvkn" type="button">noise</button>
      </div>
      <div style="display:flex;gap:8px;margin:0 0 9px;flex-wrap:wrap">
        <button class="bbtn sel" id="bvkl" type="button">simple &#183; M = 1</button>
        <button class="bbtn" id="bvkh" type="button">flexible &#183; M = 9</button>
      </div>
      <div class="warn" id="bvkwarn" style="min-height:96px"></div>
    </div>
  </div>`},

{s:"Part III", t:"Low and high, side by side", draw:"cl1", html:`
  <div class="eyebrow">Estimate first, then reveal</div>
  <h2 style="margin-bottom:14px">Where is each term large, and where small?</h2>
  <table style="font-size:19px">
    <thead><tr><th style="width:18%%"></th><th style="width:41%%">Simple &#183; M = 1</th><th style="width:41%%">Flexible &#183; M = 9</th></tr></thead>
    <tbody>
      <tr><td><strong style="color:var(--s1)">Bias&#178;</strong></td>
          <td><div class="frag" data-f="0"><svg id="cl1" viewBox="0 0 150 74" style="width:100%%;max-width:200px;display:block;margin:0 0 7px"></svg><strong>Large.</strong> A line cannot be a sine; the average misses the same way every time.</div></td>
          <td><div class="frag" data-f="1"><svg id="cl9" viewBox="0 0 150 74" style="width:100%%;max-width:200px;display:block;margin:0 0 7px"></svg><strong>Small.</strong> The family can express the truth; on average it does.</div></td></tr>
      <tr><td><strong style="color:var(--s4)">Variance</strong></td>
          <td><div class="frag" data-f="2"><svg id="cv1" viewBox="0 0 150 74" style="width:100%%;max-width:200px;display:block;margin:0 0 7px"></svg><strong>Small.</strong> Whichever points you draw, a line through them looks much the same.</div></td>
          <td><div class="frag" data-f="3"><svg id="cv9" viewBox="0 0 150 74" style="width:100%%;max-width:200px;display:block;margin:0 0 7px"></svg><strong>Large.</strong> The curve chases whichever points it was given.</div></td></tr>
      <tr><td><strong style="color:var(--s2)">Noise</strong></td>
          <td colspan="2" style="text-align:center"><div class="frag" data-f="4"><strong>Identical.</strong> No model in it, so no model can touch it.</div></td></tr>
    </tbody>
  </table>
  <p class="caption frag" data-f="5" style="margin-top:14px">Simple: beaten by bias. Flexible: beaten by
  variance. The useful models are in between.</p>`},

{s:"Part III", t:"How the three combine", draw:"bvi5", html:`
  <div class="eyebrow">Live demo &#183; the shape of the argument</div>
  <h2 style="margin-bottom:8px">Add them up</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bvi5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none">Idealised curves, one term at a time, then the sum.</p>
      <div style="margin:11px 0 4px;text-align:center;font-size:19px"><span class="texd" data-tex="\\mathbb{E}\\bigl[(y-t)^2\\bigr] = \\underbrace{\\textcolor{#2E6DA4}{(\\text{bias})^2}}_{\\text{falls}} + \\underbrace{\\textcolor{#3F7F62}{\\text{variance}}}_{\\text{climbs}} + \\underbrace{\\textcolor{#B03A31}{\\text{noise}}}_{\\text{flat}}"></span></div>
      <div style="display:flex;gap:8px;margin:9px 0;flex-wrap:wrap">
        <button class="bbtn sel" id="bvi0" type="button">axes</button>
        <button class="bbtn" id="bvi1" type="button">+ bias&#178;</button>
        <button class="bbtn" id="bvi2" type="button">+ variance</button>
        <button class="bbtn" id="bvi3" type="button">+ noise</button>
        <button class="bbtn" id="bvi4" type="button">the sum</button>
      </div>
      <div class="warn" id="bviwarn" style="min-height:96px"></div>
      <p class="caption" style="margin-top:7px;font-size:14px">Drawn, not measured. The next slide is the
      same picture, computed.</p>
    </div>
  </div>`},

{s:"Part III", t:"The trade-off, measured", draw:"bvc5", html:`
  <div class="eyebrow">Live demo &#183; the three terms, computed</div>
  <h2 style="margin-bottom:8px">Bias falls, variance climbs</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="bvc5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none">The same experiment at every degree: two thousand datasets,
      the average model against the truth, the fits against the average.</p>
      <div class="warn" id="bvcwarn" style="min-height:96px"></div>
      <p class="caption" style="margin-top:10px;font-size:15px">The minimum is at neither end.</p>
    </div>
  </div>`},

{s:"Part III", t:"Two ways to be wrong", draw:"bvr5", html:`
  <div class="eyebrow">The two ends of that curve</div>
  <h2 style="margin-bottom:8px">Underfitting and overfitting, named on the picture</h2>
  <div class="row top" style="gap:22px">
    <div class="col" style="flex:1.3">
      <div class="fig" style="background:transparent;box-shadow:none;padding:0">
        <svg id="bvr5" viewBox="0 0 560 330" style="width:100%%;display:block"></svg>
      </div>
    </div>
    <div class="col">
      <div class="card" style="padding:12px 16px">
        <div class="eyebrow" style="margin-bottom:6px;color:var(--s1)">Underfitting</div>
        <p style="font-size:18px;max-width:none">Family too simple. Every fit misses the same way.
        <strong>High bias, low variance.</strong><br>More data will not help.</p>
      </div>
      <div class="card frag" data-f="0" style="padding:12px 16px;margin-top:12px">
        <div class="eyebrow" style="margin-bottom:6px;color:var(--s4)">Overfitting</div>
        <p style="font-size:18px;max-width:none">Family chases the noise, differently each time.
        <strong>Low bias, high variance.</strong><br>More data <em>does</em> help.</p>
      </div>
      <p class="caption frag" data-f="1" style="margin-top:12px;font-size:16px">From outside both look like
      &#8220;the model is bad&#8221;. Opposite cures.</p>
    </div>
  </div>`},

{s:"Part III", t:"Part III, in one picture", draw:"bvr5b", html:`
  <div class="eyebrow">Summary of Part III</div>
  <h2 style="margin-bottom:8px">The trade-off, in one picture</h2>
  <div class="row top" style="gap:22px">
    <div class="col" style="flex:1.3">
      <div class="fig" style="background:transparent;box-shadow:none;padding:0">
        <svg id="bvr5b" viewBox="0 0 560 330" style="width:100%;display:block"></svg>
      </div>
    </div>
    <div class="col">
      <div class="eq" style="margin:0 0 10px;font-size:19px"><span class="texd" data-tex="\\mathbb{E}\\bigl[(y-t)^2\\bigr] = \\textcolor{#2E6DA4}{(\\text{bias})^2} + \\textcolor{#3F7F62}{\\text{variance}} + \\textcolor{#B03A31}{\\text{noise}}"></span></div>
      <p style="font-size:18px;max-width:none"><span style="color:var(--s1)"><strong>Bias&#178;</strong></span> falls as the
      family gets richer. <span style="color:var(--s4)"><strong>Variance</strong></span> climbs.
      <span style="color:var(--s2)"><strong>Noise</strong></span> is flat.</p>
      <p style="font-size:18px;max-width:none;margin-top:10px">Left of the minimum: <strong>underfitting</strong> &#8212;
      high bias, more data will not help. Right: <strong>overfitting</strong> &#8212; high variance, more data will.</p>
    </div>
  </div>`},

{s:"Part III", t:"Which term moves?", html:`
  <div class="eyebrow">Test your understanding</div>
  <h2 style="margin-bottom:12px">Four moves. For each term: decrease, increase, or unchanged?</h2>
  <table style="font-size:19px">
    <thead><tr><th style="width:34%">Move</th><th style="width:22%;color:var(--s1)">Bias&#178;</th><th style="width:22%;color:var(--s4)">Variance</th><th style="width:22%;color:var(--s2)">Noise</th></tr></thead>
    <tbody>
      <tr><td><strong>1 &#183; More data</strong></td>
          <td><div class="frag" data-f="0"><span class="dim">unchanged</span></div></td><td><div class="frag" data-f="1"><strong>&#8595; decreases</strong></div></td><td><div class="frag" data-f="2"><span class="dim">unchanged</span></div></td></tr>
      <tr><td><strong>2 &#183; Simplify the model</strong><br><span class="dim">fewer parameters, or a prior that pulls them in</span></td>
          <td><div class="frag" data-f="3"><strong>&#8593; increases</strong> <span class="dim">(usually)</span></div></td><td><div class="frag" data-f="4"><strong>&#8595; decreases</strong></div></td><td><div class="frag" data-f="5"><span class="dim">unchanged</span></div></td></tr>
      <tr><td><strong>3 &#183; Enrich the model</strong><br><span class="dim">more features, a nonlinear family</span></td>
          <td><div class="frag" data-f="6"><strong>&#8595; decreases</strong></div></td><td><div class="frag" data-f="7"><strong>&#8593; increases</strong> <span class="dim">(usually)</span></div></td><td><div class="frag" data-f="8"><span class="dim">unchanged</span></div></td></tr>
      <tr><td><strong>4 &#183; Average many fits</strong><br><span class="dim">resample, refit, average the predictions</span></td>
          <td><div class="frag" data-f="9"><span class="dim">unchanged</span></div></td><td><div class="frag" data-f="10"><strong>&#8595; decreases</strong></div></td><td><div class="frag" data-f="11"><span class="dim">unchanged</span></div></td></tr>
    </tbody>
  </table>
  <p class="caption frag" data-f="12" style="margin-top:14px">Regularisation is move 2 &#8212; Week 2&#8217;s prior,
  Week 4&#8217;s pseudo-counts. Tomorrow&#8217;s tutorial.</p>`},

{s:"Part IV", t:"Part IV", div:true, html:`
  <div class="divider">
    <div class="part">Part IV</div>
    <h1>Cross-validation</h1>
    <div class="bar"></div>
    <div class="sub">How to choose model hyperparameters.</div>
  </div>`},

{s:"Part IV", t:"What cross-validation is", draw:"cvi5", html:`
  <div class="eyebrow">Reminder &#183; in one picture</div>
  <h2 style="margin-bottom:6px">Choosing a degree you cannot choose by training error</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0;margin-bottom:6px">
    <svg id="cvi5" viewBox="0 0 960 300" style="width:100%%;display:block"></svg>
  </div>
  <div class="row top" style="gap:20px;align-items:flex-start">
    <div class="col" style="flex:1.3"><div class="warn" id="cviwarn" style="min-height:64px;margin-top:0"></div></div>
    <div class="col">
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <button class="bbtn sel" id="cvi0" type="button">1 &#183; the data</button>
        <button class="bbtn" id="cvi1" type="button">2 &#183; hold each fold out</button>
        <button class="bbtn" id="cvi2" type="button">3 &#183; average</button>
        <button class="bbtn" id="cvi3" type="button">4 &#183; every M, pick the smallest</button>
      </div>
    </div>
  </div>`},

{s:"Part IV", t:"Hold some out", draw:"cvf5", html:`
  <div class="eyebrow">Live demo</div>
  <h2 style="margin-bottom:8px">One fold at a time</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="cvf5" viewBox="0 0 560 330"></svg></div>

      <p style="font-size:17.5px;max-width:none"><span class="tex" data-tex="N = 14"></span> data points, <span class="tex" data-tex="K = 5"></span> folds. Each row of the strip is one

        <button class="bbtn sel" id="cvf0" type="button">fold 1</button>
        <button class="bbtn" id="cvf1" type="button">2</button>
        <button class="bbtn" id="cvf2" type="button">3</button>

{s:"Part IV", t:"What cross-validation picks", draw:"cvc5", html:`
  <div class="eyebrow">Live demo &#183; the score against the true generalisation error</div>
  <h2 style="margin-bottom:8px">Cross-validation picks a good degree</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="cvc5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none">Five folds at every degree, averaged. Solid: computable
      from the data alone. Dashed: the true generalisation error &#8212; known here only because we made
      the data.</p>
      <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">
        <button class="bbtn sel" id="cvn14" type="button">N = 14</button>
        <button class="bbtn" id="cvn30" type="button">N = 30</button>
      </div>
      <div class="warn" id="cvcwarn" style="min-height:112px"></div>

  </div>`},

{s:"Part IV", t:"What it costs and what it misses", html:`
  <div class="eyebrow">Caveats</div>
  <h2 style="margin-bottom:14px">Cross-validation, with the caveats</h2>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:15px 24px">
    <div style="font-size:20px"><strong>Not free</strong></div>
    <div style="font-size:19.5px"><span class="tex" data-tex="K"></span> fits instead of one.</div>
    <div class="frag" data-f="0" style="font-size:20px"><strong>Slightly pessimistic</strong></div>
    <div class="frag" data-f="0" style="font-size:19.5px">The score estimates the error of a model fitted on
    <span class="tex" data-tex="(K-1)/K"></span> of the data. The model you ship is fitted on all of it and usually does a little better, so the
    score tends to <em>overestimate</em> its error.</div>
    <div class="frag" data-f="1" style="font-size:20px"><strong>Noisy</strong></div>
    <div class="frag" data-f="1" style="font-size:19.5px">The score is a random quantity: a different split
    gives a different number.</div>
    <div class="frag" data-f="2" style="font-size:20px"><strong>The winning score is no longer honest</strong></div>
    <div class="frag" data-f="2" style="font-size:19.5px">You picked the degree <em>because</em> its score was
    lowest, so that score now understates its error. For an honest number, score the chosen model once more
    on data that played no part in the choice &#8212; a <strong>test set</strong>.</div>
  </div>`},

{s:"Part IV", t:"Why does this work?", html:`
  <div class="eyebrow">The question</div>
  <h2 style="margin-bottom:16px">Why does this work?</h2>
  <p style="font-size:22px">Cross-validation is a <strong>selection</strong>: score ten candidates, take the
  smallest.</p>
  <p class="frag" data-f="0" style="font-size:22px;margin-top:14px">Selections chase luck. The candidate
  with the friendliest split looks best. Why should the winner be any good?</p>
  <div class="card accent frag" data-f="1" style="margin-top:20px;padding:14px 20px">
    <p style="font-size:20px;max-width:none"><strong>Plan.</strong> Name the bad event &#8594; one tool
    (Hoeffding) &#8594; one bookkeeping step (union bound) &#8594; the guarantee. Same machinery as next
    week.</p>
  </div>`},

{s:"Part IV", t:"What we analyse", html:`
  <div class="eyebrow">The version we analyse</div>
  <h2 style="margin-bottom:14px">Choosing with one validation set</h2>
  <div class="row top stretch" style="gap:14px">
    <div class="col card" style="padding:12px 16px">
      <div class="eyebrow" style="margin-bottom:6px">1 &#183; Split</div>
      <p style="font-size:18px;max-width:none">Hold out <span class="tex" data-tex="V"></span> of the <span class="tex" data-tex="N"></span> points. Fit on the rest. The <span class="tex" data-tex="V"></span> held-out points
      are touched only for scoring.</p>
    </div>
    <div class="col card frag" data-f="0" style="padding:12px 16px">
      <div class="eyebrow" style="margin-bottom:6px">2 &#183; Score</div>
      <p style="font-size:18px;max-width:none">Fit every candidate <span class="tex" data-tex="h_0, \\ldots, h_M"></span> on the training part. Score each one on the held-out
      part: the average loss over the <span class="tex" data-tex="V"></span> points, <span class="tex" data-tex="\\widehat{R}(h_j)"></span>.</p>
    </div>
    <div class="col card frag" data-f="1" style="padding:12px 16px">
      <div class="eyebrow" style="margin-bottom:6px">3 &#183; Pick</div>
      <p style="font-size:18px;max-width:none">Take the candidate with the smallest score:</p>
      <div class="eq" style="margin:6px 0 0;font-size:20px"><span class="texd" data-tex="\\hat{\\jmath} = \\arg\\min_j\\; \\widehat{R}(h_j)"></span></div>
    </div>
  </div>
  <div class="card accent frag" data-f="2" style="margin-top:16px;padding:12px 20px">
    <p style="font-size:19px;max-width:none">This is cross-validation with <span class="tex" data-tex="K = 1"></span>: one fold, held out once. It is the case we can
    analyse today. <span class="tex" data-tex="K"></span>-fold reuses every point and averages <span class="tex" data-tex="K"></span> scores; its analysis needs more (reading at the end of Part IV).</p>
  </div>`},

{s:"Part IV", t:"Setup", html:`
  <div class="eyebrow">Assumptions &#183; the simplest version, <span class="tex" data-tex="K = 1"></span></div>
  <h2 style="margin-bottom:12px">What we are given</h2>
  <div class="dgrid" style="grid-template-columns:auto minmax(0,1fr);gap:13px 24px">
    <div style="font-size:19.5px"><strong>Candidates</strong></div>
    <div style="font-size:19.5px"><span class="tex" data-tex="h_0, h_1, \\ldots, h_M"></span> &#8212; one per degree, so <span class="tex" data-tex="M+1"></span> of them &#8212; fixed <em>before</em> any
    validation data is seen</div>
    <div class="frag" data-f="0" style="font-size:19.5px"><strong>Validation data</strong></div>
    <div class="frag" data-f="0" style="font-size:19.5px"><span class="tex" data-tex="K = 1"></span>: <strong>one</strong> held-out set of <span class="tex" data-tex="V"></span> points, drawn
    independently from <span class="tex" data-tex="p(x,t)"></span> and used for scoring only. (<span class="tex" data-tex="K > 1"></span> folds is outside today&#8217;s analysis.)</div>
    <div class="frag" data-f="1" style="font-size:19.5px"><strong>Bounded loss</strong></div>
    <div class="frag" data-f="1" style="font-size:19.5px"><span class="tex" data-tex="\\ell \\in [0,1]"></span> &#8212; e.g. right or wrong. (Squared error on an
    unbounded target is <em>not</em> covered.)</div>
    <div class="frag" data-f="2" style="font-size:19.5px"><strong>Real risk</strong> (what we want)</div>
    <div class="eq frag" data-f="2" style="margin:0;text-align:left;font-size:22px"><span class="texd" data-tex="R(h) = \\mathbb{E}_{p(x,t)}\\bigl[\\ell(h(x), t)\\bigr]"></span></div>
    <div class="frag" data-f="2" style="font-size:19.5px"><strong>Validation score</strong> (what we can compute)</div>
    <div class="eq frag" data-f="2" style="margin:0;text-align:left;font-size:22px"><span class="texd" data-tex="\\widehat{R}(h) = \\frac{1}{V}\\sum_{i=1}^{V}\\ell\\bigl(h(x_i), t_i\\bigr)"></span></div>
  </div>`},

{s:"Part IV", t:"The bad event", html:`
  <div class="eyebrow">The goal, stated as an event</div>
  <h2 style="margin-bottom:14px">What would have to go wrong</h2>
  <p style="font-size:20px">A score is <strong>honest</strong> if it sits within <span class="tex" data-tex="\\varepsilon"></span> of the real risk. The
  <strong>bad event</strong> for candidate <span class="tex" data-tex="j"></span>:</p>
  <div class="eq" style="margin:12px 0 16px;font-size:26px"><span class="texd" data-tex="B_j = \\Bigl\\{\\,\\bigl|\\widehat{R}(h_j) - R(h_j)\\bigr| \\ge \\varepsilon\\,\\Bigr\\}"></span></div>
  <p class="frag" data-f="0" style="font-size:20px">Goal: make <em>every</em> score honest, except with small
  probability <span class="tex" data-tex="\\delta"></span>:</p>
  <div class="eq frag" data-f="0" style="margin:12px 0 16px;font-size:26px"><span class="texd" data-tex="\\Pr\\bigl(B_0 \\cup B_1 \\cup \\cdots \\cup B_M\\bigr) \\;\\le\\; \\delta"></span></div>
  <div class="warn frag" data-f="1" style="margin-top:8px;font-size:17px">If no bad event happens, the scores can be
  trusted &#8212; and then picking the smallest one is safe. We show that last. First: how likely is
  <em>one</em> bad event?</div>`},

{s:"Part IV", t:"Hot or Not", html:`
  <div class="eyebrow">A simpler question first &#183; hotornot.com, 2004</div>
  <h2 style="margin-bottom:8px">How many ratings before you trust the average?</h2>
  <div class="row top" style="gap:22px">
    <div class="col" style="flex:0.8"><img src="media/hotornot.png" alt="hotornot.com in 2004, via the Internet Archive" style="width:100%;border:1px solid var(--rule);border-radius:8px"></div>
    <div class="col" style="flex:1.35">
      <p style="font-size:18px;max-width:none">Each visitor rates a photo: <span class="tex" data-tex="t \\in \\{0, 1\\}"></span>. <span class="tex" data-tex="\\mu"></span> is the unknown fraction of the population
      that says <em>hot</em>. Estimate from <span class="tex" data-tex="V"></span> ratings: <span class="tex" data-tex="\\widehat{\\mu} = \\tfrac{1}{V}\\sum_i t_i"></span>.</p>
      <p class="frag" data-f="0" style="font-size:18px;max-width:none;margin-top:10px">Three sets of <span class="tex" data-tex="V = 20"></span> ratings of the same photo:</p>
      <div class="frag" data-f="0" style="margin-top:6px;font-size:17px;line-height:1.35">
        <div style="letter-spacing:.02em">&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293; &#128078;</div>
        <div class="dim" style="font-size:16px;margin-bottom:6px">count 19 &#183; estimate <span class="tex" data-tex="\\widehat{\\mu} = 0.95"></span></div>
      </div>
      <div class="frag" data-f="1" style="font-size:17px;line-height:1.35">
        <div style="letter-spacing:.02em">&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293; &#128078;&#128078;&#128078;&#128078;&#128078;&#128078;&#128078;&#128078;</div>
        <div class="dim" style="font-size:16px;margin-bottom:6px">count 12 &#183; estimate <span class="tex" data-tex="\\widehat{\\mu} = 0.60"></span></div>
      </div>
      <div class="frag" data-f="2" style="font-size:17px;line-height:1.35">
        <div style="letter-spacing:.02em">&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293;&#128293; &#128078;&#128078;&#128078;&#128078;</div>
        <div class="dim" style="font-size:16px;margin-bottom:6px">count 16 &#183; estimate <span class="tex" data-tex="\\widehat{\\mu} = 0.80"></span></div>
      </div>
      <p class="frag" data-f="3" style="font-size:18px;max-width:none;margin-top:8px">We made these with <span class="tex" data-tex="\\mu = 0.735"></span>. One estimate is
      far too high, one far too low, one close. Each set of ratings is a different dataset, and each dataset gives a
      different number.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Many samples", draw:"clt5", html:`
  <div class="eyebrow">The same photo, a thousand sets of ratings</div>
  <h2 style="margin-bottom:6px">The histogram of the estimates</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="clt5" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17px;max-width:none">1000 sets of <span class="tex" data-tex="V"></span> ratings, <span class="tex" data-tex="\\mu = 0.735"></span>. One estimate per set; the bars count them.</p>
      <div class="btn-row" style="margin-top:8px">
        <button class="bbtn" id="cltv5" type="button">V = 5</button>
        <button class="bbtn sel" id="cltv20" type="button">V = 20</button>
        <button class="bbtn" id="cltv100" type="button">V = 100</button>
      </div>
      <div class="btn-row" style="margin-top:7px">
        <button class="bbtn" id="cltg" type="button">overlay a Gaussian</button>
      </div>
      <div class="warn" id="cltwarn" style="min-height:72px"></div>
      <p style="font-size:18px;max-width:none;margin-top:10px"><strong>A bell. Which theorem is this?</strong></p>
      <p class="frag" data-f="0" style="font-size:16.5px;max-width:none;margin-top:6px">The <strong>central limit theorem</strong>:
      as <span class="tex" data-tex="V \\to \\infty"></span>, the distribution of <span class="tex" data-tex="\\sqrt{V}\\,(\\widehat{\\mu} - \\mu)"></span> converges to a Gaussian.</p>
      <p class="frag" data-f="1" style="font-size:16.5px;max-width:none;margin-top:6px">What does hold at every <span class="tex" data-tex="V"></span>: the variance of
      <span class="tex" data-tex="\\widehat{\\mu}"></span> is exactly <span class="tex" data-tex="\\mu(1-\\mu)/V"></span>.</p>
      <p class="caption frag" data-f="2" style="font-size:15px;margin-top:6px">At a finite <span class="tex" data-tex="V"></span> the Gaussian is an approximation, and
      the theorem itself does not say how good. Next, a guarantee that holds at every <span class="tex" data-tex="V"></span>.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Hoeffding, stated", html:`
  <div class="eyebrow">A guarantee at every V</div>
  <h2 style="margin-bottom:10px">How far can <span class="tex" data-tex="\\widehat{\\mu}"></span> be from <span class="tex" data-tex="\\mu"></span>?</h2>
  <p style="font-size:19.5px"><strong>Hoeffding&#8217;s inequality</strong> answers it, for an average of <span class="tex" data-tex="V"></span>
  independent draws in <span class="tex" data-tex="[0,1]"></span>:</p>
  <div class="eq" style="margin:10px 0 18px;font-size:30px"><span class="texd" data-tex="\\Pr\\bigl(|\\widehat{\\mu} - \\mu| > \\varepsilon\\bigr) \\;\\le\\; 2\\exp(-2V\\varepsilon^2)"></span></div>
  <div class="dgrid frag" data-f="0" style="grid-template-columns:auto minmax(0,1fr);gap:12px 24px">
    <div style="font-size:19px"><strong>No approximation</strong></div>
    <div style="font-size:19px">Holds at <span class="tex" data-tex="V = 20"></span> exactly as it holds at <span class="tex" data-tex="V = 20{,}000"></span>. The Gaussian on the previous slide is an
    approximation; this inequality is exact.</div>
    <div class="frag" data-f="1" style="font-size:19px"><strong>No distribution</strong></div>
    <div class="frag" data-f="1" style="font-size:19px">Only that the draws are independent and bounded, <span class="tex" data-tex="t_i \\in [0,1]"></span>.</div>
    <div class="frag" data-f="2" style="font-size:19px"><strong>The price</strong></div>
    <div class="frag" data-f="2" style="font-size:19px">It is an upper bound on a probability, and it can be loose.</div>
  </div>
  <div class="card accent frag" data-f="3" style="margin-top:18px;padding:12px 20px">
    <p style="font-size:19px;max-width:none">A validation score is the same object: an average of <span class="tex" data-tex="V"></span> bounded draws,
    <span class="tex" data-tex="\\ell(h(x_i), t_i) \\in [0,1]"></span>, around a number we cannot see, the real risk <span class="tex" data-tex="R(h)"></span>.</p>
  </div>`},

{s:"Part IV", t:"Hoeffding", draw:"hoef5", html:`
  <div class="eyebrow">Live demo &#183; the tool</div>
  <h2 style="margin-bottom:8px">Hoeffding&#8217;s inequality</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="hoef5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17px;max-width:none">An average of <span class="tex" data-tex="V"></span> independent quantities in <span class="tex" data-tex="[0,1]"></span> stays close to
      its expectation:</p>
      <div class="eq" style="margin:6px 0 8px;font-size:20px"><span class="texd" data-tex="\\Pr\\bigl(|\\text{mean} - \\mathbb{E}| \\ge \\varepsilon\\bigr) \\le 2e^{-2V\\varepsilon^2}"></span></div>
      <p style="font-size:16.5px;max-width:none">No assumption about the distribution &#8212; only that it is
      bounded. The picture uses right/wrong on a model with real risk <span class="tex" data-tex="R = 0.30"></span>.</p>
      <div class="ctrl-row" style="margin-top:6px"><label>validation points V <span class="val" id="hfmv">200</span></label>
        <input type="range" id="hfmr" min="20" max="2000" step="20" value="200"></div>
      <div class="ctrl-row"><label>&#949; <span class="val" id="hfev">0.10</span></label>
        <input type="range" id="hfer" min="0.02" max="0.30" step="0.01" value="0.10"></div>
      <div id="hfbound" style="text-align:center;font-size:23px;margin:8px 0 4px"></div>
      <div class="warn" id="hfwarn" style="min-height:72px"></div>
    </div>
  </div>`},

{s:"Part IV", t:"An upper bound can be vacuous", html:`
  <div class="eyebrow">When V grows, or the tolerance shrinks</div>
  <h2 style="margin-bottom:10px">It is only an upper bound</h2>
  <div class="row top" style="gap:24px">
    <div class="col" style="flex:1.1">
      <div class="eq" style="margin:4px 0 12px;font-size:23px"><span class="texd" data-tex="\\Pr\\bigl(|\\widehat{\\mu} - \\mu| > \\varepsilon\\bigr) \\le 2\\exp(-2V\\varepsilon^2)"></span></div>
      <table style="font-size:20px">
        <thead><tr><th style="width:30%"></th><th style="width:35%"><span class="tex" data-tex="V = 200"></span></th><th style="width:35%"><span class="tex" data-tex="V = 20{,}000"></span></th></tr></thead>
        <tbody>
          <tr><td><span class="tex" data-tex="\\varepsilon = 0.1"></span></td><td><div class="frag" data-f="0">0.04</div></td><td><div class="frag" data-f="2">&#8776; 0</div></td></tr>
          <tr><td><span class="tex" data-tex="\\varepsilon = 0.01"></span></td><td><div class="frag" data-f="1"><strong>1.92</strong></div></td><td><div class="frag" data-f="3">0.04</div></td></tr>
        </tbody>
      </table>
      <p class="frag" data-f="4" style="font-size:18px;max-width:none;margin-top:12px">1.92 is a true statement about a
      probability. It is also useless. A tolerance ten times tighter needs a hundred times the ratings before
      the bound says anything at all.</p>
    </div>
    <div class="col" style="flex:0.9"><img src="media/sherlock.png" class="frag" data-f="1" alt="Probability of event less than 1.92 — no shit, Sherlock" style="width:100%;border-radius:8px"></div>
  </div>`},

{s:"Part IV", t:"Hoeffding, applied", html:`
  <div class="eyebrow">The tool, on our problem</div>
  <h2 style="margin-bottom:10px">One candidate: the bad event is rare</h2>
  <div class="dgrid" style="grid-template-columns:auto auto minmax(0,1fr);gap:6px 18px">
    <div style="font-size:18px">score</div><div class="eq" style="margin:0;text-align:left;font-size:21px"><span class="texd" data-tex="\\widehat{R}(h_j) = \\tfrac{1}{V}\\sum_{i=1}^{V} \\ell(h_j(x_i), t_i)"></span></div><div class="dnote" style="font-size:16px">an average of <span class="tex" data-tex="V"></span> losses, each in <span class="tex" data-tex="[0,1]"></span></div>
    <div style="font-size:18px">real risk</div><div class="eq" style="margin:0;text-align:left;font-size:21px"><span class="texd" data-tex="R(h_j) = \\mathbb{E}_{p(x,t)}[\\ell(h_j(x), t)]"></span></div><div class="dnote" style="font-size:16px">the expectation of one such loss</div>
  </div>
  <p class="frag" data-f="0" style="font-size:18.5px;margin-top:10px"><strong>Why the losses are independent draws:</strong> <span class="tex" data-tex="h_j"></span>
  was fitted without the validation points. So, given <span class="tex" data-tex="h_j"></span>, each <span class="tex" data-tex="\\ell(h_j(x_i), t_i)"></span> is a fresh draw with mean <span class="tex" data-tex="R(h_j)"></span>
  &#8212; regardless of how <span class="tex" data-tex="h_j"></span> was fitted.</p>
  <div class="eq frag" data-f="1" style="margin:10px 0 12px;font-size:26px"><span class="texd" data-tex="\\Pr(B_j) = \\Pr\\Bigl(\\bigl|\\widehat{R}(h_j) - R(h_j)\\bigr| \\ge \\varepsilon\\Bigr) \\;\\le\\; 2e^{-2V\\varepsilon^2}"></span></div>`},

{s:"Part IV", t:"The bound against V", draw:"hfv5", html:`
  <div class="eyebrow">Live demo &#183; what V and the tolerance do</div>
  <h2 style="margin-bottom:6px">The bound, as a function of V</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="hfv5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:2px 0 8px;font-size:22px"><span class="texd" data-tex="\\Pr(B_j) \\;\\le\\; 2e^{-2V\\varepsilon^2}"></span></div>
      <div class="ctrl-row"><label>&#949; <span class="val" id="hfvev">0.10</span></label>
        <input type="range" id="hfver" min="0.02" max="0.30" step="0.01" value="0.10"></div>
      <div class="warn" id="hfvwarn" style="min-height:96px"></div>
      <p style="font-size:16.5px;max-width:none;margin-top:8px"><strong>More data</strong>: <span class="tex" data-tex="V"></span> is in the exponent. Doubling <span class="tex" data-tex="V"></span>
      squares <span class="tex" data-tex="e^{-2V\\varepsilon^2}"></span>, a number below 1, so the bound collapses.</p>
      <p style="font-size:16.5px;max-width:none;margin-top:6px"><strong>Tighter tolerance</strong>: so is <span class="tex" data-tex="\\varepsilon^2"></span>. Halving <span class="tex" data-tex="\\varepsilon"></span> costs
      four times the data for the same confidence &#8212; the whole curve slides right by a factor of four.</p>
    </div>
  </div>`},

{s:"Part IV", t:"Not done yet", html:`
  <div class="eyebrow">The gap between one and many</div>
  <h2 style="margin-bottom:16px">One honest score is not enough</h2>
  <p style="font-size:21px">We will compare <strong>all <span class="tex" data-tex="M+1"></span></strong> scores. One dishonest score anywhere on
  the list can win.</p>
  <p class="frag" data-f="0" style="font-size:21px;margin-top:14px">So the event to control is
  &#8220;<em>any</em> of them is bad&#8221;:</p>
  <div class="eq frag" data-f="0" style="margin:12px 0 16px;font-size:27px"><span class="texd" data-tex="\\Pr\\bigl(B_0 \\cup \\cdots \\cup B_M\\bigr) = \\;?"></span></div>
  <div class="warn frag" data-f="1" style="margin-top:8px;font-size:17px">We have each <span class="tex" data-tex="\\Pr(B_j)"></span> separately. We need
  their union. That is a question about overlapping events.</div>`},

{s:"Part IV", t:"The union bound", draw:"union5", html:`
  <div class="eyebrow">Live demo &#183; the bookkeeping step</div>
  <h2 style="margin-bottom:8px">The union bound</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="union5" viewBox="0 0 560 330"></svg></div>
    <div class="demo-ctrl">
      <p style="font-size:17.5px;max-width:none">The probability that <em>at least one</em> of several events
      happens is at most the sum of their probabilities:</p>
      <div class="eq" style="margin:6px 0 8px;font-size:21px"><span class="texd" data-tex="\\Pr\\Bigl(\\textstyle\\bigcup_{j} B_j\\Bigr) \\le \\sum_{j} \\Pr(B_j)"></span></div>
      <p style="font-size:16.5px;max-width:none">Overlaps get counted more than once, so the sum can only be
      too big. Equality exactly when the events are <strong>mutually exclusive</strong> &#8212; no two can happen
      together.</p>
      <p style="font-size:16.5px;max-width:none;margin-top:6px">It assumes nothing else. In particular <strong>no
      independence</strong>: every candidate is scored on the same validation set, so these events are far from
      independent, and the step still holds.</p>
      <div class="ctrl-row" style="margin-top:6px"><label>number of events <span class="val" id="unmv">3</span></label>
        <input type="range" id="unmr" min="1" max="8" step="1" value="3"></div>
      <div class="warn" id="unwarn" style="min-height:96px"></div>
    </div>
  </div>`},

{s:"Part IV", t:"Union bound, applied", html:`
  <div class="eyebrow">The bookkeeping, on our problem</div>
  <h2 style="margin-bottom:14px">All <span class="tex" data-tex="M+1"></span> candidates at once</h2>
  <div class="eq" style="margin:12px 0 12px;font-size:26px"><span class="texd" data-tex="\\Pr\\bigl(B_0 \\cup \\cdots \\cup B_M\\bigr) \\;\\le\\; \\sum_{j=0}^{M} 2e^{-2V\\varepsilon^2} \\;=\\; 2(M+1)\\, e^{-2V\\varepsilon^2}"></span></div>
  <p class="frag" data-f="0" style="font-size:20px">Set this to <span class="tex" data-tex="\\delta"></span> and solve for the tolerance:</p>
  <div class="eq frag" data-f="0" style="margin:12px 0 12px;font-size:28px"><span class="texd" data-tex="\\varepsilon = \\sqrt{\\frac{\\ln\\bigl(2(M+1)/\\delta\\bigr)}{2V}}"></span></div>
  <div class="card accent frag" data-f="1" style="margin-top:12px;padding:12px 20px">
    <p style="font-size:20px;max-width:none">With probability at least <span class="tex" data-tex="1-\\delta"></span>, <strong>every</strong> score is
    within <span class="tex" data-tex="\\varepsilon"></span> of its real risk. All <span class="tex" data-tex="M+1"></span> of them, simultaneously:</p>
    <div class="eq" style="margin:8px 0 0;font-size:24px"><span class="texd" data-tex="R(h_j) - \\varepsilon \\;\\le\\; \\widehat{R}(h_j) \\;\\le\\; R(h_j) + \\varepsilon \\qquad \\text{for every } j"></span></div>
  </div>`},

{s:"Part IV", t:"The guarantee", html:`
  <div class="eyebrow">The guarantee, in three lines</div>
  <h2 style="margin-bottom:10px">What the winner is worth</h2>
  <p style="font-size:19px">Suppose no bad event happened: every score is within <span class="tex" data-tex="\\varepsilon"></span> of its real risk, <strong>in both
  directions</strong>. <span class="tex" data-tex="h_{\\hat{\\jmath}}"></span>: our pick, the smallest score. <span class="tex" data-tex="h_{j^*}"></span>: the truly best candidate.</p>
  <div class="dgrid" style="grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;margin-top:10px">

    <div class="eq frag" data-f="1" style="margin:0;text-align:left;font-size:25px"><span class="texd" data-tex="\\phantom{R(h_{\\hat{\\jmath}})} \\;\\le\\; \\widehat{R}(h_{j^*}) + \\varepsilon"></span></div>
    <div class="dnote frag" data-f="1" style="font-size:17px">its score is the smallest of all: <span class="tex" data-tex="\\widehat{R}(h_{\\hat{\\jmath}}) \\le \\widehat{R}(h_{j^*})"></span></div>

    <div class="dnote frag" data-f="2" style="font-size:17px">the best one&#8217;s score is honest too,<br>used the other way round: <span class="tex" data-tex="\\widehat{R} \\le R + \\varepsilon"></span></div>

    <div class="eq" style="margin:0;font-size:27px"><span class="texd" data-tex="R(h_{\\hat{\\jmath}}) \\;\\le\\; \\min_j R(h_j) + 2\\sqrt{\\frac{\\ln\\bigl(2(M+1)/\\delta\\bigr)}{2V}} \\qquad \\text{w.p.} \\ge 1-\\delta"></span></div>
