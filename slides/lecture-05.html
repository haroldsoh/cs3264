/* ---- the guarantee against model complexity ------------------------------------
   Candidates are degrees 0..M with real risks in a U (the deck's conceptual curve, on a
   0-1 loss). For each M: the best candidate's real risk; the real risk of the candidate
   the validation scores pick (V points, 200 draws); and the bound. */
let BND_V=120, BND_D=0.05, BND_M=12;

function bndSetV(v){ BND_V=v; drawBnd5(); }

/* Two panels. A: the best candidate's real risk, the real risk of the pick, the bound, on a
   0-1 axis. B: pick minus best on its own (zoomed) axis, because on the 0-1 axis the two
   curves sit on top of each other. */

  const best=[],pick=[],bound=[],exc=[],pens=[];
  for(let M=0;M<=MAXM;M++){ let b=Infinity; for(let q=0;q<=M;q++) b=Math.min(b,R[q]); best.push(b);
    let acc=0; const r=lcg5(1234+M*17);
    for(let l=0;l<L;l++){ let bi=0,bs=Infinity; for(let q=0;q<=M;q++){ const sc=R[q]+Math.sqrt(R[q]*(1-R[q])/BND_V)*gauss5(r); if(sc<bs){bs=sc;bi=q;} } acc+=R[bi]; }
    const pn=2*Math.sqrt(Math.log(2*(M+1)/BND_D)/(2*BND_V)); pens.push(pn);
    pick.push(acc/L); bound.push(b+pn); exc.push(Math.max(0,acc/L-b)); }

  [[1e-3,'0.001'],[1e-2,'0.01'],[1e-1,'0.1'],[1,'1']].forEach(([v,lab])=>{ g+='<line x1="'+ml+'" y1="'+YB(v).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+YB(v).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(YB(v)+4).toFixed(1)+'" text-anchor="end">'+lab+'</text>'; });

   + '<line x1="'+ml+'" y1="'+bB+'" x2="'+(W-mr)+'" y2="'+bB+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+bT+'" x2="'+ml+'" y2="'+bB+'" stroke="var(--rule)"/>'

   + '<clipPath id="bndclipA"><rect x="'+ml+'" y="'+aT+'" width="'+(W-ml-mr)+'" height="'+(aB-aT)+'"/></clipPath>'

  g+='<g clip-path="url(#bndclipA)">'+line(bound,YA,'var(--ink)',2.4,true)+line(best,YA,'var(--ink-soft)',2.4)+line(pick,YA,'var(--s2)',2.8)
   + '<line x1="'+X(BND_M).toFixed(1)+'" y1="'+aT+'" x2="'+X(BND_M).toFixed(1)+'" y2="'+aB+'" stroke="var(--s1)" stroke-width="1.6" stroke-dasharray="3 3"/>'
   + [[bound,'var(--ink)'],[best,'var(--ink-soft)'],[pick,'var(--s2)']].map(([arr,c])=>'<circle cx="'+X(BND_M).toFixed(1)+'" cy="'+YA(arr[BND_M]).toFixed(1)+'" r="4.5" fill="'+c+'" stroke="var(--bg)" stroke-width="1.5"/>').join('')+'</g>';
  g+='<g clip-path="url(#bndclipB)"><path d="M'+X(0).toFixed(1)+' '+bB+' L'+exc.map((v,M)=>X(M).toFixed(1)+' '+YB(v).toFixed(1)).join(' L')+' L'+X(MAXM).toFixed(1)+' '+bB+' Z" fill="var(--s2)" opacity=".18"/>'
   + line(exc,YB,'var(--s2)',2.4)+line(pens,YB,'var(--ink)',2.2,true)
   + '<line x1="'+X(BND_M).toFixed(1)+'" y1="'+bT+'" x2="'+X(BND_M).toFixed(1)+'" y2="'+bB+'" stroke="var(--s1)" stroke-width="1.6" stroke-dasharray="3 3"/>'
   + '<circle cx="'+X(BND_M).toFixed(1)+'" cy="'+YB(exc[BND_M]).toFixed(1)+'" r="4.5" fill="var(--s2)" stroke="var(--bg)" stroke-width="1.5"/>'
   + '<circle cx="'+X(BND_M).toFixed(1)+'" cy="'+YB(pens[BND_M]).toFixed(1)+'" r="4.5" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.5"/></g>';
  g+=legendRow(ml, 20, [{t:'best candidate',c:'var(--ink-soft)'},{t:'the pick (real risk)',c:'var(--s2)',w:2.8},{t:'the bound',c:'var(--ink)',d:1}]);
  svg.innerHTML=g;

   + (exc[M]>0?'The penalty is '+Math.round(pen/exc[M])+'&#215; the excess. ':'')+'More candidates: the penalty grows only through ln(2(M+1)/&#948;). More validation points: both fall like 1/&#8730;V. The penalty is a worst case; the excess is what one experiment pays.';
}


/* ---- Hot or Not, repeated: the histogram of the sample averages -----------------------
   1000 sets of V Bernoulli(mu) ratings; one estimate per set; bars count the estimates.
   Optional Gaussian overlay with the CLT standard deviation sqrt(mu(1-mu)/V). */
let CLT_V=20, CLT_G=false;
function cltSetV(v){ CLT_V=v; drawClt5(); }
function cltToggleG(){ CLT_G=!CLT_G; drawClt5(); }
function drawClt5(){
  const svg=document.getElementById('clt5'); if(!svg) return;
  const W=560,H=300, ml=54,mr=16,mt=30,mb=44, MU=0.735, T=1000, V=CLT_V;
  const r=lcg5(20250908+V);
  const w=V<=20?1/V:0.02, nb=Math.round(1/w), cnt=new Array(nb+1).fill(0);
  let sum=0,sum2=0;
  for(let t=0;t<T;t++){ let k=0; for(let i=0;i<V;i++) if(r()<MU) k++; const m=k/V; sum+=m; sum2+=m*m; cnt[Math.round(m/w)]++; }
  const mean=sum/T, sd=Math.sqrt(Math.max(0,sum2/T-mean*mean)), sdth=Math.sqrt(MU*(1-MU)/V);
  const ymax=Math.max(...cnt)*1.15;
  const X=v=>ml+v*(W-ml-mr), Y=c=>mt+(1-c/ymax)*(H-mt-mb);
  const st=ymax>400?100:ymax>200?50:ymax>80?20:10;
  let g='';
  for(let c=0;c<=ymax;c+=st) g+='<line x1="'+ml+'" y1="'+Y(c).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(c).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(c)+4).toFixed(1)+'" text-anchor="end">'+c+'</text>';
  [0,0.25,0.5,0.75,1].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+v.toFixed(2)+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">estimate from one set of V ratings</text>'
   + '<clipPath id="cltclip"><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'"/></clipPath><g clip-path="url(#cltclip)">';
  const bw=X(w)-X(0);
  cnt.forEach((c,k)=>{ if(!c) return; g+='<rect x="'+(X(k*w)-bw/2+0.5).toFixed(1)+'" y="'+Y(c).toFixed(1)+'" width="'+Math.max(1,bw-1).toFixed(1)+'" height="'+(Y(0)-Y(c)).toFixed(1)+'" fill="var(--s1)" opacity=".55"/>'; });
  if(CLT_G){ let dpath=''; for(let x=0;x<=1.0001;x+=0.004){ const y=T*w*Math.exp(-(x-MU)*(x-MU)/(2*sdth*sdth))/(sdth*Math.sqrt(2*Math.PI)); dpath+=(dpath?' L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1); } g+='<path d="'+dpath+'" fill="none" stroke="var(--s2)" stroke-width="2.4"/>'; }
  g+='<line x1="'+X(MU).toFixed(1)+'" y1="'+mt+'" x2="'+X(MU).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s4)" stroke-width="1.8" stroke-dasharray="5 4"/></g>';
  const items=[{t:'estimates, 1000 sets of V',c:'var(--s1)',w:7},{t:'μ = 0.735',c:'var(--s4)',d:1}]; if(CLT_G) items.push({t:'Gaussian, sd √(μ(1−μ)/V)',c:'var(--s2)',w:2.4});
  g+=legendRow(ml, 20, items);
  svg.innerHTML=g;
  [[5,'cltv5'],[20,'cltv20'],[100,'cltv100']].forEach(([v,id])=>{ const b=document.getElementById(id); if(b) b.classList.toggle('sel', v===V); });
  const bg=document.getElementById('cltg'); if(bg){ bg.classList.toggle('sel', CLT_G); bg.textContent=CLT_G?'hide the Gaussian':'overlay a Gaussian'; }
  const wr=document.getElementById('cltwarn'); if(!wr) return;
  wr.innerHTML='V = '+V+': the 1000 estimates average <strong>'+mean.toFixed(3)+'</strong> (&#956; = 0.735). Their standard deviation is <strong>'+sd.toFixed(3)+'</strong>; the Gaussian&#8217;s, &#8730;(&#956;(1&#8722;&#956;)/V), is '+sdth.toFixed(3)+'.';
}


/* ---- the Hoeffding bound against V, with a slider for the tolerance --------------------
   V on a log axis so that changing epsilon slides the curve sideways: the bound depends on V*eps^2,
   so halving eps is a shift of x4 in V. The region above 1 is shaded (a probability bound above
   1 says nothing) and the crossing with delta = 0.05 is marked. */
let HFV_E=0.10;
function hfvSet(e){ HFV_E=e; drawHfv5(); }
function drawHfv5(){
  const svg=document.getElementById('hfv5'); if(!svg) return;
  const W=560,H=330, ml=54,mr=18,mt=30,mb=46, V0=10,V1=20000, yhi=1.25, DEL=0.05;
  const LX=Math.log10(V1)-1;
  const X=v=>ml+(Math.log10(v)-1)/LX*(W-ml-mr), Y=b=>mt+(1-Math.min(b,yhi)/yhi)*(H-mt-mb), Yc=b=>mt+(1-b/yhi)*(H-mt-mb);   /* curves are not clamped: they leave through the top of the frame */
  const bound=(v,e)=>2*Math.exp(-2*v*e*e);
  let g='';
  g+='<rect x="'+ml+'" y="'+Y(yhi).toFixed(1)+'" width="'+(W-ml-mr)+'" height="'+(Y(1)-Y(yhi)).toFixed(1)+'" fill="var(--s2)" opacity=".08"/>'
   + '<text class="tick" x="'+(W-mr-6)+'" y="'+(Y(1)-6).toFixed(1)+'" text-anchor="end" fill="var(--s2)">above 1: says nothing</text>';
  [0,0.25,0.5,0.75,1].forEach(b=>{ g+='<line x1="'+ml+'" y1="'+Y(b).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(b).toFixed(1)+'" stroke="var(--rule)" opacity=".45"/><text class="tick" x="'+(ml-8)+'" y="'+(Y(b)+4).toFixed(1)+'" text-anchor="end">'+b.toFixed(2)+'</text>'; });
  [10,100,1000,10000].forEach(v=>{ g+='<text class="tick" x="'+X(v).toFixed(1)+'" y="'+(H-mb+16)+'" text-anchor="middle">'+v.toLocaleString('en')+'</text>'; });
  g+='<line x1="'+ml+'" y1="'+(H-mb)+'" x2="'+(W-mr)+'" y2="'+(H-mb)+'" stroke="var(--rule)"/><line x1="'+ml+'" y1="'+mt+'" x2="'+ml+'" y2="'+(H-mb)+'" stroke="var(--rule)"/>'
   + '<text class="legend" x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle">validation points V  (log scale)</text>';
  const vs=Math.log(2/DEL)/(2*HFV_E*HFV_E), leftSide=X(Math.min(Math.max(vs,V0),V1))<(ml+W-mr)/2;   /* the crossing label goes on its side; the delta label on the other */
  g+='<line x1="'+ml+'" y1="'+Y(DEL).toFixed(1)+'" x2="'+(W-mr)+'" y2="'+Y(DEL).toFixed(1)+'" stroke="var(--s4)" stroke-width="1.6" stroke-dasharray="5 4"/>'
   + (leftSide ? '<text class="tick" x="'+(W-mr-6)+'" y="'+(Y(DEL)-6).toFixed(1)+'" text-anchor="end" fill="var(--s4)">&#948; = 0.05</text>'
                : '<text class="tick" x="'+(ml+6)+'" y="'+(Y(DEL)-6).toFixed(1)+'" fill="var(--s4)">&#948; = 0.05</text>');
  const path=e=>{ let dd=''; for(let i=0;i<=240;i++){ const v=Math.pow(10,1+i/240*LX); dd+=(dd?' L':'M')+X(v).toFixed(1)+' '+Yc(bound(v,e)).toFixed(1); } return dd; };
  g+='<clipPath id="hfvclip"><rect x="'+ml+'" y="'+mt+'" width="'+(W-ml-mr)+'" height="'+(H-mt-mb)+'"/></clipPath><g clip-path="url(#hfvclip)">';
  [[0.05,'&#949; = 0.05'],[0.10,'&#949; = 0.10'],[0.20,'&#949; = 0.20']].forEach(([e,lab])=>{ g+='<path d="'+path(e)+'" fill="none" stroke="var(--ink-soft)" stroke-width="1.2" opacity=".5"/>';
    const vm=Math.log(4)/(2*e*e); g+='<text class="tick" x="'+(X(vm)+7).toFixed(1)+'" y="'+(Y(0.5)-5).toFixed(1)+'" fill="var(--ink-soft)">'+lab+'</text>'; });
  g+='<path d="'+path(HFV_E)+'" fill="none" stroke="var(--s2)" stroke-width="3"/>';
  if(vs>=V0&&vs<=V1){ g+='<line x1="'+X(vs).toFixed(1)+'" y1="'+Y(DEL).toFixed(1)+'" x2="'+X(vs).toFixed(1)+'" y2="'+(H-mb)+'" stroke="var(--s2)" stroke-dasharray="3 3"/>'
    + '<circle cx="'+X(vs).toFixed(1)+'" cy="'+Y(DEL).toFixed(1)+'" r="5" fill="var(--s2)" stroke="var(--bg)" stroke-width="1.5"/>'
    + '<text class="tick" x="'+(leftSide?X(vs)+9:X(vs)-9).toFixed(1)+'" y="'+(Y(DEL)-7).toFixed(1)+'" text-anchor="'+(leftSide?'start':'end')+'" fill="var(--s2)">V = '+Math.ceil(vs).toLocaleString('en')+'</text>'; }
  g+='</g>';
  g+=legendRow(ml, 20, [{t:'the bound at this ε',c:'var(--s2)',w:3},{t:'ε = 0.05, 0.10, 0.20',c:'var(--ink-soft)'},{t:'δ = 0.05',c:'var(--s4)',d:1}]);
  svg.innerHTML=g;
  const ev=document.getElementById('hfvev'); if(ev) ev.textContent=HFV_E.toFixed(2);
  const w=document.getElementById('hfvwarn'); if(!w) return;
  const V=Math.ceil(vs), b1=bound(V,HFV_E), b2=bound(2*V,HFV_E), e1=Math.exp(-2*V*HFV_E*HFV_E);
  const f=x=>x<0.001?x.toExponential(1):x.toFixed(3);
  w.innerHTML='&#949; = '+HFV_E.toFixed(2)+': the bound falls below &#948; = 0.05 at <strong>V = '+V.toLocaleString('en')+'</strong>'+(vs>V1?' (off the chart)':'')+'. '
   + 'Doubling V squares e<sup>&#8722;2V&#949;&#178;</sup>: '+f(e1)+' at V = '+V.toLocaleString('en')+', '+f(e1*e1)+' at V = '+(2*V).toLocaleString('en')+', so the bound goes '+f(b1)+' &#8594; '+f(b2)+'. '
   + 'Halving &#949; to '+(HFV_E/2).toFixed(3)+' would need V = '+Math.ceil(4*vs).toLocaleString('en')+' for the same 0.05.';
}

/* Click-to-advance, but never from a control. We remember where the pointer went DOWN:
   dragging a slider and releasing over the slide would otherwise fire a click on the
   slide and skip a page. */
const CONTROLS='input,button,a,select,textarea,label,.demo,.demo-ctrl,.bbtn,.basisbtns,video,iframe,svg';
let downInControl=false;
canvas.addEventListener('pointerdown',e=>{ downInControl=!!(e.target.closest&&e.target.closest(CONTROLS)); });
canvas.addEventListener('click',e=>{
  if(document.body.classList.contains('inking')) return;
  if(downInControl){ downInControl=false; return; }
  if(e.target.closest&&e.target.closest(CONTROLS)) return;
  next(); });

/* ============================================================
   ANNOTATION LAYER
   Draw over the slide with a mouse, trackpad or pen tablet. Pen pressure is
   used for stroke width when the device reports it. Ink is kept per slide.
   D toggles · E eraser · C clears the current slide · strokes survive navigation.
   ============================================================ */
const ink=document.getElementById('ink'), ictx=ink.getContext('2d');
let inkColor='#9B2C2C', inkWidth=2.2, drawing=false, erasing=false, inkStore={};
function sizeInk(){
  const r=devicePixelRatio||1, w=innerWidth, h=innerHeight;
  const keep=ink.width?ictx.getImageData(0,0,ink.width,ink.height):null;
  ink.width=w*r; ink.height=h*r; ink.style.width=w+'px'; ink.style.height=h+'px';
  ictx.setTransform(r,0,0,r,0,0); ictx.lineCap='round'; ictx.lineJoin='round';
  if(keep) try{ictx.putImageData(keep,0,0);}catch(_){}
}
addEventListener('resize',sizeInk); sizeInk();
function toggleInk(){
  document.body.classList.toggle('inking');
  document.querySelectorAll('.ib-sw').forEach(sw=>sw.classList.toggle('sel',sw.dataset.c===inkColor));
}
function clearInk(){ ictx.clearRect(0,0,ink.width,ink.height); delete inkStore[idx]; }
function saveInk(){ try{ inkStore[idx]=ink.toDataURL(); }catch(_){} }
function loadInk(i){
  ictx.clearRect(0,0,ink.width,ink.height);
  const d=inkStore[i]; if(!d) return;
  const im=new Image(); im.onload=()=>{ ictx.globalCompositeOperation='source-over'; ictx.drawImage(im,0,0,ink.width/(devicePixelRatio||1),ink.height/(devicePixelRatio||1)); }; im.src=d;
}
ink.addEventListener('pointerdown',e=>{ drawing=true; ink.setPointerCapture(e.pointerId);
  ictx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  ictx.strokeStyle=inkColor; ictx.beginPath(); ictx.moveTo(e.clientX,e.clientY); });
ink.addEventListener('pointermove',e=>{ if(!drawing) return;
  /* pen pressure scales the chosen nib; a mouse just uses the nib width */
  const nib = erasing ? inkWidth*8 : inkWidth;
  ictx.lineWidth = (e.pressure>0 && e.pressure<1) ? nib*(0.45+1.3*e.pressure) : nib;
  ictx.lineTo(e.clientX,e.clientY); ictx.stroke(); });
['pointerup','pointercancel','pointerleave'].forEach(t=>ink.addEventListener(t,()=>{ if(drawing){drawing=false; saveInk();} }));
document.querySelectorAll('.ib-sw').forEach(sw=>sw.onclick=()=>{ inkColor=sw.dataset.c; setEraser(false);

document.getElementById('ib-off').onclick=toggleInk;

/* A centred paragraph should span its container. The global p{max-width:62ch} keeps
   body copy readable, but on a centred line it leaves the text in a narrow box pinned
   to the left, which reads as mis-centred. Runs once over every slide paragraph. */
/* Scale each site preview so a 1440px-wide render fits the box exactly. */
function fitSiteFrames(){
  document.querySelectorAll('.siteframe').forEach(function(f){
    const ifr=f.querySelector('iframe'); if(!ifr) return;
    const w=f.clientWidth; if(!w) return;
    ifr.style.transform='scale('+(w/1440)+')';
  });
}
addEventListener('resize',fitSiteFrames);

function spreadCentredText(){
  document.querySelectorAll('.slide p, .slide .figcap, .slide .lede').forEach(function(p){
    /* max-width only: an auto inline margin would make a flex item shrink-wrap
       instead of stretching, which is the very problem we are fixing. */
    if(getComputedStyle(p).textAlign === 'center') p.style.maxWidth='none';
  });
}

/* ---- presenter clock ---- P starts/stops. Shows elapsed time and how far
   ahead or behind the planned cumulative time you are at this slide. ---- */
let t0=null, tick=null;
function fmt(ms){const s=Math.max(0,Math.round(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function updClock(){
  if(t0===null) return;
  const el=(performance.now()-t0)/60000;               // minutes elapsed
  document.getElementById('cl-el').textContent=fmt(performance.now()-t0);
  const plan=cumMin(idx), d=el-plan;
  const dl=document.getElementById('cl-dl');
  dl.textContent=(d>=0?'+':'&#8722;').replace('&#8722;','-')+Math.abs(d).toFixed(1)+'m vs plan ('+plan.toFixed(0)+'m / '+EST_TOTAL.toFixed(0)+'m)';
  dl.className='dl '+(d>0.5?'behind':(d<-0.5?'ahead':''));
}
function toggleClock(){
  document.body.classList.toggle('timing');
  if(document.body.classList.contains('timing')){ t0=performance.now(); tick=setInterval(updClock,1000); updClock(); }
  else { clearInterval(tick); t0=null; }
}

setTheme('paper');
spreadCentredText();
renderTeX();
fitSiteFrames();
highlight();

/* ---- YouTube facade -------------------------------------------------------------
   `button` and `iframe` are already in CONTROLS, so neither the play button nor the player
   advances the slide on click.

   YouTube's player refuses an opaque origin: opened straight from Finder this page is
   file://, and the embed dies with "Error 153 - video player configuration error". There is
   no embed parameter that fixes it. So served over http(s) we play inline, and off the disk
   we hand off to youtube.com in a new tab. */
const CAN_EMBED = location.protocol === 'http:' || location.protocol === 'https:';
function closeYT(w){
  const f=w.querySelector('iframe'); if(f) f.remove();
  const b=w.querySelector('.ytfacade'); if(b) b.style.display='';
  w.classList.remove('live');
}
document.querySelectorAll('.ytwrap').forEach(w=>{
  const btn=w.querySelector('.ytfacade');
  if(!CAN_EMBED){
    const b=w.querySelector('.vidbadge'); if(b) b.textContent='Video \u2192 YouTube';
    btn.title='Opens on YouTube \u2014 inline playback needs the deck served over http, not opened from disk';
  }
  btn.addEventListener('click',()=>{
    if(!CAN_EMBED){ window.open('https://www.youtube.com/watch?v='+w.dataset.yt,'_blank','noopener'); return; }
    if(w.classList.contains('live')) return;
    const f=document.createElement('iframe');
    f.src='https://www.youtube-nocookie.com/embed/'+w.dataset.yt+'?autoplay=1&rel=0&modestbranding=1&playsinline=1';
    f.title=w.dataset.title||'Video';
    f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
    f.allowFullscreen=true;
    btn.style.display='none';
    w.appendChild(f);
    w.classList.add('live');
  });
});

paint();

/* ---------- PRINT: every slide, every fragment, every figure ----------
   Every slide is in the DOM, but paint() draws only the current slide's figure and
   reveals only the fragments up to the current step -- so an unprepared print gives
   one slide and a lot of empty boxes. Before the browser lays out the pages, reveal
   every fragment and run every registered draw function once. A dark theme is swapped
   to paper for the duration: black pages are not a kindness to anyone's printer.
   ?print in the URL prepares the same way at load, which is how the PDFs are made. */
let PRINT_THEME=null;
function preparePrint(){
  PRINT_THEME=document.body.dataset.theme;
  if(PRINT_THEME==='nocturne') document.body.dataset.theme='paper';
  document.querySelectorAll('.frag').forEach(e=>e.classList.add('on'));
  Object.keys(DRAW).forEach(k=>{ try{ DRAW[k](); }catch(err){} });
}
function restorePrint(){
  if(PRINT_THEME) document.body.dataset.theme=PRINT_THEME;
  document.querySelectorAll('.frag').forEach(e=>e.classList.remove('on'));
  paint();
}
addEventListener('beforeprint',preparePrint);
addEventListener('afterprint',restorePrint);
if(/[?&]print/.test(location.search)) preparePrint();

/* Deep links: lecture-03.html#21 opens the deck on slide 21 with the whole slide revealed,
   and a link to another number while the deck is open goes there. The course notes link to
   slides this way. Anything that is not a slide number is ignored. */
function goToHash(){
  const m=/^#(\d+)$/.exec(location.hash);
  if(!m) return;
  const n=+m[1];
  if(n>=1 && n<=SLIDES.length && n-1!==idx) go(n-1);
}
addEventListener('hashchange',goToHash);
goToHash();

</script>
