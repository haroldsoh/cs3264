<style>
/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank
   ============================================================ */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide changes are immediate to keep text appearance stable. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}


/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
li.qz::before{display:none}li.qz{padding-left:6px}
#of5 text,#bvp5 text,#bvs5 text,#bvc5 text,#bvi5 text,#bvk5 text,#bvt5 text,#cvc5 text,#dd5 text,#hfv5 text,#uat7a text,#uat7b text,#uat7c text,#uat7d text,#relu7 text,#depth7 text,#act7 text,#sgd7 text,#grd6 text,#grow6 text,#vc6 text,#sc6 text,#goal6 text,#goal6r text,#bnd6 text,#bnd6f text,#bnd6r text,#ddx6 text,#hoef6 text,#pick6 text,#rlzc6 text{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.texd .katex{font-size:1.12em}

/* ---- figures, images, video ---- */
/* Rounded corners, no outline. A border plus a filled background drew a visible
   box around every image — obvious when the image letterboxes inside it. */

  background:transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.fig img,.fig video{display:block;width:100%;height:auto}
/* Click-to-load YouTube facade. Nothing is requested from Google until the play button is
   pressed, so the deck opens instantly and makes no third-party connection if the video is
   never reached. Used wherever we point at someone else's clip instead of re-hosting it. */
.ytfacade{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;
  position:relative;line-height:0;border-radius:inherit;overflow:hidden}
.ytfacade img{display:block;width:100%;height:auto}
.ytplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:55px;
  border-radius:13px;background:rgba(18,18,18,.72);transition:background .16s ease}
.ytplay::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-38%,-50%);
  border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff}
.ytfacade:hover .ytplay,.ytfacade:focus-visible .ytplay{background:#cc0000}
.ytwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
/* Height-capped figures: letterbox rather than crop.
   Flex + max-height (not grid + height:100%) — a percentage height inside an
   auto-sized grid row resolves to auto, which lets the image overflow and clip. */
/* letterboxed figures get no shadow either — there is nothing to cast one */
.fig[class*="h-"]{display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none}
.fig[class*="h-"] img,.fig[class*="h-"] video{width:auto;height:auto;max-width:100%;max-height:100%}
.fig[class*="h-"] svg{width:100%;height:100%}

.fig.h-290{height:290px}.fig.h-330{height:330px}

/* ---------- PRINT: one page per slide ----------
   The deck is a 1280x720 design canvas that fit() scales to the window. For print we
   drop that scale, let the slides flow one after another instead of stacking, and set
   the page to the same 1280x720 -- 13.333in x 7.5in at 96dpi, the standard widescreen
   slide size -- so a printed page is what the projector shows, at 1:1.
   Chrome's "Save as PDF" destination turns this into a deck PDF. */
@media print{
  @page{ size:13.333in 7.5in; margin:0 }
  html,body{height:auto;overflow:visible}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none}
  #stage{position:static;display:block;transition:none}
  #canvas{transform:none!important;width:1280px;height:auto;overflow:visible;
    background:transparent;transition:none}
  .slide{position:relative;inset:auto;width:1280px;height:720px;overflow:hidden;
    background:var(--bg);opacity:1!important;visibility:visible!important;
    transition:none!important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .frag{opacity:1!important}
  /* presenter chrome has no business on paper */
  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}

.l8-diagram{position:relative;width:100%;container-type:inline-size}

.l9-token-row{display:flex;justify-content:center;gap:16px;align-items:center;margin:26px 0 8px}
.l9-token-group{display:flex;gap:14px;align-items:center}
.l9-token{font:30px/1.3 var(--font-sans);padding:18px 24px;background:var(--bg-alt);border-bottom:3px solid var(--s1)}
.l9-token.target{border-color:var(--s2);color:var(--s2)}
.l9-label{font:20px/1.4 var(--font-sans);color:var(--ink-soft);text-align:center;margin:12px 0}

/* reading list */
.l9-reading{display:grid;grid-template-columns:195px 1fr;gap:22px 28px;margin:18px 0;font-size:23px;line-height:1.4}
.l9-reading strong{color:var(--s1)}
.l9-reading small{font-size:18px;color:var(--ink-soft)}

/* used inside the architecture demo (l9_architecture.js) */
.l9-arch-controls{display:flex;gap:14px;justify-content:center;align-items:center;margin:8px 0 10px;font-size:18px}
.l9-arch-controls button{font-size:18px}
.l9-small{font:18px/1.45 var(--font-sans);max-width:none;color:var(--ink-soft)}
.l9-centre{text-align:center}
@media print{.l9-demo{height:430px}.l9-demo[data-demo="kmeans"],.l9-demo[data-demo="latent"],.l9-curve .l9-demo{height:auto}.l9-demo button{display:inline-block}}

/* a lead line before a list sits as far from the list as the list items sit from each other */
p.n7-copy + .flow7-numbered, p.n7-copy + .flow7-bullets{margin-top:22px}
p.n7-copy:has(+ .flow7-numbered), p.n7-copy:has(+ .flow7-bullets){margin-bottom:0}
p.l8-label + .flow7-numbered{margin-top:18px}
/* credits keep clear of the content above them */
.l8-split + .cred, .l9-diag + .cred, .l8-narrow + .cred{margin-top:24px}
/* Given / Find, centred under the figure */
.l9-given{display:grid;grid-template-columns:auto auto;justify-content:center;align-items:baseline;gap:14px 22px;font-size:28px;margin:18px 0 6px}
.l9-given strong{font-family:var(--font-sans);font-size:22px;color:var(--s1);text-align:right}
/* numeric tables */
.l9-num td:not(:first-child),.l9-num th:not(:first-child){text-align:center}
.l9-num tr:last-child td{border-top:2px solid var(--rule)}
.l9-debrief{font-size:20px}
.l9-debrief td{padding:12px 12px}
/* latent-space demo */
.l9-latent{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr);gap:30px;align-items:center}
.l9-latent svg{touch-action:none;user-select:none}
.l9-latent-out canvas{display:block;width:260px;height:260px;margin:0 auto;border:1.5px solid var(--rule);background:var(--bg);image-rendering:auto}
.l9-latent-out .l9-latent-z{text-align:center;font:22px/1.4 var(--font-sans);margin:16px 0 0;max-width:none}
.l9-latent svg{max-height:392px}
.l9-num td{padding:9px 12px}
.l9-key + .l8-split{margin-top:22px}
/* table headers are upper case: keep maths in them as typed */
.l8-table th .katex{text-transform:none}
/* the text column beside a figure: one size, even gaps */
.l9-side p{font-size:25px;line-height:1.45;margin:0 0 20px;max-width:none}
.l9-side p:last-child{margin-bottom:0}
.flow7-bullets + .l9-side{margin-top:8px}
.l9-side p .katex{font-size:1.05em}

/* 20 Oct: notes and lead-in lines the same size as bullets and numbered lists (25px) */
.n7-centre-note,.n7-copy{font-size:25px}

const SLIDES=[{"s": "CS3264 · Lecture 9", "t": "Unsupervised Learning I", "html": "<div class=\"eyebrow\">CS3264 · Semester 1, AY2026/27</div><h1>Unsupervised Learning I</h1><div class=\"title-rule\"></div><p class=\"lede\" style=\"margin-bottom:28px\">Lecture 9 — Clustering and Representation Learning</p><div class=\"meta\"><b>Harold Soh</b> · harold@nus.edu.sg · COM3-02-58 · haroldsoh.com<br>Teaching Assistants: <b>Oscar Jiang</b> · <b>Sun Minghao</b> · <b>Shashank Rao Marpally</b><br>Tuesday 4–6pm · LT15 &nbsp;|&nbsp; 20 October 2026</div><p class=\"cred\" style=\"margin-top:16px;text-align:left\">Slides prepared with AI assistance.</p>"}, {"s": "Today", "t": "Today", "html": "<div class=\"eyebrow\">Today</div><h2>Today</h2><table class=\"l8-table\"><thead><tr><th>Part</th><th>Topic</th></tr></thead><tbody><tr><td>Finish Lecture 8</td><td>RNNs, attention, and Transformers<br><small><a href=\"https://haroldsoh.com/cs3264/slides/lecture-08.html#41\" target=\"_blank\" rel=\"noopener\">Open the Lecture 8 slides at Part II</a></small></td></tr><tr><td>Clustering</td><td>The k-means algorithm and its loss</td></tr><tr><td>Representation learning</td><td>Autoencoders: linear (PCA) and neural</td></tr></tbody></table>"}, {"s": "By the end of this lecture", "t": "Learning objectives", "html": "<div class=\"eyebrow\">By the end of this lecture</div><h2>Learning objectives</h2><div class=\"flow7-numbered\"><div class=\"flow7-no\">1</div><div><strong>Explain</strong> why clustering needs a definition of similarity.</div><div class=\"flow7-no\">2</div><div><strong>Explain</strong> how k-means minimises its loss.</div><div class=\"flow7-no\">3</div><div><strong>Describe</strong> an autoencoder and its reconstruction loss.</div><div class=\"flow7-no\">4</div><div><strong>Relate</strong> a linear autoencoder to PCA.</div><div class=\"flow7-no\">5</div><div><strong>Explain</strong> how the decoder and regularisation affect the learned codes.</div></div>"}, {"s": "Part I", "t": "Unsupervised learning", "html": "<div class=\"divider\"><div class=\"num\">Part I</div><h1>Unsupervised learning</h1><div class=\"bar\"></div><div class=\"sub\">Clustering and k-means</div></div>", "div": true}, {"s": "I-A · Recall Lecture 1", "t": "Types of machine learning", "html": "<div class=\"eyebrow\">I-A · Recall Lecture 1</div><h2>Types of machine learning</h2><div class=\"l8-narrow\" style=\"max-width:1104px\"><svg viewBox=\"108 -14 884 258\" style=\"display:block;width:100%;height:auto;margin:0 auto\">\n    <line x1=\"545\" y1=\"18\" x2=\"545\" y2=\"40\" class=\"tx-link\"/>\n    <text x=\"545\" y=\"14\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:24px;fill:var(--ink)\">Machine Learning</text>\n    <!-- (1) supervised branch -->\n    <g class=\"frag\" data-f=\"0\">\n      <path d=\"M545,40 H175 V70\" class=\"tx-link\"/>\n      <text x=\"175\" y=\"94\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:20px;fill:var(--ink)\">Supervised</text>\n      <text x=\"175\" y=\"121\" text-anchor=\"middle\" class=\"tx-leaf\" style=\"font-size:14.5px;font-family:var(--font-math)\"><tspan style=\"font-style:italic\">D</tspan> = {(<tspan style=\"font-style:italic\">x</tspan>&#8345;, <tspan style=\"font-style:italic\">t</tspan>&#8345;)}</text>\n    </g>\n    <!-- (2) unsupervised branch -->\n    <g class=\"frag\" data-f=\"0\">\n      <path d=\"M545,40 V70\" class=\"tx-link\"/>\n      <text x=\"545\" y=\"94\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:20px;fill:var(--accent)\">Unsupervised</text>\n      <text x=\"545\" y=\"121\" text-anchor=\"middle\" class=\"tx-leaf\" style=\"font-size:14.5px;font-family:var(--font-math)\"><tspan style=\"font-style:italic\">D</tspan> = {<tspan style=\"font-style:italic\">x</tspan>&#8345;}</text>\n    </g>\n    <!-- (3) clustering leaf (added for Lecture 9) -->\n    <g class=\"frag\" data-f=\"1\">\n      <path d=\"M545,137 V161 M395,161 H545 M395,161 V185\" class=\"tx-link\"/>\n      <text x=\"395\" y=\"203\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:15.5px;fill:var(--ink)\">Clustering</text>\n    </g>\n    <!-- (4) dimensionality reduction leaf -->\n    <g class=\"frag\" data-f=\"1\">\n      <path d=\"M545,161 V185\" class=\"tx-link\"/>\n      <text x=\"545\" y=\"203\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:15.5px;fill:var(--ink)\">Dimensionality</text>\n      <text x=\"545\" y=\"222\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:15.5px;fill:var(--ink)\">reduction</text>\n    </g>\n    <!-- (5) representation learning leaf -->\n    <g class=\"frag\" data-f=\"1\">\n      <path d=\"M545,161 H695 M695,161 V185\" class=\"tx-link\"/>\n      <text x=\"695\" y=\"203\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:15.5px;fill:var(--ink)\">Representation</text>\n      <text x=\"695\" y=\"222\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:15.5px;fill:var(--ink)\">learning</text>\n    </g>\n    <!-- (6) reinforcement learning -->\n    <g class=\"frag\" data-f=\"0\">\n      <path d=\"M545,40 H905 V70\" class=\"tx-link\"/>\n      <text x=\"905\" y=\"94\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:20px;fill:var(--ink)\">Reinforcement</text>\n      <text x=\"905\" y=\"119\" text-anchor=\"middle\" class=\"tx-node\" style=\"font-size:20px;fill:var(--ink)\">learning</text>\n      <text x=\"905\" y=\"148\" text-anchor=\"middle\" class=\"tx-leaf\">reward function</text>\n      <text x=\"905\" y=\"169\" text-anchor=\"middle\" class=\"tx-leaf\" style=\"font-family:var(--font-math);font-size:14.5px\"><tspan style=\"font-style:italic\">r</tspan>(<tspan style=\"font-style:italic\">s</tspan>, <tspan style=\"font-style:italic\">a</tspan>)</text>\n    </g>\n  </svg>\n</div>"}, {"s": "I-A · Data", "t": "Data without labels", "html": "<div class=\"eyebrow\">I-A · Data</div><h2>Data without labels</h2><div class=\"l8-split l9-cols\"><div><p class=\"l8-label\">Supervised learning</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:32px\"><span class=\"texd\" data-tex=\"\\mathcal{D}=\\{(\\mathbf{x}_n,t_n)\\}_{n=1}^{N}\"></span></div><p class=\"n7-centre-note\">Each input has a target that tells us what to predict.</p></div><div><p class=\"l8-label\">Unsupervised learning</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:32px\"><span class=\"texd\" data-tex=\"\\mathcal{D}=\\{\\mathbf{x}_n\\}_{n=1}^{N}\"></span></div><p class=\"n7-centre-note\">There are no supplied targets. We choose a goal, such as finding groups or learning a representation.</p></div></div><p class=\"l9-key\">We still need a model and a loss.</p>"}, {"s": "I-A · Applications", "t": "Learning from unlabelled data", "html": "<div class=\"eyebrow\">I-A · Applications</div><h2>Learning from unlabelled data</h2><div class=\"l8-split l9-media\"><div><figure class=\"l8-shot\"><img src=\"media/l9/ddpm-samples.png\" alt=\"Published images generated by an unconditional diffusion model\" style=\"max-height:330px\"><figcaption>Images from an unconditional diffusion model</figcaption></figure></div><div><ul class=\"flow7-bullets f7-bullets\"><li><strong>Find groups</strong> in documents or measurements.</li><li><strong>Learn representations</strong> of images or text.</li><li><strong>Generate new data</strong> like the training data.</li></ul></div></div><p class=\"cred\">Image credit: <a href=\"https://hojonathanho.github.io/diffusion/\" target=\"_blank\" rel=\"noopener\">Ho, Jain &amp; Abbeel (2020), Denoising Diffusion Probabilistic Models</a></p>"}, {"s": "I-A · Self-supervised learning", "t": "Language-model pretraining", "html": "<div class=\"eyebrow\">I-A · Self-supervised learning</div><h2>Language-model pretraining</h2><div class=\"l9-token-row\"><div><div class=\"l9-token-group\"><span class=\"l9-token\">The</span><span class=\"l9-token\">cat</span><span class=\"l9-token\">sat</span><span class=\"l9-token\">on</span><span class=\"l9-token\">the</span></div><div class=\"l9-label\">Context</div></div><div><div class=\"l9-token-group\"><span class=\"l9-token target\">mat</span></div><div class=\"l9-label\" style=\"color:var(--s2)\">Target</div></div></div><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"p_{\\theta}(\\text{next word}\\mid\\text{previous words})\"></span></div><p class=\"l9-key\">The text supplies the targets: each target is the next word.</p><p class=\"n7-centre-note\">This is <strong>self-supervised learning</strong>. Later stages, such as instruction tuning, can use labelled examples.</p><p class=\"cred\">Example: <a href=\"https://arxiv.org/abs/2005.14165\" target=\"_blank\" rel=\"noopener\">Brown et al. (2020), Language Models are Few-Shot Learners</a></p>"}, {"s": "I-B · The problem", "t": "Clustering", "html": "<div class=\"eyebrow\">I-B · The problem</div><h2>Clustering</h2><div class=\"l8-narrow\" style=\"max-width:1000px\"><svg class=\"l9-diag\" viewBox=\"0 0 1060 360\" role=\"img\" aria-label=\"Grey points on the left; the same points coloured in three groups on the right.\"><rect x=\"30.0\" y=\"20.0\" width=\"440.0\" height=\"290.0\" rx=\"0\" style=\"fill:none;fill-opacity:0;stroke:var(--rule);stroke-width:1.5\"/><rect x=\"590.0\" y=\"20.0\" width=\"440.0\" height=\"290.0\" rx=\"0\" style=\"fill:none;fill-opacity:0;stroke:var(--rule);stroke-width:1.5\"/><line x1=\"490\" y1=\"165\" x2=\"560.50\" y2=\"165.00\" style=\"stroke:var(--s1);stroke-width:3;stroke-linecap:round\"/><path d=\"M570 165 L559.50 170.04 L559.50 159.96 Z\" style=\"fill:var(--s1)\"/><circle cx=\"133.9\" cy=\"125.2\" r=\"7\" fill=\"var(--ink-soft)\"/><circle cx=\"134.6\" cy=\"108.7\" r=\"7\" fill=\"var(--ink-soft)\"/><circle cx=\"117.7\" cy=\"110.7\" r=\"7\" fill=\"var(--ink-soft)\"/><circle cx=\"166.7\" cy=\"123.5\" r=\"7\" fill=\"var(--ink-soft)\"/><circle cx=\"164.9\" cy=\"120.0\" r=\"7\" fill=\"var(--ink-soft)\"/><circle cx=\"149.5\" cy=\"118.7\" r=\"7\" fill=\"var(--ink-soft)\"/><circle cx=\"100.0\" cy=\"132.1 y=\"89.4\" r=\"7\" fill=\"var(--s5)\"/><circle cx=\"940.9\" cy=\"59.4\" r=\"7\" fill=\"var(--s5)\"/><circle cx=\"875.0\" cy=\"104.8\" r=\"7\" fill=\"var(--s5)\"/><circle cx=\"944.6\" cy=\"111.6\" r=\"7\" fill=\"var(--s5)\"/><text x=\"250\" y=\"345\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink-soft);font-weight:400\">Unlabelled points</text><text x=\"810\" y=\"345\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink-soft);font-weight:400\">K = 3 clusters</text></svg></div><p class=\"n7-centre-note\"><strong>Given</strong> points <span class=\"tex\" data-tex=\"\\mathbf{x}_1,\\dots,\\mathbf{x}_N\"></span>. <strong>Find</strong> <span class=\"tex\" data-tex=\"K\"></span> groups so that points in a group are similar.</p><p class=\"n7-centre-note\">For example: group customers by what they buy.</p>"}, {"s": "I-B · The problem", "t": "Which grouping should we choose?", "html": "<div class=\"eyebrow\">I-B · The problem</div><h2>Which grouping should we choose?</h2><div class=\"l8-narrow\" style=\"max-width:1000px\"><svg class=\"l9-diag\" viewBox=\"0 0 1060 265\" role=\"img\" aria-label=\"Six items, three shapes in two colours. Left: three groups by shape. Right: two groups by colour.\"><text x=\"255\" y=\"28\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:24px;fill:var(--ink);font-weight:700\">Group by shape</text><text x=\"800\" y=\"28\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:24px;fill:var(--ink);font-weight:700\">Group by colour</text><rect x=\"40\" y=\"50\" width=\"110\" height=\"200\" rx=\"16\" style=\"fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-dasharray:7 6\"/><circle cx=\"95\" cy=\"105\" r=\"26\" style=\"fill:var(--s1)\"/><circle cx=\"95\" cy=\"195\" r=\"26\" style=\"fill:var(--s2)\"/><rect x=\"200\" y=\"50\" width=\"110\" height=\"200\" rx=\"16\" style=\"fill:none;stroke:var(--ink-soft);stroke-width:2;stroke-dasharray 245.0\" style=\"stroke:var(--s3);stroke-width:1.6\" opacity=\".45\"/><circle cx=\"340.0\" cy=\"225.0\" r=\"8\" fill=\"var(--s3)\"/><line x1=\"118.0\" y1=\"118.0\" x2=\"142.0\" y2=\"142.0\" style=\"stroke:var(--bg);stroke-width:8.5\" /><line x1=\"118.0\" y1=\"142.0\" x2=\"142.0\" y2=\"118.0\" style=\"stroke:var(--bg);stroke-width:8.5\" /><line x1=\"118.0\" y1=\"118.0\" x2=\"142.0\" y2=\"142.0\" style=\"stroke:var(--s1);stroke-width:4.5\" /><line x1=\"118.0\" y1=\"142.0\" x2=\"142.0\" y2=\"118.0\" style=\"stroke:var(--s1);stroke-width:4.5\" /><line x1=\"313.0\" y1=\"233.0\" x2=\"337.0\" y2=\"257.0\" style=\"stroke:var(--bg);stroke-width:8.5\" /><line x1=\"313.0\" y1=\"257.0\" x2=\"337.0\" y2=\"233.0\" style=\"stroke:var(--bg);stroke-width:8.5\" /><line x1=\"313.0\" y1=\"233.0\" x2=\"337.0\" y2=\"257.0\" style=\"stroke:var(--s3);stroke-width:4.5\" /><line x1=\"313.0\" y1=\"257.0\" x2=\"337.0\" y2=\"233.0\" style=\"stroke:var(--s3);stroke-width:4.5\" /></svg><div class=\"l8-lab l8-lab-c\" style=\"left:29.545%;top:62.500%;font-size:26px;font-size:5.9091cqw;color:var(--s1)\"><span class=\"tex\" data-tex=\"\\boldsymbol{\\mu}_1\"></span></div><div class=\"l8-lab l8-lab-l\" style=\"left:89.091%;top:78.125%;font-size:26px;font-size:5.9091cqw;color:var(--s3)\"><span class=\"tex\" data-tex=\"\\boldsymbol{\\mu}_2\"></span></div><div class=\"l8-lab l8-lab-l\" style=\"left:46.364%;top:28.750%;font-size:24px;font-size:5.4545cqw;color:var(--s1)\"><span class=\"tex\" data-tex=\"\\mathbf{x}_n\"></span></div></div></div></div><div><div class=\"l9-side\"><p><strong>Centres</strong><br><span class=\"tex\" data-tex=\"\\boldsymbol{\\mu}_1,\\dots,\\boldsymbol{\\mu}_K\\in\\mathbb{R}^{D}\"></span></p><p><strong>Assignments</strong><br><span class=\"tex\" data-tex=\"r_{nk}\\in\\{0,1\\},\\quad \\sum_k r_{nk}=1\"></span></p><p>Each point belongs to exactly one cluster: a one-of-<span class=\"tex\" data-tex=\"K\"></span> code.</p><p>For example, <span class=\"tex\" data-tex=\"\\mathbf{r}_n=(1,0)\"></span>: <span class=\"tex\" data-tex=\"\\mathbf{x}_n\"></span> is in cluster 1.</p></div></div></div>"}, {"s": "I-C · Loss", "t": "Loss: total squared distance", "html": "<div class=\"eyebrow\">I-C · Loss</div><h2>Loss: total squared distance</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:38px\"><span class=\"texd\" data-tex=\"J=\\sum_{n=1}^{N}\\sum_{k=1}^{K}r_{nk}\\underbrace{\\|\\mathbf{x}_n-\\boldsymbol{\\mu}_k\\|^{2}}_{\\text{squared distance}}\"></span></div><p class=\"n7-centre-note\"><span class=\"tex\" data-tex=\"r_{nk}\"></span> is 1 only for the point's own cluster, so each point counts once.</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:28px\"><span class=\"texd\" data-tex=\"\\text{subject to }\\ \\sum_{k}r_{nk}=1\"></span></div><p class=\"l9-key\">Add up each point's squared distance to its own centre.</p>"}, {"s": "I-C · Loss", "t": "k-means alternates two steps", "html": "<div class=\"eyebrow\">I-C · Loss</div><h2>k-means alternates two steps</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:32px\"><span class=\"texd\" data-tex=\"\\min_{\\{r_{nk}\\},\\{\\boldsymbol{\\mu}_k\\}}\\ \\sum_{n}\\sum_{k} r_{nk}\\|\\mathbf{x}_n-\\boldsymbol{\\mu}_k\\|^{2}\"></span></div><div class=\"flow7-numbered\"><div class=\"flow7-no\">1</div><div><strong>Assignment step:</strong> minimise <span class=\"tex\" data-tex=\"J\"></span> over the <span class=\"tex\" data-tex=\"r_{nk}\"></span>. Keep the centres fixed.</div><div class=\"flow7-no\">2</div><div><strong>Update step:</strong> minimise <span class=\"tex\" data-tex=\"J\"></span> over the <span class=\"tex\" data-tex=\"\\boldsymbol{\\mu}_k\"></span>. Keep the assignments fixed.</div></div><p class=\"n7-centre-note\">Each step minimises the loss while keeping the other variables fixed.</p>"}, {"s": "I-C · Assignment step", "t": "Assignment: the nearest centre", "html": "<div class=\"eyebrow\">I-C · Assignment step</div><h2>Assignment: the nearest centre</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\min_{\\mathbf{r}_n}\\ \\sum_{k} r_{nk}\\|\\mathbf{x}_n-\\boldsymbol{\\mu}_k\\|^{2}\\quad\\text{subject to}\\ \\sum_k r_{nk}=1\"></span></div><div class=\"frag\" data-f=\"0\"><p class=\"n7-centre-note\">For each point, choose the centre with the smallest squared distance:</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"r_{nk}=\\begin{cases}1 &amp; \\text{if } k=\\arg\\min_{j}\\|\\mathbf{x}_n-\\boldsymbol{\\mu}_j\\|^{2}\\\\[2pt] 0 &amp; \\text{otherwise}\\end{cases}\"></span></div><p class=\"l9-key\">Assign each point to its nearest centre.</p></div>"}, {"s": "I-C · Update step", "t": "Update: the mean of the points", "html": "<div class=\"eyebrow\">I-C · Update step</div><h2>Update: the mean of the points</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\min_{\\boldsymbol{\\mu}_k}\\ \\sum_{n} r_{nk}\\|\\mathbf{x}_n-\\boldsymbol{\\mu}_k\\|^{2}\"></span></div><div class=\"frag\" data-f=\"0\"><p class=\"n7-centre-note\">Set the derivative to zero:</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:32px\"><span class=\"texd\" data-tex=\"\\begin{aligned}-2\\sum_{n} r_{nk}(\\mathbf{x}_n-\\boldsymbol{\\mu}_k)&amp;=\\mathbf{0}\\\\ \\boldsymbol{\\mu}_k&amp;=\\frac{\\sum_{n} r_{nk}\\mathbf{x}_n}{\\sum_{n} r_{nk}}\\end{aligned}\"></span></div><p class=\"l9-key\">Move each centre to the mean of its points.</p></div>"}, {"s": "I-C · Question", "t": "k-means repeats the assignment step and the update step. Can the loss increase?", "html": "<div class=\"actbadge\">Question</div><div class=\"actq\" style=\"font-size:30px;margin:16px 0 22px\">k-means repeats the assignment step and the update step. Can the loss increase?</div><div class=\"f7-answers\"><button class=\"card q8opt\" type=\"button\" data-ok=\"0\"><strong>A.</strong> Yes, in the assignment step</button><button class=\"card q8opt\" type=\"button\" data-ok=\"0\"><strong>B.</strong> Yes, in the update step</button><button class=\"card q8opt\" type=\"button\" data-ok=\"0\"><strong>C.</strong> Yes, in either step</button><button class=\"card q8opt\" type=\"button\" data-ok=\"1\"><strong>D.</strong> No, neither step can increase it</button></div>"}, {"s": "I-C · Convergence", "t": "The loss cannot increase", "html": "<div class=\"eyebrow\">I-C · Convergence</div><h2>The loss cannot increase</h2><p class=\"n7-centre-note\"><strong>Answer: D.</strong> Each step minimises <span class=\"tex\" data-tex=\"J\"></span> while keeping the other variables fixed. The loss cannot increase.</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:32px\"><span class=\"texd\" data-tex=\"J^{(0)}\\ \\ge\\ J^{(1)}\\ \\ge\\ J^{(2)}\\ \\ge\\ \\cdots\\ \\ge\\ 0\"></span></div><ul class=\"flow7-bullets f7-bullets\"><li>k-means stops when no point changes cluster.</li><li>Different starting centres can lead to different <strong>local minima</strong>.</li><li>Run it from several starting points. Keep the result with the lowest <span class=\"tex\" data-tex=\"J\"></span>.</li></ul>"}, {"s": "I-C · Effect of the loss", "t": "Assumptions of k-means", "html": "<div class=\"eyebrow\">I-C · Effect of the loss</div><h2>Assumptions of k-means</h2><div class=\"l8-split l9-media\"><div><div class=\"l8-narrow\" style=\"max-width:560px\"><svg class=\"l9-diag\" viewBox=\"0 0 580 370\" role=\"img\" aria-label=\"k-means on three groups: a wide group in the middle, a tight group on the right and a compact group at the bottom left. Circled points of the wide group are assigned to the other centres.\"><rect x=\"30.0\" y=\"20.0\" width=\"520.0\" height=\"330.0\" rx=\"0\" style=\"fill:none;fill-opacity:0;stroke:var(--rule);stroke-width:1.5\"/><circle cx=\"212.3\" cy=\"212.8\" r=\"5.5\" fill=\"var(--s1)\"/><circle cx=\"212.3\" cy=\"212.8\" r=\"10\" style=\"fill:none;stroke:var(--ink);stroke-width:2\"/><circle cx=\"301.4\" cy=\"268.1\" r=\"5.5\" fill=\"var(--s1)\"/><circl lab-c\" style=\"left:28.931%;top:46.358%;font-size:38px;font-size:3.9832cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"f_{\\phi}\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:71.488%;top:46.358%;font-size:38px;font-size:3.9832cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"g_{\\theta}\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:50.105%;top:70.199%;font-size:25px;font-size:2.6205cqw;color:var(--s2)\"><span class=\"tex\" data-tex=\"K&lt;D\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:6.499%;top:93.377%;font-size:25px;font-size:2.6205cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"\\mathbf{x}\\in\\mathbb{R}^{D}\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:50.105%;top:93.377%;font-size:25px;font-size:2.6205cqw;color:var(--s5)\"><span class=\"tex\" data-tex=\"\\mathbf{z}\\in\\mathbb{R}^{K}\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:93.501%;top:93.377%;font-size:25px;font-size:2.6205cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"\\hat{\\mathbf{x}}\\in\\mathbb{R}^{D}\"></span></div></div></div><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\mathbf{z}=f_{\\phi}(\\mathbf{x}),\\qquad\\hat{\\mathbf{x}}=g_{\\theta}(\\mathbf{z})\"></span></div><p class=\"n7-centre-note\">In the demo, <span class=\"tex\" data-tex=\"D=64\"></span> and <span class=\"tex\" data-tex=\"K=2\"></span>. We use <span class=\"tex\" data-tex=\"K&lt;D\"></span> so the model must reconstruct the input from fewer numbers.</p>"}, {"s": "II-C · Loss", "t": "Loss: reconstruction error", "html": "<div class=\"eyebrow\">II-C · Loss</div><h2>Loss: reconstruction error</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:34px\"><span class=\"texd\" data-tex=\"J(\\phi,\\theta)=\\frac{1}{N}\\sum_{n=1}^{N}\\big\\|\\mathbf{x}_n-g_{\\theta}(f_{\\phi}(\\mathbf{x}_n))\\big\\|^{2}\"></span></div><div class=\"flow7-numbered\"><div class=\"flow7-no\">1</div><div>The input supplies the reconstruction target.</div><div class=\"flow7-no\">2</div><div>If <span class=\"tex\" data-tex=\"\\hat{\\mathbf{x}}_n\\approx\\mathbf{x}_n\"></span>, the code preserves enough information to reconstruct <span class=\"tex\" data-tex=\"\\mathbf{x}_n\"></span>.</div><div class=\"flow7-no\">3</div><div>The loss encourages the code to preserve information that reduces reconstruction error.</div></div><p class=\"n7-small l8-centre\">Squared error corresponds to a Gaussian noise model (Lecture 2).</p>"}, {"s": "Part III", "t": "A linear model", "html": "<div class=\"divider\"><div class=\"num\">Part III</div><h1>A linear model</h1><div class=\"bar\"></div><div class=\"sub\">Principal component analysis</div></div>", "div": true}, {"s": "Part III · Learning objectives", "t": "A linear model", "html": "<div class=\"eyebrow\">Part III · Learning objectives</div><h2>A linear model</h2><p class=\"n7-copy\">You should be able to:</p><div class=\"flow7-numbered\"><div class=\"flow7-no\">1</div><div><strong>Encode</strong> and <strong>decode</strong> a point with a linear model.</div><div class=\"flow7-no\">2</div><div><strong>Relate</strong> reconstruction error to retained variance in PCA.</div><div class=\"flow7-no\">3</div><div><strong>Explain</strong> why linear reconstructions lie in a subspace.</div></div>"}, {"s": "III-A · Example", "t": "Describe each point with one number", "html": "<div class=\"eyebrow\">III-A · Example</div><h2>Describe each point with one number</h2><div class=\"l8-split l9-media\"><div><div class=\"l8-narrow\" style=\"max-width:600px\"><svg class=\"l9-diag\" viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Four points in the plane: (2, 1), (1, 1), (−1, −1) and (−2, −1), with a dashed line through the origin.\"><line x1=\"40.0\" y1=\"200.0\" x2=\"600.0\" y2=\"200.0\" style=\"stroke:var(--ink-soft);stroke-width:2\" /><line x1=\"320.0\" y1=\"385.0\" x2=\"320.0\" y2=\"22.0\" style=\"stroke:var(--ink-soft);stroke-width:2\" /><text x=\"612\" y=\"206\" text-anchor=\"start\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink);font-weight:400\">x₁</text><text x=\"320\" y=\"16\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink);font-weight:400\">x₂</text><line x1=\"103.5\" y1=\"362.4\" x2=\"536.5\" y2=\"37.6\" style=\"stroke:var(--s4);stroke-width:3\" stroke-dasharray=\"9 7\"/><circle cx=\"484.0\" cy=\"118.0\" r=\"10\" fill=\"var(--s1)\"/><text x=\"500\" y=\"126\" text-anchor=\"start\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--s1);font-weight:400\">(2, 1)</text><circle cx=\"402.0\" cy=\"118.0\" r=\"10\" fill=\"var(--s1)\"/><text x=\"386\" y=\"106\" text-anchor=\"end\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--s1);font-weight:400\">(1, 1)</text><circle cx=\"238.0\" cy=\"282.0\" r=\"10\" fill=\"var(--s1)\"/><text x=\"254\" y=\"310\" text-anchor=\"start\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--s1);font-weight:400\">(−1, −1)</text><circle cx=\"156.0\" cy=\"282.0\" r=\"10\" fill=\"var(--s1)\"/><text x=\"140\" y=\"290\" text-anchor=\"end\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--s1);font-weight:400\">(−2, −1)</text><text x=\"542.48\" y=\"63.640000000000015\" text-anchor=\"start\" style=\"font-family:var(--font-sans);font-size:19px;fill:var(--s4);font-weight:400\">a line through the origin</text></svg></div></div><div><ul class=\"flow7-bullets f7-bullets\"><li>Four centred points in 2D.</li><li>Use one number to describe each point, then reconstruct it.</li><li>Choose a line through the origin. The code records the point's position along it.</li></ul></div></div>"}, {"s": "III-A · Model", "t": "Model: a linear encoder and decoder", "html": "<div class=\"eyebrow\">III-A · Model</div><h2>Model: a linear encoder and decoder</h2><div class=\"l8-chain l9-chain\" role=\"img\" aria-label=\"Input, encoder, code, decoder, reconstruction\"><div class=\"l9-chain-item\"><span class=\"l8-chain-end\"><span class=\"tex\" data-tex=\"\\mathbf{x}\\in\\mathbb{R}^{D}\"></span></span><small>Input</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-box\"><span class=\"tex\" data-tex=\"\\mathbf{W}_{e}\"></span></span><small>Encoder</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-end l9-code\"><span class=\"tex\" data-tex=\"\\mathbf{z}\\in\\mathbb{R}^{K}\"></span></span><small>Code</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-box\"><span class=\"tex\" data-tex=\"\\mathbf{W}_{d}\"></span></span><small>Decoder</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-end\"><span class=\"tex\" data-tex=\"\\hat{\\mathbf{x}}\\in\\mathbb{R}^{D}\"></span></span><small>Reconstruction</small></div></div><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\mathbf{z}=\\mathbf{W}_{e}\\mathbf{x},\\qquad\\hat{\\mathbf{x}}=\\mathbf{W}_{d}\\mathbf{z},\\qquad\\mathbf{W}_{e}\\in\\mathbb{R}^{K\\times D},\\ \\ \\mathbf{W}_{d}\\in\\mathbb{R}^{D\\times K}\"></span></div><p class=\"n7-centre-note\">In the example: <span class=\"tex\" data-tex=\"D=2\"></span>, <span class=\"tex\" data-tex=\"K=1\"></span>, <span class=\"tex\" data-tex=\"\\mathbf{W}_{e}=\\mathbf{w}^{\\top}\"></span> and <span class=\"tex\" data-tex=\"\\mathbf{W}_{d}=\\mathbf{w}\"></span>.</p>"}, {"s": "III-A · E 18.0\" r=\"8\" fill=\"var(--s1)\"/><line x1=\"478.0\" y1=\"222.0\" x2=\"478.0\" y2=\"170.0\" style=\"stroke:var(--s2);stroke-width:2.2\" stroke-dasharray=\"5 4\"/><circle cx=\"478.0\" cy=\"170.0\" r=\"5\" fill=\"var(--s4)\"/><circle cx=\"478.0\" cy=\"222.0\" r=\"8\" fill=\"var(--s1)\"/><line x1=\"426.0\" y1=\"222.0\" x2=\"426.0\" y2=\"170.0\" style=\"stroke:var(--s2);stroke-width:2.2\" stroke-dasharray=\"5 4\"/><circle cx=\"426.0\" cy=\"170.0\" r=\"5\" fill=\"var(--s4)\"/><circle cx=\"426.0\" cy=\"222.0\" r=\"8\" fill=\"var(--s1)\"/><text x=\"530\" y=\"392\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:24px;fill:var(--s2);font-weight:700\">Error 1.0</text><rect x=\"720.0\" y=\"20.0\" width=\"320.0\" height=\"300.0\" rx=\"0\" style=\"fill:none;fill-opacity:0;stroke:var(--rule);stroke-width:1.5\"/><line x1=\"728.0\" y1=\"170.0\" x2=\"1032.0\" y2=\"170.0\" style=\"stroke:var(--rule);stroke-width:1.2\" /><line x1=\"880.0\" y1=\"28.0\" x2=\"880.0\" y2=\"312.0\" style=\"stroke:var(--rule);stroke-width:1.2\" /><line x1=\"765.6\" y1=\"255.8\" x2=\"994.4\" y2=\"84.2\" style=\"stroke:var(--s4);stroke-width:3.5\" /><line x1=\"984.0\" y1=\"118.0\" x2=\"971.5\" y2=\"101.4\" style=\"stroke:var(--s2);stroke-width:2.2\" stroke-dasharray=\"5 4\"/><circle cx=\"971.5\" cy=\"101.4\" r=\"5\" fill=\"var(--s4)\"/><circle cx=\"984.0\" cy=\"118.0\" r=\"8\" fill=\"var(--s1)\"/><line x1=\"932.0\" y1=\"118.0\" x2=\"938.2\" y2=\"126.3\" style=\"stroke:var(--s2);stroke-width:2.2\" stroke-dasharray=\"5 4\"/><circle cx=\"938.2\" cy=\"126.3\" r=\"5\" fill=\"var(--s4)\"/><circle cx=\"932.0\" cy=\"118.0\" r=\"8\" fill=\"var(--s1)\"/><line x1=\"828.0\" y1=\"222.0\" x2=\"821.8\" y2=\"213.7\" style=\"stroke:var(--s2);stroke-width:2.2\" stroke-dasharray=\"5 4\"/><circle cx=\"821.8\" cy=\"213.7\" r=\"5\" fill=\"var(--s4)\"/><circle cx=\"828.0\" cy=\"222.0\" r=\"8\" fill=\"var(--s1)\"/><line x1=\"776.0\" y1=\"222.0\" x2=\"788.5\" y2=\"238.6\" style=\"stroke:var(--s2);stroke-width:2.2\" stroke-dasharray=\"5 4\"/><circle cx=\"788.5\" cy=\"238.6\" r=\"5\" fill=\"var(--s4)\"/><circle cx=\"776.0\" cy=\"222.0\" r=\"8\" fill=\"var(--s1)\"/><text x=\"880\" y=\"392\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:24px;fill:var(--s2);font-weight:700\">Error 0.1</text></svg><div class=\"l8-lab l8-lab-c\" style=\"left:16.981%;top:86.914%;font-size:24px;font-size:2.2642cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"\\mathbf{w}=(0,\\,1)\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:50.000%;top:86.914%;font-size:24px;font-size:2.2642cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"\\mathbf{w}=(1,\\,0)\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:83.019%;top:86.914%;font-size:24px;font-size:2.2642cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"\\mathbf{w}=(0.8,\\,0.6)\"></span></div></div></div><p class=\"l9-key\">We want the best line. We measure best by the reconstruction error.</p><p class=\"n7-small l8-centre\">Error: the average of <span class=\"tex\" data-tex=\"\\|\\mathbf{x}_n-\\hat{\\mathbf{x}}_n\\|^{2}\"></span> over the four points.</p>"}, {"s": "III-B · Loss", "t": "Loss: reconstruction error", "html": "<div class=\"eyebrow\">III-B · Loss</div><h2>Loss: reconstruction error</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:34px\"><span class=\"texd\" data-tex=\"J(\\mathbf{W}_{e},\\mathbf{W}_{d})=\\frac{1}{N}\\sum_{n=1}^{N}\\big\\|\\mathbf{x}_n-\\mathbf{W}_{d}\\mathbf{W}_{e}\\mathbf{x}_n\\big\\|^{2}\"></span></div><p class=\"n7-centre-note\">The same loss as before. Now the encoder and the decoder are linear.</p><p class=\"n7-centre-note\">For one line: <span class=\"tex\" data-tex=\"\\mathbf{W}_{e}=\\mathbf{w}^{\\top}\"></span>, <span class=\"tex\" data-tex=\"\\mathbf{W}_{d}=\\mathbf{w}\"></span>, with <span class=\"tex\" data-tex=\"\\|\\mathbf{w}\\|=1\"></span>.</p><p class=\"n7-centre-note\">We assume centred data. Otherwise subtract the mean first and add it back after decoding.</p>"}, {"s": "III-B · Demo", "t": "Choose the reconstruction line", "html": "<div class=\"eyebrow\">III-B · Demo</div><h2>Choose the reconstruction line</h2><div class=\"l9-demo\" data-demo=\"pca\"></div>", "draw": "pca"}, {"s": "III-C · PCA", "t": "Connection to PCA", "html": "<div class=\"eyebrow\">III-C · PCA</div><h2>Connection to PCA</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\begin{array}{ccccc}\\text{Variance of the data}&amp;=&amp;\\text{Variance of the code}&amp;+&amp;\\text{Reconstruction error}\\\\[16pt]\\dfrac{1}{N}\\displaystyle\\sum_{n=1}^{N}\\|\\mathbf{x}_n\\|^{2}&amp;=&amp;\\dfrac{1}{N}\\displaystyle\\sum_{n=1}^{N}\\|\\mathbf{z}_n\\|^{2}&amp;+&amp;\\dfrac{1}{N}\\displaystyle\\sum_{n=1}^{N}\\|\\mathbf{x}_n-\\hat{\\mathbf{x}}_n\\|^{2}\\end{array}\"></span></div><p class=\"n7-centre-note\">For centred data, with <span class=\"tex\" data-tex=\"\\mathbf{z}=\\mathbf{W}^{\\top}\\mathbf{x}\"></span>, <span class=\"tex\" data-tex=\"\\hat{\\mathbf{x}}=\\mathbf{W}\\mathbf{z}\"></span> and <span class=\"tex\" data-tex=\"\\mathbf{W}^{\\top}\\mathbf{W}=\\mathbf{I}\"></span>.</p><p class=\"l9-key\">The variance of the data is fixed. PCA maximises the variance of the code, so it minimises the reconstruction error.</p>"}, {"s": "III-C · Variance", "t": "Reconstruction and error are perpendicular", "html": "<div class=\"eyebrow\">III-C · Variance</div><h2>Reconstruction and error are perpendicular</h2><div class=\"l8-split l9-media\"><div><div class=\"l8-narrow\" style=\"max-width:520px\"><svg class=\"l9-diag\" viewBox=\"0 0 550 355\" role=\"img\" aria-label=\"Point projected onto a line. The reconstruction is on the line and the error is perpendicular.\"><line x1=\"30.0\" y1=\"245.0\" x2=\"505.0\" y2=\"245.0\" style=\"stroke:var(--ink-soft);stroke-width:2\" /><line x1=\"145.0\" y1=\"330.0\" x2=\"145.0\" y2=\"25.0\" style=\"stroke:var(--ink-soft);stroke-width:2\" /><text x=\"510\" y=\"273\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink);font-weight:400\">x₁</text><text x=\"123\" y=\"24\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink);font-weight:400\">x₂</text><line x1=\"35.0\" y1=\"327.5\" x2=\"450.0\" y2=\"16.2\" style=\"stroke:var(--s4);stroke-width:3\" /><line x1=\"145.0\" y1=\"245.0\" x2=\"355.0\" y2=\"140.0\" style=\"stroke:var(--s1);stroke-width:3\" /><circle cx=\"355.0\" cy=\"140.0\" r=\"6\" fill=\"var(--s1)\"/><text x=\"383\" y=\"166\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:22px;fill:var(--s1);font-weight:400\"><tspan style=\"font-weight:700\">x</tspan> = (2, 1)</text><line x1=\"145.0\" y1=\"245.0\" x2=\"229.0\" y2=\"182.0\" style=\"stroke:var(--s5);stroke-width:5\" /><text x=\"187\" y=\"185\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:24px;fill:var(--s5);font-weight:700\">w</text><line x1=\"355.0\" y1=\"140.0\" x2=\"329.8\" y2=\"106.4\" style=\"stroke:var(--s2);stroke-width:3\" stroke-dasharray=\"6 5\"/><circle cx=\"329.8\" cy=\"106.4\" r=\"6\" fill=\"var(--s4)\"/><text x=\"299.8\" y=\"81.4\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--s4);font-weight:400\"><tspan style=\"font-weight:700\">x̂</tspan> = (1.76, 1.32)</text><text x=\"315\" y=\"35\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--s4);font-weight:400\">Possible reconstructions</text></svg></div></div><div><p class=\"n7-centre-note\">The reconstruction and the error are perpendicular.</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\|\\mathbf{x}\\|^{2}=z^{2}+\\|\\mathbf{x}-\\hat{\\mathbf{x}}\\|^{2}\"></span></div><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"5=4.84+0.16\"></span></div><p class=\"n7-centre-note\">The squared length of the input equals the squared length of the reconstruction plus the squared error.</p></div></div>"}, {"s": "III-C · Variance", "t": "Error and variance", "html": "<div class=\"eyebrow\">III-C · Variance</div><h2>Error and variance</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\text{variance}=\\frac{1}{N}\\sum_{n=1}^{N}\\|\\mathbf{x}_n\\|^{2}\\qquad\\text{(centred data)}\"></span></div><table class=\"l8-table l9-num\"><thead><tr><th>Point <span class=\"tex\" data-tex=\"\\mathbf{x}_n\"></span></th><th>Total <span class=\"tex\" data-tex=\"\\|\\mathbf{x}_n\\|^{2}\"></span></th><th>Retained <span class=\"tex\" data-tex=\"z_n^{2}\"></span></th><th>Error <span class=\"tex\" data-tex=\"\\|\\mathbf{x}_n-\\hat{\\mathbf{x}}_n\\|^{2}\"></span></th></tr></thead><tbody><tr><td><span class=\"tex\" data-tex=\"(2,\\,1)\"></span></td><td>5</td><td>4.84</td><td>0.16</td></tr><tr><td><span class=\"tex\" data-tex=\"(1,\\,1)\"></span></td><td>2</td><td>1.96</td><td>0.04</td></tr><tr><td><span class=\"tex\" data-tex=\"(-1,\\,-1)\"></span></td><td>2</td><td>1.96</td><td>0.04</td></tr><tr><td><span class=\"tex\" data-tex=\"(-2,\\,-1)\"></span></td><td>5</td><td>4.84</td><td>0.16</td></tr><tr><td>Average</td><td><strong>3.5</strong></td><td><strong>3.4</strong></td><td><strong>0.1</strong></td></tr></tbody></table><p class=\"l9-key\">The total variance is fixed. Reducing reconstruction error increases retained variance.</p>"}, {"s": "III-C · PCA", "t": "Principal component analysis", "html": "<div class=\"eyebrow\">III-C · PCA</div><h2>Principal component analysis</h2><p class=\"n7-centre-note\">PCA chooses the directions with the greatest variance. These minimise squared reconstruction error.</p><div class=\"eq l7-eq n7-equation\" style=\"font-size:29px\"><span class=\"texd\" data-tex=\"\\mathbf{z}=\\mathbf{W}^{\\top}\\mathbf{x},\\qquad\\hat{\\mathbf{x}}=\\mathbf{W}\\mathbf{z},\\qquad\\mathbf{W}\\in\\mathbb{R}^{D\\times K},\\quad\\mathbf{W}^{\\top}\\mathbf{W}=\\mathbf{I}_K\"></span></div><ul class=\"flow7-bullets f7-bullets\"><li><strong>Directions:</strong> the eigenvectors of the covariance matrix with the <span class=\"tex\" data-tex=\"K\"></span> largest eigenvalues.</li><li><strong>Our four points:</strong> <span class=\"tex\" data-tex=\"\\mathbf{w}=(0.85,\\,0.53)\"></span> retains 3.43 of the total variance, 3.5.</li></ul><p class=\"n7-centre-note\">At a global minimum of squared loss, a linear autoencoder recovers a PCA subspace.</p>"}, {"s": "III-C · PCA on images", "t": "PCA on images of digits", "html": "<div class=\"eyebrow\">III-C · PCA on images</div><h2>PCA on images of digits</h2><div class=\"l8-narrow\" style=\"max-width:960px\"><div class=\"l8-diagram\"><svg viewBox=\"0 0 900 375\" role=\"img\" aria-label=\"The mean digit image and the first three principal directions shown as images. Below, the mean plus multiples of the first direction.\"><rect x=\"40.0\" y=\"40.0\" width=\"118.0\" height=\"118.0\" rx=\"0\" style=\"fill:var(--bg);fill-opacity:1;stroke:var(--rule);stroke-width:1.5\"/><rect x=\"69.5\" y=\"40.0\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.33\"/><rect x=\"84.2\" y=\"40.0\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.74\"/><rect x=\"99.0\" y=\"40.0\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.74\"/><rect x=\"113.8\" y=\"40.0\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.36\"/><rect x=\"128.5\" y=\"40.0\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.08\"/><rect x=\"54.8\" y=\"54.8\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.12\"/><rect x=\"69.5\" y=\"54.8\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.65\"/><rect x=\"84.2\" y=\"54.8\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.75\"/><rect x=\"99.0\" y=\"54.8\" width=\"15.2\" height=\"15.2\" style=\"fill:var(--ink);fill-opacity:0.65\"/><rect x=\"113.8\" y=\"5 ar(--s3)\"/><circle cx=\"872.6\" cy=\"214.6\" r=\"7\" fill=\"var(--s1)\"/><line x1=\"897.7\" y1=\"171.0\" x2=\"897.7\" y2=\"173.4\" style=\"stroke:var(--s2);stroke-width:1.6\" stroke-dasharray=\"4 4\"/><circle cx=\"897.7\" cy=\"173.4\" r=\"5\" fill=\"var(--s3)\"/><circle cx=\"897.7\" cy=\"171.0\" r=\"7\" fill=\"var(--s1)\"/><line x1=\"922.7\" y1=\"112.9\" x2=\"922.7\" y2=\"173.4\" style=\"stroke:var(--s2);stroke-width:1.6\" stroke-dasharray=\"4 4\"/><circle cx=\"922.7\" cy=\"173.4\" r=\"5\" fill=\"var(--s3)\"/><circle cx=\"922.7\" cy=\"112.9\" r=\"7\" fill=\"var(--s1)\"/><line x1=\"947.8\" y1=\"40.3\" x2=\"947.8\" y2=\"173.4\" style=\"stroke:var(--s2);stroke-width:1.6\" stroke-dasharray=\"4 4\"/><circle cx=\"947.8\" cy=\"173.4\" r=\"5\" fill=\"var(--s3)\"/><circle cx=\"947.8\" cy=\"40.3\" r=\"7\" fill=\"var(--s1)\"/><text x=\"250\" y=\"345\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink);font-weight:700\">Points near a line: small error</text><text x=\"810\" y=\"345\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:21px;fill:var(--ink);font-weight:700\">Curved data: larger error</text></svg></div><p class=\"n7-centre-note\">The possible reconstructions are <span class=\"tex\" data-tex=\"\\{\\mathbf{W}_{d}\\mathbf{z}:\\mathbf{z}\\in\\mathbb{R}^{K}\\}\"></span>. This is a line for <span class=\"tex\" data-tex=\"K=1\"></span> and a plane for <span class=\"tex\" data-tex=\"K=2\"></span>.</p><p class=\"l9-key\">The linear decoder restricts the possible reconstructions. This is its inductive bias.</p>"}, {"s": "Part IV", "t": "A neural model", "html": "<div class=\"divider\"><div class=\"num\">Part IV</div><h1>A neural model</h1><div class=\"bar\"></div><div class=\"sub\">Nonlinear reconstructions and regularisation</div></div>", "div": true}, {"s": "Part IV · Learning objectives", "t": "A neural model", "html": "<div class=\"eyebrow\">Part IV · Learning objectives</div><h2>A neural model</h2><p class=\"n7-copy\">You should be able to:</p><div class=\"flow7-numbered\"><div class=\"flow7-no\">1</div><div><strong>Explain</strong> how a nonlinear decoder can reconstruct curved data.</div><div class=\"flow7-no\">2</div><div><strong>Describe</strong> a neural autoencoder and its loss.</div><div class=\"flow7-no\">3</div><div><strong>Explain</strong> how penalties on weights or codes help reduce overfitting.</div></div>"}, {"s": "IV-A · Example", "t": "What if the data lie on a curve?", "html": "<div class=\"eyebrow\">IV-A · Example</div><h2>What if the data lie on a curve?</h2><div class=\"l8-split l9-curve\"><div><div class=\"l9-demo\" data-demo=\"curve\"></div></div><div><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"g_*(z)=\\begin{bmatrix}z\\\\z^{2}\\end{bmatrix}\"></span></div><ul class=\"flow7-bullets f7-bullets\"><li>One number <span class=\"tex\" data-tex=\"z\"></span> specifies a point on this curve.</li><li>A linear decoder cannot reconstruct the whole curve.</li><li>A neural network can learn a nonlinear decoder.</li></ul></div></div>", "draw": "curve"}, {"s": "IV-A · Model", "t": "Model: a neural encoder and decoder", "html": "<div class=\"eyebrow\">IV-A · Model</div><h2>Model: a neural encoder and decoder</h2><div class=\"l8-chain l9-chain\" role=\"img\" aria-label=\"Input, encoder, code, decoder, reconstruction\"><div class=\"l9-chain-item\"><span class=\"l8-chain-end\"><span class=\"tex\" data-tex=\"\\mathbf{x}\"></span></span><small>Input</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-box\"><span class=\"tex\" data-tex=\"f_{\\phi}\"></span></span><small>Encoder</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-end l9-code\"><span class=\"tex\" data-tex=\"\\mathbf{z}\"></span></span><small>Code</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-box\"><span class=\"tex\" data-tex=\"g_{\\theta}\"></span></span><small>Decoder</small></div><svg class=\"l8-chain-arrow\" viewBox=\"0 0 60 16\" aria-hidden=\"true\"><line x1=\"0\" y1=\"8\" x2=\"50\" y2=\"8\"/><path d=\"M60 8 l-12 -6 v12 z\"/></svg><div class=\"l9-chain-item\"><span class=\"l8-chain-end\"><span class=\"tex\" data-tex=\"\\hat{\\mathbf{x}}\"></span></span><small>Reconstruction</small></div></div><div class=\"eq l7-eq n7-equation\" style=\"font-size:30px\"><span class=\"texd\" data-tex=\"\\mathbf{z}=f_{\\phi}(\\mathbf{x}),\\qquad\\hat{\\mathbf{x}}=g_{\\theta}(\\mathbf{z})\"></span></div><ul class=\"flow7-bullets f7-bullets\"><li>The encoder <span class=\"tex\" data-tex=\"f_{\\phi}\"></span> and the decoder <span class=\"tex\" data-tex=\"g_{\\theta}\"></span> are neural networks, for example MLPs.</li><li>The reconstructions <span class=\"tex\" data-tex=\"\\{g_{\\theta}(\\mathbf{z})\\}\"></span> can lie on a curve or a curved surface.</li></ul>"}, {"s": "IV-A · Encoder and decoder", "t": "Encode and decode a point", "html": "<div class=\"eyebrow\">IV-A · Encoder and decoder</div><h2>Encode and decode a point</h2><div class=\"l8-diagram\"><svg viewBox=\"0 0 1040 300\" role=\"img\" aria-label=\"The observation x = (1, 1) on the curve maps to the code z = 1 on a number line, which maps back to the same point on the curve.\"><rect x=\"30.0\" y=\"20.0\" width=\"250.0\" height=\"226.0\" rx=\"0\" style=\"fill:none;fill-opacity:0;stroke:var(--rule);stroke-width:1.5\"/><line x1=\"154.8\" y1=\"20.0\" x2=\"154.8\" y2=\"246.0\" style=\"stroke:var(--rule);stroke-width:1\" /><line x1=\"30.0\" y1=\"222.6\" x2=\"280.0\" y2=\"222.6\" 3077cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"f(\\mathbf{x})=x_1\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:65.865%;top:29.333%;font-size:24px;font-size:2.3077cqw;color:var(--ink)\"><span class=\"tex\" data-tex=\"g(z)=\\begin{bmatrix}z\\\\z^{2}\\end{bmatrix}\"></span></div><div class=\"l8-lab l8-lab-c\" style=\"left:55.769%;top:35.000%;font-size:22px;font-size:2.1154cqw;color:var(--s5)\"><span class=\"tex\" data-tex=\"z=1\"></span></div><div class=\"l8-lab l8-lab-l\" style=\"left:24.038%;top:42.000%;font-size:24px;font-size:2.3077cqw;color:var(--s1)\"><span class=\"tex\" data-tex=\"\\mathbf{x}\"></span></div><div class=\"l8-lab l8-lab-l\" style=\"left:94.231%;top:42.000%;font-size:24px;font-size:2.3077cqw;color:var(--s5)\"><span class=\"tex\" data-tex=\"\\hat{\\mathbf{x}}\"></span></div></div><div class=\"l8-split l9-cols\"><div><p class=\"n7-centre-note\"><strong>Encoder:</strong> maps the point to its code.</p></div><div><p class=\"n7-centre-note\"><strong>Decoder:</strong> maps the code back to a point.</p></div></div><p class=\"n7-small l8-centre\">Here we know the encoder and decoder. Usually, we learn both from data.</p>"}, {"s": "IV-B · Loss", "t": "Loss: reconstruction error", "html": "<div class=\"eyebrow\">IV-B · Loss</div><h2>Loss: reconstruction error</h2><div class=\"eq l7-eq n7-equation\" style=\"font-size:34px\"><span class=\"texd\" data-tex=\"J(\\phi,\\theta)=\\frac{1}{N}\\sum_{n=1}^{N}\\big\\|\\mathbf{x}_n-g_{\\theta}(f_{\\phi}(\\mathbf{x}_n))\\big\\|^{2}\"></span></div><ul class=\"flow7-bullets f7-bullets\"><li>The same loss as the linear model.</li><li>Backpropagation gives the gradients for both networks.</li><li>Gradient descent updates their parameters.</li></ul>"}, {"s": "IV-B · Demo", "t": "Linear and neural reconstructions", "html": "<div class=\"eyebrow\">IV-B · Demo</div><h2>Linear and neural reconstructions</h2><div class=\"l9-demo\" data-demo=\"nonlinear\"></div>", "draw": "nonlinear"}, {"s": "IV-C · Inductive bias", "t": "Architecture and inductive bias", "html": "<div class=\"eyebrow\">IV-C · Inductive bias</div><h2>Architecture and inductive bias</h2><table class=\"l8-table\"><thead><tr><th>Network</th><th>Built-in structure, and when it helps</th></tr></thead><tbody><tr><td>MLP</td><td>Every input can affect every output</td></tr><tr><td>CNN</td><td>Local filters with shared weights, for local patterns that repeat</td></tr><tr><td>Transformer</td><td>Attention weights that depend on the input, for information at distant positions</td></tr></tbody></table><p class=\"n7-centre-note\">We choose an architecture for both the encoder and the decoder.</p>"}, {"s": "IV-D · Interpret", "t": "Decode a grid of codes", "html": "<div class=\"eyebrow\">IV-D · Interpret</div><h2>Decode a grid of codes</h2><div class=\"l8-narrow\" style=\"max-width:930px\"><div class=\"l8-diagram\"><svg viewBox=\"0 0 1060 404\" role=\"img\" aria-label=\"Images decoded from a 6 by 6 grid of codes. PCA gives blurred blends of digits; the neural decoder gives digit-like images. Errors are mean squared reconstruction errors.\"><text x=\"290\" y=\"24\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:23px;fill:var(--ink);font-weight:700\">PCA (linear)</text><text x=\"770\" y=\"24\" text-anchor=\"middle\" style=\"font-family:var(--font-sans);font-size:23px;fill:var(--ink);font-weight:700\">Neural autoencoder</text><rect x=\"155.0\" y=\"74.0\" width=\"41.0\" height=\"41.0\" rx=\"0\" style=\"fill:var(--bg);fill-opacity:1;stroke:var(--rule);stroke-width:1.5\"/><rect x=\"160.1\" y=\"74.0\" width=\"5.5\" height=\"5.5\" style=\"fill:var(--ink);fill-opacity:0.06\"/><rect x=\"165.2\" y=\"74.0\" width=\"5.5\" height=\"5.5\" style=\"fill:var(--ink);fill-opacity:0.77\"/><rect x=\"170.4\" y=\"74.0\" width=\"5.5\" height=\"5.5\" style=\"fill:var(--ink);fill-opacity:1.00\"/><rect x=\"175.5\" y=\"74.0\" width=\"5.5\" height=\"5.5\" style=\"fill:var(--ink);fill-opacity:0.83\"/><rect x=\"180.6\" y=\"7 \eta},\\qquad\\min_{\\phi,\\theta}\\ \\mathbb{E}\\big[\\|\\mathbf{x}-g_{\\theta}(f_{\\phi}(\\tilde{\\mathbf{x}}))\\|^{2}\\big]\"></span></div><p class=\"cred\">Examples: denoising autoencoders (Vincent et al., 2008), BERT (Devlin et al., 2019) and masked autoencoders (He et al., 2022), SimCLR (Chen et al., 2020).</p>"}, {"s": "Summary", "t": "Key ideas", "html": "<div class=\"eyebrow\">Summary</div><h2>Key ideas</h2><div class=\"flow7-numbered\"><div class=\"flow7-no\">1</div><div>Clustering needs a <strong>definition of similarity</strong> to specify which groups we want.</div><div class=\"flow7-no\">2</div><div>k-means minimises the total squared distance to the centres.</div><div class=\"flow7-no\">3</div><div>An autoencoder learns a <strong>code</strong> by reconstructing its input.</div><div class=\"flow7-no\">4</div><div>A linear autoencoder with squared loss recovers a <strong>PCA</strong> subspace. Neural decoders allow nonlinear reconstructions.</div><div class=\"flow7-no\">5</div><div><strong>Regularisation</strong> can reduce overfitting, even when the code is small.</div></div>"}, {"s": "Reading", "t": "Reading", "html": "<div class=\"eyebrow\">Reading</div><h2>Reading</h2><div class=\"l9-reading\"><strong>PRML</strong><div>§9.1: k-means<br>§12.1.1–12.1.2: PCA<br>§12.4.2: autoassociative neural networks</div><strong>Deep Learning</strong><div>Chapter 14 introduction, §14.1–14.2<br><small>Autoencoders and regularised autoencoders. §14.6 and Chapter 15 are optional.</small></div><strong>ISL · optional</strong><div>Chapter 12: PCA and clustering</div></div><p class=\"cred\"><a href=\"https://www.microsoft.com/en-us/research/uploads/prod/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf\" target=\"_blank\" rel=\"noopener\">PRML</a> &nbsp; · &nbsp; <a href=\"https://www.deeplearningbook.org/contents/autoencoders.html\" target=\"_blank\" rel=\"noopener\">Deep Learning</a> &nbsp; · &nbsp; <a href=\"https://www.statlearning.com/\" target=\"_blank\ function fragsOf(i){
  const f=[...slides[i].querySelectorAll('.frag')];
  return {list:f,max:f.length?Math.max(...f.map(e=>+(e.dataset.f||0))):-1};
}
function paint(){
  slides.forEach((s,i)=>s.classList.toggle('active',i===idx));
  fragsOf(idx).list.forEach(e=>e.classList.toggle('on',(+(e.dataset.f||0))<fragStep));

     the box appears"). Demo listeners call their draw functions directly. */
  const d=SLIDES[idx].draw; if(d&&DRAW[d]&&drawnIdx!==idx) requestAnimationFrame(DRAW[d]);
  drawnIdx=idx;
  /* play video on the slide we just entered, pause and rewind everywhere else */
  slides.forEach((s,i)=>s.querySelectorAll('video').forEach(v=>{
    if(i===idx){ v.playbackRate=+(v.dataset.rate||1); v.play().catch(()=>{}); }

  }));

}
