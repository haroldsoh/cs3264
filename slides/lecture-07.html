<style>
/* ============================================================
   CS3264 · Lecture 1 — self-contained slide deck
   No external dependencies: opens offline in any modern browser.
   Keys: ← →  navigate · O overview · T theme · F fullscreen · B blank
   ============================================================ */
:root{
  --font-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --font-body:"Iowan Old Style",Palatino,Georgia,serif;
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  --font-math:"Cambria Math","Latin Modern Math",Georgia,"Times New Roman",serif;
  --font-mono:"SF Mono",Menlo,Consolas,monospace;
  /* Fixed data colours. The theme accents change with the theme and --ink inverts
     outright in nocturne, so anything that *encodes* data -- one class against
     another, one series against another -- needs colours that do not move when the
     theme does. Overridden for the dark theme only to keep them legible on #0E0E11. */
  --s1:#2E6DA4;--s2:#B03A31;--s3:#B8862B;--s4:#3F7F62;--s5:#7B3FA0;
}
[data-theme="paper"]{
  --bg:#FBF7EF;--bg-alt:#F4EDE0;--ink:#1E1A17;--ink-soft:#6B6157;--rule:#DCD2C0;
  --accent:#9B2C2C;--accent-soft:#C97A6D;--accent2:#2F6F6B;--grid:#E7DFCF;
  --shadow:0 1px 2px rgba(60,45,25,.07),0 8px 30px rgba(60,45,25,.06);
}
[data-theme="academic"]{
  --bg:#FAFAF6;--bg-alt:#F0F1EA;--ink:#14213A;--ink-soft:#5C6780;--rule:#D6D9CE;
  --accent:#1B4D8F;--accent-soft:#6C93C4;--accent2:#B08424;--grid:#E4E6DC;
  --shadow:0 1px 2px rgba(20,33,58,.07),0 8px 30px rgba(20,33,58,.07);
}
[data-theme="swiss"]{
  --bg:#FFFFFF;--bg-alt:#F2F2F2;--ink:#111111;--ink-soft:#6E6E6E;--rule:#E0E0E0;
  --accent:#EF7C00;--accent-soft:#F5B26B;--accent2:#003D7C;--grid:#EDEDED;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 30px rgba(0,0,0,.06);
  --font-display:var(--font-sans);--font-body:var(--font-sans);
}
[data-theme="nocturne"]{
  --s1:#6FA8DC;--s2:#E8776C;--s3:#E0B457;--s4:#6FBF95;--s5:#B18AE0;
  --bg:#0E0E11;--bg-alt:#191920;--ink:#ECEAE6;--ink-soft:#9A968E;--rule:#2C2C36;
  --accent:#7FB3FF;--accent-soft:#4E7FC4;--accent2:#D6A15E;--grid:#20202A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  transition:background .5s ease,color .5s ease;-webkit-font-smoothing:antialiased}
body.blank #stage,body.blank #themebar,body.blank #hint{opacity:0}

#stage{position:fixed;inset:0;display:grid;place-items:center;transition:opacity .2s}
#canvas{position:relative;width:1280px;height:720px;transform-origin:center center;
  background:var(--bg);overflow:hidden;transition:background .5s ease}
/* Slide changes are immediate to keep text appearance stable. */
.slide{position:absolute;inset:0;padding:66px 88px;display:flex;flex-direction:column;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}


/* type */
.eyebrow{font-family:var(--font-sans);font-size:12px;font-weight:600;letter-spacing:.19em;
  text-transform:uppercase;color:var(--ink-soft);margin-bottom:18px}
/* uppercase applies to KaTeX glyphs too, which silently turns a lambda into a capital
   Lambda and a beta into something that reads as a Latin B. Exempt rendered maths. */
.eyebrow .katex{text-transform:none;letter-spacing:normal}
h1{font-family:var(--font-display);font-size:64px;line-height:1.06;font-weight:700;letter-spacing:-.018em}
h2{font-family:var(--font-display);font-size:46px;line-height:1.1;font-weight:700;letter-spacing:-.014em;margin-bottom:24px}
h3{font-family:var(--font-display);font-size:25px;font-weight:700;margin-bottom:10px}
/* No measure cap. A slide is not a page of prose: paragraphs are short, the room is
   wide, and a line that stops halfway across looks broken from the back of LT15.
   Where a narrower measure is wanted, use a .col — the column supplies it. */
p{font-size:23px;line-height:1.5;max-width:none}
.lede{font-size:24px;line-height:1.5;color:var(--ink-soft)}
.caption{font-size:19px;font-style:italic;color:var(--ink-soft);line-height:1.45}
.small{font-size:18px;color:var(--ink-soft);line-height:1.5}
em.hl{font-style:normal;color:var(--accent);font-weight:700}
ul{list-style:none}
li{font-size:22px;line-height:1.45;margin-bottom:12px;padding-left:25px;position:relative}
li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
li.sub{font-size:17.5px;margin-left:25px;color:var(--ink-soft)}
li.sub::before{width:5px;height:5px;background:var(--ink-soft);top:.66em}
li.no::before{background:var(--ink-soft);opacity:.4}

/* math */
.m{font-family:var(--font-math);font-style:italic;white-space:nowrap}
.m .vec,.m .mat{font-weight:700;font-style:normal}
/* letters in a subscript are variables and stay italic; digits and labels are
   made upright by uprightDelimiters() / an explicit .up span */
.m sub,.m sup{font-size:.68em}
.m .op{font-style:normal;padding:0 .18em}
/* Only letters are variables. Brackets, digits, operators and punctuation are set
   upright — applied automatically by uprightDelimiters() at load. */
/* ---- maths ----
   Authored as LaTeX in data-tex and rendered by KaTeX at load.
   .tex is inline, .texd a display block. */
.tex,.texd{color:inherit}
.texd{display:block}
.katex{font-size:1em}
/* colour classes usable from inside maths via \htmlClass */
.c-post{color:var(--accent)}
.c-lik{color:var(--accent-soft)}
.c-prior{color:var(--accent2)}
.eq .katex{font-size:1em}
.dgrid .lhs .katex,.dgrid .rhs .katex{font-size:1.02em}
.m .up{font-style:normal}
/* ---- MathML: real maths typesetting, native, no dependency ----
   <mi> is an italic variable, <mn> an upright number, <mo> an upright operator —
   so subscript indices italicise and brackets stay upright without any help. */
math{font-size:1em;color:inherit}
/* Do NOT set a display value on the math element — MathML lays out with its own,
   and overriding it collapses the rows. Only margins/alignment here. */
/* A block-level math element fills its container and centres its own rows, so left-aligning
   needs the box to shrink-wrap (width:fit-content), not a margin override. */
math[display="block"]{margin:0;width:fit-content}
.eq.center math[display="block"]{margin-inline:auto}
/* derivation rows: equation left-aligned, reason in a fixed column beside it */
/* One grid for the whole derivation so the "=" columns line up across every row.
   The fragment class goes on each CELL, not on a wrapping row: a wrapper would
   need display:contents to join the grid, and opacity does not apply to that. */
.dgrid{display:grid;grid-template-columns:auto auto minmax(0,300px);gap:11px 16px;align-items:center}
.dgrid .lhs{text-align:right;font-size:23px}
.dgrid .rhs{text-align:left;font-size:23px}
.dgrid .lhs.big,.dgrid .rhs.big{font-size:26px}
.dgrid .why{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
/* Lecture 2 names this column .dnote. It had no rule at all, so the notes inherited the
   grid's own font size and sat in body type right up against the equations — visibly
   unlike Lecture 1. Same treatment, and a wider gutter so the two columns read apart. */
.dgrid .dnote{font-size:19px;font-style:italic;color:var(--ink-soft);padding-left:22px}
.dgrid mtable{line-height:1.1}
.dgrid math{margin:0}
/* Matrix delimiters are drawn in CSS. MathML operator stretching needs glyph
   assembly data that the default math font does not supply, so a stretchy="true"
   bracket stays one line tall no matter what — these grow with the content. */
.derow mtable{line-height:1.1}
.mrow-h{display:inline-flex;align-items:center;gap:.28em}
.matx{position:relative;display:inline-flex;align-items:center;padding:3px 13px;margin:0 .3em}
.matx::before,.matx::after{content:"";position:absolute;top:0;bottom:0;width:7px;
  border:2.1px solid currentColor}
.matx::before{left:0;border-right:0}
.matx::after{right:0;border-left:0}
.matx math{margin:0}

/* ---- live site preview ----
   An iframe sized to the box would render the site at ~470px, i.e. its mobile
   layout, squashed. Instead we render at a real desktop width and scale the whole
   thing down, so the page looks like the page. The screenshot behind it shows
   through if the site cannot load (no network in the lecture hall). */
.siteframe{position:relative;width:100%;height:388px;overflow:hidden;border-radius:10px;
  box-shadow:0 1px 3px rgba(0,0,0,.09);
  background:#fff url("media/harold-site.jpg") no-repeat center top;background-size:100% auto}
.siteframe iframe{position:absolute;top:0;left:0;width:1440px;height:980px;border:0;
  transform-origin:0 0;display:block}
.derow .why{font-size:14.5px;font-style:italic;color:var(--ink-soft);text-align:left;line-height:1.35}
.derow .step{font-size:24px;text-align:left}
.derow .step math{margin-inline:0;width:fit-content}
.derow .step.big{font-size:27px}
.derow .step.big math{padding:5px 0}
.m .big{font-size:1.35em;font-style:normal;vertical-align:-.16em}
/* Display equations are plain blocks, NOT flex: a flex context blockifies the
   inline math span and collapses the stacked fraction/sum boxes inside it. */
.eq{font-family:var(--font-math);font-size:29px;margin:14px 0;display:block;line-height:1.5}
/* a derivation rail: eq cells marked text-align:left really do left-align their display math */
.eq[style*="text-align:left"] .katex-display{text-align:left;margin:0}
.eq[style*="text-align:left"] .katex-display>.katex{text-align:left}
.eq.center{text-align:center}
.eq-box{display:inline-block;padding:12px 20px;border:1.5px solid var(--accent);border-radius:7px;
  background:color-mix(in srgb,var(--accent) 6%,transparent)}
/* stacked fraction — inline-block with block children.
   Numerals are set upright; wrap a variable numerator in <i> to keep it italic. */
.frac{display:inline-block;vertical-align:-.52em;text-align:center;font-size:.78em;margin:0 .26em;font-style:normal}
.frac .num{display:block;border-bottom:1.2px solid currentColor;padding:0 .3em 2px;line-height:1.18}
.frac .den{display:block;padding:2px .3em 0;line-height:1.18}
.frac i{font-style:italic}
/* big operator with limits set above and below */
.sum{display:inline-block;vertical-align:-.44em;text-align:center;margin:0 .2em;font-style:normal}
.sum .lim{display:block;font-size:.4em;line-height:1.3;font-style:normal}
.sum .sig{display:block;font-size:1.45em;line-height:.92;font-style:normal}

/* layout */
.row{display:flex;gap:46px;align-items:center}
.row.top{align-items:flex-start}
.row.stretch{align-items:stretch}
.col{flex:1;min-width:0}
.rule{height:1.5px;background:var(--rule);margin:20px 0;border:0}
.card{background:var(--bg-alt);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;box-shadow:var(--shadow)}
.card.accent{border-color:var(--accent)}
.pill{display:inline-block;padding:4px 13px;border-radius:20px;background:var(--accent);color:var(--bg);
  font-family:var(--font-sans);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}

/* section divider */
.divider{justify-content:center;align-items:flex-start}
.divider .num{font-family:var(--font-sans);font-size:13px;letter-spacing:.22em;color:var(--accent);
  font-weight:700;margin-bottom:16px}
.divider h1{font-size:72px}
.divider .sub{font-size:23px;color:var(--ink-soft);font-style:italic;margin-top:18px}
.divider .bar{width:90px;height:4px;background:var(--accent);border-radius:2px;margin-top:26px}

/* title */
.title-rule{width:82px;height:4px;background:var(--accent);margin:24px 0 28px;border-radius:2px}
.meta{font-family:var(--font-sans);font-size:15.5px;color:var(--ink-soft);line-height:1.85}
.meta b{color:var(--ink);font-weight:600}

/* tables */
table{border-collapse:collapse;width:100%;font-size:14px}
.sched td{padding:4px 10px;font-size:13.2px;line-height:1.28}
.sched th{padding:5px 10px}
th{font-family:var(--font-sans);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-soft);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--rule);font-weight:600}
td{padding:5.5px 10px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.35}
tr.hi td{background:color-mix(in srgb,var(--accent) 9%,transparent);font-weight:700}
tr.dim td{color:var(--ink-soft);font-style:italic}
/* A cancelled slot stays on the list rather than vanishing — anyone who registered for
   it needs to see that it is gone. The strike lives on an <s> around the text, not on
   the row: text-decoration inherits into descendants and cannot be switched off there,
   so a row-level line-through would score through the badge too. */
tr.closed td{color:var(--ink-soft)}
.tag{font-family:var(--font-sans);font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);
  border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:1px;white-space:nowrap}
td.wk{font-family:var(--font-sans);font-weight:700;font-size:13px;width:44px}
td.dt{font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft);width:88px;white-space:nowrap}

/* assessment bars */
/* one bar, adding to 100% */
.stackbar{display:flex;width:100%;height:104px;border-radius:10px;overflow:hidden;
  box-shadow:var(--shadow);margin-top:10px}
.stackbar .seg{display:flex;flex-direction:column;justify-content:center;align-items:center;
  color:var(--bg);padding:0 6px;text-align:center;min-width:0}
.stackbar .sp{font-family:var(--font-math);font-size:31px;font-weight:700;line-height:1}
.stackbar .sn{font-family:var(--font-sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;
  margin-top:5px;opacity:.92}
.stacknote{display:flex;width:100%;margin-top:9px;font-family:var(--font-sans);
  font-size:11.5px;color:var(--ink-soft)}
.stacknote span:nth-child(1){flex:30}.stacknote span:nth-child(2){flex:10}
.stacknote span:nth-child(3){flex:20}.stacknote span:nth-child(4){flex:40}
.stacknote span{text-align:center;padding:0 4px}
.assess{display:flex;flex-direction:column;gap:13px;margin-top:8px}
.abar{display:flex;align-items:center;gap:16px}
.abar .nm{width:210px;font-size:19px;font-weight:700}
.abar .tr{flex:1;height:26px;background:var(--bg-alt);border-radius:5px;overflow:hidden;border:1px solid var(--rule)}
.abar .fl{height:100%;background:var(--accent);border-radius:4px 0 0 4px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.abar .pc{width:56px;text-align:right;font-family:var(--font-math);font-size:21px;font-weight:700}
.abar .dt2{width:150px;font-family:var(--font-sans);font-size:12.5px;color:var(--ink-soft)}

/* Fragments: opacity only, and fast.
   A `transform` promotes the element to its own composited layer, which switches text
   from subpixel to grayscale antialiasing for the duration -- most visible on bold.
   And any slow fade makes heavy glyphs readable before light ones. So: no transform,
   and short enough that nothing can be perceived as arriving first. */
/* Fragments appear instantly. With no intermediate opacity there is no window in
   which one weight of text can be more legible than another. */
.frag{opacity:0}
.frag.on{opacity:1}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}

/* chrome */
#progress{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);width:0;
  transition:width .4s cubic-bezier(.4,0,.2,1);z-index:60}
#pagenum{position:fixed;right:20px;bottom:15px;font-family:var(--font-sans);font-size:12px;
  color:var(--ink-soft);letter-spacing:.06em;z-index:60}
#themebar{position:fixed;left:18px;bottom:13px;display:flex;gap:7px;z-index:60;
  font-family:var(--font-sans);align-items:center;transition:opacity .2s}
#themebar .lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-right:3px}
.swatch{width:22px;height:22px;border-radius:6px;cursor:pointer;border:1.5px solid var(--rule);
  position:relative;transition:transform .18s ease,box-shadow .18s ease}
.swatch:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.swatch.sel{outline:2px solid var(--accent);outline-offset:2px}
.swatch i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;font-family:var(--font-sans);
  font-size:11px;color:var(--ink-soft);letter-spacing:.05em;opacity:.7;transition:opacity .2s}

/* overview */
/* ---- annotation layer: draw straight onto the slide, pen or mouse ---- */
#ink{position:fixed;inset:0;z-index:70;pointer-events:none;touch-action:none}
body.inking #ink{pointer-events:auto;cursor:crosshair}
#inkbar{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;z-index:75;display:none;
  align-items:center;gap:9px;padding:8px 14px;border-radius:26px;background:var(--bg-alt);
  border:1px solid var(--rule);box-shadow:var(--shadow);font-family:var(--font-sans)}
body.inking #inkbar{display:flex}
#inkbar .ib-lbl{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.ib-sw{width:19px;height:19px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.ib-sw.sel{border-color:var(--ink)}
.ib-sep{width:1px;height:20px;background:var(--rule);margin:0 3px}
.ib-sz{width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:1.5px solid transparent}
.ib-sz::after{content:"";width:var(--d);height:var(--d);border-radius:50%;background:var(--ink-soft)}
.ib-sz.sel{border-color:var(--ink)}
.ib-sz.sel::after{background:var(--ink)}
.ib-btn{font-size:11.5px;color:var(--ink-soft);cursor:pointer;padding:3px 8px;border-radius:12px}
.ib-btn:hover{background:var(--rule);color:var(--ink)}
.ib-btn.sel{background:var(--ink);color:var(--bg)}
/* Multi-column, not grid: multicol flows top-to-bottom then across, which is the
   reading order for a slide sorter. A grid would fill left-to-right first. */
#overview{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto;padding:30px;
  display:none;column-width:210px;column-gap:15px}
#overview.on{display:block}
#overview .thumb{break-inside:avoid;margin-bottom:15px;width:100%}
.thumb{aspect-ratio:16/9;border:1.5px solid var(--rule);border-radius:9px;cursor:pointer;background:var(--bg-alt);
  padding:12px;overflow:hidden;position:relative;transition:transform .18s ease,border-color .18s ease}
.thumb:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
.thumb .tt{font-family:var(--font-display);font-size:13.5px;font-weight:700;line-height:1.25}
.thumb .ts{font-family:var(--font-sans);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:5px;font-weight:700}
.thumb .tn{position:absolute;right:8px;bottom:6px;font-family:var(--font-sans);font-size:10px;color:var(--ink-soft)}
.thumb .tm{position:absolute;left:12px;bottom:6px;font-family:var(--font-sans);font-size:9.5px;color:var(--accent);font-weight:700}
/* presenter clock: elapsed against the planned cumulative time */
#clock{position:fixed;right:20px;top:16px;z-index:62;display:none;align-items:center;gap:10px;
  padding:7px 14px;border-radius:22px;background:var(--bg-alt);border:1px solid var(--rule);
  box-shadow:var(--shadow);font-family:var(--font-sans);font-size:13px}
body.timing #clock{display:flex}
#clock .el{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
#clock .dl{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
#clock .dl.ahead{color:var(--accent2)}
#clock .dl.behind{color:var(--accent)}
.thumb.cur{border-color:var(--accent);border-width:2.5px}
.thumb.divider-t{background:var(--ink);border-color:var(--ink)}
.thumb.divider-t .tt{color:var(--bg)}

/* demos */
.demo{display:flex;gap:28px;align-items:flex-start}
.demo-plot{flex:1.35}
.demo-plot svg,.fig svg{width:100%;display:block}
li.qz::before{display:none}li.qz{padding-left:6px}
#of5 text,#bvp5 text,#bvs5 text,#bvc5 text,#bvi5 text,#bvk5 text,#bvt5 text,#cvc5 text,#dd5 text,#hfv5 text,#uat7a text,#uat7b text,#uat7c text,#uat7d text,#relu7 text,#depth7 text,#act7 text,#sgd7 text,#grd6 text,#grow6 text,#vc6 text,#sc6 text,#goal6 text,#goal6r text,#bnd6 text,#bnd6f text,#bnd6r text,#ddx6 text,#hoef6 text,#pick6 text,#rlzc6 text{paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.texd .katex{font-size:1.12em}

/* ---- figures, images, video ---- */
/* Rounded corners, no outline. A border plus a filled background drew a visible
   box around every image — obvious when the image letterboxes inside it. */

  background:transparent;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.fig img,.fig video{display:block;width:100%;height:auto}
/* Click-to-load YouTube facade. Nothing is requested from Google until the play button is
   pressed, so the deck opens instantly and makes no third-party connection if the video is
   never reached. Used wherever we point at someone else's clip instead of re-hosting it. */
.ytfacade{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;
  position:relative;line-height:0;border-radius:inherit;overflow:hidden}
.ytfacade img{display:block;width:100%;height:auto}
.ytplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:78px;height:55px;
  border-radius:13px;background:rgba(18,18,18,.72);transition:background .16s ease}
.ytplay::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-38%,-50%);
  border-style:solid;border-width:11px 0 11px 19px;border-color:transparent transparent transparent #fff}
.ytfacade:hover .ytplay,.ytfacade:focus-visible .ytplay{background:#cc0000}
.ytwrap iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
/* Height-capped figures: letterbox rather than crop.
   Flex + max-height (not grid + height:100%) — a percentage height inside an
   auto-sized grid row resolves to auto, which lets the image overflow and clip. */
/* letterboxed figures get no shadow either — there is nothing to cast one */
.fig[class*="h-"]{display:flex;align-items:center;justify-content:center;background:transparent;box-shadow:none}
.fig[class*="h-"] img,.fig[class*="h-"] video{width:auto;height:auto;max-width:100%;max-height:100%}
.fig[class*="h-"] svg{width:100%;height:100%}

.fig.h-290{height:290px}.fig.h-330{height:330px}

/* ---------- PRINT: one page per slide ----------
   The deck is a 1280x720 design canvas that fit() scales to the window. For print we
   drop that scale, let the slides flow one after another instead of stacking, and set
   the page to the same 1280x720 -- 13.333in x 7.5in at 96dpi, the standard widescreen
   slide size -- so a printed page is what the projector shows, at 1:1.
   Chrome's "Save as PDF" destination turns this into a deck PDF. */
@media print{
  @page{ size:13.333in 7.5in; margin:0 }
  html,body{height:auto;overflow:visible}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact;transition:none}
  #stage{position:static;display:block;transition:none}
  #canvas{transform:none!important;width:1280px;height:auto;overflow:visible;
    background:transparent;transition:none}
  .slide{position:relative;inset:auto;width:1280px;height:720px;overflow:hidden;
    background:var(--bg);opacity:1!important;visibility:visible!important;
    transition:none!important;break-after:page;page-break-after:always}
  .slide:last-child{break-after:auto;page-break-after:auto}
  .frag{opacity:1!important}
  /* presenter chrome has no business on paper */
  #progress,#pagenum,#hint,#themebar,#ink,#inkbar,#clock,#overview{display:none!important}
}

{s:"Recap and Goals", t:"From linear to nonlinear models", html:`
<div class="eyebrow">Recap · The models</div><h2>From linear to nonlinear models</h2><div class="flow7-body"><div class="flow7-two"><div class="flow7-panel"><div class="eyebrow">Where we started</div><h3>Linear models</h3><p class="flow7-answer">Regression and classification</p><ul class="flow7-bullets"><li><span class="tex" data-tex="\\mathbf{w}^{\\top}\\mathbf{x}+b"></span></li><li>A linear score in the original inputs</li></ul></div><div class="flow7-panel frag" data-f="0"><div class="eyebrow">The basis function trick</div><h3>Nonlinear models</h3><p class="flow7-answer">Transform the inputs, then fit a linear model</p><ul class="flow7-bullets"><li><span class="tex" data-tex="\\mathbf{w}^{\\top}\\boldsymbol{\\phi}(\\mathbf{x})+b"></span></li><li>Features <span class="tex" data-tex="\\boldsymbol{\\phi}"></span> chosen by us</li></ul></div></div></div>
`},

{s:"Recap and Goals", t:"Understanding the test error", html:`
<div class="eyebrow">Recap · The analysis</div><h2>Understanding the test error</h2><div class="n7-recap"><div class="n7-recap-block"><div class="eyebrow">Bias–variance · an error decomposition</div><div class="n7-word-eq">Expected test error = <span class="recap7-bias">Bias²</span> + <span class="recap7-variance">Variance</span> + <span class="recap7-noise">Noise</span></div><div class="n7-recap-key"><span><b class="recap7-bias">Bias²</b><br>Systematic error</span><span><b class="recap7-variance">Variance</b><br>Sensitivity to the training set</span><span><b class="recap7-noise">Noise</b><br>Uncertainty in the targets</span></div></div><div class="n7-recap-block frag" data-f="0"><div class="eyebrow">PAC · a generalisation bound</div><div class="n7-word-eq"><span class="recap7-test">Test error</span> ≤ <span class="recap7-training">Training error</span> + <span class="recap7-penalty">Complexity penalty <span class="tex" data-tex="(|\\mathcal H|,N,\\delta)"></span></span></div><p class="n7-centre-note">More hypotheses → larger penalty &nbsp; · &nbsp; More data → smaller penalty</p></div></div>
`},

      <p style="font-size:20px;max-width:none;margin-bottom:10px">How to construct image features?</p>
      <div style="display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap"><span class="card" style="padding:7px 13px;font-size:17px">edges?</span><span style="color:var(--ink-soft);font-size:21px"></span><span class="card" style="padding:7px 13px;font-size:17px">corners?</span><span style="color:var(--ink-soft);font-size:21px"></span><span class="card" style="padding:7px 13px;font-size:17px">textures?</span><span style="color:var(--ink-soft);font-size:21px"></span><span class="card" style="padding:7px 13px;font-size:17px">parts?</span><span style="color:var(--ink-soft);font-size:21px"></span><span class="card" style="padding:7px 13px;font-size:17px">objects?</span><span style="color:var(--ink-soft);font-size:21px"></span><span class="card" style="padding:7px 13px;font-size:17px">relations?</span></div>
      <p class="frag" data-f="0" style="font-size:20px;max-width:none;margin-top:18px">Useful image features are difficult to design by hand.</p>
    </div>
  </div>
`},

eta_2}"></span></div></foreignObject><g class="c7-arrow" data-start="935" data-end="978" data-y="110"><path d="M935 110 H978" fill="none" stroke="var(--s1)" stroke-width="2.4"/><path d="M978 110 L968 105 L968 115 Z" fill="var(--s1)"/></g><text class="c7-endpoint" x="1020" y="110" text-anchor="middle" dominant-baseline="central" font-family="KaTeX_Main, Times New Roman, serif" font-style="italic" font-weight="400" font-size="31" fill="var(--ink)">y</text><text x="250" y="44" text-anchor="middle" dominant-baseline="middle" font-size="23" fill="var(--s1)">Compute the features</text><text x="800" y="44" text-anchor="middle" dominant-baseline="middle" font-size="23" fill="var(--s1)">Combine their outputs</text><text x="250" y="188" text-anchor="middle" dominant-baseline="middle" font-size="21" fill="var(--ink-soft)">Parameters: centres and widths</text><text x="800" y="188" text-anchor="middle" dominant-baseline="middle" font-size="21" fill="var(--ink-soft)">Parameters: output weights</text></svg><div class="eq l7-eq n7-equation" style="font-size:27px;margin:14px 0"><span class="texd" data-tex="\\mathbf z^{(2)}=\\boldsymbol\\phi_{\\theta_1}(x)=f_{1,\\theta_1}(x)"></span></div><div class="eq l7-eq n7-equation" style="font-size:27px;margin:14px 0"><span class="texd" data-tex="y=\\mathbf w^\\top\\mathbf z^{(2)}=f_{2,\\theta_2}(\\mathbf z^{(2)})"></span></div><p class="n7-centre-note">The full prediction is <span class="tex" data-tex="y=f_{2,\\theta_2}(f_{1,\\theta_1}(x))=(f_{2,\\theta_2}\\circ f_{1,\\theta_1})(x)"></span>.</p>

ignObject><g class="c7-arrow" data-start="634" data-end="736" data-y="112"><path d="M634 112 H736" fill="none" stroke="var(--s1)" stroke-width="2.4"/><path d="M736 112 L726 107 L726 117 Z" fill="var(--s1)"/><text class="c7-arrow-label" data-arrow-midpoint="685.0" x="685.0" y="100" text-anchor="middle" font-family="KaTeX_Main, Times New Roman, serif" font-size="27" fill="var(--ink)"><tspan font-weight="700">z</tspan><tspan baseline-shift="super" font-size="18">(3)</tspan></text></g><rect class="c7-function-box" x="752.0" y="69.0" width="176" height="86" rx="8" fill="var(--bg-alt)" stroke="var(--s1)" stroke-width="2"/><foreignObject class="d7-mathbox" x="752.0" y="69.0" width="176" height="86"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:31px"><span class="tex" style="transform:translate(0.5px,-3px)" data-tex="f_{3,\\theta_3}"></span></div></foreignObject><g class="c7-arrow" data-start="944" data-end="978" data-y="112"><path d="M944 112 H978" fill="none" stroke="var(--s1)" stroke-width="2.4"/><path d="M978 112 L968 107 L968 117 Z" fill="var(--s1)"/></g><text class="c7-endpoint" x="1020" y="112" text-anchor="middle" dominant-baseline="central" font-family="KaTeX_Main, Times New Roman, serif" font-style="italic" font-weight="400" font-size="31" fill="var(--ink)">y</text><foreignObject class="d7-mathbox" x="90.0" y="172.5" width="260" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\text{Parameters }\\theta_1"></span></div></foreignObject><foreignObject class="d7-mathbox" x="400.0" y="172.5" width="260" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\text{Parameters }\\theta_2"></span></div></foreignObject><foreignObject class="d7-mathbox" x="710.0" y="172.5" width="260" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\text{Parameters }\\theta_3"></span></div></foreignObject></svg><div class="eq l7-eq n7-equation" style="font-size:29px;margin:14px 0"><span class="texd" data-tex="y=f_{3,\\theta_3}(f_{2,\\theta_2}(f_{1,\\theta_1}(\\mathbf x)))=(f_{3,\\theta_3}\\circ f_{2,\\theta_2}\\circ f_{1,\\theta_1})(\\mathbf x)"></span></div><p class="n7-centre-note">The intermediate outputs are learned representations.</p>

-style="italic" font-weight="400" font-size="31" fill="var(--ink)">y</text><foreignObject class="d7-mathbox" x="90.0" y="176.0" width="230" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\text{Parameters }\\theta_1"></span></div></foreignObject><foreignObject class="d7-mathbox" x="345.0" y="176.0" width="230" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\text{Parameters }\\theta_2"></span></div></foreignObject><foreignObject class="d7-mathbox" x="735.0" y="176.0" width="230" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\text{Parameters }\\theta_L"></span></div></foreignObject></svg><div class="eq l7-eq n7-equation" style="font-size:29px;margin:14px 0"><span class="texd" data-tex="y=f_\\theta(\\mathbf x)=(f_{L,\\theta_L}\\circ\\cdots\\circ f_{2,\\theta_2}\\circ f_{1,\\theta_1})(\\mathbf x)"></span></div><p class="n7-centre-note"><span class="tex" data-tex="\\theta=(\\theta_1,\\ldots,\\theta_L)"></span> collects all the parameters.</p><p class="n7-centre-note">Each function computes the representation passed to the next.</p>

<p class="fwd7-footnote">Store each layer’s values for the backward pass.</p>
`},

{s:"Part II", t:"Question: remove the nonlinearity", html:`
<div class="actbadge">Question</div><div class="actq" style="font-size:29px;margin:16px 0 36px">Remove <span class="tex" data-tex="\\sigma"></span>. Can more linear layers represent nonlinear functions?</div><div class="f7-answers"><div class="card"><strong>A.</strong> Yes — composing linear layers creates nonlinear functions.</div><div class="card"><strong>B.</strong> No — the composition remains an affine map.</div></div>
`},

{s:"Part II", t:"Without nonlinear activations", html:`
<div class="eyebrow">II-A · Why nonlinearities matter</div><h2>Without nonlinear activations</h2><div class="eq l7-eq n7-equation" style="font-size:30px"><span class="texd" data-tex="\\mathbf{W}^{(2)}(\\mathbf{W}^{(1)}\\mathbf x+\\mathbf b^{(2)})+\\mathbf b^{(3)}"></span></div><div class="eq l7-eq n7-equation" style="font-size:30px"><span class="texd" data-tex="=\\underbrace{\\mathbf{W}^{(2)}\\mathbf{W}^{(1)}}_{\\mathbf{W}}\\mathbf x+\\underbrace{\\mathbf{W}^{(2)}\\mathbf b^{(2)}+\\mathbf b^{(3)}}_{\\mathbf b}"></span></div><p class="n7-centre-note">Composing affine layers gives another affine map.</p><p class="n7-centre-note">Nonlinear activations allow the network to represent more complex functions.</p>
`},

{s:"Part II", t:"From predictions to learning", html:`
<div class="eyebrow">II-B · Learning and optimisation</div><h2>From predictions to learning</h2><div class="flow7-body"><div class="flow7-chain"><div><strong>Forward pass</strong><br>Prediction</div><span class="flow7-arrow">→</span><div><strong>Loss</strong><br>Measure error</div><span class="flow7-arrow">→</span><div><strong>Backward pass</strong><br>Gradients</div><span class="flow7-arrow">→</span><div><strong>Update</strong><br>Parameters</div></div><p class="flow7-caption">Repeat over the training data. Every layer can learn from the final loss.</p></div>
`},

{s:"Part II", t:"Outputs and losses", html:`
<div class="eyebrow">II-B · Learning and optimisation</div><h2>Outputs and losses</h2><p class="caption" style="font-size:23px">Choose the output and loss to match the target, as in Lectures 2–3.</p><p class="small" style="font-size:23px">Here, a is an output score and t is one-hot.</p>
<table class="l7-losses"><thead><tr><th>Task / model</th><th>Output</th><th>Loss for one example</th></tr></thead><tbody><tr><td>Regression<br><span class="small">Gaussian, fixed variance</span></td><td><span class="tex" data-tex="y=a"></span></td><td><span class="tex" data-tex="\\frac12(y-t)^2"></span></td></tr><tr><td>Binary classification<br><span class="small">Bernoulli</span></td><td><span class="tex" data-tex="y=\\sigma(a)"></span></td><td><span class="tex" data-tex="-t\\log y-(1-t)\\log(1-y)"></span></td></tr><tr><td>Multiclass classification<br><span class="small">Categorical</span></td><td><span class="tex" data-tex="y_k=\\frac{e^{a_k}}{\\sum_j e^{a_j}}"></span></td><td><span class="tex" data-tex="-\\sum_k t_k\\log y_k"></span></td></tr></tbody></table>
`},

{s:"Part II", t:"The training objective", html:`
<div class="eyebrow">II-B · Learning and optimisation</div><h2>The training objective</h2><div class="eq l7-eq" style="font-size:31px"><span class="texd" data-tex="\\mathcal{L}(\\theta)=\\frac1N\\sum_{n=1}^{N}\\ell\\bigl(f_\\theta(\\mathbf{x}_n),t_n\\bigr)"></span></div><p class="" style="font-size:23px">Learn all weights and biases together by reducing the average loss.</p><div class="eq l7-eq" style="font-size:29px"><span class="texd" data-tex="\\theta\\leftarrow\\theta-\\eta\\nabla_\\theta\\mathcal{L}(\\theta)"></span></div><p class="lede" style="font-size:23px">How do we compute the gradient through all these layers?</p>
`},

{s:"Part II", t:"Gradient form from Lectures 1-3", html:`
<div class="eyebrow">Recall · Regression and classification</div><h2>Gradient form from Lectures 1-3</h2><p class="n7-copy">For each data point <span class="tex" data-tex="(\\mathbf{x},t)"></span>, the score is <span class="tex" data-tex="a=\\mathbf w^\\top\\mathbf x+b"></span>.</p><table class="l7-losses grad7-table"><thead><tr><th>Model</th><th>Output and loss</th><th>Error signal <span class="tex" data-tex="\\partial\\ell/\\partial a"></span></th></tr></thead><tbody><tr><td>Linear regression</td><td><span class="tex" data-tex="y=a,\\quad\\ell=\\tfrac12(y-t)^2"></span></td><td><span class="tex" data-tex="\\htmlClass{n7-error}{y-t}"></span></td></tr><tr><td>Binary classification</td><td><span class="tex" data-tex="y=\\sigma(a)"></span><br><span class="tex" data-tex="\\ell=-t\\log y-(1-t)\\log(1-y)"></span></td><td><span class="tex" data-tex="\\htmlClass{n7-error}{y-t}"></span></td></tr></tbody></table><div class="eq l7-eq n7-equation" style="font-size:31px"><span class="texd" data-tex="\\frac{\\partial\\ell}{\\partial w_i}=\\underbrace{\\htmlClass{n7-error}{(y-t)}}_{\\text{error signal}}\\;\\boldsymbol{\\cdot}\\;\\underbrace{\\htmlClass{n7-input}{x_i}}_{\\text{input}}"></span></div><p class="n7-centre-note">Multiply the scalar error signal by the scalar input.</p>
`},

ft)" stroke-width="2"/><text x="70" y="191" text-anchor="middle" font-size="18" fill="var(--ink)">2</text><foreignObject class="d7-mathbox" x="-5.0" y="256.0" width="150" height="62"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:23px"><span class="tex" data-tex="\\mathbf z^{(1)}"></span></div></foreignObject><circle cx="355" cy="55" r="24" fill="var(--bg)" stroke="var(--ink-soft)" stroke-width="2"/><text x="355" y="61" text-anchor="middle" font-size="18" fill="var(--ink)">1</text><circle cx="355" cy="140" r="24" fill="var(--bg)" stroke="var(--ink-soft)" stroke-width="2"/><text x="355" y="146" text-anchor="middle" font-size="18" fill="var(--ink)">2</text><circle cx="355" cy="225" r="24" fill="var(--bg)" stroke="var(--ink-soft)" stroke-width="2"/><text x="355" y="231" text-anchor="middle" font-size="18" fill="var(--ink)">3</text><foreignObject class="d7-mathbox" x="280.0" y="256.0" width="150" height="62"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:23px"><span class="tex" data-tex="\\mathbf z^{(2)}"></span></div></foreignObject><circle cx="665" cy="95" r="24" fill="var(--bg)" stroke="var(--ink-soft)" stroke-width="2"/><text x="665" y="101" text-anchor="middle" font-size="18" fill="var(--ink)">1</text><circle cx="665" cy="185" r="24" fill="var(--bg)" stroke="var(--ink-soft)" stroke-width="2"/><text x="665" y="191" text-anchor="middle" font-size="18" fill="var(--ink)">2</text><foreignObject class="d7-mathbox" x="590.0" y="256.0" width="150" height="62"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:23px"><span class="tex" data-tex="\\mathbf z^{(3)}"></span></div></foreignObject><circle cx="955" cy="140" r="24" fill="var(--bg)" stroke="var(--ink-soft)" stroke-width="2"/><text x="955" y="146" text-anchor="middle" font-size="18" fill="var(--ink)">1</text><foreignObject class="d7-mathbox" x="880.0" y="256.0" width="150" height="62"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:23px"><span class="tex" data-tex="\\mathbf z^{(4)}"></span></div></foreignObject><text x="70" y="25" text-anchor="middle" font-size="18" fill="var(--ink-soft)">Input</text><text x="355" y="25" text-anchor="middle" font-size="18" fill="var(--ink-soft)">Hidden layer</text><text x="665" y="25" text-anchor="middle" font-size="18" fill="var(--ink-soft)">Hidden layer</text><text x="955" y="25" text-anchor="middle" font-size="18" fill="var(--ink-soft)">Output</text><path d="M381 136 L629 100" fill="none" stroke="var(--s1)" stroke-width="4"/><path d="M641 98 L624 92 L627 106 Z" fill="var(--s1)"/><circle cx="355" cy="140" r="26" fill="var(--bg)" stroke="var(--s1)" stroke-width="3"/><circle cx="665" cy="95" r="26" fill="var(--bg)" stroke="var(--s2)" stroke-width="3"/><path d="M480 60 L480 121" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-dasharray="3 3"/><circle cx="480" cy="121" r="3" fill="var(--s1)"/><foreignObject x="430" y="12" width="100" height="62"><div xmlns="http://www.w3.org/1999/xhtml" style="text-align:center;font-size:24px"><span class="tex" data-tex="\\htmlClass{n7-input}{w^{(2)}_{1,2}}"></span></div></foreignObject><g class="frag" data-f="0"><foreignObject class="d7-mathbox" x="329.0" y="114.0" width="52" height="52"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\htmlClass{n7-input}{z^{(2)}_{n,2}}"></span></div></foreignObject></g><g class="frag" data-f="1"><path d="M934 128 C874 54 789 54 698 82" fill="none" stroke="var(--s2)" stroke-width="3"/><path d="M688 85 L699 73 L703 88 Z" fill="var(--s2)"/><foreignObject class="d7-mathbox" x="639.0" y="69.0" width="52" height="52"><div xmlns="http://www.w3.org/1999/xhtml" class="d7-math" style="font-size:20px"><span class="tex" data-tex="\\htmlClass{n7-error}{\\delta^{(3)}_{n,1}}"></span></div></foreignObject></g></svg><div class="frag" data-f="1"><div class="eq l7-eq n7-equation" style="font-size:31px"><span class="texd" data-tex="\\frac{\\partial\\ell_n}{\\partial w^{(2)}_{1,2}}=\\htmlClass{n7-error}{\\delta^{(3)}_{n,1}}\\;\\boldsymbol{\\cdot}\\;\\htmlClass{n7-input}{z^{(2)}_{n,2}}"></span></div></div><p class="n7-centre-note n7-small frag" data-f="1"><span class="tex" data-tex="n"></span> indexes the training example.</p>
`},

{s:"Part II", t:"Compute each weight gradient for data point n", html:`
<div class="eyebrow">II-B · Affine weighted inputs</div><h2>Compute each weight gradient for data point <span class="tex" data-tex="n"></span></h2><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="a^{(l+1)}_{n,j}=\\sum_i w^{(l)}_{j,i}z^{(l)}_{n,i}+b^{(l+1)}_j"></span></div><div class="eq l7-eq n7-equation" style="font-size:34px"><span class="texd" data-tex="\\frac{\\partial\\ell_n}{\\partial w^{(l)}_{j,i}}=\\underbrace{\\htmlClass{n7-error}{\\delta^{(l+1)}_{n,j}}}_{\\text{error signal}}\\;\\boldsymbol{\\cdot}\\;\\underbrace{\\htmlClass{n7-input}{z^{(l)}_{n,i}}}_{\\text{input}}"></span></div><div class="eq l7-eq n7-equation" style="font-size:28px"><span class="texd" data-tex="\\htmlClass{n7-error}{\\delta^{(l+1)}_{n,j}}\\equiv\\frac{\\partial\\ell_n}{\\partial a^{(l+1)}_{n,j}}"></span></div><p class="n7-centre-note"><span class="n7-error">Error signal:</span> how the final loss changes with this unit’s pre-activation.</p><p class="n7-centre-note">Backpropagation computes this signal through the downstream layers.</p>
`},

{s:"Part II", t:"Homework: Collect the gradients", html:`
<div class="eyebrow">II-B · Gradient accounting</div><h2>Homework: Collect the gradients</h2><p class="n7-copy">Show how each individual weight gradient becomes an entry of the gradient matrix.</p><div class="eq l7-eq n7-equation" style="font-size:34px;margin:12px 0"><span class="texd" data-tex="\\underbrace{\\frac{\\partial\\ell_n}{\\partial \\mathbf{W}^{(l)}}}_{M_{l+1}\\times M_l}=\\underbrace{\\htmlClass{n7-error}{\\boldsymbol\\delta^{(l+1)}_n}}_{M_{l+1}\\times 1}\\;\\boldsymbol{\\cdot}\\;\\underbrace{\\htmlClass{n7-input}{(\\mathbf z^{(l)}_n)^\\top}}_{1\\times M_l}"></span></div><p class="n7-centre-note" style="margin:10px 0">Column × row: an <strong>outer product</strong>. <span class="tex" data-tex="M_l"></span> is the number of units in layer l.</p><div class="eq l7-eq n7-equation" style="font-size:28px;margin:12px 0"><span class="texd" data-tex="\\frac{\\partial\\mathcal L}{\\partial \\mathbf{W}^{(l)}}=\\frac1N\\sum_{n=1}^N \\htmlClass{n7-error}{\\boldsymbol\\delta^{(l+1)}_n}\\cdot \\htmlClass{n7-input}{(\\mathbf z^{(l)}_n)^\\top}"></span></div><p class="n7-centre-note" style="margin:10px 0">Average the per-example gradients for the average training loss.</p><div class="eq l7-eq n7-equation" style="font-size:28px;margin:12px 0"><span class="texd" data-tex="\\frac{\\partial\\ell_n}{\\partial\\mathbf b^{(l+1)}}=\\htmlClass{n7-error}{\\boldsymbol\\delta^{(l+1)}_n}"></span></div>
`},

{s:"Part II", t:"Backpropagation in the tutorial", html:`
<div class="eyebrow">Tutorial 6 · Section 2</div><h2>Backpropagation in the tutorial</h2><div class="flow7-numbered"><div class="flow7-no">1</div><div><strong>Forward pass:</strong> record <span class="tex" data-tex="a^{(l)}_{n,j}"></span> and <span class="tex" data-tex="z^{(l)}_{n,j}"></span>.</div><div class="flow7-no">2</div><div><strong>Backward pass:</strong> calculate each <span class="tex" data-tex="\\htmlClass{n7-error}{\\delta^{(l)}_{n,j}}"></span>.</div><div class="flow7-no">3</div><div><strong>Weight gradients:</strong> <span class="tex" data-tex="\\htmlClass{n7-error}{\\delta^{(l+1)}_{n,j}}\\cdot\\htmlClass{n7-input}{z^{(l)}_{n,i}}"></span>.</div></div><div class="grad7-notation"><strong>Same layer notation as Tutorial 6</strong><p>The tutorial uses a <strong>sum</strong> of losses: omit the lecture’s factor <span class="tex" data-tex="1/N"></span>.</p><p>The lecture also shows biases explicitly. The tutorial’s network omits them for simplicity.</p></div>
`},

{s:"Part II", t:"Backpropagate through the layers", html:`

{s:"Part II", t:"Gradients and updates", html:`
<div class="eyebrow">II-B · Learning and optimisation</div><h2>Gradients and updates</h2><div class="row top"><div class="col"><h3>Backpropagation</h3><p class="" style="font-size:23px">Computes the gradient efficiently.</p><div class="eq l7-eq" style="font-size:27px"><span class="texd" data-tex="\\mathbf{g}=\\nabla_\\theta\\mathcal{L}(\\theta)"></span></div></div><div class="col"><h3>The optimiser</h3><p class="" style="font-size:23px">Uses the gradient to update the parameters.</p><div class="eq l7-eq" style="font-size:27px"><span class="texd" data-tex="\\theta\\leftarrow\\theta-\\eta\\mathbf{g}"></span></div></div></div><div class="rule"></div><p class="" style="font-size:23px">One forward pass and one backward pass give all parameter gradients.</p>
`},

{s:"Part III", t:"Part III", div:true, html:`
<div class="divider"><div class="num">Part III</div><h1>Why does it work?</h1><div class="bar"></div><div class="sub">What can we represent, and why can we learn it?</div></div>
`},

{s:"Part III", t:"Representation and learning", html:`
<div class="eyebrow">Part III · Learning objectives</div><h2>Representation and learning</h2><p class="n7-copy">By the end of this section, you should be able to:</p><div class="flow7-numbered"><div class="flow7-no">1</div><div><strong>Approximation:</strong> explain what a sufficiently wide MLP can represent.</div><div class="flow7-no">2</div><div><strong>Depth:</strong> explain how hierarchy and composition can save units.</div><div class="flow7-no">3</div><div><strong>Gradient descent:</strong> explain why small steps reduce a smooth loss and gradients approach zero.</div><div class="flow7-no">4</div><div><strong>SGD:</strong> explain unbiased gradients and the noise floor with a fixed step size.</div></div>
`},

{s:"Part III", t:"Universal approximation", html:`
<div class="eyebrow">III-A · What can we represent?</div><h2>Universal approximation</h2><p class="f7-uat-copy">For any continuous target <span class="tex" data-tex="f:[0,1]\\to\\mathbb R"></span> and any accuracy <span class="tex" data-tex="\\varepsilon&gt;0"></span>:</p><div class="eq l7-eq n7-equation" style="font-size:37px"><span class="texd" data-tex="\\hat f(x)=b^{(3)}_1+\\sum_{j=1}^M w^{(2)}_{1,j}\\,\\sigma(w^{(1)}_{j,1}x+b^{(2)}_j)"></span></div><p class="f7-uat-copy f7-center">There is a width and a set of weights such that</p><div class="eq l7-eq n7-equation" style="font-size:37px"><span class="texd" data-tex="\\max_{x\\in[0,1]}|f(x)-\\hat f(x)|&lt;\\varepsilon"></span></div><p class="f7-uat-copy f7-center">One hidden layer with sigmoid activation is enough.</p><p class="cred" style="font-size:18px">Cybenko (1989) · continuous targets on compact domains.</p>
`},

{s:"Part III", t:"A staircase approximation", draw:"uat7a", html:`
<div class="eyebrow">Proof sketch in pictures &#183; 1 of 4</div>
  <h2>A staircase approximation</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="uat7a" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 10px;font-size:21px"><span class="texd" data-tex="g(x) = \\begin{cases} c_0, &amp; x \\le \\tau_1 \\\\ c_1, &amp; \\tau_1 &lt; x \\le \\tau_2 \\\\ \\;\\;\\vdots &amp; \\\\ c_M, &amp; x &gt; \\tau_M \\end{cases}"></span></div>
      <div class="ctrl-row"><label>jumps M <span class="val" id="uat7mv">5</span></label>
        <input type="range" aria-label="Number of jumps" id="uat7mr" min="1" max="40" step="1" value="5"></div>
      <div class="warn" id="uat7awarn" style="min-height:52px"></div>
      <p class="caption" style="margin-top:6px;font-size:18px"><span class="tex" data-tex="c_j"></span>: <span class="tex" data-tex="f"></span> at the centre of step <span class="tex" data-tex="j"></span></p>
    </div>
  </div>
`},

{s:"Part III", t:"A sum of jumps", draw:"uat7b", html:`
<div class="eyebrow">Proof sketch in pictures &#183; 2 of 4</div>
  <h2>A sum of jumps</h2>
  <div class="fig" style="background:transparent;box-shadow:none;padding:0">
    <svg id="uat7b" viewBox="0 0 960 300"></svg>
  </div>
  <div class="eq" style="margin:4px 0 0;font-size:24px"><span class="texd" data-tex="g(x) = c_0 + \\sum_{j=1}^{M} \\Delta_j\\, \\mathbb{1}[x &gt; \\tau_j], \\qquad \\Delta_j = c_j - c_{j-1}"></span></div>
`},

{s:"Part III", t:"A sigmoid is a soft step", draw:"uat7c", html:`
<div class="eyebrow">Proof sketch in pictures &#183; 3 of 4</div>
  <h2>A sigmoid is a soft step</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="uat7c" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0 0 6px;font-size:21px"><span class="texd" data-tex="\\sigma\\bigl(k(x - \\tau)\\bigr) = \\frac{1}{1 + \\exp\\bigl(-k(x - \\tau)\\bigr)}"></span></div>
      <ul style="margin:0 0 4px"><li style="font-size:20px;margin-bottom:4px"><span class="tex" data-tex="x \\ll \\tau"></span>: <span class="tex" data-tex="\\approx 0"></span></li>
        <li style="font-size:20px;margin-bottom:4px"><span class="tex" data-tex="x \\gg \\tau"></span>: <span class="tex" data-tex="\\approx 1"></span></li>
        <li style="font-size:20px;margin-bottom:4px">Multiply by <span class="tex" data-tex="\\Delta"></span>: a jump from 0 to <span class="tex" data-tex="\\Delta"></span></li></ul>
      <div class="ctrl-row"><label>steepness k <span class="val" id="uat7kv">10</span></label>
        <input type="range" aria-label="Sigmoid steepness" id="uat7kr" min="0" max="2.5" step="0.05" value="1"></div>
      
    </div>
  </div>
`},

{s:"Part III", t:"A sum of sigmoid units", draw:"uat7d", html:`
<div class="eyebrow">Proof sketch in pictures &#183; 4 of 4</div>
  <h2>A sum of sigmoid units</h2>
  <div class="demo">
    <div class="demo-plot"><svg id="uat7d" viewBox="0 0 560 300"></svg></div>
    <div class="demo-ctrl">
      <div class="eq" style="margin:0;font-size:20px"><span class="texd" data-tex="g(x) = c_0 + \\sum_{j=1}^{M} \\Delta_j\\, \\mathbb{1}[x &gt; \\tau_j]"></span></div>
      <div style="font-size:24px;text-align:center;color:var(--s1);line-height:1">&#8595;</div>
      <div class="eq" style="margin:0 0 6px;font-size:20px"><span class="texd" data-tex="\\hat{f}(x) = c_0 + \\sum_{j=1}^{M} \\Delta_j\\, \\sigma\\bigl(k(x - \\tau_j)\\bigr)"></span></div>
      <div class="eq n7-equation" style="font-size:19px;margin:8px 0"><span class="texd" data-tex="w^{(1)}_{j,1}=k,\\qquad b^{(2)}_j=-k\\tau_j"></span></div><div class="eq n7-equation" style="font-size:19px;margin:8px 0"><span class="texd" data-tex="w^{(2)}_{1,j}=\\Delta_j,\\qquad b^{(3)}_1=c_0"></span></div>
      <div class="ctrl-row"><label>units M <span class="val" id="uat7dmv">5</span></label>
        <input type="range" aria-label="Number of sigmoid units" id="uat7dmr" min="1" max="100" step="1" value="5"></div>
      <div class="ctrl-row"><label>steepness k <span class="val" id="uat7dkv">63</span></label>
        <input type="range" aria-label="Sum steepness" id="uat7dkr" min="0" max="3" step="0.05" value="1.8"></div>
      <div class="warn" id="uat7dwarn" style="min-height:52px"></div>
    </div>
  </div>
`},

{s:"Part III", t:"What UAT guarantees", html:`
<div class="eyebrow">III-A · Approximation</div><h2>What UAT guarantees</h2><p class="n7-copy">A sufficiently wide network can approximate a continuous target arbitrarily well.</p><div class="eq l7-eq n7-equation" style="font-size:32px"><span class="texd" data-tex="\\forall\\varepsilon&gt;0,\\quad\\exists\\theta:\\quad\\max_x|f(x)-f_\\theta(x)|&lt;\\varepsilon"></span></div><h3 style="margin-top:34px">Caveats:</h3><ul class="flow7-bullets f7-bullets"><li>No bound here on how many hidden units we need.</li><li>No guarantee that training finds these weights.</li><li>No guarantee of low test error.</li></ul><!-- Instructor note: In the sigmoid construction, first make the staircase approximation fine enough, then smooth the small jumps. A continuous sigmoid cannot converge uniformly to a fixed discontinuous step. The theorem concerns the continuous target. -->
`},

{s:"Part III", t:"If one hidden layer is enough,<br>why go deep?", html:`
<div class="eyebrow">III-A · Why depth?</div><h2>If one hidden layer is enough,<br>why go deep?</h2><p class="" style="font-size:23px">Depth can represent some functions with far fewer units.</p><div class="eq l7-eq" style="font-size:32px"><span class="texd" data-tex="f_\\theta=f_L\\circ\\cdots\\circ f_1"></span></div><p class="" style="font-size:23px">Later layers reuse and combine earlier computations.</p><div class="rule"></div><p class="caption" style="font-size:23px">The benefit depends on the structure of the target function.</p>
`},

{s:"Part III", t:"Hierarchy and compositionality", html:`

`},

{s:"Part III", t:"Weighted ReLUs add up", draw:"relu7", html:`

`},

{s:"Part III", t:"Representation and learning", html:`
<div class="eyebrow">Part III · Learning objectives</div><h2>Representation and learning</h2><p class="n7-copy">Now focus on steps 3 and 4:</p><div class="flow7-numbered"><div class="flow7-no f7-muted">1</div><div class="f7-muted"><strong>Approximation:</strong> explain what a sufficiently wide MLP can represent.</div><div class="flow7-no f7-muted">2</div><div class="f7-muted"><strong>Depth:</strong> explain how hierarchy and composition can save units.</div><div class="flow7-no">3</div><div class="f7-current"><strong>Gradient descent:</strong> explain why small steps reduce a smooth loss and gradients approach zero.</div><div class="flow7-no">4</div><div class="f7-current"><strong>SGD:</strong> explain unbiased gradients and the noise floor with a fixed step size.</div></div>
`},

{s:"Part III", t:"Gradient descent", html:`
<div class="eyebrow">III-B · Learning algorithms</div><h2>Gradient descent</h2><div style="width:900px;margin-left:auto;margin-right:auto"><p style="font-size:23px;max-width:none;line-height:1.45;margin:0 0 22px">Choose initial parameters <span class="tex" data-tex="\\theta_0"></span>, step size <span class="tex" data-tex="\\eta&gt;0"></span>, and <span class="tex" data-tex="T"></span> updates.</p><div style="padding:24px 36px;background:var(--bg-alt);font:24px/1.4 var(--font-sans);box-sizing:border-box"><div style="margin-bottom:12px"><strong>for</strong> <span class="tex" data-tex="s=0,\\ldots,T-1"></span>:</div><div style="padding-left:32px;font-size:22px;line-height:1.4;height:44px;color:var(--ink-soft)">Use all <span class="tex" data-tex="N"></span> training examples.</div><div style="font-size:30px;padding-left:32px;height:70px;display:flex;align-items:center"><span class="tex" data-tex="\\displaystyle \\mathbf g_s\\leftarrow\\frac1N\\sum_{n=1}^{N}\\nabla_\\theta\\ell_n(\\theta_s)"></span></div><div style="padding-left:32px;margin-top:18px;font-size:27px"><span class="tex" data-tex="\\theta_{s+1}\\leftarrow\\theta_s-\\eta\\mathbf g_s"></span></div><div style="margin-top:20px"><strong>return</strong> <span class="tex" data-tex="\\theta_T"></span></div></div><p style="font-size:21px;line-height:1.45;max-width:none;margin:23px 0 0"><span class="tex" data-tex="\\ell_n"></span> is the loss on training example <span class="tex" data-tex="n"></span>.</p></div>
`},

{s:"Part III", t:"Gradient descent reduces the loss", draw:"stepg7", html:`
<div class="eyebrow">III-B · Learning</div><h2>Gradient descent reduces the loss</h2><p class="" style="font-size:22px">A gradient tells us which way to change a parameter.</p><div class="g7-split"><div><svg id="stepg7" class="g7-figure" viewBox="0 0 620 300" role="img" aria-label="Quadratic loss and the effect of one gradient-descent step"></svg></div><div><div class="eq l7-eq" style="font-size:26px"><span class="texd" data-tex="\\mathcal{L}(\\theta)=\\tfrac12\\theta^2"></span></div><div class="eq l7-eq" style="font-size:24px"><span class="texd" data-tex="\\theta=2,\\quad\\nabla\\mathcal{L}(\\theta)=2"></span></div><div class="g7-control"><label for="stepg7eta">Step size η: <output id="stepg7etav">0.5</output></label><input id="stepg7eta" type="range" min="0.05" max="2.2" step="0.05" value="0.5"></div><div class="g7-readout" id="stepg7values" aria-live="polite"></div><button class="bbtn" type="button" id="stepg7reset">Reset</button></div></div><p class="caption" style="font-size:21px"><strong>Gradient descent</strong> uses the full gradient. <strong>SGD</strong> estimates it from sampled examples.</p>
`},

{s:"Part III", t:"What is a Lipschitz gradient?", html:`
<div class="eyebrow">III-B · Gradient descent</div><h2>What is a Lipschitz gradient?</h2><p class="n7-copy">The gradient changes at a bounded rate. We call this a <strong>smooth</strong> loss.</p><div class="eq l7-eq n7-equation" style="font-size:31px"><span class="texd" data-tex="\\|\\nabla\\mathcal L(\\mathbf u)-\\nabla\\mathcal L(\\mathbf v)\\|\\le\\beta\\|\\mathbf u-\\mathbf v\\|"></span></div><p class="n7-centre-note">β controls how much the gradient can change when the parameters move.</p><svg viewBox="0 0 1040 215" role="img" aria-label="For one parameter, the gradient is a function whose slope is bounded. Moving from v to u bounds how much the gradient can change." style="width:100%;display:block;font-family:var(--font-sans);fill:var(--ink)"><path d="M200 178H841 M201 177V15" fill="none" stroke="var(--ink-soft)" stroke-width="2"/><path d="M233 156 L775 48" fill="none" stroke="var(--s1)" stroke-width="4"/><circle cx="344" cy="134" r="6" fill="var(--s1)"/><circle cx="680" cy="67" r="6" fill="var(--s1)"/><path d="M344 134H680V67" fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-dasharray="6 4"/><text x="346" y="200" text-anchor="middle" font-size="20" fill="var(--ink)">v</text><text x="680" y="200" text-anchor="middle" font-size="20" fill="var(--ink)">u</text><text x="520" y="163" text-anchor="middle" font-size="19" fill="var(--s2)">Parameter change</text><text x="706" y="100" text-anchor="start" font-size="19" fill="var(--s2)">Gradient change</text><text x="202" y="11" text-anchor="start" font-size="17" fill="var(--ink-soft)">Gradient</text><text x="841" y="200" text-anchor="middle" font-size="17" fill="var(--ink-soft)">Parameter</text></svg><!-- Instructor note: In one dimension, |L double-prime(theta)| <= beta is sufficient for a beta-Lipschitz gradient. -->
`},

{s:"Part III", t:"When does gradient descent decrease the loss?", html:`
<div class="eyebrow">III-B · The goal of the proof</div><h2>When does gradient descent decrease the loss?</h2><div style="width:100%"><p class="n7-copy" style="font-size:25px">Find a range of learning rates that guarantees a decrease at each step.</p><div class="eq l7-eq n7-equation" style="font-size:28px;margin:25px 0"><span class="texd" data-tex="\\theta_{s+1}=\\theta_s-\\eta\\nabla\\mathcal L(\\theta_s)"></span></div><p class="n7-centre-note">For a <span class="tex" data-tex="\\beta"></span>-smooth loss, we will show:</p><div class="eq l7-eq n7-equation" style="font-size:31px;margin:25px 0"><span class="texd" data-tex="0&lt;\\eta\\le\\frac1\\beta\\quad\\Longrightarrow\\quad\\mathcal L(\\theta_{s+1})\\le\\mathcal L(\\theta_s)"></span></div><p class="n7-centre-note" style="font-size:23px">The decrease is strict whenever the gradient is nonzero.</p><p class="n7-copy" style="font-size:24px;margin-top:38px"><strong>Proof idea:</strong> bound the loss after a step, then substitute the gradient-descent update.</p></div>
`},

{s:"Part III", t:"Start from Taylor’s theorem", html:`
<div class="eyebrow">III-B · Descent proof</div><h2>Start from Taylor’s theorem</h2><p class="n7-copy">For a twice-differentiable loss, expand around θ. Let <span class="tex" data-tex="\\mathbf g=\\nabla\\mathcal L(\\theta)"></span>.</p><div class="eq l7-eq n7-equation" style="font-size:28px"><span class="texd" data-tex="\\mathcal L(\\theta+\\mathbf d)=\\mathcal L(\\theta)+\\mathbf g^\\top\\mathbf d+\\frac12\\,\\htmlClass{n7-error}{\\mathbf d^\\top\\mathbf H(\\xi)\\mathbf d}"></span></div><p class="n7-small n7-centre-note"><span class="tex" data-tex="\\mathbf H=\\nabla^2\\mathcal L"></span> is the Hessian (second derivatives); ξ lies between θ and θ + d.</p><p class="n7-centre-note">Smoothness bounds the curvature term:</p><div class="eq l7-eq n7-equation" style="font-size:28px"><span class="texd" data-tex="\\htmlClass{n7-error}{\\mathbf d^\\top\\mathbf H(\\xi)\\mathbf d}\\le \\htmlClass{n7-error}{\\beta\\|\\mathbf d\\|^2}"></span></div><div class="eq l7-eq n7-equation" style="font-size:28px"><span class="texd" data-tex="\\mathcal L(\\theta+\\mathbf d)\\le\\mathcal L(\\theta)+\\mathbf g^\\top\\mathbf d+\\frac12\\,\\htmlClass{n7-error}{\\beta\\|\\mathbf d\\|^2}"></span></div><p class="n7-centre-note">This gives an upper bound on the loss after a step.</p>
`},

{s:"Part III", t:"Substitute the gradient-descent step", html:`
<div class="eyebrow">III-B · Descent proof</div><h2>Substitute the gradient-descent step</h2><div class="eq l7-eq n7-equation" style="font-size:26px"><span class="texd" data-tex="\\mathbf g=\\nabla\\mathcal L(\\theta),\\qquad \\htmlClass{n7-input}{\\mathbf d=-\\eta\\mathbf g}"></span></div><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="\\mathcal L(\\theta-\\eta\\mathbf g)\\le\\mathcal L(\\theta)+\\mathbf g^\\top(\\htmlClass{n7-input}{-\\eta\\mathbf g})+\\frac\\beta2\\|\\htmlClass{n7-input}{-\\eta\\mathbf g}\\|^2"></span></div><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="=\\mathcal L(\\theta)\\htmlClass{n7-input}{-\\eta\\|\\mathbf g\\|^2}+\\htmlClass{n7-error}{\\frac{\\beta\\eta^2}{2}\\|\\mathbf g\\|^2}"></span></div><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="=\\mathcal L(\\theta)-\\eta\\left(1-\\frac{\\beta\\eta}{2}\\right)\\|\\mathbf g\\|^2"></span></div><div class="eq l7-eq n7-equation" style="font-size:25px"><span class="texd" data-tex="0&lt;\\eta\\le1/\\beta\\quad\\Longrightarrow\\quad\\mathcal L(\\theta-\\eta\\mathbf g)\\le\\mathcal L(\\theta)-\\frac\\eta2\\|\\mathbf g\\|^2"></span></div><p class="n7-small"><strong>Note:</strong> this argument assumes a smooth loss. ReLU is nondifferentiable at zero, so a ReLU network can violate this assumption.</p>
`},

{s:"Part III", t:"What one gradient step guarantees", html:`
<div class="eyebrow">III-B · Interpret the result</div><h2>What one gradient step guarantees</h2><div class="eq l7-eq n7-equation" style="font-size:34px"><span class="texd" data-tex="\\mathcal L(\\theta_{s+1})\\le\\mathcal L(\\theta_s)-\\htmlClass{n7-input}{\\frac\\eta2\\|\\nabla\\mathcal L(\\theta_s)\\|^2}"></span></div><ul class="flow7-bullets f7-bullets"><li>Assume a <span class="tex" data-tex="\\beta"></span>-smooth loss and <span class="tex" data-tex="0&lt;\\eta\\le1/\\beta"></span>.</li><li>A nonzero gradient gives a decrease in training loss.</li><li>The guaranteed decrease is larger when the gradient is larger.</li><li>As gradients shrink, each step may make less progress.</li></ul>
`},

{s:"Part III", t:"What does convergence mean?", html:`
<div class="eyebrow">III-B · Full gradient descent</div><h2>What does convergence mean?</h2><p class="n7-copy" style="font-size:23px;margin-bottom:16px">We will derive this in <strong>Tutorial 6</strong>.</p><p class="n7-copy" style="font-size:22px">Assume the loss is bounded below by <span class="tex" data-tex="\\mathcal L_{\\inf}"></span>.</p><div class="eq l7-eq n7-equation" style="font-size:31px"><span class="texd" data-tex="\\min_{0\\le s&lt;T}\\|\\nabla\\mathcal L(\\theta_s)\\|^2\\le\\htmlClass{n7-input}{\\frac{2[\\mathcal L(\\theta_0)-\\mathcal L_{\\inf}]}{\\eta T}}"></span></div><ul class="flow7-bullets f7-bullets" style="margin-top:20px"><li style="font-size:24px;margin-bottom:18px">The smallest squared gradient norm seen so far has an <span class="tex" data-tex="O(1/T)"></span> upper bound.</li><li style="font-size:24px;margin-bottom:0"><strong>Note:</strong> this guarantees an iterate with a small gradient. A global minimum is not guaranteed.</li></ul><p class="n7-copy" style="font-size:23px;margin-top:26px"><strong>Extension:</strong> under additional assumptions, the parameters converge to a single stationary point. The proof is beyond this lecture.</p><!-- Instructor note: One sufficient extension adds bounded iterates and the Kurdyka–Łojasiewicz property to the stated smoothness, lower-bound and step-size assumptions; see Attouch, Bolte and Svaiter, Theorem 3.2, https://bolte.perso.math.cnrs.fr/MPA.pdf. The displayed running-minimum bound alone does not show that every gradient tends to zero. The preceding summed inequality in the notes gives the stronger result: nonnegative squared gradients have bounded partial sums, hence each tends to zero. Convergence of parameter vectors does not follow from this argument alone. Stationary points include minima, maxima and saddles. -->
`},

{s:"Part III", t:"Stochastic gradient descent", html:`
<div class="eyebrow">III-B · Learning algorithms</div><h2>Stochastic gradient descent</h2><div style="width:900px;margin-left:auto;margin-right:auto"><p style="font-size:23px;max-width:none;line-height:1.45;margin:0 0 22px">Choose initial parameters <span class="tex" data-tex="\\theta_0"></span>, step size <span class="tex" data-tex="\\eta&gt;0"></span>, and <span class="tex" data-tex="T"></span> updates.</p><div style="padding:24px 36px;background:var(--bg-alt);font:24px/1.4 var(--font-sans);box-sizing:border-box"><div style="margin-bottom:12px"><strong>for</strong> <span class="tex" data-tex="s=0,\\ldots,T-1"></span>:</div><div style="padding-left:32px;font-size:22px;line-height:1.4;height:44px;color:var(--ink-soft)">Sample <span class="tex" data-tex="n_s\\sim\\operatorname{Uniform}\\{1,\\ldots,N\\}"></span> independently at each step.</div><div style="font-size:30px;padding-left:32px;height:70px;display:flex;align-items:center"><span class="tex" data-tex="\\displaystyle \\mathbf g_s\\leftarrow\\nabla_\\theta\\ell_{n_s}(\\theta_s)"></span></div><div style="padding-left:32px;margin-top:18px;font-size:27px"><span class="tex" data-tex="\\theta_{s+1}\\leftarrow\\theta_s-\\eta\\mathbf g_s"></span></div><div style="margin-top:20px"><strong>return</strong> <span class="tex" data-tex="\\theta_T"></span></div></div><p style="font-size:21px;line-height:1.45;max-width:none;margin:23px 0 0">A minibatch averages several sampled gradients before the update.</p></div>
`},

{s:"Part III", t:"SGD can keep fluctuating near the minimum", draw:"noiseball7", html:`
<div class="eyebrow">III-B · A concrete example</div><h2>SGD can keep fluctuating near the minimum</h2><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="\\mathcal L(\\theta)=\\tfrac12\\theta^2"></span></div><div class="g7-split"><svg id="noiseball7" viewBox="0 0 620 300" role="img" aria-label="Parameter trajectories: full gradient descent settles at zero, while fixed-step SGD fluctuates near zero."></svg><div><div class="g7-control"><label for="noiseball7eta">Step size η: <output id="noiseball7etav">0.25</output></label><input id="noiseball7eta" type="range" min="0.05" max="0.9" step="0.05" value="0.25"></div><div class="g7-control"><label for="noiseball7batch">Batch size B: <output id="noiseball7batchv">1</output></label><input id="noiseball7batch" type="range" min="1" max="32" value="1"></div><p class="n7-small">Blue: full GD<br><span class="n7-error">Red: SGD</span></p><p class="n7-small">Shaded band: ± one long-run standard deviation.</p></div></div><p class="n7-centre-note">Full GD settles at the minimum. Fixed-step SGD keeps fluctuating.</p><!-- Instructor note: Independent Rademacher noise epsilon = ±1/sqrt(B). The stationary variance of theta(s+1)=(1-eta)theta(s)-eta epsilon(s) is eta/[B(2-eta)], for 0<eta<2. The shaded band is a standard deviation, not a hard bound. -->
`},

{s:"Part III", t:"Why the sampled gradient is unbiased", html:`
<div class="eyebrow">III-B · The unbiased-gradient proof</div><h2>Why the sampled gradient is unbiased</h2><div style="width:100%"><p class="n7-copy" style="font-size:23px;margin:0 0 23px">Fix <span class="tex" data-tex="\\theta_s"></span>. Sample each of the <span class="tex" data-tex="N"></span> training examples with probability <span class="tex" data-tex="1/N"></span>.</p><div style="display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:start"><div><div style="margin-bottom:20px"><div style="font:21px/1.35 var(--font-sans)"><strong style="color:var(--s1);margin-right:9px">1.</strong>Average over the possible sampled examples.</div><div class="eq n7-equation" style="font-size:25px;margin:10px 0 0"><span class="texd" data-tex="\\mathbb E[\\mathbf g_s\\mid\\theta_s]=\\sum_{n=1}^{N}\\frac1N\\nabla\\ell_n(\\theta_s)"></span></div></div><div style="margin-bottom:20px"><div style="font:21px/1.35 var(--font-sans)"><strong style="color:var(--s1);margin-right:9px">2.</strong>Move the gradient outside the finite sum.</div><div class="eq n7-equation" style="font-size:25px;margin:10px 0 0"><span class="texd" data-tex="=\\nabla\\!\\left[\\frac1N\\sum_{n=1}^{N}\\ell_n(\\theta_s)\\right]"></span></div></div><div style="margin-bottom:20px"><div style="font:21px/1.35 var(--font-sans)"><strong style="color:var(--s1);margin-right:9px">3.</strong>Recognise the average training loss.</div><div class="eq n7-equation" style="font-size:25px;margin:10px 0 0"><span class="texd" data-tex="\\mathbb E[\\mathbf g_s\\mid\\theta_s]=\\htmlClass{n7-input}{\\nabla\\mathcal L(\\theta_s)}"></span></div></div></div><figure style="margin:0;padding-top:1px"><svg viewBox="0 0 410 285" role="img" aria-label="Static histogram for a scalar sampled gradient: values minus 2, minus 1, 1 and 4 each have probability one quarter. A green line marks the mean and full gradient, 0.5." style="width:100%;display:block;font-family:var(--font-sans);fill:var(--ink)"><text x="58" y="25" font-size="19">Probability</text><path d="M58 45V220H396" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/><path d="M53 75H58 M53 220H58" fill="none" stroke="var(--ink-soft)" stroke-width="1.5"/><text x="46" y="81" text-anchor="end" font-size="18">0.25</text><text x="46" y="226" text-anchor="end" font-size="18">0</text><rect x="85.25" y="75" width="30" height="145" fill="var(--s1)" fill-opacity=".75"/><path d="M100.25 220v5" stroke="var(--ink-soft)"/><text x="100.25" y="246" text-anchor="middle" font-size="20">−2</text><rect x="127.50" y="75" width="30" height="145" fill="var(--s1)" fill-opacity=".75"/><path d="M142.50 220v5" stroke="var(--ink-soft)"/><text x="142.50" y="246" text-anchor="middle" font-size="20">−1</text><rect x="212.00" y="75" width="30" height="145" fill="var(--s1)" fill-opacity=".75"/><path d="M227.00 220v5" stroke="var(--ink-soft)"/><text x="227.00" y="246" text-anchor="middle" font-size="20">1</text><rect x="338.75" y="75" width="30" height="145" fill="var(--s1)" fill-opacity=".75"/><path d="M353.75 220v5" stroke="var(--ink-soft)"/><text x="353.75" y="246" text-anchor="middle" font-size="20">4</text><path d="M205.88 49V226" stroke="var(--s4)" stroke-width="3" stroke-dasharray="6 4"/><text x="226" y="278" text-anchor="middle" font-size="20">Sampled gradient</text></svg><p style="font:20px/1.35 var(--font-sans);text-align:center;color:var(--s4);margin:8px 0 0;max-width:none">Mean = full gradient = 0.5</p></figure></div></div>
`},

{s:"Part III", t:"Why SGD fluctuates", draw:"sgd7", html:`
<div class="eyebrow">III-B · Live SGD example</div>

{s:"Part III", t:"When does SGD decrease the loss on average?", html:`
<div class="eyebrow">III-B · Expected descent</div><h2>When does SGD decrease the loss on average?</h2><p class="n7-copy" style="font-size:24px">Assume a <span class="tex" data-tex="\\beta"></span>-smooth loss, <span class="tex" data-tex="0&lt;\\eta\\le1/\\beta"></span>, and per-example noise variance <span class="tex" data-tex="\\le v^2"></span> at every step.<br>Average <span class="tex" data-tex="B"></span> independent samples.</p><div class="eq l7-eq n7-equation" style="font-size:27px"><span class="texd" data-tex="\\mathbb E[\\mathcal L(\\theta_{s+1})\\mid\\theta_s]\\le\\mathcal L(\\theta_s)\\underbrace{\\htmlClass{n7-input}{-\\frac\\eta2\\|\\nabla\\mathcal L(\\theta_s)\\|^2}}_{\\text{progress}}+\\underbrace{\\htmlClass{n7-error}{\\frac{\\beta\\eta^2v^2}{2B}}}_{\\text{noise}}"></span></div><ul class="flow7-bullets f7-bullets"><li>Far from stationarity, the gradient can dominate the noise.</li><li>Near stationarity, noise can dominate the remaining progress.</li><li>A particular SGD step can increase the training loss.</li></ul><p class="flow7-note"><strong>Tutorial 6:</strong> derive this result as an optional exercise.</p><!-- Instructor note: Conditional unbiasedness removes the gradient–noise cross term. E||g_s||² = ||gradient||² + E||epsilon_s||². Substituting this into the smoothness inequality and using eta <= 1/beta gives the displayed bound. -->
`},

{s:"Part III", t:"SGD convergence with a fixed step size", html:`
<div class="eyebrow">III-B · Interpret the result</div><h2>SGD convergence with a fixed step size</h2><div class="eq l7-eq n7-equation" style="font-size:32px"><span class="texd" data-tex="\\min_{0\\le s&lt;T}\\mathbb E\\|\\nabla\\mathcal L(\\theta_s)\\|^2\\le\\underbrace{\\htmlClass{n7-input}{\\frac{2[\\mathcal L(\\theta_0)-\\mathcal L_{\\inf}]}{\\eta T}}}_{\\text{shrinks with time}}+\\underbrace{\\htmlClass{n7-error}{\\frac{\\beta\\eta v^2}{B}}}_{\\text{noise floor}}"></span></div><ul class="flow7-bullets f7-bullets"><li><strong>More iterations:</strong> reduce the first term.</li><li><strong>Fixed step size:</strong> leaves a nonzero noise term.</li><li><strong>Smaller steps or larger batches:</strong> lower the noise term.</li><li>The guarantee concerns expected squared gradient size.</li></ul><p class="n7-small">The “noise ball” is a picture near a minimum; this bound does not specify a distance from the optimum.</p>
`},

{s:"Part III", t:"Training loss and test loss differ", draw:"lossgap7", html:`
<div class="eyebrow">III-C · Generalisation</div><h2>Training loss and test loss differ</h2><svg id="lossgap7" viewBox="0 0 1040 360" role="img" aria-label="Schematic training and test losses. A narrow deep training minimum has high test loss; a broader basin has lower test loss."></svg><div class="g7-buttons"><button class="bbtn" id="lossgap7narrow" type="button">Narrow training minimum</button><button class="bbtn" id="lossgap7broad" type="button">Broad basin</button></div><p class="n7-copy" id="lossgap7message" aria-live="polite"></p><p class="n7-small">Schematic example. Width alone does not determine generalisation.</p>
`},

{s:"Part III", t:"Machine Learning ≠ Optimization", html:`
<div class="eyebrow">III-C · The goal is generalisation</div><h2>Machine Learning ≠ Optimization</h2><div class="flow7-numbered"><div class="flow7-no">1</div><div><strong>Optimisation:</strong> minimise the objective we are given.</div><div class="flow7-no">2</div><div><strong>Machine learning:</strong> predict well on new data.</div><div class="flow7-no">3</div><div><strong>Training loss:</strong> a data-based proxy for the population loss.</div></div><div class="eq l7-eq n7-equation" style="font-size:29px"><span class="texd" data-tex="\\underbrace{\\frac1N\\sum_{n=1}^N\\ell(f_\\theta(\\mathbf x_n),t_n)}_{\\text{training objective}}\\qquad\\neq\\qquad\\underbrace{\\mathbb E_{(\\mathbf x,t)\\sim P}[\\ell(f_\\theta(\\mathbf x),t)]}_{\\text{population objective}}"></span></div><p class="flow7-note">Driving training loss down as far as possible can hurt generalisation.</p>
`},

{s:"Part III", t:"Optimisation can act as regularisation", html:`
<div class="eyebrow">III-C · Which model do we learn?</div><h2>Optimisation can act as regularisation</h2><p class="n7-copy">Many parameter settings may fit the training data. The training process helps select one.</p><ul class="flow7-bullets f7-bullets"><li><strong>Early stopping:</strong> limits how far we fit the training data.</li><li><strong>Initialisation and optimiser:</strong> influence which solution we reach.</li><li><strong>Step size and sampling noise:</strong> change the path through parameter space.</li></ul><p class="flow7-note">This is an implicit bias of the learning process. It can affect generalisation.</p><p class="cred" style="font-size:17px;margin-top:24px">A precise example: gradient descent selects the max-margin direction for separable linear logistic regression. <a href="https://jmlr.org/papers/v19/18-188.html" target="_blank" rel="noopener">Soudry et al. (2018)</a>.</p><!-- Instructor note: There is no general guarantee that a flatter parameter-space minimum has lower test loss. Reparameterisation can change sharpness without changing predictions; see Dinh et al., 2017, https://arxiv.org/abs/1703.04933. -->
`},

{s:"Part IV", t:"What we have learnt", html:`
<div class="eyebrow">Return to the learning objectives</div><h2>What we have learnt</h2>
<div class="flow7-body"><div class="flow7-numbered">
<div class="flow7-no">1</div><div><strong>Learned features:</strong> compose parameterised functions to compute representations.</div>

const PY_KW=/\b(def|return|for|in|import|from|as|if|else|elif|None|True|False|lambda|while|not|and|or)\b/g;

    h=h.replace(/"[^"]*"|'[^']*'/g, function(m){ return keep('<span class="tok-str">'+m+'</span>'); });
    h=h.replace(PY_KW,'<span class="tok-kw">$1</span>');

function lin5(a,b,n){const o=[];for(let i=0;i<n;i++)o.push(a+(b-a)*i/(n-1));return o;}

function gauss5(r){ return Math.sqrt(-2*Math.log(1-r()))*Math.cos(2*Math.PI*r()); }
const NPDF5=(x,m,v)=>Math.exp(-(x-m)*(x-m)/(2*v))/Math.sqrt(2*Math.PI*v);
